  momento:function(){go({v:"momento"});},
  concluirMomento:function(){var s=hoje();var r=S.momento[s]||{};r.feito=true;var ta=document.getElementById("momentoNota");if(ta)r.nota=ta.value;S.momento[s]=r;save();toast("Momento de hoy guardado. ¡Dios te bendiga!");back();},
  filtro:function(e){UI.filtro=e.dataset.f;render();},
  plano:function(e){go({v:"plano",id:e.dataset.id});},
  dia:function(e){go({v:"dia",id:e.dataset.id,i:+e.dataset.i});},
  trocaDia:function(e){UI.stack[UI.stack.length-1]={v:"dia",id:e.dataset.id,i:+e.dataset.i};render(true);},
  participar:function(e){var d=null;DESTAQUES.forEach(function(x){if(x.id===e.dataset.id)d=x;});S.planos[e.dataset.id]={inicio:d?d.ini:hoje(),feitos:[],notas:{}};save();toast("¡Perfecto! Ese día, el primer paso aparecerá aquí.");render();},
  comecarDest:function(e){var id=e.dataset.id;if(!S.planos[id])S.planos[id]={inicio:hoje(),feitos:[],notas:{}};save();go({v:"dia",id:id,i:+e.dataset.i});},
  comecarPlano:function(e){var id=e.dataset.id;S.planos[id]={inicio:hoje(),feitos:[],notas:{}};save();go({v:"dia",id:id,i:0});},
  concluirDia:function(e){var id=e.dataset.id,i=+e.dataset.i,p=plano(id);var g=S.planos[id]||(S.planos[id]={inicio:hoje(),feitos:[],notas:{}});if(g.feitos.indexOf(i)<0)g.feitos.push(i);save();
    if(g.feitos.length>=p.d.length){toast("¡Felicidades! Terminaste el plan completo.");}else toast("¡Día "+(i+1)+" terminado!");
    back();if(cur().v!=="plano")go({v:"plano",id:id});},
  desmarcarDia:function(e){var g=S.planos[e.dataset.id];if(g){g.feitos=g.feitos.filter(function(x){return x!==+e.dataset.i;});save();render();}},
  recomecar:function(e){var g=S.planos[e.dataset.id];if(g){g.feitos=[];g.inicio=hoje();save();}UI.confirma=null;toast("Plan reiniciado desde el día 1.");render();},
  pedeConfirma:function(e){UI.confirma=e.dataset.c;render();},
  naoConfirma:function(){UI.confirma=null;render();},
  terco:function(){go({v:"terco"});},
  tercoSet:function(e){S.terco.set=e.dataset.k;save();render();},
  tercoNext:function(){if(S.terco.i<PT.length-1)S.terco.i++;save();render();},
  tercoVolta:function(){if(S.terco.i>0)S.terco.i--;save();render();},
  tercoFim:function(){S.terco.i=0;save();toast("Rosario rezado. ¡Que la Virgen María te acompañe!");back();},
  novenas:function(){go({v:"novenas"});},
  novenaNova:function(e){go({v:"novenaNova",id:e.dataset.id});},
  novena:function(e){go({v:"novena",uid:e.dataset.uid});},
  comecarNovena:function(e){var n={uid:uid(),id:e.dataset.id,intencao:(document.getElementById("novIntencao")||{}).value||"",inicio:hoje(),feitos:[]};S.novenas.push(n);save();UI.stack.pop();go({v:"novena",uid:n.uid});},
  rezeiNovena:function(e){var n=S.novenas.filter(function(x){return x.uid===e.dataset.uid;})[0];if(!n)return;if(n.feitos.length<9)n.feitos.push(hoje());save();toast(n.feitos.length>=9?"¡Novena terminada! Qué hermoso.":"Día "+n.feitos.length+" rezado. ¡Hasta mañana!");render(true);},
  removeNovena:function(e){S.novenas=S.novenas.filter(function(x){return x.uid!==e.dataset.uid;});save();UI.confirma=null;back();},
  pedidos:function(){go({v:"pedidos"});},
  pedTab:function(e){UI.pedTab=e.dataset.t;UI.confirma=null;render();},
  addPedido:function(){var t=document.getElementById("pedTxt").value.trim(),pa=document.getElementById("pedPara").value.trim();if(!t&&!pa){toast("Primero escribe tu petición.");return;}S.pedidos.push({id:uid(),para:pa,texto:t,data:hoje(),graca:null});save();toast("Petición guardada. ¡Estamos rezando!");render();},
  graca:function(e){var p=S.pedidos.filter(function(x){return x.id===e.dataset.id;})[0];if(p){p.graca={data:hoje(),nota:(document.getElementById("gracaNota")||{}).value||""};save();}UI.confirma=null;toast("Gracia guardada. ¡Gracias, Señor!");render();},
  apagaPedido:function(e){S.pedidos=S.pedidos.filter(function(x){return x.id!==e.dataset.id;});save();UI.confirma=null;render();},
  oracao:function(e){go({v:"oracao",id:e.dataset.id});},
  kid:function(e){var s=hoje(),l=S.kids[s]||(S.kids[s]=[]),id=e.dataset.id,i=l.indexOf(id);if(i<0){l.push(id);if(l.length===ROTINA_KIDS.length)toast("¡Día completo de estrellitas!");}else l.splice(i,1);save();render();},
  historia:function(e){go({v:"historia",id:e.dataset.id});},
  mes:function(e){var y=+UI.calMes.slice(0,4),m=+UI.calMes.slice(5,7)-1+(+e.dataset.d);var d=new Date(y,m,1);var k=d.getFullYear()+"-"+pad(d.getMonth()+1);if(k<CAL_MIN||k>CAL_MAX)return;UI.calMes=k;UI.calSel=k===hoje().slice(0,7)?hoje():k+"-01";render();},
  calDia:function(e){UI.calSel=e.dataset.k;render();},
  baixarCopia:function(){var txt=JSON.stringify({app:"meu-lar-catolico",v:1,salvo:new Date().toISOString(),dados:S});
    try{var b=new Blob([txt],{type:"application/json"});var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download="mi-ano-con-dios-respaldo-"+hoje()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);toast("Respaldo guardado en tus descargas.");}catch(err){toast("No se pudo guardar aquí. Usa “Copiar respaldo”.");}},
  copiarCopia:function(){var txt=JSON.stringify({app:"meu-lar-catolico",v:1,salvo:new Date().toISOString(),dados:S});
    var ok=function(){toast("Respaldo copiado. Pégalo en un correo o una nota para guardarlo.");};
    var falha=function(){var ta=document.getElementById("restTxt");ta.value=txt;ta.select();toast("Seleccioné el respaldo en el campo de abajo: cópialo y guárdalo.");};
    try{navigator.clipboard.writeText(txt).then(ok,falha);}catch(err){falha();}},
  restaurar:function(){var t=document.getElementById("restTxt").value.trim();if(!t){toast("Elige el archivo o pega el texto del respaldo.");return;}restaurar(t);},
  pulaData:function(e){S.dataTeste=e.dataset.k||null;save();UI.calMes=null;UI.calSel=null;toast(S.dataTeste?"Viendo la app el "+dataCurta(S.dataTeste):"De vuelta a hoy");setTab("hoje");}
};
function restaurar(t){try{var o=JSON.parse(t);var d=o.dados||o;if(!d||typeof d!=="object"||!("planos" in d))throw 0;var b=base();for(var k in d)b[k]=d[k];S=b;save();toast("¡Respaldo restaurado con éxito!");setTab("hoje");}catch(err){toast("No se reconoció este respaldo. Revisa el texto.");}}

var tmr={};
function onInput(e){var el=e.target,k=el.dataset.in;if(!k)return;
  if((k==="dataTeste"||k==="restArq")&&e.type!=="change")return;
  if(k==="momento"){var s=hoje();var r=S.momento[s]||(S.momento[s]={});r.nota=el.value;}
  else if(k==="planoDiario"){var g2=S.planos[el.dataset.id]||(S.planos[el.dataset.id]={inicio:hoje(),feitos:[],notas:{}});g2.diario=g2.diario||{};g2.diario[el.dataset.i]=el.value;}
  else if(k==="planoNota"){var g=S.planos[el.dataset.id]||(S.planos[el.dataset.id]={inicio:hoje(),feitos:[],notas:{}});g.notas=g.notas||{};g.notas[el.dataset.i]=el.value;}
  else if(k==="novInt"){var n=S.novenas.filter(function(x){return x.uid===el.dataset.uid;})[0];if(n)n.intencao=el.value;}
  else if(k==="nome"){S.nome=el.value.trim();}
  else if(k==="lembHora"){S.lembHora=el.value;}
  else if(k==="dataTeste"){if(el.value){S.dataTeste=el.value;save();UI.calMes=null;UI.calSel=null;toast("Viendo la app el "+dataCurta(el.value));}return;}
  else if(k==="restArq"){var f=el.files&&el.files[0];if(f){var rd=new FileReader();rd.onload=function(){restaurar(String(rd.result));};rd.readAsText(f);}return;}
  clearTimeout(tmr.s);tmr.s=setTimeout(save,300);
}

function init(){
  app=document.getElementById("app");nav=document.getElementById("nav");toastEl=document.getElementById("toast");
  document.addEventListener("click",function(e){var el=e.target.closest("[data-a]");if(!el||el.disabled)return;var f=A[el.dataset.a];if(f){e.preventDefault();f(el);}});
  document.addEventListener("input",onInput);document.addEventListener("change",function(e){if(e.target.dataset.in==="restArq"||e.target.dataset.in==="dataTeste")onInput(e);});
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();instalaEvt=e;if(cur().v==="tutorial")render();});
  window.addEventListener("appinstalled",function(){S.tutOk=true;save();});
  render(true);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
