med:["Cuidar la salud de tu esposo también es amarlo: en el cuerpo, en la mente y en el alma. Muchos hombres cargan cansancio, preocupaciones y dolores en silencio, porque aprendieron que no pueden mostrarse débiles.","Tu oración es el primer cuidado. Pero el amor también se nota en gestos sencillos: insistir con cariño en que se haga ese chequeo, preparar una comida que le haga bien, dejarlo descansar."],
perg:"¿Qué cansancio, dolor o preocupación ha cargado mi esposo en silencio?",
des:"Esta noche, pon tu mano sobre el hombro o la cabeza de tu esposo (aunque esté dormido) y reza por la salud de su cuerpo, de su mente y de su alma. Si tiene pendiente un estudio o una consulta médica, ofrécete a ayudarlo a agendarla.",
ora:"Señor Jesús, médico de las almas y de los cuerpos, cuida la salud de mi esposo. Dale fuerza, descanso y paz. Amén."},

{t:"El trabajo de cada día",ref:"Sal 90, 12-17",v:"Que descienda hasta nosotros la bondad del Señor; que el Señor, nuestro Dios, haga prosperar la obra de nuestras manos.",
exp:"El salmista reconoce que la vida es corta y le pide a Dios sabiduría para contar bien los días. Al final hace una petición hermosa: que Dios bendiga y confirme el trabajo de nuestras manos, para que tenga sentido y perdure.",
med:["El trabajo es parte de la vocación de cada uno. Muchas veces tu esposo enfrenta presiones, jefes difíciles, miedo a perder el empleo o a que no alcance para pagar las cuentas. No siempre lo cuenta.","Rezar por su trabajo es sostener la casa de rodillas. Y valorar su esfuerzo con una palabra de reconocimiento renueva las fuerzas de cualquier hombre."],
perg:"¿Qué sé de las preocupaciones de mi esposo en el trabajo? ¿Le he preguntado cómo está?",
des:"Mándale un mensaje a tu esposo a mitad del día para decirle que estás rezando por él y por su trabajo. En la noche, agradécele el esfuerzo que hace por la familia.",
ora:"Señor, bendice el trabajo de mi esposo. Dale sabiduría, paz en sus decisiones y frutos de su esfuerzo. Confirma la obra de sus manos. Amén."},

{t:"La fe de mi esposo",ref:"Ef 3, 14-21",v:"Que Cristo habite en sus corazones por la fe, y sean arraigados y edificados en el amor.",
exp:"San Pablo se arrodilla ante el Padre y ora por la comunidad: que sean fortalecidos por el Espíritu, que Cristo habite en sus corazones y que conozcan el amor de Cristo, que supera todo conocimiento. Termina alabando a Dios, que puede hacer mucho más de lo que pedimos o imaginamos.",
med:["Cada persona tiene su tiempo y su camino con Dios. Tal vez tu esposo rece más que tú; tal vez todavía esté lejos. Tu misión no es exigir ni predicar: es rezar y amar.","Santa Mónica rezó durante años por la conversión de su esposo y de su hijo, San Agustín. La oración paciente de una esposa prepara el terreno con amor, y Dios puede hacer mucho más de lo que imaginamos."],
perg:"¿Cómo está hoy la fe de mi esposo? ¿Qué puedo pedirle a Dios por él, sin presionarlo?",
des:"Reza hoy por él la oración de San Pablo (Ef 3,14-21), poniendo su nombre en lugar de «ustedes». Si él acepta, invítalo con suavidad a ir juntos a Misa el próximo domingo.",
ora:"Señor, que Cristo habite en el corazón de mi esposo. Arráigalo en tu amor y haz mucho más de lo que yo sé pedir. Santa Mónica, ruega por nosotros. Amén."},

{t:"Protección en las tentaciones",ref:"Mt 26, 36-41",v:"Estén prevenidos y oren para no caer en tentación, porque el espíritu está dispuesto, pero la carne es débil.",
exp:"En Getsemaní, antes de su Pasión, Jesús va a orar y les pide a Pedro, Santiago y Juan que se queden con él. Ora lleno de angustia, pero al volver encuentra a los discípulos dormidos. Entonces les pide que velen y oren, porque todos somos débiles.",
med:["Todos somos frágiles. Hay tentaciones que rondan cualquier matrimonio: la indiferencia, la pornografía, las adicciones, las comparaciones, la amistad que va demasiado lejos. Nadie está a salvo, ni él ni tú.","La oración de la esposa es un escudo para su esposo. Y la pareja también se protege con decisiones: transparencia, tiempo juntos, cuidado con lo que entra por el celular y por la televisión."],
perg:"¿Qué tentación o peligro amenaza más nuestro matrimonio hoy? ¿Y a mí?",
des:"Reza hoy la oración a San Miguel Arcángel por tu esposo y por tu matrimonio. Si hace falta, elige una medida concreta de protección para ti (una aplicación, una conversación, un hábito).",
ora:"San Miguel Arcángel, defiende nuestro matrimonio en la lucha. Señor, protégenos a mi esposo y a mí de toda tentación y de todo mal. Amén."},

{t:"Una sola carne",ref:"Mc 10, 6-9",v:"De manera que ya no son dos, sino una sola carne. Que el hombre no separe lo que Dios ha unido.",
exp:"Los fariseos le preguntan a Jesús si al hombre le está permitido divorciarse de su mujer. Jesús vuelve al principio de la creación: Dios hizo al hombre y a la mujer, y los dos llegan a ser una sola carne. El matrimonio no es un contrato que se deshace cuando uno se cansa: es una unión hecha por Dios.",
med:["Ser uno no es pensar igual en todo ni tener los mismos gustos. Es caminar en la misma dirección, aun con maneras distintas de ser. Es decir «nosotros» más que «yo».","La unidad se construye con pequeños «nosotros»: «vamos a resolverlo juntos», «nuestra familia», «nuestro dinero», «nuestro sueño». Cada vez que decimos «nosotros», damos una puntada más en la costura de Dios."],
perg:"¿En qué área de nuestro matrimonio estamos viviendo más como «dos» que como «uno»?",
des:"Hoy proponle a tu esposo hacer juntos algo que normalmente cada uno hace por su lado: ordenar la cocina, hacer las compras, llevar a los hijos, salir a caminar. Al final, agradécele su compañía.",
ora:"Señor, que nadie separe lo que tú uniste. Haz de nosotros una sola carne, un solo corazón, una sola dirección. Amén."},

{t:"Honrarse el uno al otro",ref:"Rom 12, 9-13",v:"Amense cordialmente con amor fraterno, estimando a los otros como más dignos.",
exp:"San Pablo describe cómo es el amor verdadero: sin fingimiento, que detesta el mal y se aferra al bien. Y da un consejo sorprendente: competir para ver quién honra más al otro. Estar alegres en la esperanza, ser pacientes en la tribulación y perseverantes en la oración.",
med:["Honrar es valorar al otro en público y en privado. Un elogio a tu esposo delante de los hijos vale oro, y una crítica delante de ellos hiere profundamente.","Muchos hombres se sienten poco admirados en su propia casa. Cuando la esposa reconoce su valor, él crece. La honra es como el agua para una planta: hace florecer lo mejor que hay en él."],
perg:"¿Cómo he hablado de mi esposo con los hijos, con la familia y con mis amigas?",
des:"Hoy elogia a tu esposo delante de los hijos o de alguien de la familia, por algo concreto. Y si sueles quejarte de él con alguien, decide no hacerlo esta semana.",
ora:"Señor, enséñame a honrar a mi esposo con mis palabras y mis actitudes. Que nuestra casa sea un lugar de respeto y admiración. Amén."},

{t:"Tiempo de reír",ref:"Ecl 3, 1-8",v:"un tiempo para llorar y un tiempo para reír, un tiempo para lamentarse y un tiempo para bailar…",
exp:"Qohélet escribe un poema famoso: todo tiene su tiempo bajo el cielo. Tiempo de plantar y de cosechar, de llorar y de reír, de callar y de hablar. La vida tiene estaciones, y cada una tiene su valor.",
med:["Los matrimonios también necesitan risas. Cuando la rutina pesa, las conversaciones se reducen a cuentas, problemas y pendientes. La ligereza protege el amor y les recuerda por qué se eligieron.","El libro de los Proverbios dice que un corazón alegre es buena medicina (Prov 17,22). Que hoy sea un tiempo de reír, aunque la estación sea difícil."],
perg:"¿Cuándo fue la última vez que mi esposo y yo nos reímos juntos de verdad?",
des:"Recuerden juntos una historia graciosa del noviazgo o de los primeros tiempos de casados. O vean fotos antiguas. Si puedes, prepara una sorpresa sencilla: su comida favorita, una película de comedia.",
ora:"Señor, devuélvele la alegría a nuestra casa. Que sepamos reír juntos, incluso en los días difíciles. Amén."},

{t:"Las finanzas de la casa",ref:"Mt 6, 25-34",v:"Busquen primero el Reino y su justicia, y todo lo demás se les dará por añadidura.",
exp:"En el Sermón de la Montaña, Jesús habla de la angustia por la comida, la bebida y la ropa. Señala los pájaros y los lirios del campo: el Padre los cuida. Y concluye: no se angustien por el mañana; busquen primero el Reino, y lo demás vendrá por añadidura.",
med:["El dinero es uno de los mayores motivos de pelea en el matrimonio: deudas escondidas, maneras distintas de gastar, miedo al futuro. Jesús no pide irresponsabilidad; pide confianza y las prioridades correctas.","Cuando la pareja pone sus finanzas delante de Dios y habla con transparencia, el dinero deja de ser motivo de pelea y se vuelve motivo de unión y de generosidad."],
perg:"¿Cómo hablamos mi esposo y yo de dinero? ¿Hay algo que escondo o que me angustia?",
des:"Proponle a tu esposo una conversación tranquila sobre las finanzas de la casa, sin acusaciones, empezando con una oración. Si todavía no es posible tener esa conversación, escribe tus preocupaciones y entrégaselas a Dios.",
ora:"Padre, tú cuidas de los pájaros y de los lirios. Cuida también de nuestra casa. Danos sabiduría, transparencia y confianza en ti. Amén."},

{t:"Cariño e intimidad",ref:"Cant 8, 6-7",v:"Las aguas torrenciales no pueden apagar el amor, ni los ríos anegarlo.",
exp:"El Cantar de los Cantares es un poema de amor entre un novio y una novia. La Iglesia ve en él también el amor de Dios por su pueblo. Al final, la amada le pide al amado que la lleve como un sello sobre su corazón, porque el amor es fuerte como la muerte.",
med:["El cariño es un lenguaje de Dios dentro del matrimonio. La intimidad de la pareja, en todas sus formas, es sagrada y fue bendecida por él. No es algo de menor valor en la vida de fe.","Con los hijos, las cuentas y el cansancio, las caricias se van perdiendo. Pequeños gestos mantienen viva la llama: un abrazo largo, tomarse de la mano, un beso de verdad al despedirse. Las muchas aguas del día a día no tienen por qué apagar el amor."],
perg:"¿Qué gestos de cariño han ido desapareciendo de nuestra rutina?",
des:"Hoy dale a tu esposo un abrazo largo, de por lo menos 20 segundos, sin ningún motivo especial. Despídelo y recíbelo con un beso de verdad.",
ora:"Señor, tú bendijiste el amor entre el hombre y la mujer. Vuelve a encender el cariño y la ternura entre nosotros. Ponnos como un sello en el corazón el uno del otro. Amén."},

{t:"Decidir juntos",ref:"Flp 2, 1-5",v:"Tengan un mismo amor, un mismo corazón, un mismo pensamiento.",
exp:"San Pablo le pide a la comunidad que viva en unidad: que nadie actúe por rivalidad o vanidad, y que cada uno no busque solo su propio interés, sino también el de los demás. Y da el modelo: tener los mismos sentimientos de Cristo Jesús.",
med:["Decidir juntos cuesta trabajo, pide diálogo y a veces ceder. Pero construye confianza. Cuando uno decide siempre solo, el otro se siente excluido, y cuando todo se impone, nace la rivalidad.","Tener los sentimientos de Cristo es buscar lo que es bueno para los dos, no ganar la discusión."],
perg:"¿Qué decisión importante está pendiente entre nosotros? ¿He escuchado lo que él piensa?",
des:"Elijan juntos algo sencillo para decidir hoy (el menú del fin de semana, un paseo, una compra). Antes de dar tu opinión, pregúntale la suya y escúchala.",
ora:"Señor, danos un mismo sentir y un mismo pensamiento. Que tomemos nuestras decisiones juntos, contigo en medio. Amén."},

{t:"El papá de mis hijos",ref:"Sal 103, 8-14",v:"Como un padre cariñoso con sus hijos, así es cariñoso el Señor con sus fieles…",
exp:"El salmo canta la bondad de Dios: es clemente y compasivo, lento para el enojo y rico en amor. No nos trata según nuestros pecados. Y compara su amor con el de un padre que siente ternura por sus hijos, porque sabe de qué barro estamos hechos.",
med:["Tu esposo también está aprendiendo a ser papá, muchas veces sin haber tenido un buen ejemplo. Se equivoca, como tú te equivocas como mamá. Dios los mira a los dos con compasión.","Cuando la mamá apoya al papá delante de los hijos, su autoridad crece y los niños se sienten seguros. Y cuando rezas por él como papá, Dios lo forma en el amor paterno. Si todavía no tienen hijos, reza por el papá que él será."],
perg:"¿Cómo he apoyado a mi esposo como papá? ¿Lo corrijo delante de los niños?",
des:"Hoy dile a tu esposo algo que admiras de él como papá (o que vas a admirar). Pídeles a los hijos que le hagan una notita o un dibujo.",
ora:"Padre del cielo, enséñale a mi esposo a ser padre como tú: firme, paciente y lleno de amor. Bendice su relación con nuestros hijos. Amén."},

{t:"Revestidas de humildad",ref:"1 Pe 5, 5-7",v:"Que cada uno se revista de sentimientos de humildad para con los demás … Descarguen en él todas sus inquietudes, ya que él se ocupa de ustedes.",
exp:"San Pedro les pide a los cristianos que se revistan de humildad, porque Dios resiste a los soberbios y da su gracia a los humildes. Quien se humilla bajo la mano de Dios será enaltecido a su tiempo. Y termina con un consuelo: entréguenle sus preocupaciones, porque él cuida de ustedes.",
med:["Querer tener siempre la razón cansa al matrimonio. La humildad es saber decir «tienes razón», «me equivoqué», «perdóname» y también «no sé».","Humildad no es hacerse menos ni aceptar faltas de respeto. Es dejar de lado el orgullo que convierte cada conversación en una competencia. Dios da su gracia a quien se hace pequeño."],
perg:"¿En qué tema siempre necesito tener la última palabra con mi esposo?",
des:"Hoy reconoce en voz alta, al menos una vez, que él tiene razón en algo. Si te equivocaste hace poco, pide perdón con sencillez, sin «pero».",
ora:"Señor, revísteme de humildad. Quita de mí el orgullo que hiere nuestro amor y dame tu gracia. Amén."},

{t:"Palabras que construyen",ref:"Ef 4, 25-32",v:"No profieran palabras inconvenientes; al contrario, que sus palabras sean siempre buenas, para que resulten edificantes cuando sea necesario",
exp:"San Pablo les pide a los cristianos que dejen la mentira, que no dejen que el sol se ponga sobre su enojo y que no le den lugar al demonio. Que de su boca salgan palabras que edifiquen y hagan bien a quien las escucha. Y termina pidiéndoles que sean bondadosos y compasivos unos con otros, y que se perdonen.",
med:["Las palabras construyen o derrumban una casa. Una frase dicha con enojo puede quedarse años en el corazón del otro. Y un elogio sincero también.","Fíjate hoy en tu tono de voz, en las ironías, en las comparaciones. Antes de hablar, pregúntate: ¿esto que voy a decir construye?"],
perg:"¿Qué palabra o tono mío ha herido a mi esposo, incluso sin que yo me dé cuenta?",
des:"Haz hoy un «ayuno de críticas»: ninguna crítica, ironía ni queja hacia tu esposo en todo el día. Cambia cada una por una palabra amable.",
ora:"Señor, cuida mi boca. Que mis palabras edifiquen a mi esposo y a nuestro hogar. Amén."},

{t:"Dios hace algo nuevo",ref:"Is 43, 16-21",v:"No se acuerden de las cosas pasadas, no piensen en las cosas antiguas; … yo estoy por hacer algo nuevo: ya está germinando, ¿no se dan cuenta?",
exp:"Dios le recuerda a su pueblo que abrió un camino en el mar y liberó a Israel de Egipto. Pero le pide que no se quede atado al pasado. Él va a hacer algo nuevo: abrir un camino en el desierto y ríos en la tierra seca.",
med:["Todo matrimonio tiene heridas antiguas: palabras dichas, traiciones, decepciones, años difíciles. A veces vivimos mirando hacia atrás, reprochando lo que pasó.","Dios es experto en empezar de nuevo. No borra la historia, pero la sana y hace brotar algo nuevo. Pídele ojos para ver lo nuevo que ya está brotando entre ustedes."],
perg:"¿Qué herida del pasado todavía pesa en nuestro matrimonio? ¿Estoy dispuesta a dejar que Dios la sane?",
des:"Escríbele una carta a Dios entregándole una herida del pasado de tu matrimonio. No tienes que mostrársela a nadie. Al final, escribe: «Señor, haz algo nuevo». Si la herida es muy profunda, considera buscar la ayuda de un sacerdote o de un terapeuta.",
ora:"Señor, tú haces nuevas todas las cosas. Sana las heridas de nuestro pasado y haz brotar algo nuevo en nuestro matrimonio. Amén."},

{t:"Rezar en pareja",ref:"Mt 18, 19-20",v:"Porque donde hay dos o tres reunidos en mi Nombre, yo estoy presente en medio de ellos",
exp:"Jesús hace una promesa: si dos en la tierra se ponen de acuerdo para pedir cualquier cosa, el Padre del cielo se la concederá. Y donde dos o tres están reunidos en su nombre, él está en medio de ellos.",
med:["La oración de la pareja tiene una fuerza especial: es la oración de una «iglesia doméstica». Pero muchas parejas católicas nunca han rezado juntas, por vergüenza o por falta de costumbre.","Puede ser muy sencillo: un Padre Nuestro tomados de la mano antes de dormir, una bendición antes de comer. Lo importante no es rezar bonito, sino rezar juntos."],
perg:"¿Mi esposo y yo hemos rezado juntos alguna vez? ¿Qué nos lo impide?",
des:"Invita a tu esposo a rezar juntos un Padre Nuestro antes de dormir, tomados de la mano. Si él todavía no quiere, reza tú en voz baja a su lado, sin presionarlo.",
ora:"Jesús, tú prometiste estar en medio de nosotros. Ven a habitar en nuestra oración de pareja y haz de nuestro hogar una pequeña iglesia. Amén."},

{t:"Servir con amor",ref:"Jn 13, 1-15",v:"Si yo, que soy el Señor y el Maestro, les he lavado los pies, ustedes también deben lavarse los pies unos a otros.",
exp:"En la Última Cena, Jesús se levanta, se quita el manto, toma una toalla y les lava los pies a los discípulos, un trabajo propio de esclavos. Pedro no quiere aceptarlo. Jesús explica que les ha dado ejemplo: así como él lo hizo, debemos hacerlo unos con otros.",
med:["Servir no es ser menos. Jesús, el Señor, se arrodilló. En el matrimonio, servir es el lenguaje más concreto del amor, pero solo tiene valor cuando es libre, y no un reclamo ni una moneda de cambio.","Muchas veces servimos quejándonos, o llevando la cuenta de lo que hicimos. Hoy sirve en lo escondido, como Jesús: sin esperar elogios."],
perg:"¿Sirvo a mi esposo con alegría o pasándole la cuenta? ¿Qué es lo que más valora que yo haga por él?",
des:"Haz hoy algo que a tu esposo le guste, sin que te lo pida y sin comentarlo después: el café como a él le gusta, su ropa lista, un plato especial, una notita cariñosa junto a su comida.",
ora:"Jesús, que lavaste los pies de tus amigos, enséñame a servir a mi esposo con alegría y humildad. Amén."},

{t:"Descansar juntos",ref:"Mc 6, 30-32",v:"Vengan ustedes solos a un lugar desierto, para descansar un poco",
exp:"Los apóstoles vuelven de la misión y le cuentan a Jesús todo lo que hicieron. Había tanta gente yendo y viniendo que ni siquiera tenían tiempo para comer. Entonces Jesús los invita a un lugar tranquilo, solos con él, para descansar.",
med:["A Jesús le importaba el cansancio de sus amigos. La pareja también necesita pausas: tiempo solo para los dos, sin hijos, sin pendientes, sin celular. Eso no es egoísmo; es invertir en el amor.","Muchas parejas solo hablan de problemas y de logística. Descansar juntos es recordar que ustedes son, ante todo, una pareja que se ama."],
perg:"¿Cuándo fue la última vez que mi esposo y yo estuvimos juntos solo por estar, sin nada que hacer?",
des:"Planeen un momento de descanso para los dos esta semana: un café, una caminata, una película cuando los niños se duerman. Apaguen los celulares durante ese tiempo.",
ora:"Jesús, llámanos a descansar contigo. Renueva nuestro amor en los momentos de pausa y de alegría juntos. Amén."},

{t:"Amigos de verdad",ref:"Jn 15, 12-17",v:"Ya no los llamo servidores … yo los llamo amigos",
exp:"En la Última Cena, Jesús nos deja su mandamiento: que nos amemos unos a otros como él nos amó. Y dice que no hay amor más grande que dar la vida por los amigos. Llama amigos a sus discípulos, porque les dio a conocer todo lo que oyó del Padre.",
med:["El matrimonio es la amistad más profunda que existe. Los amigos se apoyan en las caídas, se cuentan secretos, se alegran por el otro y disfrutan estar juntos.","Con el tiempo, algunas parejas se vuelven socias en la administración de la casa y dejan de ser amigas. Hoy reconquista esa amistad: interésate por lo que a él le gusta y cuéntale lo que llevas en el corazón."],
perg:"¿Soy amiga de mi esposo? ¿Qué le gusta hacer que yo podría compartir con él?",
des:"Pregúntale a tu esposo por algo que le guste (un equipo, un pasatiempo, un sueño) y muestra un interés verdadero. Cuéntale algo tuyo que no le has estado contando.",
ora:"Jesús, amigo fiel, haz de nosotros amigos de verdad, que se apoyan, se escuchan y disfrutan caminar juntos. Amén."},

{t:"Fidelidad en los detalles",ref:"Os 2, 16-22",v:"Yo te desposaré para siempre, te desposaré en la justicia y el derecho, en el amor y la misericordia",
exp:"El profeta Oseas usa su propia historia, con una esposa infiel, para hablar del amor de Dios por su pueblo. Aunque es traicionado, Dios no se rinde: lleva a su pueblo al desierto, le habla al corazón y renueva la alianza para siempre, con fidelidad.",
med:["La fidelidad de Dios es el modelo de la nuestra. No es solo no traicionar: es entregarse por completo, todos los días, en los detalles. En la mirada, en las conversaciones, en las amistades, en el celular, en los pensamientos.","La fidelidad también es cumplir las pequeñas promesas: llegar a la hora acordada, hacer lo que dijiste que harías, guardar los secretos del otro."],
perg:"¿En qué pequeños detalles puedo ser más fiel a mi esposo?",
des:"Reza hoy por la fidelidad de los dos. Elige una pequeña promesa que le hiciste a tu esposo y no has cumplido, y cúmplela hoy.",
ora:"Señor, tú eres fiel para siempre. Guarda nuestra fidelidad en el amor y en la ternura, en los detalles grandes y en los pequeños. Amén."},

{t:"Paz en las discusiones",ref:"Mt 5, 21-24",v:"ve a reconciliarte con tu hermano, y sólo entonces vuelve a presentar tu ofrenda.",
exp:"En el Sermón de la Montaña, Jesús enseña que no basta con no matar: el enojo y las palabras de desprecio también hieren. Si vas a llevar tu ofrenda al altar y recuerdas que alguien tiene algo contra ti, deja tu ofrenda y ve primero a hacer las paces.",
med:["Discrepar es normal y hasta sano. Lo que hiere es la manera de discutir: gritos, desprecio, silencios que castigan, irse a dormir enojados. San Pablo también nos pide que no dejemos que el sol se ponga sobre nuestro enojo (Ef 4,26).","Jesús pone la reconciliación incluso por encima de la ofrenda en el altar. Para Dios, la paz entre ustedes importa más que muchas oraciones hechas con el corazón cerrado."],
perg:"¿Cómo suelo actuar en una discusión? ¿Hay algo pendiente entre nosotros que necesite paz?",
des:"Si hay algo sin resolver, da hoy el primer paso hacia la reconciliación. Acuerden una «regla de paz»: nunca irse a dormir sin hacer las paces, aunque sea con un «te amo, mañana hablamos».",
ora:"Jesús, Príncipe de la Paz, enséñanos a discrepar sin herir y a hacer las paces antes de que se ponga el sol. Amén."},

{t:"Soñar juntos",ref:"Prov 16, 1-9",v:"Encomienda tus obras al Señor, y se realizarán tus proyectos.",
exp:"El libro de los Proverbios reúne consejos de sabiduría. Este pasaje recuerda que el ser humano hace planes, pero es el Señor quien dirige sus pasos. Quien le encomienda a Dios lo que hace ve cómo sus proyectos se afianzan.",
med:["Las parejas que sueñan juntas caminan en la misma dirección. Los sueños pueden ser grandes (una casa, hijos, una mudanza) o pequeños (un viaje, una cena fuera, aprender algo juntos).","A Dios le gusta formar parte de nuestros planes. Cuando la pareja sueña en su presencia, los sueños se vuelven más puros y el camino más ligero."],
perg:"¿Qué sueños tenemos en común mi esposo y yo? ¿Alguno se quedó olvidado en el camino?",
des:"Conversen hoy sobre tres sueños para los próximos años. Escríbanlos juntos en una hoja y recen, entregándoselos a Dios.",
ora:"Señor, te confiamos nuestros sueños y proyectos. Dirige nuestros pasos y haznos caminar juntos en tu voluntad. Amén."},

{t:"Su familia y la mía",ref:"Rut 1, 14-18",v:"porque yo iré adonde tú vayas y viviré donde tú vivas. Tu pueblo será mi pueblo y tu Dios será mi Dios.",
exp:"Noemí perdió a su esposo y a sus hijos y decide volver a su tierra. Les pide a sus nueras que regresen con sus familias. Una se va, pero Rut se queda: abraza a su suegra y promete seguirla a donde vaya. Rut llega a ser bisabuela del rey David.",
med:["Suegros, cuñados, familias con costumbres distintas: de ahí vienen muchas tensiones del matrimonio. La historia de Rut muestra que es posible amar a la familia del otro y ser amada por ella.","Amar a la familia de tu esposo no es dejar que ella mande en tu matrimonio. Es honrarla, rezar por ella y construir puentes, manteniendo a la pareja como prioridad."],
perg:"¿Cómo es mi relación con la familia de mi esposo? ¿Hay alguien a quien necesito acercarme o perdonar?",
des:"Reza hoy, por su nombre, por tus suegros y tus cuñados. Ten un gesto de cariño con la familia de tu esposo: una llamada, un mensaje, una invitación.",
ora:"Señor, bendice a la familia de mi esposo y a la mía. Danos paz, respeto y amor entre todos. Amén."},

{t:"El buen vino del matrimonio",ref:"Jn 2, 1-11",v:"Hagan todo lo que él les diga.",
exp:"En una fiesta de bodas en Caná, se acaba el vino. María se da cuenta y se lo dice a Jesús. Después les pide a los sirvientes que hagan todo lo que él les diga. Jesús convierte el agua de seis tinajas de piedra en vino, y el mejor vino se sirve al final. Fue su primer milagro.",
med:["Jesús hizo su primer milagro en una boda. En el matrimonio, él está presente por medio de un sacramento: la pareja recibe una gracia especial para amarse.","Cuando el «vino» se acaba, cuando la alegría y el amor parecen secos, María está atenta e intercede. Y Jesús sigue convirtiendo el agua en vino, si hacemos lo que él nos dice."],
perg:"¿Dónde se acabó el «vino» en nuestro matrimonio? ¿Ya le pedí a María que interceda?",
des:"Recuerda la fecha de tu boda y, si puedes, mira las fotos o el video. Reza una decena del Rosario pidiéndole a María que interceda por un vino nuevo en tu matrimonio.",
ora:"María, tú que te diste cuenta de que se acabó el vino, mira nuestro matrimonio. Jesús, convierte nuestra agua en vino bueno. Amén."},

{t:"Bajo la protección de la Sagrada Familia",ref:"Lc 2, 41-52",v:"Piensa que tu padre y yo te buscábamos angustiados",
exp:"A los doce años, Jesús va con María y José a Jerusalén para la Pascua. Al regresar, ellos se dan cuenta de que el niño se quedó atrás. Lo buscan angustiados durante tres días, hasta encontrarlo en el Templo. María guarda todo en su corazón.",
med:["María y José también pasaron por angustias: un embarazo inesperado, un viaje difícil, la huida a Egipto, la pérdida de su hijo en Jerusalén. No tenían una vida perfecta, pero estaban unidos en Dios.","Fíjate en que, al encontrarlo, María habla de los dos: ella y José lo buscaron juntos. La Sagrada Familia entiende nuestras dificultades y es modelo y protectora de todos los matrimonios."],
perg:"¿Qué angustia estamos viviendo mi esposo y yo que necesitamos poner en manos de María y José?",
des:"Coloca una imagen o estampa de la Sagrada Familia en un lugar especial de tu casa y consagra tu matrimonio a ella con la oración de hoy.",
ora:"Jesús, María y José, les entrego mi corazón y mi alma. Protejan nuestro matrimonio y nuestra familia. Sagrada Familia de Nazaret, ruega por nosotros. Amén."},

{t:"Renovar el sí",ref:"1 Cor 13, 4-13",v:"El amor todo lo disculpa, todo lo cree, todo lo espera, todo lo soporta. El amor no pasará jamás.",
exp:"San Pablo escribe el himno al amor: el amor es paciente, es bondadoso, no es envidioso ni orgulloso, no busca su propio interés, no guarda rencor. Todo pasará, pero el amor permanece. Entre la fe, la esperanza y el amor, el más grande es el amor.",
med:["Después de 30 días, es momento de mirar el camino recorrido. Tal vez cambiaron muchas cosas; tal vez pocas. Pero trenzaste el tercer hilo, día tras día, y Dios actuó, incluso donde no lo viste.","El día de su boda, ustedes dijeron «sí». Hoy es día de renovar ese sí, no a las emociones del principio, sino al amor que elige, persevera y espera."],
perg:"¿Qué cambió en mí y en mi matrimonio en estos 30 días? ¿Cuál es mi «sí» de hoy?",
des:"Renueva en oración las promesas de tu matrimonio: «Yo, N., te recibo a ti, N., como esposo y me entrego a ti y prometo serte fiel en la prosperidad y en la adversidad, en la salud y en la enfermedad, y así amarte y respetarte todos los días de mi vida.» Si él acepta, recen juntos. Escríbele una carta de amor.",
ora:"Señor, hoy renuevo mi sí. Gracias por estos 30 días. Sigue cuidando nuestro matrimonio, porque el amor nunca pasará. Amén."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="casamento30"){PLANOS[i].d=D;PLANOS[i].resumo="Un mes entero poniendo tu matrimonio en las manos de Dios. Cada día trae una lectura de la Biblia explicada, una meditación, un espacio para escribir y un desafío concreto para vivir con tu esposo.";}}
})();

// Planes cortos (parte 1): Año Nuevo, paz, amada por Dios, oración en familia. Versión completa.
(function(){
var P={};

P.anonovo7={ini:"2027-01-01",resumo:"Una semana, del 1 al 7 de enero, para mirar atrás con gratitud y planear 2027 con Dios en el centro, siguiendo también las fiestas de la Iglesia. Cada día trae una lectura explicada, una meditación, un espacio para escribir y un desafío.",d:[
{t:"Poner el año bajo la bendición de Dios",cel:"Santa María, Madre de Dios (solemnidad) · Jornada Mundial de la Paz",
aviso:"En muchos países es día de precepto: participa en la Santa Misa. Empieza el año a los pies de la Virgen María, Madre de Dios.",
tipo:"Primera lectura",ref:"Nm 6, 22-27",v:"Que el Señor te bendiga y te proteja. Que el Señor haga brillar su rostro sobre ti … Que el Señor te descubra su rostro y te conceda la paz.",
exp:"En el primer día del año, la Iglesia lee la bendición que Dios le enseñó a Moisés para que los sacerdotes bendijeran al pueblo. Y celebra a María como Madre de Dios: en el Evangelio (Lc 2,16-21), los pastores encuentran al Niño con María y José, y María guarda todo en su corazón.",
med:["Antes de cualquier meta, ponemos el año entero en las manos de Dios y bajo el manto de María. No sabemos qué traerá 2027, pero sabemos quién caminará con nosotros.","María guardaba todo en su corazón. Que este año tú también aprendas a guardar y meditar lo que Dios haga en tu vida, día tras día."],
perg:"¿Qué quiero entregarle a Dios al comenzar este año?",
des:"Reúne a tu familia y bendice a cada uno con la bendición del libro de los Números, haciéndole la señal de la cruz en la frente. Escribe en la parte de arriba de una hoja: «2027 es tuyo, Señor», y guárdala en tu Biblia o en tu planner.",
ora:"Santa María, Madre de Dios, te consagro este año. Señor, bendícenos, guárdanos y danos tu paz en 2027. Amén."},

{t:"Hasta aquí nos ha ayudado el Señor",cel:"San Basilio Magno y San Gregorio Nacianceno (memoria)",
ref:"1 Sam 7, 7-12",v:"Hasta aquí nos ha socorrido el Señor",
exp:"Los filisteos atacan a Israel. El pueblo, con miedo, le pide a Samuel que no deje de orar. Samuel ofrece un sacrificio y clama al Señor, y Dios responde. Después de la victoria, Samuel coloca una piedra como recuerdo y le pone el nombre de Ebenezer, «piedra de la ayuda», porque hasta allí el Señor los había ayudado.",
med:["Mirar atrás con gratitud nos muestra cuántas veces Dios nos sostuvo, incluso cuando creíamos que no íbamos a poder. Recordar las victorias de Dios nos da valor para lo que viene.","Hoy levanta tu propia piedra de Ebenezer: una señal para recordar que Dios estuvo contigo en 2026."],
perg:"¿En qué momentos de 2026 vi que Dios me ayudaba?",
des:"Haz una lista de por lo menos cinco momentos de 2026 en los que Dios te ayudó. Elige una piedrita (o un objeto) y escribe en ella «Ebenezer» o «Hasta aquí». Déjala en un lugar visible todo el año.",
ora:"Señor, hasta aquí nos has ayudado. Gracias por cada ayuda que nos diste en 2026. Confío en que seguirás con nosotros. Amén."},

{t:"Seguir la estrella",cel:"Epifanía del Señor (solemnidad)",
aviso:"El domingo es día de precepto: participa en la Santa Misa. Hoy la Iglesia celebra la Epifanía: Jesús se manifiesta a todos los pueblos.",
tipo:"Evangelio",ref:"Mt 2, 1-12",v:"Porque vimos su estrella en Oriente y hemos venido a adorarlo",
exp:"Unos magos venidos de Oriente siguen una estrella hasta Jerusalén y preguntan dónde está el rey que ha nacido. Herodes se inquieta. La estrella los guía hasta Belén, donde encuentran al Niño con María. Se arrodillan, lo adoran y le ofrecen oro, incienso y mirra. Después, avisados en sueños, regresan por otro camino.",
med:["Los Magos hicieron un largo viaje siguiendo una estrella. No tenían todas las respuestas, pero tenían un rumbo. Y cuando encontraron a Jesús, regresaron por otro camino: el encuentro cambió su dirección.","¿Qué estrella guiará tu año? Las metas son buenas, pero lo más importante es la dirección: ir hacia Jesús y dejar que él cambie tu camino."],
perg:"¿Qué estrella quiero seguir en 2027? ¿Qué camino necesito cambiar después de encontrarme con Jesús?",
des:"Hagan en familia, con papel, los tres regalos de los Magos: oro (lo mejor que tenemos), incienso (nuestra oración) y mirra (nuestros sacrificios). Cada uno escribe lo que quiere ofrecerle a Jesús este año y lo pone cerca del Nacimiento.",
ora:"Jesús, guíame como la estrella guió a los Magos. Que te encuentre, te adore y regrese por un camino nuevo. Amén."},

{t:"Metas con Dios",cel:"Lunes después de Epifanía",
ref:"Lc 14, 28-30",v:"¿Quién de ustedes, si quiere edificar una torre, no se sienta primero a calcular los gastos",
exp:"Jesús usa una imagen muy práctica: quien quiere construir una torre primero hace cuentas, para no empezarla y dejarla a medias. Habla del discipulado: seguir a Jesús es una decisión seria, que hay que pensar bien. El libro de los Proverbios lo completa: quien pone sus obras en manos del Señor verá cumplirse sus proyectos (Prov 16,3).",
med:["Planear no es falta de fe. El mismo Jesús elogia a quien se sienta a hacer cuentas. Lo que cambia es con quién planeamos: con Dios en el centro, las metas se vuelven más verdaderas y más ligeras.","Demasiadas metas cansan y frustran. Elige pocas, posibles, que le hagan bien a tu alma, a tu familia y a tu cuerpo."],
perg:"¿Cuáles son las tres metas más importantes para mí en 2027?",
des:"Escribe en tu planner tres metas para 2027: una para tu vida con Dios, una para tu familia y una para ti. Para cada una, anota el primer paso concreto.",
ora:"Señor, te entrego mis proyectos para 2027. Ayúdame a planear con sabiduría y a seguir tu voluntad. Amén."},

{t:"Nuestra familia en 2027",cel:"Martes después de Epifanía",
ref:"Col 3, 12-17. 20-21",v:"Sobre todo, revístanse del amor, que es el vínculo de la perfección.",
exp:"San Pablo describe cómo debe ser la vida de una familia cristiana: misericordia, bondad, humildad, paciencia, perdón. Pide que la paz de Cristo reine en los corazones y que la Palabra de Dios habite en ellos. Y les habla a los hijos, para que obedezcan a sus padres, y a los padres, para que no exasperen a sus hijos.",
med:["¿Qué tipo de familia quieren ser en 2027? No se trata de perfección, sino de dirección: más paz, más oración, más tiempo juntos, menos gritos.","La familia es el lugar donde se aprende, en la práctica, a vestirse con la «ropa» del amor que describe Pablo."],
perg:"¿Qué deseo para mi familia en 2027? ¿Qué depende de mí?",
des:"Reúne a tu familia y pregúntale a cada uno: «¿Qué te gustaría que nuestra familia hiciera más en 2027?». Elijan juntos un compromiso (rezar juntos, un paseo al mes, una cena sin celulares).",
ora:"Señor, bendice a nuestra familia en 2027. Que tu paz reine en nuestros corazones y tu amor nos una. Amén."},

{t:"Una rutina de oración",cel:"Miércoles después de Epifanía",
tipo:"Evangelio",ref:"Mc 6, 45-52",v:"Una vez que los despidió, se retiró a la montaña para orar.",
exp:"Después de la multiplicación de los panes, Jesús manda a los discípulos a cruzar el lago y sube al monte a orar solo. En la noche ve que luchan contra el viento y va hacia ellos caminando sobre el agua. Les pide que tengan ánimo y que no tengan miedo. Sube a la barca y el viento se calma.",
med:["Aunque la multitud lo buscaba, Jesús apartaba tiempo para orar. Si hasta Jesús necesitaba ese momento a solas con el Padre, cuánto más nosotros.","Una rutina de oración no tiene que ser larga: 5 minutos al día, a una hora fija, ya cambian el año. Fue desde el monte de la oración que Jesús vio a sus discípulos en peligro y fue hacia ellos."],
perg:"¿Cuál es el mejor momento de mi día para rezar con constancia?",
des:"Elige una hora y un lugar fijos para tu momento con Dios en 2027. Pon una alarma en tu celular con el nombre «Mi momento con Dios» y empieza hoy.",
ora:"Señor, enséñame a subir al monte a orar todos los días. Que la oración sea el centro de mi rutina en 2027. Amén."},

{t:"Seguir adelante",cel:"Jueves después de Epifanía",
ref:"Flp 3, 7-14",v:"olvidándome del camino recorrido, me lanzo hacia adelante",
exp:"San Pablo dice que todo lo que antes consideraba importante ahora vale poco frente al valor de conocer a Jesús. Reconoce que todavía no ha llegado a la perfección, pero corre hacia la meta, olvidando lo que quedó atrás y lanzándose hacia lo que está por delante.",
med:["El pasado enseña, pero no ata. Los errores, las frustraciones y las heridas de 2026 pueden quedarse atrás. Dios abre un camino nuevo.","Pablo no dice que ya llegó: dice que sigue corriendo. 2027 no tiene que ser perfecto; tiene que vivirse con Dios, paso a paso."],
perg:"¿Qué de 2026 necesito dejar atrás para seguir adelante?",
des:"Escribe en un papel lo que quieres dejar en 2026 y rómpelo. Después escribe una frase de esperanza para 2027 y ponla en la primera página de tu planner.",
ora:"Señor, dejo atrás lo que pasó y avanzo contigo hacia lo que está por delante. Bendice mi 2027. Amén."}
]};

P.paz7={resumo:"Para los días de preocupación y ansiedad: una semana aprendiendo a poner todo en las manos de Dios. Cada día trae una lectura explicada, una meditación, un espacio para escribir y un pequeño ejercicio de paz.",d:[
{t:"Poner mi carga en el Señor",ref:"Sal 55, 17-23",v:"Confía tu suerte al Señor, y él te sostendrá…",
exp:"El salmista está angustiado: lo persiguen enemigos y hasta un amigo lo traicionó. Clama a Dios en la mañana, al mediodía y en la tarde. Y llega a una certeza: Dios escucha y sostiene a quien pone en él su carga.",
med:["Muchas veces cargamos solas pesos que no fueron hechos para nosotras: el futuro de los hijos, las cuentas, la salud de alguien, lo que piensan los demás.","Poner tu carga en el Señor no es huir de la responsabilidad; es reconocer que Dios puede llevar lo que yo no puedo."],
perg:"¿Qué carga he llevado sola y necesito poner en manos del Señor?",
des:"Escribe en una hoja todas las preocupaciones que te vengan a la mente. Lee cada una y di: «Señor, esto es tuyo». Después dobla la hoja y guárdala dentro de tu Biblia.",
ora:"Señor, pongo en ti mi carga. Sostenme y dame tu paz. Amén."},

{t:"Solo el pan de hoy",ref:"Ex 16, 4. 13-21",v:"Yo haré caer pan para ustedes desde lo alto del cielo, y el pueblo saldrá cada día a recoger su ración diaria.",
exp:"En el desierto, el pueblo de Israel tiene hambre. Dios le envía el maná, un pan que aparece cada mañana. Pero hay una regla: cada uno recoge solo lo necesario para ese día. Quien intenta guardar para el día siguiente encuentra el maná echado a perder.",
med:["La ansiedad quiere asegurar hoy el mañana. Dios enseñó a su pueblo a confiar un día a la vez: mañana habría maná otra vez.","Jesús nos enseñó a pedir el pan de cada día. Hoy solo necesitas la gracia de hoy. La de mañana llegará mañana."],
perg:"¿Qué preocupación por el mañana me está robando el hoy?",
des:"Hoy, cada vez que tu mente corra hacia el futuro, di: «Solo el pan de hoy, Señor». Haz una lista solo con lo que hay que hacer hoy.",
ora:"Padre, dame hoy el pan de hoy. Enséñame a confiar en ti un día a la vez. Amén."},

{t:"Respirar la paz de Jesús",ref:"Jn 20, 19-22",v:"¡La paz esté con ustedes! … Al decirles esto, sopló sobre ellos y añadió «Reciban al Espíritu Santo».",
exp:"En la tarde de la Resurrección, los discípulos están encerrados en casa, con miedo. Jesús entra, se pone en medio de ellos y les desea la paz. Les muestra las manos y el costado, y ellos se llenan de alegría. Después sopla sobre ellos y les da el Espíritu Santo.",
med:["Jesús entró por puertas cerradas por el miedo. Él puede entrar en tu corazón cerrado por la ansiedad.","Y sopló sobre ellos: les dio el Espíritu como un aliento. Cuando la ansiedad aprieta, respirar despacio con una oración ayuda al cuerpo y al alma a volver a la paz."],
perg:"¿Dónde están cerradas por el miedo las puertas de mi corazón?",
des:"Haz hoy tres veces la «oración de la respiración»: al inhalar, di en tu interior «Jesús»; al exhalar, «confío en ti». Repite despacio durante 2 minutos.",
ora:"Jesús, entra por las puertas cerradas de mi corazón. Sopla sobre mí tu Espíritu y déjame tu paz. Amén."},

{t:"Ánimo, soy yo",ref:"Mt 14, 22-33",v:"Tranquilícense, soy yo; no teman.",
exp:"Los discípulos están en la barca, de madrugada, con el viento en contra. Jesús llega caminando sobre el agua. Ellos se asustan, creyendo que es un fantasma. Jesús les dice que tengan ánimo, que es él. Pedro le pide ir hacia él y camina sobre el agua, pero al ver el viento siente miedo y empieza a hundirse. Jesús extiende la mano y lo sostiene.",
med:["Pedro se hundió cuando apartó los ojos de Jesús y miró el viento. La ansiedad hace eso: miramos tanto el problema que olvidamos quién está con nosotros.","Aun cuando se hundía, Pedro no quedó solo: Jesús le tendió la mano enseguida. Tú tampoco estás sola."],
perg:"¿Qué «viento» he estado mirando más que a Jesús?",
des:"Cuando hoy llegue la preocupación, haz la oración de Pedro: pídele a Jesús, con sencillez, que te salve. Escribe aquí lo que pasó después.",
ora:"Jesús, cuando empiece a hundirme, extiende tu mano. Que mis ojos se queden fijos en ti, y no en el viento. Amén."},

{t:"Cuidar mis pensamientos",ref:"Rom 12, 1-2",v:"No tomen como modelo a este mundo. … transfórmense interiormente renovando su mentalidad",
exp:"San Pablo les pide a los cristianos que ofrezcan su vida a Dios y que no sigan la manera de pensar del mundo. La transformación empieza en la mente: renovar la forma de pensar para descubrir lo que Dios quiere, lo que es bueno, agradable y perfecto.",
med:["Mucha ansiedad nace de los pensamientos que alimentamos: las noticias, las comparaciones en redes sociales, el «¿y si sale mal?». La mente también necesita cuidado.","Renovar la mente es elegir en qué pensar. No puedes controlar todo lo que aparece, pero sí puedes dejar de alimentar lo que te quita la paz."],
perg:"¿Qué pensamientos he estado alimentando que me roban la paz?",
des:"Haz hoy un «ayuno de noticias y redes sociales» durante algunas horas. Usa ese tiempo para leer un salmo, escuchar música que te tranquilice o conversar con alguien querido.",
ora:"Señor, renueva mi mente. Enséñame a pensar en lo que es bueno, verdadero y bello. Amén."},

{t:"Gratitud que da calma",ref:"Sal 103, 1-5",v:"bendice al Señor, alma mía, y nunca olvides sus beneficios.",
exp:"El salmista le habla a su propia alma y la invita a bendecir a Dios. Pide no olvidar ningún bien recibido: el perdón, la sanación, la vida rescatada, el amor, la misericordia, las fuerzas renovadas.",
med:["La ansiedad mira lo que puede salir mal; la gratitud mira lo que Dios ya hizo. Las dos no caben al mismo tiempo en el mismo lugar.","Cuando recordamos los beneficios de Dios, el corazón se calma, porque se da cuenta de que no está desamparado."],
perg:"¿Qué beneficios de Dios he olvidado?",
des:"Antes de dormir, escribe diez cosas buenas que pasaron esta semana, aunque sean pequeñas. Léelas en voz alta, como una oración.",
ora:"Con toda mi alma te bendigo, Señor. Gracias, Dios mío, por todo lo que has hecho por mí. Amén."},

{t:"Acostarme en paz",ref:"Sal 4, 2. 7-9",v:"Me acuesto en paz y en seguida me duermo, porque sólo tú, Señor, aseguras mi descanso.",
exp:"Este salmo es una oración de la noche. El salmista le pide a Dios que lo escuche en la angustia, recuerda que Dios llenó su corazón de alegría y termina con una confianza serena: puede acostarse y dormir en paz, porque está seguro en Dios.",
med:["La noche suele ser el peor momento para la ansiedad: el silencio hace que los pensamientos suenen más fuerte. Entregarle el día a Dios antes de dormir ayuda al cuerpo y al alma a descansar.","Después de estos 7 días, no te libraste de todas las preocupaciones, pero aprendiste caminos para volver a la paz. Sigue usando cada uno de ellos."],
perg:"¿Qué cambió en mí en estos 7 días? ¿Qué ejercicio de paz quiero conservar?",
des:"Crea un pequeño ritual para la noche: apagar el celular un poco antes, rezar el Salmo 4 y entregarle el día a Dios. Empieza hoy.",
ora:"Señor, me acuesto tranquila y duermo en paz, porque solo tú me das seguridad. Cuida mi sueño y mi corazón. Amén."}
]};

P.amada7={resumo:"Una semana solo para ti: recordar quién eres a los ojos de Dios, antes de ser mamá, esposa o ama de casa. Cada día trae una lectura explicada, una meditación, un espacio para escribir y un pequeño cuidado para ti.",d:[
{t:"Llamada por tu nombre",ref:"Jn 20, 11-18",v:"Jesús le dijo: «¡María!». Ella lo reconoció y le dijo en hebreo: «¡Raboní!»",
exp:"El domingo de la Resurrección, María Magdalena llora junto al sepulcro vacío. Ve a Jesús, pero no lo reconoce; piensa que es el jardinero. Entonces Jesús la llama por su nombre. En ese instante lo reconoce. Y Jesús la envía a anunciar a los discípulos que él vive.",
med:["María Magdalena reconoció a Jesús cuando oyó su propio nombre. Dios no te ama como a «una más»: te llama por tu nombre, con un cariño personal.","Antes de cualquier papel que desempeñes (mamá, esposa, hija, profesional), eres alguien a quien Dios llama por su nombre."],
perg:"¿Cómo me siento al imaginar a Jesús llamándome por mi nombre?",
des:"Lee Jn 20,11-18 y, en lugar de «María», pon tu nombre. Quédate un minuto en silencio, dejando que Jesús te llame.",
ora:"Jesús, tú me llamas por mi nombre. Que reconozca tu voz y me alegre de ser tuya. Amén."},

{t:"Hasta tus cabellos están contados",ref:"Mt 10, 29-31",v:"Ustedes tienen contados todos sus cabellos. No teman entonces, porque valen más que muchos pájaros.",
exp:"Jesús anima a los discípulos que van a enfrentar dificultades en la misión. Les recuerda que ni un gorrión, que en el mercado no valía casi nada, cae al suelo sin que el Padre lo sepa. Y les dice que ellos valen mucho más.",
med:["No tienes que ganarte el amor de Dios. Él ya te ama tal como eres, con tu cansancio, tus fallas y tus inseguridades. Hasta tus cabellos están contados.","En un mundo que mide el valor por la apariencia, la productividad o los likes, Dios te recuerda que tu valor está en ser amada por él."],
perg:"¿Dónde he buscado mi valor? ¿En la apariencia, en lo que hago, en la aprobación de los demás?",
des:"Mírate hoy en el espejo y di, aunque te parezca extraño: «Soy valiosa para Dios». Escribe aquí lo que sentiste.",
ora:"Padre, gracias porque cuidas hasta de mis cabellos. Enséñame a ver mi valor con tus ojos. Amén."},

{t:"Dios me enseñó a caminar",ref:"Os 11, 1-4",v:"Yo los atraía con lazos humanos, con ataduras de amor; era para ellos como los que alzan a una criatura contra sus mejillas",
exp:"Por medio del profeta Oseas, Dios habla de su pueblo como de un hijo pequeño. Fue él quien le enseñó a caminar, sosteniéndolo de los brazos, quien curó sus heridas, quien se inclinó para darle de comer. Aun cuando el pueblo se alejó, Dios lo atrajo con lazos de amor.",
med:["Tú, que cuidas a tanta gente, también eres cuidada. Dios se inclina sobre ti como una mamá se inclina sobre su bebé.","Tal vez ni lo notaste, pero Dios te enseñó a caminar en muchas etapas de tu vida: te sostuvo, te levantó, te alimentó."],
perg:"¿En qué momento de mi vida sentí que Dios me tenía en sus brazos?",
des:"Aparta hoy 10 minutos solo para ti: un té, un baño tranquilo, una caminata. Durante ese tiempo, déjate cuidar por Dios.",
ora:"Señor, gracias por los lazos de amor con que me atrajiste. Déjame descansar hoy en tus brazos. Amén."},

{t:"Dios se alegra por ti",ref:"Sof 3, 14-17",v:"¡El Señor, tu Dios, está en medio de ti, es un guerrero victorioso! El exulta de alegría a causa de ti, te renueva con su amor",
exp:"El profeta Sofonías invita a Jerusalén a alegrarse, porque Dios le quitó la condena. Y hace una afirmación sorprendente: Dios está en medio de su pueblo y salta de alegría por él, renovándolo con su amor.",
med:["Muchas personas se imaginan a un Dios que las mira con exigencia o con decepción. La Palabra de hoy muestra a un Dios que te mira y se alegra, como un papá que ve a su hijo y sonríe.","No eres una carga para Dios. Eres su alegría."],
perg:"¿Cómo imagino la mirada de Dios sobre mí: con exigencia o con alegría?",
des:"Lee Sof 3,17 y escribe en un papel su mensaje con tus palabras y con tu nombre: «Dios se alegra por (tu nombre)». Pégalo en el espejo del baño.",
ora:"Señor, gracias porque te alegras por mí. Renuévame con tu amor y enséñame a alegrarme en ti. Amén."},

{t:"No tienes que ser perfecta",ref:"Lc 7, 36-50",v:"sus pecados, sus numerosos pecados, le han sido perdonados porque ha demostrado mucho amor.",
exp:"Jesús está cenando en casa de un fariseo. Una mujer conocida como pecadora entra, llora a los pies de Jesús, se los seca con sus cabellos y los perfuma. El fariseo se escandaliza. Jesús cuenta una parábola sobre el perdón y le dice a la mujer que sus pecados están perdonados y que se vaya en paz.",
med:["Aquella mujer no llegó perfecta: llegó con su historia y sus lágrimas. Y fue recibida con amor.","No tienes que ser perfecta para ser amada por Dios, ni para servirle. Él te quiere entera, con tus fallas, tus intentos y el amor que tienes."],
perg:"¿Qué exigencia de perfección cargo y necesito entregarle a Jesús?",
des:"Escribe una exigencia que te pones a ti misma («debería...»). Al lado, escribe: «Jesús me ama como soy». Si sientes la necesidad, busca la Confesión esta semana.",
ora:"Jesús, llego a tus pies tal como soy. Gracias por amarme y perdonarme. Dame tu paz. Amén."},

{t:"Cuidarte también es santo",ref:"Lc 5, 15-16",v:"Pero él se retiraba a lugares desiertos para orar.",
exp:"La fama de Jesús se extiende y multitudes vienen a escucharlo y a ser sanadas. Aun así, el Evangelio cuenta que Jesús se retiraba a lugares tranquilos para orar. Sabía que necesitaba ese tiempo a solas con el Padre.",
med:["Cuidarte no es egoísmo. Es cuidar la casa donde Dios habita. Jesús, con tanta gente que lo necesitaba, apartaba tiempo para retirarse.","Una mujer agotada no puede cuidar bien de nadie. Apartar un tiempo para ti (descansar, rezar, hacer algo que te guste) es una necesidad, no un lujo."],
perg:"¿Cuándo fue la última vez que me cuidé sin sentir culpa?",
des:"Elige hoy un cuidado solo para ti: algo que te haga bien y que has ido dejando para después. Hazlo sin culpa, ofreciéndoselo a Dios.",
ora:"Señor, enséñame a cuidarme como tú me cuidas. Que descanse sin culpa y rece sin prisa. Amén."},

{t:"La mejor parte",ref:"Lc 10, 38-42",v:"María eligió la mejor parte, que no le será quitada",
exp:"Jesús visita a Marta y a María. Marta está ocupada con mil tareas; María se sienta a los pies de Jesús para escucharlo. Marta se queja, y Jesús le dice con cariño que María escogió la mejor parte.",
med:["Después de una semana recordando quién eres a los ojos de Dios, la Palabra de hoy te invita a escoger la mejor parte: estar con él.","Vas a seguir teniendo muchas tareas, como Marta. Pero todos los días puedes sentarte unos minutos a los pies de Jesús. Esa parte nadie te la quita."],
perg:"¿Qué aprendí sobre mí esta semana? ¿Cómo puedo escoger la mejor parte todos los días?",
des:"Escribe una carta de Dios para ti, como si él te dijera todo lo que meditaste esta semana. Guárdala para leerla en los días difíciles.",
ora:"Jesús, escojo la mejor parte: estar contigo. Gracias por amarme. Que nunca olvide quién soy a tus ojos. Amén."}
]};

P.familia5={resumo:"Un paso al día para crear hábitos sencillos de oración con tus hijos, hábitos que caben en la vida real. Cada día trae una lectura explicada, una meditación, un espacio para escribir y un hábito para empezar.",d:[
{t:"La oración de la mañana",ref:"Sal 5, 2-4",v:"Señor, de madrugada ya escuchas mi voz: por la mañana te expongo mi causa y espero tu respuesta.",
exp:"El salmista empieza el día pidiéndole a Dios que escuche su clamor. Le presenta su oración desde temprano y se queda atento, esperando la respuesta de Dios.",
med:["Empezar el día con Dios cambia el día entero. No tiene que ser largo: una señal de la cruz y una frase al despertar ya les enseñan a los niños que el día le pertenece a Dios.","Las prisas de la mañana son reales. Por eso la oración tiene que ser sencilla y caber en la rutina: en el desayuno, camino a la escuela, en la puerta de la casa."],
perg:"¿Cómo son las mañanas en mi casa? ¿En qué momento cabe una oración rápida?",
des:"Mañana temprano, al despertar a tus hijos, haz con ellos la señal de la cruz y di: «¡Buenos días, Jesús! Este día es tuyo». Repítelo todos los días de esta semana.",
ora:"Señor, en la mañana te entregamos nuestro día. Bendice a nuestra familia desde el primer momento. Amén."},

{t:"La oración en las comidas",ref:"Lc 24, 28-35",v:"Entonces los ojos de los discípulos se abrieron y lo reconocieron … cómo lo habían reconocido al partir el pan.",
exp:"Dos discípulos caminan hacia Emaús, tristes después de la muerte de Jesús. Jesús camina con ellos, pero no lo reconocen. En la mesa, Jesús toma el pan, lo bendice, lo parte y se lo da. En ese momento se les abren los ojos y lo reconocen.",
med:["Los discípulos reconocieron a Jesús en la mesa, en el gesto de bendecir el pan. La mesa de la familia también puede ser un lugar de encuentro con él.","Rezar antes de comer es uno de los hábitos más sencillos y más bonitos. Enseña a agradecer y recuerda que todo viene de Dios."],
perg:"¿Mi familia suele rezar antes de comer? ¿Qué lo impide?",
des:"Hoy, antes de comer o de cenar, recen juntos tomados de la mano. Puede ser la Bendición de la mesa: «Bendícenos, Señor, y bendice estos alimentos que por tu bondad vamos a tomar. Por Jesucristo Nuestro Señor. Amén.» Deja que uno de tus hijos dirija la oración.",
ora:"Señor, bendice nuestra mesa. Que te reconozcamos en cada comida que compartimos. Amén."},

{t:"La bendición de los papás",ref:"Gn 48, 8-16",v:"el Dios que fue mi pastor, desde mi nacimiento hasta el día de hoy, … bendiga a estos jóvenes",
exp:"Ya anciano, Jacob recibe a sus nietos, los hijos de José. Los abraza, los besa y pone las manos sobre su cabeza para bendecirlos, recordando al Dios que lo acompañó toda la vida.",
med:["La bendición de los papás es un gesto antiguo y poderoso. Le dice al hijo: «Eres amado y Dios está contigo».","En muchas familias latinoamericanas se conserva la costumbre de pedirles la bendición a los papás y a los abuelos. Retomar ese gesto con tus hijos es sembrar algo que llevarán toda la vida."],
perg:"¿Acostumbro bendecir a mis hijos? ¿Cómo era la bendición que recibí de mis papás?",
des:"Esta noche, pon la mano sobre la cabeza de cada hijo y dile: «Que Dios te bendiga y te guarde, hijo mío». Enséñales a pedir tu bendición al salir y al llegar a casa.",
ora:"Señor, que mis manos bendigan a mis hijos todos los días. Sé tú su pastor toda la vida. Amén."},

{t:"La oración de la noche",ref:"Sal 63, 2-9",v:"Mientras me acuerdo de ti en mi lecho y en las horas de la noche medito en ti, veo que has sido mi ayuda",
exp:"El salmista tiene sed de Dios como una tierra reseca. Se acuerda de Dios incluso acostado, durante la noche, y se siente seguro a la sombra de sus alas.",
med:["En la noche, la familia baja el ritmo. Es el momento perfecto para dar gracias por el día, pedir perdón y entregarle el sueño a Dios.","Una oración sencilla antes de dormir, con los niños ya en la cama, se convierte en uno de los recuerdos más dulces de la infancia."],
perg:"¿Cómo es la hora de dormir en mi casa? ¿Hay espacio para unos minutos de oración?",
des:"Hoy, a la hora de dormir, hazles a tus hijos tres preguntas: «¿Por qué das gracias hoy?», «¿Quieres pedir perdón por algo?», «¿Por quién quieres rezar?». Terminen con la oración al Ángel de la Guarda.",
ora:"Señor, cuida nuestro sueño. Gracias por este día. Que tus ángeles nos protejan esta noche. Amén."},

{t:"Un encuentro de familia con Dios",ref:"Col 3, 16-17",v:"Que la Palabra de Cristo resida en ustedes con toda su riqueza. … Todo lo que puedan decir o realizar, háganlo siempre en nombre del Señor Jesús",
exp:"San Pablo pide que la Palabra de Cristo habite con abundancia en los cristianos: que se enseñen y se aconsejen unos a otros, que le canten a Dios con gratitud, y que todo lo hagan en el nombre de Jesús, dando gracias al Padre.",
med:["Además de los pequeños hábitos diarios, un encuentro semanal en familia hace crecer la fe: leer un pasaje de la Biblia, cantar, conversar, rezar juntos.","No tiene que ser complicado. Quince minutos a la semana, siempre el mismo día, bastan para que la Palabra haga su hogar en el de ustedes."],
perg:"¿Qué día y a qué hora de la semana podría mi familia apartar un tiempo para un encuentro con Dios?",
des:"Organiza el primer encuentro semanal en familia: enciendan una vela, lean un Evangelio corto (puede ser el del domingo), que cada uno diga lo que entendió y terminen con un canto y un Padre Nuestro.",
ora:"Señor, que tu Palabra habite en nuestro hogar. Que todo lo que hagamos sea en tu nombre. Amén."}
]};

// Planes cortos (parte 2): la Virgen María, la Sagrada Familia, gratitud. Versión completa.
(function(){
var P={};

P.maria9={resumo:"Nueve días caminando con María por el Evangelio, desde el sí de la Anunciación hasta el Cenáculo. Cada día trae una lectura explicada, una meditación, un espacio para escribir lo que Dios te dijo y un reto para vivir como ella.",d:[
{t:"María del sí",ref:"Lc 1, 26-38",v:"Yo soy la servidora del Señor, que se cumpla en mí lo que has dicho.",
exp:"El ángel Gabriel es enviado a Nazaret, a una joven llamada María, comprometida con José. Le anuncia que será la madre del Hijo del Altísimo. María no finge entenderlo todo: pregunta cómo sucederá. El ángel le responde que el Espíritu Santo vendrá sobre ella y le recuerda que para Dios nada es imposible. Entonces María da su respuesta: que se haga en ella lo que Dios quiere.",
med:["María no tenía todas las respuestas, pero tenía confianza. Preguntó, escuchó y se entregó. Su sí no fue ingenuo: fue el sí de quien sabe en quién confía.","Dios también espera tus pequeños «sí» de cada día: en el cuidado de tu casa, en el perdón que cuesta, en la oración que sigues posponiendo. Cada sí le abre espacio a Jesús para entrar en tu historia."],
perg:"¿En qué área de mi vida Dios me está pidiendo un sí que sigo posponiendo?",
des:"Elige algo concreto que vienes posponiendo y que sabes que Dios te pide (una conversación, una confesión, un hábito de oración, un perdón). Da hoy el primer paso y reza tres Avemarías pidiendo la valentía de María.",
ora:"María, mujer del sí, enséñame a confiar como tú confiaste. Que yo también le dé a Dios mi sí entero y deje que su palabra se cumpla en mí. Amén."},

{t:"María que sirve",ref:"Lc 1, 39-45",v:"En aquellos días, María partió y fue sin demora a un pueblo de la montaña de Judá.",
exp:"Justo después de la Anunciación, María se entera de que su prima Isabel, ya mayor, lleva seis meses de embarazo. No se queda quieta pensando en sí misma: viaja unos 150 km para ayudarla. Cuando llega, el niño Juan salta de alegría en el vientre de Isabel, e Isabel, llena del Espíritu Santo, la llama bendita entre las mujeres.",
med:["María llevaba a Jesús en su vientre, y lo primero que hizo fue servir. Quien lleva a Jesús dentro no puede quedarse encerrada: sale al encuentro de quien la necesita.","El servicio de María llevó alegría a aquella casa. Tu servicio de cada día, muchas veces escondido, también lleva a Jesús a tu familia y a quienes están cerca de ti."],
perg:"¿Quién cerca de mí necesita ayuda, aunque no la pida?",
des:"Haz hoy un servicio concreto por alguien sin que te lo pida: llevarle una comida, ayudar en una tarea, visitar o llamar a una persona mayor o enferma. Hazlo con alegría, como María.",
ora:"María, que saliste deprisa a servir, dame un corazón atento y unas manos dispuestas. Que, al servir, lleve a Jesús a quien lo necesita. Amén."},

{t:"María que alaba",ref:"Lc 1, 46-55",v:"Mi alma canta la grandeza del Señor, y mi espíritu se estremece de gozo en Dios, mi salvador…",
exp:"En casa de Isabel, María responde con un canto, el Magníficat. Alaba a Dios por lo que hizo en ella, una joven sencilla, y por su manera de actuar en la historia: derriba a los poderosos, enaltece a los humildes, colma de bienes a los hambrientos y se acuerda de sus promesas. Es la oración que la Iglesia reza cada tarde en las Vísperas.",
med:["María no se guarda la alegría: la convierte en alabanza. No dice que ella es grande, sino que reconoce las maravillas que el Señor hizo en ella. La gratitud humilde es el secreto de su corazón.","A veces solo rezamos para pedir. Hoy aprende de María a alabar: mira tu propia vida y reconoce las maravillas que Dios ya ha hecho."],
perg:"¿Cuáles son las «maravillas» que Dios ya ha hecho en mi vida?",
des:"Reza el Magníficat despacio (está en la pestaña Orar). Después escribe tu propio «magníficat»: cinco líneas que empiecen con «Te alabo, Señor, porque...».",
ora:"Señor, con todo mi corazón te alabo y me alegro en ti, mi Salvador, porque miraste mi pequeñez con amor. María, enséñame a alabar. Amén."},

{t:"María, madre en Belén",ref:"Lc 2, 1-7",v:"y María dio a luz a su Hijo primogénito, lo envolvió en pañales y lo acostó en un pesebre, porque no había lugar para ellos en el albergue.",
exp:"Por un censo, José y María, ya al final del embarazo, viajan de Nazaret a Belén. No encuentran lugar en la posada, y el Hijo de Dios nace en un lugar para animales. María hace lo que hace toda mamá: envuelve al bebé en pañales y lo acuesta en el lugar más seguro que encuentra.",
med:["El nacimiento de Jesús estuvo rodeado de improvisación, cansancio y falta de recursos. Aun así, María lo cuidó con lo que tenía, con todo el amor que podía dar.","Los cuidados sencillos de cada día, como el baño, la comida, cargar en brazos y la ropa limpia, también son santos. Hechos con amor, se vuelven oración y preparan un lugar para Jesús en tu casa."],
perg:"¿En qué cuidados sencillos de mi día puedo ver a Jesús?",
des:"Ofrece a Dios en voz baja cada cuidado que tengas hoy con tu familia (o contigo misma): «Es para ti, Señor». En la noche, escribe cuál te costó más ofrecer y por qué.",
ora:"María, que cuidaste a Jesús con tan poco y con tanto amor, enséñame a cuidar con paciencia y ternura. Que mi casa sea un pesebre acogedor para Jesús. Amén."},

{t:"María que guarda en el corazón",ref:"Lc 2, 15-19",v:"Mientras tanto, María conservaba estas cosas y las meditaba en su corazón.",
exp:"Los pastores, avisados por los ángeles, van a Belén y encuentran a María, a José y al Niño acostado en el pesebre. Cuentan todo lo que oyeron, y todos se quedan asombrados. María, en cambio, no se pierde en el bullicio: lo guarda todo y lo medita, es decir, une los acontecimientos y busca entender lo que Dios está haciendo.",
med:["María no lo entendía todo al momento, pero no desechaba nada. Su corazón era como un cofre donde guardaba las señales de Dios para rezar con ellas después.","Vivimos de prisa y olvidamos pronto lo que Dios ha hecho. Guardar en el corazón es detenerse, recordar y dejar que lo vivido en el día se vuelva oración."],
perg:"¿Qué ha hecho Dios en mi vida que todavía no me he detenido a meditar?",
des:"Haz hoy 10 minutos de silencio, sin celular. Recuerda lo que viviste la última semana y escribe abajo una señal de Dios que notaste y quieres guardar en tu corazón.",
ora:"María, que lo guardabas todo en tu corazón, enséñame a hacer silencio y a descubrir a Dios en lo que vivo cada día. Amén."},

{t:"María que busca a Jesús",ref:"Lc 2, 41-51",v:"Hijo mío, ¿por qué nos has hecho esto? Piensa que tu padre y yo te buscábamos angustiados",
exp:"A los 12 años, Jesús va con María y José a Jerusalén para la Pascua. Al regresar, sus padres se dan cuenta de que no está en la caravana. Lo buscan angustiados durante tres días, hasta que lo encuentran en el Templo, entre los maestros. Jesús responde que debía estar en la casa de su Padre. María no entiende, pero, una vez más, lo guarda todo en su corazón.",
med:["Hasta María pasó por la angustia, la búsqueda y la falta de respuestas. Eso nos consuela: sentir a Jesús lejos no significa que nos haya abandonado. Significa que es hora de buscarlo.","María y José regresaron y buscaron hasta encontrarlo. Cuando la vida apurada nos aleja de Jesús, el camino es volver a donde Él está: la oración, la Palabra, la Misa, la confesión."],
perg:"¿Dónde he «perdido de vista a Jesús» últimamente? ¿A dónde necesito volver?",
des:"Retoma hoy un hábito de fe que dejaste de lado (el Rosario, la lectura de la Biblia, la Misa entre semana, la confesión). Anota en tu agenda el día y la hora en que lo harás esta semana.",
ora:"María, cuando me aleje de Jesús, toma mi mano y ayúdame a encontrarlo de nuevo. Que nunca deje de buscarlo. Amén."},

{t:"María que intercede",ref:"Jn 2, 1-11",v:"Pero su madre dijo a los sirvientes: «Hagan todo lo que él les diga».",
exp:"En una boda en Caná, el vino se acaba en plena fiesta, lo que sería una gran vergüenza para los novios. María se da cuenta antes que nadie y le presenta la necesidad a Jesús: ya no tienen vino. Luego les dice a los sirvientes que hagan lo que Él les diga. Jesús convierte el agua en vino, y ese es su primer signo.",
med:["María nota lo que falta antes de que alguien se lo pida. También lo hace por tu familia: ve las necesidades de tu casa y se las presenta a Jesús.","El consejo de María sigue siendo el mismo hoy: hacer lo que Jesús nos diga. Su intercesión siempre nos lleva a obedecer a su Hijo."],
perg:"¿Qué le falta hoy a mi casa? ¿Qué «vino» se acabó?",
des:"Escribe abajo una necesidad concreta de tu familia y entrégasela a la Virgen rezando un Rosario (o al menos un misterio) por esa intención. Pregúntate también: ¿qué me está pidiendo Jesús que haga en esta situación?",
ora:"María, Madre atenta, preséntale a Jesús lo que le falta a mi familia. Y dame un corazón dispuesto a hacer todo lo que Él me diga. Amén."},

{t:"María al pie de la cruz",ref:"Jn 19, 25-27",v:"Junto a la cruz de Jesús, estaba su madre y la hermana de su madre, María, mujer de Cleofás, y María Magdalena.",
exp:"En la hora más oscura, cuando casi todos han huido, María está ahí, de pie. Desde la cruz, Jesús ve a su madre y al discípulo amado. Le entrega el discípulo a María como hijo, y María al discípulo como madre. Desde aquella hora, el discípulo la recibe en su casa. La Iglesia entiende que ahí Jesús nos dio a María como Madre.",
med:["María no pudo impedir el sufrimiento de su Hijo, pero no lo dejó solo. Quedarse de pie junto a quien sufre también es amor, a veces el más grande que podemos dar.","Ella sabe lo que es sufrir como mujer y como madre. Por eso puedes llevarle tus dolores sin miedo: ella entiende y se queda contigo."],
perg:"¿Qué dolor cargo hoy que quiero poner en las manos de María?",
des:"Piensa en una mujer que está sufriendo (una enfermedad, un duelo, un hijo alejado, un matrimonio difícil). Reza por ella hoy y, si puedes, mándale un mensaje cariñoso o hazle una visita. Simplemente acompáñala.",
ora:"María, Virgen de los Dolores, que estuviste de pie junto a la cruz, quédate conmigo en los momentos difíciles. Te recibo en mi casa, como el discípulo amado. Amén."},

{t:"María que reza con la Iglesia",ref:"Hech 1, 12-14",v:"Todos ellos, íntimamente unidos, se dedicaban a la oración, en compañía de algunas mujeres, de María, la madre de Jesús",
exp:"Después de la Ascensión de Jesús, los apóstoles vuelven a Jerusalén y se reúnen en la sala de arriba, el Cenáculo. Ahí esperan al Espíritu Santo prometido, rezando juntos. En medio de ellos está María. Ella, que recibió el Espíritu en la Anunciación, ahora acompaña en la oración a la Iglesia que está naciendo.",
med:["María no se queda en el pasado del Evangelio: sigue en medio de la Iglesia, rezando con nosotros. Donde hay una comunidad que reza, ahí está la Madre.","Al terminar estos nueve días, puedes hacer lo que hizo el discípulo amado: recibir a María en tu casa y entregarte a ella, para que siempre te lleve a Jesús."],
perg:"¿Qué aprendí de María en estos nueve días y quiero llevar a mi vida?",
des:"Haz tu consagración a la Virgen con la oración «Oh Señora mía» (pestaña Orar). Si puedes, reza un Rosario con tu familia o con otras personas, como María rezaba con los apóstoles.",
ora:"¡Oh Señora mía, oh Madre mía!, yo me ofrezco enteramente a Vos y, en prueba de mi filial afecto, os consagro en este día mis ojos, mis oídos, mi lengua, mi corazón. En una palabra, todo mi ser.\nYa que soy todo vuestro, oh Madre de bondad, guardadme y protegedme como cosa y posesión vuestra. Amén."}
]};

P.sagrada10={resumo:"Diez días para aprender de Jesús, María y José a vivir la fe en el día a día del hogar. Cada día trae una lectura explicada, una meditación, un espacio para escribir y un reto para hacer en familia.",d:[
{t:"Dios eligió una familia",ref:"Lc 2, 39-40",v:"El niño iba creciendo y se fortalecía, lleno de sabiduría, y la gracia de Dios estaba con él.",
exp:"Después de presentar a Jesús en el Templo, María y José regresan a Nazaret, un pueblito sin importancia. Ahí Jesús pasará unos 30 años, en una vida escondida, de casa y de trabajo. El Evangelio resume ese tiempo en pocas palabras: el niño crecía, y la gracia de Dios estaba con él.",
med:["Dios pudo haber venido al mundo de muchas maneras, pero eligió nacer y crecer en una familia. Eso muestra el enorme valor que la familia tiene para Él.","Tu casa, con sus rutinas, sus cansancios y sus alegrías, también puede ser un pequeño Nazaret: un lugar donde la gracia de Dios está presente en lo ordinario de cada día."],
perg:"¿Qué haría de mi casa un pequeño Nazaret?",
des:"Coloca una imagen o un cuadrito de la Sagrada Familia en un lugar especial de tu casa. Reúne a tu familia un minuto, preséntales la imagen y recen juntos: «Jesús, María y José, bendigan a nuestra familia».",
ora:"Jesús, María y José, que vivieron en Nazaret una vida sencilla y llena de amor, bendigan a mi familia y hagan de nuestra casa un hogar donde Dios habita. Amén."},

{t:"María, la madre atenta",ref:"Lc 2, 48-52",v:"El regresó con sus padres a Nazaret y vivía sujeto a ellos. Su madre conservaba estas cosas en su corazón.",
exp:"Después de encontrar a Jesús en el Templo, la familia vuelve a casa. Jesús, siendo Dios, obedece a María y a José. Y María sigue haciendo lo que siempre hizo: guardarlo todo en su corazón. Es una madre que observa, escucha y lleva a la oración la vida de su hijo.",
med:["María no era una madre distraída. Ponía atención a Jesús, aun cuando no entendía. La atención es una de las formas más bonitas del amor.","En medio de los quehaceres, es fácil mirar a los hijos (o a quienes viven en casa) solo para corregir o dar órdenes. María nos enseña a mirar para admirar, comprender y rezar por ellos."],
perg:"¿Qué he notado en las personas de mi casa que necesito llevar a la oración?",
des:"Hoy, dedica 15 minutos de atención total a uno de tus hijos, a tu esposo o a alguien de tu casa: sin celular, solo platicando o jugando. En la noche, escribe algo bonito que descubriste en ese momento.",
ora:"María, madre atenta, enséñame a mirar a mi familia con tus ojos y a guardar cada momento en mi corazón. Amén."},

{t:"José, el hombre justo",ref:"Mt 1, 18-24",v:"José, su esposo, que era un hombre justo y no quería denunciarla públicamente, resolvió abandonarla en secreto.",
exp:"José descubre que María está embarazada antes de vivir juntos. Como es un hombre justo, no quiere exponerla a la vergüenza. Mientras lo piensa, un ángel se le aparece en sueños y le explica que el hijo viene del Espíritu Santo. Al despertar, José hace lo que el ángel le mandó y recibe a María en su casa.",
med:["José es el hombre del silencio y de la acción. En el Evangelio no dice una sola palabra, pero obedece a Dios enseguida y protege a María y a Jesús con valentía.","Los hombres de tu familia, tu esposo, tu papá, tus hijos, también necesitan oración. San José es modelo y protector para ellos, y para cada familia que se pone bajo su cuidado."],
perg:"¿Qué hombres de mi familia quiero poner bajo la protección de san José?",
des:"Reza la oración a san José (pestaña Orar) por tu esposo, por tu papá o por el papá de tus hijos. Después, dile algo que admiras de él, por mensaje o en persona.",
ora:"San José, hombre justo y fiel, protege a mi familia como protegiste a Jesús y a María. Cuida a los hombres de mi casa y enséñales a confiar en Dios. Amén."},

{t:"El trabajo de Nazaret",ref:"Mt 13, 53-58",v:"¿No es este el hijo del carpintero? ¿Su madre no es la que llaman María?",
exp:"Jesús vuelve a su tierra y enseña en la sinagoga. La gente se queda admirada, pero también desconfía: conocían a Jesús como el hijo del carpintero, alguien común, que trabajaba con sus manos. Por su falta de fe, no hace ahí muchos milagros.",
med:["Durante años, Jesús trabajó con José como carpintero. El Hijo de Dios sudó, se cansó y aprendió un oficio. Eso significa que el trabajo, en casa o fuera de ella, puede ser santo.","Lavar los trastes, cuidar la ropa, cumplir una jornada de trabajo: todo puede ofrecerse a Dios. Lo que importa no es el tamaño de la tarea, sino el amor con que se hace."],
perg:"¿Qué tarea de mi día hago de mala gana y podría ofrecer a Dios?",
des:"Antes de cada tarea hoy, di en voz baja: «Es para ti, Señor». Elige la tarea que menos te gusta y hazla con esmero, rezando por alguien mientras trabajas.",
ora:"San José obrero, enséñame a trabajar con amor. Señor, santifica nuestro trabajo de cada día y haz de él una ofrenda agradable a ti. Amén."},

{t:"Jesús crecía",ref:"Lc 2, 52",v:"Jesús iba creciendo en sabiduría, en estatura y en gracia, delante de Dios y de los hombres.",
exp:"Este versículo cierra el relato de la infancia de Jesús. Muestra que Él creció de verdad, como todo niño: en su cuerpo, en su conocimiento y en su relación con Dios y con las personas. Ese crecimiento sucedió dentro de una familia, con la ayuda de María y José.",
med:["Jesús no se saltó etapas. Creció poco a poco, como nuestros hijos y como nosotras. Cada etapa tiene su belleza y su desafío.","Crecer en gracia es tan importante como crecer en estatura. La familia es el lugar donde se aprende a rezar, a perdonar y a amar a Dios."],
perg:"¿En qué quiero crecer en la fe, y en qué quiero ayudar a crecer a mi familia?",
des:"Observa algo nuevo que tu hijo (o alguien de tu casa) aprendió o logró y dale gracias a Dios en voz alta, cerca de él. Si puedes, enséñale hoy a un niño una oración corta.",
ora:"Jesús, que creciste en sabiduría y en gracia en Nazaret, bendice el crecimiento de mis hijos y de mi familia. Haznos crecer también en tu amor. Amén."},

{t:"Una familia que reza",ref:"Lc 2, 41-42",v:"Sus padres iban todos los años a Jerusalén en la fiesta de la Pascua.",
exp:"María y José eran fieles a las prácticas de su fe: cada año peregrinaban a Jerusalén, un viaje largo y cansado, para celebrar la Pascua. Cuando Jesús cumplió 12 años, fue con ellos. La fe se vivía en familia, con hábitos y compromisos.",
med:["Los hábitos de fe forman el corazón. Un niño que ve a sus papás rezar, ir a Misa y celebrar las fiestas aprende que Dios es parte de la vida, no un adorno.","No tiene que ser algo grande: una oración antes de comer, una bendición antes de dormir, la Misa del domingo juntos. Lo constante es lo que perdura."],
perg:"¿Qué hábito de oración podría empezar o retomar mi familia?",
des:"Pónganse de acuerdo en familia sobre un hábito de oración para las próximas semanas (por ejemplo, rezar antes de la cena o bendecir a los hijos antes de dormir). Empiecen hoy mismo.",
ora:"Sagrada Familia de Nazaret, que celebraban juntos las fiestas de Dios, enseñen a nuestra familia a rezar unida. Que nuestro hogar sea una pequeña iglesia. Amén."},

{t:"En las dificultades",ref:"Mt 2, 13-15",v:"José se levantó, tomó de noche al niño y a su madre, y se fue a Egipto.",
exp:"Después de la visita de los Magos, el rey Herodes quiere matar al niño. Un ángel le avisa a José en sueños, y él, en plena noche, toma a María y a Jesús y huye a Egipto. La Sagrada Familia vive como refugiada en una tierra extranjera hasta la muerte de Herodes.",
med:["La Sagrada Familia conoció el miedo, la prisa, los cambios y la incertidumbre. Por eso entiende las dificultades de nuestros hogares: la falta de dinero, la enfermedad, las mudanzas, los conflictos.","José no se quedó paralizado por el miedo: escuchó a Dios y actuó. En las dificultades, la oración no quita el problema de inmediato, pero nos muestra el siguiente paso."],
perg:"¿Cuál es hoy la mayor dificultad de mi casa? ¿Qué siguiente paso me muestra Dios?",
des:"Escribe en un papel la mayor dificultad de tu familia, ponlo a los pies de una imagen de la Sagrada Familia (o dentro de tu Biblia) y reza por ella. Da un paso concreto para enfrentarla, aunque sea pequeño.",
ora:"Sagrada Familia, que conocieron el destierro y el miedo, ayúdennos en nuestras dificultades. San José, guía a nuestra familia por el buen camino. Amén."},

{t:"Buscar juntos a Jesús",ref:"Lc 2, 43-46",v:"Al tercer día, lo hallaron en el Templo en medio de los doctores de la Ley, escuchándolos y haciéndoles preguntas.",
exp:"Al volver de Jerusalén, María y José se dan cuenta de que Jesús no está con ellos. Regresan y lo buscan durante tres días, hasta encontrarlo en el Templo, la casa de Dios. No se rindieron: buscaron juntos hasta hallarlo.",
med:["A veces toda la familia se distrae y pierde de vista a Jesús en medio de las prisas. Le pasa a todo el mundo; hasta le pasó a la Sagrada Familia.","El secreto es buscar juntos, y buscar en el lugar correcto: en la casa de Dios, en la oración, en la Palabra. Una familia que busca unida a Jesús siempre lo encuentra."],
perg:"¿Cómo puede mi familia buscar junta a Jesús esta semana?",
des:"Visiten juntos una iglesia, aunque sea cinco minutos, o vayan a Misa en familia. Si se puede, dejen que los niños prendan una veladora y hagan una petición.",
ora:"Jesús, que nuestra familia siempre te busque y te encuentre. Cuando nos perdamos, llévanos de regreso a la casa del Padre. Amén."},

{t:"El silencio de Nazaret",ref:"1 Rey 19, 11-13",v:"Después del fuego, se oyó el rumor de una brisa suave.",
exp:"El profeta Elías, cansado y con miedo, se esconde en una cueva del monte Horeb. Dios le pide que salga a su encuentro. Pasa un viento fuerte, luego un terremoto y un fuego, pero Dios no estaba en ellos. Después llega una brisa suave, y es ahí donde Elías percibe la presencia de Dios y se cubre el rostro.",
med:["Muchas veces Dios habla bajito, en una brisa suave. La casa de Nazaret era sencilla y silenciosa, y fue en ese silencio donde la Sagrada Familia escuchó la voz de Dios.","En nuestras casas hay mucho ruido: la televisión, el celular, las prisas. Un poco de silencio en familia nos ayuda a escuchar a Dios y también a escucharnos unos a otros."],
perg:"¿Qué ruidos podría reducir en mi casa para escuchar mejor a Dios?",
