<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}/* Layout: coluna única de celular (máx. 480px), cartões brancos com contorno pontilhado pastel, barra de abas fixa embaixo */
:root{
  /* Paleta mariana: azul claro, azul-marinho e caramelo; as cores litúrgicas ficam à parte (--lit-*) */
  --fundo:#FFFFFF;
  --tinta:#6E5440;      /* texto corrido, caramelo escuro */
  --titulo:#2F4C7C;     /* títulos azul-marinho */
  --suave:#A88C70;      /* legendas caramelo */
  --rosa:#5F87BC;       /* destaque azul mariano (nome antigo mantido) */
  --mao:#B98450;        /* letra manuscrita caramelo */
  --linha:#E7EDF5;
  --lil:#ECEEFA; --lil2:#AEB6E0;    /* azul-lavanda */
  --pk:#EAF1FA;  --pk2:#A9C4E6;     /* azul bem claro (padrão) */
  --az:#E3EEF9;  --az2:#8FB3DD;     /* azul claro */
  --ceu:#EEF6FC; --ceu2:#B2D1EE;    /* céu */
  --car:#F6ECDF; --car2:#D9B48C;    /* caramelo claro */
  --am:#FAF2E0;  --am2:#E0BE7C;     /* dourado */
  --vd:#ECF4F8;  --vd2:#A9C9DD;
  --lit-roxo:#B9A3DA; --lit-roxo-c:#F1EAF7;
  --lit-rosa:#EDA7B2; --lit-rosa-c:#FBE6E9;
  --lit-branco:#E3C25E; --lit-branco-c:#FCF4D6;
  --lit-verde:#A6C9A0; --lit-verde-c:#E4F0E2;
  --lit-verm:#E07F8E; --lit-verm-c:#FBE3E6;
  --verde-acao:#34578E;  /* botão principal: azul-marinho */
  --f-tit:"Fraunces",Georgia,"Times New Roman",serif;
  --f-txt:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mao:"Caveat","Segoe Print","Bradley Hand",cursive;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--fundo)}
body{margin:0;color:var(--tinta);font-family:var(--f-txt);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--rosa);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

#app{max-width:480px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-top:6px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;padding-block:8px 0}
.marca{font-family:var(--f-txt);font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--suave);display:flex;align-items:center;gap:7px}
.marca svg{width:16px;height:16px;color:var(--rosa)}
.icbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--titulo)}
.icbtn:active{background:var(--pk)}
.sub{display:flex;align-items:center;gap:6px;padding-block:6px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--fundo);z-index:5;margin-inline:-6px;padding-inline:0 6px}
.sub .icbtn{flex:none}
.sub span{font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

h1,h2,h3{font-family:var(--f-tit);color:var(--titulo);margin:0;line-height:1.15;text-wrap:balance;font-weight:700}
h1{font-size:30px;letter-spacing:-.01em}
h2{font-size:21px}
h3{font-size:17px}
p{margin:0}
.mao{font-family:var(--f-mao);color:var(--mao);font-size:24px;line-height:1.1}
.mini{font-size:12px;color:var(--suave)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--suave)}
.tag{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:var(--tg,var(--pk));color:var(--titulo);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border-radius:99px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}

/* cores pastel por tema */
.c-lilas{--bg:var(--lil);--bd:var(--lil2);--tg:var(--lil)}
.c-rosa{--bg:var(--car);--bd:var(--car2);--tg:var(--car)}
.c-azul{--bg:var(--az);--bd:var(--az2);--tg:var(--az)}
.c-verde{--bg:var(--ceu);--bd:var(--ceu2);--tg:var(--ceu)}
.c-amarelo{--bg:var(--am);--bd:var(--am2);--tg:var(--am)}

/* cartões */
.card{background:#fff;border:1.6px dashed var(--bd,var(--pk2));border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card.cheio{background:var(--bg);border-style:solid;border-color:transparent}
.card p{font-size:15px}

/* olá */
.ola{display:flex;flex-direction:column;gap:2px;padding-top:4px}
.ola h1{font-size:28px}

/* faixa do tempo litúrgico */
.tempo{background:var(--bg);border-radius:22px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.tempo .txt{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.tempo .tag{background:#fff}
.tempo p{font-size:14px}
.tempo p span{display:block;margin-top:3px;font-size:14.5px;font-weight:500;color:var(--tinta)}
.tempo b{font-family:var(--f-tit);color:var(--titulo);font-size:19px;font-weight:700;display:block;line-height:1.2}
.velas{display:flex;gap:6px;align-items:flex-end;flex:none}
.velas svg{width:16px;height:46px}

.corlit{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--suave)}
.corlit i{width:10px;height:10px;border-radius:50%;display:inline-block}
.santo{font-size:14px}
.santo b{color:var(--titulo);font-weight:600}

/* botões */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--verde-acao);color:#fff;font-weight:600;font-size:15px;border-radius:99px;padding:14px 20px;text-align:center;text-decoration:none;width:100%}
.btn svg{width:18px;height:18px}
.btn:active{filter:brightness(.95)}
.btn.sec{background:#fff;color:var(--titulo);border:1.6px solid var(--az2)}
.btn.rosa{background:var(--rosa)}
.marca svg{color:var(--mao)}
.btn.peq{padding:9px 16px;font-size:13.5px;width:auto}
.lnk{color:var(--rosa);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.feito{display:inline-flex;align-items:center;gap:6px;color:var(--verde-acao);font-weight:600;font-size:13px}
.feito svg{width:18px;height:18px}

blockquote{margin:0;font-family:var(--f-tit);font-style:italic;font-weight:500;font-size:19px;line-height:1.4;color:var(--titulo)}
cite{font-style:normal;font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--mao)}

/* semana */
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.semana span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--suave)}
.semana i{width:30px;height:30px;border-radius:50%;border:1.6px dashed var(--pk2);display:grid;place-items:center;color:#fff}
.semana i.ok{background:var(--rosa);border-color:var(--rosa)}
.semana i.hj{border-style:solid}
.semana i svg{width:16px;height:16px}

/* atalhos */
.atalhos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.atalho{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;text-align:center;line-height:1.25}
.atalho span{width:56px;height:56px;border-radius:18px;background:var(--bg);display:grid;place-items:center;color:var(--titulo)}
.atalho svg{width:26px;height:26px}

/* passos numerados (momento, novena) */
.passos{display:flex;flex-direction:column;gap:14px}
.passo{display:grid;grid-template-columns:30px 1fr;gap:12px}
.passo .n{width:30px;height:30px;border-radius:50%;background:var(--az);color:var(--titulo);font-family:var(--f-tit);font-weight:700;display:grid;place-items:center;font-size:15px}
.passo .c{display:flex;flex-direction:column;gap:8px;min-width:0;padding-top:3px}
.passo h3{font-size:16px}

textarea,input[type=text],input[type=date]{width:100%;font:inherit;font-size:15px;color:var(--tinta);background:#fff;border:1.6px dashed var(--pk2);border-radius:16px;padding:12px 14px;resize:vertical;background-image:repeating-linear-gradient(transparent 0 29px,var(--linha) 29px 30px);background-position:0 10px;line-height:30px}
input[type=text],input[type=date]{background-image:none;line-height:1.4}
textarea:focus,input:focus{outline:none;border-style:solid;border-color:var(--rosa)}
label.lb{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-inline:-18px;padding-inline:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1.4px solid var(--linha);font-size:13px;font-weight:600;color:var(--suave);background:#fff;white-space:nowrap}
.chip.on{background:var(--pk);border-color:var(--pk);color:var(--titulo)}
.chip[disabled]{opacity:.55;cursor:default}

/* planos */
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{background:var(--bg);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:168px;position:relative}
.pcard .pic{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--titulo)}
.pcard .pic svg{width:24px;height:24px}
.pcard .ptit{font-family:var(--f-tit);font-weight:700;color:var(--titulo);font-size:16px;line-height:1.2}
.pcard .pdias{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta);opacity:.75}
.pcard .novo{position:absolute;top:12px;right:12px;font-family:var(--f-mao);color:var(--mao);font-size:19px;line-height:1}
.barra{height:7px;border-radius:9px;background:#fff;overflow:hidden;margin-top:auto}
.barra i{display:block;height:100%;background:var(--rosa);border-radius:9px}
.card .barra{background:var(--pk)}
.andamento{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:18px;padding:12px 14px;width:100%}
.andamento .pic{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--titulo);flex:none}
.andamento .t{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.andamento b{font-family:var(--f-tit);color:var(--titulo);font-size:15px;line-height:1.2}
.andamento small{font-size:12px}

.phero{background:var(--bg);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.phero .tag{background:#fff}
.phero .pic{width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--titulo)}
.phero .pic svg{width:28px;height:28px}

.dias{display:flex;flex-direction:column}
.dia-row{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1.4px dashed var(--linha);width:100%}
.dia-row:last-child{border-bottom:0}
.dia-row .t{display:flex;flex-direction:column;min-width:0;flex:1}
.dia-row small{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.dia-row b{font-weight:600;font-size:14.5px;color:var(--tinta)}
.chk{width:28px;height:28px;border-radius:50%;border:1.6px dashed var(--bd,var(--pk2));display:grid;place-items:center;flex:none;color:#fff}
.chk.ok{background:var(--rosa);border:0}
.chk svg{width:16px;height:16px}
.dia-row .seta{color:var(--suave)}
.dia-row .seta svg{width:18px;height:18px}

.bloco{display:flex;flex-direction:column;gap:6px}
.oracao-txt{white-space:pre-line;font-size:16px;line-height:1.7}
.oracao-curta{font-family:var(--f-tit);font-style:italic;font-size:17px;color:var(--titulo);line-height:1.45}
.navdias{display:flex;justify-content:space-between;gap:10px}

/* listas de orações */
.lista{display:flex;flex-direction:column;background:#fff;border:1.6px dashed var(--bd,var(--pk2));border-radius:20px;padding:4px 16px}
.lista .item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1.4px dashed var(--linha);width:100%}
.lista .item:last-child{border-bottom:0}
.lista .item b{flex:1;font-weight:600;font-size:14.5px}
.lista .item small{display:block;font-weight:500;font-size:12px;color:var(--suave)}
.lista .item svg{color:var(--suave);width:18px;height:18px}
details.item{display:block}
details.item summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:600;font-size:14.5px}
details.item summary::-webkit-details-marker{display:none}
details.item summary b{flex:1}
details.item p{padding-top:8px;white-space:pre-line}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{background:var(--bg);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mcard .pic{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--titulo)}
.mcard b{font-family:var(--f-tit);color:var(--titulo);font-size:17px;line-height:1.15}
.mcard small{font-size:12.5px;line-height:1.35}

/* terço */
.terco-top{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.contas{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;padding-block:6px}
.contas i{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--az2);background:#fff;transition:background .2s,transform .2s}
.contas i.g{width:26px;height:26px}
.contas i.ok{background:var(--az2)}
.contas i.at{background:var(--titulo);border-color:var(--titulo);transform:scale(1.15)}
.terco-orar{min-height:200px}
.terco-orar h2{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.terco-orar h2 small{font-family:var(--f-mao);color:var(--mao);font-size:22px;font-weight:400}
.terco-bts{display:grid;grid-template-columns:auto 1fr;gap:10px}
.terco-bts .btn.sec{width:auto;padding-inline:18px}
.misterio{background:var(--lil);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px}

/* novenas */
.nove{display:flex;gap:6px}
.nove i{width:24px;height:24px;border-radius:50%;border:1.6px dashed var(--bd,var(--lil2));display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:600;color:var(--suave)}
.nove i.ok{background:var(--rosa);border:0;color:#fff}

/* pedidos */
.pedido{display:flex;flex-direction:column;gap:6px}
.pedido .para{font-family:var(--f-mao);color:var(--mao);font-size:22px;line-height:1}
.pedido .acoes{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.vazio{text-align:center;padding:22px 10px;display:flex;flex-direction:column;gap:6px;align-items:center}
.vazio svg{width:34px;height:34px;color:var(--pk2)}

/* rotina kids */
.rotina{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rot{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;border:1.6px dashed var(--am2);font-size:13.5px;font-weight:600;line-height:1.25}
.rot svg{width:22px;height:22px;color:var(--titulo)}
.rot.ok{background:var(--am);border-style:solid;border-color:var(--am)}
.estrelas{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.estrelas span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--suave)}
.estrelas b{font-family:var(--f-tit);color:var(--titulo);font-size:15px}
.estrelas svg{width:18px;height:18px;color:var(--am2)}
.estrelas .cheia svg{fill:var(--am2)}
.historia{white-space:pre-line;font-size:16.5px;line-height:1.75}
.conversa{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* calendário */
.mesnav{display:flex;align-items:center;justify-content:space-between}
.mesnav h2{text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .ds{font-size:10.5px;font-weight:600;color:var(--suave);padding-bottom:4px}
.cal button{aspect-ratio:1;max-width:100%;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.cal button i{width:6px;height:6px;border-radius:50%}
.cal button.esp{font-weight:700;color:var(--titulo)}
.cal button.dom{color:var(--mao)}
.cal button.hj{border:1.6px solid var(--rosa)}
.cal button.sel{background:var(--pk)}
.cal button:disabled{opacity:.35}
.legenda{display:flex;flex-direction:column;gap:10px}
.legenda div{display:grid;grid-template-columns:14px 1fr;gap:10px;align-items:start;font-size:13.5px;line-height:1.4}
.legenda i{width:12px;height:12px;border-radius:50%;margin-top:3px}
.legenda b{display:block;color:var(--titulo);font-weight:600}
.cores-leg summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.cores-leg summary::-webkit-details-marker{display:none}
.cores-leg summary svg{width:18px;height:18px;color:var(--suave);transform:rotate(90deg);transition:transform .2s}
.cores-leg:not([open]) summary svg{transform:none}
.datas{display:flex;flex-direction:column;gap:2px}
.datas button{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1.4px dashed var(--linha);width:100%}
.datas button:last-child{border-bottom:0}
.datas .d{font-family:var(--f-mao);color:var(--mao);font-size:24px;line-height:1;min-width:30px}
.datas b{font-weight:600;font-size:14px}

/* aviso de confirmação */
.confirma{background:var(--pk);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px}

/* barra de abas */
#nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1.6px dashed var(--linha);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));z-index:20}
#nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--suave);padding:6px 0;text-align:center}
#nav button svg{width:24px;height:24px}

#nav button.on span{background:var(--pk);border-radius:99px;padding:2px 12px}

#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--titulo);color:#fff;font-weight:600;font-size:14px;padding:12px 18px;border-radius:99px;opacity:0;transition:opacity .25s,transform .25s;z-index:30;max-width:calc(100% - 40px);text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

.sep{height:0;border-top:1.6px dashed var(--linha)}
.rodape{text-align:center;padding-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Pontos de quebra em azul-marinho: 1 ou 2 por tela, sempre o foco principal */
.escuro{--esc:#2B4774;background:var(--esc);color:#F3F7FC;border:0;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;outline:1.4px dashed rgba(255,255,255,.32);outline-offset:-8px}
.escuro h1,.escuro h2,.escuro h3,.escuro b{color:#fff}

.escuro cite,.escuro .mao{color:#E9C99E}

.escuro .sep{border-color:rgba(255,255,255,.22)}

/* dia completo dos desafios */

.dpal .mini{color:var(--tinta)}

.bloco p+p{margin-top:6px}

select{width:100%;font:inherit;font-size:17px;font-weight:600;color:var(--titulo);background:#fff;border:1.6px dashed var(--pk2);border-radius:16px;padding:12px 14px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--titulo) 50%),linear-gradient(135deg,var(--titulo) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat}

#lembrete{scroll-margin-top:72px}

"2026-11-23":{v:"pero ella, de su indigencia, dio todo lo que tenía para vivir.",r:"Lc 21, 4",p:"La viuda dio poco, pero lo dio todo. Dios no mide el tamaño de la ofrenda; mide el tamaño del amor.",q:"¿Qué cosa «pequeña» de mi vida puedo ofrecer hoy con mucho amor?",o:"Señor, recibe lo poco que soy hoy. En tus manos, se vuelve mucho."},
"2026-11-24":{v:"Tengan bien presente que no deberán preparar su defensa…",r:"Lc 21, 14",p:"En los momentos difíciles, Dios mismo pone en nuestros labios las palabras justas. No tenemos que ensayarlo todo solas.",q:"¿Qué conversación me preocupa y todavía no le he entregado a Dios?",o:"Espíritu Santo, habla por mí cuando yo no sepa qué decir."},
"2026-11-25":{v:"Gracias a la constancia salvarán sus vidas.",r:"Lc 21, 19",p:"Perseverar es seguir adelante, aunque sea despacio. La fe de una mamá está hecha de pequeños recomienzos cada día.",q:"¿En qué necesito perseverar, aunque esté cansada?",o:"Señor, dame perseverancia para seguir haciendo el bien, un día a la vez."},
"2026-11-26":{v:"tengan ánimo y levanten la cabeza, porque está por llegarles la liberación.",r:"Lc 21, 28",p:"Dios no quiere que vivamos cabizbajas. Aun en medio de las dificultades, él ya viene a socorrernos.",q:"¿Qué me ha tenido cabizbaja últimamente?",o:"Padre, levanta mi mirada hacia ti. Confío en que estás cerca."},
"2026-11-27":{v:"Hagan todo lo que él les diga.",r:"Jn 2, 5",p:"El consejo de María es sencillo: escuchar a Jesús y hacer lo que él nos diga. Ella siempre nos acerca a su Hijo.",q:"¿Qué me ha estado pidiendo Jesús que sigo dejando para después?",o:"María, Madre mía, enséñame a hacer todo lo que Jesús me diga."},
"2026-11-28":{v:"Estén prevenidos y oren incesantemente",r:"Lc 21, 36",p:"Mañana comienza el Adviento. Es tiempo de preparar la casa y, más todavía, el corazón.",q:"¿Cómo quiero llegar a la Navidad de este año?",o:"Señor, prepara mi corazón para recibirte en este Adviento."},

"2026-11-30":{v:"Síganme, y yo los haré pescadores de hombres.",r:"Mt 4, 19",p:"Andrés dejó las redes en ese mismo instante. A veces seguir a Jesús empieza con un pequeño «sí» en medio del trabajo.",q:"¿Qué «red» necesito soltar para seguir a Jesús más de cerca?",o:"Jesús, quiero seguirte hoy, aun en medio de las tareas de la casa."},
"2026-12-01":{v:"El lobo habitará con el cordero",r:"Is 11, 6",p:"El sueño de Dios es la paz. Una paz que empieza dentro de nosotras y se extiende por toda la casa.",q:"¿Dónde está faltando la paz en mi hogar?",o:"Príncipe de la Paz, haz tu morada en mi hogar y calma nuestros corazones."},
"2026-12-02":{v:"Me da pena esta multitud…",r:"Mt 15, 32",p:"Jesús se da cuenta del cansancio y del hambre de la gente. También se da cuenta de tu cansancio.",q:"¿De qué tengo «hambre» hoy: de descanso, de cariño, de silencio?",o:"Señor, tú conoces mi cansancio. Aliméntame con tu presencia."},

"2026-12-04":{v:"Que suceda como ustedes han creído",r:"Mt 9, 29",p:"Los ciegos insistieron y Jesús los sanó. La fe que insiste no le molesta a Dios; le conmueve el corazón.",q:"¿Por qué petición necesito seguir insistiendo con fe?",o:"Señor, aumenta mi fe. Sigo esperando en ti."},
"2026-12-05":{v:"Ustedes han recibido gratuitamente, den también gratuitamente.",r:"Mt 10, 8",p:"Todo lo que tenemos lo recibimos de Dios. Dar con generosidad es devolverle un poquito de lo mucho que él nos da.",q:"¿Qué he recibido gratis que puedo compartir hoy?",o:"Padre, dame un corazón generoso, que comparta con alegría."},
"2026-12-06":{v:"Preparen el camino del Señor, allanen sus senderos",r:"Mc 1, 3",p:"Preparar el camino es quitar las piedras: un resentimiento, un mal hábito, unas prisas que no dejan espacio para Dios.",q:"¿Qué «piedra» quiero quitar del camino antes de Navidad?",o:"Señor, ayúdame a preparar el camino para que llegues hasta mí."},
"2026-12-07":{v:"Hombre, tus pecados te son perdonados",r:"Lc 5, 20",p:"Antes de sanar el cuerpo, Jesús sana el corazón. El perdón de Dios es el regalo más grande que podemos recibir en Adviento.",q:"¿Hay algo que necesito llevar a la Confesión antes de Navidad?",o:"Jesús misericordioso, confío en tu perdón. Renueva mi corazón."},
"2026-12-08":{v:"¡Alégrate!, llena de gracia, el Señor está contigo.",r:"Lc 1, 28",p:"Desde el primer instante, Dios preparó a María para ser la casa de Jesús. Hoy celebramos la Inmaculada Concepción. Ella nos ayuda a ser también casa de Jesús.",q:"¿Qué quiero pedirle a la Virgen María por mi familia?",o:"Inmaculada Concepción, Madre querida, te consagro mi casa y a mis hijos."},
"2026-12-09":{v:"Vengan a mí todos los que están afligidos y agobiados, y yo los aliviaré.",r:"Mt 11, 28",p:"Jesús no nos pide que lleguemos a él ya descansadas. Nos pide que lleguemos tal como estamos.",q:"¿Qué está pesando hoy sobre mis hombros?",o:"Jesús, vengo tal como estoy. Dame tu descanso."},
"2026-12-10":{v:"Yo soy el Señor, tu Dios, el que te instruye para tu provecho",r:"Is 48, 17",p:"Dios es el mejor maestro. Nos enseña con paciencia, como nosotras enseñamos a nuestros hijos.",q:"¿Qué me ha estado enseñando Dios en este tiempo?",o:"Señor, enséñame tu camino y yo andaré por él."},
"2026-12-11":{v:"Pero la Sabiduría ha quedado justificada por sus obras.",r:"Mt 11, 19",p:"La sabiduría de Dios se nota más en lo que hacemos que en lo que decimos.",q:"¿Qué actitud mía muestra hoy que soy de Dios?",o:"Señor, que mis actitudes hablen de ti."},
"2026-12-12":{v:"¿Acaso no estoy yo aquí que soy tu madre?",r:"Nuestra Señora de Guadalupe a san Juan Diego",p:"Hoy celebramos a Nuestra Señora de Guadalupe, Patrona de América. María le dijo a Juan Diego que estaba en el cruce de sus brazos. Tú también estás en los brazos de la Madre.",q:"¿Qué preocupación quiero poner en los brazos de la Virgen María?",o:"Madre de Guadalupe, me pongo en tus brazos con todo lo que me preocupa."},
"2026-12-13":{v:"Alégrense siempre en el Señor. … El Señor está cerca.",r:"Flp 4, 4-5",p:"La alegría cristiana no depende de que todo esté perfecto. Nace de saber que Dios está cerca.",q:"¿Cuáles son tres motivos de alegría que tengo hoy?",o:"Señor, llena mi casa de la alegría que viene de ti."},
"2026-12-14":{v:"A la tarde te examinarán en el amor.",r:"San Juan de la Cruz",p:"Al final, lo que importa no es la casa perfecta ni la agenda llena. Es el amor que ponemos en cada cosa.",q:"¿En qué tarea de hoy puedo poner más amor?",o:"Señor, que haga las cosas pequeñas con un gran amor."},
"2026-12-15":{v:"Les aseguro que los publicanos y las prostitutas llegan antes que ustedes al Reino de Dios.",r:"Mt 21, 31",p:"Dios valora a quien se arrepiente y cambia de verdad. Nunca es tarde para volver a empezar.",q:"¿En qué quiero volver a empezar antes de Navidad?",o:"Señor, gracias porque siempre puedo volver a empezar contigo."},
"2026-12-16":{v:"los ciegos ven, los paralíticos caminan, … la Buena Noticia es anunciada a los pobres.",r:"Lc 7, 22",p:"A Jesús se le reconoce por el bien que hace. Sus señales también aparecen en nuestra casa.",q:"¿Qué señal del amor de Dios vi esta semana?",o:"Jesús, abre mis ojos para ver tus señales en mi casa."},

"2026-12-20":{v:"Yo soy la servidora del Señor, que se cumpla en mí lo que has dicho.",r:"Lc 1, 38",p:"El «sí» de María cambió la historia. Nuestro pequeño «sí» de cada día también cambia nuestro hogar.",q:"¿A qué quiero decirle «sí» a Dios en esta semana de Navidad?",o:"Señor, como María, te digo que sí: que se haga en mí tu voluntad."},

"2026-12-22":{v:"Mi alma canta la grandeza del Señor…",r:"Lc 1, 46",p:"María canta las maravillas de Dios. La gratitud es la forma más bonita de orar.",q:"¿Qué maravillas ha hecho Dios en mi vida este año?",o:"Señor, como María, mi alma te alaba, porque has hecho maravillas en mí."},
"2026-12-23":{v:"Su nombre es Juan",r:"Lc 1, 63",p:"Zacarías volvió a hablar cuando confió en Dios. La confianza libera nuestra voz para alabar.",q:"¿Dónde me he quedado «muda» por miedo o desconfianza?",o:"Señor, libera mi voz para alabarte y para decir palabras de vida."},
"2026-12-24":{v:"gracias a la misericordiosa ternura de nuestro Dios, que nos traerá del cielo la visita del Sol naciente…",r:"Lc 1, 78",p:"Esta noche llega la luz. No importa qué tan oscuro haya sido el año: Jesús viene a iluminar.",q:"¿Qué oscuridad quiero que la luz de Jesús ilumine esta noche?",o:"¡Ven, Niño Jesús! Nace en mi corazón y en mi casa esta noche."},
"2026-12-25":{v:"Hoy, en la ciudad de David, les ha nacido un Salvador, que es el Mesías, el Señor.",r:"Lc 2, 11",p:"Dios se hizo pequeño para que nadie tuviera miedo de acercarse a él. Cabe en un pesebre y cabe en tu corazón.",q:"¿Qué le quiero decir al Niño Jesús en esta Navidad?",o:"Niño Jesús, gracias por venir a vivir con nosotros. ¡Feliz Navidad, Señor mío!"},

"2026-12-27":{v:"Jesús iba creciendo en sabiduría, en estatura y en gracia, delante de Dios y de los hombres.",r:"Lc 2, 52",p:"Jesús creció en una casa sencilla, con rutina, trabajo y oración. Nuestra casa también puede ser santa.",q:"¿Qué costumbre de la casa de Nazaret quiero traer a mi casa?",o:"Jesús, María y José, que mi familia se parezca a la suya."},

"2026-12-30":{v:"Y hablaba acerca del niño a todos los que esperaban la redención de Jerusalén.",r:"Lc 2, 38",p:"Ana, anciana y llena de fe, no se guardó la alegría para sí. Se la contó a todos.",q:"¿A quién puedo contarle algo bueno que Dios ha hecho por mí?",o:"Señor, que hable de ti con alegría, como la profetisa Ana."},
"2026-12-31":{v:"Den gracias a Dios en toda ocasión",r:"1 Tes 5, 18",p:"Termina el año dando gracias: por los días buenos, por los difíciles y por todo lo que Dios te enseñó en el camino.",q:"¿Cuáles fueron las gracias más grandes de 2026 para mí y para mi familia?",o:"Gracias, Señor, por cada día de este año. Pongo 2026 en tus manos."},
"2027-01-01":{v:"Mientras tanto, María conservaba estas cosas y las meditaba en su corazón.",r:"Lc 2, 19",p:"El año comienza con María, la Madre de Dios. Ella nos enseña a guardar y meditar, no a correr y preocuparnos.",q:"¿Qué quiero guardar en mi corazón en 2027?",o:"Santa María, Madre de Dios, te entrego este nuevo año y a mi familia."},
"2027-01-02":{v:"Yo soy una voz que grita en el desierto",r:"Jn 1, 23",p:"Juan el Bautista sabía quién era y quién no era. Saber que no tenemos que serlo todo nos da paz.",q:"¿Qué no necesito cargar sola este año?",o:"Señor, ayúdame a ser solo lo que tú quieres que yo sea."},
"2027-01-03":{v:"Porque vimos su estrella en Oriente y hemos venido a adorarlo",r:"Mt 2, 2",p:"Los Magos caminaron mucho para adorar a Jesús. La adoración es el mejor lugar para comenzar el año.",q:"¿Qué «estrella» ha usado Dios para guiarme?",o:"Jesús, vengo a adorarte. Guía mis pasos este año."},
"2027-01-04":{v:"Vengan y lo verán",r:"Jn 1, 39",p:"Jesús no les da una charla a sus discípulos; los invita a estar con él. La fe es convivir con él.",q:"¿Cómo quiero pasar más tiempo con Jesús este año?",o:"Jesús, quiero ir a ver dónde vives. Quiero estar contigo todos los días."},
"2027-01-05":{v:"Ven y verás",r:"Jn 1, 46",p:"Felipe no discutió con Natanael; simplemente lo invitó. Una invitación sencilla es la mejor forma de evangelizar.",q:"¿A quién puedo invitar a acercarse más a Dios?",o:"Señor, dame valor para invitar con cariño."},

"2027-01-08":{v:"Denles de comer ustedes mismos",r:"Mc 6, 37",p:"Los discípulos pensaban que tenían muy poco. En las manos de Jesús, cinco panes alimentaron a miles.",q:"¿Qué creo que es muy poco y puedo entregarle a Jesús?",o:"Señor, multiplica lo poco que tengo: mi tiempo, mis fuerzas, mi amor."},
"2027-01-09":{v:"Tranquilícense, soy yo; no teman",r:"Mc 6, 50",p:"En medio del viento en contra, Jesús viene caminando sobre el agua. Él llega en medio de la tormenta.",q:"¿Qué miedo quiero entregarle hoy a Jesús?",o:"Jesús, cuando tenga miedo, que escuche tu voz que me da ánimo y me dice que estás aquí."},
"2027-01-10":{v:"Tú eres mi Hijo muy querido, en ti tengo puesta toda mi predilección",r:"Mc 1, 11",p:"En el Bautismo, Dios dijo esto también de ti: hija amada. Antes de cualquier cosa que hagas, eres amada.",q:"¿Cómo sería vivir este día creyendo que soy hija amada de Dios?",o:"Padre, gracias por llamarme hija. Ayúdame a vivir como tu hija amada."},
"2027-01-11":{v:"El tiempo se ha cumplido: el Reino de Dios está cerca.",r:"Mc 1, 15",p:"El Tiempo Ordinario no es un tiempo sin gracia. Es el tiempo de crecer en la fe en las cosas de todos los días.",q:"¿En qué quiere Dios crecer en mí durante este Tiempo Ordinario?",o:"Señor, haz crecer tu Reino en mí, en medio de la vida de cada día."},
"2027-01-12":{v:"porque les enseñaba como quien tiene autoridad y no como los escribas.",r:"Mc 1, 22",p:"La palabra de Jesús tiene fuerza. Cuando la dejamos entrar, nos transforma por dentro.",q:"¿Qué palabra de Jesús quiero repetir hoy?",o:"Jesús, habla a mi corazón. Tu palabra me basta."},
"2027-01-13":{v:"Todos te andan buscando",r:"Mc 1, 37",p:"Aunque todos lo buscaban, Jesús salía de madrugada a orar. La oración es la fuente de todo.",q:"¿Cuál es mi mejor momento del día para orar?",o:"Señor, ayúdame a guardar un tiempo solo para ti, todos los días."},
"2027-01-14":{v:"Si quieres, puedes purificarme",r:"Mc 1, 40",p:"El leproso se acercó con humildad y Jesús lo tocó. Él no siente asco de nuestras heridas.",q:"¿Qué herida quiero mostrarle a Jesús?",o:"Señor, sé que puedes sanarme. Confío en tu toque."},
"2027-01-15":{v:"Al ver la fe de esos hombres, Jesús dijo al paralítico: «Hijo, tus pecados te son perdonados».",r:"Mc 2, 5",p:"La fe de sus amigos llevó al paralítico hasta Jesús. Tu fe también carga a tu familia.",q:"¿A quién estoy «cargando» hasta Jesús en la oración?",o:"Jesús, te presento a las personas que amo. Sana y bendice a cada una."},
"2027-01-16":{v:"Yo no he venido a llamar a los justos, sino a los pecadores.",r:"Mc 2, 17",p:"Jesús es médico. No espera a que estemos bien para acercarse a nosotras.",q:"¿En qué necesito dejar que Jesús me cuide?",o:"Jesús, médico de mi alma, cuida de mí."},
"2027-01-17":{v:"Habla, Señor, porque tu servidor escucha",r:"1 Sam 3, 9",p:"Samuel aprendió a escuchar a Dios desde niño. ¿Cuánto silencio hay en nuestra casa para escuchar?",q:"¿Cómo puedo crear un poco de silencio en mi día?",o:"Señor, aquí estoy: háblame, que tu hija te escucha."},
"2027-01-18":{v:"¡A vino nuevo, odres nuevos!",r:"Mc 2, 22",p:"Dios quiere hacer cosas nuevas, pero necesitamos un corazón abierto para recibirlas.",q:"¿Qué cosa nueva quiere hacer Dios en mí?",o:"Señor, renueva mi corazón para recibir lo nuevo."},
"2027-01-19":{v:"El sábado ha sido hecho para el hombre…",r:"Mc 2, 27",p:"Descansar también es obedecer a Dios. Una mamá descansada ama mejor.",q:"¿Cómo puedo descansar un poco esta semana?",o:"Señor, enséñame a descansar en ti sin culpa."},
"2027-01-20":{v:"Sé fiel hasta la muerte y te daré la corona de la vida.",r:"Apoc 2, 10",p:"San Sebastián fue fiel hasta el final. La fidelidad de cada día, en las cosas pequeñas, también es heroica.",q:"¿En qué cosa pequeña puedo ser fiel hoy?",o:"San Sebastián, ruega por nosotros y por la fidelidad de mi familia."},
"2027-01-21":{v:"lo que el mundo tiene por débil, para confundir a los fuertes…",r:"1 Cor 1, 27",p:"Santa Inés era apenas una niña, pero tenía un corazón enorme. Dios actúa a través de los pequeños.",q:"¿En qué me siento débil y puedo dejar que Dios actúe?",o:"Señor, tu fuerza se muestra en mi debilidad."},
"2027-01-22":{v:"Después subió a la montaña y llamó a su lado a los que quiso.",r:"Mc 3, 13",p:"Fuiste llamada por tu nombre. Jesús te quiso tal como eres.",q:"¿A qué me está llamando Jesús en esta etapa de mi vida?",o:"Jesús, gracias por llamarme. Aquí estoy."},
"2027-01-23":{v:"No tienen vino",r:"Jn 2, 3",p:"María se da cuenta de lo que falta antes que nadie y se lo lleva a Jesús. Lo hace también por tu casa.",q:"¿Qué está faltando hoy en mi casa?",o:"María, mira mi casa y preséntale a Jesús lo que nos falta."},
"2027-01-24":{v:"Tu palabra es una lámpara para mis pasos, y una luz en mi camino.",r:"Sal 119, 105",p:"La Biblia no es un libro para el estante. Es luz para el paso de hoy.",q:"¿Qué pasaje de la Biblia quiero leer con mis hijos?",o:"Señor, que tu Palabra ilumine cada paso de mi familia."},
"2027-01-25":{v:"¿Qué debo hacer, Señor?",r:"Hech 22, 10",p:"Pablo cayó, quedó ciego y después vio como nunca. A veces Dios usa nuestras caídas para convertirnos.",q:"¿Qué quiere Dios que haga a partir de hoy?",o:"Señor, muéstrame lo que quieres de mí. Estoy lista para escuchar."},
"2027-01-26":{v:"Porque tengo presente la sinceridad de tu fe, esa fe que tuvieron tu abuela Loide y tu madre Eunice",r:"2 Tim 1, 5",p:"La fe de Timoteo comenzó con su mamá y su abuela. Tu fe también se está sembrando en tus hijos.",q:"¿Qué semillas de fe ya he sembrado en mis hijos?",o:"Señor, que mi fe sea una herencia viva para mis hijos."},
"2027-01-27":{v:"Otros granos cayeron en buena tierra y dieron fruto",r:"Mc 4, 8",p:"No toda semilla brota enseguida. Sigue sembrando: Dios se encarga del crecimiento.",q:"¿Dónde me he desanimado de sembrar?",o:"Señor, haz de mi corazón una tierra buena para tu Palabra."},
"2027-01-28":{v:"¿Acaso se trae una lámpara para ponerla debajo de un cajón o debajo de la cama? ¿No es más bien para colocarla sobre el candelero?",r:"Mc 4, 21",p:"Tu fe no es para quedarse escondida. Ilumina toda la casa.",q:"¿Cómo puedo dejar que la luz de Dios brille hoy en casa?",o:"Señor, que mi vida sea una luz encendida en mi hogar."},
"2027-01-29":{v:"la semilla germina y va creciendo, sin que él sepa cómo.",r:"Mc 4, 27",p:"Dios trabaja en silencio en el corazón de nuestros hijos, aun cuando no vemos resultados.",q:"¿Por cuál hijo (o persona) necesito seguir confiando?",o:"Señor, confío en tu trabajo silencioso en el corazón de quienes amo."},
"2027-01-30":{v:"¿Por qué tienen miedo? ¿Cómo no tienen fe?",r:"Mc 4, 40",p:"Jesús estuvo en la barca todo el tiempo. También está en la barca de tu familia.",q:"¿Qué tormenta estoy enfrentando ahora?",o:"Jesús, calma las tormentas de mi casa. Sé que estás conmigo."},
"2027-01-31":{v:"Felices los pacientes, porque recibirán la tierra en herencia.",r:"Mt 5, 4",p:"La mansedumbre no es debilidad. Es fuerza con dulzura, de esa que cambia el ambiente de la casa.",q:"¿En qué momento del día necesito más mansedumbre?",o:"Jesús, manso y humilde de corazón, haz mi corazón semejante al tuyo."}
};

// Reto de Adviento 2026 (del 29 de noviembre al 24 de diciembre): un día completo para cada fecha, siguiendo la liturgia de la Iglesia (Ciclo B).
// Campos: t título · cel celebración del día · aviso (precepto o nota) · tipo/ref lectura elegida · v frase de la lectura (la llena el script de compilación)
// exp lo que dice la lectura · med meditación (párrafos) · perg pregunta para el corazón · des reto en familia · ora oración
(function(){
var D=[
{t:"Velar con el corazón despierto",cel:"Primer Domingo de Adviento",vela:1,
aviso:"El domingo es día de precepto: participa de la Santa Misa. Hoy comienza un nuevo año litúrgico y se enciende la primera vela de la corona.",
tipo:"Evangelio",ref:"Mc 13, 33-37",v:"Estén prevenidos, entonces, porque no saben cuándo llegará el dueño de casa",
exp:"Jesús cuenta la historia de un hombre que se va de viaje y deja la casa al cuidado de sus servidores, cada uno con su tarea. Al portero le da una orden especial: quedarse despierto. Nadie sabe a qué hora volverá el dueño. En la primera lectura (Is 63–64), el pueblo le suplica a Dios que rasgue los cielos y baje.",
med:["El Adviento tiene dos esperas. Esperamos la Navidad, el recuerdo de la primera venida de Jesús en Belén. Y esperamos su regreso glorioso al final de los tiempos. Velar es vivir las dos con el corazón despierto.","Velar no es vivir con miedo. Es cuidar bien la «casa» que Dios nos ha confiado: la familia, el trabajo, la fe. Lo contrario de velar es vivir en piloto automático, corriendo todo el día sin darnos cuenta de que Dios pasa por nuestra vida."],
perg:"¿En qué parte de mi vida estoy «dormida» y necesito despertar para Dios?",
des:"Armen juntos la corona de Adviento (basta un plato con cuatro velas y unas ramitas verdes) y enciendan la primera vela, la de la esperanza. Explícales a los niños: cada domingo encendemos una vela más, hasta que llegue Jesús.",
ora:"¡Ven, Señor Jesús! Encuentra nuestra casa despierta y nuestro corazón listo para ti. Amén."},

{t:"Andrés lleva a su hermano a Jesús",cel:"San Andrés, apóstol (fiesta)",
tipo:"Evangelio",ref:"Mt 4, 18-22",v:"Síganme, y yo los haré pescadores de hombres.",
exp:"Jesús camina a la orilla del mar de Galilea y ve a dos hermanos, Simón (Pedro) y Andrés, echando las redes. Los llama y, en ese mismo momento, ellos dejan las redes y lo siguen. Poco después llama también a Santiago y a Juan. El Evangelio de Juan cuenta que fue Andrés quien llevó a su hermano hasta Jesús, contándole que habían encontrado al Mesías (Jn 1,41).",
med:["Andrés no dio grandes discursos. Se encontró con Jesús y corrió a contárselo a quien amaba. Así se extiende la fe: de persona a persona, de casa en casa.","En Adviento preparamos el camino para que Jesús llegue. Una forma hermosa de hacerlo es llevar a alguien con nosotras: una invitación a Misa, una palabra de esperanza, una oración por alguien que está lejos de Dios."],
perg:"¿A quién podría acercar a Jesús en esta Navidad?",
des:"Pregúntales a los niños: ¿a quién podemos acercar a Jesús en esta Navidad? Hagan juntos un dibujo o una notita para esa persona y entréguenla esta semana.",
ora:"San Andrés, enseña a nuestra familia a acercar a Jesús a las personas que amamos. Amén."},

{t:"Un retoño que brota del tronco",cel:"Martes de la primera semana de Adviento",
tipo:"Primera lectura",ref:"Is 11, 1-10",v:"Saldrá una rama del tronco de Jesé y un retoño brotará de sus raíces.",
exp:"El profeta Isaías habla de un tronco cortado: la familia del rey David, hijo de Jesé, que parecía acabada. De él brotará un retoño lleno del Espíritu de Dios: sabiduría, entendimiento, consejo, fortaleza, ciencia y temor de Dios. Con él llega una paz tan grande que el lobo y el cordero vivirán juntos.",
med:["Ese retoño es Jesús. Dios hace nacer la vida justo donde parecía que ya no quedaba nada. Así es Dios: no necesita que todo esté perfecto para actuar.","Quizás tienes en tu vida un «tronco cortado»: un sueño, una relación, una esperanza que parece muerta. El Adviento nos invita a mirarlo con fe, porque justo de ahí Dios puede hacer brotar algo nuevo."],
perg:"¿Qué «tronco cortado» de mi vida quiero entregarle a Dios para que lo haga brotar de nuevo?",
des:"Siembren juntos una semilla (un frijol en un algodón húmedo funciona) y cuídenla hasta Navidad. Cada vez que la miren, recuerden: Dios hace nacer vida nueva.",
ora:"Señor, haz brotar vida nueva donde yo ya había perdido la esperanza. Que tu Espíritu repose sobre nuestra casa. Amén."},

{t:"Dios secará las lágrimas",cel:"Miércoles de la primera semana de Adviento",
tipo:"Primera lectura",ref:"Is 25, 6-10a",v:"el Señor enjugará las lágrimas de todos los rostros…",
exp:"Isaías describe un gran banquete en lo alto del monte, preparado por Dios para todos los pueblos, con manjares y vinos finos. Ese día Dios destruirá la muerte para siempre y secará las lágrimas de todos los rostros. En el Evangelio del día (Mt 15,29-37), Jesús sana a muchos enfermos y multiplica los panes para la multitud.",
med:["Dios no es indiferente a nuestro cansancio ni a nuestras lágrimas. Prepara una mesa, cuida y alimenta. Jesús lo mostró cuando tuvo compasión de una multitud con hambre.","La Misa ya es hoy un poquito de ese banquete: Dios nos llama a su mesa y nos alimenta con su propio Cuerpo. Toda comida sencilla en familia también puede ser un lugar de encuentro con él."],
perg:"¿Qué lágrima mía todavía no he dejado que Dios seque?",
des:"Hoy en la cena, recen juntos antes de comer y que cada uno cuente algo bueno del día. Pongan la mesa con un cuidado especial, como quien espera una visita muy querida.",
ora:"Señor, tú preparas la mesa y secas las lágrimas. Recibe mi cansancio y llena nuestra casa de tu paz. Amén."},

{t:"La casa construida sobre roca",cel:"San Francisco Javier, presbítero (memoria)",
tipo:"Evangelio",ref:"Mt 7, 21. 24-27",v:"todo el que escucha las palabras que acabo de decir y las pone en práctica, puede compararse a un hombre sensato que edificó su casa sobre roca.",
exp:"Jesús compara dos casas. Las dos enfrentan lluvia, crecida de ríos y viento. Una sigue en pie porque fue construida sobre roca; la otra se derrumba porque fue construida sobre arena. La diferencia no está en escuchar la Palabra, sino en ponerla en práctica.",
med:["Todos los hogares pasan por tormentas: enfermedades, dinero que no alcanza, peleas, cansancio. No podemos elegir si llega la lluvia. Sí podemos elegir sobre qué está apoyada nuestra casa.","San Francisco Javier, a quien celebramos hoy, llevó el Evangelio hasta la India y Japón. No solo escuchó a Jesús: vivió la Palabra hasta el final. Eso es construir sobre roca: un pequeño paso concreto a la vez."],
perg:"¿Qué palabra de Dios ya conozco, pero todavía no he puesto en práctica?",
des:"Dibujen juntos una casita y escriban dentro de cada ladrillo una forma de vivir la Palabra en casa: perdonar, ayudar, rezar, dar gracias. Pónganla cerca de la corona de Adviento.",
ora:"Jesús, sé la roca de nuestra casa. Que tu Palabra no se quede solo en nuestros oídos, sino que llegue a nuestras manos. Amén."},

{t:"¿Crees que Jesús puede?",cel:"Viernes de la primera semana de Adviento",
tipo:"Evangelio",ref:"Mt 9, 27-31",v:"«¿Creen que yo puedo hacer lo que me piden?». Ellos le respondieron: «Sí, Señor».",
exp:"Dos ciegos siguen a Jesús gritando y le piden compasión al Hijo de David. Insisten hasta entrar en la casa donde está Jesús. Antes de sanarlos, Jesús les pregunta si creen. Ellos dicen que sí, y Jesús les toca los ojos: les sucede tal como creyeron. En la primera lectura (Is 29,17-24), Isaías anuncia el día en que los ojos de los ciegos verán.",
med:["Los ciegos no se rindieron. Siguieron a Jesús por la calle y entraron detrás de él a la casa. La fe verdadera insiste, aunque la respuesta tarde.","Jesús nos hace hoy la misma pregunta, frente a lo que más pesa en el corazón: si creemos que él puede. Responderle que sí, con confianza, es el primer paso para ver con otros ojos."],
perg:"Frente a mi mayor petición de hoy, ¿puedo decirle a Jesús con sinceridad que sí creo?",
des:"Jueguen a la gallinita ciega unos minutos. Después platiquen: ¿cómo es no poder ver? Jesús vino a traer luz a nuestros ojos y a nuestro corazón.",
ora:"Jesús, ten compasión de mí. Creo en ti, Señor, pero aumenta mi fe. Abre mis ojos para verte. Amén."},

{t:"Dios nos muestra el camino",cel:"Sábado de la primera semana de Adviento",
tipo:"Primera lectura",ref:"Is 30, 19-21. 23-26",v:"Tus oídos escucharán detrás de ti una palabra: «Este es el camino, síganlo»",
exp:"Isaías consuela a un pueblo cansado: Dios escuchará su clamor y responderá. Promete lluvia para las semillas, pan en abundancia y una luz fuerte como la del sol. Y promete guiar a su pueblo con una voz que le indique el camino. En el Evangelio (Mt 9,35–10,8), Jesús ve a las multitudes cansadas, como ovejas sin pastor, y envía a los apóstoles.",
med:["¿Cuántas veces nos sentimos perdidas, sin saber qué decisión tomar? Dios promete no dejarnos solas: habla, señala el camino y guía paso a paso.","Para escuchar esa voz hace falta silencio. En medio de las prisas de diciembre, el Adviento nos pide unos minutos de silencio con Dios cada día, para escuchar por dónde quiere que vayamos."],
perg:"¿Qué decisión necesito entregarle a Dios, pidiéndole que me muestre el camino?",
des:"Hagan juntos un «camino» en el piso con listones o papeles, desde una recámara hasta el Nacimiento (o hasta la corona). Cada día, las figuras de María y José pueden avanzar un poquito por ese camino hasta Navidad.",
ora:"Señor, muéstrame tu camino y dame valor para andar por él. Habla a mi corazón; quiero escucharte. Amén."},

{t:"Preparar el camino del Señor",cel:"Segundo Domingo de Adviento",vela:2,
aviso:"El domingo es día de precepto: participa de la Santa Misa. Hoy se enciende la segunda vela de la corona.",
tipo:"Evangelio",ref:"Mc 1, 1-8",v:"Preparen el camino del Señor, allanen sus senderos",
exp:"El Evangelio de Marcos comienza con Juan el Bautista en el desierto. Anuncia un bautismo de conversión, y mucha gente acude a él confesando sus pecados. Juan se viste con piel de camello, come saltamontes y miel silvestre, y anuncia que detrás de él viene alguien más fuerte. La primera lectura (Is 40,1-5.9-11) comienza con Dios pidiendo que consuelen a su pueblo.",
med:["Preparar el camino es quitar lo que estorba la llegada de Jesús. Puede ser un resentimiento guardado, un pequeño vicio, una reconciliación que vamos posponiendo. Los «baches» y las «montañas» del camino están dentro de nosotras.","El Adviento es un tiempo precioso para la Confesión. No es una carga: es la manera que Dios encontró para consolar a su pueblo, como dice Isaías. Busca los horarios de Confesión en tu parroquia antes de Navidad."],
perg:"¿Qué necesito quitar del camino para que Jesús llegue de verdad a mi corazón en esta Navidad?",
des:"Hoy es día de «arreglar el camino»: cada persona de la casa elige un rincón para ordenar (la recámara, un cajón, los juguetes) y aparta algo en buen estado para donar.",
ora:"Señor, endereza los caminos torcidos de mi corazón. Dame la gracia de una buena Confesión en este Adviento. Amén."},

{t:"Por el techo, hasta Jesús",cel:"San Ambrosio, obispo y doctor de la Iglesia (memoria)",
tipo:"Evangelio",ref:"Lc 5, 17-26",v:"Hombre, tus pecados te son perdonados",
exp:"Unos hombres cargan en una camilla a un amigo paralítico, pero no pueden entrar a la casa por la multitud. Entonces suben al techo, quitan las tejas y bajan a su amigo justo delante de Jesús. Al ver su fe, Jesús primero le perdona los pecados al hombre y después lo sana. En la primera lectura (Is 35,1-10), el desierto florece y el profeta anima a los que tienen miedo a ser fuertes y no temer.",
med:["El enfermo fue sanado por la fe de sus amigos. Qué hermoso: a veces somos la persona en la camilla, y a veces somos los amigos que cargan.","Nuestra oración puede llevar hasta Jesús a quien no puede llegar solo: un hijo alejado, un esposo sin fe, una amiga enferma. No te canses de «subir al techo» por quien amas."],
perg:"¿A quién estoy cargando en la oración? ¿A quién necesito empezar a llevar hasta Jesús?",
des:"Escriban en una hoja los nombres de personas que necesitan oración. Pongan la hoja cerca del Nacimiento o de la corona y recen hoy juntos un Ave María por ellas.",
ora:"Jesús, pongo delante de ti a las personas que amo y que te necesitan. Mira nuestra fe y toca su vida. Amén."},

{t:"Llena de gracia desde el principio",cel:"La Inmaculada Concepción de la Santísima Virgen María (solemnidad)",
aviso:"En muchos países es día de precepto: participa de la Santa Misa. Consulta los horarios en tu parroquia.",
tipo:"Evangelio",ref:"Lc 1, 26-38",v:"¡Alégrate!, llena de gracia, el Señor está contigo.",
exp:"Hoy la Iglesia celebra que María fue preservada del pecado original desde el primer instante de su vida, por un don especial de Dios, para prepararla a ser la Madre de Jesús. El Evangelio cuenta la visita del ángel Gabriel a María. La primera lectura (Gn 3,9-15.20) recuerda el pecado de Adán y Eva y la promesa de Dios: la descendencia de la mujer vencerá al mal.",
med:["El ángel no llama a María por su nombre: la saluda como la llena de gracia. Es como si ese fuera su verdadero nombre. En María no había espacios vacíos: todo en ella era de Dios.","Nosotras no somos inmaculadas, pero Dios también nos mira con amor y quiere llenarnos de su gracia. Por la Confesión y la Eucaristía, él va limpiando y sanando nuestro corazón, para que Jesús encuentre un lugar preparado."],
perg:"¿Qué parte de mi corazón todavía no he dejado que Dios llene con su gracia?",
des:"Pongan una imagen de la Virgen María en un lugar especial de la casa, con una flor o una vela. Recen juntos el Rosario (o un misterio) pidiendo su protección para la familia.",
ora:"Oh María, sin pecado concebida, ruega por nosotros que recurrimos a ti. Prepara mi corazón para recibir a Jesús, como Dios preparó el tuyo. Amén."},

{t:"Con alas de águila",cel:"Miércoles de la segunda semana de Adviento",
tipo:"Primera lectura",ref:"Is 40, 25-31",v:"Pero los que esperan en el Señor renuevan sus fuerzas, despliegan alas como las águilas…",
exp:"Isaías le habla a un pueblo que pensaba que Dios lo había olvidado, y le pregunta si acaso no lo sabe, si no lo ha oído. El Señor es el Dios eterno, creador de todo, que no se cansa ni se fatiga. Él da fuerzas al cansado. En el Evangelio del día (Mt 11,28-30), Jesús invita a ir a él a todos los que están cansados y agobiados.",
med:["Diciembre suele ser un mes agotador, lleno de compromisos, fiestas y cuentas. La Palabra de hoy no dice que el cansancio va a desaparecer. Dice que quienes esperan en el Señor renuevan sus fuerzas.","Esperar en el Señor es entregarle el peso que no podemos cargar solas. El águila no aletea todo el tiempo: se deja llevar por el viento. Deja que Dios sea hoy el viento que te sostiene."],
perg:"¿Qué cansancio estoy cargando sola y necesito entregarle hoy a Dios?",
des:"Hoy, cada persona de la casa elige una tarea para aliviar el cansancio de otra (lavar los trastes, poner la mesa, dar un abrazo). Nadie cuenta quién lo hizo: es un regalo escondido.",
ora:"Señor, tú no te cansas. Recibe mi cansancio y renueva mis fuerzas. Que descanse en ti. Amén."},

{t:"Dios te toma de la mano",cel:"Jueves de la segunda semana de Adviento",
tipo:"Primera lectura",ref:"Is 41, 13-20",v:"Porque yo, el Señor, soy tu Dios, el que te sostengo de la mano derecha y te digo: «No temas, yo vengo en tu ayuda».",
exp:"Dios le habla con ternura a su pueblo, que se sentía pequeño y débil, como un gusanito. Le promete tomarlo de la mano, abrir ríos en las alturas y hacer crecer árboles en el desierto. En el Evangelio (Mt 11,11-15), Jesús dice que entre los nacidos de mujer no ha surgido nadie más grande que Juan el Bautista.",
med:["Dios no habla desde lejos: nos toma de la mano, como una mamá toma la mano de su hijo en una calle llena de gente. Esa es la imagen del Adviento: un Dios que se acerca.","Cuando hoy aparezca el miedo, acuérdate de esta promesa. Repite en tu corazón que Dios te toma de la mano y te ayuda. Es para ti."],
perg:"¿Cuál es el miedo que más me ha quitado la paz? ¿Puedo darle esa mano a Dios?",
des:"A la hora de dormir, toma la mano de cada hijo y dile: «Dios te toma de la mano. No tengas miedo: él te ayuda». Recen juntos el Ángel de la Guarda.",
ora:"Señor, toma mi mano. Cuando tenga miedo, recuérdame que estás conmigo y me ayudas. Amén."},

{t:"Dios enseña lo que es bueno",cel:"Viernes de la segunda semana de Adviento",
tipo:"Primera lectura",ref:"Is 48, 17-19",v:"Yo soy el Señor, tu Dios, el que te instruye para tu provecho, el que te guía por el camino que debes seguir.",
exp:"Dios se presenta como maestro y guía. Se lamenta de que, si su pueblo hubiera escuchado sus mandamientos, su paz habría sido como un río. En el Evangelio (Mt 11,16-19), Jesús compara a su generación con niños que no aceptan ningún juego: no escucharon a Juan, que ayunaba, ni a Jesús, que comía con los pecadores.",
med:["La paz como un río: ¡qué imagen tan bonita! No viene de que todo salga bien, sino de vivir en el camino que Dios enseña. Los mandamientos no son una carga: son el mapa del camino de la paz.","A veces nos quejamos de todo, como los niños del Evangelio. El Adviento nos invita a dejar de quejarnos y a escuchar: ¿qué me está tratando de enseñar Dios a través de esta situación?"],
perg:"¿Qué me está tratando de enseñar Dios con eso que hoy me molesta?",
des:"Hagan el «día sin quejas»: quien se queje cambia la queja por un «gracias». Al final del día, cuenten cuántos «gracias» aparecieron.",
ora:"Señor, enséñame lo que es bueno y guíame por tu camino. Que tu paz corra por nuestra casa como un río. Amén."},

{t:"La Madre que viene a nuestro encuentro",cel:"Nuestra Señora de Guadalupe, Patrona de América (fiesta)",
tipo:"Primera lectura",ref:"Zac 2, 14-17",v:"Grita de júbilo y alégrate, hija de Sión: porque yo vengo a habitar en medio de ti",
exp:"El profeta Zacarías anuncia que Dios viene a habitar en medio de su pueblo, y muchas naciones se unirán a él. En 1531, en México, la Virgen María se le apareció a san Juan Diego, un indígena sencillo, y dejó su imagen estampada en su tilma. En el Evangelio (Lc 1,39-47), María va de prisa a visitar a Isabel, llevando a Jesús en su seno.",
med:["En Guadalupe, María aparece embarazada, con un listón en la cintura. Viene trayendo a Jesús. Siempre es así: María nunca llama la atención sobre sí misma; nos lleva a Jesús.","Juan Diego se sentía pequeño y sin importancia. La Virgen le dijo: «¿No estoy yo aquí, que soy tu madre?». Esas palabras son para ti hoy, en cualquier preocupación."],
perg:"¿Qué preocupación quiero poner hoy en el regazo de la Virgen María?",
des:"Cuéntenles a los niños la historia de Juan Diego y de las rosas que florecieron en invierno. Dibujen juntos una tilma llena de rosas y escriban: «¿No estoy yo aquí, que soy tu madre?».",
ora:"Nuestra Señora de Guadalupe, Madre de América, cubre a nuestra familia con tu manto y llévanos a Jesús. Amén."},

{t:"Alegría, porque el Señor está cerca",cel:"Tercer Domingo de Adviento (Domingo de Gaudete)",vela:3,
aviso:"El domingo es día de precepto: participa de la Santa Misa. Hoy se enciende la tercera vela, la rosa, señal de alegría porque la Navidad está cerca.",
tipo:"Evangelio",ref:"Jn 1, 6-8. 19-28",v:"Yo soy una voz que grita en el desierto: Allanen el camino del Señor",
exp:"Los sacerdotes le preguntan a Juan el Bautista quién es. Él responde con humildad: no es el Mesías, ni Elías, ni el Profeta. Es solo «la voz» que anuncia a alguien que ya está en medio de ellos. En la segunda lectura (1 Ts 5,16-24), san Pablo nos pide estar siempre alegres, orar sin cesar y dar gracias en todo.",
med:["La alegría cristiana no depende de que todo esté bien. Nace de la certeza de que el Señor está cerca. Por eso, a mitad del Adviento, la Iglesia cambia el color a rosa y nos llama a alegrarnos.","Juan el Bautista estaba alegre porque señalaba a Jesús y no a sí mismo. Que nuestra vida también sea una «voz» que señale a Jesús, con más amabilidad, más paciencia y más sonrisas en casa."],
perg:"¿Qué me ha estado robando la alegría? ¿Qué motivo tengo hoy para darle gracias a Dios?",
des:"Enciendan la vela rosa y hagan una «rueda de alegría»: cada persona dice tres motivos para darle gracias a Dios esta semana. Si pueden, canten juntos un villancico.",
ora:"Señor, ayúdame a vivir siempre alegre, a orar sin cansarme y a dar gracias en todo. Tú estás cerca. Amén."},

{t:"Una estrella va a brillar",cel:"San Juan de la Cruz, presbítero y doctor de la Iglesia (memoria)",
tipo:"Primera lectura",ref:"Nm 24, 2-7. 15-17a",v:"una estrella se alza desde Jacob, un cetro surge de Israel",
exp:"Balaam, un profeta extranjero, fue llamado para maldecir a Israel, pero el Espíritu de Dios hizo que lo bendijera. Él ve de lejos una estrella que surgirá de Jacob. La Iglesia ve en esa estrella al Mesías, Jesús. En el Evangelio (Mt 21,23-27), los jefes del pueblo cuestionan la autoridad de Jesús.",
med:["Dios usa incluso a quien menos esperamos para anunciar a Jesús. Y la estrella de Balaam nos recuerda la estrella que guio a los Magos hasta Belén.","San Juan de la Cruz, a quien celebramos hoy, pasó por grandes noches oscuras del alma y aun así encontró a Dios. Él escribió: «A la tarde te examinarán en el amor». Cuando tu noche esté oscura, busca la estrella: ahí está Jesús."],
perg:"¿Qué «noche oscura» estoy viviendo? ¿Dónde puedo buscar en ella la estrella de Dios?",
des:"Recorten juntos una estrella de papel amarillo y escriban en ella el nombre de Jesús. Cuélguenla en lo alto del Nacimiento o del árbol.",
ora:"Jesús, estrella que brilla en la noche, ilumina mis caminos oscuros y guía a nuestra familia hasta ti. Amén."},

{t:"Un pueblo humilde y confiado",cel:"Martes de la tercera semana de Adviento",
tipo:"Primera lectura",ref:"Sof 3, 1-2. 9-13",v:"Yo dejaré en medio de ti a un pueblo pobre y humilde, que se refugiará en el nombre del Señor.",
exp:"El profeta Sofonías denuncia a una ciudad rebelde, que no escucha ni confía en Dios. Pero anuncia que Dios purificará el corazón de su pueblo y dejará un «resto» humilde que confía en él. En el Evangelio (Mt 21,28-32), Jesús cuenta la historia de dos hijos: uno le dice «no» a su padre, pero después se arrepiente y va a trabajar; el otro dice «sí», pero no va.",
med:["Dios no busca gente perfecta; busca gente humilde. El primer hijo se equivocó, pero dio marcha atrás. La humildad de reconocer el error le abre la puerta a Dios.","En Navidad, Dios mismo se hizo pequeño y pobre, naciendo en un pesebre. Quien es humilde entiende la Navidad mejor que nadie."],
perg:"¿Qué «no» le dije a Dios que todavía estoy a tiempo de cambiar?",
des:"Hoy es día de pedir perdón. Si alguien de la casa lastimó a otra persona esta semana, que le pida perdón con un abrazo. Los papás pueden dar el ejemplo primero.",
ora:"Señor, dame un corazón humilde, que reconozca sus errores y vuelva a ti. Quiero ser parte de tu pueblo pequeño y confiado. Amén."},

{t:"Como rocío que cae del cielo",cel:"Miércoles de la tercera semana de Adviento",
aviso:"Muchas familias comienzan hoy la Novena de Navidad, del 16 al 24 de diciembre. La encuentras aquí en la app, en Orar > Novenas.",
tipo:"Primera lectura",ref:"Is 45, 6b-8. 18. 21b-25",v:"¡Destilen, cielos, desde lo alto, y que las nubes derramen la justicia!",
exp:"Dios habla con fuerza: él es el Señor, y no hay otro. Y luego viene una súplica bellísima que la Iglesia canta en Adviento desde hace siglos (en latín, «Rorate caeli»): que el cielo derrame al Salvador como rocío y que la tierra lo haga germinar. En el Evangelio (Lc 7,19-23), Juan el Bautista manda preguntarle a Jesús si él es el que había de venir.",
med:["El rocío cae despacio, en silencio, durante la noche, y en la mañana todo está mojado. Así vino Jesús: sin ruido, una noche en Belén.","Juan el Bautista, en la cárcel, tuvo una duda. Y Jesús no lo regañó: le mostró las señales. Nosotras también podemos llevarle nuestras dudas a Jesús. Él responde mostrándonos lo que hace en nuestra vida."],
perg:"¿Qué duda cargo en el corazón y quiero llevarle con sinceridad a Jesús?",
des:"Comiencen hoy la Novena de Navidad en familia, rezando juntos un poquito cada noche hasta el día 24.",
ora:"Ven, Señor Jesús, como el rocío que cae en silencio, y haz germinar la salvación en nuestra casa. Amén."},

{t:"Jesús tiene una familia",cel:"17 de diciembre: comienzan las Antífonas de la O",
aviso:"Desde hoy y hasta el día 23, la Iglesia reza las «Antífonas de la O», siete llamadas a Jesús con sus nombres bíblicos. La de hoy es «Oh Sabiduría».",
tipo:"Evangelio",ref:"Mt 1, 1-17",v:"Genealogía de Jesucristo, hijo de David, hijo de Abraham…",
exp:"San Mateo presenta el árbol genealógico de Jesús: de Abraham a David, de David al destierro en Babilonia, y del destierro hasta José, esposo de María. En la lista aparecen reyes y gente sencilla, santos y pecadores, y también mujeres extranjeras como Rut y Rajab. En la primera lectura (Gn 49), Jacob bendice a Judá, de quien vendría el rey.",
med:["Jesús quiso tener una familia de verdad, con una historia llena de altibajos. Dios no se avergüenza de la historia humana: entra en ella y la salva desde dentro.","Nuestra familia también tiene heridas, errores e historias difíciles. Jesús no espera a que sea perfecta para entrar. Quiere nacer justamente ahí."],
perg:"¿Qué parte de la historia de mi familia necesito entregarle a Dios para que la sane?",
des:"Muéstrenles a los niños fotos de los abuelos y bisabuelos y cuéntenles una historia bonita de fe de la familia. Recen juntos por sus antepasados, vivos y difuntos.",
ora:"Jesús, Sabiduría de Dios, ven a enseñarnos a caminar con prudencia. Bendice a nuestra familia y toda nuestra historia. Amén."},

{t:"José, el hombre justo",cel:"18 de diciembre · Antífona de la O: Oh Adonai",
aviso:"La Antífona de la O de hoy es «Oh Adonai».",
tipo:"Evangelio",ref:"Mt 1, 18-24",v:"José, hijo de David, no temas recibir a María, tu esposa",
exp:"José descubre que María está embarazada y, como es un hombre justo, decide separarse de ella en secreto, sin exponerla. En un sueño, un ángel le explica que el niño viene del Espíritu Santo y que se llamará Jesús, porque salvará a su pueblo de sus pecados. Él será el Emmanuel, Dios con nosotros. José despierta y hace todo lo que el ángel le mandó.",
med:["José no dice ni una palabra en el Evangelio. Escucha y obedece. No lo entendía todo, pero confió y recibió a María y a Jesús con todo su amor.","En la vida familiar, muchas veces no entendemos lo que Dios está haciendo. José nos enseña a dar el siguiente paso con confianza, aun sin tener todas las respuestas."],
perg:"¿En qué situación me está pidiendo Dios que confíe, aunque no lo entienda todo?",
des:"Hoy es el día de papá (o de quien cuida a la familia): hagan una tarjeta para darle gracias, así como José cuidó de Jesús. Recen juntos pidiendo a san José que proteja su hogar.",
ora:"San José, hombre justo y silencioso, enséñame a escuchar a Dios y a confiar. Protege a nuestra familia como protegiste a María y a Jesús. Amén."},

{t:"Para Dios no hay imposibles",cel:"19 de diciembre · Antífona de la O: Oh Raíz de Jesé",
aviso:"La Antífona de la O de hoy es «Oh Raíz de Jesé».",
tipo:"Evangelio",ref:"Lc 1, 5-25",v:"No temas, Zacarías; tu súplica ha sido escuchada.",
exp:"Zacarías e Isabel eran justos, pero no tenían hijos y ya eran mayores. Mientras Zacarías ofrece el incienso en el Templo, el ángel Gabriel le anuncia que Isabel tendrá un hijo, Juan, que preparará el camino del Señor. Zacarías duda y se queda mudo hasta que nace el niño. En la primera lectura (Jue 13), hay otro anuncio parecido: el nacimiento de Sansón.",
med:["Isabel esperó toda la vida. Cuando parecía demasiado tarde, Dios respondió. El tiempo de Dios no es el nuestro, pero él no olvida ninguna oración.","Zacarías se quedó en silencio porque dudó. A veces Dios también nos pide un tiempo de silencio para que madure la fe. El silencio no es un castigo: es preparación."],
perg:"¿Qué oración de hace mucho tiempo casi he dejado de hacer? ¿Puedo entregársela de nuevo a Dios hoy?",
des:"Hagan en familia un «minuto de silencio» antes de dormir, todos con los ojos cerrados, escuchando el corazón. Después, cada uno le dice a Dios una petición en voz bajita.",
ora:"Señor, para ti nada es imposible. Pongo de nuevo en tus manos la petición que cargo desde hace tanto tiempo. Que se haga tu voluntad. Amén."},

{t:"El sí de María",cel:"Cuarto Domingo de Adviento · Antífona de la O: Oh Llave de David",vela:4,
aviso:"El domingo es día de precepto: participa de la Santa Misa. Hoy se enciende la cuarta vela de la corona. La Antífona de la O de hoy es «Oh Llave de David».",
tipo:"Evangelio",ref:"Lc 1, 26-38",v:"Yo soy la servidora del Señor, que se cumpla en mí lo que has dicho.",
exp:"El ángel Gabriel le anuncia a María que será la madre del Hijo de Dios. María pregunta cómo sucederá eso, y el ángel le responde que el Espíritu Santo vendrá sobre ella. Entonces María da su «sí». En la primera lectura (2 Sam 7), Dios le promete a David que su reino durará para siempre: esa promesa se cumple en Jesús.",
med:["Todo en la Navidad comienza con un «sí». María no sabía todo lo que iba a pasar, pero le dijo que sí a Dios por completo. Y por ese sí, Dios entró en el mundo.","Dios también nos pide nuestro «sí» todos los días: en la paciencia con los hijos, en el cuidado del hogar, en un perdón difícil. Cada pequeño sí abre espacio para que Jesús nazca en nuestra casa."],
perg:"¿A qué me está pidiendo Dios que le diga «sí» en este momento de mi vida?",
des:"Enciendan las cuatro velas y lean juntos el Evangelio de hoy (Lc 1,26-38). Cada persona completa la frase: «En esta Navidad, le digo sí a Dios en...».",
ora:"María, enséñame a decirle sí a Dios como tú lo hiciste. Que se haga en mí lo que Dios quiera. Amén."},

{t:"Una visita llena de alegría",cel:"21 de diciembre · Antífona de la O: Oh Sol naciente",
aviso:"La Antífona de la O de hoy es «Oh Sol naciente».",
tipo:"Evangelio",ref:"Lc 1, 39-45",v:"Feliz de ti por haber creído",
exp:"María va de prisa a la casa de Isabel, en la montaña. Cuando Isabel oye el saludo de María, el bebé Juan salta de alegría en su seno, e Isabel, llena del Espíritu Santo, exclama que María y el niño que lleva en su seno son benditos. En la primera lectura (Cant 2,8-14), el amado llega saltando por los montes.",
med:["María acababa de recibir la noticia más importante de la historia y, en lugar de pensar en sí misma, fue a ayudar a su prima mayor. Quien lleva a Jesús sale al encuentro de los demás.","Las visitas de diciembre pueden ser cansadas, pero también pueden ser como la de María: llevar a Jesús a la casa de los demás, con alegría y servicio."],
perg:"¿Quién necesita en estos días una visita, una llamada o una ayuda de mi parte?",
des:"Hagan juntos una visita o una videollamada a alguien mayor o que esté solo en la familia. Llévenle una notita o un dulce hecho en casa.",
ora:"María, que fuiste de prisa a servir a Isabel, enséñame a llevar a Jesús a los demás con alegría. Amén."},

{t:"El canto de gratitud de María",cel:"22 de diciembre · Antífona de la O: Oh Rey de las naciones",
aviso:"La Antífona de la O de hoy es «Oh Rey de las naciones».",
tipo:"Evangelio",ref:"Lc 1, 46-56",v:"Mi alma canta la grandeza del Señor, y mi espíritu se estremece de gozo en Dios, mi salvador…",
exp:"En casa de Isabel, María canta el Magníficat. Alaba a Dios porque se fijó en su pequeñez, derribó a los poderosos y enalteció a los humildes, colmó de bienes a los hambrientos y cumplió la promesa hecha a Abraham. En la primera lectura (1 Sam 1,24-28), Ana presenta al pequeño Samuel al Señor y da gracias por el hijo tan esperado.",
med:["En el Magníficat, María no pide nada: da gracias. La gratitud es la oración de quien reconoce que todo es regalo de Dios.","Antes de las últimas prisas de Navidad, detente un momento y mira hacia atrás: ¿cuántas cosas hizo Dios por ti este año? Haz de tu corazón un Magníficat."],
perg:"¿Cuáles han sido las tres gracias más grandes que Dios me ha dado este año?",
des:"Escriban juntos la «lista de gratitud del año»: cada persona de la casa dice cosas buenas que Dios ha hecho. Guarden la lista para leerla en Navidad.",
ora:"Señor, como María, mi alma te alaba, porque miraste mi pequeñez. Gracias, Dios mío, por todo lo que hiciste por nosotros este año. Amén."},

{t:"El nombre de Juan",cel:"23 de diciembre · Antífona de la O: Oh Emmanuel",
aviso:"La Antífona de la O de hoy es «Oh Emmanuel».",
tipo:"Evangelio",ref:"Lc 1, 57-66",v:"Su nombre es Juan",
exp:"Isabel da a luz a un niño y todos se alegran. A la hora de ponerle nombre, los parientes quieren llamarlo Zacarías, como su padre. Isabel dice que se llamará Juan. Zacarías, todavía mudo, lo escribe en una tablilla, y en ese mismo momento se le suelta la lengua y alaba a Dios. En la primera lectura (Mal 3), Dios promete enviar a su mensajero para preparar el camino.",
med:["«Juan» significa «Dios es misericordioso». Zacarías volvió a hablar cuando obedeció a Dios en lugar de seguir la costumbre. La obediencia le abrió la boca para alabar.","Mañana es Nochebuena. Faltando tan poco, el Señor nos pregunta si todavía hay algo que necesitamos arreglar: una llamada, un perdón, una promesa."],
perg:"¿Qué falta todavía por arreglar en mi corazón antes de que llegue Jesús?",
des:"Cuéntenles a los niños el significado del nombre de cada miembro de la familia y denle gracias a Dios por el nombre y la vida de cada persona de la casa.",
ora:"Jesús, Emmanuel, Dios con nosotros, ¡ven! Nuestra casa ya casi está lista para recibirte. Abre mi boca para alabarte. Amén."},

{t:"El sol que viene a visitarnos",cel:"Nochebuena",vela:4,
aviso:"Esta noche la Iglesia celebra la Misa de Nochebuena. La Natividad del Señor (25 de diciembre) es día de precepto: participa de la Santa Misa.",
tipo:"Evangelio",ref:"Lc 1, 67-79",v:"gracias a la misericordiosa ternura de nuestro Dios, que nos traerá del cielo la visita del Sol naciente…",
exp:"Lleno del Espíritu Santo, Zacarías canta el Benedictus. Bendice a Dios, que visitó a su pueblo y cumplió la promesa hecha a Abraham. Después mira al pequeño Juan y anuncia que será llamado profeta del Altísimo. Y termina anunciando a Jesús como el sol que nace de lo alto para iluminar a los que están en tinieblas y guiar nuestros pasos por el camino de la paz.",
med:["La espera terminó. Durante todo el Adviento velaste, preparaste el camino, te alegraste y dijiste que sí. Ahora solo queda recibirlo: el sol que nace de lo alto viene a visitar tu casa.","En las prisas de estas últimas horas, guarda un momento de silencio. Lo más importante de la Navidad no está en la mesa ni en los regalos: es Jesús, que quiere nacer en tu corazón."],
perg:"¿Cómo quiero recibir a Jesús en esta Nochebuena?",
des:"Antes de la cena de Nochebuena, reúnan a la familia alrededor del Nacimiento, pongan al Niño Jesús en el pesebre y recen juntos. Cada persona dice un regalo que quiere darle a Jesús este año.",
ora:"Bendito seas, Señor, porque has venido a visitar a tu pueblo. Ven, Niño Jesús, nace en nuestra casa y en nuestro corazón. Amén."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="advento24"){PLANOS[i].d=D;PLANOS[i].ini="2026-11-29";PLANOS[i].resumo="Un día para cada día del Adviento, del 29 de noviembre a la Nochebuena, siguiendo las lecturas de la Iglesia: la lectura del día explicada, una meditación, una pregunta para el corazón, un reto en familia y una oración.";}}
})();

// 30 días orando por mi matrimonio: versión completa (lectura, explicación, meditación, pregunta, desafío, oración)
(function(){
var D=[
{t:"Entregarle mi matrimonio a Dios",ref:"Ecl 4, 9-12",v:"porque la cuerda trenzada no se rompe fácilmente.",
exp:"El sabio Qohélet observa la vida y concluye que dos valen más que uno. Si uno cae, el otro lo levanta; si hace frío, los dos se calientan; si alguien los ataca, los dos resisten juntos. Y termina con una imagen: una cuerda de tres hilos es mucho más difícil de romper.",
med:["En la tradición cristiana, esos tres hilos son el esposo, la esposa y Dios. Un matrimonio con solo dos hilos puede sostenerse, pero cualquier tirón fuerte lo pone en riesgo. Cuando Dios es el tercer hilo, la pareja recibe una fuerza que no viene de sí misma.","Entregarle tu matrimonio a Dios no es dejar de luchar por él. Es reconocer que no tienes que cargar sola con el peso de que todo salga bien. En estos 30 días vas a trenzar ese tercer hilo, un día a la vez."],
perg:"¿Qué he intentado resolver sola en mi matrimonio y necesito entregarle a Dios?",
des:"Escribe en una hoja: «Señor, nuestro matrimonio es tuyo». Ponle la fecha y guárdala dentro de tu Biblia o de tu planner. Esta noche, reza en silencio por él mientras duerme o antes de que se duerman.",
ora:"Señor, te entrego mi matrimonio. Sé el tercer hilo que nos une y nos sostiene cuando estemos débiles. Amén."},

{t:"Gratitud por mi esposo",ref:"Flp 1, 3-11",v:"Yo doy gracias a Dios cada vez que los recuerdo.",
exp:"San Pablo escribe desde la cárcel a la comunidad de Filipos. Aun preso, empieza la carta dando gracias: cada vez que se acuerda de ellos, le agradece a Dios con alegría. Y pide que su amor crezca cada vez más, en conocimiento y discernimiento.",
med:["La rutina tiene un efecto curioso: con el tiempo, nos fijamos más en lo que falta que en lo que hay. La toalla mojada sobre la cama se nota más que todo el trabajo que él hace para sostener la casa.","La gratitud es un ejercicio de la mirada. Cuando agradecemos, los ojos se acostumbran otra vez a ver el bien. Y el corazón se ablanda. Hoy haz como Pablo: acuérdate de tu esposo y dale gracias a Dios por él."],
perg:"¿Qué cualidades de mi esposo he dejado de ver con el tiempo?",
des:"Escribe tres cosas por las que estás agradecida en tu esposo. Elige una y díselo hoy, con sencillez: «Gracias por...». Puede ser por mensaje, si te resulta más fácil.",
ora:"Señor, gracias por el esposo que pusiste a mi lado. Abre mis ojos al bien que hay en él y haz crecer nuestro amor. Amén."},

{t:"Saber escuchar",ref:"Sant 1, 19-26",v:"debemos estar dispuestos a escuchar y ser lentos para hablar y para enojarnos.",
exp:"Santiago da un consejo muy práctico: ser rápidos para escuchar, lentos para hablar y más lentos todavía para enojarse. Y recuerda que no basta con oír la Palabra de Dios: hay que ponerla en práctica. Quien no controla su lengua, dice, engaña a su propio corazón.",
med:["Muchas peleas en el matrimonio nacen de no escuchar hasta el final. Mientras el otro habla, ya estamos preparando la respuesta. Escuchar de verdad es un acto de amor: le dice al otro «tú eres importante para mí».","Los hombres muchas veces hablan menos y por otros caminos: mientras manejan, mientras arreglan algo, en un comentario rápido. Aprender a escuchar a tu esposo también es aprender su manera de abrirse."],
perg:"¿Cuándo fue la última vez que escuché a mi esposo hasta el final, sin interrumpirlo ni corregirlo?",
des:"Hoy hazle a tu esposo una pregunta sobre su día o sobre algo que le guste, y escúchalo con atención, sin el celular en la mano y sin interrumpir. Después, solo dile: «Gracias por contármelo».",
ora:"Espíritu Santo, enséñame a escuchar con el corazón. Cuida mi boca y pon paciencia en mis respuestas. Amén."},

{t:"El perdón que libera",ref:"Col 3, 12-17",v:"Sopórtense los unos a los otros, y perdónense mutuamente … El Señor los ha perdonado: hagan ustedes lo mismo.",
exp:"San Pablo describe la «ropa» del cristiano: misericordia, bondad, humildad, mansedumbre y paciencia. Y por encima de todo, el amor, que es el vínculo de la perfección. Pide que se perdonen unos a otros, así como el Señor los perdonó.",
med:["Perdonar no es fingir que no pasó nada ni pensar que la ofensa no dolió. Es decidir no cobrar más la deuda. Es soltar al otro de nuestra cárcel, y los primeros en quedar libres somos nosotros.","En el matrimonio, los pequeños resentimientos no perdonados se van acumulando como el polvo sobre un mueble. Un día ya nadie recuerda el color original. El perdón de hoy limpia el polvo antes de que se endurezca."],
perg:"¿Qué herida de mi esposo todavía guardo en el corazón? ¿Estoy lista para entregársela a Dios?",
des:"Escribe en un papel una herida que guardas. Reza: «Señor, yo elijo perdonar». Después rompe el papel. Si es algo que necesita una conversación, pídele a Dios el momento y las palabras adecuadas.",
ora:"Señor, tú siempre me perdonas. Dame la gracia de perdonar a mi esposo como tú me perdonas. Sana lo que quedó herido entre nosotros. Amén."},

{t:"La paciencia, fruto del Espíritu",ref:"Gál 5, 16-26",v:"el fruto del Espíritu es: amor, alegría y paz, magnanimidad, afabilidad, bondad y confianza, mansedumbre y temperancia.",
exp:"San Pablo compara dos maneras de vivir: según la carne, que provoca peleas, celos, enojos y divisiones; y según el Espíritu, que da frutos. La paciencia aparece en la lista como un fruto: no es algo que fabricamos a la fuerza, sino algo que crece en nosotros cuando dejamos actuar a Dios.",
med:["Nadie cambia de un día para otro, ni yo ni él. La paciencia es el amor que sabe esperar el tiempo del otro, como el agricultor espera que el fruto madure.","Cuando hoy se te acabe la paciencia, en lugar de explotar, haz una oración cortita: «Espíritu Santo, dame tu fruto». El fruto no se arranca: se cultiva, con tiempo y oración."],
perg:"¿En qué situación con mi esposo se me acaba primero la paciencia?",
des:"Elige una manía suya que te irrite y decide no comentar nada sobre ella durante todo el día de hoy. Cada vez que la notes, reza por él en silencio.",
ora:"Espíritu Santo, haz crecer en mí el fruto de la paciencia. Que sepa esperar el tiempo de mi esposo como tú esperas el mío. Amén."},

{t:"Su salud",ref:"Sant 5, 13-16",v:"La oración que nace de la fe salvará al enfermo, el Señor lo aliviará…",
exp:"Santiago enseña a la comunidad a orar en todas las situaciones: en la tristeza, en la alegría y en la enfermedad. Cuando alguien esté enfermo, que llame a los presbíteros para que oren por él y lo unjan con aceite en el nombre del Señor. Ese es el origen del sacramento de la Unción de los Enfermos. Y concluye: la oración del justo tiene mucho poder.",
