med:["Marta no estaba mal por servir; el problema era la inquietud. Muchas casas son así: tantas cosas que atender que no queda espacio para lo esencial.","El orden y la sencillez calman la casa. Tener menos cosas, menos compromisos, una rutina más sencilla. Y, en medio de todo, un rato a los pies de Jesús."],
perg:"¿Por cuántas cosas me inquieto cada día? ¿Qué podría simplificar?",
des:"Elige un rincón de la casa que te cause estrés (un cajón, la mesa, la entrada) y ordénalo hoy. Aparta algo que no uses para regalarlo. Después, siéntate 5 minutos en silencio con Jesús.",
ora:"Señor, calma mi inquietud. Enséñame a escoger la mejor parte y a simplificar la vida de nuestra casa. Amén."},

{t:"La mesa familiar",ref:"Hech 2, 42-47",v:"partían el pan en sus casas … comían juntos con alegría y sencillez de corazón",
exp:"San Lucas describe la vida de los primeros cristianos: perseveraban en la enseñanza de los apóstoles, en la vida en común, en la fracción del pan y en las oraciones. Compartían lo que tenían y se reunían en las casas para comer juntos, con alegría y sencillez.",
med:["La mesa es un pequeño altar de la familia. Ahí se platica, se ríe, se cuenta el día y se reza. Muchas familias han perdido la mesa frente a la tele y el celular.","No tiene que ser un banquete: una comida sencilla con todos juntos alimenta más que cualquier platillo comido a solas en el sillón."],
perg:"¿Con qué frecuencia come mi familia junta a la mesa? ¿Qué lo impide?",
des:"Hagan hoy una comida todos juntos a la mesa, sin tele y sin celulares. Recen antes de comer y, durante la comida, que cada uno cuente lo mejor de su día.",
ora:"Señor, bendice nuestra mesa y haz de ella un lugar de encuentro, de alegría y de sencillez de corazón. Amén."},

{t:"Santificar el domingo",ref:"Ex 20, 8-11",v:"Acuérdate del día sábado para santificarlo.",
exp:"En los Diez Mandamientos, Dios le pide a su pueblo que guarde un día a la semana para él: seis días para trabajar y uno para descansar y recordar que la vida es un regalo de Dios. Para los cristianos, ese día es el domingo, el día de la Resurrección de Jesús.",
med:["El domingo es un regalo de Dios para la familia. No es solo el día de la Misa: es un día para descansar, para estar juntos, para visitar a quienes queremos, para hacer algo distinto.","Cuando el domingo se vuelve un día más de pendientes y pantallas, la familia pierde su respiro semanal."],
perg:"¿Cómo han sido los domingos de mi familia? ¿Son distintos de los demás días?",
des:"Planea el próximo domingo: Misa en familia y un momento especial juntos (una comida, un paseo, un juego). Escribe aquí lo que van a hacer.",
ora:"Señor, enséñanos a santificar el domingo. Que sea un día para encontrarnos contigo y descansar en familia. Amén."},

{t:"Sanar las memorias",ref:"Apoc 21, 1-5",v:"Yo hago nuevas todas las cosas.",
exp:"Al final de la Biblia, San Juan tiene una visión: un cielo nuevo, una tierra nueva y la nueva Jerusalén que baja del cielo, hermosa como una novia. Una voz dice que Dios vivirá con su pueblo y secará toda lágrima, y que ya no habrá muerte ni dolor. Y Dios dice que él hace nuevas todas las cosas.",
med:["Algunas heridas de la familia son antiguas: historias de abandono, violencia, adicciones, pleitos que han pasado de generación en generación. Se repiten sin que nos demos cuenta.","Dios quiere sanar la historia de tu familia y hacer de ella algo nuevo. Tú puedes ser la persona en quien la herida se detiene y empieza la sanación."],
perg:"¿Qué herida antigua de mi familia no quiero heredarles a mis hijos?",
des:"Escribe los nombres de tus papás, abuelos y antepasados y reza por ellos, pidiéndole a Dios que sane las heridas de la historia familiar. Si puedes, pide que se ofrezca una Misa por ellos.",
ora:"Señor, tú haces nuevas todas las cosas. Sana las heridas de mi familia y haz que empiece en nosotros una historia nueva. Amén."},

{t:"Bendecir la casa",ref:"Nm 6, 22-27",v:"Que el Señor te bendiga y te proteja. Que el Señor haga brillar su rostro sobre ti y muestre su gracia.",
exp:"Dios le enseña a Moisés una bendición para que los sacerdotes se la den al pueblo: que el Señor los bendiga y los proteja, haga brillar su rostro sobre ellos, les tenga piedad y les dé la paz. Y promete que, cuando invoquen así su nombre, él los bendecirá.",
med:["Bendecir es desear el bien en nombre de Dios. Los papás y las mamás pueden y deben bendecir a sus hijos y su casa: es un gesto antiguo y muy hermoso de la fe.","Una casa bendecida no se libra de los problemas, pero queda envuelta en la protección y la mirada amorosa de Dios."],
perg:"¿Acostumbro bendecir a mi familia? ¿Qué bendición necesita más mi casa hoy?",
des:"Hoy, bendice a cada persona de la casa con la bendición del libro de los Números, haciéndole la señal de la cruz en la frente. Si puedes, pídele a un sacerdote que venga a bendecir tu casa, o recorre los cuartos rezando con agua bendita.",
ora:"Señor, bendícenos y protégenos. Haz brillar tu rostro sobre nuestra familia, ten piedad de nosotros y danos tu paz. Amén."},

{t:"Puertas abiertas",ref:"Gn 18, 1-10",v:"Señor mío, si quieres hacerme un favor, te ruego que no pases de largo delante de tu servidor.",
exp:"Con el calor del mediodía, Abraham ve a tres hombres cerca de su tienda. Corre a su encuentro y les ofrece agua para lavarse los pies, descanso y una comida que Sara prepara con cariño. Los visitantes eran mensajeros de Dios y anuncian que Sara, ya anciana, tendrá un hijo.",
med:["Una casa restaurada se abre a los demás. La Carta a los Hebreos nos recuerda no olvidar la hospitalidad, porque gracias a ella algunos, sin saberlo, hospedaron ángeles (Heb 13,2).","Recibir bien no exige una casa grande ni comida cara. Exige un corazón abierto: un cafecito, una plática, un lugar en la mesa."],
perg:"¿Ha sido mi casa un lugar donde las personas se sienten bien recibidas?",
des:"Invita a alguien a tomar un café o a comer esta semana: una vecina, una persona que vive sola, un matrimonio amigo. Prepáralo con el cariño de Abraham y Sara.",
ora:"Señor, que nuestra casa tenga las puertas abiertas y un corazón acogedor. Que, al recibir a los demás, te reciba a ti. Amén."},

{t:"Fuerza para el cansancio",ref:"1 Rey 19, 3-8",v:"¡Levántate, come, porque todavía te queda mucho por caminar!",
exp:"El profeta Elías huye al desierto, perseguido y agotado. Se sienta debajo de un árbol y le dice a Dios que ya no puede más. Se queda dormido. Un ángel lo toca, le ofrece pan y agua y le dice que se levante y coma. Dos veces. Con la fuerza de esa comida, Elías camina cuarenta días hasta el monte de Dios.",
med:["Restaurar una casa cansa. Muchas mamás llegan, como Elías, a decirle a Dios que ya no pueden más. Dios no lo regañó: lo dejó dormir, le dio de comer y solo después le pidió que siguiera adelante.","A veces lo más espiritual que puedes hacer es descansar, comer bien y aceptar ayuda. Y alimentarte del Pan de la Eucaristía, que da fuerza para el camino."],
perg:"¿Qué necesitan hoy mi cuerpo y mi alma para seguir adelante?",
des:"Hoy, cuídate: duérmete más temprano, come con calma, pide ayuda con alguna tarea. Si puedes, ve a Misa entre semana para recibir el Pan del camino.",
ora:"Señor, tú conoces mi cansancio. Tócame como tocaste a Elías, aliméntame y dame fuerza para el camino. Amén."},

{t:"Un puente entre los que pelean",ref:"Gn 13, 5-12",v:"No quiero que haya altercados entre nosotros dos, ni tampoco entre sus pastores y los míos, porque somos hermanos.",
exp:"Abrán y su sobrino Lot tenían tantos rebaños que la tierra no alcanzaba para los dos, y sus pastores empezaron a pelear. Abrán, el mayor, pudo haber impuesto su voluntad. Pero propone la paz y deja que Lot escoja primero la tierra que quiera.",
med:["Jesús llamó dichosos a los que trabajan por la paz (Mt 5,9). Muchas veces la mamá es el puente entre el esposo y los hijos, entre los hermanos, entre las familias. Es una misión hermosa y cansada.","Abrán nos enseña que, para que haya paz, a veces alguien tiene que ceder primero. Ceder no es perder: es escoger la paz."],
perg:"¿Entre quiénes, en mi casa, necesito ser un puente de paz? ¿En qué puedo ceder?",
des:"Si hay un pleito pendiente entre personas de la casa, ayúdalas hoy a platicar con calma, cada una escuchando a la otra. Si el conflicto es tuyo, cede en algo pequeño por amor a la paz.",
ora:"Señor, hazme instrumento de tu paz. Donde haya discordia, que yo lleve la unión. Amén."},

{t:"Dios cuida nuestras necesidades",ref:"2 Rey 4, 1-7",v:"Ve a vender el aceite y paga la deuda; después, tú y tus hijos podrán vivir con el resto.",
exp:"Una viuda, llena de deudas, corre el riesgo de que se lleven a sus hijos como esclavos. Busca al profeta Eliseo, que le pregunta qué tiene en casa. Solo una vasija de aceite. Eliseo le dice que pida prestadas vasijas vacías a sus vecinos y que las llene todas con ese poquito de aceite. El aceite solo deja de correr cuando se acaban las vasijas.",
med:["La falta de dinero pesa mucho en una casa: trae pleitos, miedo y vergüenza. Dios no es indiferente a eso. Le preguntó a la viuda qué tenía en casa. Empezó por lo poco que ella tenía.","Restaurar las finanzas de la casa pide fe y también acciones: organizarse, platicar, recortar lo que sobra, buscar ayuda. Dios multiplica lo poco que se le entrega."],
perg:"¿Qué situación económica preocupa más a mi casa? ¿Qué tengo «en casa» para entregarle a Dios?",
des:"Haz hoy una lista sencilla de los gastos de la casa y mira en qué se puede ahorrar. Reza por las cuentas, poniéndolas delante de Dios. Comparte algo, por pequeño que sea, con alguien que tenga menos.",
ora:"Señor, tú multiplicaste el aceite de la viuda. Mira las necesidades de nuestra casa y danos sabiduría y lo necesario para vivir. Amén."},

{t:"La armadura de Dios",ref:"Ef 6, 10-18",v:"Revístanse con la armadura de Dios, para que puedan resistir las insidias del demonio.",
exp:"San Pablo recuerda que nuestra lucha no es contra las personas, sino contra el mal. Por eso pide a los cristianos que se pongan la armadura de Dios: el cinturón de la verdad, la coraza de la justicia, el calzado de la paz, el escudo de la fe, el casco de la salvación y la espada del Espíritu, que es la Palabra de Dios. Y que oren en todo momento.",
med:["Dios ama mucho a la familia, y por eso también es atacada: divisiones, adicciones, desánimo, mentiras. Muchas peleas en casa tienen una raíz espiritual.","Recuerda que tu esposo, tus hijos o tus suegros no son el enemigo. El enemigo es el mal que quiere dividir. Y contra él, la oración es el arma de la familia."],
perg:"¿Qué división o qué ataque ha sufrido mi casa? ¿He estado luchando contra las personas o contra el mal?",
des:"Reza hoy la oración a San Miguel Arcángel por toda tu familia. Lee Ef 6,10-18 y escoge una «pieza de la armadura» para ponértela esta semana (por ejemplo: la verdad, la paz, la fe).",
ora:"San Miguel Arcángel, defiende a nuestra familia en la batalla. Señor, revístenos con tu armadura y protege nuestra casa de todo mal. Amén."},

{t:"La alegría del Señor es nuestra fuerza",ref:"Neh 8, 8-12",v:"No estén tristes, porque la alegría en el Señor es la fortaleza de ustedes.",
exp:"Después del destierro, el pueblo reconstruye Jerusalén. El sacerdote Esdras lee la Ley de Dios a todos, y el pueblo llora al escucharla. Nehemías les dice que ese día está consagrado al Señor y que no estén tristes: que vayan, coman, beban y compartan con quien no tiene nada. Y el pueblo celebra con gran alegría.",
med:["Una casa restaurada también ríe. La alegría es señal de que Dios está presente y es fuerza para enfrentar los días difíciles.","A veces nos enfocamos tanto en los problemas que se nos olvida celebrar. Celebrar lo pequeño también es fe."],
perg:"¿Cuándo fue la última vez que mi familia celebró algo junta? ¿Qué podemos celebrar hoy?",
des:"Hagan hoy algo alegre juntos: un postre especial, una canción para bailar en la sala, un juego, un pícnic en el patio. Celebren una pequeña victoria de la familia.",
ora:"Señor, llena nuestra casa de tu alegría. Que sea nuestra fuerza en los días buenos y en los difíciles. Amén."},

{t:"El valor de los pequeños gestos",ref:"Mc 12, 41-44",v:"Les aseguro que esta pobre viuda ha puesto más que cualquiera de los otros…",
exp:"Jesús observa a la gente que deja sus ofrendas en el Templo. Muchos ricos echan mucho. Llega una viuda pobre y echa dos moneditas. Jesús llama a sus discípulos y les dice que ella dio más que todos, porque dio todo lo que tenía para vivir.",
med:["Dios no mide el tamaño del gesto, sino el amor que hay en él. La restauración de una casa se hace con pequeños gestos: una notita, un café llevado a la cama, los trastes lavados sin quejarse.","Tal vez sientas que tienes poco que dar. Pero, como la viuda, lo poco dado con amor vale más que mucho dado por obligación."],
perg:"¿Qué pequeño gesto de amor puedo ofrecerle hoy a cada persona de mi casa?",
des:"Haz hoy un pequeño gesto de amor para cada persona de la casa (una notita, un abrazo, su comida favorita, un elogio). Anota cómo reaccionó cada uno.",
ora:"Señor, que nunca desprecie los pequeños gestos. Recibe mis dos moneditas de amor y multiplícalas en mi casa. Amén."},

{t:"María en nuestra casa",ref:"Lc 1, 39-45. 56",v:"María permaneció con Isabel unos tres meses y luego regresó a su casa.",
exp:"Justo después del anuncio del ángel, María va de prisa a la casa de Isabel, que está embarazada y ya es mayor. Cuando llega, Juan salta de alegría en el vientre de Isabel. María se queda ahí tres meses, ayudando a su prima, hasta el nacimiento de Juan.",
med:["María llevó a Jesús a la casa de Isabel y se quedó ahí para servir. Donde María entra, llega Jesús y brota la alegría.","Invitar a María a tu casa es pedirle que cuide a tu familia con su manera de madre: atenta, discreta, servicial y llena de fe."],
perg:"¿Qué rincón de mi casa y de mi rutina puedo dedicarle a la Virgen María?",
des:"Arma o arregla un pequeño altar de oración en casa con una imagen de María, una vela y una flor. Recen ahí juntos un misterio del Rosario.",
ora:"María, entra en nuestra casa como entraste en la casa de Isabel. Trae a Jesús, trae la alegría y cuida de nuestra familia. Amén."},

{t:"Yo y mi casa serviremos al Señor",ref:"Jos 24, 14-18",v:"Yo y mi familia serviremos al Señor.",
exp:"Al final de su vida, Josué reúne al pueblo de Israel y le cuenta todo lo que Dios ha hecho por ellos. Después los pone frente a una decisión: ¿a quién van a servir? Y él mismo responde primero, por él y por su familia: servirán al Señor. El pueblo responde que también servirá al Señor.",
med:["Después de 21 días, es momento de mirar el camino recorrido y tomar una decisión, como Josué. Tal vez no todo haya cambiado, pero sembraste muchas semillas.","Josué no esperó a que todos estuvieran de acuerdo para decidir. Decidió por él y por la casa que guiaba. Tú también puedes decidir hoy que tu casa le pertenece al Señor."],
perg:"¿Qué cambió en mi casa y en mí en estos 21 días? ¿Qué decisión quiero tomar ahora?",
des:"Escribe el versículo de hoy en un papel bonito y ponlo en la puerta de entrada o en un lugar visible. Reúnanse para hacer juntos una oración de consagración de la familia.",
ora:"Señor, mi casa y yo te serviremos. Gracias por estos 21 días. Sigue restaurando y bendiciendo nuestro hogar. Amén."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="lar21"){PLANOS[i].d=D;PLANOS[i].resumo="Para cuando la casa se siente pesada: 21 días para recuperar la paz, el perdón, la oración y la alegría. Cada día trae una lectura explicada, una meditación, un espacio para escribir y un reto para vivir en casa.";}}
})();

// 14 días para ser una mamá más paciente: versión completa
(function(){
var D=[
{t:"La paciencia es fruto del Espíritu",ref:"Gál 5, 22-25",v:"el fruto del Espíritu es: amor, alegría y paz, magnanimidad, afabilidad, bondad y confianza, mansedumbre y temperancia.",
exp:"San Pablo enumera los frutos que el Espíritu Santo produce en quien vive unido a Dios. No habla de «frutos» separados, sino de un solo fruto con muchos sabores. La paciencia y el dominio de sí aparecen en la lista: no son logros del puro esfuerzo, sino regalos que crecen en nosotros.",
med:["Muchas mamás se culpan: «Debería tener más paciencia». Y lo intentan a pura fuerza de voluntad, hasta que vuelven a explotar. La buena noticia es que la paciencia no depende solo de ti.","El fruto se cultiva: con oración, descanso y tiempo. En estos 14 días vas a pedirle al Espíritu Santo, cada día, el fruto de la paciencia, y vas a dar pequeños pasos para que crezca."],
perg:"¿En qué momentos del día se me suele acabar la paciencia? ¿Qué pasa justo antes?",
des:"Escribe en un papel o en tu celular: «Espíritu Santo, dame tu fruto». Ponlo en un lugar donde lo veas varias veces al día (el refri, el espejo, la pantalla del celular) y rézalo cada vez que lo mires.",
ora:"Espíritu Santo, haz crecer en mí el fruto de la paciencia. Yo sola no puedo; actúa en mí. Amén."},

{t:"Dios es paciente conmigo",ref:"Lc 13, 6-9",v:"Señor, déjala todavía este año; yo removeré la tierra alrededor de ella y la abonaré.",
exp:"Jesús cuenta la parábola de un hombre que tenía una higuera que llevaba tres años sin dar fruto. Manda cortarla. Pero el viñador pide un año más: va a cavar alrededor, a abonarla y a esperar. Tal vez dé fruto.",
med:["Así es Dios conmigo: el viñador paciente que no se rinde, que pide un año más, que abona y espera. ¿Cuántas veces me ha esperado ya?","Cuando recordamos la paciencia que Dios nos tiene, es más fácil tenerles paciencia a nuestros hijos, que todavía están creciendo y aprendiendo."],
perg:"¿En qué área de mi vida ha sido Dios muy paciente conmigo?",
des:"Hoy, cuando alguno de tus hijos repita un error, recuerda: «Dios es paciente conmigo». En lugar de regañarlo, explícale otra vez con calma, como el viñador que abona la higuera.",
ora:"Señor, gracias por la paciencia que me tienes. Enséñame a ser con mis hijos el viñador que espera y cuida. Amén."},

{t:"Respirar antes de responder",ref:"Prov 15, 1. 18; 16, 32",v:"Una respuesta suave aplaca la ira, una palabra hiriente exacerba el furor. El hombre iracundo provoca altercados, el que tarda en enojarse aplaca las disputas. El que tarda en enojarse vale más que un héroe, y el dueño de sí mismo, más que un conquistador.",
exp:"El libro de los Proverbios reúne consejos prácticos para la vida. Enseña que una respuesta suave calma el enojo, mientras que una palabra dura enciende la pelea. Y dice que dominarse a uno mismo es una victoria más grande que conquistar una ciudad.",
med:["Entre lo que hace nuestro hijo y lo que respondemos hay un pequeño espacio. Ahí vive nuestra libertad. Cuando reaccionamos por impulso, ese espacio desaparece.","Respirar hondo tres veces antes de responder parece poco, pero crea el espacio para escoger la respuesta. Es un pequeño acto de dominio de sí, más grande que conquistar una ciudad."],
perg:"¿Cómo suelo reaccionar en el primer segundo de un conflicto con mis hijos?",
des:"Practica hoy la «regla de las 3 respiraciones»: cuando algo te irrite, respira hondo tres veces antes de decir cualquier cosa. En la noche, anota cuántas veces lo lograste.",
ora:"Señor, dame dominio de mí misma. Que entre lo que siento y lo que hago haya espacio para que actúe tu Espíritu. Amén."},

{t:"Cada etapa tiene su tiempo",ref:"Mc 4, 26-29",v:"la semilla germina y va creciendo, sin que él sepa cómo.",
exp:"Jesús compara el Reino de Dios con un hombre que siembra la semilla en la tierra. Duerme y se levanta, de noche y de día, y la semilla va creciendo sola: primero el tallo, luego la espiga, luego el grano lleno. Cuando el fruto está maduro, llega la cosecha.",
med:["Los hijos crecen por etapas, como la semilla: primero el tallo, luego la espiga y solo después el grano. Muchas veces les exigimos el grano maduro cuando todavía están en la etapa del tallo.","Un niño de dos años hace berrinches, uno de cinco desobedece para probar los límites, un adolescente se encierra en sí mismo. Cada etapa tiene su tiempo. Conocer la etapa ayuda a tener paciencia."],
perg:"¿Les estoy exigiendo a mis hijos algo que todavía no es propio de su edad?",
des:"Investiga o recuerda qué es lo esperado para la edad de cada uno de tus hijos. Escoge una actitud suya que te moleste y que sea típica de su etapa, y decide mirarla hoy con más comprensión.",
ora:"Señor, tú haces crecer la semilla a su tiempo. Dame paciencia con cada etapa de la vida de mis hijos. Amén."},

{t:"Una mamá cansada",ref:"Mt 11, 28-30",v:"Vengan a mí todos los que están afligidos y agobiados, y yo los aliviaré.",
exp:"Jesús invita a todos los que cargan demasiado peso a acercarse a él. Ofrece su yugo, que es suave, y su carga, que es ligera. Y se presenta como manso y humilde de corazón, alguien con quien el alma encuentra descanso.",
med:["Mucha impaciencia es cansancio acumulado: noches mal dormidas, trabajo, casa, hijos, todo al mismo tiempo. Una mamá agotada pierde la paciencia más rápido, y no por falta de amor.","Jesús no te pide que puedas con todo. Te invita a acercarte a él y descansar. Cuidarte no es egoísmo; es lo que te permite cuidar bien de los demás."],
perg:"¿Cuánto de mi cansancio se convierte en impaciencia con mis hijos? ¿Qué necesito para descansar?",
des:"Hoy, pide ayuda con alguna tarea (a tu esposo, a un hijo mayor, a alguien de la familia) y usa ese tiempo para descansar de verdad 15 minutos, sin culpa.",
ora:"Jesús, estoy cansada. Vengo a ti. Dame tu descanso y enséñame a pedir ayuda. Amén."},

{t:"La voz suave de Dios",ref:"1 Rey 19, 9-13",v:"Después del fuego, se oyó el rumor de una brisa suave.",
exp:"El profeta Elías está en una cueva, en el monte de Dios. Pasa un viento fortísimo, pero Dios no estaba en el viento. Después un terremoto, y Dios no estaba en el terremoto. Después un fuego, y Dios no estaba en el fuego. Al final, una brisa suave. Elías se cubre el rostro: ahí estaba Dios.",
med:["Dios escogió hablarle a Elías en una brisa suave, no en un grito. La manera de Dios es mansa.","Con los hijos, una voz fuerte puede asustarlos por un momento, pero no llega al corazón. Hablar bajito, de cerca, mirándolos a los ojos, funciona mucho mejor que gritar desde el otro lado de la casa."],
perg:"¿Cómo es mi tono de voz con mis hijos? ¿Me escuchan más cuando grito o cuando me acerco?",
des:"Hoy, cada vez que necesites llamar o corregir a uno de tus hijos, ve hasta donde está, agáchate a la altura de sus ojos y háblale bajito. Observa la diferencia en cómo reacciona.",
ora:"Señor, que mi voz sea como tu brisa suave. Quítame los gritos y dame la mansedumbre que llega al corazón. Amén."},

{t:"Pedirles perdón a mis hijos",ref:"1 Jn 1, 5-10",v:"Si confesamos nuestros pecados, él es fiel y justo para perdonarnos",
exp:"San Juan dice que Dios es luz y que quien camina en la luz está en comunión con él. Si decimos que no tenemos pecado, nos engañamos a nosotros mismos. Pero si reconocemos nuestros pecados, Dios nos perdona y nos purifica.",
med:["Cuando una mamá pide perdón, les enseña a sus hijos la humildad, a reparar un error y a reconocer que todos fallamos. Eso no le quita autoridad; aumenta el respeto.","Después de una explosión, muchas mamás sienten culpa y se quedan calladas. Pero la culpa sin perdón solo pesa. Pedir perdón y volver a empezar es mucho más sano para todos."],
perg:"¿Alguna vez les he pedido perdón a mis hijos? ¿Hay algo por lo que debería pedirlo hoy?",
des:"Si perdiste la paciencia con alguno de tus hijos hace poco, pídele perdón hoy con palabras sencillas: «Mamá se equivocó cuando te gritó. ¿Me perdonas?». Después, dense un abrazo.",
ora:"Señor, tú siempre me perdonas. Dame humildad para pedirles perdón a mis hijos y para enseñarles a perdonar. Amén."},

{t:"Corregir con amor",ref:"Heb 12, 5-11",v:"Porque el Señor corrige al que ama",
exp:"La Carta a los Hebreos recuerda que Dios nos corrige como un padre corrige a sus hijos. En el momento, toda corrección parece motivo de tristeza, pero después da frutos de paz y de justicia en quienes se dejaron educar por ella.",
med:["Corregir es necesario: los hijos sin límites se sienten inseguros. Pero la corrección que de verdad educa es la que nace del amor, no del enojo.","Corregir con amor es separar al hijo de su conducta: «Te quiero, y lo que hiciste no está bien». Es explicar el porqué, poner consecuencias justas y, después, abrazar."],
perg:"Cuando corrijo a mis hijos, ¿se sienten amados o rechazados?",
des:"La próxima vez que corrijas a uno de ellos, usa esta frase: «Te quiero, y por eso no puedo dejar que hagas esto». Después de la consecuencia, vuelve a acercarte con cariño.",
ora:"Señor, enséñame a corregir como tú me corriges: con firmeza, con justicia y con mucho amor. Amén."},

{t:"Una rutina que ayuda",ref:"Mc 1, 32-39",v:"Por la mañana, antes que amaneciera, Jesús se levantó, salió y fue a un lugar desierto; allí estuvo orando.",
exp:"Después de un día lleno, en el que sanó a muchos enfermos hasta tarde en la noche, Jesús se levanta de madrugada, antes del amanecer, y se va a orar a solas. Cuando los discípulos lo encuentran y le dicen que todos lo buscan, él ya sabe a dónde ir: a otros pueblos, a anunciar el Evangelio.",
med:["Muchos pleitos con los hijos suceden a las mismas horas: al despertar, al salir a la escuela, a la hora del baño, antes de dormir. Una rutina organizada evita muchos conflictos.","Jesús también tenía una rutina, y en el centro estaba la oración. Un momento con Dios antes de que la casa despierte cambia el tono de todo el día."],
perg:"¿A qué hora del día hay más conflictos en mi casa? ¿Qué se podría organizar mejor?",
des:"Escoge el momento más difícil del día y planéalo mejor: deja las cosas listas la noche anterior, avísales a los niños con tiempo, simplifica. Intenta levantarte 10 minutos antes para rezar.",
ora:"Señor, ayúdame a organizar la rutina de mi familia y a ponerte a ti en el centro. Amén."},

{t:"Cada hijo es único",ref:"Sal 139, 13-16",v:"te doy gracias porque fui formado de manera tan admirable.",
exp:"El salmista contempla la obra de Dios en sí mismo: Dios lo formó en el vientre de su madre, conoció cada parte de su ser y vio sus días antes de que existieran. Y lo alaba por haberlo hecho de un modo tan maravilloso.",
med:["Cada hijo fue tejido por Dios de manera única: con su propio ritmo, temperamento, dones y dificultades. Comparar a los hermanos (o compararlos con los hijos de otros) vuelve impaciente a la mamá y lastima a los hijos.","Cuando miramos a cada hijo como obra maravillosa de Dios, la paciencia crece. No tiene que ser como su hermano; tiene que ser quien Dios hizo."],
perg:"¿Suelo comparar a mis hijos entre ellos o con otros niños?",
des:"Hoy, dile a cada uno de tus hijos algo que lo hace único y especial a tus ojos. Evita cualquier comparación durante todo el día.",
ora:"Señor, gracias por cada hijo, obra maravillosa de tus manos. Enséñame a amar a cada uno tal como tú lo hiciste. Amén."},

{t:"Esperar los frutos",ref:"Sant 5, 7-11",v:"Miren cómo el sembrador espera el fruto precioso de la tierra…",
exp:"Santiago les pide a los cristianos que sean pacientes hasta la venida del Señor, como el agricultor que espera las lluvias. Les pide también que no se quejen unos de otros. Y recuerda a Job, que perseveró, y al Señor, que está lleno de misericordia.",
med:["Educar es sembrar hoy para cosechar dentro de muchos años. Muchas veces no vemos los frutos y pensamos que nada de lo que hacemos sirve.","El agricultor no arranca la planta para ver si la raíz está creciendo. Confía. Sigue sembrando: cada oración, cada plática, cada límite puesto con amor está creciendo, aunque no lo veas."],
perg:"¿Qué fruto estoy ansiosa por ver en mis hijos? ¿Puedo confiar en los tiempos de Dios?",
des:"Escribe una lista de las «semillas» que estás sembrando en tus hijos (fe, respeto, generosidad...). Reza entregándole esas semillas a Dios.",
ora:"Señor, enséñame a esperar como el agricultor. Que siga sembrando con amor y deje en tus manos el tiempo de la cosecha. Amén."},

{t:"Lo que hay detrás de la conducta",ref:"Mt 18, 1-5. 10",v:"Cuídense de despreciar a cualquiera de estos pequeños",
exp:"Los discípulos preguntan quién es el más grande en el Reino. Jesús llama a un niño, lo pone en medio de ellos y les dice que, si no se hacen como niños, no entrarán en el Reino. Y les advierte que no desprecien a ninguno de estos pequeños, porque sus ángeles ven siempre el rostro del Padre.",
med:["Detrás de una conducta difícil casi siempre hay una necesidad: hambre, sueño, celos, miedo, ganas de atención. El berrinche es el lenguaje de quien todavía no sabe decir lo que siente.","Jesús puso al niño en el centro. Escuchar el corazón de tu hijo antes de reaccionar a su conducta es tomar en serio a alguien que Dios valora tanto."],
perg:"¿Qué conducta difícil de alguno de mis hijos podría estar escondiendo una necesidad?",
des:"Hoy, frente a una conducta difícil, pregunta antes de corregir: «¿Qué te está pasando?». Escucha. Después, platiquen juntos sobre qué hacer.",
ora:"Jesús, que pusiste al niño en el centro, enséñame a escuchar el corazón de mis hijos detrás de cada actitud. Amén."},

{t:"Un espíritu manso y tranquilo",ref:"1 Pe 3, 3-4",v:"sino la actitud interior del corazón, el adorno incorruptible de un espíritu dulce y sereno. Esto es lo que vale a los ojos de Dios.",
exp:"San Pedro les escribe a las mujeres cristianas y les dice que la verdadera belleza no está en los peinados, las joyas o la ropa, sino en el corazón. Un espíritu manso y tranquilo es una belleza que no se marchita y que vale mucho a los ojos de Dios.",
med:["La mansedumbre no es debilidad ni pasividad. Es fuerza bajo control: la capacidad de ser firme sin ser dura. Jesús nos invitó a aprender de él, que es manso y humilde de corazón (Mt 11,29).","Un espíritu tranquilo no es el de una mamá que nunca siente enojo, sino el de una mamá que aprendió a volver a la paz más rápido. Y eso es precioso a los ojos de Dios."],
perg:"¿Qué me quita la tranquilidad? ¿Qué me ayuda a volver a la paz?",
des:"Escoge un «ancla de paz» para usar cuando te sientas alterada: una oración corta, un vaso de agua, salir del cuarto un minuto. Úsala hoy cada vez que la necesites.",
ora:"Jesús, manso y humilde de corazón, haz mi corazón semejante al tuyo. Dame un espíritu manso y tranquilo. Amén."},

{t:"Volver a empezar cada día",ref:"Lam 3, 19-26",v:"La misericordia del Señor no se extingue ni se agota su compasión; … ellas se renuevan cada mañana",
exp:"El libro de las Lamentaciones nace del dolor por la destrucción de Jerusalén. En medio del lamento, el autor recuerda algo que le devuelve la esperanza: el amor de Dios no se acaba, su misericordia se renueva cada mañana. Es bueno esperar en silencio la salvación del Señor.",
med:["No tienes que ser una mamá perfecta. Te vas a volver a equivocar y vas a volver a perder la paciencia. Pero cada mañana es una nueva oportunidad, porque la misericordia de Dios también es nueva.","Después de estos 14 días, mira con ternura el camino recorrido. Aunque hayas tropezado, creciste. La paciencia es un camino, no una meta."],
perg:"¿Qué cambió en mí en estos 14 días? ¿Qué paso quiero seguir dando?",
des:"Escríbete una carta con cariño, como lo haría una amiga: reconociendo tu esfuerzo, perdonando tus errores y recordándote que mañana es un nuevo día. Léela cuando te sientas desanimada.",
ora:"Señor, gracias porque tu misericordia se renueva cada mañana. Dame la gracia de volver a empezar cada día con paciencia y amor. Amén."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="paciencia14"){PLANOS[i].d=D;PLANOS[i].resumo="Dos semanas de pequeños pasos para cambiar los gritos por la calma, con la ayuda de la gracia de Dios. Cada día trae una lectura explicada, una meditación, un espacio para escribir y un reto práctico con tus hijos.";}}
})();

// 30 días de fe en la búsqueda de un embarazo: versión completa
(function(){
var D=[
{t:"Derramar el alma ante Dios",ref:"1 Sam 1, 9-18",v:"sólo me estaba desahogando delante del Señor.",
exp:"Ana no podía tener hijos. En el santuario de Silo, reza en silencio, solo moviendo los labios, con muchas lágrimas. El sacerdote Elí cree que está borracha. Ana le explica que está derramando su alma ante el Señor. Elí la bendice, y ella vuelve a casa con el rostro en paz.",
med:["El deseo de ser mamá es bueno y viene de Dios. No necesitas esconderlo ni fingir que todo está bien. Ana no fingió: derramó el alma entera.","Lo más hermoso es el final: antes de cualquier respuesta, Ana ya se va con el rostro en paz. La paz le llegó al entregar, no al recibir. En estos 30 días vas a aprender a entregarle este sueño a Dios, día tras día."],
perg:"Si hoy derramara mi alma ante Dios, ¿qué le diría?",
des:"Escríbele a Dios una carta sincera contándole todo lo que sientes sobre tu deseo de ser mamá: el sueño, el miedo, el dolor, la esperanza. Guárdala dentro de tu Biblia.",
ora:"Señor, derramo ante Ti mi corazón. Tú conoces mi deseo. Dame tu paz mientras espero. Amén."},

{t:"Dios me conoce por dentro",ref:"Sal 139, 1-12",v:"Señor, tú me sondeas y me conoces",
exp:"El salmista reconoce que Dios lo conoce por completo: cuando se sienta y cuando se levanta, sus pensamientos, sus palabras antes de decirlas. No hay lugar adonde pueda ir sin que Dios esté: ni en el cielo, ni en el abismo, ni en la oscuridad, que para Dios es clara como el día.",
med:["Dios conoce cada pensamiento tuyo, cada lágrima escondida en el baño, cada prueba negativa que nadie más vio. Nada de lo que vives le pasa desapercibido.","A veces la espera nos hace sentir solas e incomprendidas. El salmo nos recuerda que no hay oscuridad donde Dios no esté contigo."],
perg:"¿Qué parte de mi espera siento que nadie entiende? ¿Ya se la conté a Dios?",
des:"Lee despacio todo el Salmo 139 y subraya (o anota) el versículo que más tocó tu corazón. Repítelo durante el día.",
ora:"Señor, Tú me conoces por dentro. Gracias porque no estoy sola, ni siquiera en la oscuridad. Amén."},

{t:"Cuando la espera duele",ref:"1 Sam 1, 1-8",v:"Ana, ¿por qué lloras y no quieres comer? ¿Por qué estas triste?",
exp:"Ana era muy amada por su esposo, Elcaná, pero sufría por no tener hijos. Cada año, cuando iban al santuario, la otra esposa de Elcaná la provocaba. Ana lloraba y no comía. Elcaná intenta consolarla y le pregunta si él no vale para ella más que diez hijos.",
med:["El dolor de buscar un bebé muchas veces crece con los comentarios: «¿Y para cuándo el bebé?», «Relájate y ya llegará». Como Ana, puedes sentirte herida incluso en lugares que deberían ser de alegría.","Elcaná amaba a Ana, pero no lograba entender del todo su dolor. No siempre las personas van a entender. Dios sí entiende. Y tienes derecho a protegerte de los comentarios que hieren."],
perg:"¿Qué comentarios o situaciones han hecho más grande mi dolor? ¿Cómo puedo protegerme con amor?",
des:"Piensa en una frase sencilla y amable para responder a las preguntas indiscretas (por ejemplo: «Lo estamos dejando en manos de Dios»). Reza por las personas que te hieren sin querer.",
ora:"Señor, Tú ves mis lágrimas como viste las de Ana. Protege mi corazón de las palabras que hieren y dame paz. Amén."},

{t:"Para Dios nada es demasiado difícil",ref:"Gn 18, 9-15",v:"¿Acaso hay algo imposible para el Señor?",
exp:"Tres visitantes llegan a la tienda de Abraham y anuncian que Sara, ya anciana, tendrá un hijo al año siguiente. Sara, escondida detrás de la entrada, se ríe por dentro: le parece imposible. Dios pregunta por qué se rió Sara y si acaso hay algo demasiado difícil para el Señor. Un año después nace Isaac, cuyo nombre significa «risa».",
med:["Sara se rió porque le pareció imposible. Tal vez tú también te has reído así, de cansancio o de incredulidad. Dios no regañó a Sara; solo le recordó quién es Él.","La pregunta de Dios no es una promesa de que todo pasará como queremos, sino una invitación a no ponerle límites a lo que Él puede hacer."],
perg:"¿En qué le he estado poniendo límites a lo que Dios puede hacer en mi vida?",
des:"Escribe el versículo de hoy en una tarjeta y ponla donde la veas todos los días, sobre todo en los días de desánimo.",
ora:"Señor, para Ti nada es imposible. Quítame la incredulidad y enséñame a confiar en tu poder y en tu amor. Amén."},

{t:"Dios se acordó de Raquel",ref:"Gn 30, 22-24",v:"Dios también se acordó de Raquel, la escuchó e hizo fecundo su seno.",
exp:"Raquel, la esposa muy amada de Jacob, no tenía hijos, mientras que su hermana Lía tenía varios. Sufrió por eso durante años. Un día, la Biblia dice sencillamente que Dios se acordó de Raquel. Ella da a luz a José, que llegaría a ser un gran hombre de Dios.",
med:["A veces parece que Dios se olvidó de nosotras, mientras todos a nuestro alrededor reciben lo que pedimos. Raquel también lo sintió.","Pero en la Biblia, cuando Dios «se acuerda», no es porque se hubiera olvidado: es porque llegó el tiempo de actuar. No estás olvidada. Dios guarda tu nombre."],
perg:"¿En qué momentos me siento olvidada por Dios?",
des:"Escribe tu nombre en un papel y, debajo, la frase: «Dios no se olvida de mí». Reza hoy con esas palabras y entrégale tus comparaciones.",
ora:"Señor, acuérdate de mí. Aun cuando me siento olvidada, sé que mi nombre está guardado en tu corazón. Amén."},

{t:"Tu oración ha sido escuchada",ref:"Lc 1, 8-17",v:"No temas, Zacarías; tu súplica ha sido escuchada. Isabel, tu esposa, te dará un hijo",
exp:"Zacarías era sacerdote y, junto con Isabel, llevaba muchos años rezando por un hijo. Ya eran ancianos. Mientras él ofrece el incienso en el Templo, se le aparece el ángel Gabriel y le dice que su oración ha sido escuchada. Isabel tendrá un hijo, Juan, que preparará el camino del Señor.",
med:["Isabel y Zacarías rezaron durante muchos años, quizá ya sin mucha esperanza. Pero ninguna de esas oraciones se perdió. Dios guardó cada una.","Ninguna de tus oraciones cae en el vacío. Dios escucha. La respuesta puede llegar de una manera o en un tiempo distintos de lo que imaginamos, pero Él escucha."],
perg:"¿Qué oración llevo mucho tiempo haciendo y a veces pienso que Dios no escucha?",
des:"Enciende una vela (o haz algún gesto simbólico) y reza, junto con tu esposo si es posible, entregándole de nuevo a Dios tu petición de un hijo.",
ora:"Señor, sé que escuchas mi oración. Guarda cada una de mis peticiones y respóndeme en tu tiempo y a tu manera. Amén."},

{t:"Santa Ana y San Joaquín",ref:"Rom 12, 9-12",v:"Alégrense en la esperanza, sean pacientes en la tribulación y perseverantes en la oración.",
exp:"La Biblia no cuenta la historia de los papás de la Virgen María, pero la tradición de la Iglesia conservó sus nombres: Joaquín y Ana. Según un antiguo relato cristiano, ellos también esperaron muchos años un hijo, rezando con fe, hasta que Dios les dio a María. En la lectura de hoy, San Pablo describe justamente esa actitud: alegría en la esperanza, paciencia y oración.",
med:["Joaquín y Ana son patronos de los abuelos y muy invocados por los matrimonios que esperan hijos. Ellos entienden la espera, porque la vivieron.","Vivir con alegría la esperanza, con paciencia la prueba y con constancia la oración: no es una lista de exigencias, es un camino. Pídeles a los dos que lo recorran con ustedes."],
perg:"¿Cómo está mi esperanza: alegre o cansada? ¿Qué me ayudaría a perseverar?",
des:"Reza hoy, con tu esposo si es posible, pidiendo la intercesión de San Joaquín y Santa Ana por el deseo de ustedes. Si puedes, busca una imagen de ellos.",
ora:"San Joaquín y Santa Ana, ustedes que esperaron con fe, intercedan por nosotros. Alcáncennos alegría en la esperanza y perseverancia en la oración. Amén."},

{t:"Un ciclo a la vez",ref:"Mt 6, 31-34",v:"No se inquieten por el día de mañana; el mañana se inquietará por sí mismo. A cada día le basta su aflicción.",
exp:"Jesús habla de la angustia por las necesidades de la vida. Recuerda que el Padre sabe lo que necesitamos y nos pide buscar primero el Reino de Dios. Y concluye: no se preocupen por el mañana; cada día ya trae su propio peso.",
med:["La espera de cada mes puede convertirse en ansiedad: contar días, buscar señales, imaginar, desilusionarse. La vida entera queda colgando del próximo resultado.","Jesús te invita a vivir un día a la vez. Hoy, solo hoy. No es renunciar al sueño; es no dejar que te robe la vida que está pasando ahora."],
perg:"¿Cuánto de mi vida he dejado en pausa esperando el próximo resultado?",
des:"Haz hoy algo que te dé alegría y que no tenga nada que ver con la espera: un paseo, una receta nueva, un rato con tus amigas. Vive este día entero.",
ora:"Señor, enséñame a vivir un día a la vez. Quítame la ansiedad y devuélveme la alegría del hoy. Amén."},

{t:"El tiempo de Dios",ref:"Ecl 3, 1-11",v:"El hizo todas las cosas apropiadas a su tiempo, pero también puso en el corazón del hombre el sentido del tiempo pasado y futuro…",
exp:"El sabio Qohélet reflexiona que todo en la vida tiene su tiempo: nacer y morir, plantar y cosechar, llorar y reír. Y concluye que Dios hace todo hermoso a su tiempo, aunque el ser humano no logre entender toda la obra de Dios, de principio a fin.",
med:["El tiempo de Dios no es el nuestro, y eso duele. Queremos entender por qué, cuándo, hasta cuándo. Pero el texto nos recuerda que solo vemos un pedazo de la historia.","Confiar en el tiempo de Dios no es cruzarse de brazos, sino descansar en la certeza de que Él hace todo hermoso, aunque todavía no lo podamos ver."],
perg:"¿Qué es lo que más me angustia del «tiempo de Dios»?",
des:"Dibuja una línea del tiempo sencilla de tu vida y marca los momentos en que Dios actuó en el tiempo justo, aunque en ese momento no lo entendieras.",
ora:"Señor, Tú haces todo hermoso a su tiempo. Enséñame a confiar en tu reloj, aun cuando parece lento. Amén."},

{t:"Cuando el resultado no llega",ref:"Sal 34, 2-9. 18-19",v:"El Señor está cerca del que sufre y salva a los que están abatidos.",
exp:"David escribe este salmo después de escapar de un gran peligro. Invita a todos a bendecir al Señor y cuenta que buscó a Dios y fue escuchado. Y afirma que el Señor está cerca de los que tienen el corazón herido y salva a los de espíritu abatido.",
med:["Hay días en que llega la noticia y el corazón se cae. En esos días no tienes que ser fuerte ni encontrar palabras bonitas. Solo necesitas saber que Dios está cerca.","Él no está cerca solo de los que están bien. Está especialmente cerca de quien tiene el corazón roto. Déjate consolar."],
perg:"¿Cómo suelo reaccionar cuando el resultado no llega? ¿Me dejo consolar por Dios y por mi esposo?",
des:"Pónganse de acuerdo, tú y tu esposo, en un «ritual de consuelo» para los días difíciles: un abrazo largo, una oración juntos, un paseo. Escribe aquí cómo será.",
ora:"Señor, Tú estás cerca de los corazones heridos. En los días tristes, abrázame y dame fuerza para seguir. Amén."},

{t:"Llorar también es orar",ref:"Jn 11, 32-36",v:"Y Jesús lloró.",
exp:"Lázaro, el amigo de Jesús, ha muerto. Cuando Jesús llega, María, la hermana de Lázaro, cae a sus pies llorando. Jesús se conmueve profundamente y pregunta dónde lo pusieron. Y entonces Jesús llora. La gente comenta cuánto lo quería.",
med:["Es el versículo más corto de la Biblia y uno de los que más consuelan. Jesús, aun sabiendo que iba a resucitar a Lázaro, lloró con los que lloraban.","Las lágrimas no son falta de fe: son el corazón hablándole a Dios sin palabras. Jesús llora contigo."],
perg:"¿Me permito llorar? ¿O pienso que llorar es señal de poca fe?",
des:"Hoy, si llegan las lágrimas, déjalas salir delante de Dios, sin culpa. Después, escribe aquí lo que había en tu corazón.",
ora:"Jesús, que lloraste con Marta y María, llora también conmigo. Recibe mis lágrimas como oración. Amén."},

{t:"Juntos en la espera",ref:"Tob 8, 4-8",v:"¡Ten misericordia de ella y de mí, y concédenos llegar juntos a la vejez!",
exp:"En su noche de bodas, Tobías y Sara se levantan y rezan juntos. Tobías bendice a Dios, recuerda la creación de Adán y Eva y le pide misericordia para los dos y que lleguen juntos a la vejez. Y ambos responden: amén, amén.",
med:["La espera puede unir o alejar a la pareja. A veces uno sufre más, el otro intenta resolverlo todo, y la intimidad se vuelve solo un intento más. Hace falta cuidar el «nosotros», no solo el sueño.","Tobías y Sara empezaron su matrimonio rezando juntos. El amor de ustedes es su primera familia, y merece ser cuidado, con hijos o sin ellos."],
perg:"¿Cómo ha afectado la espera a mi matrimonio? ¿Qué necesito cuidar en nuestro «nosotros»?",
des:"Recen juntos hoy la oración de Tobías y Sara (Tob 8, 5-8). Planeen un rato a solas los dos que no tenga nada que ver con la espera.",
ora:"Señor, ten misericordia de nosotros dos. Únenos cada vez más en esta espera y concédenos llegar juntos a la vejez en tu amor. Amén."},

{t:"Cuidar mi cuerpo con cariño",ref:"1 Cor 6, 19-20",v:"sus cuerpos son templo del Espíritu Santo, que habita en ustedes … Glorifiquen entonces a Dios en sus cuerpos.",
exp:"San Pablo les recuerda a los cristianos de Corinto que el cuerpo no es algo sin importancia: es templo del Espíritu Santo. Fuimos comprados a un precio muy alto, la sangre de Cristo. Por eso, el cuerpo también es un lugar para glorificar a Dios.",
med:["Tu cuerpo no es un enemigo ni un defecto. Es templo de Dios, aunque no responda como te gustaría.","Cuidar tu cuerpo con cariño (alimentación, descanso, ejercicio, atención médica) es un acto de amor y de fe. No por presión, sino por respeto al templo que Dios te dio."],
perg:"¿Cómo he mirado mi cuerpo en esta espera: con ternura o con enojo?",
des:"Haz hoy algo para cuidar tu cuerpo: una caminata, una comida nutritiva, dormirte más temprano, agendar una cita médica pendiente. Da gracias a Dios por tu cuerpo.",
ora:"Señor, gracias por mi cuerpo, templo de tu Espíritu. Enséñame a cuidarlo con cariño y a no verlo como un enemigo. Amén."},

{t:"Cuando alguien más anuncia un embarazo",ref:"Rom 12, 9-16",v:"Alégrense con los que están alegres, y lloren con los que lloran.",
exp:"San Pablo describe cómo debe ser el amor entre los cristianos: sincero, fraterno, generoso. Entre sus consejos, pide alegrarse con los que se alegran y llorar con los que lloran, viviendo en armonía unos con otros.",
med:["Uno de los momentos más difíciles cuando buscas un bebé es escuchar el anuncio del embarazo de otra persona: una amiga, una hermana, una compañera de trabajo. La alegría ajena puede doler mucho, y eso no te hace una mala persona.","Puedes alegrarte por ella y, al mismo tiempo, sentir tu propio dolor. Las dos cosas caben en el corazón. Llévale las dos a Dios."],
perg:"¿Cómo me siento cuando alguien cercano anuncia un embarazo? ¿Se lo llevo a Dios?",
des:"Si alguien cercano está embarazada, reza hoy por ella y por su bebé. Después, reza por ti, entregando el dolor que esa noticia te provoca. Escribe aquí los dos sentimientos.",
ora:"Señor, dame un corazón que se alegre con la alegría de los demás, y abraza mi dolor cuando llegue. Amén."},

{t:"Sin culpa",ref:"Rom 8, 1-2. 31-39",v:"ya no hay condenación para aquellos que viven unidos a Cristo Jesús.",
exp:"San Pablo afirma que, en Cristo, ya no hay condenación. Y hace una serie de preguntas: si Dios está de nuestra parte, ¿quién estará contra nosotros? ¿Quién nos separará del amor de Cristo? Y responde: nada, ni la muerte, ni la vida, ni lo presente, ni lo futuro.",
med:["Muchas mujeres que buscan un embarazo cargan culpas: «¿Será un castigo?», «¿Habré hecho algo mal?», «¿Esperé demasiado?». Esas preguntas pesan mucho, y no vienen de Dios.","Dios no castiga con la infertilidad. Él está de tu lado. Y nada, absolutamente nada, puede separarte de su amor."],
perg:"¿Qué culpa cargo en relación con la espera? ¿Estoy lista para entregársela a Dios?",
des:"Escribe en un papel la culpa que cargas. Lee en voz alta Rom 8, 1 y después rompe el papel. Si lo necesitas, lleva esto también a la Confesión.",
ora:"Señor, no hay condenación para quien está en Ti. Quítame toda culpa y hazme descansar en tu amor. Amén."},

{t:"Descansar en los brazos de Dios",ref:"Sal 131, 2",v:"No, yo aplaco y modero mis deseos: como un niño tranquilo en brazos de su madre, así está mi alma dentro de mí.",
exp:"Es un salmo pequeñito, de apenas tres versículos. El salmista dice que no busca cosas demasiado grandes para él y que ha calmado su alma como un niño que descansa en el regazo de su madre. E invita al pueblo a esperar en el Señor.",
med:["Dios quiere ser para ti lo que una mamá es para su bebé: brazos, seguridad, descanso. Qué imagen tan hermosa para quien desea tanto ser mamá.","Hoy no tienes que resolver nada ni entender nada. Solo descansar en los brazos de Dios, como una niña pequeña."],
perg:"¿Qué necesito dejar de intentar resolver para poder descansar en Dios?",
des:"Aparta hoy 10 minutos de silencio. Acuéstate o siéntate cómoda y repite despacio: «Descanso en tus brazos, Señor». Nada más.",
ora:"Señor, calmo mi alma en tus brazos. No necesito entenderlo todo; solo quiero descansar en Ti. Amén."},

{t:"María, Madre de las madres",ref:"Jn 19, 25-27",v:"Aquí tienes a tu madre",
exp:"Al pie de la cruz, Jesús entrega a María como madre al discípulo amado, y al discípulo como hijo a María. Desde aquella hora, el discípulo la recibe en su casa. La Iglesia ve en este gesto a Jesús que nos entrega a María como Madre de todos.",
med:["La Virgen María es madre de todas las madres y de todas las que desean serlo. Ella entiende tu corazón como nadie.","No estás sola. Tienes una Madre en el cielo que reza por ti y contigo, y que conoce el valor de cada vida."],
perg:"¿Qué petición quiero poner hoy en las manos de la Virgen María?",
des:"Reza hoy un Rosario (o una decena) pidiendo la intercesión de la Virgen María por tu deseo de ser mamá.",
ora:"María, Madre de las madres, recibe mi deseo y preséntaselo a Jesús. Enséñame a confiar como tú confiaste. Amén."},

{t:"San Gerardo Mayela",ref:"Sant 5, 13-18",v:"La oración perseverante del justo es poderosa.",
exp:"Santiago enseña a orar en toda situación. Recuerda al profeta Elías, un hombre como nosotros, que oró con fervor para que no lloviera, y no llovió; después volvió a orar, y el cielo dio la lluvia y la tierra dio su fruto.",
med:["San Gerardo Mayela, religioso redentorista italiano del siglo XVIII, es conocido como patrono de las madres y de las mujeres embarazadas. Muchas mujeres piden su intercesión mientras esperan un hijo.","La oración de los santos tiene poder porque están unidos a Dios. No estamos solas: tenemos amigos en el cielo que rezan por nosotras."],
perg:"¿Suelo pedir la intercesión de los santos? ¿Qué santo me acompaña en esta espera?",
des:"Busca la oración a San Gerardo Mayela y rézala hoy. Si quieres, empieza una novena en su honor.",
ora:"San Gerardo Mayela, patrono de las madres, intercede por mí ante Dios. Que se cumpla en mí la voluntad del Padre. Amén."},

{t:"Santa Gianna, una mamá valiente",ref:"1 Jn 4, 16-19",v:"En el amor no hay lugar para el temor: al contrario, el amor perfecto elimina el temor",
exp:"San Juan dice que Dios es amor, y quien permanece en el amor permanece en Dios. Y afirma que en el amor no hay temor, porque el amor perfecto echa fuera el temor. Nosotros amamos porque Dios nos amó primero.",
med:["Santa Gianna Beretta Molla fue médica, esposa y mamá en la Italia del siglo XX. Amaba mucho la vida, a su familia y a sus hijos, y es ejemplo de que la santidad se vive en el día a día.","El miedo suele acompañar la espera: miedo a que no suceda, miedo a los estudios, miedo al futuro. Santa Gianna nos enseña a vivir el amor que echa fuera el miedo."],
perg:"¿Qué miedo ha acompañado mi espera?",
des:"Lee un poco sobre la vida de Santa Gianna. Escribe aquí uno de tus miedos y, a su lado, el versículo de hoy.",
ora:"Santa Gianna, intercede por mí. Señor, que tu amor eche fuera de mi corazón todo miedo. Amén."},

{t:"Confiar sin entender",ref:"Prov 3, 5-8",v:"Confía en el Señor y de todo corazón y no te apoyes en tu propia inteligencia…",
exp:"El libro de los Proverbios aconseja confiar en Dios con todo el corazón, y no solo en lo que alcanzamos a entender. En todos nuestros caminos hay que reconocer a Dios, y Él enderezará nuestras sendas.",
med:["Queremos entender: ¿por qué a mí? ¿Por qué ahora? ¿Hasta cuándo? No siempre tendremos las respuestas.","Confiar sin entender es la fe más difícil y la más hermosa. No es apagar la razón, sino reconocer que Dios ve más lejos que nosotros."],
perg:"¿Qué «por qué» todavía no he podido entregarle a Dios?",
des:"Escribe en una hoja todas tus preguntas sin respuesta. Al final, escribe: «Señor, confío en Ti, aunque no entienda».",
ora:"Señor, no entiendo todo, pero confío en Ti con todo mi corazón. Endereza mis caminos. Amén."},

{t:"Soy más que esta espera",ref:"Ef 2, 4-10",v:"Nosotros somos creación suya: fuimos creados en Cristo Jesús, a fin de realizar aquellas buenas obras, que Dios preparó de antemano",
exp:"San Pablo nos recuerda que Dios, rico en misericordia, nos dio vida en Cristo por pura gracia, no por mérito nuestro. Y dice que somos obra de Dios, como una obra maestra, creados para las buenas obras que Él mismo preparó para nosotros.",
med:["Tu valor no depende de ser mamá o no. Eres obra maestra de Dios ahora, tal como eres. La espera es parte de tu historia, pero no es toda tu historia.","Dios preparó buenas obras para ti: en el trabajo, en tu matrimonio, en tu familia, en la Iglesia, en la vida de otras personas. Hoy, míralas también."],
perg:"¿Qué dones y buenas obras ha puesto Dios en mi vida, además de esta espera?",
des:"Haz una lista de cinco cosas buenas que eres o que haces (cualidades, talentos, maneras de servir). Haz hoy una buena obra por alguien, como expresión de quien eres.",
ora:"Señor, gracias porque soy obra tuya. Ayúdame a ver mi valor en Ti y a vivir las buenas obras que preparaste para mí. Amén."},

{t:"Agradecer lo que ya tengo",ref:"1 Tes 5, 16-18",v:"Den gracias a Dios en toda ocasión: esto es lo que Dios quiere de todos ustedes",
exp:"Al final de su carta, San Pablo le da a la comunidad tres consejos breves: estar siempre alegres, orar sin cesar y dar gracias en todo. Esa es la voluntad de Dios en Cristo Jesús.",
med:["La gratitud no borra el deseo, pero abre los ojos a lo que Dios ya nos ha dado: un esposo, un hogar, la salud, las amigas, la fe. Cuando el deseo ocupa toda la mirada, dejamos de ver los regalos que nos rodean.","Pablo no pide dar gracias por todas las circunstancias, sino en todas ellas. Aun en medio de la espera hay motivos para agradecer."],
perg:"¿Qué regalos de Dios he dejado de ver por causa de la espera?",
des:"Escribe hoy una lista de 10 cosas por las que estás agradecida. Léela en voz alta, como oración.",
ora:"Señor, gracias por todo lo que ya me has dado. Abre mis ojos a tus regalos, aun mientras espero. Amén."},

{t:"Fe en los estudios y las consultas",ref:"Sal 121, 2",v:"La ayuda me viene del Señor, que hizo el cielo y la tierra.",
exp:"Este salmo lo rezaban los peregrinos que subían a Jerusalén. Mirando los montes, se preguntan de dónde vendrá su ayuda. Y responden: del Señor, que no duerme ni descansa, y que cuida nuestra entrada y nuestra salida.",
med:["Las consultas, los estudios, los tratamientos y la espera de resultados pueden ser agotadores y llenos de ansiedad. La fe y la medicina no compiten: Dios también actúa a través de las manos de los médicos.","Cuando vayas a una consulta o a un estudio, recuerda: tu ayuda viene del Señor. Él cuida tu entrada y tu salida."],
perg:"¿Cómo me siento ante las consultas y los estudios? ¿Se los entrego a Dios?",
des:"Reza por los médicos y por todo el personal de salud que los acompaña a ustedes dos. Antes de tu próxima consulta o estudio, reza el Salmo 121.",
ora:"Señor, mi ayuda viene de Ti. Guía a los médicos, calma mi corazón y cuida mi entrada y mi salida. Amén."},

{t:"Una esperanza que no defrauda",ref:"Rom 5, 1-5",v:"Y la esperanza no quedará defraudada, porque el amor de Dios ha sido derramado en nuestros corazones por el Espíritu Santo, que nos ha sido dado.",
exp:"San Pablo explica que, por Jesús, tenemos paz con Dios. Y dice algo sorprendente: las dificultades producen constancia, la constancia produce una fe probada, y la fe probada produce esperanza. Y esa esperanza no defrauda, porque se apoya en el amor de Dios.",
med:["La esperanza cristiana no es solo desear que algo suceda. Es la certeza de que Dios nos ama y nos cuida, pase lo que pase.","Por eso no defrauda: se apoya en el amor de Dios, y no en los resultados. Pide hoy esa esperanza más profunda."],
perg:"¿Dónde se apoya mi esperanza: en el resultado o en el amor de Dios?",
des:"Escribe una oración pidiéndole a Dios una esperanza que no dependa de los resultados. Rézala esta noche con tu esposo.",
ora:"Dios de la esperanza, lléname de alegría y de paz en la fe. Que mi esperanza se apoye en tu amor. Amén."},

{t:"Dios no se olvida de mí",ref:"Is 49, 14-16",v:"¿Se olvida una madre de su criatura … ¡Pero aunque ella se olvide, yo no te olvidaré!",
exp:"El pueblo de Israel, en el destierro, decía que el Señor lo había abandonado y olvidado. Y Dios responde con una imagen de madre: ¿puede una mujer olvidarse del niño que amamanta? Aunque ella lo olvidara, Dios no olvida. Y dice que los lleva grabados en la palma de sus manos.",
med:["Tu corazón de mamá ya existe. Ya amas a alguien que todavía no llega. Dios, que te dio ese corazón, también tiene un corazón de madre para ti.","Tu nombre está grabado en la palma de la mano de Dios. Él no te olvida, ni olvida tu deseo."],
perg:"¿Cómo me siento al saber que mi nombre está grabado en las manos de Dios?",
des:"Escribe tu nombre en la palma de tu mano (con pluma) y déjalo ahí todo el día, recordando que Dios hizo lo mismo contigo.",
ora:"Señor, Tú no te olvidas de mí. Grabaste mi nombre en tus manos. Consuela mi corazón de mamá. Amén."},

{t:"El sí de María",ref:"Lc 1, 26-38",v:"Yo soy la servidora del Señor, que se cumpla en mí lo que has dicho.",
exp:"El ángel Gabriel le anuncia a María que será la Madre del Hijo de Dios. María hace una pregunta sincera: cómo va a suceder eso. El ángel le explica y le recuerda que Isabel, a quien llamaban estéril, está embarazada, porque para Dios nada es imposible. Y María dice su sí.",
med:["El sí de María no fue resignación, sino confianza activa. Preguntó, entendió lo que pudo y se entregó por completo.","Abrirse a la voluntad de Dios es decir: «Lo deseo mucho, Señor, pero deseo todavía más lo que Tú quieres para mí». Es una oración difícil y liberadora."],
perg:"¿Puedo pedirle a Dios que se haga su voluntad sobre mi deseo de ser mamá?",
des:"Reza hoy el Ángelus (o tres Avemarías), pidiéndole a María un corazón abierto a la voluntad de Dios.",
ora:"María, enséñame tu sí. Deseo mucho este hijo, Señor, pero deseo todavía más tu voluntad. Que se haga en mí lo que Tú quieras. Amén."},

{t:"El hijo que Dios ya conoce",ref:"Jer 1, 4-5",v:"Antes de formarte en el vientre materno, yo te conocía",
exp:"Dios llama al joven Jeremías para ser profeta y le dice que ya lo conocía antes de formarlo en el vientre de su madre. Antes de nacer, Jeremías ya tenía un lugar en el corazón y en el plan de Dios.",
med:["Dios ya conoce a los hijos que llegarán a tu familia, ya sea por el embarazo, por la adopción o como hijos espirituales. Puedes rezar por ellos desde ahora.","Rezar por el hijo que todavía no llega es una manera de amarlo desde ahora. La maternidad empieza en el corazón."],
perg:"¿Qué me gustaría decirle ya al hijo que todavía no llega?",
des:"Escríbele una carta al hijo que esperas. Cuéntale de tu amor, de tus oraciones y de cuánto lo esperas. Guárdala con cariño.",
ora:"Señor, Tú ya conoces a los hijos que llegarán a nuestra familia. Bendícelos desde ahora y prepara nuestro corazón para recibirlos. Amén."},

{t:"Rezar por otras mujeres que esperan",ref:"Gál 6, 1-2. 9-10",v:"Ayúdense mutuamente a llevar las cargas, y así cumplirán la Ley de Cristo.",
exp:"San Pablo pide a los cristianos que se ayuden unos a otros a llevar las cargas de la vida. Y nos anima: no nos cansemos de hacer el bien, porque a su tiempo cosecharemos, si no nos desanimamos.",
med:["Muchas mujeres viven esta misma espera, muchas veces en silencio. Rezar por ellas nos ayuda a mirar más allá de nuestro propio dolor y nos une en una gran cadena de oración.","Quien ha vivido esta espera entiende como nadie el dolor de otra mujer que busca un bebé. Tal vez Dios quiera usar tu historia para consolar a alguien."],
perg:"¿Conozco a otras mujeres que viven esta misma espera? ¿Cómo puedo apoyarlas?",
des:"Reza hoy, por su nombre, por otras mujeres que conoces y que están buscando un embarazo (o por todas las que esperan, si no conoces a ninguna). Si te nace, envíale a una de ellas un mensaje cariñoso.",
ora:"Señor, te presento a todas las mujeres que esperan un hijo. Consuélalas, fortalécelas y cumple sus deseos según tu voluntad. Amén."},

{t:"La paz que guarda el corazón",ref:"Flp 4, 4-7",v:"la paz de Dios, que supera todo lo que podemos pensar, tomará bajo su cuidado los corazones y los pensamientos de ustedes en Cristo Jesús.",
exp:"San Pablo pide a los cristianos que estén siempre alegres en el Señor y que no se angustien por nada. Más bien, que le presenten todo a Dios en oración, con acción de gracias. Y promete que la paz de Dios guardará su corazón y sus pensamientos, como un soldado guarda una ciudad.",
med:["La paz de Dios no depende de entenderlo todo ni de tenerlo todo resuelto. Supera todo entendimiento: llega aun cuando la razón no encuentra motivos.","Pide hoy esa paz que guarda. No necesitas sentirla; basta con pedirla y dejar que Dios actúe."],
perg:"¿Qué me ha estado quitando la paz en esta espera?",
des:"Preséntale hoy a Dios en oración cada preocupación, una por una, y después dale gracias por algo. Escribe aquí lo que entregaste.",
ora:"Señor, guarda mi corazón y mis pensamientos con tu paz, que supera todo entendimiento. Amén."},

{t:"Renovar mi entrega",ref:"Sal 62, 2-9",v:"Sólo en Dios descansa mi alma, de él me viene la salvación.",
exp:"El salmista, rodeado de dificultades, afirma con firmeza que solo en Dios encuentra descanso su alma. Él es roca, salvación y fortaleza. E invita a todos a confiar en Él en todo momento y a desahogar ante Él su corazón.",
med:["Después de 30 días, la espera puede continuar, pero tú ya no eres la misma. Derramaste el alma, lloraste, descansaste, confiaste. Dios estuvo en cada paso.","Renovar la entrega no es renunciar al sueño; es ponerlo otra vez en las manos correctas. Solo en Dios descansa el alma."],
perg:"¿Qué cambió en mi corazón en estos 30 días? ¿Cómo quiero seguir caminando?",
des:"Vuelve a leer la carta que escribiste el primer día. Escríbele a Dios una carta nueva, renovando tu entrega. Si quieres, vuelve a empezar el plan cuando sientas la necesidad.",
ora:"Señor, solo en Ti descansa mi alma. Renuevo la entrega de mi deseo de ser mamá. Que se haga tu voluntad, en tu tiempo. Amén."}
];

// Oraciones del hogar, Rosario y novenas (español, América Latina)
// Las oraciones tradicionales usan los textos oficiales en uso en América Latina.
// El Magníficat es el texto de El Libro del Pueblo de Dios (Lc 1, 46-55). Las demás oraciones fueron escritas para esta app.
window.ORACOES = [
// ——— Oraciones de siempre
{id:"sinal",cat:"sempre",t:"La señal de la cruz",x:"En el nombre del Padre, y del Hijo, y del Espíritu Santo. Amén."},
{id:"painosso",cat:"sempre",t:"Padre Nuestro",x:"Padre nuestro que estás en el cielo, santificado sea tu Nombre; venga a nosotros tu Reino; hágase tu voluntad en la tierra como en el cielo.\nDanos hoy nuestro pan de cada día; perdona nuestras ofensas, como también nosotros perdonamos a los que nos ofenden; no nos dejes caer en la tentación, y líbranos del mal. Amén."},
{id:"avemaria",cat:"sempre",t:"Ave María",x:"Dios te salve, María, llena eres de gracia; el Señor es contigo. Bendita Tú eres entre todas las mujeres, y bendito es el fruto de tu vientre, Jesús.\nSanta María, Madre de Dios, ruega por nosotros, pecadores, ahora y en la hora de nuestra muerte. Amén."},
{id:"gloria",cat:"sempre",t:"Gloria",x:"Gloria al Padre y al Hijo y al Espíritu Santo.\nComo era en el principio, ahora y siempre, por los siglos de los siglos. Amén."},
{id:"creio",cat:"sempre",t:"Credo de los Apóstoles",x:"Creo en Dios, Padre Todopoderoso, Creador del cielo y de la tierra. Creo en Jesucristo, su único Hijo, Nuestro Señor, que fue concebido por obra y gracia del Espíritu Santo, nació de Santa María Virgen, padeció bajo el poder de Poncio Pilato, fue crucificado, muerto y sepultado, descendió a los infiernos, al tercer día resucitó de entre los muertos, subió a los cielos y está sentado a la derecha de Dios, Padre todopoderoso. Desde allí ha de venir a juzgar a vivos y muertos.\nCreo en el Espíritu Santo, la santa Iglesia católica, la comunión de los santos, el perdón de los pecados, la resurrección de la carne y la vida eterna. Amén."},
{id:"omeujesus",cat:"sempre",t:"Oración de Fátima",x:"Oh mi Jesús, perdónanos nuestros pecados, líbranos del fuego del infierno, lleva todas las almas al cielo, especialmente las más necesitadas de tu misericordia."},
{id:"espirito",cat:"sempre",t:"Ven, Espíritu Santo",x:"Ven, Espíritu Santo, llena los corazones de tus fieles y enciende en ellos el fuego de tu amor.\nEnvía, Señor, tu Espíritu. Que renueve la faz de la Tierra.\nOh Dios, que llenaste los corazones de tus fieles con la luz del Espíritu Santo; concédenos que, guiados por el mismo Espíritu, sintamos con rectitud y gocemos siempre de tu consuelo. Por Jesucristo Nuestro Señor. Amén."},
{id:"contricao",cat:"sempre",t:"Acto de contrición",x:"Dios mío, me arrepiento de todo corazón de todos mis pecados y los aborrezco, porque al pecar, no sólo merezco las penas establecidas por ti justamente, sino principalmente porque te ofendí, a ti sumo Bien y digno de amor por encima de todas las cosas.\nPor eso propongo firmemente, con ayuda de tu gracia, no pecar más en adelante y huir de toda ocasión de pecado. Amén."},
{id:"comunhao",cat:"sempre",t:"Comunión espiritual",nota:"San Alfonso María de Ligorio",x:"Creo, Jesús mío, que estáis realmente presente en el Santísimo Sacramento del Altar. Os amo sobre todas las cosas y deseo recibiros en mi alma. Pero como ahora no puedo recibiros sacramentado, venid a lo menos espiritualmente a mi corazón.\nY como si ya os hubiese recibido, os abrazo y me uno del todo a Ti. Señor, no permitas que jamás me aparte de Ti. Amén."},
{id:"angelus",cat:"sempre",t:"El Ángelus",nota:"Tradicionalmente se reza a las 6 de la mañana, al mediodía y a las 6 de la tarde.",x:"El ángel del Señor anunció a María.\nY concibió por obra y gracia del Espíritu Santo.\nDios te salve, María...\n\nHe aquí la esclava del Señor.\nHágase en mí según tu palabra.\nDios te salve, María...\n\nY el Verbo de Dios se hizo carne.\nY habitó entre nosotros.\nDios te salve, María...\n\nRuega por nosotros, Santa Madre de Dios,\npara que seamos dignos de alcanzar las promesas de Jesucristo.\n\nOremos: Oh Padre, infunde en nuestra alma tu gracia. Tú, que en la anunciación del Ángel nos has revelado la encarnación de tu Hijo, por su pasión y su cruz condúcenos a la gloria de la resurrección. Por Cristo, Nuestro Señor. Amén."},

// ——— Nuestra Señora
{id:"salve",cat:"maria",t:"Salve",x:"Dios te salve, Reina y Madre de misericordia, vida, dulzura y esperanza nuestra; Dios te salve. A ti llamamos los desterrados hijos de Eva; a ti suspiramos, gimiendo y llorando en este valle de lágrimas.\nEa, pues, Señora, abogada nuestra, vuelve a nosotros esos tus ojos misericordiosos; y después de este destierro, muéstranos a Jesús, fruto bendito de tu vientre.\n¡Oh, clementísima, oh piadosa, oh dulce Virgen María!"},
{id:"minhasenhora",cat:"maria",t:"Oh Señora mía",nota:"Consagración a la Virgen María",x:"¡Oh Señora mía, oh Madre mía!, yo me ofrezco enteramente a Vos y, en prueba de mi filial afecto, os consagro en este día mis ojos, mis oídos, mi lengua, mi corazón. En una palabra, todo mi ser.\nYa que soy todo vuestro, oh Madre de bondad, guardadme y protegedme como cosa y posesión vuestra. Amén."},
{id:"lembrai",cat:"maria",t:"Acordaos",x:"Acordaos, oh piadosísima Virgen María, que jamás se ha oído decir que ninguno de los que han acudido a tu protección, implorando tu asistencia y reclamando tu socorro, haya sido abandonado de ti.\nAnimado con esta confianza, a ti también acudo, oh Madre, Virgen de las vírgenes, y aunque gimiendo bajo el peso de mis pecados, me atrevo a comparecer ante tu presencia soberana.\nNo deseches mis humildes súplicas, oh Madre del Verbo divino, antes bien, escúchalas y acógelas benignamente. Amén."},
{id:"magnificat",cat:"maria",t:"Magníficat (Cántico de María)",nota:"Lc 1, 46-55",x:"Mi alma canta la grandeza del Señor, y mi espíritu se estremece de gozo en Dios, mi salvador, porque él miró con bondad la pequeñez de tu servidora. En adelante todas las generaciones me llamarán feliz,\nporque el Todopoderoso ha hecho en mí grandes cosas: ¡su Nombre es santo! Su misericordia se extiende de generación en generación sobre aquellos que lo temen. Desplegó la fuerza de su brazo, dispersó a los soberbios de corazón.\nDerribó a los poderosos de su trono y elevó a los humildes. Colmó de bienes a los hambrientos y despidió a los ricos con las manos vacías. Socorrió a Israel, su servidor, acordándose de su misericordia, como lo había prometido a nuestros padres, en favor de Abraham y de su descendencia para siempre."},
{id:"concebida",cat:"maria",t:"Oh María sin pecado concebida",nota:"Jaculatoria de la Medalla Milagrosa",x:"Oh María, sin pecado concebida, ruega por nosotros que recurrimos a ti."},
{id:"maecansada",cat:"maria",t:"Oración de una mamá a la Madre",nota:"Para los días difíciles",x:"Virgen María, tú también fuiste mamá. Conoces las noches sin dormir, las preocupaciones y el corazón apretado.\nHoy vengo a ti como hija. Toma mi mano y camina conmigo. Cuida a mis hijos cuando yo no esté cerca, trae calma a mi casa y enséñame tu paciencia y tu ternura.\nQue yo guarde en el corazón, como tú, las cosas de Dios. Amén."},

// ——— Por la familia
{id:"sagradafamilia",cat:"familia",t:"Oración a la Sagrada Familia",x:"Jesús, María y José, ustedes que vivieron en Nazaret el amor sencillo de cada día, miren a nuestra familia.\nHagan de nuestra casa una pequeña iglesia: un lugar de oración, de mesa compartida y de perdón.\nAparten de nosotros las peleas, la frialdad y la división. Sanen a quien está herido y acerquen a quien está lejos.\nQue en nuestro hogar se vivan la paz, la alegría y la fe que había en su casa. Jesús, María y José, rueguen por nosotros. Amén."},
{id:"consagracaolar",cat:"familia",t:"Consagración del hogar a la Sagrada Familia",nota:"Para rezar con toda la familia reunida",x:"Jesús, María y José, hoy les consagramos nuestra casa y a todos los que vivimos en ella.\nJesús, sé el centro de nuestro hogar: de nuestras conversaciones, de nuestras comidas, de nuestro trabajo y de nuestro descanso.\nMaría, cuídanos como cuidaste la casa de Nazaret. Enséñanos la ternura, la paciencia y la oración.\nSan José, protege a esta familia, cuida nuestra puerta y sostén nuestro trabajo.\nQue esta casa sea un lugar de paz, de perdón y de alegría. Desde hoy, es de ustedes. Amén."},
{id:"pelosfilhos",cat:"familia",t:"Bendición de una mamá para sus hijos",x:"Señor, te presento a mis hijos (di el nombre de cada uno).\nTú los conociste antes que yo y los amas todavía más que yo. Pon tu mano sobre ellos.\nCuida su cuerpo de todo peligro, su corazón de toda tristeza y su alma de todo mal.\nDales buenos amigos, sabiduría en sus estudios y un corazón que te ame.\nQue su Ángel de la Guarda camine a su lado hoy y siempre. Los pongo en tus manos y en los brazos de la Virgen María. Amén."},
{id:"peloesposo",cat:"familia",t:"Oración por mi esposo",x:"Señor, te doy gracias por el hombre que pusiste a mi lado.\nBendice su salud, su trabajo y sus decisiones. Dale fuerza en los días difíciles y paz en el corazón.\nAcércalo cada día más a ti, y haz de él un esposo y un papá según tu corazón.\nÚnenos en el amor, en el respeto y en el perdón. Que nuestro matrimonio sea signo de tu amor.\nSan José, intercede por él. Amén."},
{id:"bencaocasa",cat:"familia",t:"Bendición de la casa",nota:"Para rezar recorriendo cada cuarto",x:"Señor, bendice esta casa y a todos los que vivimos en ella.\nQue por esta puerta entre solo lo bueno. Que en esta sala haya conversación y alegría. Que en esta cocina nunca falten el pan ni la gratitud. Que en estas habitaciones haya descanso y paz.\nAleja de aquí toda discordia, toda enfermedad y todo mal.\nQue esta casa sea tu morada, Señor. Amén."},
{id:"gestante",cat:"familia",t:"Oración de la embarazada",x:"Señor de la vida, gracias por el bebé que está creciendo dentro de mí.\nCuídalo cada día de este embarazo, forma cada parte de su cuerpecito con tu amor y prepara mi corazón para recibirlo.\nVirgen del Buen Parto, acompáñame hasta el día del nacimiento y cúbrenos a los dos con tu manto. Amén."},
{id:"desejomae",cat:"familia",t:"Oración de una mujer que desea ser mamá",nota:"Para quienes están buscando un bebé",x:"Señor, Dios de la vida, tú conoces el deseo de mi corazón de ser mamá.\nLo pongo en tus manos, con todo lo que siento: la esperanza, la ansiedad y las lágrimas de cada espera.\nCalma mi corazón, fortalece mi matrimonio y cuida mi cuerpo. Dame paz para vivir un día a la vez y confianza en tus tiempos.\nVirgen María, Santa Ana y San Joaquín, Santa Isabel y San Gerardo Mayela, recen conmigo.\nQue se haga tu voluntad, Señor, y que nunca olvide que soy tu hija amada. Amén."},
{id:"longe",cat:"familia",t:"Por alguien que está lejos de la fe",x:"Padre de misericordia, te presento a (di su nombre), que está lejos de ti.\nTú nunca te rindes con nadie. Sal a su encuentro como el padre que corrió a abrazar a su hijo cuando volvía a casa.\nToca su corazón como solo tú sabes hacerlo, pon personas buenas en su camino y dame paciencia y amor para esperar tus tiempos.\nSanta Mónica, que rezaste tantos años por tu hijo, intercede por nosotros. Amén."},

// ——— De todos los días
{id:"manha",cat:"dia",t:"Oración de la mañana",x:"¡Buenos días, Señor! Gracias por un día más.\nTe ofrezco todo lo que voy a hacer, pensar y sentir hoy: mi trabajo, los quehaceres de la casa, el cuidado de mi familia, las alegrías y los cansancios.\nGuía mis pasos, cuida mis palabras y dame paciencia y alegría.\nVirgen María, tómame de la mano durante todo el día. Amén."},
{id:"noite",cat:"dia",t:"Oración de la noche",x:"Señor, gracias por este día, por lo que salió bien y por lo que no salió.\nPerdóname por las veces en que me faltó amor, y ayúdame a perdonar también.\nPongo en tus manos a mi familia, mis preocupaciones y el día de mañana.\nCuida nuestro sueño y nuestra casa esta noche. Santo Ángel, vela por nosotros. Amén."},
{id:"antesrefeicao",cat:"dia",t:"Bendición de la mesa (antes de comer)",x:"Bendícenos, Señor, y bendice estos alimentos que por tu bondad vamos a tomar. Por Jesucristo Nuestro Señor. Amén."},
{id:"depoisrefeicao",cat:"dia",t:"Acción de gracias (después de comer)",x:"Te damos gracias, Señor, por todos tus beneficios. Tú, que vives y reinas por los siglos de los siglos. Amén."},
{id:"entrega",cat:"dia",t:"Oración de entrega (para los días de ansiedad)",x:"Jesús, yo sola no puedo cargar con todo. Hoy pongo en tus manos (di lo que te preocupa).\nNo voy a seguir aferrada a lo que es tuyo. Tú sabes lo que es mejor y cuidas cada detalle.\nCalma mi respiración, mis pensamientos y mi corazón.\nJesús, en ti confío. Jesús, en ti confío. Jesús, en ti confío. Amén."},
{id:"trabalho",cat:"dia",t:"Por el trabajo y el pan de cada día",x:"Señor, que fuiste carpintero en Nazaret, bendice el trabajo de esta familia.\nDanos salud para trabajar, sabiduría para cuidar lo que hemos recibido y generosidad para compartir.\nProvee lo que nos falta y líbranos de la preocupación excesiva. Confiamos en tu providencia.\nSan José obrero, ruega por nosotros. Amén."},
{id:"cansada",cat:"dia",t:"Oración de una mamá cansada",x:"Señor, hoy estoy cansada. Tú conoces mi cuerpo, mi mente y mi corazón.\nNo te pido ser perfecta, te pido no estar sola.\nDame descanso donde haya una pausa, paciencia donde haya un berrinche y ternura donde haya prisa.\nGracias, porque tu amor por mí no depende de todo lo que logro hacer. Amén."},

// ——— Santos y ángeles
{id:"anjo",cat:"santos",t:"Ángel de la Guarda",x:"Ángel de Dios, que eres mi custodio, pues la bondad divina me ha encomendado a ti, ilumíname, guárdame, defiéndeme y gobiérname. Amén."},
{id:"miguel",cat:"santos",t:"San Miguel Arcángel",x:"San Miguel Arcángel, defiéndenos en la lucha. Sé nuestro amparo contra la perversidad y asechanzas del demonio. Que Dios manifieste sobre él su poder, es nuestra humilde súplica.\nY tú, oh Príncipe de la Milicia Celestial, con el poder que Dios te ha conferido, arroja al infierno a Satanás, y a los demás espíritus malignos que vagan por el mundo para la perdición de las almas. Amén."},
{id:"saojose",cat:"santos",t:"Oración a San José por la familia",x:"San José, custodio de la Sagrada Familia, pongo mi casa bajo tu protección.\nTú que cuidaste a Jesús y a María con valentía y en silencio, cuídanos también a nosotros.\nProtege a mi esposo y a mis hijos, bendice nuestro trabajo y nuestro pan, y enséñanos a confiar en Dios aun cuando no entendemos todo.\nSan José, ruega por nosotros. Amén."},
{id:"sebastiao",cat:"santos",t:"Oración a San Sebastián",x:"Glorioso San Sebastián, que fuiste fiel a Jesús hasta el final, alcánzanos de Dios la valentía para vivir la fe con alegría y firmeza.\nProtege a nuestra familia de las enfermedades, de la violencia y de todo mal.\nSan Sebastián, ruega por nosotros. Amén."},
{id:"geraldo",cat:"santos",t:"Oración a San Gerardo Mayela",nota:"Protector de las mamás y de quienes desean ser mamás",x:"San Gerardo Mayela, amigo de las mamás y de las familias, acudo a ti con confianza.\nPresenta a Dios mi deseo de ser mamá y alcánzame la gracia de vivir esta espera con fe y con paz.\nProtege también a las embarazadas y a los bebés que están por nacer.\nSan Gerardo Mayela, ruega por nosotros. Amén."},
{id:"luzia",cat:"santos",t:"Oración a Santa Lucía",x:"Santa Lucía, que guardaste la luz de la fe en tu corazón, protege nuestros ojos y nuestra vista.\nAyúdanos a ver a Dios en las personas y en las cosas pequeñas de cada día.\nSanta Lucía, ruega por nosotros. Amén."}
];

window.NOVENAS = [
{id:"natal",t:"Novena de Navidad",quando:"del 16 al 24 de diciembre",ini:"2026-12-16",cor:"lilas",
intro:"Nueve días para preparar el corazón y la casa para el nacimiento de Jesús. Muy bonita para rezarla en familia, cerca del Nacimiento.",
temas:["Dios promete un Salvador","María dice «sí»","José recibe a María y al Niño","La visita a Isabel","El camino a Belén","No había lugar en la posada","Los pastores velan de noche","Los ángeles cantan gloria","Jesús nace en nuestro corazón"],

    var u="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("Mi momento con Dios")+"&details="+encodeURIComponent("Es la hora de tu momento con Dios y del desafío de hoy. Abre la app Mi Año con Dios: https://app.catolicaorante.com.br/es/")+"&dates="+d+"T"+hr+"00/"+d+"T"+fim+"00&ctz="+encodeURIComponent(tz)+"&recur="+encodeURIComponent("RRULE:FREQ=DAILY");
    if(PREVIA){toast("En la app instalada, esto abre Google Calendar.");return;}
    S.lembOk=true;save();window.open(u,"_blank","noopener");},
  tutorial:function(){UI.tutCel=null;go({v:"tutorial"});},
  tutCel:function(e){UI.tutCel=e.dataset.c;render();},
  tutOk:function(){S.tutOk=true;save();toast("¡Qué bien! Ahora solo ábrela desde el ícono.");if(cur().v==="tutorial")back();else render();},
