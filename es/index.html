des:"Hagan hoy cinco minutos de silencio en familia, con las pantallas apagadas (puede ser antes de dormir, con una vela encendida). Terminen con un Padre Nuestro rezado muy despacio.",
ora:"Señor, enséñanos a hacer silencio para escucharte. Que nuestra casa, como la de Nazaret, sea un lugar de paz donde se escucha tu voz. Amén."},

{t:"Consagrar a mi familia",ref:"Col 3, 12-17",v:"Que la paz de Cristo reine en sus corazones: esa paz a la que han sido llamados, porque formamos un solo Cuerpo. Y vivan en la acción de gracias.",
exp:"San Pablo describe cómo es la vida de quienes pertenecen a Cristo: revestirse de compasión, bondad, humildad, mansedumbre y paciencia; soportarse y perdonarse unos a otros; y, por encima de todo, tener amor. Es la lectura que la Iglesia proclama en la fiesta de la Sagrada Familia.",
med:["Este es el retrato de una familia cristiana: no una familia perfecta, sino una familia que se perdona, se soporta con paciencia y deja que reine la paz de Cristo.","Al terminar estos diez días, puedes consagrar tu hogar a la Sagrada Familia, pidiendo que Jesús, María y José vivan con ustedes y guíen cada paso."],
perg:"¿Qué cambió en mi manera de ver a mi familia en estos diez días?",
des:"Reúne a tu familia y hagan la consagración del hogar a la Sagrada Familia (pestaña Orar). Si alguien está dolido, aprovechen para pedir y ofrecer perdón antes de la oración.",
ora:"Jesús, María y José, les consagro a mi familia. Llenen nuestro corazón con la paz de Cristo. Hagan de nuestra casa un lugar de amor, de perdón y de gratitud. Amén."}
]};

P.gratidao14={resumo:"Dos semanas para entrenar la mirada y llenar tu casa de agradecimiento, desde las cosas grandes hasta las más pequeñitas. Cada día trae una lectura explicada, una meditación, un espacio para escribir y un reto de gratitud.",d:[
{t:"No olvidar sus beneficios",ref:"Sal 103, 1-5",v:"bendice al Señor, alma mía, y nunca olvides sus beneficios.",
exp:"En este salmo, el salmista le habla a su propia alma y la invita a bendecir a Dios. Luego enumera lo que Dios hace: perdona las culpas, cura las enfermedades, rescata de la muerte, corona de amor y misericordia, colma de bienes. La gratitud nace de recordar.",
med:["Olvidamos pronto el bien recibido y recordamos por mucho tiempo lo que salió mal. La gratitud es un ejercicio de memoria: traer de nuevo al corazón lo que Dios ya hizo.","Quien recuerda los beneficios de Dios se queja menos, confía más y ve la vida con otros ojos."],
perg:"¿Qué beneficios de Dios he olvidado agradecer?",
des:"Empieza hoy tu lista de gratitud: escribe abajo por lo menos cinco cosas por las que das gracias. Volverás a ella a lo largo de estos 14 días.",
ora:"Con toda mi alma te bendigo, Señor. Gracias por todo el bien que me haces. Que nunca olvide tus beneficios. Amén."},

{t:"Por mi vida",ref:"Sal 139, 13-16",v:"te doy gracias porque fui formado de manera tan admirable. ¡Qué maravillosas son tus obras!",
exp:"El salmista reconoce que Dios lo conoce desde el vientre de su madre. Fue Dios quien lo formó, quien vio cada etapa de su crecimiento y quien tiene todos sus días escritos en su libro. Ante esto, solo queda alabar.",
med:["Tu vida no es una casualidad. Dios te formó con cariño, te conoce por completo y te ama tal como eres.","Muchas veces somos duras con nosotras mismas. Hoy mírate con los ojos de Dios y da gracias por existir, por tu cuerpo, por tus dones y por tu historia."],
perg:"¿Qué hay en mí que me cuesta agradecer? ¿Cómo lo ve Dios?",
des:"Escribe tres cualidades o dones que Dios te ha dado. Frente al espejo, di en voz alta: «Gracias, Señor, porque me hiciste con amor y soy obra de tus manos».",
ora:"Señor, te alabo por la maravilla que hiciste al crearme. Gracias por mi vida y por cada día que me regalas. Amén."},

{t:"Por nuestra casa",ref:"Is 32, 15-18",v:"Mi pueblo habitará en un lugar de paz, en moradas seguras, en descansos tranquilos",
exp:"El profeta anuncia un tiempo en que el Espíritu será derramado desde lo alto, y el desierto se volverá jardín. El fruto de ese tiempo será la justicia y la paz, y el pueblo de Dios vivirá en moradas seguras y tranquilas.",
med:["No importa el tamaño ni el estado de tu casa: es tu refugio, el lugar donde tu familia se encuentra, descansa y se ama.","Agradecer por la casa cambia la manera de cuidarla. Lo que vemos como un regalo lo tratamos con cariño, no como una carga."],
perg:"¿Qué es lo que más agradezco de mi casa, aun con sus imperfecciones?",
des:"Recorre tu casa y, en cada cuarto, dale gracias a Dios por algo que sucede ahí (las comidas en la cocina, el descanso en la recámara, las risas en la sala). Si puedes, bendice cada espacio con agua bendita.",
ora:"Señor, gracias por la casa que nos diste. Que siempre sea una morada de paz, donde tú eres bienvenido. Amén."},

{t:"Dar gracias en todo",ref:"1 Tes 5, 16-18",v:"Den gracias a Dios en toda ocasión: esto es lo que Dios quiere de todos ustedes, en Cristo Jesús.",
exp:"San Pablo escribe a la comunidad de Tesalónica, que sufría persecuciones, y le da tres consejos cortos: estar siempre alegres, orar sin cesar y dar gracias en toda circunstancia. Dice que esa es la voluntad de Dios para nosotros.",
med:["Dar gracias en toda circunstancia no es fingir que todo está bien. Es confiar en que Dios está presente en todas las cosas, también en las difíciles.","La gratitud constante transforma el corazón. Cuanto más agradecemos, más motivos encontramos para agradecer."],
perg:"¿En qué situación difícil puedo empezar a dar gracias, aunque no la entienda?",
des:"Da gracias en voz alta por lo menos tres veces hoy, por cosas sencillas, en el momento en que sucedan (un café calientito, un tráfico tranquilo, un abrazo). Anota abajo cuáles fueron.",
ora:"Señor, que aprenda a darte gracias en toda circunstancia, porque sé que estás conmigo en todo. Amén."},

{t:"Por los hijos y por los niños",ref:"Sal 127, 1-3",v:"Los hijos son un regalo del Señor, el fruto del vientre es una recompensa…",
exp:"El salmo empieza recordando que, si el Señor no construye la casa, en vano trabajan los albañiles. Todo es don de Dios, y los hijos se presentan como herencia y recompensa: regalos que Dios confía a los padres.",
med:["Los hijos son un regalo, aun en los días de berrinches, cansancio y preocupación. No son nuestros, son de Dios, que nos los confía por un tiempo.","Si todavía no tienes hijos, o si tienes hijos espirituales, sobrinos, ahijados o alumnos, también puedes dar gracias por los niños que Dios pone en tu camino."],
perg:"¿Qué agradezco de cada niño que Dios ha puesto en mi vida?",
des:"Dile a cada uno de tus hijos (o a un niño que quieras): «Le doy gracias a Dios por ti», y cuéntale por qué. Escribe abajo cómo reaccionó cada uno.",
ora:"Gracias, Señor, por cada niño que me has confiado. Construye tú nuestra casa y cuida a nuestros pequeños. Amén."},

{t:"Por el pan de cada día",ref:"Mt 14, 15-21",v:"tomó los cinco panes y los dos pescados, y levantando los ojos al cielo, pronunció la bendición…",
exp:"Una multitud sigue a Jesús hasta un lugar despoblado, y cae la tarde sin comida. Los discípulos solo tienen cinco panes y dos peces. Jesús toma lo poco que hay, da gracias y lo bendice. Todos comen y todavía sobran doce canastas.",
med:["Jesús dio gracias antes de multiplicar. La gratitud por lo poco le abre espacio a Dios para actuar. La mesa, por sencilla que sea, es lugar de bendición.","¿Cuántas manos trabajaron para que la comida llegara a tu mesa? Dar gracias por los alimentos es también acordarse de quienes no tienen."],
perg:"¿Cómo es mi mesa: un lugar de gratitud o de prisa?",
des:"Reza hoy la bendición de la mesa con tu familia. Si puedes, aparta algún alimento para donarlo a alguien que lo necesite o a un banco de alimentos.",
ora:"Bendice, Señor, estos alimentos y a quienes los prepararon. Da pan a quien tiene hambre, y hambre de ti a quien tiene pan. Amén."},

{t:"Aun por las dificultades",ref:"Rom 8, 28-31",v:"Sabemos, además, que Dios dispone, todas las cosas para el bien de los que lo aman",
exp:"San Pablo escribe a los romanos sobre la esperanza cristiana. Afirma que Dios actúa en todas las cosas, incluso en el sufrimiento, para el bien de quienes lo aman. Y concluye que, si Dios está con nosotros, nadie puede estar en contra nuestra.",
med:["Algunas de las cosas que más nos hicieron crecer fueron difíciles de vivir. Dios no quiere el mal, pero es capaz de sacar bien incluso de él.","Agradecer por las dificultades no es disfrutar del sufrimiento, sino reconocer que Dios no nos abandonó en ellas y que salimos distintas del otro lado."],
perg:"¿Qué dificultad de mi pasado me trajo algo bueno?",
des:"Escribe abajo una dificultad que viviste y el bien que te trajo (una lección, una amistad, más fe). Dale gracias a Dios por haber estado contigo en ese tiempo.",
ora:"Señor, gracias aun por las dificultades que me hicieron crecer. Sé que estás de mi lado, y contigo no tengo nada que temer. Amén."},

{t:"Por las amistades",ref:"Rut 1, 14-17",v:"porque yo iré adonde tú vayas y viviré donde tú vivas. Tu pueblo será mi pueblo y tu Dios será mi Dios.",
exp:"Noemí pierde a su esposo y a sus dos hijos y decide volver a su tierra. Les pide a sus nueras que se queden con sus familias. Orfá se despide, pero Rut se aferra a ella y promete acompañarla para siempre. De esa fidelidad nace una nueva historia: Rut será bisabuela del rey David.",
med:["La amistad entre Rut y Noemí muestra que el amor verdadero se queda, aun cuando sería más fácil irse. Las amistades fieles son un regalo raro de Dios.","Piensa en las mujeres que estuvieron a tu lado en los momentos difíciles. Fueron señales del cuidado de Dios por ti."],
perg:"¿Qué amigas han sido una «Rut» en mi vida?",
des:"Mándale un mensaje de agradecimiento a una amiga, diciéndole concretamente por qué das gracias a Dios por ella. Reza también por una amiga que esté pasando por un momento difícil.",
ora:"Gracias, Señor, por las amigas que pusiste en mi camino. Bendice a cada una y haz de mí también una amiga fiel. Amén."},

{t:"Por los papás y los abuelos",ref:"Eclo 3, 2-6",v:"El que honra a su padre expía sus pecados y el que respeta a su madre es como quien acumula un tesoro.",
exp:"El libro del Eclesiástico enseña cómo vivir el cuarto mandamiento. Honrar padre y madre trae bendición, perdón y alegría. Más adelante (Eclo 3,12-14), pide paciencia con los padres ancianos, aun cuando su mente se debilita. Es una de las lecturas de la fiesta de la Sagrada Familia.",
med:["De nuestros papás y abuelos recibimos la vida y, muchas veces, la fe. Aun con sus errores y sus límites, hay mucho que agradecer.","Si la relación con tus papás es difícil, la gratitud puede empezar por algo pequeño. Y si ya partieron, la oración es la forma más bonita de agradecerles."],
perg:"¿Qué recibí de mis papás y de mis abuelos que quiero agradecer?",
des:"Llama o visita a tus papás o a tus abuelos y agradéceles algo concreto. Si ya partieron, reza hoy por ellos y, si puedes, pide que se ofrezca una Misa por ellos.",
ora:"Gracias, Señor, por mis papás y mis abuelos. Bendice a los que viven y da el descanso eterno a los que ya partieron. Amén."},

{t:"Por el don de la fe",ref:"Ef 2, 4-10",v:"Porque ustedes han sido salvados por su gracia, mediante la fe. Esto no proviene de ustedes, sino que es un don de Dios",
exp:"San Pablo les recuerda a los efesios que Dios, rico en misericordia, nos dio vida con Cristo cuando estábamos muertos por el pecado. La salvación no es un logro nuestro: es gracia, un regalo gratuito, recibido por la fe.",
med:["La fe no es mérito nuestro, es un regalo de Dios. Muchas veces nos llegó por las manos de alguien: una abuela que rezaba, una catequista, una amiga.","Agradecer la fe es también cuidarla, alimentándola con la oración, la Palabra y los sacramentos, y transmitiéndola a otros."],
perg:"¿Quién me enseñó a rezar y a creer? ¿Cómo puedo transmitir la fe?",
des:"Dale gracias a Dios por las personas que te enseñaron la fe y, si es posible, díselo a una de ellas. Reza el Credo despacio, agradeciendo cada verdad que profesa.",
ora:"Gracias, Señor, por el don de la fe. Aumenta mi fe y haz de mí un testigo de tu amor para mi familia. Amén."},

{t:"Por las cosas pequeñas",ref:"Mt 6, 25-34",v:"Miren los lirios del campo, cómo van creciendo sin fatigarse ni tejer.",
exp:"En el Sermón de la Montaña, Jesús nos pide no vivir preocupados por qué comer o qué vestir. Señala a los pájaros y a las flores: el Padre los cuida con cariño. Si cuida así de las flores, cuánto más de nosotros. Y concluye pidiéndonos buscar primero el Reino de Dios.",
med:["Jesús se fijaba en las cosas pequeñas: las flores, los pájaros, la levadura, la semilla. Dios también habla en lo sencillo.","La preocupación nos roba la mirada. Quien confía en el cuidado del Padre puede descubrir las pequeñas alegrías que hay esparcidas a lo largo del día."],
perg:"¿Qué pequeñas alegrías de hoy casi dejé pasar?",
des:"Toma una foto o anota tres pequeñas alegrías de hoy (una flor, el sol en la ventana, la risa de alguien). En la noche, da gracias por cada una antes de dormir.",
ora:"Gracias, Señor, por las pequeñas alegrías del día. Quita de mí la preocupación y enséñame a confiar en tu cuidado de Padre. Amén."},

{t:"Por la Eucaristía",ref:"Lc 22, 14-20",v:"Luego tomó el pan, dio gracias, lo partió y lo dio a sus discípulos, diciendo: «Esto es mi Cuerpo, que se entrega por ustedes. Hagan esto en memoria mía».",
exp:"En la Última Cena, antes de su Pasión, Jesús celebra la Pascua con los apóstoles. Toma el pan y el vino, da gracias y los entrega como su Cuerpo y su Sangre. Les pide que hagan esto en memoria suya. Es la institución de la Eucaristía.",
med:["La palabra «Eucaristía» significa acción de gracias. La Misa es el agradecimiento más grande que existe: en ella unimos nuestra gratitud a la de Jesús al Padre.","Jesús quiso quedarse con nosotros de un modo real y sencillo, en un pedazo de pan. ¡Qué regalo! La gratitud por ese don nos lleva a desear cada vez más estar con Él."],
perg:"¿Cómo he vivido la Misa? ¿Es para mí un momento de gratitud?",
des:"Ve a Misa (puede ser entre semana) con la intención de dar gracias. Si no puedes, haz una comunión espiritual y pasa cinco minutos agradeciendo a Jesús su presencia en la Eucaristía.",
ora:"Gracias, Jesús, por quedarte con nosotros en la Eucaristía. Que cada Misa sea para mí una gran acción de gracias. Amén."},

{t:"Volver a dar gracias",ref:"Lc 17, 11-19",v:"Uno de ellos, al comprobar que estaba curado, volvió atrás alabando a Dios en voz alta y se arrojó a los pies de Jesús con el rostro en tierra, dándole gracias.",
exp:"De camino a Jerusalén, Jesús se encuentra con diez leprosos que le piden a gritos compasión. Les dice que se presenten a los sacerdotes y, en el camino, todos quedan sanos. Pero solo uno vuelve a dar gracias, y era un samaritano, un extranjero. Jesús pregunta si no fueron diez los sanados, y dónde están los otros nueve.",
med:["Es fácil pedir y olvidarse de agradecer. Los nueve fueron sanados en el cuerpo, pero el que volvió recibió algo más: escuchó de Jesús que su fe lo había salvado.","Volver a dar gracias hace más profunda nuestra relación con Dios. La gratitud nos acerca a quien nos dio el regalo."],
perg:"¿Qué oración escuchada todavía no he vuelto a agradecer?",
des:"Mira tus peticiones en la pestaña Orar (o recuerda oraciones que fueron escuchadas) y elige una gracia recibida. Vuelve a dar gracias: reza, escribe abajo tu agradecimiento y, si quieres, comparte tu testimonio con alguien.",
ora:"Señor, vuelvo para darte gracias por los favores recibidos. No quiero ser como los nueve que se olvidaron. Gracias, Jesús. Amén."},

{t:"Grandes cosas",ref:"Lc 1, 46-55",v:"el Todopoderoso ha hecho en mí grandes cosas: ¡su Nombre es santo!",
exp:"María, en casa de Isabel, canta el Magníficat, su gran himno de gratitud. Reconoce que Dios miró su pequeñez e hizo en ella maravillas. Y recuerda que Dios es fiel a sus promesas, de generación en generación.",
med:["Al terminar estas dos semanas, haz como María: mira hacia atrás y reconoce las grandes cosas que Dios ha hecho en ti y en tu familia.","La gratitud no tiene que terminar aquí. Puede volverse una manera de vivir: una mirada entrenada para ver a Dios en todo."],
perg:"¿Qué cambió en mí en estas dos semanas de gratitud?",
des:"Relee tu lista de gratitud del primer día y agrega lo que descubriste en estos 14 días. Reza el Magníficat (pestaña Orar) y elige un hábito de gratitud para continuar, como agradecer tres cosas antes de dormir.",
ora:"Con María te alabo, Señor, porque has hecho maravillas en mi vida. Gracias, Señor, por todo. Amén."}
]};

for(var i=0;i<PLANOS.length;i++){var x=P[PLANOS[i].id];if(x){PLANOS[i].d=x.d;PLANOS[i].resumo=x.resumo;if(x.ini)PLANOS[i].ini=x.ini;}}
})();

// 21 días orando por mis hijos: versión completa
(function(){
var D=[
{t:"Entregar a mis hijos a Dios",ref:"1 Sam 1, 20-28",v:"Era este niño lo que yo suplicaba al Señor, y él me concedió lo que le pedía. Ahora yo, a mi vez, se lo cedo a él; para toda su vida queda cedido al Señor",
exp:"Ana no podía tener hijos y rezó con muchas lágrimas en el santuario de Siló. Dios la escuchó, y dio a luz a Samuel. Cuando el niño creció un poco, Ana lo llevó a la casa del Señor y lo consagró al Señor para toda la vida. Samuel llegó a ser un gran profeta.",
med:["Los hijos son regalos de Dios, no propiedad nuestra. Ana lo entendió: lo que recibió de Dios, se lo devolvió a Dios. Y no perdió a su hijo; le dio el mejor destino posible.","Entregar a los hijos a Dios nos quita el peso de querer controlarlo todo. Seguimos cuidándolos, educándolos y protegiéndolos, pero sabiendo que hay un Padre que los ama todavía más que nosotras."],
perg:"¿Qué he intentado controlar en la vida de mis hijos que necesito entregar a Dios?",
des:"Escribe el nombre de cada hijo en una hoja (o en una tarjeta para cada uno) y, al lado, la frase: «Señor, este hijo (esta hija) es tuyo». Hoy en la noche, haz la señal de la cruz en la frente de cada uno antes de dormir.",
ora:"Señor, te entrego a mis hijos. Son tuyos antes que míos. Cuídalos, guíalos y haz de ellos lo que soñaste. Amén."},

{t:"La fe que pasa de mamá a hijo",ref:"2 Tim 1, 3-7",v:"Porque tengo presente la sinceridad de tu fe, esa fe que tuvieron tu abuela Loide y tu madre Eunice",
exp:"San Pablo le escribe al joven Timoteo, a quien quiere como a un hijo. Le recuerda que su fe empezó en casa, con su abuela y con su mamá. Y lo anima a reavivar el don de Dios que hay en él, porque Dios no nos dio un espíritu de miedo, sino de fortaleza, de amor y de sensatez.",
med:["La fe se aprende primero en casa: en el regazo, en las oraciones de la noche, con el ejemplo. Ninguna catequesis reemplaza ver a mamá rezando.","Loida y Eunice quizá nunca imaginaron que estaban formando a un obispo y a un santo. Cada pequeña oración que rezas con tus hijos es una semilla que Dios hará crecer a su tiempo."],
perg:"¿Cómo me ven mis hijos vivir la fe en el día a día?",
des:"Hoy, deja que tus hijos te vean rezar: un rato en el sillón con tu Biblia, un Rosario, una oración antes de comer. Si te preguntan, cuéntales por qué rezas.",
ora:"Señor, que mi fe sea sincera como la de Loida y Eunice, y que mis hijos la reciban como herencia. Amén."},

{t:"La protección de Dios",ref:"Mt 18, 10",v:"Cuídense de despreciar a cualquiera de estos pequeños, porque les aseguro que sus ángeles en el cielo están constantemente en presencia de mi Padre celestial.",
exp:"El Salmo 91 es una oración de confianza de quien se refugia en Dios. Promete que ningún mal dominará a quien confía en el Señor, y que los ángeles lo llevarán en sus manos para que su pie no tropiece. Al final, Dios mismo habla: porque se aferró a Él, lo librará.",
med:["Toda mamá sabe que no puede estar en todas partes: en la escuela, en la calle, en el celular, entre sus amistades. Eso puede causar mucha ansiedad.","Dios puso un ángel de la guarda al lado de cada uno de tus hijos. Rezar por su protección es confiar en que no están solos cuando tú no estás cerca."],
perg:"¿Qué miedo tengo sobre la seguridad de mis hijos? ¿Puedo entregárselo a Dios?",
des:"Enséñales a tus hijos (o reza junto con ellos) la oración al Ángel de la Guarda. Pónganse de acuerdo para rezarla juntos todas las noches hasta el final de este plan.",
ora:"Ángel de Dios, que eres mi custodio, pues la bondad divina me ha encomendado a ti, ilumíname, guárdame, defiéndeme y gobiérname. Amén.\nSeñor, cuida a mis hijos en todos sus caminos. Amén."},

{t:"Salud del cuerpo y del alma",ref:"Mc 5, 21-24. 35-43",v:"No temas, basta que creas.",
exp:"Jairo, jefe de la sinagoga, cae a los pies de Jesús: su hijita de doce años se está muriendo. En el camino llegan a avisarle que ya murió. Jesús le dice a Jairo que no tenga miedo, que solo tenga fe. Entra en la casa, toma a la niña de la mano y le dice que se levante. Y ella se levanta.",
med:["Toda mamá conoce la angustia de un hijo enfermo. Jairo no se quedó en casa llorando: fue a buscar a Jesús, se arrodilló y le pidió. Eso es lo que podemos hacer con cada fiebre, cada estudio médico, cada diagnóstico.","A Jesús le importa la salud del cuerpo y del alma de nuestros hijos. Y nos dice lo mismo que le dijo a Jairo: no tengas miedo, solo ten fe."],
perg:"¿Hay algo en la salud de mis hijos (del cuerpo, de la mente o del alma) que hoy me preocupa?",
des:"Hoy en la noche, mientras tus hijos duermen, pon tu mano sobre la cabeza de cada uno y reza por su salud, diciendo su nombre y pidiendo lo que necesitan.",
ora:"Jesús, tú tomaste de la mano a la hija de Jairo. Toma también de la mano a mis hijos. Dales salud del cuerpo, de la mente y del alma. Amén."},

{t:"Un corazón bondadoso",ref:"Lc 10, 30-37",v:"Ve, y procede tú de la misma manera.",
exp:"Un maestro de la Ley le pregunta a Jesús quién es su prójimo. Jesús cuenta la historia de un hombre asaltado y dejado medio muerto en el camino. Un sacerdote y un levita pasan de largo. Un samaritano, a quien veían como enemigo, se detiene, le cura las heridas y paga su hospedaje. Jesús concluye pidiendo que hagamos lo mismo.",
med:["Más que hijos «exitosos», queremos hijos buenos. En un mundo que enseña a competir y a pensar solo en uno mismo, un corazón bondadoso es un tesoro.","La bondad se enseña con pequeños gestos: compartir el lunch, consolar a un compañero, ayudar en casa sin esperar nada a cambio. Y se enseña viendo a mamá detenerse para ayudar a alguien."],
perg:"¿En qué situaciones veo bondad en mis hijos? ¿Se los he reconocido?",
des:"Hagan juntos hoy un gesto de bondad por alguien: regalar un juguete, llevarle algo a un vecino, escribir una notita a alguien que está triste. Después platiquen sobre cómo se sintieron.",
ora:"Jesús, dales a mis hijos un corazón bueno como el del samaritano, que ve a quien sufre y se detiene a ayudar. Amén."},

{t:"Buenas amistades",ref:"1 Sam 18, 1-4",v:"Jonatán se encariñó con él y llegó a quererlo como a sí mismo.",
exp:"Después de la victoria de David sobre Goliat, Jonatán, hijo del rey Saúl, se hace su amigo íntimo. Jonatán le da a David su manto, su espada y su arco, y los dos hacen una alianza. Más adelante, Jonatán protege a David incluso contra su propio padre.",
med:["Las amistades moldean el corazón de los hijos, a veces más que los papás. Un buen amigo ayuda a crecer; una mala compañía puede llevarlos lejos.","Reza por los amigos de tus hijos, por su nombre. Y pide que encuentren amigos como Jonatán: leales, que los protejan y que los acerquen a Dios."],
perg:"¿Conozco a los amigos de mis hijos? ¿Alguno me preocupa?",
des:"Pregúntales a tus hijos por sus amigos, con interés y sin juzgar. Reza hoy por cada amigo por su nombre. Si se puede, invita a uno de sus amigos a merendar en casa.",
ora:"Señor, dales a mis hijos amigos verdaderos que los ayuden a crecer en el bien. Aleja de ellos las malas compañías. Amén."},

{t:"Estudios y sabiduría",ref:"1 Rey 3, 5-12",v:"Concede entonces a tu servidor un corazón comprensivo, para juzgar a tu pueblo, para discernir entre el bien y el mal.",
exp:"Dios se le aparece en sueños al joven rey Salomón y le dice que pida lo que quiera. Salomón no pide riquezas, ni una vida larga, ni la victoria sobre sus enemigos. Pide un corazón que sepa escuchar, para distinguir el bien del mal. Dios queda tan contento que le da sabiduría y también lo que no pidió.",
med:["La sabiduría va más allá de las calificaciones. Es saber elegir el bien, escuchar los buenos consejos, pensar antes de actuar. Es un don que se le pide a Dios.","Reza por los estudios de tus hijos, por su concentración, su memoria, sus maestros. Pero, sobre todo, pide para ellos un corazón que sepa escuchar."],
perg:"¿Qué deseo más para mis hijos: éxito o sabiduría?",
des:"Antes de la escuela (o de la tarea), reza con tus hijos la oración al Espíritu Santo. Pregúntales: «Si Dios te dijera que le pidieras lo que quisieras, ¿qué le pedirías?».",
ora:"Espíritu Santo, dales a mis hijos un corazón que sepa escuchar. Ilumina sus estudios y enséñales a elegir el bien. Amén."},

{t:"Hijos amados de Dios",ref:"Mc 1, 9-11",v:"Tú eres mi Hijo muy querido, en ti tengo puesta toda mi predilección",
exp:"Jesús va al río Jordán y Juan lo bautiza. Al salir del agua, ve que los cielos se abren y que el Espíritu baja como una paloma. Y una voz del cielo lo llama el Hijo amado. Jesús todavía no había hecho ningún milagro: el Padre lo ama antes de cualquier cosa que Él haga.",
med:["En el Bautismo, Dios les dijo lo mismo a cada uno de tus hijos: que son sus hijos amados. Ese amor no depende de calificaciones, de comportamiento ni de logros.","Cuando un niño sabe que es amado sin condiciones, se hace más fuerte para enfrentar el mundo. Y aprende a ver a Dios como Padre a partir de cómo es amado en casa."],
perg:"¿Sienten mis hijos que son amados aun cuando se equivocan?",
des:"Hoy, mira a cada hijo a los ojos y dile: «Dios te ama y yo te amo, tal como eres». Si tienen fotos de su Bautismo, muéstrenselas y cuéntenles cómo fue ese día.",
ora:"Padre, gracias porque mis hijos son tus hijos amados. Que sientan tu amor a través del mío. Amén."},

{t:"Obedecer con amor",ref:"Lc 2, 41-52",v:"El regresó con sus padres a Nazaret y vivía sujeto a ellos. … Jesús iba creciendo en sabiduría, en estatura y en gracia",
exp:"Después de que lo encontraron en el Templo, donde se quedó platicando con los maestros, Jesús regresa a Nazaret con María y José y vive obediente a ellos. El Evangelio resume aquellos años así: Jesús crecía en sabiduría, en estatura y en gracia ante Dios y ante las personas.",
med:["Hasta Jesús, el Hijo de Dios, obedeció a María y a José. La obediencia no es solo hacer lo que nos mandan: es confiar en quienes nos aman y nos guían.","La obediencia se enseña con firmeza y amor juntos. Reglas claras, explicadas con calma, cumplidas con coherencia, y siempre con mucho cariño."],
perg:"En casa, ¿he logrado unir firmeza y cariño? ¿Dónde me excedo o dónde lo dejo pasar?",
des:"Elijan juntos, en familia, una o dos reglas de la casa que están costando trabajo. Expliquen por qué son importantes y pónganse de acuerdo en cómo cumplirlas. Reconoce hoy cada acto de obediencia.",
ora:"Jesús, que fuiste obediente en Nazaret, enseña a mis hijos a obedecer con amor, y enséñame a guiarlos con firmeza y ternura. Amén."},

{t:"Un corazón puro",ref:"Mt 5, 1-12",v:"Felices los que tienen el corazón puro, porque verán a Dios.",
exp:"En lo alto del monte, Jesús enseña las bienaventuranzas, el camino de la verdadera felicidad: dichosos los pobres de espíritu, los mansos, los que tienen hambre de justicia, los misericordiosos, los que trabajan por la paz. Y dichosos los limpios de corazón, porque verán a Dios.",
med:["El mundo ofrece muchas cosas que ensucian el corazón de nuestros hijos, cada vez más pronto: imágenes, canciones, contenidos violentos o impuros. Un corazón puro es un corazón limpio, capaz de ver a Dios.","Proteger la pureza de los hijos es una misión que pide vigilancia (en el celular, en la tele, en las amistades) y diálogo abierto, sin miedo ni vergüenza."],
perg:"¿Qué entra todos los días por los ojos y los oídos de mis hijos?",
des:"Hoy, pon mucha atención a lo que tus hijos ven y escuchan. Si hace falta, activa el control parental. Platica con ellos sobre lo que es bueno y lo que le hace daño al corazón.",
ora:"Señor, guarda el corazón de mis hijos puro y limpio, para que puedan verte. Protege sus ojos y sus oídos de todo mal. Amén."},

{t:"Valor para enfrentar gigantes",ref:"1 Sam 17, 32-37. 45-47",v:"Tú avanzas contra mí armado de espada, lanza y jabalina, pero yo voy hacia ti en el nombre del Señor de los ejércitos",
exp:"El gigante Goliat desafía al ejército de Israel, y todos tienen miedo. David, un joven pastor, se ofrece para pelear. Saúl duda, pero David recuerda que Dios lo libró del león y del oso. Enfrenta a Goliat sin armadura, con una honda y cinco piedras, confiando en Dios, y vence.",
med:["Tus hijos van a enfrentar gigantes: el miedo, la timidez, los exámenes, el acoso escolar, la presión de los amigos. Los hijos valientes no son los que no tienen miedo, sino los que confían en Dios aun con miedo.","David recordó las victorias pasadas para tener valor. Ayuda a tus hijos a recordar las veces en que Dios ya los ayudó."],
perg:"¿Qué «gigante» está enfrentando hoy cada uno de mis hijos?",
des:"Cuenten juntos la historia de David y Goliat (puede ser leyéndola en la Biblia o en una Biblia para niños). Pregúntale a cada hijo cuál es su «gigante» y recen juntos pidiendo valor.",
ora:"Señor, dales a mis hijos el valor de David. Que, aun con miedo, enfrenten a sus gigantes en tu nombre. Amén."},

{t:"Hermanos unidos",ref:"Gn 45, 1-5. 14-15",v:"yo soy José, el hermano de ustedes … no se aflijan … En realidad, ha sido Dios el que me envió aquí delante de ustedes para preservarles la vida.",
exp:"José fue vendido como esclavo por sus propios hermanos, por envidia. Años después, llega a ser gobernador de Egipto, y sus hermanos van a pedirle comida. José les revela quién es, llora, los abraza y perdona a cada uno. Reconoce que Dios convirtió el mal en bien.",
med:["Los pleitos entre hermanos son normales y forman parte del crecimiento. Pero la familia puede enseñarles a resolverlos con perdón, como hizo José con sus hermanos.","Los hermanos unidos en la infancia tienen más posibilidades de ser amigos toda la vida. El Salmo 133 canta lo bueno y agradable que es que los hermanos vivan unidos. Si tienes un solo hijo, reza por los primos y los amigos que son como hermanos."],
perg:"¿Cómo se tratan mis hijos? ¿Los comparo o alimento rivalidades sin darme cuenta?",
des:"Propón hoy un «día de gentileza entre hermanos»: cada uno hace algo bueno por el otro en secreto y, en la noche, lo cuenta. Si hay un pleito, enséñales a pedir y a dar perdón con un abrazo.",
ora:"Señor, une a mis hijos en el amor. Que se perdonen, se protejan y sean amigos toda la vida. Amén."},

{t:"Emociones en paz",ref:"Mc 4, 35-41",v:"«¡Silencio! ¡Cállate!». El viento se aplacó y sobrevino una gran calma.",
exp:"Al caer la tarde, Jesús y los discípulos cruzan el lago en una barca. Se desata una tormenta fuerte, y la barca empieza a llenarse de agua. Jesús está dormido. Los discípulos, aterrados, lo despiertan. Jesús se levanta, le ordena al viento y al mar que se calmen, y todo queda en paz. Luego les pregunta por qué tienen tanto miedo.",
med:["Los niños también sienten ansiedad, tristeza, enojo y miedo, y muchas veces no saben ponerle nombre a lo que sienten. Para ellos es una tormenta dentro de la barca.","Jesús está en la barca de tus hijos. Enséñales a llamarlo en las tormentas. Y sé tú también una presencia tranquila: acoge el sentimiento antes de corregir el comportamiento."],
perg:"¿Qué emoción difícil ha vivido cada uno de mis hijos? ¿He sabido acogerla?",
des:"Hoy, pregúntale a cada hijo: «¿Cómo está tu corazón hoy?». Escucha sin corregir. Enséñales una oración cortita para los momentos de miedo o de enojo: «Jesús, calma mi corazón».",
ora:"Jesús, tú calmaste la tormenta. Calma también el corazón de mis hijos. Dales paz en sus emociones y confianza en ti. Amén."},

{t:"El tiempo y las pantallas",ref:"Ef 5, 15-20",v:"Cuiden mucho su conducta y no procedan como necios, sino como personas sensatas que saben aprovechar bien el momento presente",
exp:"San Pablo les pide a los cristianos de Éfeso que vivan con sabiduría, aprovechando bien el tiempo, porque los días son malos. Que busquen entender la voluntad de Dios y, en lugar de llenarse de cosas que no les hacen bien, se llenen del Espíritu, cantando y dando gracias.",
med:["Las pantallas compiten por el corazón y el tiempo de nuestros hijos. No son malas en sí mismas, pero sin límites les roban el sueño, la plática, el juego y hasta la oración.","Aprovechar bien el tiempo es elegir lo que llena de vida el corazón. Necesitamos sabiduría (y dar el ejemplo: nuestro propio celular también cuenta)."],
perg:"¿Cuánto tiempo pasamos mis hijos (y yo) frente a las pantallas? ¿Qué se está quedando fuera?",
des:"Acuerden hoy un momento sin pantallas en familia (una cena, una hora antes de dormir) y hagan algo juntos: un juego, un cuento, una plática. Empieza guardando tu celular.",
ora:"Señor, enséñanos a aprovechar bien el tiempo. Que las pantallas no nos roben lo más importante de nuestra casa. Amén."},

{t:"La vocación de cada hijo",ref:"Jer 1, 4-10",v:"Antes de formarte en el vientre materno, yo te conocía; antes de que salieras del seno, yo te había consagrado",
exp:"Dios llama a Jeremías para ser profeta. Jeremías se siente demasiado joven y dice que no sabe hablar. Dios le responde que lo conocía desde antes de que naciera, que estará con él y que pondrá sus palabras en su boca.",
med:["Dios tiene un plan para cada uno de tus hijos, desde antes de que estuvieran en el vientre. Nuestra misión no es elegirles la vida, sino ayudarlos a descubrir a qué los llama Dios.","La vocación no es solo ser sacerdote o religiosa: es el llamado al matrimonio, a la vida consagrada, a una profesión, a una manera única de servir. Reza para que tengan oídos para escuchar ese llamado."],
perg:"¿Qué dones veo en cada uno de mis hijos? ¿Les he dado espacio para crecer?",
des:"Dile a cada hijo un don que ves en él («eres muy atento», «tienes talento para dibujar»). Reza por la vocación de cada uno, abierta a lo que Dios quiera.",
ora:"Señor, tú conoces a mis hijos desde antes de que estuvieran en el vientre. Muéstrales su vocación y dales valor para decir que sí. Amén."},

{t:"Un futuro lleno de esperanza",ref:"Jer 29, 11-14",v:"son planes de prosperidad y no de desgracia, para asegurarles un porvenir y una esperanza.",
exp:"El pueblo de Israel estaba desterrado en Babilonia, lejos de casa, sin saber qué iba a pasar. Por medio del profeta Jeremías, Dios les manda una carta: cuidará de ellos, tiene planes de paz para ellos y los hará volver a casa. Cuando lo busquen de todo corazón, lo encontrarán.",
med:["Es natural preocuparnos por el futuro de nuestros hijos: su profesión, su matrimonio, su fe, el mundo en que van a vivir. Pero preocuparnos no le añade ni un día a su vida.","Dios tiene planes de paz para tus hijos. Rezar por su futuro es entregarle lo que no podemos controlar y confiar en que Él estará ahí cuando nosotras no estemos."],
perg:"¿Qué preocupación por el futuro de mis hijos pesa más en mi corazón?",
des:"Escribe una carta a cada hijo (o una para todos) sobre tus sueños para ellos y tu certeza de que Dios los acompaña. Guárdala para dársela en un momento especial.",
ora:"Señor, tú tienes planes de paz para mis hijos. Te entrego su futuro y confío en tu amor. Amén."},

{t:"El hijo que se alejó",ref:"Lc 15, 11-24",v:"Cuando todavía estaba lejos, su padre lo vio y se conmovió profundamente, corrió a su encuentro, lo abrazó y lo besó.",
exp:"Un hijo le pide a su padre la herencia y se va, gastándolo todo en una vida sin rumbo. Cuando toca fondo, recapacita y decide volver. El padre, que lo esperaba todos los días, lo ve de lejos, corre, lo abraza y hace una fiesta. No le reclama nada: solo se alegra porque su hijo volvió.",
med:["Si alguno de tus hijos se ha alejado de la fe, de la casa o de ti, no pierdas la esperanza. El padre de la parábola no obligó a su hijo a volver, pero lo esperó con la puerta abierta y el corazón dispuesto.","Si tus hijos todavía son pequeños, reza para que, cuando se equivoquen, sepan que siempre pueden volver. La puerta de tu casa y la de Dios están abiertas."],
perg:"¿Alguno de mis hijos está lejos (de Dios, de casa o de mí)? ¿Cómo está la puerta de mi corazón para él?",
des:"Reza hoy un misterio del Rosario por el hijo que más necesita de Dios. Si está lejos, mándale un mensaje sencillo y cariñoso, sin reclamos. Si tus hijos son pequeños, diles: «Pase lo que pase, siempre puedes volver conmigo».",
ora:"Padre misericordioso, haz volver a los hijos que se alejaron. Dame un corazón que espera con amor y una puerta siempre abierta. Amén."},

{t:"Hijos agradecidos",ref:"Lc 17, 11-19",v:"¿Cómo, no quedaron purificados los diez? Los otros nueve, ¿dónde están?",
exp:"Diez leprosos le piden a Jesús que tenga compasión de ellos. Jesús les dice que vayan a presentarse a los sacerdotes y, en el camino, todos quedan sanos. Solo uno, un samaritano, vuelve alabando a Dios y se postra a los pies de Jesús para darle las gracias. Jesús pregunta por los otros nueve.",
med:["La gratitud se enseña practicándola. Un niño agradecido es más feliz, más generoso y se queja menos. Y descubre que todo lo que tiene es un regalo.","Muchas veces les damos todo a los hijos y olvidamos enseñarles a dar las gracias: a Dios, a los abuelos, a la maestra, a quien les prepara la comida."],
perg:"¿Mis hijos suelen dar las gracias? ¿Yo doy gracias delante de ellos?",
des:"Hoy en la cena, cada persona de la familia dice tres cosas por las que le da gracias a Dios. Ayuda a tus hijos a escribir una notita de agradecimiento para alguien (la abuela, la maestra, la catequista).",
ora:"Señor, enseña a mis hijos a volver para dar gracias, como el samaritano. Que nuestra casa esté llena de gratitud. Amén."},

{t:"Los sacramentos en la vida de los hijos",ref:"Mc 10, 13-16",v:"Dejen que los niños se acerquen a mí y no se lo impidan, porque el Reino de Dios pertenece a los que son como ellos.",
exp:"Algunas personas le llevan niños a Jesús para que los toque, pero los discípulos las reprenden. Jesús se indigna y les dice que dejen que los niños se acerquen a Él. Luego los abraza, les impone las manos y los bendice.",
med:["Los sacramentos son encuentros reales con Jesús: el Bautismo, la Confesión, la Eucaristía, la Confirmación. Llevar a nuestros hijos a ellos es hacer lo que hicieron aquellas mamás: acercar a los niños a Jesús para que Él los toque.","A veces, con las prisas, el catecismo se vuelve un compromiso más en la agenda. Que tus hijos vean que la Misa y los sacramentos también son importantes para ti."],
perg:"¿En qué momento de su vida sacramental está cada uno de mis hijos? ¿Hay algo atrasado u olvidado?",
des:"Revisa si cada hijo está al día con los sacramentos y con la catequesis propia de su edad. Este domingo, vayan juntos a Misa y, a la salida, platiquen sobre lo que les pareció.",
ora:"Jesús, te traigo a mis hijos. Tócalos por medio de los sacramentos y bendícelos con tus manos. Amén."},

{t:"Yo, mamá, como ejemplo",ref:"Dt 6, 4-9",v:"Graba en tu corazón estas palabras que yo te dicto hoy. Incúlcalas a tus hijos",
exp:"Moisés le enseña al pueblo la oración más importante de Israel, que lo llama a escuchar que el Señor es el único Señor y a amarlo con todo el corazón. Y pide que estas palabras se enseñen a los hijos todo el tiempo: sentados en casa, yendo por el camino, al acostarse y al levantarse.",
med:["Los hijos aprenden mucho más por lo que ven que por lo que nos oyen decir. Observan cómo reacciona mamá ante el estrés, cómo habla de su esposo, cómo reza, cómo trata a quienes la atienden.","Esto no es para pesarte, sino para animarte: no necesitas ser perfecta, necesitas ser auténtica. Cuando te equivoques, pídeles perdón a tus hijos. Eso también les enseña."],
perg:"¿Qué ejemplo he estado dando sin darme cuenta? ¿Qué me gustaría que mis hijos aprendieran de mí?",
des:"Hoy, elige un momento cotidiano (en el coche, a la hora del baño, al acostarlos) para hablarles de Dios a tus hijos de forma sencilla, como pide Moisés. Si te equivocaste con alguno de ellos hace poco, pídele perdón.",
ora:"Señor, que mi vida sea un ejemplo de fe para mis hijos. Perdona mis fallas y úsalas también para enseñarles. Amén."},

{t:"Consagrar a mis hijos a la Virgen",ref:"Jn 19, 25-27",v:"Mujer, aquí tienes a tu hijo … Luego dijo al discípulo: «Aquí tienes a tu madre».",
exp:"Al pie de la cruz estaban María y el discípulo amado, Juan. Antes de morir, Jesús le entrega a Juan a María como madre, y a María a Juan como hijo. Y desde aquella hora el discípulo la recibió en su casa. La Iglesia entiende que, ahí, Jesús nos dio a María como madre de todos nosotros.",
med:["Nadie entiende mejor el corazón de una mamá que María. Ella vio a su hijo crecer, perderse, ser incomprendido y sufrir. Y siguió de pie, confiando.","Consagrar a tus hijos a la Virgen es ponerlos bajo el manto de una Madre que nunca falla. Después de estos 21 días, entrégale el cuidado de todo lo que has rezado."],
perg:"¿Qué cambió en mi corazón de mamá en estos 21 días?",
des:"Reúne a tus hijos frente a una imagen de la Virgen y recen juntos un Avemaría y la oración de consagración de hoy. Si pueden, regálenle una flor a María.",
ora:"Oh María, Madre mía, te consagro a mis hijos. Cúbrelos con tu manto, guárdalos del mal y llévalos siempre a Jesús. Son tuyos. Amén."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="filhos21"){PLANOS[i].d=D;PLANOS[i].resumo="Tres semanas cubriendo a tus hijos de oración: fe, protección, salud, amistades, emociones, futuro y vocación. Cada día trae una lectura explicada, una meditación, un espacio para escribir y un reto para vivirlo con ellos.";}}
})();

// 30 días de oración durante el embarazo: versión completa
(function(){
var D=[
{t:"Una vida nueva en mí",ref:"Sal 139, 13-16",v:"Tú creaste mis entrañas, me plasmaste en el seno de mi madre…",
exp:"El salmista contempla maravillado la obra de Dios: fue Él quien formó cada parte de su ser, en el vientre de su madre, en lo secreto. Los ojos de Dios lo veían cuando apenas era un embrión, y todos los días de su vida ya estaban escritos en el libro de Dios.",
med:["En este momento, Dios está tejiendo una vida dentro de ti. Cada latido, cada deditito, cada rasgo de la carita de tu bebé está siendo formado por sus manos.","Participas en la obra más hermosa de la creación. Que estos 30 días sean un tiempo para contemplar, agradecer y poner esta vida en las manos de Aquel que la está tejiendo."],
perg:"¿Qué siento al pensar que Dios está tejiendo a mi bebé ahora mismo?",
des:"Pon las manos sobre tu vientre, lee en voz alta a tu bebé el Salmo 139, 13-16 y agradece a Dios por su vida.",
ora:"Señor, gracias por la vida que estás tejiendo en mí. Cuida cada detalle de mi bebé. Es tuyo. Amén."},

{t:"Un regalo de Dios",ref:"Sal 127, 3-5",v:"Los hijos son un regalo del Señor, el fruto del vientre es una recompensa…",
exp:"Este salmo nos recuerda que todo lo que construimos depende de Dios. Y presenta a los hijos como herencia y regalo del Señor, como flechas en la mano de un guerrero: una bendición que fortalece a la familia.",
med:["Cada hijo es un regalo, aunque llegue en un momento inesperado o el embarazo traiga miedo e inseguridad. Dios te ha confiado una vida única.","Recibir a tu hijo como regalo cambia la mirada: no es una carga ni un problema por resolver, es un don para acoger y agradecer."],
perg:"¿Cómo recibí la noticia de este embarazo? ¿Puedo ver a este bebé como un regalo de Dios?",
des:"Escribe una lista de motivos para dar gracias por este embarazo. Léela al papá del bebé o a alguien a quien quieras.",
ora:"Señor, gracias por el regalo de este hijo. Que lo reciba con alegría y gratitud todos los días. Amén."},

{t:"María también esperó",ref:"Lc 1, 26-33",v:"Concebirás y darás a luz un hijo, y le pondrás por nombre Jesús…",
exp:"El ángel Gabriel visita a una joven de Nazaret llamada María y le anuncia que concebirá y dará a luz un hijo, el Hijo del Altísimo, cuyo reino no tendrá fin. María, llena de gracia, acoge la noticia que cambiaría su vida.",
med:["La Virgen María también vivió un embarazo: el cuerpo que cambia, las dudas, las náuseas, la espera, el viaje a Belén al final del embarazo. Ella entiende lo que sientes.","María guardaba todo en su corazón. Puedes platicar con ella sobre cada etapa, como una hija platica con su mamá."],
perg:"¿Qué sentimiento de mi embarazo me gustaría platicar con la Virgen María?",
des:"Reza hoy una decena del Rosario meditando el primer misterio gozoso (la Anunciación) y entrégale tu embarazo a María.",
ora:"María, tú que esperaste a Jesús, acompaña mi embarazo. Enséñame a guardar todo en el corazón como tú. Amén."},

{t:"El bebé que saltó de alegría",ref:"Lc 1, 39-45",v:"Apenas esta oyó el saludo de María, el niño saltó de alegría en su seno…",
exp:"María, embarazada de Jesús, visita a su prima Isabel, embarazada de Juan. Cuando María llega y saluda a Isabel, el pequeño Juan salta de alegría en el vientre de su madre. Isabel, llena del Espíritu Santo, reconoce la presencia del Señor.",
med:["El bebé de Isabel reconoció a Jesús antes de nacer. La Biblia nos muestra que la vida en el vientre ya es vida plena, capaz de sentir y de alegrarse.","Tu bebé también siente tu voz, tus caricias, tu paz. Tu oración ya toca su vida."],
perg:"¿Cómo imagino a mi bebé respondiendo a mi voz y a mis caricias?",
des:"Platica hoy con tu bebé: cuéntale cómo te fue en el día, cántale una canción, reza un Ave María en voz alta con la mano en tu vientre.",
ora:"Señor, que mi bebé se alegre desde ahora con tu presencia, como Juan se alegró en el vientre de Isabel. Amén."},

{t:"Los miedos del embarazo",ref:"Is 41, 10-13",v:"No temas, porque yo estoy contigo, no te inquietes, porque yo soy tu Dios…",
exp:"Dios le habla a su pueblo con ternura: le dice que no tenga miedo, que Él está a su lado, que lo fortalecerá, lo ayudará y lo sostendrá. Y le promete tomarlo de la mano derecha.",
med:["Es normal tener miedos en el embarazo: por la salud del bebé, por el parto, por no poder con todo, por los cambios en tu vida. El miedo no es falta de fe; es señal de que amas.","Dios no te pide que no sientas miedo; te dice que no temas, porque Él está contigo. Él sostiene tu mano en cada paso."],
perg:"¿Cuál es mi mayor miedo en este embarazo?",
des:"Escribe tus miedos en una hoja. Después, junto a cada uno, escribe: «Dios está conmigo». Reza entregándoselos uno por uno.",
ora:"Señor, Tú sostienes mi mano. Recibe mis miedos y dame tu paz. Amén."},

{t:"Un cuerpo que cambia",ref:"2 Cor 4, 7. 16-18",v:"Pero nosotros llevamos ese tesoro en recipientes de barro",
exp:"San Pablo dice que llevamos un tesoro, la vida de Dios, en frágiles vasijas de barro. Por eso no nos desanimamos: aunque lo exterior se desgaste, lo interior se renueva día a día.",
med:["Tu cuerpo está cambiando mucho: el peso, la piel, el cansancio, la figura. A veces cuesta mirarse al espejo. Pero esta «vasija de barro» lleva un tesoro.","Cada estría, cada kilo, cada dolor de espalda es parte de la obra de dar vida. Tu cuerpo está haciendo algo extraordinario."],
perg:"¿Cómo he mirado mi cuerpo durante este embarazo?",
des:"Mírate hoy al espejo y, en lugar de criticarte, agradece a Dios por lo que tu cuerpo está haciendo. Tómate una foto de tu pancita para guardarla.",
ora:"Señor, gracias por mi cuerpo, que lleva el tesoro de la vida. Enséñame a mirarlo con gratitud. Amén."},

{t:"En los días de náuseas y cansancio",ref:"2 Cor 12, 7-10",v:"Te basta mi gracia, porque mi poder triunfa en la debilidad",
exp:"San Pablo cuenta que tres veces le pidió a Dios que le quitara un sufrimiento al que llamaba una espina clavada en su carne. Dios le respondió que su gracia le bastaba. Y Pablo entendió que, cuando es débil, es entonces cuando es fuerte.",
med:["Hay días en que el embarazo pesa: náuseas, cansancio, dolores, noches sin dormir bien. En esos días no necesitas ser fuerte. La gracia de Dios te basta.","Ofrece a Dios tus molestias por tu bebé. Es una forma antigua y hermosa de orar: convertir el cansancio en amor."],
perg:"¿Qué es lo que más le ha pesado a mi cuerpo estos días? ¿Se lo ofrezco a Dios?",
des:"Hoy, con cada molestia, haz una oración breve: «Jesús, te ofrezco esto por mi bebé». Y descansa sin culpa siempre que puedas.",
ora:"Señor, tu gracia me basta. En los días de cansancio, sé mi fuerza. Te ofrezco cada molestia por mi hijo. Amén."},

{t:"Llamado desde el vientre",ref:"Is 49, 1-5",v:"El Señor me llamó desde el seno materno, desde el vientre de mi madre pronunció mi nombre.",
exp:"El profeta habla de su vocación: antes de nacer, Dios ya lo había llamado y había pronunciado su nombre. Dios lo preparó como una flecha escondida, para una misión. Aun cuando pensaba que trabajaba en vano, sabía que su recompensa estaba en Dios.",
med:["Dios ya sabe el nombre de tu bebé, ya conoce su carácter y tiene una misión para él en el mundo. Antes de que tú lo conozcas, Dios ya lo llamó.","Tu misión como mamá es ayudar a este hijo a descubrir el llamado de Dios. Y eso empieza ahora, con la oración."],
perg:"¿Qué le pido a Dios para la vida y la misión de mi hijo?",
des:"Escribe una oración por la vocación de tu bebé y guárdala para leérsela cuando crezca.",
ora:"Señor, Tú ya llamaste a mi hijo desde el vientre. Prepáralo para la misión que tienes para él. Amén."},

{t:"Bendecir mi vientre",ref:"Nm 6, 22-27",v:"Que el Señor te bendiga y te proteja. Que el Señor haga brillar su rostro sobre ti y muestre su gracia.",
exp:"Dios le enseña a Moisés la bendición que los sacerdotes deben dar al pueblo: que el Señor los bendiga y los proteja, que haga brillar su rostro sobre ellos, que les tenga misericordia y les dé la paz. Es una de las bendiciones más antiguas de la Biblia.",
med:["La bendición de una mamá empieza antes del nacimiento. Bendecir a tu bebé es desearle todo el bien, en el nombre de Dios.","La Iglesia incluso tiene una bendición para la mujer embarazada, que puede darte un sacerdote. Pregunta en tu parroquia."],
perg:"¿Qué bendiciones deseo para mi bebé?",
des:"Haz la señal de la cruz sobre tu vientre y reza por tu bebé la bendición del libro de los Números. Pide al papá del bebé que haga lo mismo. Si es posible, pide la bendición a un sacerdote.",
ora:"Hijo mío, que el Señor te bendiga y te cuide, que te mire siempre con amor y te dé su paz. Amén."},

{t:"El papá del bebé",ref:"Mt 1, 18-24",v:"hizo lo que el Angel del Señor le había ordenado: llevó a María a su casa",
exp:"José se entera de que María está embarazada y piensa dejarla en secreto. En sueños, el ángel le explica que el niño viene del Espíritu Santo y le pide que no tenga miedo de recibir a María. José despierta y hace exactamente lo que el ángel le dijo: acoge a María y al niño.",
med:["José acogió a María y a Jesús con amor y valentía, aun sin entenderlo todo. Él también tuvo miedo y también tuvo que confiar.","El papá de tu bebé también está viviendo este embarazo, a su manera. A veces los hombres se quedan más callados, pero también sienten miedo y preocupación."],
perg:"¿Cómo está viviendo el papá del bebé este embarazo? ¿Lo he hecho parte?",
des:"Invita al papá del bebé a sentir los movimientos, a ir contigo a una consulta o a elegir juntos algo para el bebé. Recen juntos por él y por su misión como papá.",
ora:"San José, protector de la Sagrada Familia, cuida al papá de mi bebé. Dale valentía, fe y un corazón que sepa acoger. Amén."},

{t:"Preparar la casa",ref:"Prov 31, 10-12. 25-30",v:"la mujer que teme al Señor merece ser alabada.",
exp:"El libro de los Proverbios termina con un elogio a la mujer sabia y fuerte: cuida su casa con dedicación, trabaja con sus propias manos, abre la mano al pobre, habla con sabiduría y teme al Señor. Sonríe ante el futuro porque confía.",
med:["Arreglar el cuartito, la ropita y la rutina también es oración cuando se hace con amor. Cada prendita que doblas puede ir acompañada de una plegaria.","No hace falta que todo sea perfecto ni caro. El bebé necesita amor, brazos y cuidados, mucho más que adornos."],
perg:"¿Qué me preocupa todavía de preparar la casa para el bebé?",
des:"Mientras hoy organizas algo del bebé (ropa, el cuartito, la maleta para el hospital), reza un Ave María por cada prenda o rincón.",
ora:"Señor, bendice nuestra casa, que se prepara para recibir a este bebé. Que esté llena de amor y de paz. Amén."},

{t:"Los hermanos mayores",ref:"Sal 133, 1",v:"¡Qué bueno y agradable es que los hermanos vivan unidos!",
exp:"Este salmo breve celebra la alegría de la unión entre hermanos. Compara esa unión con un perfume precioso que se derrama y con el rocío que baja sobre los montes. Ahí es donde Dios derrama su bendición y la vida.",
med:["Si ya tienes hijos, ellos también están viviendo este embarazo: con alegría, con curiosidad y, a veces, con celos y miedo de perder su lugar.","Hacer parte a los hermanos de la espera ayuda a preparar su corazón. Si este es tu primer hijo, reza por los primos, por la familia y por los hermanos que aún pueden llegar."],
perg:"¿Cómo están viviendo los hermanos mayores (o la familia) la llegada del bebé?",
des:"Deja que los hermanos participen: que le hablen a la pancita, que elijan una ropita, que le hagan un dibujo al bebé. Dile a cada uno que el amor de mamá no se reparte: se multiplica.",
ora:"Señor, une a mis hijos en el amor desde ahora. Prepara el corazón de cada uno para recibir a su nuevo hermanito. Amén."},

{t:"Estudios y consultas",ref:"Is 26, 3-4",v:"Su carácter es firme, y tú la conservas en paz, porque ella confía en ti.",
exp:"Isaías canta la confianza en el Señor, que es la roca eterna. Quien se apoya en Él con firmeza es guardado en paz. Por eso invita a todos a confiar siempre en el Señor.",
med:["Cada estudio puede traer ansiedad: el ultrasonido, los análisis de sangre, la espera de los resultados. Es natural que el corazón se apriete.","Lleva a Dios contigo a cada consulta. Reza antes de entrar, durante el estudio y mientras esperas el resultado. La paz viene de apoyarte en Él."],
perg:"¿Qué estudio o resultado me ha tenido ansiosa?",
des:"Antes de tu próxima consulta o estudio, reza Isaías 26, 3-4. Reza también por los médicos y por todo el personal de salud que te atiende.",
ora:"Señor, guárdame en paz. En cada estudio y en cada consulta me apoyo en Ti y confío en tu cuidado. Amén."},

{t:"Ansiedad y paz",ref:"Flp 4, 4-9",v:"No se angustien por nada … la paz de Dios, que supera todo lo que podemos pensar, tomará bajo su cuidado los corazones",
exp:"San Pablo pide a los cristianos que estén siempre alegres en el Señor y que presenten a Dios todas sus peticiones, en oración y con acción de gracias. Promete que la paz de Dios guardará su corazón. Y aconseja llenar la mente de todo lo que es verdadero, bueno y bello.",
med:["La ansiedad en el embarazo es común: lo que podría salir mal, lo que viene. Y a veces internet aumenta el miedo con demasiada información.","Pablo nos da un camino: entregarlo todo en la oración y alimentar el pensamiento con lo que es bueno. Elige bien lo que lees y escuchas en estos meses."],
perg:"¿Qué ha estado alimentando mi ansiedad? ¿Qué puedo cambiar por cosas buenas?",
des:"Hoy haz un «ayuno de búsquedas» en internet sobre el embarazo. En su lugar, lee un salmo o escucha una canción que te dé paz.",
ora:"Señor, recibe mi ansiedad. Guarda mi corazón y mis pensamientos en tu paz. Amén."},

{t:"Elegir el nombre",ref:"Is 43, 1-4",v:"te he llamado por tu nombre, tú me perteneces. … Porque tú eres de gran precio a mis ojos",
exp:"Dios le habla a su pueblo y le dice que no tema, porque Él lo ha rescatado, lo ha llamado por su nombre y le pertenece. Promete estar a su lado en las aguas y en el fuego, y le dice que es precioso y amado a sus ojos.",
med:["El nombre es el primer regalo que le damos a un hijo. Dios llama a cada uno por su nombre, con un amor personal. El nombre de tu bebé también lo pronunciará Dios.","Muchas familias católicas eligen el nombre de un santo, que se convierte en patrono y modelo para el niño."],
perg:"¿Qué deseo que el nombre de mi hijo signifique para él?",
des:"Busca el significado del nombre que eligieron (o de los que están pensando) y si hay un santo con ese nombre. Reza pidiendo la protección de ese santo.",
ora:"Señor, Tú llamas a cada uno por su nombre. Bendice el nombre de mi hijo y haz de él alguien precioso a tus ojos. Amén."},

{t:"Descansar en Dios",ref:"Sal 23, 1-2",v:"El Señor es mi pastor, nada me puede faltar. Él me hace descansar en verdes praderas",
exp:"En el salmo más conocido de la Biblia, David describe a Dios como un pastor que cuida de sus ovejas: las lleva a verdes praderas y a aguas tranquilas, las guía por el camino correcto y está con ellas aun en el valle oscuro.",
med:["Descansar es parte de cuidar a tu bebé. Como dice el salmo, es Dios mismo quien nos lleva a reposar. No es flojera ni debilidad.","En el embarazo, el cuerpo pide más descanso. Escucha a tu cuerpo y deja que el Buen Pastor te lleve a las aguas tranquilas."],
perg:"¿Me he permitido descansar? ¿O siento culpa cuando me detengo?",
des:"Hoy date un rato de descanso de verdad: acuéstate, sube los pies y reza despacio el Salmo 23.",
ora:"Señor, mi Pastor, hazme descansar. Contigo nada me falta, ni a mí ni a mi bebé. Amén."},

{t:"Nuestra Señora del Buen Parto",ref:"Lc 2, 1-7",v:"Mientras se encontraban en Belén, le llegó el tiempo de ser madre; y María dio a luz a su Hijo primogénito",
exp:"Por un censo, José y María, ya al final del embarazo, viajan de Nazaret a Belén. Allí le llega a María el tiempo de dar a luz. No había lugar para ellos en la posada, y María da a luz a Jesús, lo envuelve en pañales y lo acuesta en un pesebre.",
med:["María dio a luz lejos de casa, en un lugar sencillo, sin las comodidades que había planeado. Ella entiende las incertidumbres del parto.","Nuestra Señora del Buen Parto es una devoción antigua de las mujeres embarazadas. Le piden a María que las acompañe en el momento del nacimiento, como una mamá acompaña a su hija."],
perg:"¿Qué me gustaría pedirle a la Virgen sobre el nacimiento de mi bebé?",
des:"Reza hoy la oración a Nuestra Señora del Buen Parto (o una decena del Rosario meditando el nacimiento de Jesús) y entrégale tu parto.",
ora:"Nuestra Señora del Buen Parto, acompáñame en la hora del nacimiento de mi hijo. Cúbrenos con tu manto. Amén."},

{t:"Vida en abundancia",ref:"Jn 10, 10-11",v:"Pero yo he venido para que las ovejas tengan Vida, y la tengan en abundancia.",
exp:"Jesús se presenta como el Buen Pastor. Dice que el ladrón viene a robar y a destruir, pero que Él vino a traer vida, y vida en abundancia. El buen pastor da la vida por sus ovejas.",
med:["Santa Gianna Beretta Molla fue médica, esposa y mamá. En su último embarazo descubrió que tenía una enfermedad grave y eligió proteger la vida de su hija. Es un ejemplo de amor generoso por la vida.","Jesús vino a traer vida en abundancia. El embarazo es una participación en esa obra de Dios: dar vida, cuidar la vida, defender la vida."],
perg:"¿Qué significa para mí pedir vida en abundancia para mi hijo?",
des:"Lee un poco sobre Santa Gianna y reza pidiendo su intercesión por tu embarazo y por todas las mujeres embarazadas.",
ora:"Santa Gianna, intercede por mí y por mi bebé. Jesús, danos vida en abundancia. Amén."},

{t:"Su misericordia de generación en generación",ref:"Lc 1, 46-50",v:"Su misericordia se extiende de generación en generación sobre aquellos que lo temen.",
exp:"Embarazada de Jesús, María canta el Magníficat en la casa de Isabel. Alaba a Dios, que miró su pequeñez e hizo en ella grandes cosas. Y proclama que la misericordia de Dios pasa de generación en generación.",
med:["Tu bebé es una nueva generación de tu familia. La misericordia de Dios que alcanzó a tus abuelos y a tus papás ahora alcanza a tu hijo.","San Gerardo Mayela, religioso redentorista, es muy invocado como patrono de las mujeres embarazadas. Pídele que interceda por la nueva generación que viene en camino."],
perg:"¿Qué herencia de fe quiero dejarle a mi hijo?",
des:"Reza hoy el Magníficat (Lc 1, 46-55) y pide la intercesión de San Gerardo Mayela por tu bebé.",
ora:"San Gerardo Mayela, patrono de las mujeres embarazadas, ruega por nosotros. Señor, que tu misericordia alcance a mi hijo. Amén."},

{t:"Pensando en el Bautismo",ref:"Jn 3, 1-6",v:"el que no nace del agua y del Espíritu no puede entrar en el Reino de Dios.",
exp:"Nicodemo, un fariseo, visita a Jesús de noche. Jesús le dice que hay que nacer de nuevo. Nicodemo no entiende: ¿cómo puede alguien volver al vientre de su madre? Jesús le explica que se trata de nacer del agua y del Espíritu.",
med:["Tu bebé va a nacer dos veces: de tu vientre y, en el Bautismo, del agua y del Espíritu, como hijo de Dios. El Bautismo será su primer gran encuentro con Jesús.","Pensar en el Bautismo desde ahora te ayuda a prepararlo con amor: elegir bien a los padrinos, la parroquia, la fecha."],
perg:"¿Qué clase de padrinos quiero para mi hijo? ¿Personas que lo ayuden en la fe?",
des:"Platica con el papá del bebé sobre el Bautismo: la parroquia, los posibles padrinos y la fecha. Recen por los futuros padrinos.",
ora:"Señor, prepara a mi hijo para nacer del agua y del Espíritu. Que sea tu hijo amado desde su Bautismo. Amén."},

{t:"Platicar con mi bebé",ref:"Sal 145, 1-7",v:"Cada generación celebra tus acciones y le anuncia a las otras tus portentos…",
exp:"El salmista promete alabar a Dios todos los días y dice que cada generación le cuenta a la siguiente las maravillas de Dios. La fe pasa de padres a hijos a través de las historias, los cantos y la oración.",
med:["Tu bebé ya escucha tu voz en el vientre y reconoce su tono. Tus palabras, tus cantos y tus oraciones ya están llegando hasta él.","Contarle a tu bebé las maravillas de Dios desde ahora es empezar a transmitirle la fe. Es su primera catequesis, hecha con amor."],
perg:"¿Qué me gustaría contarle a mi bebé sobre Dios?",
des:"Hoy cántale a tu bebé un canto religioso o cuéntale una historia de la Biblia, con la mano en tu vientre.",
ora:"Señor, que mi hijo oiga hablar de Ti desde el vientre. Que nuestra familia anuncie tus maravillas. Amén."},

{t:"Cuidarme con cariño",ref:"3 Jn 2",v:"Querido hermano, ruego a Dios que te encuentre perfectamente bien y que goces de buena salud en tu cuerpo, como la tienes en tu alma.",
exp:"El apóstol Juan le escribe a un amigo, Gayo, y comienza deseándole salud en el cuerpo, así como ya la tiene en el alma. Y le dice que su mayor alegría es saber que sus hijos espirituales viven en la verdad.",
med:["Comer bien, tomar agua, dormir, llevar tu control prenatal, caminar: todo eso también es amor por tu bebé. Cuidarte es cuidarlo.","Dios desea tu salud en el cuerpo y en el alma. No te olvides del alma: la oración, los sacramentos, un rato de silencio."],
perg:"¿Cómo estoy cuidando mi cuerpo y mi alma en este embarazo?",
des:"Elige hoy un cuidado para tu cuerpo (una comida sana, más agua, una caminata) y uno para tu alma (una Misa, la Confesión, un momento de oración).",
ora:"Señor, ayúdame a cuidar bien mi cuerpo y mi alma, por mí y por mi bebé. Amén."},

{t:"Una red de apoyo",ref:"Lc 1, 39-45. 56",v:"María permaneció con Isabel unos tres meses",
exp:"Justo después del anuncio del ángel, María va de prisa a la casa de Isabel, que también está embarazada. Las dos se encuentran, se alegran y rezan juntas. María se queda unos tres meses con Isabel, hasta cerca del nacimiento de Juan.",
med:["María e Isabel se apoyaron en el embarazo. Ninguna mujer fue hecha para vivir esta etapa sola.","Una red de apoyo (familia, amigas, comunidad) hace mucha diferencia en el embarazo y después del parto. No te dé pena pedir ayuda ni aceptarla."],
perg:"¿Quién forma parte de mi red de apoyo? ¿A quién más podría acudir?",
des:"Platica con alguien de confianza sobre cómo podría ayudarte cuando nazca el bebé. Da las gracias a quienes ya te están apoyando.",
ora:"Señor, gracias por las personas que me apoyan. Pon en mi camino «Isabeles» que caminen conmigo. Amén."},

{t:"Confianza en el parto",ref:"Jn 16, 20-22",v:"La mujer, cuando va a dar a luz, siente angustia porque le llegó la hora; pero cuando nace el niño, se olvida de su dolor",
exp:"En la Última Cena, Jesús prepara a los discípulos para su muerte y resurrección. Para explicarles que su tristeza se convertirá en alegría, usa la imagen del parto: el dolor existe, pero la alegría de una vida nueva es mayor.",
med:["Jesús usó el parto como imagen de esperanza. Él conoce el dolor del parto y la alegría que viene después.","El miedo al parto es natural. Entrégale a Dios el momento del nacimiento: el tipo de parto, el equipo médico, el día y la hora. Él estará contigo."],
perg:"¿Cómo imagino el momento del parto? ¿Qué le entrego hoy a Dios?",
des:"Escribe una oración para rezar el día del parto y guárdala en la maleta del hospital. Pide a alguien de confianza que rece por ti ese día.",
ora:"Jesús, Tú conoces el dolor y la alegría del nacimiento. Quédate conmigo en la hora del parto y convierte toda angustia en alegría. Amén."},

{t:"El equipo que nos va a cuidar",ref:"Eclo 38, 1-4. 12-14",v:"Honra al médico por sus servicios, como corresponde, porque también a él lo ha creado el Señor.",
exp:"El libro del Eclesiástico enseña a valorar y honrar al médico, y a estarle agradecidos, porque su conocimiento viene de Dios. Dice que el Señor hizo que la tierra produjera medicinas y que el mismo médico también le pide a Dios acertar en el diagnóstico y en el tratamiento.",
med:["Médicos, enfermeras, doulas y todo el equipo son instrumentos de Dios. La fe y la medicina caminan juntas.","Rezar por el equipo que va a cuidarte a ti y a tu bebé es un acto de confianza y de caridad. Ellos también necesitan sabiduría y paz."],
perg:"¿Confío en el equipo que me acompaña? ¿He rezado por ellos?",
des:"Reza hoy, por su nombre (si lo sabes), por cada persona del equipo de salud que acompaña tu embarazo y que estará en el parto.",
ora:"Señor, bendice a los médicos y a todo el equipo que nos cuida a mí y a mi bebé. Dales sabiduría, delicadeza y paz. Amén."},

{t:"Por las demás mujeres embarazadas",ref:"Gál 6, 2-10",v:"Ayúdense mutuamente a llevar las cargas",
exp:"San Pablo pide a los cristianos que se ayuden unos a otros a llevar sus cargas. Y nos anima: no nos cansemos de hacer el bien, porque a su tiempo cosecharemos. Mientras tengamos oportunidad, hagamos el bien a todos.",
med:["Muchas mujeres están embarazadas en este momento: algunas solas, con miedo, sin recursos o con embarazos de riesgo. Algunas piensan en rendirse.","Rezar por otras mujeres embarazadas y ayudarlas es una forma de agradecer por tu propio embarazo y de defender la vida."],
perg:"¿Conozco a alguna mujer embarazada que necesite apoyo u oración?",
des:"Reza hoy por todas las mujeres embarazadas, sobre todo por las que están solas o tienen miedo. Si puedes, regala algo a una futura mamá que lo necesite (ropita, pañales).",
ora:"Señor, cuida a todas las mujeres embarazadas del mundo, sobre todo a las que están solas o tienen miedo. Protege cada vida. Amén."},

{t:"Una familia que reza",ref:"Sal 128, 3",v:"Tu esposa será como una vid fecunda en el seno de tu hogar; tus hijos, como retoños de olivo alrededor de tu mesa.",
exp:"El salmo describe la bendición de quien teme a Dios: comer del fruto de su propio trabajo, una esposa como vid llena de frutos, hijos alrededor de la mesa como brotes de olivo. Es la imagen de una familia bendecida y unida.",
med:["Tu bebé va a llegar a un hogar. ¿Qué clase de hogar va a encontrar? Una familia que reza unida le da a su hijo raíces firmes.","No hace falta esperar a que nazca para empezar: la oración en familia puede empezar ahora, con el bebé todavía en el vientre."],
perg:"¿Cómo quiero que sea la vida de oración de nuestra familia cuando llegue el bebé?",
des:"Pónganse de acuerdo, tú y el papá del bebé (y tus otros hijos, si los tienes), en una oración sencilla en familia, y empiecen hoy, con la mano en tu vientre.",
ora:"Señor, que nuestra familia sea como una vid fecunda y como brotes de olivo alrededor de la mesa. Que nuestro hijo crezca en un hogar que reza. Amén."},

{t:"Entregar el nacimiento",ref:"Sal 22, 10-12",v:"desde el seno de mi madre, tú eres mi Dios. No te quedes lejos",
exp:"En medio de un salmo de gran sufrimiento (el salmo que Jesús rezó en la cruz), el salmista recuerda que Dios lo ha cuidado desde que nació: fue Dios quien lo sacó del vientre materno y lo hizo descansar en el regazo de su madre. Y le suplica que no se quede lejos de él.",
med:["Dios está con tu bebé desde el vientre y estará con él al nacer y toda la vida. Él ya es el Dios de tu hijo.","Entregarle el nacimiento a Dios es confiar en que Él cuida el momento exacto, la manera y cada detalle."],
perg:"¿Qué detalle del nacimiento todavía me cuesta entregarle a Dios?",
des:"Haz hoy una oración de entrega del nacimiento, poniendo en las manos de Dios la fecha probable, el lugar y cada miedo. Escríbela aquí.",
ora:"Señor, desde el vientre Tú eres el Dios de mi hijo. No te quedes lejos de nosotros. Te entrego el momento del nacimiento. Amén."},

{t:"Sin preocuparme de más",ref:"Mt 6, 26-30",v:"Miren los pájaros del cielo: ellos no siembran ni cosechan, ni acumulan en graneros, y sin embargo, el Padre que está en el cielo los alimenta.",
exp:"Jesús nos invita a mirar la naturaleza: las aves no guardan en graneros y el Padre las alimenta; los lirios no tejen y se visten más hermosos que el rey Salomón. Si Dios cuida así de ellos, ¡cuánto más cuidará de nosotros, aunque nuestra fe sea pequeña!",
med:["La ropita, la maleta del hospital, el cuartito, el dinero, la licencia de maternidad: la lista de preocupaciones parece no tener fin.","Es bueno prepararse, pero sin dejar que la preocupación te robe la alegría de la espera. El Padre que cuida de los pajaritos cuida de tu bebé."],
perg:"¿Qué preocupación práctica me ha estado robando la paz?",
des:"Haz una lista de lo que todavía falta preparar y divídela en tareas pequeñas. Entrégale la lista a Dios en oración y elige una sola tarea para hoy.",
ora:"Padre, Tú cuidas de las aves y de los lirios. Cuida también de nosotros. Quítame la preocupación excesiva. Amén."},

{t:"Consagrar a mi bebé",ref:"Lc 2, 22-35",v:"llevaron al niño a Jerusalén para presentarlo al Señor",
exp:"Cuarenta días después del nacimiento, María y José llevan a Jesús al Templo para presentarlo a Dios, como mandaba la Ley. Allí, el anciano Simeón toma al niño en brazos y alaba a Dios: ya puede partir en paz, porque ha visto la salvación.",
med:["María y José presentaron a Jesús a Dios. Tú puedes hacer lo mismo con tu bebé desde ahora, consagrándolo a Dios y a la Virgen María.","Después de estos 30 días, entrégale todo: el embarazo, el parto, la vida de tu hijo, tu corazón de mamá."],
perg:"¿Qué cambió en mi corazón en estos 30 días de oración?",
des:"Haz una oración de consagración de tu bebé a Dios y a la Virgen María, con la mano en tu vientre y junto con el papá del bebé, si es posible. Escribe aquí la fecha para contárselo algún día.",
ora:"Señor, te presento y te consagro a mi hijo. María, cúbrelo con tu manto. Es de ustedes, desde el vientre y para siempre. Amén."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="gestacao30"){PLANOS[i].d=D;PLANOS[i].resumo="Para la mamá que está esperando un bebé: un mes para rezar por tu hijo, entregarle a Dios tus miedos y preparar tu corazón para el nacimiento. Cada día trae una lectura explicada, una meditación, un espacio para escribir y un pequeño reto.";}}
})();

// 21 días para restaurar mi hogar: versión completa
(function(){
var D=[
{t:"Dios es quien construye la casa",ref:"Sal 127, 1-2",v:"Si el Señor no edifica la casa, en vano trabajan los albañiles…",
exp:"Este salmo lo cantaban los peregrinos de camino a Jerusalén. Recuerda que todo esfuerzo humano es inútil sin Dios: construir, vigilar, madrugar y acostarse tarde. Dios da lo necesario incluso a los que duermen.",
med:["Cuando la casa se siente pesada, la primera tentación es querer arreglarlo todo sola: más reglas, más exigencias, más cansancio. El salmo nos recuerda que hay que empezar por los cimientos.","Restaurar el hogar empieza por invitar a Dios a ser el constructor. Tú sigues trabajando, pero ya no cargas la obra tú sola."],
perg:"¿En qué parte de mi casa he estado trabajando sola, sin dejar que Dios construya?",
des:"Recorre tu casa, cuarto por cuarto, y reza un Padre Nuestro en cada uno, pidiendo que Dios sea el constructor de ese lugar y de quienes viven ahí.",
ora:"Señor, construye tú mi casa. Sin ti, todo nuestro esfuerzo es en vano. Sé el cimiento de nuestra familia. Amén."},

{t:"Invitar a Jesús a entrar",ref:"Lc 19, 1-10",v:"Zaqueo, baja pronto, porque hoy tengo que alojarme en tu casa.",
exp:"Zaqueo era jefe de los cobradores de impuestos, rico y mal visto por la gente. Como era bajito, se sube a un árbol para ver pasar a Jesús. Jesús se detiene, mira hacia arriba y le dice que quiere quedarse en su casa. Zaqueo lo recibe con alegría, y su vida cambia: devuelve lo que robó y comparte con los pobres. Jesús dice que ese día la salvación ha llegado a esa casa.",
med:["Jesús no esperó a que la casa de Zaqueo estuviera ordenada ni a que su vida estuviera resuelta. Quiso entrar justo ahí. Y bastó con que entrara para que todo empezara a cambiar.","Tu casa tampoco necesita estar perfecta para que Jesús entre. Él quiere quedarse con ustedes hoy, tal como están."],
perg:"¿En qué cuarto de mi casa (o de mi vida) me da vergüenza dejar entrar a Jesús?",
des:"Coloca un crucifijo o una imagen de Jesús en un lugar visible de la casa, por donde la familia pase todos los días. Reza delante de ella: «Jesús, quédate en nuestra casa».",
ora:"Jesús, entra hoy en mi casa, como entraste en la casa de Zaqueo. Que la salvación llegue a todos los que vivimos aquí. Amén."},

{t:"Ordenar primero el corazón",ref:"Sal 51, 3-14",v:"Crea en mí, Dios mío, un corazón puro, y renueva la firmeza de mi espíritu.",
exp:"El rey David escribió este salmo después de reconocer un pecado grave. No se justifica: pide misericordia, pide ser lavado y purificado. Y hace una petición hermosa: un corazón nuevo, un espíritu firme y que le devuelvan la alegría de la salvación.",
med:["La casa cambia cuando cambia el corazón de quien la cuida. Es fácil ver lo que los demás tienen que cambiar; es más difícil mirar hacia adentro.","No se trata de culparte de todo, sino de empezar por donde sí tienes poder: tu propio corazón. Una mamá en paz contagia la paz a toda la casa."],
perg:"¿Qué hay en mi corazón que ha hecho más pesada mi casa?",
des:"Haz hoy un buen examen de conciencia y, si puedes, busca la Confesión esta semana. Anota aquí los horarios de tu parroquia.",
ora:"Dios mío, dame un corazón limpio. Lávame, renuévame y devuélveme la alegría, para que lleve paz a mi casa. Amén."},

{t:"Perdonar dentro de casa",ref:"Mt 18, 21-35",v:"No te digo hasta siete veces, sino hasta setenta veces siete.",
exp:"Pedro le pregunta a Jesús cuántas veces debe perdonar: ¿siete veces? Jesús le responde que setenta veces siete, es decir, siempre. Y cuenta la parábola de un siervo al que el rey le perdonó una deuda enorme, pero que no quiso perdonarle a un compañero una deuda pequeña.",
med:["En familia herimos y nos hieren todos los días, casi siempre sin querer. Sin perdón, la casa se vuelve un lugar de cuentas por cobrar.","Recordar cuánto nos ha perdonado Dios nos ayuda a perdonar a los demás. El perdón no es un sentimiento: es una decisión que se renueva una y otra vez."],
perg:"¿A quién dentro de mi casa todavía no he perdonado de verdad?",
des:"Elige a alguien de la familia con quien haya un resentimiento y da hoy un paso de reconciliación: un abrazo, una disculpa, una palabra amable. Enséñales a tus hijos a decir: «Te perdono».",
ora:"Señor, tú me perdonaste una deuda enorme. Dame un corazón que perdone a los de mi casa una y otra vez. Amén."},

{t:"Palabras suaves",ref:"Sant 3, 2-10",v:"Con ella bendecimos al Señor, nuestro Padre, y con ella maldecimos a los hombres, hechos a imagen de Dios. … Pero no debe ser así",
exp:"Santiago compara la lengua con el freno de un caballo, con el timón de un barco y con una pequeña chispa que incendia todo un bosque. Una parte tan pequeña del cuerpo puede llevarlo todo hacia el bien o hacia el mal. Y advierte que de una misma boca no deberían salir bendición y maldición.",
med:["Un tono de voz cambia toda una conversación. El libro de los Proverbios enseña que una respuesta suave calma el enojo (Prov 15,1). Muchas peleas en casa podrían terminar en minutos con una palabra suave.","Fíjate hoy en las palabras que dices en automático: gritos, sarcasmos, apodos, amenazas. Son chispas pequeñas que van quemando la casa."],
perg:"¿Qué palabras o qué tono de voz míos han encendido incendios dentro de casa?",
des:"Hoy, cuando sientas ganas de gritar, baja la voz y acércate a la persona para hablarle. Repite durante el día esta oración: «Señor, cuida mi boca».",
ora:"Señor, ponle freno a mi lengua. Que de mi boca solo salgan palabras que bendigan a mi familia. Amén."},

{t:"Rezar juntos",ref:"Hech 1, 12-14",v:"Todos ellos, íntimamente unidos, se dedicaban a la oración, en compañía de algunas mujeres, de María, la madre de Jesús",
exp:"Después de que Jesús sube al cielo, los apóstoles regresan a Jerusalén y se reúnen en la sala de arriba. Ahí, junto con María y otras mujeres, rezan unidos, esperando la venida del Espíritu Santo prometido.",
med:["La Iglesia nació de una familia que rezaba junta con María. La oración en familia es también lo que hace que el Espíritu Santo se haga vida dentro de casa.","No tiene que ser larga ni perfecta: un Padre Nuestro antes de dormir, una bendición antes de comer, un Ave María en el carro. Lo que importa es la constancia."],
perg:"¿En qué momento del día podría rezar junta mi familia, aunque sea un minuto?",
des:"Elijan un momento fijo para rezar juntos (en la cena o antes de dormir) y empiecen hoy con un Padre Nuestro y un Ave María, tomados de la mano.",
ora:"María, reza con nosotros como rezaste con los apóstoles. Que nuestra familia persevere unida en la oración. Amén."},

{t:"La paz que Jesús da",ref:"Jn 14, 23-27",v:"Les dejo la paz, les doy mi paz, pero no como la da el mundo.",
exp:"En la Última Cena, Jesús promete que, si alguien lo ama, el Padre y él vendrán a vivir en esa persona. Promete también el Espíritu Santo, que les enseñará y les recordará todo. Y deja un regalo: su paz, distinta de la paz del mundo. Les pide que no se turbe su corazón.",
med:["La paz del mundo depende de que todo esté resuelto. La paz de Jesús vive en el corazón aun cuando hay problemas, porque nace de su presencia.","Una casa en paz no es una casa sin conflictos, sino una casa donde Jesús vive y donde los conflictos encuentran salida."],
perg:"¿Qué es lo que más le ha robado la paz a mi casa?",
des:"Antes de dormir, pasa por el cuarto de cada persona de la casa y dile en voz baja (o en voz alta): «La paz de Jesús esté contigo».",
ora:"Jesús, deja tu paz en nuestra casa. Vive en nosotros y calma nuestros corazones. Amén."},

{t:"Solo una cosa es necesaria",ref:"Lc 10, 38-42",v:"Marta, Marta, te inquietas y te agitas por muchas cosas … una sola es necesaria",
exp:"Jesús visita la casa de Marta y María. Marta se ocupa de muchos quehaceres para recibir bien a su invitado; María se sienta a los pies de Jesús para escucharlo. Marta se queja, y Jesús le responde con cariño: anda inquieta por muchas cosas, pero María escogió la mejor parte.",
