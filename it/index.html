des:"Scegli il momento più difficile della giornata e pianificalo meglio: prepara le cose la sera prima, avvisa i bambini per tempo, semplifica. Prova a svegliarti 10 minuti prima per pregare.",
ora:"Signore, aiutami a organizzare la routine della nostra famiglia e a mettere te al centro. Amen."},

{t:"Ogni figlio è unico",ref:"Sal 139,13-16",v:"Ti lodo, perché mi hai fatto come un prodigio…",
exp:"Il salmista contempla l’opera di Dio in sé stesso: Dio lo ha formato nel grembo della madre, ha conosciuto ogni parte del suo essere e ha visto i suoi giorni prima che esistessero. E lo loda per averlo fatto in modo così meraviglioso.",
med:["Ogni figlio è stato intessuto da Dio in modo unico: con il suo ritmo, il suo carattere, i suoi doni e le sue difficoltà. Confrontare i fratelli tra loro (o con i figli degli altri) rende la mamma impaziente e ferisce i figli.","Quando guardiamo ogni figlio come un’opera meravigliosa di Dio, la pazienza cresce. Non deve somigliare al fratello; deve essere sé stesso, come Dio l’ha fatto."],
perg:"Tendo a confrontare i miei figli tra loro o con altri bambini?",
des:"Oggi di’ a ciascuno dei tuoi figli qualcosa che lo rende unico e speciale ai tuoi occhi. Evita qualsiasi paragone per tutta la giornata.",
ora:"Signore, grazie per ogni figlio, opera meravigliosa delle tue mani. Insegnami ad amare ciascuno così come tu l’hai fatto. Amen."},

{t:"Aspettare i frutti",ref:"Gc 5,7-11",v:"Guardate l'agricoltore: egli aspetta pazientemente il prezioso frutto della terra",
exp:"San Giacomo chiede ai cristiani di essere pazienti fino alla venuta del Signore, come l’agricoltore che aspetta le piogge. Chiede anche di non lamentarsi gli uni degli altri. E ricorda Giobbe, che ha perseverato, e il Signore, che è pieno di misericordia.",
med:["Educare è seminare oggi per raccogliere tra molti anni. Spesso non vediamo i frutti e pensiamo che niente di ciò che facciamo serva.","L’agricoltore non sradica la pianta per vedere se le radici crescono. Si fida. Continua a seminare: ogni preghiera, ogni dialogo, ogni limite dato con amore sta crescendo, anche se tu non lo vedi."],
perg:"Quale frutto sono impaziente di vedere nei miei figli? Riesco a fidarmi dei tempi di Dio?",
des:"Scrivi un elenco dei «semi» che stai seminando nei tuoi figli (fede, rispetto, generosità...). Prega affidando quei semi a Dio.",
ora:"Signore, insegnami ad aspettare come l’agricoltore. Che io continui a seminare con amore e lasci a te il tempo del raccolto. Amen."},

{t:"Che cosa c’è dietro il comportamento",ref:"Mt 18,1-5.10",v:"Guardatevi dal disprezzare uno solo di questi piccoli",
exp:"I discepoli chiedono chi è il più grande nel Regno. Gesù chiama un bambino, lo mette in mezzo a loro e dice che, se non diventeranno come bambini, non entreranno nel Regno. E avverte di non disprezzare nessuno di questi piccoli, perché i loro angeli vedono sempre il volto del Padre.",
med:["Dietro un comportamento difficile c’è quasi sempre un bisogno: fame, sonno, gelosia, paura, voglia di attenzione. Il capriccio è il linguaggio di chi non sa ancora dire ciò che sente.","Gesù ha messo il bambino al centro. Ascoltare il cuore di tuo figlio prima di reagire al comportamento è prendere sul serio qualcuno a cui Dio tiene tanto."],
perg:"Quale comportamento difficile di uno dei miei figli potrebbe nascondere un bisogno?",
des:"Oggi, davanti a un comportamento difficile, prima di correggere chiedi: «Che cosa ti sta succedendo?». Ascolta. Poi parlate insieme di che cosa fare.",
ora:"Gesù, che hai messo il bambino al centro, insegnami ad ascoltare il cuore dei miei figli dietro ogni atteggiamento. Amen."},

{t:"Uno spirito mite e sereno",ref:"1Pt 3,3-4",v:"l'interno del vostro cuore con un'anima incorruttibile piena di mitezza e di pace: ecco ciò che è prezioso davanti a Dio.",
exp:"San Pietro scrive alle donne cristiane e dice che la vera bellezza non sta nelle acconciature, nei gioielli o nei vestiti, ma nel cuore. Uno spirito mite e sereno è una bellezza che non sfiorisce e che ha grande valore agli occhi di Dio.",
med:["La mitezza non è debolezza né passività. È forza sotto controllo: la capacità di essere ferma senza essere dura. Gesù ci ha invitati a imparare da lui, che è mite e umile di cuore (Mt 11,29).","Uno spirito sereno non è quello di una mamma che non prova mai rabbia, ma di una mamma che ha imparato a tornare alla pace più in fretta. E questo è prezioso agli occhi di Dio."],
perg:"Che cosa mi toglie la serenità? Che cosa mi aiuta a tornare alla pace?",
des:"Scegli un’«àncora di pace» da usare quando ti senti agitata: una breve preghiera, un bicchiere d’acqua, uscire dalla stanza per un minuto. Usala oggi ogni volta che ne hai bisogno.",
ora:"Gesù, mite e umile di cuore, rendi il mio cuore simile al tuo. Donami uno spirito mite e sereno. Amen."},

{t:"Ricominciare ogni giorno",ref:"Lam 3,19-26",v:"Le misericordie del Signore non sono finite, non è esaurita la sua compassione; … esse son rinnovate ogni mattina",
exp:"Il libro delle Lamentazioni nasce dal dolore per la distruzione di Gerusalemme. In mezzo al lamento, l’autore ricorda qualcosa che gli ridà speranza: l’amore di Dio non finisce, la sua misericordia si rinnova ogni mattina. È bene aspettare in silenzio la salvezza del Signore.",
med:["Non devi essere una mamma perfetta. Sbaglierai di nuovo, perderai di nuovo la pazienza. Ma ogni mattina è una nuova occasione, perché anche la misericordia di Dio è nuova.","Dopo questi 14 giorni, guarda con tenerezza il cammino fatto. Anche se sei inciampata, sei cresciuta. La pazienza è una strada, non un traguardo."],
perg:"Che cosa è cambiato in me in questi 14 giorni? Quale passo voglio continuare a fare?",
des:"Scrivi una lettera a te stessa, con affetto, come farebbe un’amica: riconosci il tuo impegno, perdona i tuoi errori e ricordati che domani è un nuovo giorno. Rileggila quando ti senti scoraggiata.",
ora:"Signore, grazie perché la tua misericordia si rinnova ogni mattina. Donami la grazia di ricominciare ogni giorno con pazienza e amore. Amen."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="paciencia14"){PLANOS[i].d=D;PLANOS[i].resumo="Due settimane di piccoli passi per sostituire le urla con la calma, con l’aiuto della grazia di Dio. Ogni giorno trovi una lettura spiegata, una meditazione, uno spazio per scrivere e una sfida concreta da vivere con i tuoi figli.";}}
})();

// 30 giorni di fede per chi desidera un bambino: versione completa
(function(){
var D=[
{t:"Aprire il cuore davanti a Dio",ref:"1Sam 1,9-18",v:"sto solo sfogandomi davanti al Signore",
exp:"Anna non riusciva ad avere figli. Nel santuario di Silo prega in silenzio, muovendo solo le labbra, tra molte lacrime. Il sacerdote Eli pensa che sia ubriaca. Anna gli spiega che sta aprendo tutta la sua anima davanti al Signore. Eli la benedice e lei torna a casa con il volto sereno.",
med:["Il desiderio di essere mamma è buono e viene da Dio. Non devi nasconderlo né fingere che vada tutto bene. Anna non ha finto: ha aperto davanti a Dio tutta la sua anima.","La cosa più bella è la fine: prima di qualsiasi risposta, Anna se ne va già con il volto in pace. La pace è venuta dall’affidarsi, non dal ricevere. In questi 30 giorni imparerai ad affidare a Dio questo sogno, giorno dopo giorno."],
perg:"Se oggi aprissi tutta la mia anima davanti a Dio, che cosa gli direi?",
des:"Scrivi a Dio una lettera sincera e raccontagli tutto ciò che provi riguardo al desiderio di essere mamma: il sogno, la paura, il dolore, la speranza. Conservala dentro la tua Bibbia.",
ora:"Signore, apro davanti a te il mio cuore. Tu conosci il mio desiderio. Donami la tua pace mentre aspetto. Amen."},

{t:"Dio mi conosce nel profondo",ref:"Sal 139,1-12",v:"Signore, tu mi scruti e mi conosci…",
exp:"Il salmista riconosce che Dio lo conosce completamente: quando si siede e quando si alza, i suoi pensieri, le sue parole prima ancora che le dica. Non c’è luogo dove possa andare senza che Dio ci sia: né in cielo, né negli abissi, né nel buio, che per Dio è chiaro come il giorno.",
med:["Dio conosce ogni tuo pensiero, ogni lacrima nascosta in bagno, ogni test negativo che nessuno ha visto. Nulla di ciò che vivi gli sfugge.","A volte l’attesa ci fa sentire sole e incomprese. Il salmo ricorda che non c’è buio in cui Dio non sia con te."],
perg:"Quale parte della mia attesa sento che nessuno capisce? L’ho già raccontata a Dio?",
des:"Leggi lentamente tutto il Salmo 139 e sottolinea (o annota) il versetto che ti ha toccato di più il cuore. Ripetilo durante la giornata.",
ora:"Signore, tu mi conosci nel profondo. Grazie perché non sono sola, nemmeno nel buio. Amen."},

{t:"Quando l’attesa fa male",ref:"1Sam 1,1-8",v:"Anna, perché piangi? Perché non mangi? Perché è triste il tuo cuore?",
exp:"Anna era molto amata dal marito, Elkana, ma soffriva perché non aveva figli. Ogni anno, quando salivano al santuario, l’altra moglie di Elkana la provocava. Anna piangeva e non mangiava. Elkana cerca di consolarla, chiedendole se lui non valga per lei più di dieci figli.",
med:["Il dolore di chi desidera un figlio spesso è reso più grande dai commenti: «Allora, a quando un bambino?», «Rilassati, vedrai che arriva». Come Anna, puoi sentirti ferita anche in luoghi che dovrebbero essere di gioia.","Elkana amava Anna, ma non riusciva a capire fino in fondo il suo dolore. Le persone non sempre capiranno. Dio capisce. E hai il diritto di proteggerti dai commenti che feriscono."],
perg:"Quali commenti o situazioni hanno reso più grande il mio dolore? Come posso proteggermi con amore?",
des:"Pensa a una frase semplice e gentile per rispondere alle domande invadenti (per esempio: «Lo stiamo affidando nelle mani di Dio»). Prega per le persone che ti feriscono senza volerlo.",
ora:"Signore, tu vedi le mie lacrime come hai visto quelle di Anna. Proteggi il mio cuore dalle parole che feriscono e donami pace. Amen."},

{t:"Nulla è troppo difficile per Dio",ref:"Gen 18,9-15",v:"C'è forse qualche cosa impossibile per il Signore?",
exp:"Tre visitatori arrivano alla tenda di Abramo e annunciano che Sara, ormai anziana, avrà un figlio l’anno seguente. Sara, nascosta dietro l’ingresso della tenda, ride dentro di sé: le sembra impossibile. Dio chiede perché Sara abbia riso, e se ci sia qualcosa di troppo difficile per il Signore. Un anno dopo nasce Isacco, il cui nome richiama la risata.",
med:["Sara ha riso perché le sembrava impossibile. Forse anche tu hai riso così, per stanchezza o per sfiducia. Dio non ha rimproverato Sara; le ha solo ricordato chi è lui.","La domanda di Dio non è la promessa che tutto andrà come vogliamo noi, ma un invito a non mettere limiti a ciò che lui può fare."],
perg:"Dove sto mettendo limiti a ciò che Dio può fare nella mia vita?",
des:"Scrivi su un cartoncino il versetto di oggi e mettilo dove lo vedrai ogni giorno, soprattutto nei giorni di scoraggiamento.",
ora:"Signore, per te nulla è impossibile. Togli da me la sfiducia e insegnami a confidare nella tua potenza e nel tuo amore. Amen."},

{t:"Dio si ricordò di Rachele",ref:"Gen 30,22-24",v:"Poi Dio si ricordò anche di Rachele; Dio la esaudì e la rese feconda.",
exp:"Rachele, la sposa amatissima di Giacobbe, non aveva figli, mentre sua sorella Lia ne aveva diversi. Per anni ne soffrì. Un giorno la Bibbia dice semplicemente che Dio si ricordò di Rachele. Lei dà alla luce Giuseppe, che sarebbe diventato un grande uomo di Dio.",
med:["A volte sembra che Dio si sia dimenticato di noi, mentre tutti intorno ricevono ciò che chiediamo. Anche Rachele lo ha provato.","Ma nella Bibbia, quando Dio si ricorda, non è perché avesse dimenticato: è perché è arrivato il tempo di agire. Tu non sei dimenticata. Dio custodisce il tuo nome."],
perg:"In quali momenti mi sento dimenticata da Dio?",
des:"Scrivi il tuo nome su un foglio e, sotto, la frase: «Dio non si dimentica di me». Prega oggi con queste parole, affidandogli i confronti che fai con le altre.",
ora:"Signore, ricordati di me. Anche quando mi sento dimenticata, so che il mio nome è custodito nel tuo cuore. Amen."},

{t:"La tua preghiera è stata ascoltata",ref:"Lc 1,8-17",v:"Non temere, Zaccaria, la tua preghiera è stata esaudita e tua moglie Elisabetta ti darà un figlio",
exp:"Zaccaria era sacerdote e, con Elisabetta, pregava da molti anni per avere un figlio. Erano ormai anziani. Mentre lui offre l’incenso nel Tempio, gli appare l’angelo Gabriele e gli dice che la loro preghiera è stata ascoltata. Elisabetta avrà un figlio, Giovanni, che preparerà la via del Signore.",
med:["Elisabetta e Zaccaria hanno pregato per molti anni, forse ormai senza speranza. Ma nessuna di quelle preghiere è andata perduta. Dio le ha custodite tutte.","Nessuna tua preghiera cade nel vuoto. Dio ascolta. La risposta può arrivare in un modo o in un tempo diversi da come immaginiamo, ma lui ascolta."],
perg:"Quale preghiera ripeto da tanto tempo, pensando a volte che Dio non la ascolti?",
des:"Accendi una candela (o fai un gesto simbolico) e prega, insieme a tuo marito se possibile, affidando di nuovo a Dio il desiderio di un figlio.",
ora:"Signore, so che tu ascolti la mia preghiera. Custodisci ogni mia richiesta e rispondi nel tuo tempo e a modo tuo. Amen."},

{t:"Sant’Anna e San Gioacchino",ref:"Rm 12,9-12",v:"Siate lieti nella speranza, forti nella tribolazione, perseveranti nella preghiera",
exp:"La Bibbia non racconta la storia dei genitori della Madonna, ma la tradizione della Chiesa ne ha custodito i nomi: Gioacchino e Anna. Secondo un antico racconto cristiano, anche loro attesero per molti anni un figlio, pregando con fede, finché Dio donò loro Maria. San Paolo, nella lettura di oggi, descrive proprio questo atteggiamento: gioia nella speranza, pazienza e preghiera.",
med:["Gioacchino e Anna sono i patroni dei nonni e sono molto invocati dalle coppie che desiderano un figlio. Conoscono l’attesa, perché l’hanno vissuta.","Gioire nella speranza, avere pazienza nelle prove, non smettere di pregare: non è un elenco di pretese, è un cammino. Chiedi a tutti e due di camminare con voi."],
perg:"Com’è la mia speranza: lieta o stanca? Che cosa mi aiuterebbe a perseverare?",
des:"Prega oggi, con tuo marito se possibile, chiedendo l’intercessione di San Gioacchino e Sant’Anna per il vostro desiderio. Se puoi, cerca un’immagine di loro.",
ora:"San Gioacchino e Sant’Anna, voi che avete atteso con fede, intercedete per noi. Donateci gioia nella speranza e perseveranza nella preghiera. Amen."},

{t:"Un ciclo alla volta",ref:"Mt 6,31-34",v:"Non affannatevi dunque per il domani, perché il domani avrà già le sue inquietudini. A ciascun giorno basta la sua pena.",
exp:"Gesù parla dell’ansia per le necessità della vita. Ricorda che il Padre sa di che cosa abbiamo bisogno e ci chiede di cercare prima il Regno di Dio. E conclude: non preoccupatevi del domani; ogni giorno porta già il suo peso.",
med:["L’attesa di ogni mese può trasformarsi in ansia: contare i giorni, cercare segnali, immaginare, restare deluse. Tutta la vita resta appesa al prossimo risultato.","Gesù ti invita a vivere un giorno alla volta. Oggi, solo oggi. Non è rinunciare al sogno; è non lasciare che ti rubi la vita che sta accadendo adesso."],
perg:"Quanta parte della mia vita ho messo in pausa, aspettando il prossimo risultato?",
des:"Fai oggi qualcosa che ti dà gioia e che non abbia nulla a che fare con l’attesa: una passeggiata, una ricetta nuova, un incontro con le amiche. Vivi pienamente questa giornata.",
ora:"Signore, insegnami a vivere un giorno alla volta. Togli da me l’ansia e restituiscimi la gioia dell’oggi. Amen."},

{t:"Il tempo di Dio",ref:"Qo 3,1-11",v:"Egli ha fatto bella ogni cosa a suo tempo, ma egli ha messo la nozione dell'eternità nel loro cuore",
exp:"Il saggio Qoèlet riflette che tutto nella vita ha il suo tempo: nascere e morire, piantare e raccogliere, piangere e ridere. E conclude che Dio fa bella ogni cosa a suo tempo, anche se l’uomo non riesce a comprendere tutta l’opera di Dio, dall’inizio alla fine.",
med:["Il tempo di Dio non è il nostro, e questo fa male. Vorremmo capire perché, quando, fino a quando. Ma il testo ricorda che noi vediamo solo un pezzo della storia.","Fidarsi del tempo di Dio non è stare con le mani in mano, ma riposare nella certezza che lui fa bella ogni cosa, anche quando ancora non riusciamo a vederlo."],
perg:"Che cosa mi angoscia di più del «tempo di Dio»?",
des:"Disegna una semplice linea del tempo della tua vita e segna i momenti in cui Dio ha agito al momento giusto, anche se allora non lo avevi capito.",
ora:"Signore, tu fai bella ogni cosa a suo tempo. Insegnami a fidarmi del tuo orologio, anche quando sembra lento. Amen."},

{t:"Quando il risultato non arriva",ref:"Sal 34,2-9.18-19",v:"Il Signore è vicino a chi ha il cuore ferito, egli salva gli spiriti affranti.",
exp:"Davide scrive questo salmo dopo essere scampato a un grande pericolo. Invita tutti a benedire il Signore e racconta di aver cercato Dio e di essere stato ascoltato. E afferma che il Signore è vicino a chi ha il cuore ferito e salva chi ha lo spirito abbattuto.",
med:["Ci sono giorni in cui arriva la notizia e il cuore crolla. In quei giorni non devi essere forte, né trovare belle parole. Ti basta sapere che Dio è vicino.","Non è vicino solo a chi sta bene. È vicino soprattutto a chi ha il cuore spezzato. Lasciati consolare."],
perg:"Come reagisco di solito quando il risultato non arriva? Mi lascio consolare da Dio e da mio marito?",
des:"Concorda con tuo marito un piccolo «rito di consolazione» per i giorni difficili: un lungo abbraccio, una preghiera insieme, una passeggiata. Scrivi qui come sarà.",
ora:"Signore, tu sei vicino ai cuori feriti. Nei giorni di tristezza abbracciami e dammi la forza di andare avanti. Amen."},

{t:"Anche piangere è preghiera",ref:"Gv 11,32-36",v:"Gesù scoppiò in pianto.",
exp:"Lazzaro, amico di Gesù, è morto. Quando Gesù arriva, Maria, la sorella di Lazzaro, cade ai suoi piedi piangendo. Gesù si commuove profondamente e chiede dove lo hanno posto. E allora Gesù piange. La gente, vedendolo, capisce quanto gli voleva bene.",
med:["È il versetto più breve della Bibbia e uno dei più consolanti. Gesù, pur sapendo che avrebbe risuscitato Lazzaro, ha pianto con chi piangeva.","Le lacrime non sono mancanza di fede: sono il cuore che parla a Dio senza parole. Gesù piange con te."],
perg:"Mi permetto di piangere? Oppure penso che piangere sia segno di poca fede?",
des:"Oggi, se arrivano le lacrime, lasciale scendere davanti a Dio, senza sensi di colpa. Poi scrivi qui che cosa c’era nel tuo cuore.",
ora:"Gesù, che hai pianto con Marta e Maria, piangi anche con me. Accogli le mie lacrime come preghiera. Amen."},

{t:"Insieme nell’attesa",ref:"Tb 8,4-8",v:"Dègnati di aver misericordia di me e di lei e di farci giungere insieme alla vecchiaia",
exp:"La notte delle nozze, Tobia e Sara si alzano e pregano insieme. Tobia benedice Dio, ricorda la creazione di Adamo ed Eva e chiede a Dio misericordia per tutti e due e di poter invecchiare insieme. E tutti e due rispondono: Amen, amen.",
med:["L’attesa può unire o allontanare la coppia. A volte uno soffre di più, l’altro cerca di risolvere, e l’intimità diventa solo un tentativo. Bisogna prendersi cura del «noi», non solo del sogno.","Tobia e Sara hanno cominciato il loro matrimonio pregando insieme. Il vostro amore è la vostra prima famiglia, e merita di essere custodito, con o senza figli."],
perg:"Come ha toccato l’attesa il mio matrimonio? Di che cosa devo prendermi cura nel nostro «noi»?",
des:"Pregate insieme oggi la preghiera di Tobia e Sara (Tb 8,5-8). Programmate un momento per voi due che non abbia nulla a che fare con l’attesa.",
ora:"Signore, abbi misericordia di noi due. Uniscici sempre di più in questa attesa e fa’ che invecchiamo insieme nel tuo amore. Amen."},

{t:"Prendermi cura del corpo con amore",ref:"1Cor 6,19-20",v:"il vostro corpo è tempio dello Spirito Santo che è in voi … Glorificate dunque Dio nel vostro corpo!",
exp:"San Paolo ricorda ai cristiani di Corinto che il corpo non è qualcosa senza importanza: è tempio dello Spirito Santo. Siamo stati comprati a caro prezzo, con il sangue di Cristo. Per questo anche il corpo è un luogo in cui glorificare Dio.",
med:["Il tuo corpo non è un nemico né un difetto. È tempio di Dio, anche quando non risponde come vorresti.","Prenderti cura del corpo con amore (alimentazione, sonno, movimento, controlli medici) è un atto di amore e di fede. Non per pressione, ma per rispetto verso il tempio che Dio ti ha donato."],
perg:"Come guardo il mio corpo in questa attesa: con tenerezza o con rabbia?",
des:"Fai oggi qualcosa per prenderti cura del tuo corpo: una passeggiata, un pasto nutriente, andare a letto prima, prenotare una visita che rimandi da tempo. Ringrazia Dio per il tuo corpo.",
ora:"Signore, grazie per il mio corpo, tempio del tuo Spirito. Insegnami a prendermene cura con amore e a non vederlo come un nemico. Amen."},

{t:"Quando un’altra annuncia una gravidanza",ref:"Rm 12,9-16",v:"Rallegratevi con quelli che sono nella gioia, piangete con quelli che sono nel pianto.",
exp:"San Paolo descrive come dev’essere l’amore tra i cristiani: sincero, fraterno, generoso. Tra i consigli, chiede di gioire con chi gioisce e di piangere con chi piange, vivendo in armonia.",
med:["Uno dei momenti più difficili per chi desidera un figlio è sentire l’annuncio della gravidanza di un’altra: un’amica, una sorella, una collega. La gioia degli altri può fare molto male, e questo non fa di te una persona cattiva.","Puoi gioire per lei e, nello stesso tempo, sentire il tuo dolore. Le due cose stanno insieme nel cuore. Portale tutte e due a Dio."],
perg:"Come mi sento quando una persona vicina annuncia una gravidanza? Lo porto a Dio?",
des:"Se una persona vicina a te aspetta un bambino, prega oggi per lei e per il suo bambino. Poi prega per te, affidando a Dio il dolore che quell’annuncio ti provoca. Scrivi qui tutti e due i sentimenti.",
ora:"Signore, donami un cuore che gioisca della gioia degli altri, e accogli il mio dolore quando arriva. Amen."},

{t:"Senza sensi di colpa",ref:"Rm 8,1-2.31-39",v:"Non c'è dunque più nessuna condanna per quelli che sono in Cristo Gesù.",
exp:"San Paolo afferma che, in Cristo, non c’è più nessuna condanna. Poi fa una serie di domande: se Dio è per noi, chi sarà contro di noi? Chi ci separerà dall’amore di Cristo? E risponde: niente, né la morte né la vita, né il presente né il futuro.",
med:["Molte donne che desiderano un figlio portano dei sensi di colpa: «Sarà un castigo?», «Avrò sbagliato qualcosa?», «Avrò aspettato troppo?». Queste domande pesano e non vengono da Dio.","La fatica ad avere un figlio non è un castigo di Dio. Lui è dalla tua parte. E niente, assolutamente niente, può separarti dal suo amore."],
perg:"Quale senso di colpa porto riguardo all’attesa? Sono pronta ad affidarlo a Dio?",
des:"Scrivi su un foglio la colpa che porti dentro. Leggi ad alta voce Rm 8,1 e poi strappa il foglio. Se ne senti il bisogno, porta questo peso anche alla Confessione.",
ora:"Signore, non c’è condanna per chi è in te. Toglimi ogni senso di colpa e fammi riposare nel tuo amore. Amen."},

{t:"Riposare in braccio a Dio",ref:"Sal 131,2",v:"Io sono tranquillo e sereno come bimbo svezzato in braccio a sua madre, come un bimbo svezzato è l'anima mia.",
exp:"È un salmo piccolissimo, di soli tre versetti. Il salmista dice che non va in cerca di cose troppo grandi per lui e che ha calmato la sua anima come un bambino svezzato che riposa in braccio alla mamma. E invita il popolo a sperare nel Signore.",
med:["Dio vuole essere per te ciò che una mamma è per il suo bambino: braccia, sicurezza, riposo. Che immagine bella per chi desidera tanto essere mamma.","Oggi non devi risolvere niente né capire niente. Solo riposare in braccio a Dio, come una bambina."],
perg:"Che cosa devo smettere di cercare di risolvere per riposare in Dio?",
des:"Ritagliati oggi 10 minuti di silenzio. Sdraiati o siediti comoda e ripeti lentamente: «Riposo tra le tue braccia, Signore». Nient’altro.",
ora:"Signore, calmo la mia anima tra le tue braccia. Non ho bisogno di capire tutto; voglio solo riposare in te. Amen."},

{t:"Maria, Madre delle mamme",ref:"Gv 19,25-27",v:"Ecco la tua madre!",
exp:"Ai piedi della croce, Gesù affida Maria al discepolo amato come madre, e il discepolo a Maria come figlio. Da quell’ora il discepolo la accoglie nella sua casa. La Chiesa vede in questo gesto Gesù che ci dona Maria come Madre di tutti noi.",
med:["La Madonna è madre di tutte le mamme e di tutte le donne che desiderano diventarlo. Capisce il tuo cuore come nessun altro.","Non sei sola. Hai una Madre in cielo che prega per te e con te, e che conosce il valore di ogni vita."],
perg:"Quale richiesta voglio mettere oggi nelle mani della Madonna?",
des:"Prega oggi un Rosario (o una decina) chiedendo l’intercessione della Madonna per il tuo desiderio di essere mamma.",
ora:"Maria, Madre delle mamme, accogli il mio desiderio e presentalo a Gesù. Insegnami a fidarmi come ti sei fidata tu. Amen."},

{t:"San Gerardo Maiella",ref:"Gc 5,13-18",v:"Molto vale la preghiera del giusto fatta con insistenza.",
exp:"San Giacomo insegna a pregare in ogni situazione. Ricorda il profeta Elia, un uomo come noi, che pregò con insistenza perché non piovesse, e non piovve; poi pregò di nuovo, e il cielo diede la pioggia e la terra produsse il suo frutto.",
med:["San Gerardo Maiella, religioso redentorista lucano del Settecento, è molto amato come patrono delle mamme e delle donne in attesa. Tante donne chiedono la sua intercessione mentre desiderano un figlio.","La preghiera dei santi ha forza perché sono uniti a Dio. Non siamo sole: abbiamo amici in cielo che pregano per noi."],
perg:"Chiedo l’intercessione dei santi? Quale santo mi accompagna in questa attesa?",
des:"Cerca la preghiera a San Gerardo Maiella e recitala oggi. Se vuoi, comincia una novena in suo onore.",
ora:"San Gerardo Maiella, patrono delle mamme, intercedi per me presso Dio. Si compia in me la volontà del Padre. Amen."},

{t:"Santa Gianna, mamma coraggiosa",ref:"1Gv 4,16-19",v:"Nell'amore non c'è timore, al contrario l'amore perfetto scaccia il timore",
exp:"San Giovanni dice che Dio è amore e che chi rimane nell’amore rimane in Dio. E afferma che nell’amore non c’è paura, perché l’amore perfetto scaccia la paura. Noi amiamo perché Dio ci ha amati per primo.",
med:["Santa Gianna Beretta Molla era medico, sposa e mamma, nell’Italia del Novecento. Amava profondamente la vita, la famiglia e i figli, ed è un esempio di santità vissuta giorno dopo giorno.","La paura accompagna spesso l’attesa: paura che non succeda, paura degli esami, paura del futuro. Santa Gianna ci insegna a vivere l’amore che scaccia la paura."],
perg:"Quale paura sta accompagnando la mia attesa?",
des:"Leggi qualcosa sulla vita di Santa Gianna. Scrivi qui una tua paura e, accanto, il versetto di oggi.",
ora:"Santa Gianna, intercedi per me. Signore, il tuo amore scacci ogni paura dal mio cuore. Amen."},

{t:"Fidarsi senza capire",ref:"Pr 3,5-8",v:"Confida nel Signore con tutto il cuore e non appoggiarti sulla tua intelligenza…",
exp:"Il libro dei Proverbi consiglia di confidare in Dio con tutto il cuore, e non solo in ciò che riusciamo a capire. In ogni nostro passo dobbiamo riconoscere Dio, e lui renderà diritti i nostri sentieri.",
med:["Vorremmo capire: perché proprio a me? Perché adesso? Fino a quando? Non sempre avremo le risposte.","Fidarsi senza capire è la fede più difficile e più bella. Non è spegnere la ragione, ma riconoscere che Dio vede più lontano di noi."],
perg:"Quale «perché» non sono ancora riuscita ad affidare a Dio?",
des:"Scrivi su un foglio tutte le tue domande senza risposta. Alla fine scrivi: «Signore, mi fido di te, anche senza capire».",
ora:"Signore, non capisco tutto, ma mi fido di te con tutto il cuore. Rendi diritti i miei sentieri. Amen."},

{t:"Sono più di questa attesa",ref:"Ef 2,4-10",v:"Siamo infatti opera sua, creati in Cristo Gesù per le opere buone che Dio ha predisposto",
exp:"San Paolo ricorda che Dio, ricco di misericordia, ci ha dato la vita in Cristo, per pura grazia e non per merito nostro. E dice che siamo opera di Dio, come un capolavoro, creati per le opere buone che lui stesso ha preparato per noi.",
med:["Il tuo valore non dipende dal diventare mamma o no. Sei un capolavoro di Dio adesso, così come sei. L’attesa fa parte della tua storia, ma non è tutta la tua storia.","Dio ha preparato per te opere buone: nel lavoro, nel matrimonio, in famiglia, nella Chiesa, nella vita degli altri. Oggi guarda anche a quelle."],
perg:"Quali doni e quali opere buone Dio ha messo nella mia vita, oltre a questa attesa?",
des:"Elenca cinque cose belle che sei o che fai (qualità, talenti, servizi). Fai oggi un gesto buono per qualcuno, come espressione di chi sei.",
ora:"Signore, grazie perché sono opera tua. Aiutami a vedere il mio valore in te e a vivere le opere buone che hai preparato per me. Amen."},

{t:"Gratitudine per ciò che ho già",ref:"1Ts 5,16-18",v:"in ogni cosa rendete grazie; questa è infatti la volontà di Dio in Cristo Gesù verso di voi.",
exp:"Alla fine della sua lettera, San Paolo dà alla comunità tre brevi consigli: essere sempre lieti, pregare senza sosta e rendere grazie in ogni cosa. Questa è la volontà di Dio in Cristo Gesù.",
med:["La gratitudine non cancella il desiderio, ma apre gli occhi su ciò che Dio ha già donato: un marito, una casa, la salute, le amiche, la fede. Quando il desiderio occupa tutto lo sguardo, smettiamo di vedere i doni intorno a noi.","Paolo non dice di ringraziare per ogni circostanza, ma in ogni circostanza. Anche nel mezzo dell’attesa ci sono motivi per dire grazie."],
perg:"Quali doni di Dio ho smesso di vedere a causa dell’attesa?",
des:"Scrivi oggi un elenco di 10 cose per cui sei grata. Leggilo ad alta voce, come una preghiera.",
ora:"Signore, grazie per tutto ciò che mi hai già donato. Apri i miei occhi sui tuoi doni, anche mentre aspetto. Amen."},

{t:"Fede tra esami e visite",ref:"Sal 121,2",v:"Il mio aiuto viene dal Signore, che ha fatto cielo e terra.",
exp:"Questo salmo era pregato dai pellegrini che salivano a Gerusalemme. Guardando i monti, si chiedono da dove verrà l’aiuto. E rispondono: dal Signore, che non dorme e non si addormenta, e che custodisce ogni nostro passo, quando usciamo e quando entriamo.",
med:["Visite, esami, terapie e attese dei risultati possono essere faticosi e pieni d’ansia. La fede e la medicina non sono in competizione: Dio agisce anche attraverso le mani dei medici.","Quando vai a una visita o a un esame, ricorda che il tuo aiuto viene dal Signore. Lui custodisce ogni tuo passo, all’andata e al ritorno."],
perg:"Come mi sento davanti a visite ed esami? Li affido a Dio?",
des:"Prega per i medici e per i professionisti che vi seguono. Prima della prossima visita o del prossimo esame, prega il Salmo 121.",
ora:"Signore, il mio aiuto viene da te. Guida i medici, calma il mio cuore e custodisci ogni mio passo. Amen."},

{t:"Una speranza che non delude",ref:"Rm 5,1-5",v:"La speranza poi non delude, perché l'amore di Dio è stato riversato nei nostri cuori per mezzo dello Spirito Santo che ci è stato dato.",
exp:"San Paolo spiega che, grazie a Gesù, siamo in pace con Dio. E dice una cosa sorprendente: le prove producono pazienza, la pazienza rende la fede più solida, e una fede provata genera speranza. E questa speranza non delude, perché poggia sull’amore di Dio.",
med:["La speranza cristiana non è solo desiderare che qualcosa accada. È la certezza che Dio ci ama e si prende cura di noi, qualunque cosa accada.","Per questo non delude: poggia sull’amore di Dio, non sui risultati. Chiedi oggi questa speranza più profonda."],
perg:"Su che cosa poggia la mia speranza: sul risultato o sull’amore di Dio?",
des:"Scrivi una preghiera per chiedere a Dio una speranza che non dipenda dai risultati. Pregala stasera con tuo marito.",
ora:"Dio della speranza, riempimi di gioia e di pace nella fede. Che la mia speranza poggi sul tuo amore. Amen."},

{t:"Dio non mi dimentica",ref:"Is 49,14-16",v:"Si dimentica forse una donna del suo bambino … Anche se queste donne si dimenticassero, io invece non ti dimenticherò mai.",
exp:"Il popolo d’Israele, in esilio, diceva che il Signore lo aveva abbandonato e dimenticato. E Dio risponde con un’immagine di mamma: può una donna dimenticare il bambino che allatta? Anche se lei lo dimenticasse, Dio non dimentica. E dice di aver inciso il suo popolo sul palmo delle sue mani.",
med:["Il tuo cuore di mamma esiste già. Ami già qualcuno che non è ancora arrivato. Dio, che ti ha dato questo cuore, ha anche lui un cuore di mamma per te.","Il tuo nome è inciso sul palmo della mano di Dio. Lui non dimentica te, né il tuo desiderio."],
perg:"Che cosa provo sapendo che il mio nome è inciso sulle mani di Dio?",
des:"Scrivi il tuo nome sul palmo della mano (con una penna) e lascialo lì per tutta la giornata, ricordando che Dio ha fatto lo stesso con te.",
ora:"Signore, tu non ti dimentichi di me. Hai inciso il mio nome sulle tue mani. Consola il mio cuore di mamma. Amen."},

{t:"Il sì di Maria",ref:"Lc 1,26-38",v:"Eccomi, sono la serva del Signore, avvenga di me quello che hai detto",
exp:"L’angelo Gabriele annuncia a Maria che sarà la Madre del Figlio di Dio. Maria fa una domanda sincera: come avverrà? L’angelo spiega e le ricorda che Elisabetta, che tutti dicevano sterile, aspetta un bambino, perché per Dio nulla è impossibile. E Maria dice il suo sì.",
med:["Il sì di Maria non è stato rassegnazione, ma fiducia attiva. Ha chiesto, ha capito ciò che poteva e si è donata completamente.","Aprirsi alla volontà di Dio è dire: «Lo desidero tanto, Signore, ma desidero ancora di più ciò che tu vuoi per me». È una preghiera difficile e liberante."],
perg:"Riesco ad affidare alla volontà di Dio il mio desiderio di essere mamma?",
des:"Prega oggi l’Angelus (o tre Ave Maria), chiedendo a Maria un cuore aperto alla volontà di Dio.",
ora:"Maria, insegnami il tuo sì. Desidero tanto questo figlio, Signore, ma desidero ancora di più la tua volontà. Avvenga in me come vuoi tu. Amen."},

{t:"Il figlio che Dio conosce già",ref:"Ger 1,4-5",v:"Prima di formarti nel grembo materno, ti conoscevo…",
exp:"Dio chiama il giovane Geremia a essere profeta e gli dice che lo conosceva già prima che fosse formato nel grembo della madre. Prima di nascere, Geremia aveva già un posto nel cuore e nel progetto di Dio.",
med:["Dio conosce già i figli che arriveranno nella tua famiglia, attraverso una gravidanza, attraverso l’adozione o come figli spirituali. Puoi pregare per loro fin da ora.","Pregare per il figlio che non è ancora arrivato è un modo di amarlo fin da adesso. La maternità comincia nel cuore."],
perg:"Che cosa vorrei già dire al figlio che non è ancora arrivato?",
des:"Scrivi una lettera al figlio che aspetti. Raccontagli il tuo amore, le tue preghiere e quanto è desiderato. Custodiscila con tenerezza.",
ora:"Signore, tu conosci già i figli che arriveranno nella nostra famiglia. Benedicili fin da ora e prepara il nostro cuore ad accoglierli. Amen."},

{t:"Pregare per chi desidera un figlio",ref:"Gal 6,1-2.9-10",v:"Portate i pesi gli uni degli altri, così adempirete la legge di Cristo.",
exp:"San Paolo chiede ai cristiani di aiutarsi a vicenda a portare i pesi della vita. E incoraggia: non stanchiamoci di fare il bene, perché a suo tempo raccoglieremo, se non ci perdiamo d’animo.",
med:["Tante donne vivono la stessa attesa, spesso in silenzio. Pregare per loro sposta lo sguardo dal nostro dolore e ci unisce in una grande catena di preghiera.","Chi ha vissuto questa attesa capisce come nessun altro il dolore di un’altra donna che desidera un figlio. Forse Dio vuole servirsi della tua storia per consolare qualcuno."],
perg:"Conosco altre donne che vivono questa stessa attesa? Come posso sostenerle?",
des:"Prega oggi, per nome, per le donne che conosci e che desiderano un figlio (o per tutte, se non ne conosci nessuna). Se ti sembra giusto, manda a una di loro un messaggio affettuoso.",
ora:"Signore, ti affido tutte le donne che desiderano un figlio. Consolale, rafforzale e realizza i loro desideri secondo la tua volontà. Amen."},

{t:"La pace che custodisce il cuore",ref:"Fil 4,4-7",v:"la pace di Dio, che sorpassa ogni intelligenza, custodirà i vostri cuori e i vostri pensieri in Cristo Gesù.",
exp:"San Paolo chiede ai cristiani di essere sempre lieti nel Signore e di non angustiarsi per nulla. Piuttosto, di presentare tutto a Dio nella preghiera, con rendimento di grazie. E promette che la pace di Dio custodirà il loro cuore e i loro pensieri, come un soldato custodisce una città.",
med:["La pace di Dio non dipende dal capire tutto né dall’avere tutto risolto. Va oltre ogni comprensione: arriva anche quando la ragione non trova motivi.","Chiedi oggi questa pace che custodisce. Non devi per forza sentirla; basta chiederla e lasciare agire Dio."],
perg:"Che cosa mi sta togliendo la pace in questa attesa?",
des:"Presenta oggi a Dio nella preghiera ogni preoccupazione, una per una, e poi ringrazialo per qualcosa. Scrivi qui che cosa hai affidato.",
ora:"Signore, custodisci il mio cuore e i miei pensieri con la tua pace, che va oltre ogni comprensione. Amen."},

{t:"Rinnovare l’affidamento",ref:"Sal 62,2-9",v:"Solo in Dio riposa l'anima mia; da lui la mia salvezza.",
exp:"Il salmista, circondato da difficoltà, afferma con decisione che solo in Dio la sua anima trova riposo. Lui è roccia, salvezza e fortezza. E invita tutti a confidare in lui in ogni tempo e ad aprire davanti a lui il proprio cuore.",
med:["Dopo 30 giorni l’attesa può continuare, ma tu non sei più la stessa. Hai aperto la tua anima, hai pianto, hai riposato, ti sei fidata. Dio era in ogni passo.","Rinnovare l’affidamento non è rinunciare al sogno: è rimetterlo nelle mani giuste. Solo in Dio l’anima trova riposo."],
perg:"Che cosa è cambiato nel mio cuore in questi 30 giorni? Come voglio continuare il cammino?",
des:"Rileggi la lettera che hai scritto il primo giorno. Scrivi a Dio una nuova lettera, rinnovando il tuo affidamento. Se vuoi, ricomincia il percorso quando ne senti il bisogno.",
ora:"Signore, solo in te la mia anima trova riposo. Rinnovo l’affidamento del mio desiderio di essere mamma. Si compia la tua volontà, nel tuo tempo. Amen."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="tentante30"){PLANOS[i].d=D;PLANOS[i].resumo="Per chi desidera un bambino: un mese per affidare a Dio questo sogno, calmare il cuore a ogni ciclo e camminare con le donne della Bibbia che hanno atteso anche loro. Ogni giorno ci sono una lettura spiegata, una meditazione, uno spazio per scrivere e una piccola sfida.";}}
})();

// Preghiere di casa, Rosario e novene (italiano, Italia)
// Le preghiere tradizionali usano i testi ufficiali in uso in Italia.
// Il Magnificat è il testo della Bibbia CEI (Lc 1,46-55). Le altre preghiere sono state scritte per questa app.
window.ORACOES = [
// ——— Preghiere di sempre
{id:"sinal",cat:"sempre",t:"Segno della croce",x:"Nel nome del Padre e del Figlio e dello Spirito Santo. Amen."},
{id:"painosso",cat:"sempre",t:"Padre Nostro",x:"Padre nostro che sei nei cieli, sia santificato il tuo nome, venga il tuo regno, sia fatta la tua volontà come in cielo così in terra.\nDacci oggi il nostro pane quotidiano, e rimetti a noi i nostri debiti come anche noi li rimettiamo ai nostri debitori, e non abbandonarci alla tentazione, ma liberaci dal male. Amen."},
{id:"avemaria",cat:"sempre",t:"Ave Maria",x:"Ave, o Maria, piena di grazia, il Signore è con te. Tu sei benedetta fra le donne e benedetto è il frutto del tuo seno, Gesù.\nSanta Maria, Madre di Dio, prega per noi peccatori, adesso e nell’ora della nostra morte. Amen."},
{id:"gloria",cat:"sempre",t:"Gloria al Padre",x:"Gloria al Padre e al Figlio e allo Spirito Santo.\nCome era nel principio, ora e sempre, nei secoli dei secoli. Amen."},
{id:"creio",cat:"sempre",t:"Credo apostolico",x:"Io credo in Dio, Padre onnipotente, Creatore del cielo e della terra. E in Gesù Cristo, Suo unico Figlio, nostro Signore, il quale fu concepito di Spirito Santo nacque da Maria Vergine, patì sotto Ponzio Pilato, fu crocifisso, morì e fu sepolto; discese agli inferi; il terzo giorno risuscitò da morte; salì al cielo, siede alla destra di Dio Padre onnipotente: di là verrà a giudicare i vivi e i morti.\nCredo nello Spirito Santo, la santa Chiesa cattolica, la comunione dei santi, la remissione dei peccati, la risurrezione della carne, la vita eterna. Amen."},
{id:"omeujesus",cat:"sempre",t:"Preghiera di Fatima",x:"O Gesù mio, perdonateci, liberateci dal fuoco dell’inferno; portate in Cielo tutte le anime, specialmente quelle che ne hanno più bisogno."},
{id:"espirito",cat:"sempre",t:"Vieni Santo Spirito",x:"Vieni, Santo Spirito, riempi i cuori dei tuoi fedeli e accendi in essi il fuoco del tuo amore.\nManda il tuo Spirito per una nuova creazione. E rinnoverai la faccia della terra.\nO Dio, che hai illuminato la mente dei tuoi fedeli con la grazia dello Spirito Santo, concedi a noi di godere sempre la luce della sua verità e di essere consolati dai frutti della sua gioiosa presenza. Per Cristo nostro Signore. Amen."},
{id:"contricao",cat:"sempre",t:"Atto di dolore",x:"Mio Dio, mi pento e mi dolgo con tutto il cuore dei miei peccati, perché peccando ho meritato i tuoi castighi, e molto più perché ho offeso te, infinitamente buono e degno di essere amato sopra ogni cosa.\nPropongo con il tuo santo aiuto di non offenderti mai più e di fuggire le occasioni prossime di peccato. Signore, misericordia, perdonami."},
{id:"comunhao",cat:"sempre",t:"Comunione spirituale",nota:"Sant’Alfonso Maria de’ Liguori",x:"Gesù mio, credo che Tu sei nel Santissimo Sacramento. Ti amo sopra ogni cosa e Ti desidero nell’anima mia. Poiché ora non posso riceverti sacramentalmente, vieni almeno spiritualmente nel mio cuore.\nCome già venuto, io Ti abbraccio e tutto mi unisco a Te; non permettere che io mi abbia mai a separare da Te."},
{id:"angelus",cat:"sempre",t:"Angelus",nota:"Tradizionalmente si recita alle 6 del mattino, a mezzogiorno e alle 18.",x:"L’Angelo del Signore portò l’annunzio a Maria\nEd ella concepì per opera dello Spirito Santo.\nAve Maria...\n\nEccomi, sono la serva del Signore.\nSi compia in me la tua parola.\nAve Maria...\n\nE il Verbo si fece carne.\nE venne ad abitare in mezzo a noi.\nAve Maria...\n\nPrega per noi, santa Madre di Dio.\nPerché siamo resi degni delle promesse di Cristo.\n\nPreghiamo. Infondi nel nostro spirito la Tua grazia, o Padre; Tu, che nell’annunzio dell’angelo ci hai rivelato l’incarnazione del Tuo Figlio, per la Sua passione e la Sua croce guidaci alla gloria della risurrezione. Per Cristo nostro Signore."},

// ——— La Madonna
{id:"salve",cat:"maria",t:"Salve Regina",x:"Salve, Regina, madre di misericordia, vita, dolcezza e speranza nostra, salve. A te ricorriamo, esuli figli di Eva; a te sospiriamo, gementi e piangenti in questa valle di lacrime.\nOrsù dunque, avvocata nostra, rivolgi a noi gli occhi tuoi misericordiosi. E mostraci, dopo questo esilio, Gesù, il frutto benedetto del tuo Seno.\nO clemente, o pia, o dolce Vergine Maria!"},
{id:"minhasenhora",cat:"maria",t:"Sotto la tua protezione",nota:"Affidarsi alla Madonna",x:"Sotto la tua protezione cerchiamo rifugio, Santa Madre di Dio. Non disprezzare le suppliche di noi che siamo nella prova,\nma liberaci da ogni pericolo, o Vergine gloriosa e benedetta."},
{id:"lembrai",cat:"maria",t:"Ricordati",x:"Ricordati, o piissima Vergine Maria, non essersi mai udito al mondo che alcuno abbia ricorso al tuo patrocinio, implorato il tuo aiuto, chiesto la tua protezione e sia stato abbandonato.\nAnimato da tale confidenza, a te ricorro, o Madre, Vergine delle Vergini, a te vengo e, peccatore contrito, innanzi a te mi prostro.\nNon volere, o Madre del Verbo, disprezzare le mie preghiere, ma ascoltami propizia ed esaudiscimi. Amen."},
{id:"magnificat",cat:"maria",t:"Magnificat (Cantico di Maria)",nota:"Lc 1,46-55",x:"L’anima mia magnifica il Signore e il mio spirito esulta in Dio, mio salvatore, perché ha guardato l’umiltà della sua serva. D’ora in poi tutte le generazioni mi chiameranno beata.\nGrandi cose ha fatto in me l’Onnipotente e santo è il suo nome: di generazione in generazione la sua misericordia si stende su quelli che lo temono.\nHa spiegato la potenza del suo braccio, ha disperso i superbi nei pensieri del loro cuore; ha rovesciato i potenti dai troni, ha innalzato gli umili; ha ricolmato di beni gli affamati, ha rimandato i ricchi a mani vuote. Ha soccorso Israele, suo servo, ricordandosi della sua misericordia, come aveva promesso ai nostri padri, ad Abramo e alla sua discendenza, per sempre."},
{id:"concebida",cat:"maria",t:"O Maria concepita senza peccato",nota:"Giaculatoria della Medaglia Miracolosa",x:"O Maria, concepita senza peccato, pregate per noi che ricorriamo a voi."},
{id:"maecansada",cat:"maria",t:"Preghiera di una mamma alla Mamma",nota:"Per i giorni difficili",x:"Madonna, anche tu sei stata mamma. Conosci le notti senza sonno, le preoccupazioni e il cuore stretto.\nOggi vengo da te come figlia. Prendimi per mano e cammina con me. Custodisci i miei figli quando non sono vicino a loro, porta calma nella mia casa e insegnami la tua pazienza e la tua tenerezza.\nChe io custodisca nel cuore, come te, le cose di Dio. Amen."},

// ——— Per la famiglia
{id:"sagradafamilia",cat:"familia",t:"Preghiera alla Santa Famiglia",x:"Gesù, Maria e Giuseppe, voi che a Nazaret avete vissuto l’amore semplice di ogni giorno, guardate la nostra famiglia.\nFate della nostra casa una piccola chiesa: un luogo di preghiera, di tavola condivisa e di perdono.\nAllontanate da noi i litigi, la freddezza e la divisione. Guarite chi è ferito e avvicinate chi è lontano.\nChe nella nostra casa si vivano la pace, la gioia e la fede che c’erano nella vostra. Gesù, Maria e Giuseppe, pregate per noi. Amen."},
{id:"consagracaolar",cat:"familia",t:"Consacrazione della casa alla Santa Famiglia",nota:"Da pregare con tutta la famiglia riunita",x:"Gesù, Maria e Giuseppe, oggi vi consacriamo la nostra casa e tutti quelli che vi abitano.\nGesù, sii il centro della nostra casa: dei nostri discorsi, dei nostri pasti, del nostro lavoro e del nostro riposo.\nMaria, prenditi cura di noi come ti sei presa cura della casa di Nazaret. Insegnaci la tenerezza, la pazienza e la preghiera.\nSan Giuseppe, proteggi questa famiglia, custodisci la nostra porta e sostieni il nostro lavoro.\nChe questa casa sia un luogo di pace, di perdono e di gioia. Da oggi è vostra. Amen."},
{id:"pelosfilhos",cat:"familia",t:"Benedizione di una mamma per i suoi figli",x:"Signore, ti presento i miei figli (di’ il nome di ciascuno).\nTu li hai conosciuti prima di me e li ami ancora più di me. Poni su di loro la tua mano.\nCustodisci il loro corpo da ogni pericolo, il loro cuore da ogni tristezza e la loro anima da ogni male.\nDona loro buoni amici, sapienza negli studi e un cuore che ti ami.\nChe il loro Angelo custode cammini accanto a loro oggi e sempre. Li affido alle tue mani e alle braccia della Madonna. Amen."},
{id:"peloesposo",cat:"familia",t:"Preghiera per mio marito",x:"Signore, ti ringrazio per l’uomo che hai messo al mio fianco.\nBenedici la sua salute, il suo lavoro e le sue decisioni. Dagli forza nei giorni difficili e pace nel cuore.\nAvvicinalo ogni giorno di più a te e fa’ di lui un marito e un papà secondo il tuo cuore.\nUniscici nell’amore, nel rispetto e nel perdono. Che il nostro matrimonio sia segno del tuo amore.\nSan Giuseppe, intercedi per lui. Amen."},
{id:"bencaocasa",cat:"familia",t:"Benedizione della casa",nota:"Da pregare passando di stanza in stanza",x:"Signore, benedici questa casa e tutti quelli che vi abitano.\nChe da questa porta entri solo il bene. Che in questo soggiorno ci siano dialogo e allegria. Che in questa cucina non manchino mai il pane e la gratitudine. Che in queste camere ci siano riposo e pace.\nAllontana da qui ogni discordia, ogni malattia e ogni male.\nChe questa casa sia la tua dimora, Signore. Amen."},
{id:"gestante",cat:"familia",t:"Preghiera della mamma in attesa",x:"Signore della vita, grazie per il bambino che sta crescendo dentro di me.\nCustodiscilo in ogni giorno di questa gravidanza, forma ogni parte del suo piccolo corpo con il tuo amore e prepara il mio cuore ad accoglierlo.\nMadonna del Buon Parto, accompagnami fino al giorno della nascita e avvolgi tutti e due nel tuo manto. Amen."},
{id:"desejomae",cat:"familia",t:"Preghiera di chi desidera diventare mamma",nota:"Per chi è in attesa di una gravidanza",x:"Signore, Dio della vita, tu conosci il desiderio del mio cuore di diventare mamma.\nLo metto nelle tue mani, con tutto ciò che sento: la speranza, l’ansia e le lacrime di ogni attesa.\nCalma il mio cuore, rafforza il mio matrimonio e prenditi cura del mio corpo. Dammi pace per vivere un giorno alla volta e fiducia nei tuoi tempi.\nMadonna, Sant’Anna e San Gioacchino, Santa Elisabetta e San Gerardo Maiella, pregate con me.\nSia fatta la tua volontà, Signore, e che io non dimentichi mai di essere tua figlia amata. Amen."},
{id:"longe",cat:"familia",t:"Per chi è lontano dalla fede",x:"Padre di misericordia, ti presento (di’ il nome), che vive lontano da te.\nTu non ti arrendi mai con nessuno. Corri incontro a questa persona come il padre corse ad abbracciare il figlio che tornava a casa.\nTocca il suo cuore come solo tu sai fare, metti persone buone sul suo cammino e dammi pazienza e amore per attendere i tuoi tempi.\nSanta Monica, che hai pregato tanti anni per tuo figlio, intercedi per noi. Amen."},

// ——— Ogni giorno
{id:"manha",cat:"dia",t:"Preghiera del mattino",x:"Buongiorno, Signore! Grazie per questo nuovo giorno.\nTi offro tutto ciò che oggi farò, penserò e sentirò: il lavoro, le faccende di casa, la cura della mia famiglia, le gioie e le stanchezze.\nGuida i miei passi, custodisci le mie parole e donami pazienza e gioia.\nMadonna, tienimi per mano per tutto il giorno. Amen."},
{id:"noite",cat:"dia",t:"Preghiera della sera",x:"Signore, grazie per questa giornata, per ciò che è andato bene e per ciò che non è andato.\nPerdonami per le volte in cui mi è mancato l’amore, e aiutami a perdonare anch’io.\nMetto nelle tue mani la mia famiglia, le mie preoccupazioni e il giorno di domani.\nCustodisci il nostro sonno e la nostra casa questa notte. Angelo santo, veglia su di noi. Amen."},
{id:"antesrefeicao",cat:"dia",t:"Preghiera prima dei pasti",x:"Benedici, Signore, noi, e questi tuoi doni che stiamo per ricevere dalla tua generosità. Per Cristo nostro Signore. Amen."},
{id:"depoisrefeicao",cat:"dia",t:"Preghiera dopo i pasti",x:"Ti rendiamo grazie, Dio onnipotente, per tutti i tuoi benefici, tu che vivi e regni nei secoli dei secoli. Amen."},
{id:"entrega",cat:"dia",t:"Preghiera di affidamento (per i giorni di ansia)",x:"Gesù, da sola non riesco a portare tutto. Oggi metto nelle tue mani (di’ ciò che ti preoccupa).\nNon voglio più tenere stretto ciò che è tuo. Tu sai ciò che è meglio e hai cura di ogni dettaglio.\nCalma il mio respiro, i miei pensieri e il mio cuore.\nGesù, confido in te. Gesù, confido in te. Gesù, confido in te. Amen."},
{id:"trabalho",cat:"dia",t:"Per il lavoro e il pane di ogni giorno",x:"Signore, che a Nazaret sei stato falegname, benedici il lavoro di questa famiglia.\nDacci salute per lavorare, sapienza per custodire ciò che abbiamo ricevuto e generosità per condividere.\nProvvedi a ciò che ci manca e liberaci dalle preoccupazioni eccessive. Confidiamo nella tua provvidenza.\nSan Giuseppe lavoratore, prega per noi. Amen."},
{id:"cansada",cat:"dia",t:"Preghiera di una mamma stanca",x:"Signore, oggi sono stanca. Tu conosci il mio corpo, la mia mente e il mio cuore.\nNon ti chiedo di essere perfetta, ti chiedo di non essere sola.\nDammi riposo dove c’è una pausa, pazienza dove c’è un capriccio e tenerezza dove c’è fretta.\nGrazie, perché il tuo amore per me non dipende da quanto riesco a fare. Amen."},

// ——— Santi e angeli
{id:"anjo",cat:"santos",t:"Angelo di Dio",x:"Angelo di Dio, che sei il mio custode illumina, custodisci, reggi e governa me che ti fui affidato dalla pietà celeste. Amen."},
{id:"miguel",cat:"santos",t:"San Michele Arcangelo",x:"San Michele Arcangelo, difendici nella lotta: sii il nostro aiuto contro la malvagità e le insidie del demonio. Supplichevoli preghiamo che Dio lo domini e Tu,\nPrincipe della Milizia Celeste, con il potere che ti viene da Dio, incatena nell’inferno satana e gli spiriti maligni, che si aggirano per il mondo per far perdere le anime. Amen."},
{id:"saojose",cat:"santos",t:"Preghiera a San Giuseppe per la famiglia",x:"San Giuseppe, custode della Santa Famiglia, metto la mia casa sotto la tua protezione.\nTu che hai custodito Gesù e Maria con coraggio e in silenzio, prenditi cura anche di noi.\nProteggi mio marito e i miei figli, benedici il nostro lavoro e il nostro pane, e insegnaci a fidarci di Dio anche quando non capiamo tutto.\nSan Giuseppe, prega per noi. Amen."},
{id:"sebastiao",cat:"santos",t:"Preghiera a San Sebastiano",x:"Glorioso San Sebastiano, che sei stato fedele a Gesù fino alla fine, ottienici da Dio il coraggio di vivere la fede con gioia e fermezza.\nProteggi la nostra famiglia dalle malattie, dalla violenza e da ogni male.\nSan Sebastiano, prega per noi. Amen."},
{id:"geraldo",cat:"santos",t:"Preghiera a San Gerardo Maiella",nota:"Protettore delle mamme e di chi desidera diventare mamma",x:"San Gerardo Maiella, amico delle mamme e delle famiglie, mi rivolgo a te con fiducia.\nPresenta a Dio il mio desiderio di diventare mamma e ottienimi la grazia di vivere questa attesa con fede e con pace.\nProteggi anche le donne in attesa e i bambini che stanno per nascere.\nSan Gerardo Maiella, prega per noi. Amen."},
{id:"luzia",cat:"santos",t:"Preghiera a Santa Lucia",x:"Santa Lucia, che hai custodito nel cuore la luce della fede, proteggi i nostri occhi e la nostra vista.\nAiutaci a vedere Dio nelle persone e nelle piccole cose di ogni giorno.\nSanta Lucia, prega per noi. Amen."}

{id:"guadalupe",t:"Novena a San Pio da Pietrelcina",quando:"quando ne hai bisogno",cor:"rosa",

temas:["Padre Pio, uomo di preghiera: passava ore davanti al tabernacolo. Oggi regala a Gesù qualche minuto di silenzio, solo per Lui.","Il Rosario: Padre Pio lo teneva sempre tra le mani e lo chiamava la sua «arma». Oggi recita una decina per le persone che ami.","La sofferenza: per tanti anni portò nel corpo le ferite di Gesù e unì il suo dolore alla Croce. Offri a Dio la fatica che stai vivendo.","La confessione: passava le giornate nel confessionale per riportare le persone a Dio. Pensa alla tua prossima Confessione, senza paura.","«Prega, spera e non agitarti»: era il suo consiglio a chi viveva nell’ansia. Oggi consegna a Dio una preoccupazione e respira in pace.","L’amore per la Madonna: la amava con il cuore di un figlio e le affidava tutti quelli che chiedevano le sue preghiere. Mettiti oggi tra le sue braccia.","L’Angelo custode: Padre Pio diceva di mandargli il proprio angelo quando si aveva bisogno di una preghiera. Ringrazia il tuo Angelo custode e affidagli i tuoi figli.","La carità verso i malati: volle la Casa Sollievo della Sofferenza, un grande ospedale per curare il corpo e consolare l’anima. Oggi fai un gesto di bene per una persona malata.","La fiducia: Padre Pio ci insegna che Dio non abbandona mai i suoi figli. Affida a Lui con fiducia l’intenzione di questa novena."],
o:"San Pio da Pietrelcina, che hai amato Gesù fino a portarne le ferite e hai passato la vita a pregare e a consolare, guarda la mia famiglia.\nInsegnami a pregare con fiducia, a sperare senza agitarmi e ad affidare tutto al Signore.\nTi presento l’intenzione di questa novena (di’ la tua intenzione). Prega per me e per chi amo. San Pio, prega per noi. Amen."},
{id:"luzia",t:"Novena a Santa Lucia",quando:"dal 4 al 12 dicembre",ini:"2026-12-04",cor:"amarelo",

{id:"sebastiao",t:"Novena a San Sebastiano",quando:"dall’11 al 19 gennaio",ini:"2027-01-11",cor:"verde",

{id:"desatadora",t:"Novena a Maria che scioglie i nodi",quando:"quando ne hai bisogno",cor:"lilas",

{id:"saojose",t:"Novena a San Giuseppe",quando:"quando ne hai bisogno",cor:"amarelo",

  comecarDest:function(e){var id=e.dataset.id;if(!S.planos[id])S.planos[id]={inicio:hoje(),feitos:[],notas:{}};save();go({v:"dia",id:id,i:+e.dataset.i});},
  comecarPlano:function(e){var id=e.dataset.id;S.planos[id]={inicio:hoje(),feitos:[],notas:{}};save();go({v:"dia",id:id,i:0});},
  concluirDia:function(e){var id=e.dataset.id,i=+e.dataset.i,p=plano(id);var g=S.planos[id]||(S.planos[id]={inicio:hoje(),feitos:[],notas:{}});if(g.feitos.indexOf(i)<0)g.feitos.push(i);save();
    if(g.feitos.length>=p.d.length){toast("Complimenti! Hai concluso tutto il percorso.");}else toast("Giorno "+(i+1)+" concluso!");
    back();if(cur().v!=="plano")go({v:"plano",id:id});},
  desmarcarDia:function(e){var g=S.planos[e.dataset.id];if(g){g.feitos=g.feitos.filter(function(x){return x!==+e.dataset.i;});save();render();}},
  recomecar:function(e){var g=S.planos[e.dataset.id];if(g){g.feitos=[];g.inicio=hoje();save();}UI.confirma=null;toast("Percorso ricominciato dal giorno 1.");render();},
  pedeConfirma:function(e){UI.confirma=e.dataset.c;render();},
  naoConfirma:function(){UI.confirma=null;render();},
  terco:function(){go({v:"terco"});},
  tercoSet:function(e){S.terco.set=e.dataset.k;save();render();},
  tercoNext:function(){if(S.terco.i<PT.length-1)S.terco.i++;save();render();},
  tercoVolta:function(){if(S.terco.i>0)S.terco.i--;save();render();},
  tercoFim:function(){S.terco.i=0;save();toast("Rosario pregato. La Madonna ti accompagni!");back();},
  novenas:function(){go({v:"novenas"});},
  novenaNova:function(e){go({v:"novenaNova",id:e.dataset.id});},
  novena:function(e){go({v:"novena",uid:e.dataset.uid});},
  comecarNovena:function(e){var n={uid:uid(),id:e.dataset.id,intencao:(document.getElementById("novIntencao")||{}).value||"",inicio:hoje(),feitos:[]};S.novenas.push(n);save();UI.stack.pop();go({v:"novena",uid:n.uid});},
  rezeiNovena:function(e){var n=S.novenas.filter(function(x){return x.uid===e.dataset.uid;})[0];if(!n)return;if(n.feitos.length<9)n.feitos.push(hoje());save();toast(n.feitos.length>=9?"Novena conclusa! Che bello.":"Giorno "+n.feitos.length+" pregato. A domani!");render(true);},
  removeNovena:function(e){S.novenas=S.novenas.filter(function(x){return x.uid!==e.dataset.uid;});save();UI.confirma=null;back();},
  pedidos:function(){go({v:"pedidos"});},
  pedTab:function(e){UI.pedTab=e.dataset.t;UI.confirma=null;render();},
  addPedido:function(){var t=document.getElementById("pedTxt").value.trim(),pa=document.getElementById("pedPara").value.trim();if(!t&&!pa){toast("Prima scrivi la tua intenzione.");return;}S.pedidos.push({id:uid(),para:pa,texto:t,data:hoje(),graca:null});save();toast("Intenzione salvata. Stiamo pregando!");render();},
  graca:function(e){var p=S.pedidos.filter(function(x){return x.id===e.dataset.id;})[0];if(p){p.graca={data:hoje(),nota:(document.getElementById("gracaNota")||{}).value||""};save();}UI.confirma=null;toast("Grazia salvata. Grazie, Signore!");render();},
  apagaPedido:function(e){S.pedidos=S.pedidos.filter(function(x){return x.id!==e.dataset.id;});save();UI.confirma=null;render();},
  oracao:function(e){go({v:"oracao",id:e.dataset.id});},
  kid:function(e){var s=hoje(),l=S.kids[s]||(S.kids[s]=[]),id=e.dataset.id,i=l.indexOf(id);if(i<0){l.push(id);if(l.length===ROTINA_KIDS.length)toast("Una giornata piena di stelline!");}else l.splice(i,1);save();render();},
  historia:function(e){go({v:"historia",id:e.dataset.id});},
  mes:function(e){var y=+UI.calMes.slice(0,4),m=+UI.calMes.slice(5,7)-1+(+e.dataset.d);var d=new Date(y,m,1);var k=d.getFullYear()+"-"+pad(d.getMonth()+1);if(k<CAL_MIN||k>CAL_MAX)return;UI.calMes=k;UI.calSel=k===hoje().slice(0,7)?hoje():k+"-01";render();},
  calDia:function(e){UI.calSel=e.dataset.k;render();},
  baixarCopia:function(){var txt=JSON.stringify({app:"meu-lar-catolico",v:1,salvo:new Date().toISOString(),dados:S});
    try{var b=new Blob([txt],{type:"application/json"});var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download="il-mio-anno-con-dio-backup-"+hoje()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);toast("Backup salvato nei download.");}catch(err){toast("Non è stato possibile salvarlo qui. Usa “Copia il backup”.");}},
  copiarCopia:function(){var txt=JSON.stringify({app:"meu-lar-catolico",v:1,salvo:new Date().toISOString(),dados:S});
    var ok=function(){toast("Backup copiato. Incollalo in un’e-mail o in una nota per conservarlo.");};
    var falha=function(){var ta=document.getElementById("restTxt");ta.value=txt;ta.select();toast("Ho selezionato il backup nel campo qui sotto: copialo e conservalo.");};
    try{navigator.clipboard.writeText(txt).then(ok,falha);}catch(err){falha();}},
  restaurar:function(){var t=document.getElementById("restTxt").value.trim();if(!t){toast("Scegli il file oppure incolla il testo del backup.");return;}restaurar(t);},
  pulaData:function(e){S.dataTeste=e.dataset.k||null;save();UI.calMes=null;UI.calSel=null;toast(S.dataTeste?"Anteprima del giorno "+dataCurta(S.dataTeste):"Di nuovo a oggi");setTab("hoje");}
};
function restaurar(t){try{var o=JSON.parse(t);var d=o.dados||o;if(!d||typeof d!=="object"||!("planos" in d))throw 0;var b=base();for(var k in d)b[k]=d[k];S=b;save();toast("Backup ripristinato con successo!");setTab("hoje");}catch(err){toast("Questo backup non è stato riconosciuto. Controlla il testo.");}}

var tmr={};
function onInput(e){var el=e.target,k=el.dataset.in;if(!k)return;
  if((k==="dataTeste"||k==="restArq")&&e.type!=="change")return;
  if(k==="momento"){var s=hoje();var r=S.momento[s]||(S.momento[s]={});r.nota=el.value;}
  else if(k==="planoDiario"){var g2=S.planos[el.dataset.id]||(S.planos[el.dataset.id]={inicio:hoje(),feitos:[],notas:{}});g2.diario=g2.diario||{};g2.diario[el.dataset.i]=el.value;}
  else if(k==="planoNota"){var g=S.planos[el.dataset.id]||(S.planos[el.dataset.id]={inicio:hoje(),feitos:[],notas:{}});g.notas=g.notas||{};g.notas[el.dataset.i]=el.value;}
  else if(k==="novInt"){var n=S.novenas.filter(function(x){return x.uid===el.dataset.uid;})[0];if(n)n.intencao=el.value;}
  else if(k==="nome"){S.nome=el.value.trim();}
  else if(k==="lembHora"){S.lembHora=el.value;}
  else if(k==="dataTeste"){if(el.value){S.dataTeste=el.value;save();UI.calMes=null;UI.calSel=null;toast("Anteprima del giorno "+dataCurta(el.value));}return;}
  else if(k==="restArq"){var f=el.files&&el.files[0];if(f){var rd=new FileReader();rd.onload=function(){restaurar(String(rd.result));};rd.readAsText(f);}return;}
  clearTimeout(tmr.s);tmr.s=setTimeout(save,300);
}

function init(){
  app=document.getElementById("app");nav=document.getElementById("nav");toastEl=document.getElementById("toast");
  document.addEventListener("click",function(e){var el=e.target.closest("[data-a]");if(!el||el.disabled)return;var f=A[el.dataset.a];if(f){e.preventDefault();f(el);}});
  document.addEventListener("input",onInput);document.addEventListener("change",function(e){if(e.target.dataset.in==="restArq"||e.target.dataset.in==="dataTeste")onInput(e);});
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();instalaEvt=e;if(cur().v==="tutorial")render();});
  window.addEventListener("appinstalled",function(){S.tutOk=true;save();});
  render(true);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
