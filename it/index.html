ora:"Gesù, che a Nazaret sei stato obbediente, insegna ai miei figli a obbedire con amore, e insegna a me a guidarli con fermezza e tenerezza. Amen."},

{t:"Un cuore puro",ref:"Mt 5,1-12",v:"Beati i puri di cuore, perché vedranno Dio.",
exp:"Sul monte, Gesù insegna le Beatitudini, la via della vera felicità: beati i poveri in spirito, i miti, chi ha fame di giustizia, i misericordiosi, gli operatori di pace. E beati i puri di cuore, perché vedranno Dio.",
med:["Il mondo offre tante cose che sporcano il cuore dei nostri figli, sempre più presto: immagini, canzoni, contenuti violenti o impuri. Un cuore puro è un cuore limpido, capace di vedere Dio.","Proteggere la purezza dei figli è una missione che chiede vigilanza (sul telefono, sulla TV, nelle amicizie) e un dialogo aperto, senza paura né vergogna."],
perg:"Che cosa entra ogni giorno negli occhi e nelle orecchie dei miei figli?",
des:"Oggi fai molta attenzione a ciò che i tuoi figli guardano e ascoltano. Se serve, attiva il parental control. Parla con loro di ciò che è bello e di ciò che fa male al cuore.",
ora:"Signore, custodisci il cuore dei miei figli puro e limpido, perché possano vederti. Proteggi i loro occhi e le loro orecchie da ogni male. Amen."},

{t:"Il coraggio di affrontare i giganti",ref:"1Sam 17,32-37.45-47",v:"Tu vieni a me con la spada, con la lancia e con l'asta. Io vengo a te nel nome del Signore degli eserciti",
exp:"Il gigante Golia sfida l’esercito d’Israele, e tutti hanno paura. Davide, un giovane pastore, si offre di combattere. Saul è dubbioso, ma Davide ricorda che Dio lo ha liberato dal leone e dall’orso. Affronta Golia senza armatura, con una fionda e cinque pietre, fidandosi di Dio, e vince.",
med:["I tuoi figli dovranno affrontare dei giganti: la paura, la timidezza, le verifiche, il bullismo, la pressione dei compagni. I figli coraggiosi non sono quelli che non hanno paura, ma quelli che si fidano di Dio anche quando hanno paura.","Davide ricordò le vittorie passate per trovare coraggio. Aiuta i tuoi figli a ricordare le volte in cui Dio li ha già aiutati."],
perg:"Qual è il «gigante» che ciascuno dei miei figli sta affrontando oggi?",
des:"Raccontate insieme la storia di Davide e Golia (leggendola nella Bibbia o in una Bibbia per bambini). Chiedi a ogni figlio qual è il suo «gigante» e pregate insieme per avere coraggio.",
ora:"Signore, dona ai miei figli il coraggio di Davide. Che, anche quando hanno paura, affrontino i loro giganti nel tuo nome. Amen."},

{t:"Fratelli uniti",ref:"Gen 45,1-5.14-15",v:"Io sono Giuseppe, il vostro fratello … non vi rattristate e non vi crucciate … Dio mi ha mandato qui prima di voi per conservarvi in vita.",
exp:"Giuseppe fu venduto come schiavo dai suoi stessi fratelli, per invidia. Anni dopo diventa governatore d’Egitto, e i fratelli vanno da lui a chiedere da mangiare. Giuseppe si fa riconoscere, piange, li abbraccia e perdona ciascuno di loro. Riconosce che Dio ha trasformato il male in bene.",
med:["I litigi tra fratelli sono normali e fanno parte della crescita. Ma la famiglia può insegnare a risolverli con il perdono, come fece Giuseppe con i suoi fratelli.","I fratelli uniti da piccoli hanno più probabilità di restare amici per tutta la vita. Il Salmo 133 canta quanto è bello e dolce che i fratelli vivano insieme. Se hai un figlio unico, prega per i cugini e gli amici che sono come fratelli."],
perg:"Come si trattano i miei figli? Li paragono o alimento rivalità senza accorgermene?",
des:"Proponi oggi una «giornata della gentilezza tra fratelli»: ognuno fa qualcosa di bello per un altro in segreto e la sera lo racconta. Se c’è un litigio, insegna loro a chiedere e a dare perdono con un abbraccio.",
ora:"Signore, unisci i miei figli nell’amore. Che sappiano perdonarsi, proteggersi ed essere amici per tutta la vita. Amen."},

{t:"Emozioni in pace",ref:"Mc 4,35-41",v:"«Taci, calmati!». Il vento cessò e vi fu grande bonaccia.",
exp:"Venuta la sera, Gesù e i discepoli attraversano il lago in barca. Si scatena una forte tempesta, e la barca comincia a riempirsi d’acqua. Gesù dorme. I discepoli, terrorizzati, lo svegliano. Gesù si alza, ordina al vento e al mare di calmarsi, e tutto torna in pace. Poi chiede loro perché abbiano tanta paura.",
med:["Anche i bambini provano ansia, tristezza, rabbia e paura, e spesso non sanno dare un nome a ciò che sentono. Per loro è una tempesta dentro la barca.","Gesù è nella barca dei tuoi figli. Insegna loro a chiamarlo nelle tempeste. E sii anche tu una presenza calma: accogli l’emozione prima di correggere il comportamento."],
perg:"Quale emozione difficile sta vivendo ciascuno dei miei figli? Sono riuscita ad accoglierla?",
des:"Oggi chiedi a ogni figlio: «Come sta il tuo cuore oggi?». Ascolta senza correggere. Insegna loro una preghiera brevissima per i momenti di paura o di rabbia: «Gesù, calma il mio cuore».",
ora:"Gesù, tu hai calmato la tempesta. Calma anche il cuore dei miei figli. Dona loro pace nelle emozioni e fiducia in te. Amen."},

{t:"Il tempo e gli schermi",ref:"Ef 5,15-20",v:"Vigilate dunque attentamente sulla vostra condotta, comportandovi non da stolti, ma da uomini saggi; profittando del tempo presente, perché i giorni sono cattivi.",
exp:"San Paolo chiede ai cristiani di Efeso di vivere con saggezza, facendo buon uso del tempo, perché i giorni sono cattivi. Li invita a cercare di capire la volontà di Dio e, invece di riempirsi di ciò che non fa bene, a lasciarsi riempire dallo Spirito, cantando e rendendo grazie.",
med:["Gli schermi si contendono il cuore e il tempo dei nostri figli. Non sono cattivi in sé, ma senza limiti rubano il sonno, le chiacchiere, il gioco e perfino la preghiera.","Fare buon uso del tempo è scegliere ciò che riempie il cuore di vita. Ci vuole saggezza (e il buon esempio: anche il nostro telefono conta)."],
perg:"Quanto tempo passiamo davanti agli schermi i miei figli (e io)? Che cosa sta restando fuori?",
des:"Decidete oggi un momento senza schermi in famiglia (una cena, un’ora prima di dormire) e fate qualcosa insieme: un gioco, una storia, una chiacchierata. Comincia tu, mettendo via il telefono.",
ora:"Signore, insegnaci a usare bene il nostro tempo. Che gli schermi non rubino ciò che è più importante nella nostra casa. Amen."},

{t:"La vocazione di ogni figlio",ref:"Ger 1,4-10",v:"Prima di formarti nel grembo materno, ti conoscevo, prima che tu uscissi alla luce, ti avevo consacrato…",
exp:"Dio chiama Geremia a essere profeta. Geremia si sente troppo giovane e dice di non saper parlare. Dio gli risponde che lo conosceva prima ancora che nascesse, che sarà con lui e che metterà le sue parole sulla sua bocca.",
med:["Dio ha un progetto per ciascuno dei tuoi figli, fin da prima che fossero nel grembo. La nostra missione non è scegliere la vita al posto loro, ma aiutarli a scoprire a che cosa Dio li chiama.","La vocazione non è solo diventare sacerdote o suora: è la chiamata al matrimonio, alla vita consacrata, a una professione, a un modo unico di servire. Prega perché abbiano orecchie per ascoltare questa chiamata."],
perg:"Quali doni vedo in ciascuno dei miei figli? Ho dato loro spazio per crescere?",
des:"Di’ a ogni figlio un dono che vedi in lui («sei così premuroso», «hai un talento per il disegno»). Prega per la vocazione di ciascuno, aperta a ciò che Dio vorrà.",
ora:"Signore, tu conosci i miei figli da prima che fossero nel grembo. Mostra loro la loro vocazione e dona loro il coraggio di dire sì. Amen."},

{t:"Un futuro pieno di speranza",ref:"Ger 29,11-14",v:"progetti di pace e non di sventura, per concedervi un futuro pieno di speranza.",
exp:"Il popolo d’Israele era in esilio a Babilonia, lontano da casa, senza sapere che cosa sarebbe successo. Per mezzo del profeta Geremia, Dio manda loro una lettera: si prenderà cura di loro, ha per loro progetti di pace e li riporterà a casa. Quando lo cercheranno con tutto il cuore, lo troveranno.",
med:["È naturale preoccuparsi per il futuro dei figli: il lavoro, il matrimonio, la fede, il mondo in cui vivranno. Ma preoccuparsi non aggiunge neppure un giorno alla loro vita.","Dio ha progetti di pace per i tuoi figli. Pregare per il loro futuro è affidargli ciò che non possiamo controllare e fidarsi che lui ci sarà quando noi non ci saremo."],
perg:"Quale preoccupazione per il futuro dei miei figli pesa di più sul mio cuore?",
des:"Scrivi una lettera a ogni figlio (o una sola per tutti) sui tuoi sogni per loro e sulla certezza che Dio li accompagna. Conservala per dargliela in un momento speciale.",
ora:"Signore, tu hai progetti di pace per i miei figli. Ti affido il loro futuro e confido nel tuo amore. Amen."},

{t:"Il figlio che si è allontanato",ref:"Lc 15,11-24",v:"Quando era ancora lontano il padre lo vide e commosso gli corse incontro, gli si gettò al collo e lo baciò.",
exp:"Un figlio chiede al padre la sua parte di eredità e se ne va, sperperando tutto in una vita senza meta. Quando tocca il fondo, rientra in sé e decide di tornare. Il padre, che lo aspettava ogni giorno, lo vede da lontano, corre, lo abbraccia e fa festa. Non gli rinfaccia nulla: è solo felice che il figlio sia tornato.",
med:["Se uno dei tuoi figli si è allontanato dalla fede, da casa o da te, non perdere la speranza. Il padre della parabola non costrinse il figlio a tornare, ma lo aspettò con la porta aperta e il cuore pronto.","Se i tuoi figli sono ancora piccoli, prega perché, quando sbaglieranno, sappiano di poter sempre tornare. La porta di casa e quella di Dio sono aperte."],
perg:"Uno dei miei figli è lontano (da Dio, da casa o da me)? Com’è la porta del mio cuore verso di lui?",
des:"Recita oggi una decina del Rosario per il figlio che ha più bisogno di Dio. Se è lontano, mandagli un messaggio semplice e affettuoso, senza pretese. Se i tuoi figli sono piccoli, di’ loro: «Qualunque cosa succeda, puoi sempre tornare da me».",
ora:"Padre misericordioso, riporta a casa i figli che si sono allontanati. Donami un cuore che aspetta con amore e una porta sempre aperta. Amen."},

{t:"Figli riconoscenti",ref:"Lc 17,11-19",v:"Non sono stati guariti tutti e dieci? E gli altri nove dove sono?",
exp:"Dieci lebbrosi chiedono a Gesù di avere pietà di loro. Gesù dice loro di andare a presentarsi ai sacerdoti e, lungo la strada, guariscono tutti. Solo uno, un samaritano, torna lodando Dio e si getta ai piedi di Gesù per ringraziarlo. Gesù chiede dove siano gli altri nove.",
med:["La gratitudine si insegna praticandola. Un bambino riconoscente è più felice, più generoso e si lamenta meno. E si accorge che tutto ciò che ha è un dono.","Spesso diamo tutto ai figli e dimentichiamo di insegnare loro a dire grazie: a Dio, ai nonni, alla maestra, a chi prepara da mangiare."],
perg:"I miei figli sono abituati a dire grazie? Io ringrazio davanti a loro?",
des:"Stasera a cena, ognuno in famiglia dice tre cose per cui ringrazia Dio. Aiuta i tuoi figli a scrivere un biglietto di ringraziamento per qualcuno (la nonna, la maestra, la catechista).",
ora:"Signore, insegna ai miei figli a tornare a ringraziare, come il samaritano. Che la nostra casa sia piena di gratitudine. Amen."},

{t:"I sacramenti nella vita dei figli",ref:"Mc 10,13-16",v:"Lasciate che i bambini vengano a me e non glielo impedite, perché a chi è come loro appartiene il regno di Dio.",
exp:"Alcune persone portano dei bambini a Gesù perché li tocchi, ma i discepoli le rimproverano. Gesù si indigna e dice di lasciare che i bambini vengano a lui. Poi li abbraccia, impone loro le mani e li benedice.",
med:["I sacramenti sono incontri veri con Gesù: il Battesimo, la Confessione, l’Eucaristia, la Cresima. Portarvi i nostri figli è fare ciò che fecero quelle mamme: portare i bambini da Gesù perché lui li tocchi.","A volte, nella fretta, il catechismo diventa solo un impegno in più in agenda. Fa’ che i tuoi figli vedano che la Messa e i sacramenti sono importanti anche per te."],
perg:"A che punto è ciascuno dei miei figli nella vita sacramentale? C’è qualcosa di rimandato o dimenticato?",
des:"Verifica che ogni figlio sia al passo con i sacramenti e con il catechismo della sua età. Questa domenica andate insieme a Messa e, all’uscita, parlate di ciò che vi ha colpito.",
ora:"Gesù, ti porto i miei figli. Toccali attraverso i sacramenti e benedicili con le tue mani. Amen."},

{t:"Io, mamma, come esempio",ref:"Dt 6,4-9",v:"Questi precetti che oggi ti dò, ti stiano fissi nel cuore; li ripeterai ai tuoi figli…",
exp:"Mosè insegna al popolo la preghiera più importante d’Israele, che lo chiama ad ascoltare che il Signore è l’unico Signore e ad amarlo con tutto il cuore. E chiede che queste parole vengano insegnate ai figli in ogni momento: seduti in casa, camminando per strada, quando ci si corica e quando ci si alza.",
med:["I figli imparano molto più da ciò che vedono che da ciò che ci sentono dire. Osservano come la mamma reagisce allo stress, come parla del marito, come prega, come tratta chi la serve.","Non è un peso in più, ma un incoraggiamento: non devi essere perfetta, devi essere vera. Quando sbagli, chiedi scusa ai tuoi figli. Anche questo insegna."],
perg:"Che esempio sto dando senza accorgermene? Che cosa vorrei che i miei figli imparassero da me?",
des:"Oggi scegli un momento qualunque (in macchina, durante il bagnetto, a letto) per parlare di Dio ai tuoi figli in modo semplice, proprio come chiede Mosè. Se di recente hai sbagliato con uno di loro, chiedigli scusa.",
ora:"Signore, che la mia vita sia un esempio di fede per i miei figli. Perdona i miei sbagli e usa anche quelli per insegnare loro. Amen."},

{t:"Consacrare i miei figli alla Madonna",ref:"Gv 19,25-27",v:"Donna, ecco il tuo figlio! … Ecco la tua madre!",
exp:"Ai piedi della croce c’erano Maria e il discepolo amato, Giovanni. Prima di morire, Gesù affida Maria a Giovanni come madre e Giovanni a Maria come figlio. E da quell’ora il discepolo la accolse con sé. La Chiesa comprende che lì Gesù ci ha donato Maria come madre di tutti noi.",
med:["Nessuno capisce il cuore di una mamma meglio di Maria. Ha visto suo figlio crescere, perdersi, essere incompreso e soffrire. E rimase in piedi, fiduciosa.","Consacrare i figli alla Madonna è metterli sotto il manto di una Madre che non delude mai. Dopo questi 21 giorni, affida a lei la cura di tutto ciò per cui hai pregato."],
perg:"Che cosa è cambiato nel mio cuore di mamma in questi 21 giorni?",
des:"Riunisci i tuoi figli davanti a un’immagine della Madonna e recitate insieme un’Ave Maria e la preghiera di consacrazione di oggi. Se potete, offrite un fiore a Maria.",
ora:"O Maria, Madre mia, ti consacro i miei figli. Coprili con il tuo manto, custodiscili dal male e conducili sempre a Gesù. Sono tuoi. Amen."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="filhos21"){PLANOS[i].d=D;PLANOS[i].resumo="Tre settimane per avvolgere i tuoi figli nella preghiera: fede, protezione, salute, amicizie, emozioni, futuro e vocazione. Ogni giorno trovi una lettura spiegata, una meditazione, uno spazio per scrivere e una sfida da vivere con loro.";}}
})();

// 30 giorni di preghiera in gravidanza: versione completa
(function(){
var D=[
{t:"Una nuova vita in me",ref:"Sal 139,13-16",v:"Sei tu che hai creato le mie viscere e mi hai tessuto nel seno di mia madre.",
exp:"Il salmista contempla con stupore l’opera di Dio: è stato lui a formare ogni parte del suo essere, nel grembo della madre, nel segreto. Gli occhi di Dio vedevano l’embrione, e tutti i giorni della sua vita erano già scritti nel libro di Dio.",
med:["In questo momento Dio sta tessendo una vita dentro di te. Ogni battito del cuore, ogni ditino, ogni lineamento del viso del tuo bambino prende forma tra le sue mani.","Stai partecipando all’opera più bella della creazione. Che questi 30 giorni siano un tempo per contemplare, ringraziare e affidare questa vita nelle mani di chi la sta tessendo."],
perg:"Che cosa provo pensando che Dio sta tessendo il mio bambino proprio adesso?",
des:"Metti le mani sul pancione, leggi ad alta voce al tuo bambino il Salmo 139,13-16 e ringrazia Dio per la sua vita.",
ora:"Signore, grazie per la vita che stai tessendo in me. Prenditi cura di ogni dettaglio del mio bambino. È tuo. Amen."},

{t:"Un dono di Dio",ref:"Sal 127,3-5",v:"Ecco, dono del Signore sono i figli, è sua grazia il frutto del grembo.",
exp:"Questo salmo ricorda che tutto ciò che costruiamo dipende da Dio. E presenta i figli come eredità e dono del Signore, come frecce in mano a un guerriero: una benedizione che rende forte la famiglia.",
med:["Ogni figlio è un dono, anche quando arriva in un momento inatteso o quando la gravidanza porta paura e insicurezza. Dio ti ha affidato una vita unica.","Accogliere il figlio come un dono cambia lo sguardo: non è un peso né un problema da risolvere, è un regalo da accogliere e per cui ringraziare."],
perg:"Come ho accolto la notizia di questa gravidanza? Riesco a vedere questo bambino come un dono di Dio?",
des:"Scrivi un elenco di motivi per cui ringraziare di questa gravidanza. Leggilo al papà del bambino o a una persona cara.",
ora:"Signore, grazie per il dono di questo figlio. Fa’ che lo accolga con gioia e gratitudine ogni giorno. Amen."},

{t:"Anche Maria ha atteso",ref:"Lc 1,26-33",v:"concepirai un figlio, lo darai alla luce e lo chiamerai Gesù.",
exp:"L’angelo Gabriele visita una giovane di Nazaret di nome Maria e le annuncia che concepirà e darà alla luce un figlio, il Figlio dell’Altissimo, il cui regno non avrà fine. Maria, piena di grazia, accoglie la notizia che le cambierà la vita.",
med:["Anche la Madonna ha vissuto una gravidanza: il corpo che cambia, i dubbi, le nausee, l’attesa, il viaggio verso Betlemme alla fine della gravidanza. Lei capisce quello che provi.","Maria custodiva tutto nel suo cuore. Puoi parlarle di ogni fase, come una figlia parla con la sua mamma."],
perg:"Quale sentimento della mia gravidanza vorrei confidare alla Madonna?",
des:"Prega oggi una decina del Rosario meditando il primo mistero gaudioso (l’Annunciazione) e affida a Maria la tua gravidanza.",
ora:"Maria, che hai atteso Gesù, accompagna la mia gravidanza. Insegnami a custodire tutto nel cuore come te. Amen."},

{t:"Il bambino che sussultò di gioia",ref:"Lc 1,39-45",v:"Appena Elisabetta ebbe udito il saluto di Maria, il bambino le sussultò nel grembo.",
exp:"Maria, incinta di Gesù, va a trovare la cugina Elisabetta, incinta di Giovanni. Quando Maria arriva e la saluta, il piccolo Giovanni sussulta di gioia nel grembo della mamma. Elisabetta, piena di Spirito Santo, riconosce la presenza del Signore.",
med:["Il bambino di Elisabetta ha riconosciuto Gesù prima di nascere. La Bibbia mostra che la vita nel grembo è già vita piena, capace di sentire e di gioire.","Anche il tuo bambino sente la tua voce, le tue carezze, la tua pace. La tua preghiera tocca già la sua vita."],
perg:"Come immagino che il mio bambino reagisca alla mia voce e alle mie carezze?",
des:"Parla oggi con il tuo bambino: raccontagli la tua giornata, cantagli una canzone, recita un’Ave Maria ad alta voce con la mano sul pancione.",
ora:"Signore, fa’ che il mio bambino gioisca della tua presenza fin da ora, come Giovanni gioì nel grembo di Elisabetta. Amen."},

{t:"Le paure della gravidanza",ref:"Is 41,10-13",v:"Non temere, perché io sono con te; non smarrirti, perché io sono il tuo Dio.",
exp:"Dio parla al suo popolo con tenerezza: non avere paura, io sono con te, ti rendo forte, ti aiuto, ti sostengo. E gli promette che lo terrà per la mano destra.",
med:["È normale avere paure in gravidanza: per la salute del bambino, per il parto, di non farcela, per i cambiamenti nella tua vita. La paura non è mancanza di fede: è segno che ami.","Dio non ti chiede di non provare paura: ti dice di non temere, perché lui è con te. Ti tiene per mano a ogni passo."],
perg:"Qual è la mia paura più grande in questa gravidanza?",
des:"Scrivi le tue paure su un foglio. Poi, accanto a ciascuna, scrivi: «Dio è con me». Prega affidandogliele una per una.",
ora:"Signore, tu mi tieni per mano. Accogli le mie paure e donami la tua pace. Amen."},

{t:"Il corpo che cambia",ref:"2Cor 4,7.16-18",v:"Però noi abbiamo questo tesoro in vasi di creta",
exp:"San Paolo dice che portiamo un tesoro, la vita di Dio, in fragili vasi di creta. Per questo non ci scoraggiamo: anche se il nostro corpo si consuma, dentro di noi ci rinnoviamo di giorno in giorno.",
med:["Il tuo corpo sta cambiando tanto: il peso, la pelle, la stanchezza, le forme. A volte è difficile guardarsi allo specchio. Ma questo fragile vaso sta portando un tesoro.","Ogni smagliatura, ogni chilo, ogni mal di schiena fa parte dell’opera di dare la vita. Il tuo corpo sta facendo qualcosa di straordinario."],
perg:"Come ho guardato il mio corpo in questa gravidanza?",
des:"Guardati allo specchio oggi e, invece di criticarti, ringrazia Dio per quello che il tuo corpo sta facendo. Scatta una foto al pancione da conservare.",
ora:"Signore, grazie per il mio corpo, che porta il tesoro della vita. Insegnami a guardarlo con gratitudine. Amen."},

{t:"Nei giorni di nausea e stanchezza",ref:"2Cor 12,7-10",v:"Ti basta la mia grazia; la mia potenza infatti si manifesta pienamente nella debolezza",
exp:"San Paolo racconta di aver chiesto tre volte a Dio di liberarlo da una sofferenza che chiamava una spina nella carne. Dio gli rispose che la sua grazia gli bastava. E Paolo capì che proprio nella debolezza diventava forte.",
med:["Ci sono giorni in cui la gravidanza pesa: nausea, stanchezza, dolori, notti in bianco. In quei giorni non devi essere forte. La grazia di Dio ti basta.","Offri a Dio i tuoi fastidi per il tuo bambino. È un modo antico e bello di pregare: trasformare la stanchezza in amore."],
perg:"Che cosa pesa di più sul mio corpo in questi giorni? Lo offro a Dio?",
des:"Oggi, a ogni fastidio, fai una breve preghiera: «Gesù, te lo offro per il mio bambino». E riposa senza sensi di colpa ogni volta che puoi.",
ora:"Signore, la tua grazia mi basta. Nei giorni di stanchezza sii tu la mia forza. Ti offro ogni fastidio per il mio bambino. Amen."},

{t:"Chiamato fin dal grembo",ref:"Is 49,1-5",v:"il Signore dal seno materno mi ha chiamato, fino dal grembo di mia madre ha pronunziato il mio nome.",
exp:"Il profeta parla della sua vocazione: prima che nascesse, Dio lo aveva già chiamato e aveva pronunciato il suo nome. Lo aveva preparato come una freccia nascosta, per una missione. Anche quando pensava di faticare invano, sapeva che la sua ricompensa era presso Dio.",
med:["Dio conosce già il nome del tuo bambino, conosce il suo carattere e ha per lui una missione nel mondo. Prima che tu lo conosca, Dio lo ha già chiamato.","La tua missione di mamma è aiutare questo figlio a scoprire la chiamata di Dio. E comincia adesso, con la preghiera."],
perg:"Che cosa chiedo a Dio per la vita e la missione di mio figlio?",
des:"Scrivi una preghiera per la vocazione del tuo bambino e conservala, per leggergliela quando sarà grande.",
ora:"Signore, tu hai chiamato mio figlio fin dal grembo. Preparalo alla missione che hai per lui. Amen."},

{t:"Benedire il pancione",ref:"Nm 6,22-27",v:"Ti benedica il Signore e ti protegga. Il Signore faccia brillare il suo volto su di te",
exp:"Dio insegna a Mosè la benedizione che i sacerdoti devono dare al popolo: che il Signore lo benedica e lo custodisca, faccia risplendere il suo volto, gli faccia grazia e gli doni la pace. È una delle benedizioni più antiche della Bibbia.",
med:["La benedizione della mamma comincia prima della nascita. Benedire il bambino è desiderare per lui ogni bene, nel nome di Dio.","Esiste anche una benedizione della Chiesa per la mamma in attesa, che il sacerdote può impartire. Chiedi nella tua parrocchia."],
perg:"Quali benedizioni desidero per il mio bambino?",
des:"Fai il segno della croce sul pancione e prega per il tuo bambino la benedizione del libro dei Numeri. Chiedi al papà del bambino di fare lo stesso. Se puoi, chiedi la benedizione a un sacerdote.",
ora:"Signore, benedici e custodisci il mio bambino. Fa’ risplendere su di lui il tuo volto e donagli la tua pace. Amen."},

{t:"Il papà del bambino",ref:"Mt 1,18-24",v:"fece come gli aveva ordinato l'angelo del Signore e prese con sé la sua sposa…",
exp:"Giuseppe scopre che Maria è incinta e pensa di lasciarla in segreto. In sogno l’angelo gli spiega che il bambino viene dallo Spirito Santo e gli dice di non avere paura di prendere Maria con sé. Giuseppe si sveglia e fa esattamente ciò che l’angelo ha detto: accoglie Maria e il bambino.",
med:["Giuseppe ha accolto Maria e Gesù con amore e coraggio, anche senza capire tutto. Anche lui ha avuto paura e ha dovuto fidarsi.","Anche il papà del tuo bambino sta vivendo questa gravidanza, a modo suo. A volte gli uomini diventano più silenziosi, ma anche loro provano paura e preoccupazione."],
perg:"Come sta vivendo questa gravidanza il papà del bambino? Lo sto coinvolgendo?",
des:"Invita il papà del bambino a sentire i movimenti, a venire con te a una visita o a scegliere insieme qualcosa del corredino. Pregate insieme per lui e per la sua missione di papà.",
ora:"San Giuseppe, custode della Santa Famiglia, proteggi il papà del mio bambino. Donagli coraggio, fede e un cuore accogliente. Amen."},

{t:"Preparare la casa",ref:"Pr 31,10-12.25-30",v:"la donna che teme Dio è da lodare.",
exp:"Il libro dei Proverbi si chiude con un elogio della donna saggia e forte: si prende cura della casa con dedizione, lavora con le proprie mani, apre la mano al povero, parla con saggezza e teme il Signore. Sorride al futuro, perché si fida.",
med:["Sistemare la cameretta, il corredino e la routine è anche preghiera, se lo fai con amore. Ogni tutina piegata può essere accompagnata da una preghiera.","Non serve che sia tutto perfetto né costoso. Il bambino ha bisogno di amore, di braccia e di cure, molto più che di decorazioni."],
perg:"Che cosa mi preoccupa ancora nel preparare la casa per il bambino?",
des:"Mentre oggi sistemi qualcosa per il bambino (i vestitini, la cameretta, la borsa per l’ospedale), recita un’Ave Maria per ogni capo o per ogni angolo.",
ora:"Signore, benedici la nostra casa che si prepara ad accogliere questo bambino. Che sia piena di amore e di pace. Amen."},

{t:"I fratelli maggiori",ref:"Sal 133,1",v:"Ecco quanto è buono e quanto è soave che i fratelli vivano insieme!",
exp:"Questo breve salmo celebra la gioia dell’unità tra fratelli. La paragona a un profumo prezioso versato e alla rugiada che scende sui monti. È lì che Dio dona la sua benedizione e la vita.",
med:["Se hai già dei figli, anche loro stanno vivendo questa gravidanza: con gioia, curiosità e, a volte, con gelosia e paura di perdere il loro posto.","Coinvolgere i fratelli nell’attesa aiuta a preparare il loro cuore. Se questo è il tuo primo figlio, prega per i cugini, per la famiglia e per i fratellini che potranno arrivare."],
perg:"Come stanno vivendo l’arrivo del bambino i fratelli maggiori (o la famiglia)?",
des:"Fai partecipare i fratelli: parlare al pancione, scegliere una tutina, fare un disegno per il bambino. Di’ a ciascuno che l’amore della mamma non diminuisce, anzi cresce.",
ora:"Signore, unisci i miei figli nell’amore fin da ora. Prepara il cuore di ciascuno ad accogliere il nuovo fratellino. Amen."},

{t:"Esami e visite",ref:"Is 26,3-4",v:"Il suo animo è saldo; tu gli assicurerai la pace, pace perché in te ha fiducia.",
exp:"Isaia canta la fiducia nel Signore, che è la roccia eterna. Chi si appoggia a lui con fermezza è custodito nella pace. Per questo invita tutti a confidare sempre nel Signore.",
med:["Ogni esame può portare ansia: l’ecografia, le analisi del sangue, l’attesa dei risultati. È naturale che il cuore si stringa.","Porta Dio con te a ogni visita. Prega prima di entrare, durante l’esame e mentre aspetti il risultato. La pace nasce dall’appoggiarsi a lui."],
perg:"Quale esame o risultato mi sta mettendo in ansia?",
des:"Prima della prossima visita o del prossimo esame, prega con Is 26,3-4. Prega anche per i medici e per chi si prende cura di te.",
ora:"Signore, custodiscimi nella pace. In ogni esame e in ogni visita mi appoggio a te e mi affido alle tue cure. Amen."},

{t:"Ansia e pace",ref:"Fil 4,4-9",v:"Non angustiatevi per nulla … la pace di Dio, che sorpassa ogni intelligenza, custodirà i vostri cuori",
exp:"San Paolo chiede ai cristiani di essere sempre lieti nel Signore e di presentare a Dio ogni richiesta, con preghiere e ringraziamenti. Promette che la pace di Dio custodirà il loro cuore. E consiglia di riempire la mente di tutto ciò che è vero, buono e bello.",
med:["L’ansia in gravidanza è comune: che cosa può andare storto, che cosa ci aspetta. E internet a volte aumenta la paura con troppe informazioni.","Paolo indica una strada: affidare tutto nella preghiera e nutrire i pensieri con ciò che è buono. Scegli bene che cosa leggi e ascolti in questi mesi."],
perg:"Che cosa sta alimentando la mia ansia? Che cosa posso sostituire con cose buone?",
des:"Oggi fai un «digiuno di ricerche» su internet riguardo alla gravidanza. Al loro posto, leggi un salmo o ascolta una canzone che ti porti pace.",
ora:"Signore, accogli la mia ansia. Custodisci il mio cuore e i miei pensieri nella tua pace. Amen."},

{t:"Scegliere il nome",ref:"Is 43,1-4",v:"ti ho chiamato per nome: tu mi appartieni. … Perché tu sei prezioso ai miei occhi",
exp:"Dio dice al suo popolo di non temere, perché lo ha riscattato e lo ha chiamato per nome: gli appartiene. Promette di stargli accanto nelle acque e nel fuoco, e dice che il suo popolo è prezioso e amato.",
med:["Il nome è il primo regalo che facciamo a un figlio. Dio chiama ciascuno per nome, con un amore personale. Anche Dio pronuncerà il nome del tuo bambino.","Molte famiglie cattoliche scelgono il nome di un santo, che diventa per il bambino patrono e modello."],
perg:"Che cosa desidero che il suo nome significhi per mio figlio?",
des:"Cerca il significato del nome scelto (o dei nomi a cui state pensando) e se c’è un santo con quel nome. Prega chiedendo la protezione di quel santo.",
ora:"Signore, tu chiami ciascuno per nome. Benedici il nome di mio figlio e rendilo prezioso ai tuoi occhi. Amen."},

{t:"Riposare in Dio",ref:"Sal 23,1-2",v:"Il Signore è il mio pastore: non manco di nulla; su pascoli erbosi mi fa riposare",
exp:"Nel salmo più conosciuto della Bibbia, Davide descrive Dio come un pastore che si prende cura delle sue pecore: le conduce su pascoli verdi e ad acque tranquille, le guida per il giusto cammino ed è con loro anche nella valle oscura.",
med:["Riposare fa parte del prendersi cura del bambino. È Dio stesso che ci fa riposare. Non è pigrizia né debolezza.","In gravidanza il corpo chiede più riposo. Ascolta il tuo corpo e lasciati condurre dal Buon Pastore verso acque tranquille."],
perg:"Mi concedo di riposare? Oppure mi sento in colpa quando mi fermo?",
des:"Oggi prenditi un vero momento di riposo: sdraiati, metti i piedi in alto e prega lentamente il Salmo 23.",
ora:"Signore, mio Pastore, fammi riposare. Con te non manca nulla, né a me né al mio bambino. Amen."},

{t:"La Madonna del Parto",ref:"Lc 2,1-7",v:"Ora, mentre si trovavano in quel luogo, si compirono per lei i giorni del parto. Diede alla luce il suo figlio primogenito",
exp:"A causa di un censimento, Giuseppe e Maria, ormai alla fine della gravidanza, partono da Nazaret per Betlemme. Lì arrivano per lei i giorni del parto. Non c’era posto per loro nell’alloggio, e Maria dà alla luce Gesù, lo avvolge in fasce e lo depone in una mangiatoia.",
med:["Maria ha partorito lontano da casa, in un luogo semplice, senza le comodità che aveva immaginato. Lei capisce le incertezze del parto.","La Madonna del Parto è una devozione antica delle mamme in attesa. Chiedono a Maria di accompagnarle nel momento della nascita, come una mamma accompagna la figlia."],
perg:"Che cosa vorrei chiedere alla Madonna per il mio parto?",
des:"Recita oggi la preghiera alla Madonna del Parto (oppure una decina del Rosario meditando la nascita di Gesù), affidandole il tuo parto.",
ora:"Madonna del Parto, accompagnami nell’ora in cui nascerà il mio bambino. Coprici con il tuo manto. Amen."},

{t:"Vita in abbondanza",ref:"Gv 10,10-11",v:"io sono venuto perché abbiano la vita e l'abbiano in abbondanza.",
exp:"Gesù si presenta come il Buon Pastore. Dice che il ladro viene per rubare e distruggere, ma lui è venuto a portare la vita, e la vita in abbondanza. Il buon pastore dà la vita per le sue pecore.",
med:["Santa Gianna Beretta Molla era medico, sposa e mamma. Durante la sua ultima gravidanza scoprì di avere una malattia grave e scelse di proteggere la vita della sua bambina. È un esempio di amore generoso per la vita.","Gesù è venuto a portare la vita in abbondanza. La gravidanza è partecipare a quest’opera di Dio: donare la vita, prendersene cura, difenderla."],
perg:"Che cosa significa per me desiderare per mio figlio una vita in abbondanza?",
des:"Leggi qualcosa su Santa Gianna e prega chiedendo la sua intercessione per la tua gravidanza e per tutte le mamme in attesa.",
ora:"Santa Gianna, intercedi per me e per il mio bambino. Gesù, donaci la vita in abbondanza. Amen."},

{t:"Di generazione in generazione",ref:"Lc 1,46-50",v:"di generazione in generazione la sua misericordia si stende su quelli che lo temono.",
exp:"Incinta di Gesù, Maria canta il Magnificat nella casa di Elisabetta. Loda Dio, che ha guardato la sua piccolezza e ha fatto in lei grandi cose. E proclama che la misericordia di Dio passa di generazione in generazione.",
med:["Il tuo bambino è una nuova generazione della tua famiglia. La misericordia di Dio che ha raggiunto i tuoi nonni e i tuoi genitori ora raggiunge tuo figlio.","San Gerardo Maiella, religioso redentorista, è molto amato e invocato come patrono delle mamme in attesa. Chiedigli di intercedere per la nuova generazione che sta arrivando."],
perg:"Quale eredità di fede voglio lasciare a mio figlio?",
des:"Prega oggi il Magnificat (Lc 1,46-55) e chiedi l’intercessione di San Gerardo Maiella per il tuo bambino.",
ora:"San Gerardo Maiella, patrono delle mamme in attesa, prega per noi. Signore, la tua misericordia raggiunga mio figlio. Amen."},

{t:"Pensando al Battesimo",ref:"Gv 3,1-6",v:"se uno non nasce da acqua e da Spirito, non può entrare nel regno di Dio.",
exp:"Nicodemo, un fariseo, va da Gesù di notte. Gesù gli dice che bisogna nascere di nuovo. Nicodemo non capisce: come si può rientrare nel grembo della madre? Gesù spiega che si tratta di nascere da acqua e da Spirito.",
med:["Il tuo bambino nascerà due volte: dal tuo grembo e, nel Battesimo, da acqua e Spirito, come figlio di Dio. Il Battesimo sarà il suo primo grande incontro con Gesù.","Pensare al Battesimo fin da ora aiuta a prepararlo con amore: scegliere bene il padrino e la madrina, la parrocchia, la data."],
perg:"Quali padrini desidero per mio figlio? Persone che lo aiuteranno nella fede?",
des:"Parla con il papà del bambino del Battesimo: la parrocchia, i possibili padrini e la data. Prega per i futuri padrini.",
ora:"Signore, prepara mio figlio a nascere da acqua e da Spirito. Che sia tuo figlio amato fin dal Battesimo. Amen."},

{t:"Parlare al bambino",ref:"Sal 145,1-7",v:"Una generazione narra all'altra le tue opere, annunzia le tue meraviglie.",
exp:"Il salmista promette di lodare Dio ogni giorno e dice che ogni generazione racconta alla successiva le meraviglie di Dio. La fede passa dai genitori ai figli attraverso i racconti, i canti e la preghiera.",
med:["Il bambino sente già la tua voce nel grembo e ne riconosce il tono. Le tue parole, i tuoi canti e le tue preghiere arrivano già fino a lui.","Raccontare al bambino le meraviglie di Dio fin da ora è cominciare a trasmettere la fede. È la sua prima catechesi, fatta con amore."],
perg:"Che cosa vorrei raccontare al mio bambino su Dio?",
des:"Oggi canta al bambino un canto religioso o raccontagli una storia della Bibbia, con la mano sul pancione.",
ora:"Signore, fa’ che mio figlio senta parlare di te fin dal grembo. Che la nostra famiglia annunci le tue meraviglie. Amen."},

{t:"Prendermi cura di me con amore",ref:"3Gv 2",v:"Carissimo, faccio voti che tutto vada bene e che tu sia in buona salute, come va bene per la tua anima.",
exp:"L’apostolo Giovanni scrive a un amico, Gaio, e comincia augurandogli di stare bene nel corpo, come già sta bene nell’anima. E dice che la sua gioia più grande è sapere che i suoi figli spirituali camminano nella verità.",
med:["Mangiare bene, bere acqua, dormire, fare i controlli della gravidanza, camminare: anche tutto questo è amore per il bambino. Prenderti cura di te è prenderti cura di lui.","Dio desidera la tua salute nel corpo e nell’anima. Non dimenticare l’anima: la preghiera, i sacramenti, un po’ di silenzio."],
perg:"Come mi sto prendendo cura del mio corpo e della mia anima in questa gravidanza?",
des:"Scegli oggi una cura per il corpo (un pasto sano, più acqua, una passeggiata) e una per l’anima (la Messa, la Confessione, un momento di preghiera).",
ora:"Signore, aiutami a prendermi cura del mio corpo e della mia anima, per me e per il mio bambino. Amen."},

{t:"Una rete di sostegno",ref:"Lc 1,39-45.56",v:"Maria rimase con lei circa tre mesi",
exp:"Subito dopo l’annuncio dell’angelo, Maria va in fretta a casa di Elisabetta, anche lei incinta. Le due si incontrano, gioiscono, pregano insieme. Maria resta con Elisabetta circa tre mesi, fin quasi alla nascita di Giovanni.",
med:["Maria ed Elisabetta si sono sostenute a vicenda in gravidanza. Nessuna donna è fatta per vivere questo tempo da sola.","Una rete di sostegno (famiglia, amiche, comunità) fa una grande differenza in gravidanza e dopo il parto. Non vergognarti di chiedere aiuto e di accettarlo."],
perg:"Chi fa parte della mia rete di sostegno? Chi altro potrei chiamare?",
des:"Parla con una persona di fiducia di come potrà aiutarti dopo la nascita del bambino. Ringrazia chi ti sta già sostenendo.",
ora:"Signore, grazie per le persone che mi sostengono. Metti sul mio cammino delle «Elisabetta» che camminino con me. Amen."},

{t:"Fiducia nel parto",ref:"Gv 16,20-22",v:"La donna, quando partorisce, è afflitta, perché è giunta la sua ora; ma quando ha dato alla luce il bambino, non si ricorda più dell'afflizione",
exp:"Nell’Ultima Cena Gesù prepara i discepoli alla sua morte e risurrezione. Per spiegare che la loro tristezza si trasformerà in gioia, usa l’immagine del parto: il dolore c’è, ma la gioia di una vita nuova è più grande.",
med:["Gesù ha usato il parto come immagine di speranza. Conosce il dolore del parto e la gioia che viene dopo.","La paura del parto è naturale. Affida a Dio il momento della nascita: il tipo di parto, l’équipe, il giorno e l’ora. Lui sarà con te."],
perg:"Come immagino il momento del parto? Che cosa affido oggi a Dio?",
des:"Scrivi una preghiera da recitare il giorno del parto e mettila nella borsa per l’ospedale. Chiedi a una persona di fiducia di pregare per te quel giorno.",
ora:"Gesù, tu conosci il dolore e la gioia della nascita. Resta con me nell’ora del parto e trasforma ogni angoscia in gioia. Amen."},

{t:"L’équipe che si prenderà cura di noi",ref:"Sir 38,1-4.12-14",v:"Onora il medico come si deve secondo il bisogno, anch'egli è stato creato dal Signore.",
exp:"Il libro del Siracide insegna a stimare i medici e a essere loro riconoscenti, perché la loro scienza viene da Dio. Dice che il Signore ha fatto produrre alla terra i medicinali e che anche il medico prega Dio per fare la diagnosi giusta e trovare la cura.",
med:["Medici, ostetriche, infermiere, doule e tutta l’équipe sono strumenti di Dio. La fede e la medicina camminano insieme.","Pregare per l’équipe che si prenderà cura di te e del bambino è un atto di fiducia e di carità. Anche loro hanno bisogno di saggezza e di pace."],
perg:"Mi fido dell’équipe che mi segue? Prego per loro?",
des:"Prega oggi, per nome (se lo conosci), per ogni professionista che segue la tua gravidanza e che sarà presente al parto.",
ora:"Signore, benedici i medici e tutta l’équipe che si prende cura di me e del mio bambino. Dona loro saggezza, attenzione e pace. Amen."},

{t:"Per le altre mamme in attesa",ref:"Gal 6,2-10",v:"Portate i pesi gli uni degli altri",
exp:"San Paolo chiede ai cristiani di aiutarsi a vicenda a portare i pesi. E incoraggia: non stanchiamoci di fare il bene, perché a suo tempo raccoglieremo. Finché ne abbiamo l’occasione, facciamo il bene a tutti.",
med:["In questo momento tante donne sono incinte: alcune sole, impaurite, senza mezzi o con gravidanze a rischio. Alcune sono tentate di rinunciare.","Pregare per le altre mamme in attesa e aiutarle è un modo per ringraziare della propria gravidanza e per difendere la vita."],
perg:"Conosco una mamma in attesa che ha bisogno di sostegno o di preghiera?",
des:"Prega oggi per tutte le mamme in attesa, soprattutto per quelle sole o impaurite. Se puoi, dona qualcosa a una mamma che ne ha bisogno (vestitini, pannolini).",
ora:"Signore, prenditi cura di tutte le mamme in attesa del mondo, soprattutto di quelle sole o impaurite. Proteggi ogni vita. Amen."},

{t:"Una famiglia che prega",ref:"Sal 128,3",v:"La tua sposa come vite feconda nell'intimità della tua casa; i tuoi figli come virgulti d'ulivo intorno alla tua mensa.",
exp:"Il salmo descrive la benedizione di chi teme Dio: mangiare il frutto del proprio lavoro, una sposa come vite feconda, figli intorno alla tavola come virgulti d’ulivo. È l’immagine di una famiglia benedetta e unita.",
med:["Il bambino arriverà in una casa. Quale casa troverà? Una famiglia che prega insieme dona al figlio radici salde.","Non serve aspettare che il bambino nasca per cominciare: la preghiera in famiglia può iniziare ora, con il bambino ancora nel grembo."],
perg:"Come vorrei che fosse la vita di preghiera della nostra famiglia quando arriverà il bambino?",
des:"Mettiti d’accordo con il papà del bambino (e con gli altri figli, se ci sono) su una semplice preghiera in famiglia, e cominciate oggi, con la mano sul pancione.",
ora:"Signore, che la nostra famiglia sia come una vite feconda e come virgulti d’ulivo intorno alla tavola. Che nostro figlio cresca in una casa che prega. Amen."},

{t:"Affidare la nascita",ref:"Sal 22,10-12",v:"dal grembo di mia madre sei tu il mio Dio. Da me non stare lontano…",
exp:"Nel mezzo di un salmo di grande sofferenza (il salmo che Gesù pregò sulla croce), il salmista ricorda che Dio si è preso cura di lui fin dalla nascita: è stato Dio a trarlo dal grembo materno e a farlo riposare al seno della madre. E lo supplica di non stargli lontano.",
med:["Dio è con il tuo bambino fin dal grembo e sarà con lui alla nascita e per tutta la vita. È già il Dio di tuo figlio.","Affidare la nascita a Dio è fidarsi che lui si prende cura del momento esatto, del modo e di ogni dettaglio."],
perg:"Quale dettaglio della nascita faccio ancora fatica ad affidare a Dio?",
des:"Fai oggi una preghiera di affidamento per la nascita, mettendo nelle mani di Dio la data presunta del parto, il luogo e ogni paura. Scrivila qui.",
ora:"Signore, fin dal grembo tu sei il Dio di mio figlio. Non stare lontano da noi. Ti affido il momento della nascita. Amen."},

{t:"Senza troppe preoccupazioni",ref:"Mt 6,26-30",v:"Guardate gli uccelli del cielo: non seminano, né mietono, né ammassano nei granai; eppure il Padre vostro celeste li nutre.",
exp:"Gesù invita a guardare la natura: gli uccelli non fanno provviste e il Padre li nutre; i gigli non filano, eppure sono vestiti meglio del re Salomone. Se Dio si prende cura così di loro, quanto più di voi, gente di poca fede!",
med:["Il corredino, la borsa per l’ospedale, la cameretta, i conti, il congedo di maternità: la lista delle preoccupazioni sembra non finire mai.","È bene prepararsi, ma senza lasciare che la preoccupazione rubi la gioia dell’attesa. Il Padre che si prende cura degli uccellini si prende cura del tuo bambino."],
perg:"Quale preoccupazione pratica mi sta rubando la pace?",
des:"Fai un elenco di ciò che manca ancora da preparare e dividilo in piccoli compiti. Affida l’elenco a Dio nella preghiera e scegli un solo compito per oggi.",
ora:"Padre, tu ti prendi cura degli uccelli e dei gigli. Prenditi cura anche di noi. Togli da me le preoccupazioni eccessive. Amen."},

{t:"Consacrare il bambino",ref:"Lc 2,22-35",v:"portarono il bambino a Gerusalemme per offrirlo al Signore",
exp:"Quaranta giorni dopo la nascita, Maria e Giuseppe portano Gesù al Tempio per presentarlo a Dio, come prescriveva la Legge. Lì l’anziano Simeone prende il bambino tra le braccia e loda Dio: ora può andarsene in pace, perché ha visto la salvezza.",
med:["Maria e Giuseppe hanno presentato Gesù a Dio. Anche tu puoi farlo con il tuo bambino fin da ora, consacrandolo a Dio e alla Madonna.","Dopo questi 30 giorni, affida tutto: la gravidanza, il parto, la vita di tuo figlio, il tuo cuore di mamma."],
perg:"Che cosa è cambiato nel mio cuore in questi 30 giorni di preghiera?",
des:"Fai una preghiera di consacrazione del bambino a Dio e alla Madonna, con la mano sul pancione, insieme al papà del bambino se possibile. Scrivi qui la data, per raccontarglielo un giorno.",
ora:"Signore, ti presento e ti consacro mio figlio. Maria, coprilo con il tuo manto. È vostro, dal grembo e per sempre. Amen."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="gestacao30"){PLANOS[i].d=D;PLANOS[i].resumo="Per la mamma in attesa: un mese per pregare per il tuo bambino, affidare a Dio le tue paure e preparare il cuore alla nascita. Ogni giorno ci sono una lettura spiegata, una meditazione, uno spazio per scrivere e una piccola sfida.";}}
})();

// 21 giorni per restaurare la mia casa: versione completa
(function(){
var D=[
{t:"Dio è il costruttore della casa",ref:"Sal 127,1-2",v:"Se il Signore non costruisce la casa, invano vi faticano i costruttori.",
exp:"Questo salmo veniva cantato dai pellegrini in cammino verso Gerusalemme. Ricorda che ogni sforzo umano è inutile senza Dio: costruire, vegliare, alzarsi presto e andare a dormire tardi. Dio dà il necessario perfino a chi dorme.",
med:["Quando in casa l’aria si fa pesante, la prima tentazione è sistemare tutto da sola: più regole, più pretese, più stanchezza. Il salmo ci ricorda di cominciare dalle fondamenta.","Restaurare la casa comincia dall’invitare Dio a esserne il costruttore. Tu continui a lavorare, ma smetti di portare l’opera da sola."],
perg:"In quale parte della mia casa ho lavorato da sola, senza lasciare che Dio costruisse?",
des:"Percorri la tua casa, stanza per stanza, e prega un Padre Nostro in ognuna, chiedendo a Dio di essere il costruttore di quel luogo e di chi ci vive.",
ora:"Signore, costruisci tu la mia casa. Senza di te, ogni nostro sforzo è vano. Sii tu il fondamento della nostra famiglia. Amen."},

{t:"Invitare Gesù a entrare",ref:"Lc 19,1-10",v:"Zaccheo, scendi subito, perché oggi devo fermarmi a casa tua.",
exp:"Zaccheo era il capo dei pubblicani, ricco e malvisto dalla gente. Essendo piccolo di statura, sale su un albero per vedere Gesù passare. Gesù si ferma, alza lo sguardo e gli dice che vuole fermarsi a casa sua. Zaccheo lo accoglie pieno di gioia, e la sua vita cambia: restituisce ciò che ha rubato e condivide con i poveri. Gesù annuncia che quel giorno la salvezza è entrata in quella casa.",
med:["Gesù non ha aspettato che la casa di Zaccheo fosse in ordine, né che la sua vita fosse sistemata. Ha voluto entrare proprio lì. Ed è bastato che entrasse perché tutto cominciasse a cambiare.","Anche la tua casa non ha bisogno di essere perfetta perché Gesù entri. Lui vuole stare con voi oggi, così come siete."],
perg:"Quale stanza della mia casa (o della mia vita) mi vergogno di aprire a Gesù?",
des:"Metti un crocifisso o un’immagine di Gesù in un punto ben visibile della casa, dove la famiglia passa ogni giorno. Prega davanti a essa: «Gesù, resta nella nostra casa».",
ora:"Gesù, entra oggi nella mia casa, come sei entrato nella casa di Zaccheo. Che la salvezza raggiunga tutti quelli che abitano qui. Amen."},

{t:"Prima riordinare il cuore",ref:"Sal 51,3-14",v:"Crea in me, o Dio, un cuore puro, rinnova in me uno spirito saldo.",
exp:"Il re Davide scrisse questo salmo dopo aver riconosciuto un peccato grave. Non cerca scuse: chiede misericordia, chiede di essere lavato e purificato. E fa una richiesta bellissima: un cuore nuovo, uno spirito saldo e la gioia della salvezza ritrovata.",
med:["La casa cambia quando cambia il cuore di chi se ne prende cura. È facile vedere che cosa devono cambiare gli altri; è più difficile guardarsi dentro.","Non si tratta di darsi la colpa di tutto, ma di cominciare da dove hai potere: il tuo cuore. Una mamma in pace contagia tutta la casa."],
perg:"Che cosa, nel mio cuore, ha reso più pesante la mia casa?",
des:"Fai oggi un buon esame di coscienza e, se puoi, accostati alla Confessione questa settimana. Annota qui gli orari della tua parrocchia.",
ora:"O Dio, donami un cuore puro. Lavami, rinnovami e restituiscimi la gioia, perché io porti pace nella mia casa. Amen."},

{t:"Perdonare in casa",ref:"Mt 18,21-35",v:"Non ti dico fino a sette, ma fino a settanta volte sette.",
exp:"Pietro chiede a Gesù quante volte deve perdonare: fino a sette volte? Gesù risponde: fino a settanta volte sette, cioè sempre. E racconta la parabola di un servo a cui il re aveva condonato un debito enorme, ma che non volle condonare un piccolo debito a un suo compagno.",
med:["In famiglia feriamo e veniamo feriti ogni giorno, quasi sempre senza volerlo. Senza perdono, la casa diventa un luogo di conti da regolare.","Ricordare quanto Dio ci ha già perdonato aiuta a perdonare gli altri. Il perdono non è un sentimento: è una decisione che si rinnova, fino a settanta volte sette."],
perg:"Chi, in casa mia, non ho ancora perdonato davvero?",
des:"Scegli una persona della famiglia con cui c’è una ferita aperta e fai oggi un passo di riconciliazione: un abbraccio, una richiesta di scuse, una parola gentile. Insegna ai tuoi figli a dire: «Ti perdono».",
ora:"Signore, tu mi hai condonato un debito enorme. Dammi un cuore che sappia perdonare quelli di casa, fino a settanta volte sette. Amen."},

{t:"Parole miti",ref:"Gc 3,2-10",v:"Con essa benediciamo il Signore e Padre e con essa malediciamo gli uomini fatti a somiglianza di Dio. … Non dev'essere così",
exp:"San Giacomo paragona la lingua al morso di un cavallo, al timone di una nave e a una piccola scintilla che incendia un’intera foresta. Una parte così piccola del corpo può guidare tutto verso il bene o verso il male. E avverte che dalla stessa bocca non possono uscire benedizione e maledizione.",
med:["Un tono di voce cambia un’intera conversazione. Il libro dei Proverbi insegna che una risposta gentile calma la collera (Pr 15,1). Tante liti in casa potrebbero finire in pochi minuti con una parola mite.","Fai caso oggi alle parole dette in automatico: urla, ironie, nomignoli, minacce. Sono piccole scintille che, poco a poco, bruciano la casa."],
perg:"Quali mie parole, o quale mio tono di voce, hanno acceso incendi in casa?",
des:"Oggi, quando senti la voglia di urlare, abbassa la voce e avvicinati alla persona per parlarle. Ripeti durante la giornata questa preghiera: «Signore, custodisci la mia bocca».",
ora:"Signore, metti un freno alla mia lingua. Che dalla mia bocca escano solo parole che benedicono la mia famiglia. Amen."},

{t:"Pregare insieme",ref:"At 1,12-14",v:"Tutti questi erano assidui e concordi nella preghiera, insieme con alcune donne e con Maria, la madre di Gesù",
exp:"Dopo che Gesù è salito al cielo, gli apostoli tornano a Gerusalemme e si riuniscono nella stanza al piano superiore. Lì, insieme a Maria e ad alcune donne, pregano uniti, in attesa dello Spirito Santo promesso.",
med:["La Chiesa è nata da una famiglia che pregava insieme con Maria. La preghiera in famiglia è anche ciò che fa scendere lo Spirito Santo dentro la casa.","Non deve essere lunga né perfetta: un Padre Nostro prima di dormire, una benedizione prima dei pasti, un’Ave Maria in macchina. Ciò che conta è la costanza."],
perg:"In quale momento della giornata la mia famiglia potrebbe pregare insieme, anche solo per un minuto?",
des:"Scegliete un momento fisso per pregare insieme (a cena o prima di dormire) e cominciate oggi con un Padre Nostro e un’Ave Maria, tenendovi per mano.",
ora:"Maria, prega con noi come hai pregato con gli apostoli. Che la nostra famiglia perseveri unita nella preghiera. Amen."},

{t:"La pace che Gesù dona",ref:"Gv 14,23-27",v:"Vi lascio la pace, vi do la mia pace. Non come la dà il mondo, io la do a voi.",
exp:"Nell’Ultima Cena, Gesù promette che, se qualcuno lo ama, lui e il Padre verranno ad abitare presso di lui. Promette anche lo Spirito Santo, che insegnerà e ricorderà ogni cosa. E lascia un dono: la sua pace, diversa da quella del mondo. Poi invita i suoi a non lasciarsi turbare il cuore.",
med:["La pace del mondo dipende dal fatto che tutto sia risolto. La pace di Gesù abita nel cuore anche quando ci sono problemi, perché nasce dalla sua presenza.","Una casa in pace non è una casa senza conflitti, ma una casa dove abita Gesù e dove i conflitti trovano una strada."],
perg:"Che cosa ha rubato di più la pace della mia casa?",
des:"Prima di dormire, passa nella stanza di ogni persona della casa e di’ sottovoce (o ad alta voce): «La pace di Gesù sia con te».",
ora:"Gesù, lascia la tua pace nella nostra casa. Abita in noi e calma i nostri cuori. Amen."},

{t:"Una cosa sola è necessaria",ref:"Lc 10,38-42",v:"Marta, Marta, tu ti preoccupi e ti agiti per molte cose, ma una sola è la cosa di cui c'è bisogno.",
exp:"Gesù fa visita a Marta e Maria. Marta è indaffarata in tante faccende per accogliere bene l’ospite; Maria si siede ai piedi di Gesù per ascoltarlo. Marta si lamenta, e Gesù le risponde con tenerezza: lei si agita per molte cose, ma Maria ha scelto la parte migliore.",
med:["Marta non sbagliava a servire; il problema era l’agitazione. Tante case sono così: talmente tante cose da fare che non resta spazio per l’essenziale.","Ordine e semplicità calmano la casa. Meno cose, meno impegni, una routine più semplice. E, in mezzo a tutto, un po’ di tempo ai piedi di Gesù."],
perg:"Per quante cose mi agito ogni giorno? Che cosa potrei semplificare?",
des:"Scegli un angolo della casa che ti crea stress (un cassetto, il tavolo, l’ingresso) e mettilo in ordine oggi. Metti da parte qualcosa che non usi per regalarlo. Poi siediti 5 minuti in silenzio con Gesù.",
ora:"Signore, calma la mia agitazione. Insegnami a scegliere la parte migliore e a semplificare la vita della nostra casa. Amen."},

{t:"La tavola di famiglia",ref:"At 2,42-47",v:"spezzavano il pane a casa prendendo i pasti con letizia e semplicità di cuore",
exp:"San Luca descrive la vita dei primi cristiani: erano perseveranti nell’insegnamento degli apostoli, nella comunione, nello spezzare il pane e nelle preghiere. Condividevano quello che avevano e si riunivano nelle case per mangiare insieme, con gioia e semplicità.",
med:["La tavola è un piccolo altare della famiglia. È lì che si chiacchiera, si ride, ci si racconta la giornata, si prega. Tante famiglie hanno ceduto la tavola alla TV e al cellulare.","Non serve un banchetto: un piatto di pasta mangiato tutti insieme nutre più di qualsiasi piatto consumato da soli sul divano."],
perg:"Quanto spesso la mia famiglia mangia insieme a tavola? Che cosa lo impedisce?",
des:"Oggi fate un pasto tutti insieme a tavola, senza TV e senza cellulari. Pregate prima di mangiare e, durante il pasto, ognuno racconti la parte più bella della sua giornata.",
ora:"Signore, benedici la nostra tavola e rendila un luogo di incontro, di gioia e di semplicità di cuore. Amen."},

{t:"Santificare la domenica",ref:"Es 20,8-11",v:"Ricordati del giorno di sabato per santificarlo…",
exp:"Nei Dieci Comandamenti, Dio chiede al suo popolo di riservare a lui un giorno alla settimana: sei giorni per lavorare e uno per riposare e ricordare che la vita è dono di Dio. Per i cristiani questo giorno è la domenica, il giorno della Risurrezione di Gesù.",
med:["La domenica è un regalo di Dio alla famiglia. Non è solo il giorno della Messa: è il giorno per riposare, per stare insieme, per andare a trovare le persone care, per fare qualcosa di diverso.","Quando la domenica diventa solo un altro giorno di faccende e di schermi, la famiglia perde la sua boccata d’aria settimanale."],
perg:"Com’è stata la domenica della mia famiglia? È diversa dagli altri giorni?",
des:"Organizza la prossima domenica: la Messa in famiglia e un momento speciale insieme (un pranzo, una passeggiata, un gioco). Scrivi qui che cosa farete.",
ora:"Signore, insegnaci a santificare la domenica. Che sia un giorno di incontro con te e di riposo in famiglia. Amen."},

{t:"Guarire le memorie",ref:"Ap 21,1-5",v:"Ecco, io faccio nuove tutte le cose",
exp:"Alla fine della Bibbia, san Giovanni ha una visione: un cielo nuovo, una terra nuova e la nuova Gerusalemme che scende dal cielo, bella come una sposa. Una voce annuncia che Dio abiterà con il suo popolo e asciugherà ogni lacrima, e che non ci sarà più morte né dolore. E Dio dice che fa nuove tutte le cose.",
med:["Alcune ferite della famiglia sono antiche: storie di abbandono, di violenza, di dipendenze, litigi che attraversano le generazioni. Si ripetono senza che ce ne accorgiamo.","Dio vuole guarire la storia della tua famiglia e farne qualcosa di nuovo. Puoi essere tu la persona in cui la ferita si ferma e comincia la guarigione."],
perg:"Quale ferita antica della mia famiglia non voglio trasmettere ai miei figli?",
des:"Scrivi i nomi dei tuoi genitori, dei nonni e degli antenati e prega per loro, chiedendo a Dio di guarire le ferite della storia familiare. Se puoi, fai celebrare una Messa per loro.",
ora:"Signore, tu fai nuove tutte le cose. Guarisci le ferite della mia famiglia e fa’ cominciare in noi una storia nuova. Amen."},

{t:"Benedire la casa",ref:"Nm 6,22-27",v:"Ti benedica il Signore e ti protegga. Il Signore faccia brillare il suo volto su di te e ti sia propizio.",
exp:"Dio insegna a Mosè una benedizione che i sacerdoti devono dare al popolo: che il Signore li benedica e li custodisca, faccia risplendere su di loro il suo volto, faccia loro grazia e doni loro la pace. E promette che, quando invocheranno così il suo nome, lui li benedirà.",
med:["Benedire è augurare il bene nel nome di Dio. Papà e mamme possono e devono benedire i figli e la casa: è un gesto di fede antico e bellissimo.","Una casa benedetta non è libera dai problemi, ma è avvolta dalla protezione e dallo sguardo amorevole di Dio."],
perg:"Ho l’abitudine di benedire la mia famiglia? Di quale benedizione ha più bisogno oggi la mia casa?",
des:"Oggi benedici ogni persona della casa con la benedizione del libro dei Numeri, tracciandole un segno di croce sulla fronte. Se puoi, chiedi a un sacerdote di venire a benedire la casa, oppure percorri le stanze pregando con l’acqua benedetta.",
ora:"Signore, benedicici e custodiscici. Fa’ risplendere il tuo volto sulla nostra famiglia, abbi pietà di noi e donaci la tua pace. Amen."},

{t:"Porte aperte",ref:"Gen 18,1-10",v:"Mio signore, se ho trovato grazia ai tuoi occhi, non passar oltre senza fermarti dal tuo servo.",
exp:"Nel caldo di mezzogiorno, Abramo vede tre uomini vicino alla sua tenda. Corre loro incontro e offre acqua per lavarsi i piedi, riposo e un pasto preparato con amore da Sara. I visitatori erano messaggeri di Dio e annunciano che Sara, ormai anziana, avrà un figlio.",
med:["Una casa restaurata si apre agli altri. La Lettera agli Ebrei ricorda di non dimenticare l’ospitalità, perché grazie a essa alcuni, senza saperlo, hanno accolto degli angeli (Eb 13,2).","Accogliere bene non richiede una casa grande né cibo costoso. Richiede un cuore aperto: un caffè, una chiacchierata, un posto a tavola."],
perg:"La mia casa è un luogo dove le persone si sentono accolte?",
des:"Invita qualcuno per un caffè o un pasto questa settimana: una vicina, una persona che vive sola, una coppia di amici. Prepara tutto con l’amore di Abramo e Sara.",
ora:"Signore, che la nostra casa abbia porte aperte e un cuore accogliente. Che, accogliendo gli altri, io accolga te. Amen."},

{t:"Forza per la stanchezza",ref:"1Re 19,3-8",v:"Su mangia, perché è troppo lungo per te il cammino",
exp:"Il profeta Elia fugge nel deserto, perseguitato e sfinito. Si siede sotto un albero e dice a Dio che non ne può più. Si addormenta. Un angelo lo tocca, gli offre pane e acqua e lo invita ad alzarsi e mangiare. Per due volte. Con la forza di quel cibo, Elia cammina quaranta giorni fino al monte di Dio.",
med:["Restaurare una casa stanca. Tante mamme arrivano allo stesso punto di Elia, quando disse a Dio che non ce la faceva più. Dio non lo ha rimproverato: lo ha lasciato dormire, gli ha dato da mangiare e solo dopo gli ha chiesto di proseguire.","A volte la cosa più spirituale da fare è riposare, mangiare bene e accettare aiuto. E nutrirsi del Pane dell’Eucaristia, che dà forza per il cammino."],
perg:"Di che cosa hanno bisogno oggi il mio corpo e la mia anima per andare avanti?",
des:"Oggi prenditi cura di te: vai a dormire prima, fai un pasto con calma, chiedi aiuto per una faccenda. Se puoi, partecipa a una Messa feriale per ricevere il Pane del cammino.",
ora:"Signore, tu conosci la mia stanchezza. Toccami come hai toccato Elia, nutrimi e dammi forza per il cammino. Amen."},

{t:"Un ponte tra chi litiga",ref:"Gen 13,5-12",v:"Non vi sia discordia tra me e te, tra i miei mandriani e i tuoi, perché noi siamo fratelli.",
exp:"Abram e suo nipote Lot avevano così tante greggi che la terra non bastava per entrambi, e i loro pastori cominciarono a litigare. Abram, il più anziano, avrebbe potuto imporre la sua volontà. Invece propone la pace e lascia che Lot scelga per primo la terra che preferisce.",
med:["Gesù ha chiamato beati gli operatori di pace (Mt 5,9). Spesso la mamma è il ponte tra il marito e i figli, tra i fratelli, tra le famiglie. È una missione bella e faticosa.","Abram ci insegna che, perché ci sia pace, a volte qualcuno deve cedere per primo. Cedere non è perdere: è scegliere la pace."],
perg:"Tra chi, in casa mia, devo essere ponte di pace? Dove posso cedere?",
des:"Se c’è un litigio in sospeso tra persone della casa, aiutale oggi a parlarsi con calma, ognuna ascoltando l’altra. Se il conflitto è tuo, cedi su qualcosa di piccolo per amore della pace.",
ora:"Signore, rendimi strumento della tua pace. Dove nella mia casa c’è divisione, aiutami a portare unità. Amen."},

{t:"Dio provvede alle nostre necessità",ref:"2Re 4,1-7",v:"Va', vendi l'olio e accontenta i tuoi creditori; tu e i tuoi figli vivete con quanto ne resterà",
exp:"Una vedova, piena di debiti, rischia di vedersi portare via i figli come schiavi. Va dal profeta Eliseo, che le chiede che cosa abbia in casa. Soltanto un orcio d’olio. Eliseo le dice di farsi prestare dai vicini dei vasi vuoti e di riempirli tutti con quel poco d’olio. L’olio smette di scorrere solo quando finiscono i vasi.",
med:["I soldi che non bastano pesano molto su una casa: portano litigi, paura e vergogna. Dio non è indifferente a tutto questo. Ha chiesto alla vedova che cosa avesse in casa. È partito dal poco che lei aveva.","Rimettere in sesto le finanze di casa chiede fede e anche gesti concreti: organizzarsi, parlarne, tagliare il superfluo, cercare aiuto. Dio moltiplica il poco che gli affidiamo."],
perg:"Quale situazione economica preoccupa di più la mia casa? Che cosa ho «in casa» da affidare a Dio?",
des:"Fai oggi un semplice elenco delle spese di casa e guarda dove puoi risparmiare. Prega sulle bollette e sui conti, mettendoli davanti a Dio. Condividi qualcosa, anche di piccolo, con chi ha meno.",
ora:"Signore, tu hai moltiplicato l’olio della vedova. Guarda le necessità della nostra casa e donaci saggezza e il necessario per vivere. Amen."},

{t:"L’armatura di Dio",ref:"Ef 6,10-18",v:"Rivestitevi dell'armatura di Dio, per poter resistere alle insidie del diavolo.",
exp:"San Paolo ricorda che la nostra lotta non è contro le persone, ma contro il male. Per questo chiede ai cristiani di indossare l’armatura di Dio: la cintura della verità, la corazza della giustizia, i calzari pronti a portare il vangelo della pace, lo scudo della fede, l’elmo della salvezza e la spada dello Spirito, che è la Parola di Dio. E di pregare in ogni momento.",
med:["La famiglia è molto amata da Dio, e per questo è anche attaccata: divisioni, dipendenze, scoraggiamento, menzogne. Tanti litigi in casa hanno una radice spirituale.","Ricorda che tuo marito, i tuoi figli o i tuoi suoceri non sono il nemico. Il nemico è il male che vuole dividere. E contro di lui, la preghiera è l’arma della famiglia."],
perg:"Quale divisione o attacco sta subendo la mia casa? Sto combattendo contro le persone o contro il male?",
des:"Prega oggi la preghiera a San Michele Arcangelo per tutta la famiglia. Leggi Ef 6,10-18 e scegli un «pezzo dell’armatura» da indossare questa settimana (per esempio: la verità, la pace, la fede).",
ora:"San Michele Arcangelo, proteggi la nostra famiglia nella lotta. Signore, rivestici della tua armatura e custodisci la nostra casa da ogni male. Amen."},

{t:"La gioia del Signore è la nostra forza",ref:"Ne 8,8-12",v:"non vi rattristate, perché la gioia del Signore è la vostra forza",
exp:"Dopo l’esilio, il popolo ricostruisce Gerusalemme. Il sacerdote Esdra legge a tutti la Legge di Dio, e il popolo piange ascoltandola. Neemia dice che quel giorno è consacrato al Signore e che nessuno deve essere triste, e li invita a mangiare, bere e condividere con chi non ha nulla. E il popolo fa festa con grande gioia.",
med:["Una casa restaurata sa anche ridere. La gioia è segno che Dio è presente ed è forza per affrontare i giorni difficili.","A volte siamo così concentrate sui problemi che ci dimentichiamo di festeggiare. Festeggiare le piccole cose è anche un atto di fede."],
perg:"Quand’è stata l’ultima volta che la mia famiglia ha festeggiato qualcosa insieme? Che cosa possiamo festeggiare oggi?",
des:"Fate oggi qualcosa di allegro insieme: un dolce speciale, una canzone da ballare in salotto, un gioco, un picnic sul balcone. Festeggiate una piccola vittoria della famiglia.",
ora:"Signore, riempi la nostra casa della tua gioia. Che sia la nostra forza nei giorni belli e in quelli difficili. Amen."},

{t:"Il valore dei piccoli gesti",ref:"Mc 12,41-44",v:"In verità vi dico: questa vedova ha gettato nel tesoro più di tutti gli altri.",
exp:"Gesù osserva la gente che getta le offerte nel tesoro del Tempio. Molti ricchi ne gettano tante. Arriva una vedova povera e mette due monetine. Gesù chiama i discepoli e dice che lei ha dato più di tutti, perché ha dato tutto quello che aveva per vivere.",
med:["Dio non misura la grandezza del gesto, ma l’amore che c’è dentro. Restaurare una casa è fatto di piccoli gesti: un bigliettino, un caffè portato a letto, i piatti lavati senza lamentarsi.","Forse senti di avere poco da dare. Ma, come per la vedova, il poco dato con amore vale più del molto dato per dovere."],
perg:"Quale piccolo gesto d’amore posso offrire oggi a ogni persona della mia casa?",
des:"Fai oggi un piccolo gesto d’amore per ogni persona della casa (un bigliettino, un abbraccio, il suo piatto preferito, un complimento). Annota come ha reagito ciascuno.",
ora:"Signore, fa’ che io non disprezzi mai i piccoli gesti. Accogli le mie due monetine d’amore e moltiplicale nella mia casa. Amen."},

{t:"Maria nella nostra casa",ref:"Lc 1,39-45.56",v:"Maria rimase con lei circa tre mesi, poi tornò a casa sua.",
exp:"Subito dopo l’annuncio dell’angelo, Maria va in fretta a casa di Elisabetta, che aspetta un bambino ed è già anziana. Quando arriva, Giovanni sussulta di gioia nel grembo di Elisabetta. Maria resta lì tre mesi, aiutando la cugina, fino alla nascita di Giovanni.",
med:["Maria ha portato Gesù nella casa di Elisabetta ed è rimasta lì a servire. Dove entra Maria, arriva Gesù e nasce la gioia.","Invitare Maria nella tua casa è chiederle di prendersi cura della famiglia con il suo stile di mamma: attenta, discreta, premurosa e piena di fede."],
perg:"Quale angolo della mia casa e della mia giornata posso dedicare alla Madonna?",
des:"Prepara o sistema in casa un piccolo angolo di preghiera con un’immagine di Maria, una candela e un fiore. Pregate lì insieme una decina del Rosario.",
ora:"Maria, entra nella nostra casa come sei entrata in quella di Elisabetta. Porta Gesù, porta la gioia e prenditi cura della nostra famiglia. Amen."},

{t:"Io e la mia casa serviremo il Signore",ref:"Gs 24,14-18",v:"Quanto a me e alla mia casa, vogliamo servire il Signore",
exp:"Alla fine della sua vita, Giosuè raduna il popolo d’Israele e racconta tutto ciò che Dio ha fatto per loro. Poi lo mette davanti a una scelta: chi vorranno servire? E lui risponde per primo, per sé e per la sua casa: serviranno il Signore. Il popolo risponde che anch’esso servirà il Signore.",
med:["Dopo 21 giorni, è il momento di guardare il cammino percorso e fare una scelta, come Giosuè. Forse non tutto è cambiato, ma hai seminato tanti semi.","Giosuè non ha aspettato che tutti fossero d’accordo per scegliere. Ha deciso per sé e per la casa che guidava. Anche tu oggi puoi decidere che la tua casa appartiene al Signore."],
perg:"Che cosa è cambiato nella mia casa e in me in questi 21 giorni? Quale scelta voglio fare adesso?",
des:"Scrivi il versetto di oggi su un bel foglio e appendilo alla porta d’ingresso o in un punto ben visibile. Riunitevi per una preghiera di consacrazione della famiglia.",
ora:"Signore, io e la mia casa serviremo te. Grazie per questi 21 giorni. Continua a restaurare e a benedire la nostra casa. Amen."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="lar21"){PLANOS[i].d=D;PLANOS[i].resumo="Per quando in casa l’aria si fa pesante: 21 giorni per ritrovare la pace, il perdono, la preghiera e la gioia. Ogni giorno trovi una lettura spiegata, una meditazione, uno spazio per scrivere e una sfida da vivere in casa.";}}
})();

// 14 giorni per essere una mamma più paziente: versione completa
(function(){
var D=[
{t:"La pazienza è frutto dello Spirito",ref:"Gal 5,22-25",v:"Il frutto dello Spirito invece è amore, gioia, pace, pazienza, benevolenza, bontà, fedeltà, mitezza, dominio di sé",
exp:"San Paolo elenca ciò che lo Spirito Santo fa crescere in chi vive unito a Dio. Non parla di «frutti» separati, ma di un unico frutto dai molti sapori. La pazienza e il dominio di sé sono nell’elenco: non sono conquiste del solo sforzo, ma doni che crescono in noi.",
med:["Tante mamme si colpevolizzano: «Dovrei avere più pazienza». E ci provano a forza di volontà, finché non esplodono di nuovo. La bella notizia è che la pazienza non dipende solo da te.","Un frutto si coltiva: con la preghiera, il riposo e il tempo. In questi 14 giorni chiederai ogni giorno allo Spirito Santo il frutto della pazienza, e farai piccoli passi per farlo crescere."],
perg:"In quali momenti della giornata la mia pazienza di solito finisce? Che cosa succede prima?",
des:"Scrivi su un foglietto o sul cellulare: «Spirito Santo, donami il tuo frutto». Mettilo in un posto dove lo vedi più volte al giorno (il frigorifero, lo specchio, lo schermo del cellulare) e ripetilo come preghiera ogni volta che lo guardi.",
ora:"Spirito Santo, fa’ crescere in me il frutto della pazienza. Da sola non ci riesco; agisci tu in me. Amen."},

{t:"Dio è paziente con me",ref:"Lc 13,6-9",v:"Padrone, lascialo ancora quest'anno finché io gli zappi attorno e vi metta il concime",
exp:"Gesù racconta la parabola di un uomo che aveva un fico che da tre anni non dava frutti. Ordina di tagliarlo. Ma il contadino chiede ancora un anno: zapperà intorno, metterà il concime e aspetterà. Forse porterà frutto.",
med:["Dio è così con me: il contadino paziente che non si arrende, che chiede ancora un anno, che concima e aspetta. Quante volte ha già aspettato me?","Quando ricordiamo la pazienza che Dio ha con noi, diventa più facile essere pazienti con i nostri figli, che stanno ancora crescendo e imparando."],
perg:"In quale ambito della mia vita Dio è stato molto paziente con me?",
des:"Oggi, quando uno dei tuoi figli ripete un errore, ricorda: «Dio è paziente con me». Invece di sgridarlo, spiegagli di nuovo con calma, come il contadino che concima il fico.",
ora:"Signore, grazie per la pazienza che hai con me. Insegnami a essere con i miei figli il contadino che aspetta e si prende cura. Amen."},

{t:"Respirare prima di rispondere",ref:"Pr 15,1.18; 16,32",v:"Il paziente val più di un eroe, chi domina se stesso val più di chi conquista una città.",
exp:"Il libro dei Proverbi raccoglie consigli pratici per la vita. Insegna che una risposta gentile calma la collera, mentre una parola dura accende la lite. E dice che dominare se stessi è una vittoria più grande che conquistare una città.",
med:["Tra ciò che fa nostro figlio e ciò che rispondiamo c’è un piccolo spazio. Lì abita la nostra libertà. Quando reagiamo d’impulso, quello spazio scompare.","Fare tre respiri profondi prima di rispondere sembra poco, ma crea lo spazio per scegliere la risposta. È un piccolo gesto di dominio di sé, più grande che conquistare una città."],
perg:"Come reagisco di solito nel primo secondo di un conflitto con i miei figli?",
des:"Allenati oggi con la «regola dei 3 respiri»: davanti a qualcosa che ti irrita, fai tre respiri profondi prima di dire qualsiasi cosa. La sera, annota quante volte ci sei riuscita.",
ora:"Signore, donami il dominio di me stessa. Che tra ciò che sento e ciò che faccio ci sia spazio perché agisca il tuo Spirito. Amen."},

{t:"Ogni fase ha il suo tempo",ref:"Mc 4,26-29",v:"il seme germoglia e cresce; come, egli stesso non lo sa.",
exp:"Gesù paragona il Regno di Dio a un uomo che getta il seme nella terra. Dorme e si alza, notte e giorno, e il seme cresce da solo: prima lo stelo, poi la spiga, poi il chicco pieno. Quando il frutto è maturo, arriva la mietitura.",
med:["I figli crescono per fasi, come il seme: prima lo stelo, poi la spiga, e solo dopo il chicco. Spesso pretendiamo da loro il chicco maturo quando sono ancora allo stelo.","Un bimbo di due anni fa i capricci, uno di cinque disobbedisce per mettere alla prova i limiti, un adolescente si chiude. Ogni fase ha il suo tempo. Conoscere la fase aiuta ad avere pazienza."],
perg:"Sto pretendendo dai miei figli qualcosa che non è ancora adatto alla loro età?",
des:"Informati o ricorda che cosa ci si può aspettare all’età di ciascuno dei tuoi figli. Scegli un loro atteggiamento che ti irrita ed è tipico della loro fase, e decidi di guardarlo oggi con più comprensione.",
ora:"Signore, tu fai crescere il seme a suo tempo. Donami pazienza in ogni fase della vita dei miei figli. Amen."},

{t:"Una mamma stanca",ref:"Mt 11,28-30",v:"Venite a me, voi tutti, che siete affaticati e oppressi, e io vi ristorerò.",
exp:"Gesù rivolge un invito a chi porta pesi troppo grandi: venire a lui. Offre il suo giogo, che è dolce, e il suo carico, che è leggero. E si presenta come mite e umile di cuore, qualcuno presso cui l’anima trova riposo.",
med:["Tanta impazienza è stanchezza accumulata: notti in bianco, lavoro, casa, figli, tutto insieme. Una mamma sfinita perde la pazienza più in fretta, non per mancanza d’amore.","Gesù non ti chiede di farcela con tutto. Ti invita a venire da lui a riposare. Prendersi cura di sé non è egoismo; è la condizione per prendersi cura bene degli altri."],
perg:"Quanto della mia stanchezza si trasforma in impazienza con i miei figli? Di che cosa ho bisogno per riposare?",
des:"Oggi chiedi aiuto per una faccenda (a tuo marito, a un figlio più grande, a qualcuno della famiglia) e usa quel tempo per riposare davvero 15 minuti, senza sensi di colpa.",
ora:"Gesù, sono stanca. Vengo a te. Donami il tuo riposo e insegnami a chiedere aiuto. Amen."},

{t:"La voce mite di Dio",ref:"1Re 19,9-13",v:"Dopo il fuoco ci fu il mormorio di un vento leggero.",
exp:"Il profeta Elia è in una caverna, sul monte di Dio. Passa un vento fortissimo, ma Dio non era nel vento. Poi un terremoto, e Dio non era nel terremoto. Poi un fuoco, e Dio non era nel fuoco. Alla fine, una brezza leggera. Elia si copre il volto: era lì che c’era Dio.",
med:["Dio ha scelto di parlare a Elia in una brezza leggera, non con un grido. Lo stile di Dio è mite.","Con i figli, una voce alta può anche spaventare per un momento, ma non arriva al cuore. Parlare piano, da vicino, guardandoli negli occhi, funziona molto meglio che urlare dall’altra parte della casa."],
perg:"Com’è il mio tono di voce con i miei figli? Mi ascoltano di più quando urlo o quando mi avvicino?",
des:"Oggi, ogni volta che devi chiamare o correggere uno dei tuoi figli, vai da lui, abbassati all’altezza dei suoi occhi e parla piano. Osserva la differenza nella sua reazione.",
ora:"Signore, che la mia voce sia come la tua brezza leggera. Togli da me le urla e donami la mitezza che arriva al cuore. Amen."},

{t:"Chiedere scusa ai figli",ref:"1Gv 1,5-10",v:"Se riconosciamo i nostri peccati, egli che è fedele e giusto ci perdonerà i peccati",
exp:"San Giovanni dice che Dio è luce e che chi cammina nella luce è in comunione con lui. Se diciamo di non avere peccato, inganniamo noi stessi. Ma se riconosciamo i nostri peccati, Dio ci perdona e ci purifica.",
med:["Quando una mamma chiede scusa, insegna ai figli l’umiltà, a riparare l’errore e a riconoscere che tutti sbagliamo. Questo non toglie autorità; fa crescere il rispetto.","Dopo uno sfogo, tante mamme si sentono in colpa e restano in silenzio. Ma il senso di colpa senza perdono pesa e basta. Chiedere scusa e ricominciare è molto più sano per tutti."],
perg:"Ho mai chiesto scusa ai miei figli? C’è qualcosa per cui dovrei farlo oggi?",
des:"Se di recente hai perso la pazienza con uno dei tuoi figli, chiedigli scusa oggi con parole semplici: «La mamma ha sbagliato a urlarti contro. Mi perdoni?». Poi abbracciatevi.",
ora:"Signore, tu mi perdoni sempre. Donami l’umiltà di chiedere perdono ai miei figli e di insegnare loro a perdonare. Amen."},

{t:"Correggere con amore",ref:"Eb 12,5-11",v:"il Signore corregge colui che egli ama",
exp:"La Lettera agli Ebrei ricorda che Dio ci corregge come un padre corregge i figli. Sul momento ogni correzione sembra causa di tristezza, ma poi porta frutti di pace e di giustizia in chi si è lasciato educare.",
med:["Correggere è necessario: i figli senza limiti si sentono insicuri. Ma la correzione che educa davvero nasce dall’amore, non dalla rabbia.","Correggere con amore significa separare il figlio dal comportamento: «Ti voglio bene, e quello che hai fatto non va bene». Significa spiegare il perché, dare conseguenze giuste e poi abbracciare."],
perg:"Quando correggo i miei figli, si sentono amati o rifiutati?",
des:"La prossima volta che correggi uno di loro, usa questa frase: «Ti voglio bene, e proprio per questo non posso lasciarti fare così». Dopo la conseguenza, riavvicinati con affetto.",
ora:"Signore, insegnami a correggere come tu correggi me: con fermezza, con giustizia e con tanto amore. Amen."},

{t:"Una routine che aiuta",ref:"Mc 1,32-39",v:"Al mattino si alzò quando ancora era buio e, uscito di casa, si ritirò in un luogo deserto e là pregava.",
exp:"Dopo una giornata piena, in cui ha guarito molti malati fino a tarda sera, Gesù si alza al mattino presto, quando è ancora buio, e va a pregare da solo. Quando i discepoli lo trovano e gli dicono che tutti lo cercano, lui sa già dove andare: in altri villaggi, ad annunciare il Vangelo.",
med:["Tanti litigi con i figli avvengono sempre negli stessi momenti: al risveglio, all’uscita per la scuola, all’ora del bagnetto, prima di dormire. Una routine organizzata evita molti conflitti.","Anche Gesù aveva una routine, e al centro c’era la preghiera. Un momento con Dio prima che la casa si svegli cambia il tono di tutta la giornata."],
perg:"In quale momento della giornata ci sono più conflitti in casa mia? Che cosa si potrebbe organizzare meglio?",
