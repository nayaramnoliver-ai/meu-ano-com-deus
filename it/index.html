var P={};

P.anonovo7={ini:"2027-01-01",resumo:"Una settimana, dal 1° al 7 gennaio, per guardare indietro con gratitudine e progettare il 2027 con Dio al centro, seguendo anche le feste della Chiesa. Ogni giorno porta una lettura spiegata, una meditazione, uno spazio per scrivere e una sfida.",d:[
{t:"Mettere l’anno sotto la benedizione di Dio",cel:"Maria Santissima Madre di Dio (solennità) · Giornata mondiale della pace",
aviso:"Giorno di precetto: partecipa alla Santa Messa. Comincia l’anno ai piedi della Madonna, Madre di Dio.",
tipo:"Prima lettura",ref:"Nm 6,22-27",v:"Ti benedica il Signore e ti protegga. Il Signore faccia brillare il suo volto su di te … Il Signore rivolga su di te il suo volto e ti conceda pace.",
exp:"Nel primo giorno dell’anno, la Chiesa legge la benedizione che Dio insegnò a Mosè perché i sacerdoti la dessero al popolo. E celebra Maria come Madre di Dio: nel Vangelo (Lc 2,16-21) i pastori trovano il Bambino con Maria e Giuseppe, e Maria custodisce tutto nel suo cuore.",
med:["Prima di qualsiasi obiettivo, mettiamo l’anno intero nelle mani di Dio e sotto il manto di Maria. Non sappiamo che cosa porterà il 2027, ma sappiamo chi camminerà con noi.","Maria custodiva tutto nel cuore. Che quest’anno anche tu impari a custodire e a meditare quello che Dio farà nella tua vita, giorno dopo giorno."],
perg:"Che cosa voglio affidare a Dio all’inizio di quest’anno?",
des:"Riunisci la famiglia e benedici ognuno con la benedizione del libro dei Numeri, tracciando un segno di croce sulla fronte. Scrivi in cima a un foglio: «Il 2027 è tuo, Signore» e conservalo nella Bibbia o nel planner.",
ora:"Santa Maria, Madre di Dio, ti consacro quest’anno. Signore, benedicici, custodiscici e donaci la tua pace nel 2027. Amen."},

{t:"Fin qui il Signore ci ha aiutati",cel:"Santi Basilio Magno e Gregorio Nazianzeno (memoria)",
ref:"1Sam 7,7-12",v:"Fin qui ci ha soccorso il Signore.",
exp:"I Filistei attaccano Israele. Il popolo, impaurito, chiede a Samuele di non smettere di pregare. Samuele offre un sacrificio e grida al Signore, e Dio risponde. Dopo la vittoria, Samuele pone una pietra come ricordo e la chiama Eben-Ezer, «pietra dell’aiuto», perché fin lì il Signore li aveva aiutati.",
med:["Guardare indietro con gratitudine ci mostra quante volte Dio ci ha sostenuti, anche quando pensavamo di non farcela. Il ricordo delle vittorie di Dio dà coraggio per ciò che verrà.","Oggi innalza la tua pietra di Eben-Ezer: un segno per ricordare che Dio è stato con te nel 2026."],
perg:"In quali momenti del 2026 ho visto Dio aiutarmi?",
des:"Scrivi almeno cinque momenti del 2026 in cui Dio ti ha aiutata. Scegli un sassolino (o un oggetto) e scrivici sopra «Eben-Ezer» oppure «Fin qui». Tienilo in un posto ben visibile per tutto l’anno.",
ora:"Signore, fin qui ci hai aiutati. Grazie per ogni aiuto del 2026. Confido che continuerai a stare con noi. Amen."},

{t:"Seguire la stella",cel:"II Domenica dopo Natale",
aviso:"La domenica è giorno di precetto: partecipa alla Santa Messa. I Magi sono in cammino: mercoledì 6 gennaio celebreremo l’Epifania, quando Gesù si manifesta a tutti i popoli.",
tipo:"Vangelo",ref:"Mt 2,1-12",v:"Abbiamo visto sorgere la sua stella, e siamo venuti per adorarlo",
exp:"Alcuni Magi venuti dall’Oriente seguono una stella fino a Gerusalemme e chiedono dove sia il re che è nato. Erode resta turbato. La stella li guida fino a Betlemme, dove trovano il Bambino con Maria. Si inginocchiano, lo adorano e gli offrono oro, incenso e mirra. Poi, avvertiti in sogno, tornano per un’altra strada.",
med:["I Magi hanno fatto un lungo viaggio seguendo una stella. Non avevano tutte le risposte, ma avevano una direzione. E quando hanno trovato Gesù, sono tornati per un’altra strada: l’incontro ha cambiato il loro cammino.","Quale stella guiderà il tuo anno? Gli obiettivi sono buoni, ma la cosa più importante è la direzione: andare verso Gesù e lasciare che sia lui a cambiare la tua strada."],
perg:"Quale stella voglio seguire nel 2027? Quale strada devo cambiare dopo aver incontrato Gesù?",
des:"Preparate in famiglia, con la carta, i tre doni dei Magi: oro (il meglio che abbiamo), incenso (la nostra preghiera) e mirra (i nostri sacrifici). Ognuno scrive quello che vuole offrire a Gesù quest’anno e lo mette vicino al presepe, dove le statuine dei Magi si avvicinano alla grotta.",
ora:"Gesù, guidami come la stella guidò i Magi. Che io ti trovi, ti adori e torni per una strada nuova. Amen."},

{t:"Obiettivi con Dio",cel:"Feria del tempo di Natale",
ref:"Lc 14,28-30",v:"Chi di voi, volendo costruire una torre, non si siede prima a calcolarne la spesa",
exp:"Gesù usa un’immagine molto concreta: chi vuole costruire una torre prima si siede a fare i conti, per non cominciarla e lasciarla a metà. Parla del discepolato: seguire Gesù è una decisione seria, che va pensata bene. Il libro dei Proverbi aggiunge che chi affida al Signore le proprie opere vedrà realizzarsi i suoi progetti (Pr 16,3).",
med:["Progettare non è mancanza di fede. Gesù stesso loda chi si siede a fare i conti. Quello che cambia è con chi progettiamo: con Dio al centro, gli obiettivi diventano più veri e più leggeri.","Troppi obiettivi stancano e frustrano. Scegline pochi, possibili, che facciano bene alla tua anima, alla tua famiglia e al tuo corpo."],
perg:"Quali sono i tre obiettivi più importanti per me nel 2027?",
des:"Scrivi nel tuo planner tre obiettivi per il 2027: uno per la tua vita con Dio, uno per la famiglia e uno per te. Per ognuno, annota il primo passo concreto.",
ora:"Signore, ti affido i miei progetti per il 2027. Aiutami a progettare con sapienza e a seguire la tua volontà. Amen."},

{t:"La famiglia nel 2027",cel:"Feria del tempo di Natale",
ref:"Col 3,12-17.20-21",v:"Al di sopra di tutto poi vi sia la carità, che è il vincolo di perfezione.",
exp:"San Paolo descrive come dovrebbe essere la vita di una famiglia cristiana: misericordia, bontà, umiltà, pazienza, perdono. Chiede che la pace di Cristo regni nei cuori e che la Parola di Dio abiti in loro. E parla ai figli, perché obbediscano ai genitori, e ai genitori, perché non esasperino i figli.",
med:["Che tipo di famiglia volete essere nel 2027? Non si tratta di perfezione, ma di direzione: più pace, più preghiera, più tempo insieme, meno urla.","La famiglia è il luogo dove si impara, nella pratica, a indossare l’«abito» dell’amore che Paolo descrive."],
perg:"Che cosa desidero per la mia famiglia nel 2027? Che cosa dipende da me?",
des:"Riunisci la famiglia e chiedi a ognuno: «Che cosa vorresti che la nostra famiglia facesse di più nel 2027?». Scegliete insieme un impegno (pregare insieme, una gita al mese, una cena senza cellulari).",
ora:"Signore, benedici la nostra famiglia nel 2027. Che la tua pace regni nei nostri cuori e il tuo amore ci unisca. Amen."},

{t:"Una routine di preghiera",cel:"Epifania del Signore (solennità)",
tipo:"Vangelo",ref:"Mc 6,45-52",v:"Appena li ebbe congedati, salì sul monte a pregare.",
exp:"Dopo la moltiplicazione dei pani, Gesù fa salire i discepoli sulla barca perché attraversino il lago e sale sul monte a pregare da solo. Di notte li vede lottare contro il vento e va verso di loro camminando sull’acqua. Li invita ad avere coraggio e a non avere paura. Sale sulla barca e il vento si calma.",
med:["Anche con la folla che lo cercava, Gesù trovava il tempo per pregare. Se perfino Gesù aveva bisogno di quel momento da solo con il Padre, quanto più noi.","Una routine di preghiera non deve essere lunga: 5 minuti al giorno, a un orario fisso, bastano a cambiare l’anno. È dal monte della preghiera che Gesù ha visto i discepoli in pericolo ed è andato da loro."],
perg:"Qual è il momento migliore della mia giornata per pregare con costanza?",
des:"Oggi è l’Epifania, giorno di precetto: partecipa alla Santa Messa con la tua famiglia. Poi scegli un orario e un luogo fissi per il tuo momento con Dio nel 2027. Metti una sveglia sul cellulare chiamata «Il mio momento con Dio» e comincia oggi.",
ora:"Signore, insegnami a salire sul monte per pregare ogni giorno. Che la preghiera sia al centro della mia routine nel 2027. Amen."},

{t:"Andare avanti",cel:"Giovedì dopo l’Epifania",
ref:"Fil 3,7-14",v:"dimentico del passato e proteso verso il futuro…",
exp:"San Paolo dice che tutto ciò che prima considerava importante ora vale poco di fronte al valore di conoscere Gesù. Riconosce di non essere ancora arrivato alla perfezione, ma corre verso la meta, dimenticando ciò che sta alle spalle e protendendosi verso ciò che sta davanti.",
med:["Il passato insegna, ma non imprigiona. Gli errori, le frustrazioni e le ferite del 2026 possono restare indietro. Dio apre una strada nuova.","Paolo non dice di essere arrivato: dice che continua a correre. Il 2027 non deve essere perfetto; deve essere vissuto con Dio, un passo alla volta."],
perg:"Che cosa del 2026 devo lasciarmi alle spalle per andare avanti?",
des:"Scrivi su un foglietto quello che vuoi lasciare nel 2026 e strappalo. Poi scrivi una frase di speranza per il 2027 e mettila sulla prima pagina del tuo planner.",
ora:"Signore, lascio alle spalle ciò che è passato e avanzo con te verso ciò che mi sta davanti. Benedici il mio 2027. Amen."}
]};

P.paz7={resumo:"Per i giorni di preoccupazione e di ansia: una settimana per imparare ad affidare tutto nelle mani di Dio. Ogni giorno porta una lettura spiegata, una meditazione, uno spazio per scrivere e un piccolo esercizio di pace.",d:[
{t:"Affidare il peso al Signore",ref:"Sal 55,17-23",v:"Getta sul Signore il tuo affanno ed egli ti darà sostegno…",
exp:"Il salmista è angosciato: i nemici lo perseguitano e perfino un amico lo ha tradito. Grida a Dio al mattino, a mezzogiorno e alla sera. E arriva a una certezza: Dio ascolta e sostiene chi getta su di lui il proprio peso.",
med:["Spesso portiamo da sole pesi che non sono fatti per noi: il futuro dei figli, i conti, la salute di qualcuno, quello che pensano gli altri.","Affidare il peso al Signore non è fuggire dalle responsabilità; è riconoscere che Dio può portare ciò che io non riesco a portare."],
perg:"Quale peso ho portato da sola e devo affidare al Signore?",
des:"Scrivi su un foglio tutte le preoccupazioni che ti vengono in mente. Leggile una per una e di’: «Signore, questo è tuo». Poi piega il foglio e mettilo dentro la Bibbia.",
ora:"Signore, getto su di te il mio peso. Sostienimi e donami la tua pace. Amen."},

{t:"Solo il pane di oggi",ref:"Es 16,4.13-21",v:"Ecco, io sto per far piovere pane dal cielo per voi: il popolo uscirà a raccoglierne ogni giorno la razione di un giorno…",
exp:"Nel deserto, il popolo d’Israele ha fame. Dio manda la manna, un pane che compare ogni mattina. Ma c’è una regola: ognuno ne raccoglie solo quanto basta per la giornata. Chi prova a conservarla per il giorno dopo la trova guasta.",
med:["L’ansia vuole garantirsi già oggi il domani. Dio ha insegnato al suo popolo a fidarsi un giorno alla volta: l’indomani ci sarebbe stata di nuovo la manna.","Gesù ci ha insegnato a chiedere il pane di ogni giorno. Oggi ti serve solo la grazia di oggi. Quella di domani arriverà domani."],
perg:"Quale preoccupazione per il domani mi sta rubando l’oggi?",
des:"Oggi, ogni volta che la mente corre verso il futuro, di’: «Solo il pane di oggi, Signore». Fai una lista solo con le cose da fare oggi.",
ora:"Padre, dammi oggi il pane di oggi. Insegnami a fidarmi di te un giorno alla volta. Amen."},

{t:"Respirare la pace di Gesù",ref:"Gv 20,19-22",v:"Pace a voi! … Dopo aver detto questo, alitò su di loro e disse: «Ricevete lo Spirito Santo»",
exp:"La sera della Risurrezione, i discepoli sono chiusi in casa, pieni di paura. Gesù entra, sta in mezzo a loro e augura loro la pace. Mostra le mani e il fianco, e loro si rallegrano. Poi soffia su di loro e dona lo Spirito Santo.",
med:["Gesù è entrato attraverso porte chiuse dalla paura. Può entrare anche nel tuo cuore chiuso dall’ansia.","E ha soffiato: ha donato lo Spirito come un respiro. Quando l’ansia stringe, respirare lentamente con una preghiera aiuta il corpo e l’anima a tornare alla pace."],
perg:"Dove le porte del mio cuore sono chiuse dalla paura?",
des:"Fai oggi tre volte la «preghiera del respiro»: mentre inspiri, di’ nel cuore «Gesù»; mentre espiri, «confido in te». Ripeti lentamente per 2 minuti.",
ora:"Gesù, entra dalle porte chiuse del mio cuore. Soffia su di me il tuo Spirito e lasciami la tua pace. Amen."},

{t:"Coraggio, sono io",ref:"Mt 14,22-33",v:"Coraggio, sono io, non abbiate paura",
exp:"I discepoli sono sulla barca, prima dell’alba, con il vento contrario. Gesù arriva camminando sull’acqua. Si spaventano, pensando che sia un fantasma. Gesù li rassicura: devono avere coraggio, è lui. Pietro chiede di andargli incontro e cammina sulle acque, ma quando guarda il vento ha paura e comincia ad affondare. Gesù stende la mano e lo afferra.",
med:["Pietro è affondato quando ha distolto gli occhi da Gesù e ha guardato il vento. L’ansia fa così: guardiamo tanto il problema che dimentichiamo chi è con noi.","Anche mentre affondava, Pietro non è rimasto solo: Gesù gli ha teso subito la mano. Neanche tu sei sola."],
perg:"A quale «vento» ho guardato più che a Gesù?",
des:"Quando oggi arriva la preoccupazione, fai la preghiera di Pietro: chiedi a Gesù, con semplicità, di salvarti. Scrivi qui che cosa è successo dopo.",
ora:"Gesù, quando comincio ad affondare, tendimi la mano. Che i miei occhi restino fissi su di te, e non sul vento. Amen."},

{t:"Avere cura dei pensieri",ref:"Rm 12,1-2",v:"Non conformatevi alla mentalità di questo secolo, ma trasformatevi rinnovando la vostra mente",
exp:"San Paolo chiede ai cristiani di offrire la propria vita a Dio e di non seguire la mentalità del mondo. La trasformazione comincia dalla mente: rinnovare il modo di pensare per capire che cosa Dio vuole, che cosa è buono, a lui gradito e perfetto.",
med:["Molta ansia nasce dai pensieri che alimentiamo: le notizie, i confronti sui social, il «e se va male?». Anche la mente ha bisogno di cura.","Rinnovare la mente è scegliere a che cosa pensare. Non puoi controllare tutto quello che ti passa per la testa, ma puoi smettere di nutrire ciò che ti toglie la pace."],
perg:"Quali pensieri sto alimentando che mi rubano la pace?",
des:"Fai oggi un «digiuno da notizie e social» per qualche ora. Usa quel tempo per leggere un salmo, ascoltare una musica che ti calma o parlare con una persona cara.",
ora:"Signore, rinnova la mia mente. Insegnami a pensare a ciò che è buono, vero e bello. Amen."},

{t:"La gratitudine che calma",ref:"Sal 103,1-5",v:"Benedici il Signore, anima mia, non dimenticare tanti suoi benefici.",
exp:"Il salmista parla alla propria anima e la invita a benedire Dio. Chiede di non dimenticare nessuno dei benefici ricevuti: il perdono, la guarigione, la vita salvata, l’amore, la misericordia, le forze rinnovate.",
med:["L’ansia guarda a ciò che potrebbe andare storto; la gratitudine guarda a ciò che Dio ha già fatto. Le due non possono stare nello stesso posto nello stesso momento.","Quando ricordiamo i benefici di Dio, il cuore si calma, perché si accorge di non essere abbandonato."],
perg:"Quali benefici di Dio ho dimenticato?",
des:"Prima di dormire, scrivi dieci cose belle successe in questa settimana, anche piccole. Leggile ad alta voce, come una preghiera.",
ora:"Con tutta l’anima ti benedico, Signore. Grazie, mio Dio, per tutto quello che hai fatto per me. Amen."},

{t:"Addormentarsi in pace",ref:"Sal 4,2.7-9",v:"In pace mi corico e subito mi addormento: tu solo, Signore, al sicuro mi fai riposare.",
exp:"Questo salmo è una preghiera della sera. Il salmista chiede a Dio di ascoltarlo nell’angoscia, ricorda che Dio gli ha riempito il cuore di gioia e termina con una fiducia serena: può coricarsi e dormire in pace, perché in Dio è al sicuro.",
med:["La notte è spesso il momento peggiore per l’ansia: il silenzio fa sembrare i pensieri più forti. Affidare la giornata a Dio prima di dormire aiuta il corpo e l’anima a riposare.","Dopo questi 7 giorni non sei libera da ogni preoccupazione, ma hai imparato delle strade per tornare alla pace. Continua a percorrerle tutte."],
perg:"Che cosa è cambiato in me in questi 7 giorni? Quale esercizio di pace voglio mantenere?",
des:"Crea un piccolo rito per la sera: spegnere il cellulare un po’ prima, pregare il Salmo 4 e affidare la giornata a Dio. Comincia stasera.",
ora:"Signore, mi corico serena e mi addormento in pace, perché solo tu mi fai sentire al sicuro. Custodisci il mio sonno e il mio cuore. Amen."}
]};

P.amada7={resumo:"Una settimana solo per te: ricordare chi sei agli occhi di Dio, prima ancora di essere mamma, moglie o donna di casa. Ogni giorno porta una lettura spiegata, una meditazione, uno spazio per scrivere e un piccolo gesto di cura per te.",d:[
{t:"Chiamata per nome",ref:"Gv 20,11-18",v:"Gesù le disse: «Maria!». Essa allora, voltatasi verso di lui, gli disse in ebraico: «Rabbunì!»",
exp:"La domenica della Risurrezione, Maria Maddalena piange vicino al sepolcro vuoto. Vede Gesù, ma non lo riconosce; pensa che sia il custode del giardino. Allora Gesù la chiama per nome. In quell’istante lei lo riconosce. E Gesù la manda ad annunciare ai discepoli che lui è vivo.",
med:["Maria Maddalena ha riconosciuto Gesù quando ha sentito il proprio nome. Dio non ti ama come «una delle tante»: ti chiama per nome, con un affetto tutto personale.","Prima di qualsiasi ruolo che vivi (mamma, moglie, figlia, professionista), sei qualcuno che Dio chiama per nome."],
perg:"Come mi sento immaginando Gesù che mi chiama per nome?",
des:"Leggi Gv 20,11-18 e, al posto di «Maria», metti il tuo nome. Resta un minuto in silenzio, lasciando che Gesù ti chiami.",
ora:"Gesù, tu mi chiami per nome. Che io riconosca la tua voce e gioisca di essere tua. Amen."},

{t:"Anche i capelli sono contati",ref:"Mt 10,29-31",v:"perfino i capelli del vostro capo sono tutti contati; non abbiate dunque timore: voi valete più di molti passeri!",
exp:"Gesù incoraggia i discepoli che dovranno affrontare difficoltà nella missione. Ricorda che nemmeno un passero, che al mercato non valeva quasi nulla, cade a terra senza che il Padre lo sappia. E dice loro che valgono molto di più.",
med:["Non devi guadagnarti l’amore di Dio. Lui ti ama già così come sei, con la stanchezza, i difetti e le insicurezze. Perfino i tuoi capelli sono contati.","In un mondo che misura il valore dall’aspetto, dalla produttività o dai like, Dio ti ricorda che il tuo valore sta nell’essere amata da lui."],
perg:"Dove ho cercato il mio valore? Nell’aspetto, in quello che faccio, nell’approvazione degli altri?",
des:"Oggi guardati allo specchio e di’, anche se ti sembra strano: «Io sono preziosa per Dio». Scrivi qui che cosa hai provato.",
ora:"Padre, grazie perché ti prendi cura perfino dei miei capelli. Insegnami a vedere il mio valore con i tuoi occhi. Amen."},

{t:"Dio mi ha insegnato a camminare",ref:"Os 11,1-4",v:"Io li traevo con legami di bontà, con vincoli d'amore; ero per loro come chi solleva un bimbo alla sua guancia…",
exp:"Per bocca del profeta Osea, Dio parla del suo popolo come di un figlio piccolo. È stato lui a insegnargli a camminare, sostenendolo per le braccia, a curare le sue ferite, a chinarsi per dargli da mangiare. Anche quando il popolo si è allontanato, Dio lo ha attirato con legami d’amore.",
med:["Tu, che ti prendi cura di tante persone, sei curata a tua volta. Dio si china su di te come una mamma si china sul suo bambino.","Forse non te ne sei nemmeno accorta, ma Dio ti ha insegnato a camminare in tante fasi della vita: ti ha sostenuta, rialzata, nutrita."],
perg:"In quale momento della mia vita ho sentito Dio tenermi in braccio?",
des:"Prenditi oggi 10 minuti solo per te: una tisana, un bagno tranquillo, una passeggiata. In quel tempo, lasciati curare da Dio.",
ora:"Signore, grazie per i legami d’amore con cui mi hai attirata. Lasciami riposare oggi tra le tue braccia. Amen."},

{t:"Dio gioisce per te",ref:"Sof 3,14-17",v:"Il Signore tuo Dio in mezzo a te è un salvatore potente. Esulterà di gioia per te, ti rinnoverà con il suo amore…",
exp:"Il profeta Sofonia invita Gerusalemme a rallegrarsi, perché Dio ha revocato la sua condanna. E fa un’affermazione sorprendente: Dio è in mezzo al suo popolo ed esulta di gioia per lui, rinnovandolo con il suo amore.",
med:["Molte persone immaginano un Dio che le guarda con pretese o con delusione. La Parola di oggi mostra un Dio che ti guarda e si rallegra, come un papà che vede il suo bambino e sorride.","Non sei un peso per Dio. Sei la sua gioia."],
perg:"Come immagino lo sguardo di Dio su di me: pieno di pretese o pieno di gioia?",
des:"Leggi Sof 3,17 e scrivi su un foglietto il suo messaggio con parole tue e con il tuo nome: «Dio gioisce per (il tuo nome)». Attaccalo allo specchio del bagno.",
ora:"Signore, grazie perché gioisci per me. Rinnovami con il tuo amore e insegnami a gioire in te. Amen."},

{t:"Non devi essere perfetta",ref:"Lc 7,36-50",v:"le sono perdonati i suoi molti peccati, poiché ha molto amato.",
exp:"Gesù è a cena a casa di un fariseo. Una donna conosciuta come peccatrice entra, piange ai piedi di Gesù, li asciuga con i capelli e li profuma. Il fariseo si scandalizza. Gesù racconta una parabola sul perdono e dice alla donna che i suoi peccati sono perdonati e che può andare in pace.",
med:["Quella donna non è arrivata perfetta: è arrivata con la sua storia e le sue lacrime. Ed è stata accolta con amore.","Non devi essere perfetta per essere amata da Dio, né per servirlo. Lui ti vuole tutta intera, con i tuoi limiti, i tuoi tentativi e l’amore che hai."],
perg:"Quale pretesa di perfezione porto con me e devo affidare a Gesù?",
des:"Scrivi una pretesa che hai verso te stessa («dovrei...»). Accanto scrivi: «Gesù mi ama così come sono». Se ne senti il bisogno, cerca la Confessione in questa settimana.",
ora:"Gesù, vengo ai tuoi piedi così come sono. Grazie perché mi ami e mi perdoni. Donami la tua pace. Amen."},

{t:"Anche prendersi cura di sé è santo",ref:"Lc 5,15-16",v:"Ma Gesù si ritirava in luoghi solitari a pregare.",
exp:"La fama di Gesù si diffonde e le folle accorrono per ascoltarlo ed essere guarite. Eppure il Vangelo racconta che Gesù si ritirava in luoghi tranquilli a pregare. Sapeva di aver bisogno di quel tempo da solo con il Padre.",
med:["Prenderti cura di te non è egoismo. È avere cura della casa dove Dio abita. Gesù, con tanta gente che aveva bisogno di lui, trovava il tempo per ritirarsi.","Una donna sfinita non riesce a prendersi cura bene di nessuno. Ritagliarti un tempo per te (riposare, pregare, fare qualcosa che ti piace) è una necessità, non un lusso."],
perg:"Quand’è stata l’ultima volta che mi sono presa cura di me senza sensi di colpa?",
des:"Scegli oggi una cura solo per te: qualcosa che ti fa bene e che continui a rimandare. Fallo senza sensi di colpa, offrendolo a Dio.",
ora:"Signore, insegnami a prendermi cura di me come tu ti prendi cura di me. Che io riposi senza sensi di colpa e preghi senza fretta. Amen."},

{t:"La parte migliore",ref:"Lc 10,38-42",v:"Maria si è scelta la parte migliore, che non le sarà tolta",
exp:"Gesù fa visita a Marta e Maria. Marta è indaffarata in mille faccende; Maria si siede ai piedi di Gesù ad ascoltarlo. Marta si lamenta, e Gesù le dice con affetto che Maria ha scelto la parte migliore.",
med:["Dopo una settimana passata a ricordare chi sei agli occhi di Dio, la Parola di oggi ti invita a scegliere la parte migliore: stare con lui.","Continuerai ad avere tante cose da fare, come Marta. Ma ogni giorno puoi sederti per qualche minuto ai piedi di Gesù. Questa parte nessuno te la toglie."],
perg:"Che cosa ho imparato su di me in questa settimana? Come posso scegliere ogni giorno la parte migliore?",
des:"Scrivi una lettera di Dio per te, come se lui ti dicesse tutto quello che hai meditato in questa settimana. Conservala per rileggerla nei giorni difficili.",
ora:"Gesù, scelgo la parte migliore: stare con te. Grazie perché mi ami. Che io non dimentichi mai chi sono ai tuoi occhi. Amen."}
]};

P.familia5={resumo:"Un passo al giorno per creare semplici abitudini di preghiera con i bambini, abitudini che stanno davvero nella vita di tutti i giorni. Ogni giorno porta una lettura spiegata, una meditazione, uno spazio per scrivere e un’abitudine da cominciare.",d:[
{t:"La preghiera del mattino",ref:"Sal 5,2-4",v:"Al mattino ascolta la mia voce; fin dal mattino t'invoco e sto in attesa.",
exp:"Il salmista comincia la giornata chiedendo a Dio di ascoltare il suo grido. Presenta la sua preghiera fin dal mattino e resta in attesa, attento alla risposta di Dio.",
med:["Cominciare la giornata con Dio cambia tutta la giornata. Non serve molto: un segno di croce e una frase al risveglio insegnano già ai bambini che il giorno appartiene a Dio.","La fretta del mattino è reale. Per questo la preghiera deve essere semplice e stare nella routine: a colazione, sulla strada per la scuola, sulla porta di casa."],
perg:"Come sono le mattine a casa mia? In quale momento c’è spazio per una preghiera veloce?",
des:"Domattina, quando svegli i tuoi figli, fate insieme il segno della croce e di’: «Buongiorno, Gesù! Questo giorno è tuo». Ripetilo ogni giorno di questa settimana.",
ora:"Signore, al mattino ti affidiamo la nostra giornata. Benedici la nostra famiglia fin dal primo momento. Amen."},

{t:"La preghiera a tavola",ref:"Lc 24,28-35",v:"Allora si aprirono loro gli occhi e lo riconobbero. … come l'avevano riconosciuto nello spezzare il pane.",
exp:"Due discepoli camminano verso Èmmaus, tristi dopo la morte di Gesù. Gesù cammina con loro, ma non lo riconoscono. A tavola, Gesù prende il pane, lo benedice, lo spezza e lo dà a loro. In quel momento i loro occhi si aprono e lo riconoscono.",
med:["I discepoli hanno riconosciuto Gesù a tavola, nel gesto di benedire il pane. Anche la tavola di famiglia può essere un luogo di incontro con lui.","Pregare prima dei pasti è una delle abitudini più semplici e più belle. Insegna la gratitudine e ricorda che tutto viene da Dio."],
perg:"La mia famiglia prega di solito prima di mangiare? Che cosa ce lo impedisce?",
des:"Oggi, prima del pranzo o della cena, pregate insieme tenendovi per mano. Può essere la preghiera prima dei pasti: «Benedici, Signore, noi, e questi tuoi doni che stiamo per ricevere dalla tua generosità. Per Cristo nostro Signore. Amen.» Lascia che sia uno dei figli a guidare la preghiera.",
ora:"Signore, benedici la nostra tavola. Che ti riconosciamo in ogni pasto condiviso. Amen."},

{t:"La benedizione dei genitori",ref:"Gen 48,8-16",v:"il Dio che è stato il mio pastore da quando esisto fino ad oggi, … benedica questi giovinetti!",
exp:"Ormai anziano, Giacobbe accoglie i nipoti, i figli di Giuseppe. Li abbraccia, li bacia e pone le mani sul loro capo per benedirli, ricordando il Dio che lo ha accompagnato per tutta la vita.",
med:["La benedizione dei genitori è un gesto antico e potente. Dice al figlio: «Sei amato e Dio è con te».","In tante famiglie, un tempo, i figli chiedevano la benedizione ai genitori e ai nonni prima di partire o di sposarsi. Riprendere questo gesto con i tuoi figli è seminare qualcosa che porteranno con sé per tutta la vita."],
perg:"Benedico i miei figli? Com’era la benedizione che ho ricevuto dai miei genitori?",
des:"Stasera posa la mano sul capo di ogni figlio e di’: «Dio ti benedica e ti custodisca, figlio mio». Insegna loro a chiedere la tua benedizione quando escono e quando tornano a casa.",
ora:"Signore, che le mie mani benedicano i miei figli ogni giorno. Sii tu il loro pastore per tutta la vita. Amen."},

{t:"La preghiera della sera",ref:"Sal 63,2-9",v:"Quando nel mio giaciglio di te mi ricordo e penso a te nelle veglie notturne, a te che sei stato il mio aiuto…",
exp:"Il salmista ha sete di Dio come una terra arida. Si ricorda di Dio anche quando è a letto, durante la notte, e si sente al sicuro all’ombra delle sue ali.",
med:["La sera la famiglia rallenta. È il momento perfetto per ringraziare per la giornata, chiedere perdono e affidare il sonno a Dio.","Una preghiera semplice prima di dormire, con i bambini già a letto, diventa uno dei ricordi più dolci dell’infanzia."],
perg:"Com’è il momento della nanna a casa mia? C’è spazio per qualche minuto di preghiera?",
des:"Stasera, al momento di dormire, fai ai tuoi figli tre domande: «Per che cosa vuoi dire grazie oggi?», «Vuoi chiedere perdono per qualcosa?», «Per chi vuoi pregare?». Concludete con l’Angelo di Dio.",
ora:"Signore, custodisci il nostro sonno. Grazie per questa giornata. Che i tuoi angeli ci proteggano questa notte. Amen."},

{t:"Un incontro di famiglia con Dio",ref:"Col 3,16-17",v:"La parola di Cristo dimori tra voi abbondantemente … tutto si compia nel nome del Signore Gesù",
exp:"San Paolo chiede che la Parola di Cristo abiti nei cristiani con abbondanza: che si istruiscano e si consiglino a vicenda, che cantino a Dio con gratitudine e che tutto sia fatto nel nome di Gesù, rendendo grazie al Padre.",
med:["Oltre alle piccole abitudini quotidiane, un incontro settimanale in famiglia fa crescere la fede: leggere un brano della Bibbia, cantare, parlare, pregare insieme.","Non deve essere complicato. Un quarto d’ora alla settimana, sempre nello stesso giorno, basta perché la Parola abiti nella vostra casa."],
perg:"Quale giorno e quale orario della settimana la mia famiglia potrebbe dedicare a un incontro con Dio?",
des:"Fissate il primo incontro settimanale in famiglia: accendete una candela, leggete un Vangelo breve (può essere quello della domenica), ognuno dice che cosa ha capito e concludete con un canto e un Padre Nostro.",
ora:"Signore, che la tua Parola abiti nella nostra casa. Che tutto ciò che facciamo sia fatto nel tuo nome. Amen."}
]};

// Percorsi brevi (parte 2): la Madonna, la Santa Famiglia, la gratitudine. Versione completa.
(function(){
var P={};

P.maria9={resumo:"Nove giorni in cammino con Maria attraverso il Vangelo, dal suo sì all’Annunciazione fino al Cenacolo. Ogni giorno trovi una lettura spiegata, una meditazione, uno spazio per scrivere ciò che Dio ti ha detto e una sfida per vivere come lei.",d:[
{t:"Maria del sì",ref:"Lc 1,26-38",v:"Eccomi, sono la serva del Signore, avvenga di me quello che hai detto",
exp:"L’angelo Gabriele è mandato a Nazaret, da una giovane di nome Maria, promessa sposa di Giuseppe. Le annuncia che sarà la madre del Figlio dell’Altissimo. Maria non finge di capire tutto: chiede come avverrà. L’angelo risponde che lo Spirito Santo scenderà su di lei e le ricorda che nulla è impossibile a Dio. Allora Maria dà la sua risposta: che si compia in lei ciò che Dio vuole.",
med:["Maria non aveva tutte le risposte, ma aveva fiducia. Ha chiesto, ha ascoltato e si è donata. Il suo sì non era ingenuo: era il sì di chi sa di chi si fida.","Dio aspetta anche i tuoi piccoli «sì» di ogni giorno: nella cura della casa, in un perdono che costa, nella preghiera che continui a rimandare. Ogni sì fa spazio a Gesù perché entri nella tua storia."],
perg:"In quale ambito della mia vita Dio mi sta chiedendo un sì che continuo a rimandare?",
des:"Scegli una cosa concreta che stai rimandando e che sai che Dio ti chiede (una conversazione, una Confessione, un’abitudine di preghiera, un perdono). Fai oggi il primo passo e recita tre Ave Maria chiedendo il coraggio di Maria.",
ora:"Maria, donna del sì, insegnami a fidarmi come ti sei fidata tu. Che anch’io sappia dare a Dio il mio sì intero e lasci che la sua parola si compia in me. Amen."},

{t:"Maria che serve",ref:"Lc 1,39-45",v:"In quei giorni Maria si mise in viaggio verso la montagna e raggiunse in fretta una città di Giuda.",
exp:"Subito dopo l’Annunciazione, Maria viene a sapere che la cugina Elisabetta, ormai anziana, è al sesto mese di gravidanza. Non resta ferma a pensare a sé: affronta un viaggio di circa 150 km per aiutarla. Quando arriva, il piccolo Giovanni sussulta nel grembo di Elisabetta, ed Elisabetta, piena di Spirito Santo, la chiama benedetta fra le donne.",
med:["Maria portava Gesù in grembo e la prima cosa che ha fatto è stata servire. Chi porta Gesù dentro di sé non riesce a restare chiuso: va incontro a chi ha bisogno.","Il servizio di Maria ha portato gioia in quella casa. Anche il tuo servizio di ogni giorno, spesso nascosto, porta Gesù dentro la tua famiglia e a chi ti sta vicino."],
perg:"Chi, accanto a me, ha bisogno di aiuto anche senza chiederlo?",
des:"Oggi fai un servizio concreto per qualcuno senza che te lo chieda: portare un pasto, aiutare in una faccenda, andare a trovare o telefonare a una persona anziana o malata. Fallo con gioia, come Maria.",
ora:"Maria, che sei partita in fretta per servire, donami un cuore attento e mani pronte. Che, servendo, io porti Gesù a chi ne ha bisogno. Amen."},

{t:"Maria che loda",ref:"Lc 1,46-55",v:"L'anima mia magnifica il Signore e il mio spirito esulta in Dio, mio salvatore",
exp:"Nella casa di Elisabetta, Maria risponde con un canto, il Magnificat. Loda Dio per ciò che ha fatto in lei, una giovane semplice, e per il suo modo di agire nella storia: rovescia i potenti, innalza gli umili, sazia gli affamati e si ricorda delle sue promesse. È la preghiera che la Chiesa recita ogni sera ai Vespri.",
med:["Maria non tiene la gioia per sé: la trasforma in lode. Non si vanta di nulla, ma riconosce che è il Signore ad aver fatto in lei grandi cose. La gratitudine umile è il segreto del suo cuore.","A volte preghiamo solo per chiedere. Oggi impara da Maria a lodare: guarda la tua vita e riconosci le meraviglie che Dio ha già fatto."],
perg:"Quali sono le «grandi cose» che Dio ha già fatto nella mia vita?",
des:"Recita il Magnificat lentamente (lo trovi nella scheda Pregare). Poi scrivi il tuo «magnificat»: cinque righe che comincino con «Ti lodo, Signore, perché...».",
ora:"Signore, ti lodo con tutto il cuore e mi rallegro in te, perché ti sei chinato con amore sulla mia piccolezza. Maria, insegnami a lodare. Amen."},

{t:"Maria, mamma a Betlemme",ref:"Lc 2,1-7",v:"Diede alla luce il suo figlio primogenito, lo avvolse in fasce e lo depose in una mangiatoia, perché non c'era posto per loro nell'albergo.",
exp:"A causa di un censimento, Giuseppe e Maria, ormai alla fine della gravidanza, viaggiano da Nazaret a Betlemme. Non trovano posto nell’alloggio, e il Figlio di Dio nasce in un luogo per gli animali. Maria fa ciò che fa ogni mamma: avvolge il bambino in fasce e lo depone nel posto più sicuro che trova.",
med:["La nascita di Gesù è stata circondata da imprevisti, stanchezza e mancanza di mezzi. Eppure Maria se ne è presa cura con ciò che aveva, con tutto l’amore che poteva dare.","Le cure semplici di ogni giorno, come il bagnetto, i pasti, tenere in braccio, i vestiti puliti, sono sante anche loro. Fatte con amore, diventano preghiera e preparano un posto a Gesù nella tua casa."],
perg:"In quali piccole cure della mia giornata posso riconoscere Gesù?",
des:"Offri a Dio sottovoce ogni gesto di cura che farai oggi per la tua famiglia (o per te stessa): «È per te, Signore». Stasera scrivi quale è stato il più difficile da offrire e perché.",
ora:"Maria, che ti sei presa cura di Gesù con così poco e con tanto amore, insegnami ad avere cura degli altri con pazienza e tenerezza. Che la mia casa sia una mangiatoia accogliente per Gesù. Amen."},

{t:"Maria che custodisce nel cuore",ref:"Lc 2,15-19",v:"Maria, da parte sua, serbava tutte queste cose meditandole nel suo cuore.",
exp:"I pastori, avvisati dagli angeli, vanno a Betlemme e trovano Maria, Giuseppe e il bambino adagiato nella mangiatoia. Raccontano tutto ciò che hanno sentito, e tutti si stupiscono. Maria però non si perde nel trambusto: custodisce tutto e lo medita, cioè mette insieme gli avvenimenti e cerca di capire che cosa Dio sta facendo.",
med:["Maria non capiva tutto subito, ma non scartava nulla. Il suo cuore era come uno scrigno dove custodiva i segni di Dio, per pregarci sopra più tardi.","Viviamo di corsa e dimentichiamo in fretta ciò che Dio ha fatto. Custodire nel cuore è fermarsi, ricordare e lasciare che i fatti della giornata diventino preghiera."],
perg:"Che cosa sta facendo Dio nella mia vita su cui non mi sono ancora fermata a meditare?",
des:"Oggi concediti 10 minuti di silenzio, senza telefono. Ripensa agli avvenimenti dell’ultima settimana e scrivi qui sotto un segno di Dio che hai notato e che vuoi custodire nel cuore.",
ora:"Maria, che custodivi tutto nel cuore, insegnami a fare silenzio e a riconoscere Dio negli avvenimenti della mia vita. Amen."},

{t:"Maria che cerca Gesù",ref:"Lc 2,41-51",v:"Figlio, perché ci hai fatto così? Ecco, tuo padre e io, angosciati, ti cercavamo",
exp:"A dodici anni, Gesù va con Maria e Giuseppe a Gerusalemme per la Pasqua. Al ritorno, i genitori si accorgono che non è nella carovana. Lo cercano angosciati per tre giorni, finché lo trovano nel Tempio, tra i maestri. Gesù risponde che doveva stare nella casa del Padre suo. Maria non capisce, ma ancora una volta custodisce tutto nel cuore.",
med:["Anche Maria ha conosciuto l’angoscia, la ricerca e le domande senza risposta. Questo ci consola: sentire Gesù lontano non significa essere state abbandonate. Significa che è il momento di cercarlo.","Maria e Giuseppe sono tornati indietro e lo hanno cercato finché non l’hanno trovato. Quando la vita frenetica ci allontana da Gesù, la strada è tornare dove lui si trova: la preghiera, la Parola, la Messa, la Confessione."],
perg:"Dove ho «perso di vista Gesù» ultimamente? Dove ho bisogno di tornare?",
des:"Riprendi oggi un’abitudine di fede che hai lasciato andare (il Rosario, la lettura della Bibbia, la Messa feriale, la Confessione). Segna in agenda il giorno e l’ora in cui lo farai questa settimana.",
ora:"Maria, quando mi allontano da Gesù, prendimi per mano e aiutami a ritrovarlo. Che io non smetta mai di cercarlo. Amen."},

{t:"Maria che intercede",ref:"Gv 2,1-11",v:"La madre dice ai servi: «Fate quello che vi dirà».",
exp:"A un matrimonio a Cana, il vino finisce nel bel mezzo della festa, cosa che sarebbe stata una grande vergogna per gli sposi. Maria se ne accorge prima di tutti e porta la necessità a Gesù: non hanno più vino. Poi dice ai servitori di fare qualunque cosa lui chieda. Gesù trasforma l’acqua in vino, ed è il suo primo segno.",
med:["Maria si accorge di ciò che manca prima che qualcuno lo chieda. Lo fa anche per la tua famiglia: vede i bisogni della tua casa e li presenta a Gesù.","Il consiglio di Maria è ancora oggi lo stesso: fare tutto ciò che Gesù ci chiede. La sua intercessione ci porta sempre a obbedire a suo Figlio."],
perg:"Che cosa manca oggi nella mia casa? Quale «vino» è finito?",
des:"Scrivi qui sotto un bisogno concreto della tua famiglia e affidalo alla Madonna recitando un Rosario (o almeno una decina) per questa intenzione. Chiediti anche: che cosa mi sta chiedendo Gesù di fare in questa situazione?",
ora:"Maria, Madre premurosa, presenta a Gesù ciò che manca alla mia famiglia. E donami un cuore pronto a fare tutto ciò che lui mi chiederà. Amen."},

{t:"Maria ai piedi della croce",ref:"Gv 19,25-27",v:"Stavano presso la croce di Gesù sua madre, la sorella di sua madre, Maria di Clèofa e Maria di Màgdala.",
exp:"Nell’ora più buia, quando quasi tutti sono fuggiti, Maria è lì, in piedi. Dalla croce Gesù vede sua madre e il discepolo amato. Affida a Maria il discepolo come figlio, e al discepolo Maria come madre. Da quell’ora il discepolo la accoglie con sé. La Chiesa comprende che lì Gesù ci ha donato Maria come Madre.",
med:["Maria non ha potuto impedire la sofferenza del Figlio, ma non lo ha lasciato solo. Restare accanto a chi soffre è anch’esso amore, a volte il più grande che possiamo dare.","Lei sa che cosa significa soffrire come donna e come mamma. Per questo puoi portarle i tuoi dolori senza paura: lei capisce e resta con te."],
perg:"Quale dolore porto oggi che voglio mettere nelle mani di Maria?",
des:"Pensa a una donna che sta soffrendo (una malattia, un lutto, un figlio lontano, un matrimonio difficile). Prega per lei oggi e, se puoi, mandale un messaggio affettuoso o vai a trovarla. Semplicemente, stalle vicino.",
ora:"Maria, Madre Addolorata, che sei rimasta in piedi accanto alla croce, resta con me nei momenti difficili. Ti accolgo nella mia casa, come il discepolo amato. Amen."},

{t:"Maria che prega con la Chiesa",ref:"At 1,12-14",v:"Tutti questi erano assidui e concordi nella preghiera, insieme con alcune donne e con Maria, la madre di Gesù",
exp:"Dopo l’Ascensione di Gesù, gli apostoli tornano a Gerusalemme e si riuniscono nella stanza al piano superiore, il Cenacolo. Lì attendono lo Spirito Santo promesso, pregando insieme. In mezzo a loro c’è Maria. Lei, che aveva ricevuto lo Spirito all’Annunciazione, ora accompagna nella preghiera la Chiesa che sta nascendo.",
med:["Maria non resta nel passato del Vangelo: continua a stare in mezzo alla Chiesa, pregando con noi. Dove c’è una comunità che prega, lì c’è la Madre.","Alla fine di questi nove giorni puoi fare come il discepolo amato: accogliere Maria nella tua casa e affidarti a lei, perché ti conduca sempre a Gesù."],
perg:"Che cosa ho imparato da Maria in questi nove giorni e voglio portare nella mia vita?",
des:"Affidati alla Madonna con la preghiera «Sotto la tua protezione» (scheda Pregare). Se puoi, recita un Rosario con la famiglia o con altre persone, come Maria pregava con gli apostoli.",
ora:"Sotto la tua protezione cerchiamo rifugio, Santa Madre di Dio. Non disprezzare le suppliche di noi che siamo nella prova,\nma liberaci da ogni pericolo, o Vergine gloriosa e benedetta."}
]};

P.sagrada10={resumo:"Dieci giorni per imparare da Gesù, Maria e Giuseppe a vivere la fede nella vita di ogni giorno in famiglia. Ogni giorno trovi una lettura spiegata, una meditazione, uno spazio per scrivere e una sfida da vivere con la tua famiglia.",d:[
{t:"Dio ha scelto una famiglia",ref:"Lc 2,39-40",v:"Il bambino cresceva e si fortificava, pieno di sapienza, e la grazia di Dio era sopra di lui.",
exp:"Dopo aver presentato Gesù al Tempio, Maria e Giuseppe tornano a Nazaret, un piccolo paese senza importanza. Lì Gesù trascorrerà circa trent’anni, in una vita nascosta, fatta di casa e di lavoro. Il Vangelo riassume quel tempo in poche parole: il bambino cresceva, e la grazia di Dio era su di lui.",
med:["Dio avrebbe potuto venire al mondo in tanti modi, ma ha scelto di nascere e crescere in una famiglia. Questo mostra il valore immenso che la famiglia ha per lui.","Anche la tua casa, con le sue abitudini, le sue fatiche e le sue gioie, può essere una piccola Nazaret: un luogo in cui la grazia di Dio è presente nella normalità di ogni giorno."],
perg:"Che cosa renderebbe la mia casa una piccola Nazaret?",
des:"Metti un’immagine o un quadretto della Santa Famiglia in un posto speciale della casa. Riunisci la famiglia per un minuto, mostrate insieme l’immagine e pregate: «Gesù, Giuseppe e Maria, benedite la nostra famiglia».",
ora:"Gesù, Giuseppe e Maria, che a Nazaret avete vissuto una vita semplice e piena d’amore, benedite la mia famiglia e fate della nostra casa un luogo dove Dio abita. Amen."},

{t:"Maria, la mamma attenta",ref:"Lc 2,48-52",v:"Partì dunque con loro e tornò a Nazaret e stava loro sottomesso. Sua madre serbava tutte queste cose nel suo cuore.",
exp:"Dopo aver ritrovato Gesù nel Tempio, la famiglia torna a casa. Gesù, pur essendo Dio, obbedisce a Maria e Giuseppe. E Maria continua a fare ciò che ha sempre fatto: custodire tutto nel cuore. È una mamma che osserva, ascolta e porta nella preghiera la vita del figlio.",
med:["Maria non era una mamma distratta. Prestava attenzione a Gesù, anche quando non capiva. L’attenzione è una delle forme più belle dell’amore.","In mezzo alle mille faccende, è facile guardare i figli (o le persone di casa) solo per correggere o dare ordini. Maria ci insegna a guardare per ammirare, capire e pregare per loro."],
perg:"Che cosa ho notato nelle persone di casa che ho bisogno di portare nella preghiera?",
des:"Oggi dedica 15 minuti di attenzione piena a uno dei tuoi figli, a tuo marito o a qualcuno di casa: niente telefono, solo chiacchierare o giocare. Stasera scrivi qualcosa di bello che hai scoperto in quel momento.",
ora:"Maria, mamma attenta, insegnami a guardare la mia famiglia con i tuoi occhi e a custodire nel cuore ogni momento. Amen."},

{t:"Giuseppe, l’uomo giusto",ref:"Mt 1,18-24",v:"Giuseppe suo sposo, che era giusto e non voleva ripudiarla, decise di licenziarla in segreto.",
exp:"Giuseppe scopre che Maria aspetta un bambino prima che vadano a vivere insieme. Essendo un uomo giusto, non vuole esporla alla vergogna. Mentre ci sta pensando, un angelo gli appare in sogno e gli spiega che il bambino viene dallo Spirito Santo. Al risveglio, Giuseppe fa come l’angelo gli ha detto e accoglie Maria nella sua casa.",
med:["Giuseppe è l’uomo del silenzio e dell’azione. Nel Vangelo non dice una sola parola, ma obbedisce a Dio con prontezza e protegge Maria e Gesù con coraggio.","Anche gli uomini della tua famiglia, tuo marito, tuo padre, i tuoi figli, hanno bisogno di preghiera. San Giuseppe è modello e protettore per loro, e per ogni famiglia che si affida alla sua cura."],
perg:"Quali uomini della mia famiglia voglio mettere sotto la protezione di San Giuseppe?",
des:"Recita la preghiera a San Giuseppe (scheda Pregare) per tuo marito, per tuo padre o per il papà dei tuoi figli. Poi digli qualcosa che ammiri in lui, con un messaggio o di persona.",
ora:"San Giuseppe, uomo giusto e fedele, proteggi la mia famiglia come hai protetto Gesù e Maria. Veglia sugli uomini della mia casa e insegna loro a fidarsi di Dio. Amen."},

{t:"Il lavoro di Nazaret",ref:"Mt 13,53-58",v:"Non è egli forse il figlio del carpentiere? Sua madre non si chiama Maria",
exp:"Gesù torna nel suo paese e insegna nella sinagoga. La gente è stupita, ma anche diffidente: conoscevano Gesù come il figlio del falegname, un uomo qualunque che lavorava con le mani. A causa della loro mancanza di fede, lì non compie molti miracoli.",
med:["Per anni Gesù ha lavorato con Giuseppe come falegname. Il Figlio di Dio ha sudato, si è stancato e ha imparato un mestiere. Questo significa che il lavoro, in casa o fuori, può essere santo.","Lavare i piatti, occuparsi del bucato, affrontare una giornata di lavoro: tutto può essere offerto a Dio. Non conta la grandezza del compito, ma l’amore con cui lo si fa."],
perg:"Quale faccenda della mia giornata faccio di malavoglia e potrei offrire a Dio?",
des:"Prima di ogni faccenda, oggi, di’ sottovoce: «È per te, Signore». Scegli il compito che ti piace di meno e fallo con particolare cura, pregando per qualcuno mentre lavori.",
ora:"San Giuseppe lavoratore, insegnami a lavorare con amore. Signore, santifica il nostro lavoro di ogni giorno e fanne un’offerta a te gradita. Amen."},

{t:"Gesù cresceva",ref:"Lc 2,52",v:"E Gesù cresceva in sapienza, età e grazia davanti a Dio e agli uomini.",
exp:"Questo versetto chiude il racconto dell’infanzia di Gesù. Mostra che è cresciuto davvero, come ogni bambino: nel corpo, nella conoscenza e nella relazione con Dio e con le persone. Questa crescita è avvenuta dentro una famiglia, con l’aiuto di Maria e Giuseppe.",
med:["Gesù non ha saltato nessuna tappa. È cresciuto a poco a poco, come i nostri figli e come noi. Ogni età ha la sua bellezza e la sua sfida.","Crescere nella grazia è importante quanto crescere in altezza. La famiglia è il luogo dove si impara a pregare, a perdonare e ad amare Dio."],
perg:"In che cosa voglio crescere nella fede, e in che cosa voglio aiutare la mia famiglia a crescere?",
des:"Nota qualcosa di nuovo che tuo figlio (o qualcuno di casa) ha imparato o conquistato, e ringrazia Dio ad alta voce, vicino a lui. Se puoi, insegna oggi una preghiera breve a un bambino.",
ora:"Gesù, che a Nazaret sei cresciuto in sapienza e grazia, benedici la crescita dei miei figli e della mia famiglia. Facci crescere anche nel tuo amore. Amen."},

{t:"Una famiglia che prega",ref:"Lc 2,41-42",v:"I suoi genitori si recavano tutti gli anni a Gerusalemme per la festa di Pasqua.",
exp:"Maria e Giuseppe erano fedeli alle pratiche della loro fede: ogni anno andavano in pellegrinaggio a Gerusalemme, un viaggio lungo e faticoso, per celebrare la Pasqua. Quando Gesù compì dodici anni, andò con loro. La fede si viveva in famiglia, con abitudini e impegni.",
med:["Le abitudini di fede formano il cuore. Un bambino che vede i genitori pregare, andare a Messa e celebrare le feste impara che Dio fa parte della vita, non è un soprammobile.","Non serve niente di grande: una preghiera prima dei pasti, una benedizione prima di dormire, la Messa della domenica insieme. Ciò che è costante è ciò che resta."],
perg:"Quale abitudine di preghiera potrebbe iniziare o riprendere la mia famiglia?",
des:"Accordatevi in famiglia su un’abitudine di preghiera per le prossime settimane (per esempio pregare prima di cena o benedire i figli prima di dormire). Cominciate già oggi.",
ora:"Santa Famiglia di Nazaret, che celebravate insieme le feste di Dio, insegnate alla nostra famiglia a pregare unita. Che la nostra casa sia una piccola chiesa. Amen."},

{t:"Nelle difficoltà",ref:"Mt 2,13-15",v:"Giuseppe, destatosi, prese con sé il bambino e sua madre nella notte e fuggì in Egitto…",
exp:"Dopo la visita dei Magi, il re Erode vuole uccidere il bambino. Un angelo avverte Giuseppe in sogno, e lui, nel cuore della notte, prende Maria e Gesù e fugge in Egitto. La Santa Famiglia vive da profuga in una terra straniera fino alla morte di Erode.",
med:["La Santa Famiglia ha conosciuto la paura, la fretta, lo sradicamento e l’incertezza. Per questo comprende le difficoltà delle nostre case: i problemi economici, le malattie, i traslochi, i conflitti.","Giuseppe non si è lasciato paralizzare dalla paura: ha ascoltato Dio e ha agito. Nelle difficoltà la preghiera non fa sparire subito il problema, ma ci mostra il passo successivo."],
perg:"Qual è oggi la difficoltà più grande della mia casa? Quale prossimo passo mi sta mostrando Dio?",
des:"Scrivi su un foglietto la difficoltà più grande della tua famiglia, mettilo ai piedi di un’immagine della Santa Famiglia (o nella tua Bibbia) e prega per questo. Fai un passo concreto per affrontarla, anche piccolo.",
ora:"Santa Famiglia, che avete conosciuto l’esilio e la paura, aiutateci nelle nostre difficoltà. San Giuseppe, guida la nostra famiglia sulla strada giusta. Amen."},

{t:"Cercare Gesù insieme",ref:"Lc 2,43-46",v:"Dopo tre giorni lo trovarono nel tempio, seduto in mezzo ai dottori, mentre li ascoltava e li interrogava.",
exp:"Tornando da Gerusalemme, Maria e Giuseppe si accorgono che Gesù non è con loro. Tornano indietro e lo cercano per tre giorni, finché lo trovano nel Tempio, la casa di Dio. Non si sono arresi: lo hanno cercato insieme finché non l’hanno trovato.",
med:["A volte tutta la famiglia si distrae e perde di vista Gesù nella corsa di ogni giorno. Succede a tutti; è successo perfino alla Santa Famiglia.","Il segreto è cercarlo insieme, e nel posto giusto: nella casa di Dio, nella preghiera, nella Parola. Una famiglia che cerca Gesù unita lo trova sempre."],
perg:"Come può la mia famiglia cercare Gesù insieme questa settimana?",
des:"Entrate insieme in una chiesa, anche solo per cinque minuti, oppure andate a Messa in famiglia. Se possibile, lasciate che i bambini accendano un lumino e affidino a Gesù una richiesta.",
ora:"Gesù, che la nostra famiglia ti cerchi e ti trovi sempre. Quando ci perdiamo, riportaci alla casa del Padre. Amen."},

{t:"Il silenzio di Nazaret",ref:"1Re 19,11-13",v:"Dopo il fuoco ci fu il mormorio di un vento leggero.",
exp:"Il profeta Elia, stanco e impaurito, si nasconde in una caverna sul monte Oreb. Dio gli chiede di uscire per incontrarlo. Passa un vento impetuoso, poi un terremoto e un fuoco, ma Dio non è in essi. Poi arriva una brezza leggera, ed è lì che Elia avverte la presenza di Dio e si copre il volto.",
med:["Spesso Dio parla piano, come una brezza leggera. La casa di Nazaret era semplice e silenziosa, ed è in quel silenzio che la Santa Famiglia ascoltava la voce di Dio.","Le nostre case sono piene di rumore: TV, telefoni, fretta. Un po’ di silenzio in famiglia aiuta ad ascoltare Dio e anche ad ascoltarci gli uni gli altri."],
perg:"Quale rumore potrei ridurre in casa per ascoltare meglio Dio?",
des:"Fate oggi cinque minuti di silenzio in famiglia, con gli schermi spenti (anche prima di dormire, con una candela accesa). Concludete con un Padre Nostro recitato molto lentamente.",
ora:"Signore, insegnaci a fare silenzio per ascoltarti. Che la nostra casa, come quella di Nazaret, sia un luogo di pace dove si ascolta la tua voce. Amen."},

{t:"Consacrare la mia famiglia",ref:"Col 3,12-17",v:"E la pace di Cristo regni nei vostri cuori, perché ad essa siete stati chiamati in un solo corpo. E siate riconoscenti!",
exp:"San Paolo descrive la vita di chi appartiene a Cristo: rivestirsi di misericordia, bontà, umiltà, mitezza e pazienza; sopportarsi e perdonarsi a vicenda; e, sopra ogni cosa, avere l’amore. È la lettura che la Chiesa proclama nella festa della Santa Famiglia.",
med:["Ecco il ritratto di una famiglia cristiana: non una famiglia perfetta, ma una famiglia che si perdona, si sopporta con pazienza e lascia che la pace di Cristo guidi ogni cosa.","Alla fine di questi dieci giorni, puoi consacrare la tua casa alla Santa Famiglia, chiedendo a Gesù, Maria e Giuseppe di abitare con voi e di guidare ogni vostro passo."],
perg:"Come è cambiato il mio sguardo sulla mia famiglia in questi dieci giorni?",
des:"Riunisci la famiglia e recitate insieme la consacrazione della casa alla Santa Famiglia (scheda Pregare). Se qualcuno è ferito, approfittatene per chiedere e offrire perdono prima della preghiera.",
ora:"Gesù, Giuseppe e Maria, vi consacro la mia famiglia. Riempite i nostri cuori della pace di Cristo. Fate della nostra casa un luogo di amore, di perdono e di gratitudine. Amen."}
]};

P.gratidao14={resumo:"Due settimane per allenare lo sguardo e riempire la casa di gratitudine, dalle cose grandi a quelle più piccole. Ogni giorno trovi una lettura spiegata, una meditazione, uno spazio per scrivere e una sfida di gratitudine.",d:[
{t:"Non dimenticare i suoi benefici",ref:"Sal 103,1-5",v:"Benedici il Signore, anima mia, non dimenticare tanti suoi benefici.",
exp:"In questo salmo, il salmista parla alla propria anima e la invita a benedire Dio. Poi elenca ciò che Dio fa: perdona le colpe, guarisce le malattie, strappa alla morte, circonda di amore e di misericordia, sazia di beni. La gratitudine nasce dal ricordare.",
med:["Dimentichiamo in fretta il bene ricevuto e ricordiamo a lungo ciò che è andato storto. La gratitudine è un esercizio di memoria: riportare al cuore ciò che Dio ha già fatto.","Chi ricorda i benefici di Dio si lamenta meno, si fida di più e guarda la vita con occhi nuovi."],
perg:"Per quali benefici di Dio ho dimenticato di ringraziare?",
des:"Comincia oggi la tua lista della gratitudine: scrivi qui sotto almeno cinque cose per cui sei grata. Ci tornerai nel corso di questi 14 giorni.",
ora:"Con tutta l’anima ti benedico, Signore. Grazie per tutto il bene che mi fai. Che io non dimentichi mai i tuoi benefici. Amen."},

{t:"Per la mia vita",ref:"Sal 139,13-16",v:"Ti lodo, perché mi hai fatto come un prodigio; sono stupende le tue opere…",
exp:"Il salmista riconosce che Dio lo conosce fin dal grembo della madre. È stato Dio a formarlo, a vedere ogni tappa della sua crescita e ad avere tutti i suoi giorni scritti nel suo libro. Di fronte a questo, non resta che lodare.",
med:["La tua vita non è un caso. Dio ti ha formata con tenerezza, ti conosce fino in fondo e ti ama così come sei.","Spesso siamo dure con noi stesse. Oggi guardati con gli occhi di Dio e ringrazia di esistere, per il tuo corpo, per i tuoi doni e per la tua storia."],
perg:"Per che cosa, in me, faccio fatica a ringraziare? Come lo vede Dio?",
des:"Scrivi tre qualità o doni che Dio ti ha dato. Davanti allo specchio, di’ ad alta voce: «Grazie, Signore, perché mi hai creata con amore e sono opera delle tue mani».",
ora:"Signore, ti lodo perché mi hai creata con tanto amore. Grazie per la mia vita e per ogni giorno che mi doni. Amen."},

{t:"Per la nostra casa",ref:"Is 32,15-18",v:"Il mio popolo abiterà in una dimora di pace, in abitazioni tranquille, in luoghi sicuri…",
exp:"Il profeta annuncia un tempo in cui lo Spirito sarà effuso dall’alto e il deserto diventerà un giardino. Il frutto di quel tempo sarà la giustizia e la pace, e il popolo di Dio abiterà in dimore sicure e tranquille.",
med:["Non importa quanto sia grande o in che stato sia la tua casa: è il tuo rifugio, il luogo dove la tua famiglia si ritrova, riposa e si vuole bene.","Ringraziare per la casa cambia il modo di prendersene cura. Ciò che vediamo come un dono lo trattiamo con tenerezza, non come un peso."],
perg:"Per che cosa sono più grata nella mia casa, anche con le sue imperfezioni?",
des:"Percorri la casa e, in ogni stanza, ringrazia Dio per qualcosa che vi accade (i pasti in cucina, il riposo in camera, le risate in soggiorno). Se puoi, benedici ogni stanza con l’acqua santa.",
ora:"Signore, grazie per la casa che ci hai donato. Che sia sempre una dimora di pace, dove tu sei il benvenuto. Amen."},

{t:"Rendere grazie in ogni cosa",ref:"1Ts 5,16-18",v:"in ogni cosa rendete grazie; questa è infatti la volontà di Dio in Cristo Gesù verso di voi.",
exp:"San Paolo scrive alla comunità di Tessalonica, che stava attraversando persecuzioni, e dà tre consigli brevi: essere sempre lieti, pregare incessantemente e rendere grazie in ogni circostanza. Dice che questa è la volontà di Dio per noi.",
med:["Rendere grazie in ogni circostanza non è far finta che vada tutto bene. È fidarsi che Dio è presente in tutte le cose, anche in quelle difficili.","La gratitudine costante trasforma il cuore. Più ringraziamo, più ci accorgiamo dei motivi per ringraziare."],
perg:"In quale situazione difficile posso cominciare a ringraziare, anche senza capire?",
des:"Oggi ringrazia ad alta voce almeno tre volte, per cose semplici, nel momento stesso in cui accadono (un caffè caldo, il traffico scorrevole, un abbraccio). Annota qui sotto quali sono state.",
ora:"Signore, che io impari a renderti grazie in ogni circostanza, perché so che sei con me in tutto. Amen."},

{t:"Per i figli e per tutti i bambini",ref:"Sal 127,1-3",v:"Ecco, dono del Signore sono i figli, è sua grazia il frutto del grembo.",
exp:"Il salmo comincia ricordando che, se il Signore non costruisce la casa, invano vi faticano i costruttori. Tutto è dono di Dio, e i figli sono presentati come eredità e ricompensa: doni che Dio affida ai genitori.",
med:["I figli sono un dono, anche nei giorni di capricci, stanchezza e preoccupazione. Non sono nostri: sono di Dio, affidati a noi per un tempo.","Se non hai ancora figli, o se hai figli spirituali, nipoti, figliocci, alunni, puoi anche tu ringraziare per i bambini che Dio mette sul tuo cammino."],
perg:"Per che cosa ringrazio in ogni bambino che Dio ha messo nella mia vita?",
des:"Di’ a ciascuno dei tuoi figli (o a un bambino a cui vuoi bene): «Ringrazio Dio per te», e spiegagli perché. Scrivi qui sotto come ha reagito ciascuno.",
ora:"Grazie, Signore, per ogni bambino che mi hai affidato. Costruisci tu la nostra casa e custodisci i nostri piccoli. Amen."},

{t:"Per il pane quotidiano",ref:"Mt 14,15-21",v:"prese i cinque pani e i due pesci e, alzati gli occhi al cielo, pronunziò la benedizione…",
exp:"Una folla segue Gesù in un luogo deserto, e arriva la sera senza niente da mangiare. I discepoli hanno solo cinque pani e due pesci. Gesù prende il poco che c’è, rende grazie e lo benedice. Tutti mangiano e avanzano ancora dodici ceste.",
med:["Gesù ha ringraziato prima di moltiplicare. La gratitudine per il poco apre lo spazio all’azione di Dio. La tavola, per quanto semplice, è un luogo di benedizione.","Quante mani hanno lavorato perché il cibo arrivasse sulla tua tavola? Ringraziare per il cibo è anche ricordarsi di chi non ne ha."],
perg:"Com’è la mia tavola: un luogo di gratitudine o di fretta?",
des:"Recita oggi con la tua famiglia la preghiera prima dei pasti. Se puoi, metti da parte qualche alimento da donare a chi ha bisogno o alla Caritas della tua parrocchia.",
ora:"Grazie, Signore, per il cibo sulla nostra tavola e per le mani che lo hanno preparato. Benedici la nostra famiglia riunita e non dimenticare chi oggi non ha da mangiare. Amen."},

{t:"Anche per le difficoltà",ref:"Rm 8,28-31",v:"noi sappiamo che tutto concorre al bene di coloro che amano Dio",
exp:"San Paolo scrive ai Romani sulla speranza cristiana. Afferma che Dio opera in tutte le cose, anche nella sofferenza, per il bene di chi lo ama. E conclude che, se Dio è dalla nostra parte, nessuno potrà davvero essere contro di noi.",
med:["Alcune delle cose che ci hanno fatto crescere di più sono state difficili da vivere. Dio non vuole il male, ma è capace di trarne del bene.","Ringraziare per le difficoltà non significa amare la sofferenza, ma riconoscere che Dio non ci ha abbandonate e che ne siamo uscite cambiate."],
perg:"Quale difficoltà del mio passato mi ha portato qualcosa di buono?",
des:"Scrivi qui sotto una difficoltà che hai vissuto e il bene che ti ha portato (una lezione, un’amicizia, più fede). Ringrazia Dio per essere stato con te in quel periodo.",
ora:"Signore, grazie anche per le difficoltà che mi hanno fatto crescere. So che sei dalla mia parte, e con te non ho nulla da temere. Amen."},

{t:"Per le amicizie",ref:"Rt 1,14-17",v:"perché dove andrai tu andrò anch'io; dove ti fermerai mi fermerò; il tuo popolo sarà il mio popolo e il tuo Dio sarà il mio Dio…",
exp:"Noemi perde il marito e i due figli e decide di tornare nella sua terra. Chiede alle nuore di restare con le loro famiglie. Orpa la saluta, ma Rut si stringe a lei e promette di accompagnarla per sempre. Da quella fedeltà nasce una storia nuova: Rut sarà la bisnonna del re Davide.",
med:["L’amicizia tra Rut e Noemi mostra che il vero amore resta, anche quando sarebbe più facile andarsene. Le amicizie fedeli sono un dono raro di Dio.","Pensa alle donne che ti sono state accanto nei momenti difficili. Sono state segni della cura di Dio per te."],
perg:"Quali amiche sono state una «Rut» nella mia vita?",
des:"Manda un messaggio di gratitudine a un’amica, dicendole concretamente perché ringrazi Dio per lei. Prega anche per un’amica che sta attraversando un momento difficile.",
ora:"Grazie, Signore, per le amiche che hai messo sul mio cammino. Benedici ciascuna di loro e rendi anche me un’amica fedele. Amen."},

{t:"Per i genitori e i nonni",ref:"Sir 3,2-6",v:"Chi onora il padre espia i peccati; chi riverisce la madre è come chi accumula tesori.",
exp:"Il libro del Siracide insegna come vivere il quarto comandamento. Onorare il padre e la madre porta benedizione, perdono e gioia. Più avanti (Sir 3,12-14), chiede pazienza con i genitori anziani, anche quando la loro mente si indebolisce. È una delle letture della festa della Santa Famiglia.",
med:["Dai nostri genitori e nonni abbiamo ricevuto la vita e, spesso, la fede. Anche con i loro errori e limiti, c’è tanto per cui ringraziare.","Se il rapporto con i genitori è difficile, la gratitudine può cominciare da qualcosa di piccolo. E se sono già tornati al Padre, la preghiera è il modo più bello per ringraziarli."],
perg:"Che cosa ho ricevuto dai miei genitori e dai miei nonni per cui voglio ringraziare?",
des:"Telefona o vai a trovare i tuoi genitori o i tuoi nonni e ringraziali per qualcosa di concreto. Se non ci sono più, prega per loro oggi e, se puoi, fai celebrare una Messa in suffragio.",
ora:"Grazie, Signore, per i miei genitori e i miei nonni. Benedici quelli che sono ancora con noi e accogli nella tua pace quelli che ci hanno preceduto. Amen."},

{t:"Per il dono della fede",ref:"Ef 2,4-10",v:"Per questa grazia infatti siete salvi mediante la fede; e ciò non viene da voi, ma è dono di Dio…",
exp:"San Paolo ricorda agli Efesini che Dio, ricco di misericordia, ci ha fatti rivivere con Cristo quando eravamo morti per il peccato. La salvezza non è una nostra conquista: è grazia, un dono gratuito, ricevuto per mezzo della fede.",
med:["La fede non è un nostro merito: è un dono di Dio. Spesso ci è arrivata attraverso le mani di qualcuno: una nonna che pregava, una catechista, un’amica.","Ringraziare per la fede è anche prendersene cura, nutrendola con la preghiera, la Parola e i sacramenti, e trasmetterla."],
perg:"Chi mi ha insegnato a pregare e a credere? Come posso trasmettere la fede?",
des:"Ringrazia Dio per le persone che ti hanno insegnato la fede e, se possibile, dillo a una di loro. Recita il Credo lentamente, ringraziando per ogni verità che professa.",
ora:"Grazie, Signore, per il dono della fede. Accresci la mia fede e fa’ di me una testimone del tuo amore per la mia famiglia. Amen."},

{t:"Per le piccole cose",ref:"Mt 6,25-34",v:"Osservate come crescono i gigli del campo: non lavorano e non filano.",
exp:"Nel Discorso della Montagna, Gesù ci chiede di non vivere in ansia per che cosa mangiare o indossare. Indica gli uccelli e i fiori: il Padre se ne prende cura con tenerezza. Se ha tanta cura dei fiori, quanto più di noi. E conclude invitandoci a cercare prima di tutto il Regno di Dio.",
med:["Gesù era attento alle piccole cose: i fiori, gli uccelli, il lievito, un seme. Dio parla anche nella semplicità.","La preoccupazione ci ruba lo sguardo. Chi si fida della cura del Padre riesce a vedere le piccole gioie sparse nella giornata."],
perg:"Quali piccole gioie di oggi stavo per lasciarmi sfuggire?",
des:"Fotografa o annota tre piccole gioie di oggi (un fiore, il sole alla finestra, la risata di qualcuno). Stasera, prima di dormire, ringrazia per ciascuna.",
ora:"Grazie, Signore, per le piccole gioie della giornata. Togli da me la preoccupazione e insegnami a fidarmi della tua cura di Padre. Amen."},

{t:"Per l’Eucaristia",ref:"Lc 22,14-20",v:"Poi, preso un pane, rese grazie, lo spezzò e lo diede loro dicendo: «Questo è il mio corpo che è dato per voi; fate questo in memoria di me».",
exp:"Nell’Ultima Cena, prima della sua Passione, Gesù celebra la Pasqua con gli apostoli. Prende il pane e il vino, rende grazie e li dona come suo Corpo e suo Sangue. Chiede di fare questo in memoria di lui. È l’istituzione dell’Eucaristia.",
med:["La parola «Eucaristia» significa rendimento di grazie. La Messa è il più grande grazie che esista: in essa uniamo la nostra gratitudine al grazie di Gesù al Padre.","Gesù ha voluto restare con noi in modo reale e semplice, in un pezzo di pane. Che dono! La gratitudine per questo dono ci fa desiderare sempre di più di stare con lui."],
perg:"Come sto vivendo la Messa? È per me un momento di gratitudine?",
des:"Vai a Messa (anche in un giorno feriale) con l’intenzione di ringraziare. Se non puoi, fai la Comunione spirituale e resta cinque minuti a ringraziare Gesù per la sua presenza nell’Eucaristia.",
ora:"Grazie, Gesù, perché resti con noi nell’Eucaristia. Che ogni Messa sia per me un grande rendimento di grazie. Amen."},

{t:"Tornare a ringraziare",ref:"Lc 17,11-19",v:"Uno di loro, vedendosi guarito, tornò indietro lodando Dio a gran voce; e si gettò ai piedi di Gesù per ringraziarlo.",
exp:"In cammino verso Gerusalemme, Gesù incontra dieci lebbrosi che gridano chiedendo pietà. Dice loro di presentarsi ai sacerdoti e, lungo la strada, guariscono tutti. Ma solo uno torna a ringraziare, ed era un samaritano, uno straniero. Gesù chiede se non erano stati guariti in dieci, e dove siano gli altri nove.",
med:["È facile chiedere e dimenticarsi di ringraziare. I nove sono stati guariti nel corpo, ma quello che è tornato ha ricevuto qualcosa di più: si è sentito dire da Gesù che la sua fede lo aveva salvato.","Tornare a ringraziare rende più profonda la relazione con Dio. La gratitudine ci avvicina a chi ci ha fatto il dono."],
perg:"Per quale preghiera esaudita non sono ancora tornata a ringraziare?",
des:"Guarda le tue richieste nella scheda Pregare (o ricorda le preghiere esaudite) e scegli una grazia ricevuta. Torna a ringraziare: prega, scrivi qui sotto il tuo grazie e, se vuoi, racconta la tua testimonianza a qualcuno.",
ora:"Signore, torno a ringraziarti per le grazie ricevute. Non voglio essere come i nove che hanno dimenticato. Grazie, Gesù. Amen."},

{t:"Grandi cose",ref:"Lc 1,46-55",v:"Grandi cose ha fatto in me l'Onnipotente e Santo è il suo nome",
exp:"Maria, nella casa di Elisabetta, canta il Magnificat, il suo grande inno di gratitudine. Riconosce che Dio ha guardato la sua piccolezza e ha compiuto in lei meraviglie. E ricorda che Dio è fedele alle sue promesse, di generazione in generazione.",
med:["Alla fine di queste due settimane, fai come Maria: guarda indietro e riconosci le grandi cose che Dio ha fatto in te e nella tua famiglia.","La gratitudine non deve finire qui. Può diventare un modo di vivere: uno sguardo allenato a vedere Dio in tutto."],
perg:"Che cosa è cambiato in me in queste due settimane di gratitudine?",
des:"Rileggi la tua lista della gratitudine del primo giorno e aggiungi ciò che hai scoperto in questi 14 giorni. Recita il Magnificat (scheda Pregare) e scegli un’abitudine di gratitudine da continuare, come ringraziare per tre cose prima di dormire.",
ora:"Con Maria ti lodo, Signore, perché hai fatto meraviglie nella mia vita. Grazie, Signore, per tutto. Amen."}
]};

})();

// 21 giorni pregando per i miei figli: versione completa
(function(){
var D=[
{t:"Affidare i miei figli a Dio",ref:"1Sam 1,20-28",v:"Per questo fanciullo ho pregato e il Signore mi ha concesso la grazia che gli ho chiesto. Perciò anch'io lo dò in cambio al Signore",
exp:"Anna non riusciva ad avere figli e pregò con molte lacrime nel santuario di Silo. Dio la ascoltò, e lei diede alla luce Samuele. Quando il bambino fu un po’ cresciuto, Anna lo portò nella casa del Signore e lo consacrò al Signore per tutta la vita. Samuele divenne un grande profeta.",
med:["I figli sono un dono di Dio, non una nostra proprietà. Anna lo aveva capito: ciò che aveva ricevuto da Dio, lo restituì a Dio. E non perse suo figlio; gli donò il destino più bello possibile.","Affidare i figli a Dio ci toglie il peso di dover controllare tutto. Continuiamo a prenderci cura di loro, a educarli e a proteggerli, ma sapendo che c’è un Padre che li ama ancora più di noi."],
perg:"Che cosa sto cercando di controllare nella vita dei miei figli e ho bisogno di affidare a Dio?",
des:"Scrivi il nome di ogni figlio su un foglio (o su un cartoncino per ciascuno) e, accanto, la frase: «Signore, questo figlio (questa figlia) è tuo». Stasera, prima che vadano a dormire, traccia un segno di croce sulla fronte di ciascuno.",
ora:"Signore, ti affido i miei figli. Sono tuoi prima ancora di essere miei. Prenditi cura di loro, guidali e fa’ di loro ciò che hai sognato. Amen."},

{t:"La fede che passa da mamma a figlio",ref:"2Tm 1,3-7",v:"Mi ricordo infatti della tua fede schietta, fede che fu prima nella tua nonna Lòide, poi in tua madre Eunìce",
exp:"San Paolo scrive al giovane Timoteo, che ama come un figlio. Gli ricorda che la sua fede è nata in casa, con la nonna e con la mamma. E lo incoraggia a ravvivare il dono di Dio che è in lui, perché Dio non ci ha dato uno spirito di paura, ma di forza, di amore e di saggezza.",
med:["La fede si impara prima di tutto in casa: in braccio alla mamma, nelle preghiere della sera, con l’esempio. Nessun catechismo può sostituire il vedere la mamma che prega.","Loide ed Eunice forse non immaginavano di stare formando un vescovo e un santo. Ogni piccola preghiera che reciti con i tuoi figli è un seme che Dio farà crescere a suo tempo."],
perg:"Come mi vedono i miei figli vivere la fede ogni giorno?",
des:"Oggi lascia che i tuoi figli ti vedano pregare: un momento sul divano con la Bibbia, un Rosario, una preghiera prima di mangiare. Se ti chiedono qualcosa, racconta loro perché preghi.",
ora:"Signore, che la mia fede sia sincera come quella di Loide ed Eunice, e che i miei figli la ricevano in eredità. Amen."},

{t:"La protezione di Dio",ref:"Sal 91,9-16",v:"Egli darà ordine ai suoi angeli di custodirti in tutti i tuoi passi.",
exp:"Il Salmo 91 è la preghiera fiduciosa di chi si rifugia in Dio. Promette che nessun male avrà la meglio su chi confida nel Signore e che gli angeli lo porteranno sulle loro mani, perché il suo piede non inciampi. Alla fine è Dio stesso a parlare: poiché a lui si è legato, lo libererà.",
med:["Ogni mamma sa di non poter essere ovunque: a scuola, per strada, sul telefono, tra gli amici. E questo può creare tanta ansia.","Dio ha messo un angelo custode accanto a ciascuno dei tuoi figli. Pregare per la loro protezione è fidarsi che non sono soli quando tu non sei vicina."],
perg:"Che paura ho per la sicurezza dei miei figli? Riesco ad affidarla a Dio?",
des:"Insegna ai tuoi figli (o recita insieme a loro) la preghiera all’Angelo custode. Mettetevi d’accordo per recitarla insieme ogni sera fino alla fine di questo percorso.",
ora:"Angelo di Dio, che sei il mio custode illumina, custodisci, reggi e governa me che ti fui affidato dalla pietà celeste. Amen.\nSignore, proteggi i miei figli lungo tutte le loro strade. Amen."},

{t:"Salute del corpo e dell’anima",ref:"Mc 5,21-24.35-43",v:"Non temere, continua solo ad aver fede!",
exp:"Giairo, capo della sinagoga, si getta ai piedi di Gesù: la sua figlioletta di dodici anni sta morendo. Lungo la strada arrivano a dirgli che è già morta. Gesù dice a Giairo di non avere paura, ma soltanto di avere fede. Entra in casa, prende la bambina per mano e le dice di alzarsi. E lei si alza.",
med:["Ogni mamma conosce l’angoscia di un figlio malato. Giairo non è rimasto a casa a piangere: è andato da Gesù, si è inginocchiato e ha chiesto. È ciò che possiamo fare anche noi a ogni febbre, a ogni esame, a ogni diagnosi.","A Gesù sta a cuore la salute del corpo e dell’anima dei nostri figli. E dice a noi ciò che ha detto a Giairo: non avere paura, abbi soltanto fede."],
perg:"C’è qualcosa nella salute dei miei figli (del corpo, della mente o dell’anima) che oggi mi preoccupa?",
des:"Stasera, mentre i tuoi figli dormono, posa la mano sul capo di ciascuno e prega per la sua salute, dicendo il suo nome e chiedendo ciò di cui ha bisogno.",
ora:"Gesù, tu hai preso per mano la figlia di Giairo. Prendi per mano anche i miei figli. Dona loro la salute del corpo, della mente e dell’anima. Amen."},

{t:"Un cuore buono",ref:"Lc 10,30-37",v:"Va' e anche tu fa' lo stesso",
exp:"Un dottore della Legge chiede a Gesù chi sia il suo prossimo. Gesù racconta di un uomo derubato e lasciato mezzo morto sulla strada. Un sacerdote e un levita passano oltre. Un samaritano, visto come un nemico, si ferma, cura le sue ferite e paga il suo alloggio. Gesù conclude invitando a fare lo stesso.",
med:["Più che figli «di successo», desideriamo figli buoni. In un mondo che insegna a competere e a pensare solo a sé, un cuore buono è un tesoro.","La bontà si insegna con piccoli gesti: dividere la merenda, consolare un compagno, aiutare in casa senza chiedere nulla in cambio. E si impara vedendo la mamma fermarsi ad aiutare qualcuno."],
perg:"In quali situazioni vedo bontà nei miei figli? Gliel’ho riconosciuto?",
des:"Fate insieme oggi un gesto di bontà per qualcuno: regalare un giocattolo, portare qualcosa a un vicino, scrivere un bigliettino a chi è triste. Poi parlate di come vi siete sentiti.",
ora:"Gesù, dona ai miei figli un cuore buono come quello del samaritano, che vede chi soffre e si ferma ad aiutare. Amen."},

{t:"Buone amicizie",ref:"1Sam 18,1-4",v:"l'anima di Giònata s'era già talmente legata all'anima di Davide, che Giònata lo amò come se stesso.",
exp:"Dopo la vittoria di Davide su Golia, Gionata, figlio del re Saul, stringe con lui un’amicizia profonda. Gionata dona a Davide il suo mantello, la sua spada e il suo arco, e i due fanno un patto. Più tardi Gionata proteggerà Davide perfino contro suo padre.",
med:["Le amicizie plasmano il cuore dei figli, a volte più dei genitori. Un buon amico aiuta a crescere; una cattiva compagnia può portare lontano.","Prega per gli amici dei tuoi figli, chiamandoli per nome. E chiedi che trovino amici come Gionata: leali, protettivi e capaci di avvicinarli a Dio."],
perg:"Conosco gli amici dei miei figli? Qualcuno mi preoccupa?",
des:"Chiedi ai tuoi figli dei loro amici, con curiosità e senza giudicare. Oggi prega per ogni amico, per nome. Se puoi, invita uno dei loro amici a fare merenda a casa.",
ora:"Signore, dona ai miei figli amici veri, che li aiutino a crescere nel bene. Tieni lontane da loro le cattive compagnie. Amen."},

{t:"Studio e sapienza",ref:"1Re 3,5-12",v:"Concedi al tuo servo un cuore docile perché sappia rendere giustizia al tuo popolo e sappia distinguere il bene dal male",
exp:"Dio appare in sogno al giovane re Salomone e lo invita a chiedere ciò che vuole. Salomone non chiede ricchezze, né una lunga vita, né la vittoria sui nemici. Chiede un cuore che sappia ascoltare, per distinguere il bene dal male. Dio ne è così contento che gli dona la sapienza e anche ciò che non aveva chiesto.",
med:["La sapienza va oltre i voti a scuola. È saper scegliere il bene, ascoltare i consigli giusti, pensare prima di agire. È un dono che si chiede a Dio.","Prega per lo studio dei tuoi figli, per la loro concentrazione, la memoria, gli insegnanti. Ma soprattutto chiedi per loro un cuore che sappia ascoltare."],
perg:"Che cosa desidero di più per i miei figli: il successo o la sapienza?",
des:"Prima della scuola (o dei compiti), recita con i tuoi figli la preghiera allo Spirito Santo. Chiedi loro: «Se Dio ti dicesse di chiedergli qualunque cosa, che cosa gli chiederesti?».",
ora:"Spirito Santo, dona ai miei figli un cuore che sappia ascoltare. Illumina il loro studio e insegna loro a scegliere il bene. Amen."},

{t:"Figli amati da Dio",ref:"Mc 1,9-11",v:"Tu sei il Figlio mio prediletto, in te mi sono compiaciuto",
exp:"Gesù va al fiume Giordano e si fa battezzare da Giovanni. Uscendo dall’acqua, vede i cieli aprirsi e lo Spirito scendere come una colomba. E una voce dal cielo lo chiama Figlio amato. Gesù non aveva ancora compiuto nessun miracolo: il Padre lo ama prima di qualsiasi cosa faccia.",
med:["Nel Battesimo, Dio ha detto la stessa cosa a ciascuno dei tuoi figli: sono suoi figli amati. Questo amore non dipende dai voti, dal comportamento o dai traguardi.","Quando un bambino sa di essere amato senza condizioni, diventa più forte per affrontare il mondo. E impara a vedere Dio come Padre a partire da come viene amato in casa."],
perg:"I miei figli si sentono amati anche quando sbagliano?",
des:"Oggi guarda ciascun figlio negli occhi e digli: «Dio ti ama e io ti amo, così come sei». Se avete le foto del suo Battesimo, guardatele insieme e raccontagli com’è stato quel giorno.",
ora:"Padre, grazie perché i miei figli sono tuoi figli amati. Che sentano il tuo amore attraverso il mio. Amen."},

{t:"Obbedire con amore",ref:"Lc 2,41-52",v:"Partì dunque con loro e tornò a Nazaret e stava loro sottomesso … E Gesù cresceva in sapienza, età e grazia",
exp:"Dopo essere stato ritrovato nel Tempio, dove si era fermato a parlare con i maestri, Gesù torna a Nazaret con Maria e Giuseppe e vive obbediente a loro. Il Vangelo riassume quegli anni così: Gesù cresceva in sapienza, età e grazia davanti a Dio e agli uomini.",
med:["Perfino Gesù, il Figlio di Dio, obbediva a Maria e Giuseppe. L’obbedienza non è solo fare ciò che ci viene detto: è fidarsi di chi ci ama e ci guida.","L’obbedienza si insegna con fermezza e amore insieme. Regole chiare, spiegate con calma, mantenute con coerenza, e sempre con tanto affetto."],
perg:"In casa riesco a unire fermezza e tenerezza? Dove esagero e dove lascio correre?",
des:"Scegliete insieme, in famiglia, una o due regole di casa che fate fatica a rispettare. Spiegate perché sono importanti e accordatevi su come metterle in pratica. Oggi loda ogni gesto di obbedienza.",
