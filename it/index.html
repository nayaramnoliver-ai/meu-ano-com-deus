// Sfida di Avvento 2026 (dal 29 novembre al 24 dicembre): una giornata completa per ogni data, seguendo la liturgia della Chiesa (Anno B).
// Campi: t titolo · cel celebrazione del giorno · aviso (precetto o nota) · tipo/ref lettura scelta · v frase della lettura (la inserisce lo script di compilazione)
// exp che cosa dice la lettura · med meditazione (paragrafi) · perg domanda per il cuore · des sfida in famiglia · ora preghiera
(function(){
var D=[
{t:"Vegliare con il cuore sveglio",cel:"I Domenica di Avvento",vela:1,
aviso:"La domenica è giorno di precetto: partecipa alla Santa Messa. Oggi comincia un nuovo anno liturgico e si accende la prima candela della corona.",
tipo:"Vangelo",ref:"Mc 13,33-37",v:"Vigilate dunque, poiché non sapete quando il padrone di casa ritornerà",
exp:"Gesù racconta di un uomo che parte per un viaggio e lascia la casa ai suoi servi, ciascuno con il proprio compito. Al portiere dà un ordine speciale: restare sveglio. Nessuno sa quando il padrone tornerà. Nella prima lettura (Is 63–64), il popolo supplica Dio di squarciare i cieli e scendere.",
med:["L’Avvento contiene due attese. Aspettiamo il Natale, il ricordo della prima venuta di Gesù a Betlemme. E aspettiamo il suo ritorno glorioso, alla fine dei tempi. Vegliare è vivere tutte e due con il cuore sveglio.","Vegliare non è vivere nella paura. È avere cura della «casa» che Dio ci ha affidato: la famiglia, il lavoro, la fede. Il contrario di vegliare è vivere col pilota automatico, correndo tutto il giorno senza accorgersi che Dio passa nella nostra vita."],
perg:"In quale parte della mia vita sto «dormendo» e ho bisogno di svegliarmi per Dio?",
des:"Preparate insieme la corona dell’Avvento (basta un piatto con quattro candele e qualche rametto verde) e accendete la prima candela, quella della speranza. Spiega ai bambini: ogni domenica accendiamo una candela in più, finché arriva Gesù.",
ora:"Vieni, Signore Gesù! Trova la nostra casa sveglia e il nostro cuore pronto per te. Amen."},

{t:"Andrea porta il fratello a Gesù",cel:"Sant’Andrea, apostolo (festa)",
tipo:"Vangelo",ref:"Mt 4,18-22",v:"Seguitemi, vi farò pescatori di uomini",
exp:"Gesù cammina lungo il mare di Galilea e vede due fratelli, Simone (Pietro) e Andrea, che gettano le reti. Li chiama e loro, subito, lasciano le reti e lo seguono. Poco dopo chiama anche Giacomo e Giovanni. Il Vangelo di Giovanni racconta che fu Andrea a portare il fratello da Gesù, dicendogli che avevano trovato il Messia (Gv 1,41).",
med:["Andrea non fece grandi discorsi. Incontrò Gesù e corse a dirlo a chi amava. La fede si diffonde così: da persona a persona, di casa in casa.","In Avvento prepariamo la strada perché Gesù arrivi. Un modo bellissimo per farlo è portare qualcuno con noi: un invito a Messa, una parola di speranza, una preghiera per chi è lontano da Dio."],
perg:"Chi potrei avvicinare a Gesù in questo Natale?",
des:"Chiedi ai bambini: chi possiamo avvicinare a Gesù in questo Natale? Fate insieme un disegno o un bigliettino per quella persona e consegnatelo durante la settimana.",
ora:"Sant’Andrea, insegna alla nostra famiglia a portare vicino a Gesù le persone che amiamo. Amen."},

{t:"Un germoglio che nasce dal tronco",cel:"Martedì della I settimana di Avvento",
tipo:"Prima lettura",ref:"Is 11,1-10",v:"Un germoglio spunterà dal tronco di Iesse, un virgulto germoglierà dalle sue radici.",
exp:"Il profeta Isaia parla di un tronco tagliato: la famiglia del re Davide, figlio di Iesse, che sembrava finita. Da lì spunterà un germoglio pieno dello Spirito di Dio: sapienza, intelletto, consiglio, fortezza, scienza e timore di Dio. Con lui arriva una pace così grande che il lupo e l’agnello vivranno insieme.",
med:["Quel germoglio è Gesù. Dio fa nascere la vita proprio là dove sembrava non esserci più nulla. È lo stile di Dio: non ha bisogno che tutto sia perfetto per agire.","Forse anche tu hai nella tua vita un «tronco tagliato»: un sogno, una relazione, una speranza che sembra morta. L’Avvento ci invita a guardarlo con fede, perché è proprio da lì che Dio può far germogliare qualcosa di nuovo."],
perg:"Quale «tronco tagliato» della mia vita voglio affidare a Dio perché lo faccia germogliare di nuovo?",
des:"Piantate insieme un seme (va bene un fagiolo nel cotone bagnato) e curatelo fino a Natale. Ogni volta che lo guardate, ricordate: Dio fa nascere vita nuova.",
ora:"Signore, fa’ germogliare vita nuova dove avevo perso la speranza. Il tuo Spirito riposi sulla nostra casa. Amen."},

{t:"Dio asciugherà le lacrime",cel:"Mercoledì della I settimana di Avvento",
tipo:"Prima lettura",ref:"Is 25,6-10a",v:"il Signore Dio asciugherà le lacrime su ogni volto",
exp:"Isaia descrive una grande festa sul monte, preparata da Dio per tutti i popoli, con cibi squisiti e vini raffinati. In quel giorno Dio eliminerà la morte per sempre e asciugherà le lacrime da ogni volto. Nel Vangelo del giorno (Mt 15,29-37), Gesù guarisce molti malati e moltiplica i pani per la folla.",
med:["Dio non è indifferente alla nostra stanchezza né alle nostre lacrime. Prepara una tavola, si prende cura di noi e ci nutre. Gesù lo ha mostrato avendo compassione di una folla affamata.","La Messa è già oggi un pezzetto di quella festa: Dio ci chiama alla sua tavola e ci nutre con il suo stesso Corpo. Anche ogni semplice pasto in famiglia può diventare un luogo di incontro con Lui."],
perg:"Quale mia lacrima non ho ancora lasciato asciugare da Dio?",
des:"Stasera a cena pregate insieme prima di mangiare e ognuno racconti una cosa bella della giornata. Apparecchiate con un po’ di cura in più, come quando si aspetta un ospite speciale.",
ora:"Signore, tu prepari la tavola e asciughi le lacrime. Accogli la mia stanchezza e riempi la nostra casa della tua pace. Amen."},

{t:"La casa costruita sulla roccia",cel:"San Francesco Saverio, sacerdote (memoria)",
tipo:"Vangelo",ref:"Mt 7,21.24-27",v:"Perciò chiunque ascolta queste mie parole e le mette in pratica, è simile a un uomo saggio che ha costruito la sua casa sulla roccia.",
exp:"Gesù paragona due case. Tutte e due affrontano pioggia, piene e vento. Una resta in piedi perché è costruita sulla roccia; l’altra crolla perché è costruita sulla sabbia. La differenza non sta nell’ascoltare la Parola, ma nel metterla in pratica.",
med:["Ogni casa attraversa delle tempeste: malattie, soldi che non bastano, litigi, stanchezza. Non possiamo scegliere se verrà la pioggia. Possiamo scegliere su che cosa poggia la nostra casa.","San Francesco Saverio, che oggi ricordiamo, ha portato il Vangelo fino in India e in Giappone. Non si è limitato ad ascoltare Gesù: ha vissuto la Parola fino alla fine. Costruire sulla roccia è questo: un piccolo passo concreto alla volta."],
perg:"Quale parola di Dio conosco già, ma non ho ancora messo in pratica?",
des:"Disegnate insieme una casetta e dentro ogni mattone scrivete un modo per vivere la Parola in casa: perdonare, aiutare, pregare, dire grazie. Mettetela vicino alla corona dell’Avvento.",
ora:"Gesù, sii la roccia della nostra casa. La tua Parola non resti solo nelle nostre orecchie, ma arrivi alle nostre mani. Amen."},

{t:"Credi che Gesù possa farlo?",cel:"Venerdì della I settimana di Avvento",
tipo:"Vangelo",ref:"Mt 9,27-31",v:"Credete voi che io possa fare questo? … Sì, o Signore!",
exp:"Due ciechi seguono Gesù gridando e chiedono pietà al Figlio di Davide. Insistono fino a entrare nella casa dove si trova Gesù. Prima di guarirli, Gesù chiede loro se credono. Rispondono di sì, e Gesù tocca i loro occhi: avviene secondo la loro fede. Nella prima lettura (Is 29,17-24), Isaia annuncia il giorno in cui gli occhi dei ciechi vedranno.",
med:["I ciechi non si sono arresi. Hanno seguito Gesù per la strada e sono entrati dietro di Lui in casa. La fede vera insiste, anche quando la risposta tarda ad arrivare.","Anche a noi oggi Gesù fa la stessa domanda, davanti a ciò che più ci pesa sul cuore: se crediamo che Lui possa. Rispondergli di sì, con fiducia, è il primo passo per vedere con occhi nuovi."],
perg:"Davanti alla mia richiesta più grande di oggi, riesco a dire con sincerità a Gesù che credo in Lui?",
des:"Giocate a mosca cieca per qualche minuto. Poi parlatene: com’è non vedere? Gesù è venuto a portare luce ai nostri occhi e al nostro cuore.",
ora:"Gesù, abbi pietà di me. Io credo, Signore, ma aumenta la mia fede. Apri i miei occhi perché possa vederti. Amen."},

{t:"Dio ci indica la strada",cel:"Sabato della I settimana di Avvento",
tipo:"Prima lettura",ref:"Is 30,19-21.23-26",v:"i tuoi orecchi sentiranno questa parola dietro di te: «Questa è la strada, percorretela»",
exp:"Isaia consola un popolo stanco: Dio ascolterà il suo grido e risponderà. Promette pioggia per i semi, pane in abbondanza e una luce forte come quella del sole. E promette di guidare il suo popolo con una voce che indica la strada. Nel Vangelo (Mt 9,35–10,8), Gesù vede le folle stanche, come pecore senza pastore, e manda gli apostoli.",
med:["Quante volte ci sentiamo perse, senza sapere quale decisione prendere? Dio promette di non lasciarci sole: parla, indica la strada, ci guida passo dopo passo.","Per ascoltare quella voce serve silenzio. Nella corsa di dicembre, l’Avvento ci chiede qualche minuto di silenzio con Dio ogni giorno, per ascoltare dove vuole che andiamo."],
perg:"Quale decisione devo affidare a Dio, chiedendogli di mostrarmi la strada?",
des:"Fate insieme una «strada» sul pavimento con nastri o fogli di carta, dalla cameretta fino al presepe (o alla corona). Ogni giorno le statuine di Maria e Giuseppe possono fare qualche passo su quella strada, fino a Natale.",
ora:"Signore, mostrami la tua strada e dammi il coraggio di percorrerla. Parla al mio cuore: voglio ascoltarti. Amen."},

{t:"Preparare la via del Signore",cel:"II Domenica di Avvento",vela:2,
aviso:"La domenica è giorno di precetto: partecipa alla Santa Messa. Oggi si accende la seconda candela della corona.",
tipo:"Vangelo",ref:"Mc 1,1-8",v:"preparate la strada del Signore, raddrizzate i suoi sentieri",
exp:"Il Vangelo di Marco comincia con Giovanni Battista nel deserto. Annuncia un battesimo di conversione e tanta gente va da lui, confessando i propri peccati. Giovanni è vestito di peli di cammello, mangia cavallette e miele selvatico e annuncia che dopo di lui viene uno più forte di lui. La prima lettura (Is 40,1-5.9-11) si apre con Dio che chiede di consolare il suo popolo.",
med:["Preparare la via è togliere ciò che ostacola l’arrivo di Gesù. Può essere un rancore custodito, un piccolo vizio, una riconciliazione rimandata. Le «buche» e le «montagne» della strada sono dentro di noi.","L’Avvento è un tempo bellissimo per la Confessione. Non è un peso: è il modo che Dio ha trovato per consolare il suo popolo, come dice Isaia. Informati sugli orari delle Confessioni nella tua parrocchia prima di Natale."],
perg:"Che cosa devo togliere dalla strada perché Gesù arrivi davvero al mio cuore in questo Natale?",
des:"Oggi è il giorno per «sistemare la strada»: ognuno in casa sceglie un angolo da riordinare (la cameretta, un cassetto, i giochi) e mette da parte qualcosa in buono stato da donare.",
ora:"Signore, raddrizza le strade storte del mio cuore. Donami la grazia di una buona Confessione in questo Avvento. Amen."},

{t:"Dal tetto, fino a Gesù",cel:"Sant’Ambrogio, vescovo e dottore della Chiesa (memoria)",
tipo:"Vangelo",ref:"Lc 5,17-26",v:"Uomo, i tuoi peccati ti sono rimessi",
exp:"Alcuni uomini portano su una barella un amico paralizzato, ma non riescono a entrare in casa per la folla. Allora salgono sul tetto, tolgono le tegole e calano l’amico proprio davanti a Gesù. Vedendo la loro fede, Gesù prima perdona i peccati di quell’uomo e poi lo guarisce. Nella prima lettura (Is 35,1-10), il deserto fiorisce e il profeta invita chi ha paura a farsi coraggio e a non temere.",
med:["Il malato è stato guarito grazie alla fede dei suoi amici. È bellissimo: a volte siamo noi la persona sulla barella, e a volte siamo gli amici che la portano.","La nostra preghiera può portare a Gesù chi non riesce ad arrivarci da solo: un figlio che si è allontanato, un marito senza fede, un’amica malata. Non smettere di «salire sul tetto» per le persone che ami."],
perg:"Chi sto portando nella preghiera? Chi devo cominciare a portare a Gesù?",
des:"Scrivete su un foglio i nomi delle persone che hanno bisogno di preghiera. Mettetelo vicino al presepe o alla corona e pregate insieme per loro, oggi, un’Ave Maria.",
ora:"Gesù, metto davanti a te le persone che amo e che hanno bisogno di te. Guarda la nostra fede e tocca la loro vita. Amen."},

{t:"Piena di grazia fin dall’inizio",cel:"Immacolata Concezione della Beata Vergine Maria (solennità)",
aviso:"Giorno di precetto: partecipa alla Santa Messa. Controlla gli orari nella tua parrocchia.",
tipo:"Vangelo",ref:"Lc 1,26-38",v:"Ti saluto, o piena di grazia, il Signore è con te",
exp:"Oggi la Chiesa celebra che Maria è stata preservata dal peccato originale fin dal primo istante della sua vita, per un dono speciale di Dio, per prepararla a essere la Madre di Gesù. Il Vangelo racconta la visita dell’angelo Gabriele a Maria. La prima lettura (Gen 3,9-15.20) ricorda il peccato di Adamo ed Eva e la promessa di Dio: la stirpe della donna vincerà il male.",
med:["L’angelo non chiama Maria per nome: la chiama «piena di grazia». È come se quello fosse il suo vero nome. In Maria non c’era alcuno spazio vuoto: tutto in lei era di Dio.","Noi non siamo immacolate, ma Dio guarda anche noi con amore e vuole riempirci della sua grazia. Attraverso la Confessione e l’Eucaristia continua a purificare e guarire il nostro cuore, perché Gesù vi trovi un posto preparato."],
perg:"Quale parte del mio cuore non ho ancora lasciato riempire dalla grazia di Dio?",
des:"Mettete un’immagine della Madonna in un posto speciale della casa, con un fiore o una candela. Pregate insieme il Rosario (o anche solo una decina) chiedendo la sua protezione per la famiglia.",
ora:"O Maria, concepita senza peccato, pregate per noi che ricorriamo a voi. Prepara il mio cuore ad accogliere Gesù, come Dio ha preparato il tuo. Amen."},

{t:"Con ali d’aquila",cel:"Mercoledì della II settimana di Avvento",
tipo:"Prima lettura",ref:"Is 40,25-31",v:"quanti sperano nel Signore riacquistano forza, mettono ali come aquile",
exp:"Isaia parla a un popolo convinto che Dio lo avesse dimenticato, e gli chiede se non lo sa, se non lo ha udito. Il Signore è il Dio eterno, creatore di tutto, che non si stanca e non si affatica. Dà forza a chi è stanco. Nel Vangelo del giorno (Mt 11,28-30), Gesù invita a venire a Lui tutti quelli che sono stanchi e oppressi.",
med:["Dicembre di solito è un mese faticoso, pieno di impegni, feste e spese. La Parola di oggi non dice che la stanchezza sparirà. Dice che chi spera nel Signore riacquista forza.","Sperare nel Signore è consegnargli il peso che non riusciamo a portare da sole. L’aquila non batte le ali di continuo: si lascia portare dal vento. Lascia che oggi Dio sia il vento che ti sostiene."],
perg:"Quale stanchezza sto portando da sola e devo consegnare a Dio oggi?",
des:"Oggi ognuno in casa sceglie un compito per alleggerire la fatica di un altro (lavare i piatti, apparecchiare, una carezza). Nessuno dice chi è stato: è un regalo nascosto.",
ora:"Signore, tu non ti stanchi mai. Accogli la mia stanchezza e rinnova le mie forze. Fa’ che io riposi in te. Amen."},

{t:"Dio ti prende per mano",cel:"Giovedì della II settimana di Avvento",
tipo:"Prima lettura",ref:"Is 41,13-20",v:"Poiché io sono il Signore tuo Dio che ti tengo per la destra e ti dico: «Non temere, io ti vengo in aiuto»",
exp:"Dio parla con tenerezza al suo popolo, che si sentiva piccolo e debole come un vermiciattolo. Promette di tenerlo per mano, di aprire fiumi sulle alture e di far crescere alberi nel deserto. Nel Vangelo (Mt 11,11-15), Gesù dice che tra i nati di donna non è sorto nessuno più grande di Giovanni Battista.",
med:["Dio non parla da lontano: ci tiene per mano, come una mamma tiene la mano del suo bambino in una strada affollata. È questa l’immagine dell’Avvento: un Dio che si fa vicino.","Quando oggi arriverà la paura, ricordati di questa promessa. Ripeti nel cuore che Dio ti tiene per mano e ti aiuta. È per te."],
perg:"Qual è la paura che più mi toglie la pace? Riesco a dare quella mano a Dio?",
des:"All’ora della nanna, prendi la mano di ciascun figlio e digli: «Dio ti tiene per mano. Non avere paura: Lui ti aiuta». Pregate insieme l’Angelo di Dio.",
ora:"Signore, tienimi per mano. Quando ho paura, ricordami che sei con me e mi aiuti. Amen."},

{t:"Dio insegna ciò che è bene",cel:"Venerdì della II settimana di Avvento",
tipo:"Prima lettura",ref:"Is 48,17-19",v:"Io sono il Signore tuo Dio che ti insegno per il tuo bene, che ti guido per la strada su cui devi andare.",
exp:"Dio si presenta come maestro e guida. Si lamenta perché, se il suo popolo avesse ascoltato i suoi comandamenti, la sua pace sarebbe stata come un fiume. Nel Vangelo (Mt 11,16-19), Gesù paragona la sua generazione a bambini che non accettano nessun gioco: non hanno ascoltato Giovanni, che digiunava, né Gesù, che mangiava con i peccatori.",
med:["Una pace come un fiume: che immagine bella! Non viene dal fatto che tutto vada bene, ma dal camminare sulla strada che Dio insegna. I comandamenti non sono un peso: sono la mappa della strada della pace.","A volte ci lamentiamo di tutto, come i bambini del Vangelo. L’Avvento ci invita a smettere di lamentarci e ad ascoltare: che cosa sta cercando di insegnarmi Dio attraverso questa situazione?"],
perg:"Che cosa sta cercando di insegnarmi Dio con ciò che oggi mi dà fastidio?",
des:"Fate la «giornata senza lamentele»: chi si lamenta trasforma la lamentela in un grazie. A fine giornata contate quanti grazie sono venuti fuori.",
ora:"Signore, insegnami ciò che è bene e guidami sulla tua strada. La tua pace scorra nella nostra casa come un fiume. Amen."},

{t:"La Madre che ci viene incontro",cel:"Beata Vergine Maria di Guadalupe, Patrona delle Americhe (memoria facoltativa)",
tipo:"Prima lettura",ref:"Zc 2,14-17",v:"Gioisci, esulta, figlia di Sion, perché, ecco, io vengo ad abitare in mezzo a te",
exp:"Il profeta Zaccaria annuncia che Dio viene ad abitare in mezzo al suo popolo, e molte nazioni si uniranno a Lui. Nel 1531, in Messico, la Madonna apparve a san Juan Diego, un indio semplice, e lasciò la sua immagine impressa sul suo mantello (la tilma). Nel Vangelo (Lc 1,39-47), Maria va in fretta a visitare Elisabetta, portando Gesù nel grembo.",
med:["A Guadalupe Maria appare incinta, con una fascia in vita. Viene portando Gesù. È sempre così: Maria non attira mai l’attenzione su di sé; ci conduce a Gesù.","Juan Diego si sentiva piccolo e senza importanza. La Madonna gli disse: «Non sono forse qui io, che sono tua madre?». Queste parole valgono per te oggi, in qualunque preoccupazione."],
perg:"Quale preoccupazione voglio mettere oggi in grembo alla Madonna?",
des:"Raccontate ai bambini la storia di Juan Diego e delle rose fiorite in pieno inverno. Disegnate insieme un mantello pieno di rose e scriveteci sopra: «Non sono forse qui io, che sono tua madre?».",
ora:"Madonna di Guadalupe, Madre delle Americhe, copri la nostra famiglia con il tuo manto e conducici a Gesù. Amen."},

{t:"Gioia, perché il Signore è vicino",cel:"III Domenica di Avvento (Gaudete)",vela:3,
aviso:"La domenica è giorno di precetto: partecipa alla Santa Messa. Oggi si accende la terza candela, quella rosa, segno di gioia perché il Natale è vicino.",
tipo:"Vangelo",ref:"Gv 1,6-8.19-28",v:"Io sono voce di uno che grida nel deserto: Rendete diritta la via del Signore…",
exp:"I sacerdoti chiedono a Giovanni Battista chi sia. Lui risponde con umiltà: non è il Messia, né Elia, né il profeta. È soltanto «la voce» che annuncia qualcuno che è già in mezzo a loro. Nella seconda lettura (1Ts 5,16-24), san Paolo ci chiede di essere sempre lieti, di pregare senza sosta e di rendere grazie in ogni situazione.",
med:["La gioia cristiana non dipende dal fatto che tutto vada bene. Nasce dalla certezza che il Signore è vicino. Per questo, a metà Avvento, la Chiesa cambia colore, sceglie il rosa e ci chiama alla gioia.","Giovanni Battista era lieto perché indicava Gesù e non se stesso. Che anche la nostra vita sia una «voce» che indica Gesù, con più gentilezza, più pazienza e più sorrisi in casa."],
perg:"Che cosa mi sta rubando la gioia? Quale motivo ho oggi per ringraziare Dio?",
des:"Accendete la candela rosa e fate un «cerchio della gioia»: ognuno dice tre motivi per ringraziare Dio questa settimana. Oggi è anche Santa Lucia: se in famiglia la festeggiate, ricordate ai bambini che lei ha portato a tutti la luce di Gesù. Se potete, cantate insieme un canto di Natale.",
ora:"Signore, aiutami a vivere sempre nella gioia, a pregare senza stancarmi e a ringraziare in ogni cosa. Tu sei vicino. Amen."},

{t:"Una stella sorgerà",cel:"San Giovanni della Croce, sacerdote e dottore della Chiesa (memoria)",
tipo:"Prima lettura",ref:"Nm 24,2-7.15-17a",v:"Una stella spunta da Giacobbe e uno scettro sorge da Israele…",
exp:"Balaam, un profeta straniero, fu chiamato per maledire Israele, ma lo Spirito di Dio lo spinse a benedirlo. Vede da lontano una stella che spunterà da Giacobbe. La Chiesa riconosce in quella stella il Messia, Gesù. Nel Vangelo (Mt 21,23-27), i capi del popolo mettono in discussione l’autorità di Gesù.",
med:["Dio si serve perfino di chi meno ci aspettiamo per annunciare Gesù. E la stella di Balaam ci ricorda la stella che guidò i Magi fino a Betlemme.","San Giovanni della Croce, che oggi ricordiamo, ha attraversato grandi notti oscure dell’anima e anche così ha trovato Dio. Scrisse: «Alla sera della vita saremo giudicati sull’amore». Quando la tua notte è buia, cerca la stella: lì c’è Gesù."],
perg:"Quale «notte oscura» sto vivendo? Dove posso cercare in essa la stella di Dio?",
des:"Ritagliate insieme una stella di carta gialla e scriveteci sopra il nome di Gesù. Appendetela in alto sul presepe o sull’albero.",
ora:"Gesù, stella che brilla nella notte, illumina le mie strade buie e guida la nostra famiglia fino a te. Amen."},

{t:"Un popolo umile e fiducioso",cel:"Martedì della III settimana di Avvento",
tipo:"Prima lettura",ref:"Sof 3,1-2.9-13",v:"Farò restare in mezzo a te un popolo umile e povero; confiderà nel nome del Signore",
exp:"Il profeta Sofonia denuncia una città ribelle, che non ascolta Dio e non si fida di Lui. Ma annuncia che Dio purificherà il cuore del suo popolo e lascerà un «resto» umile, che confida in Lui. Nel Vangelo (Mt 21,28-32), Gesù racconta di due figli: uno dice «no» al padre, ma poi si pente e va a lavorare; l’altro dice «sì», ma non ci va.",
med:["Dio non cerca persone perfette, cerca persone umili. Il primo figlio aveva sbagliato, ma è tornato sui suoi passi. L’umiltà di riconoscere l’errore apre la porta a Dio.","A Natale Dio stesso si è fatto piccolo e povero, nascendo in una mangiatoia. Chi è umile capisce il Natale meglio di chiunque altro."],
perg:"C’è un «no» che ho detto a Dio e su cui sono ancora in tempo a tornare indietro?",
des:"Oggi è il giorno del chiedere scusa. Se qualcuno in casa ha ferito un altro durante la settimana, gli chieda perdono con un abbraccio. Mamma e papà possono dare l’esempio per primi.",
ora:"Signore, dammi un cuore umile, che riconosce i propri errori e torna a te. Voglio far parte del tuo popolo piccolo e fiducioso. Amen."},

{t:"Come rugiada dal cielo",cel:"Mercoledì della III settimana di Avvento",
aviso:"Molte famiglie cominciano oggi la Novena di Natale, dal 16 al 24 dicembre. La trovi qui nell’app, in Pregare > Novene.",
tipo:"Prima lettura",ref:"Is 45,6b-8.18.21b-25",v:"Stillate, cieli, dall'alto e le nubi facciano piovere la giustizia…",
exp:"Dio parla con forza: Lui è il Signore e non ce n’è un altro. Poi arriva una supplica bellissima che la Chiesa canta in Avvento da secoli (in latino, «Rorate caeli»): che il cielo faccia scendere il Salvatore come rugiada e la terra lo faccia germogliare. Nel Vangelo (Lc 7,19-23), Giovanni Battista manda a chiedere a Gesù se è Lui colui che deve venire.",
med:["La rugiada scende piano, in silenzio, durante la notte, e al mattino tutto è bagnato. Gesù è venuto così: senza rumore, in una notte a Betlemme.","Giovanni Battista, in prigione, ebbe un dubbio. E Gesù non lo rimproverò: gli mostrò i segni. Anche noi possiamo portare i nostri dubbi a Gesù. Lui risponde mostrandoci ciò che fa nella nostra vita."],
perg:"Quale dubbio porto nel cuore e voglio presentare con sincerità a Gesù?",
des:"Cominciate oggi in famiglia la Novena di Natale, pregando insieme un pochino ogni sera fino al 24.",
ora:"Vieni, Signore Gesù, come rugiada che scende in silenzio, e fa’ germogliare la salvezza nella nostra casa. Amen."},

{t:"Gesù ha una famiglia",cel:"17 dicembre: iniziano le Antifone «O»",
aviso:"Da oggi fino al 23, la Chiesa prega le «Antifone O», sette invocazioni a Gesù con i suoi nomi biblici. Quella di oggi è «O Sapienza».",
tipo:"Vangelo",ref:"Mt 1,1-17",v:"Genealogia di Gesù Cristo figlio di Davide, figlio di Abramo.",
exp:"San Matteo presenta l’albero genealogico di Gesù: da Abramo a Davide, da Davide all’esilio in Babilonia, dall’esilio fino a Giuseppe, lo sposo di Maria. Nell’elenco ci sono re e gente semplice, santi e peccatori, e anche donne straniere come Rut e Raab. Nella prima lettura (Gen 49), Giacobbe benedice Giuda, da cui sarebbe venuto il re.",
med:["Gesù ha voluto una famiglia vera, con una storia piena di alti e bassi. Dio non si vergogna della storia umana: ci entra dentro e la salva dall’interno.","Anche la nostra famiglia ha ferite, errori e storie difficili. Gesù non aspetta che sia perfetta per entrare. Vuole nascere proprio lì."],
perg:"Quale parte della storia della mia famiglia devo affidare a Dio perché la guarisca?",
des:"Mostrate ai bambini le foto dei nonni e dei bisnonni e raccontate una bella storia di fede della vostra famiglia. Pregate insieme per i vostri antenati, vivi e defunti.",
ora:"Gesù, Sapienza di Dio, insegnaci a camminare con saggezza. Benedici la nostra famiglia e tutta la nostra storia. Amen."},

{t:"Giuseppe, l’uomo giusto",cel:"18 dicembre · Antifona: O Signore",
aviso:"L’Antifona «O» di oggi è «O Signore» (Adonai).",
tipo:"Vangelo",ref:"Mt 1,18-24",v:"Giuseppe, figlio di Davide, non temere di prendere con te Maria, tua sposa",
exp:"Giuseppe scopre che Maria aspetta un bambino e, poiché è giusto, decide di lasciarla in segreto, senza esporla. In sogno un angelo gli spiega che il bambino viene dallo Spirito Santo e che si chiamerà Gesù, perché salverà il suo popolo dai suoi peccati. Sarà l’Emmanuele, il Dio con noi. Giuseppe si sveglia e fa tutto come l’angelo gli ha detto.",
med:["Nel Vangelo Giuseppe non dice nemmeno una parola. Ascolta e obbedisce. Non capiva tutto, ma si è fidato e ha accolto Maria e Gesù con tutto il suo amore.","Nella vita di famiglia, spesso non capiamo che cosa stia facendo Dio. Giuseppe ci insegna a fare il passo successivo con fiducia, anche senza avere tutte le risposte."],
perg:"In quale situazione Dio mi chiede di fidarmi, anche senza capire tutto?",
des:"Oggi è la giornata del papà (o di chi si prende cura della famiglia): preparate un biglietto per ringraziarlo, come Giuseppe si è preso cura di Gesù. Pregate insieme chiedendo a San Giuseppe di proteggere la vostra casa.",
ora:"San Giuseppe, uomo giusto e silenzioso, insegnami ad ascoltare Dio e a fidarmi. Proteggi la nostra famiglia come hai protetto Maria e Gesù. Amen."},

{t:"Per Dio non ci sono impossibili",cel:"19 dicembre · Antifona: O Radice di Iesse",
aviso:"L’Antifona «O» di oggi è «O Radice di Iesse».",
tipo:"Vangelo",ref:"Lc 1,5-25",v:"Non temere, Zaccaria, la tua preghiera è stata esaudita",
exp:"Zaccaria ed Elisabetta erano giusti, ma non avevano figli ed erano ormai anziani. Mentre Zaccaria offre l’incenso nel Tempio, l’angelo Gabriele annuncia che Elisabetta avrà un figlio, Giovanni, che preparerà la via del Signore. Zaccaria dubita e resta muto fino alla nascita del bambino. Nella prima lettura (Gdc 13), un annuncio simile: la nascita di Sansone.",
med:["Elisabetta ha aspettato tutta la vita. Quando sembrava troppo tardi, Dio ha risposto. I tempi di Dio non sono i nostri, ma Lui non dimentica nessuna preghiera.","Zaccaria rimase in silenzio perché aveva dubitato. A volte anche a noi Dio chiede un tempo di silenzio perché la fede maturi. Il silenzio non è un castigo: è preparazione."],
perg:"Quale preghiera di lunga data ho quasi smesso di fare? Posso riaffidarla a Dio oggi?",
des:"Fate in famiglia un «minuto di silenzio» prima di dormire, tutti con gli occhi chiusi, ascoltando il cuore. Poi ognuno sussurra una richiesta a Dio.",
ora:"Signore, per te niente è impossibile. Rimetto nelle tue mani la richiesta che porto con me da tanto tempo. Si compia la tua volontà. Amen."},

{t:"Il sì di Maria",cel:"IV Domenica di Avvento · Antifona: O Chiave di Davide",vela:4,
aviso:"La domenica è giorno di precetto: partecipa alla Santa Messa. Oggi si accende la quarta candela della corona. L’Antifona «O» di oggi è «O Chiave di Davide».",
tipo:"Vangelo",ref:"Lc 1,26-38",v:"Eccomi, sono la serva del Signore, avvenga di me quello che hai detto",
exp:"L’angelo Gabriele annuncia a Maria che sarà la madre del Figlio di Dio. Maria chiede come avverrà, e l’angelo risponde che lo Spirito Santo scenderà su di lei. Allora Maria dice il suo «sì». Nella prima lettura (2Sam 7), Dio promette a Davide che il suo regno durerà per sempre: questa promessa si compie in Gesù.",
med:["Tutto, a Natale, comincia con un «sì». Maria non sapeva tutto quello che sarebbe successo, ma ha detto sì a Dio per intero. E attraverso quel sì Dio è entrato nel mondo.","Anche a noi Dio chiede il nostro «sì» ogni giorno: nella pazienza con i figli, nella cura della casa, in un perdono difficile. Ogni piccolo sì fa spazio a Gesù perché nasca nella nostra casa."],
perg:"A che cosa mi chiede Dio di dire «sì» in questo momento della mia vita?",
des:"Accendete tutte e quattro le candele e leggete insieme il Vangelo di oggi (Lc 1,26-38). Ognuno completa la frase: «In questo Natale dico sì a Dio per...».",
ora:"Maria, insegnami a dire sì a Dio come hai fatto tu. Che si compia in me ciò che Dio vuole. Amen."},

{t:"Una visita piena di gioia",cel:"21 dicembre · Antifona: O Astro che sorgi",
aviso:"L’Antifona «O» di oggi è «O Astro che sorgi».",
tipo:"Vangelo",ref:"Lc 1,39-45",v:"E beata colei che ha creduto",
exp:"Maria va in fretta a casa di Elisabetta, tra i monti. Quando Elisabetta sente il saluto di Maria, il piccolo Giovanni sussulta di gioia nel suo grembo ed Elisabetta, piena di Spirito Santo, proclama Maria benedetta fra le donne e benedetto il frutto del suo grembo. Nella prima lettura (Ct 2,8-14), l’amato arriva saltando per i monti.",
med:["Maria aveva appena ricevuto la notizia più importante della storia e, invece di pensare a sé, va ad aiutare la cugina anziana. Chi porta Gesù va incontro agli altri.","Le visite di dicembre possono essere faticose, ma possono anche somigliare a quella di Maria: portare Gesù nelle case degli altri, con gioia e servizio."],
perg:"Chi ha bisogno di una mia visita, di una telefonata o di una mano in questi giorni?",
des:"Fate insieme una visita o una videochiamata a un parente anziano o solo. Portate un bigliettino o un dolcetto fatto in casa.",
ora:"Maria, che sei andata in fretta a servire Elisabetta, insegnami a portare Gesù agli altri con gioia. Amen."},

{t:"Il canto di gratitudine di Maria",cel:"22 dicembre · Antifona: O Re delle genti",
aviso:"L’Antifona «O» di oggi è «O Re delle genti».",
tipo:"Vangelo",ref:"Lc 1,46-56",v:"L'anima mia magnifica il Signore e il mio spirito esulta in Dio, mio salvatore",
exp:"Nella casa di Elisabetta, Maria canta il Magnificat. Loda Dio perché ha guardato la sua piccolezza, ha rovesciato i potenti e innalzato gli umili, ha colmato di beni gli affamati e ha mantenuto la promessa fatta ad Abramo. Nella prima lettura (1Sam 1,24-28), Anna presenta il piccolo Samuele al Signore e lo ringrazia per il figlio tanto atteso.",
med:["Nel Magnificat Maria non chiede nulla: ringrazia. La gratitudine è la preghiera di chi riconosce che tutto è dono di Dio.","Prima dell’ultima corsa verso il Natale, fermati un momento e guarda indietro: quante cose ha fatto Dio per te quest’anno? Fa’ del tuo cuore un Magnificat."],
perg:"Quali sono state le tre grazie più grandi che Dio mi ha dato quest’anno?",
des:"Scrivete insieme la «lista della gratitudine dell’anno»: ognuno in casa dice le cose belle che Dio ha fatto. Conservate la lista per leggerla a Natale.",
ora:"Signore, come Maria anche la mia anima ti loda, perché hai guardato la mia piccolezza. Grazie, mio Dio, per tutto quello che hai fatto per noi quest’anno. Amen."},

{t:"Il nome di Giovanni",cel:"23 dicembre · Antifona: O Emmanuele",
aviso:"L’Antifona «O» di oggi è «O Emmanuele».",
tipo:"Vangelo",ref:"Lc 1,57-66",v:"Giovanni è il suo nome",
exp:"Elisabetta dà alla luce un bambino e tutti si rallegrano. Al momento di dargli il nome, i parenti vogliono chiamarlo Zaccaria, come il padre. Elisabetta dice che si chiamerà Giovanni. Zaccaria, ancora muto, lo scrive su una tavoletta, e in quel momento la sua bocca si apre e loda Dio. Nella prima lettura (Ml 3), Dio promette di mandare il suo messaggero a preparare la via.",
med:["«Giovanni» vuol dire «Dio fa grazia». Zaccaria tornò a parlare quando obbedì a Dio invece di seguire l’usanza. L’obbedienza gli aprì la bocca alla lode.","Domani è la Vigilia di Natale. Manca così poco, e il Signore ci chiede se c’è ancora qualcosa da sistemare: una telefonata, un perdono, una promessa."],
perg:"Che cosa resta ancora da sistemare nel mio cuore prima che arrivi Gesù?",
des:"Raccontate ai bambini il significato del nome di ciascuno in famiglia e ringraziate Dio per il nome e per la vita di ogni persona della casa.",
ora:"Gesù, Emmanuele, Dio con noi, vieni! La nostra casa è quasi pronta ad accoglierti. Apri la mia bocca alla lode. Amen."},

{t:"Il sole che viene a visitarci",cel:"Vigilia di Natale",vela:4,
aviso:"Questa sera la Chiesa celebra la Messa della notte di Natale. Il Natale del Signore (25 dicembre) è giorno di precetto: partecipa alla Santa Messa.",
tipo:"Vangelo",ref:"Lc 1,67-79",v:"grazie alla bontà misericordiosa del nostro Dio, per cui verrà a visitarci dall'alto un sole che sorge",
exp:"Pieno di Spirito Santo, Zaccaria canta il Benedictus. Benedice Dio, che ha visitato il suo popolo e ha mantenuto la promessa fatta ad Abramo. Poi guarda il piccolo Giovanni e annuncia che sarà chiamato profeta dell’Altissimo. E conclude annunciando Gesù come il sole che sorge dall’alto per illuminare chi sta nelle tenebre e guidare i nostri passi sulla via della pace.",
med:["L’attesa è finita. Per tutto l’Avvento hai vegliato, preparato la strada, gioito e detto sì. Ora non resta che accogliere: il sole che sorge dall’alto viene a visitare la tua casa.","Nella corsa di queste ultime ore, custodisci un momento di silenzio. La cosa più importante del Natale non è sulla tavola né sotto l’albero: è Gesù, che vuole nascere nel tuo cuore."],
perg:"Come voglio accogliere Gesù in questa notte di Natale?",
des:"Prima del cenone della Vigilia, riunite la famiglia intorno al presepe, mettete Gesù Bambino nella mangiatoia e pregate insieme. Ognuno dice un regalo che vuole fare a Gesù quest’anno.",
ora:"Benedetto sei tu, Signore, perché sei venuto a visitare il tuo popolo. Vieni, Gesù Bambino, nasci nella nostra casa e nel nostro cuore. Amen."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="advento24"){PLANOS[i].d=D;PLANOS[i].ini="2026-11-29";PLANOS[i].resumo="Un giorno per ogni giorno di Avvento, dal 29 novembre alla Vigilia di Natale, seguendo le letture della Chiesa: la lettura del giorno spiegata, una meditazione, una domanda per il cuore, una sfida in famiglia e una preghiera.";}}
})();

// 30 giorni pregando per il mio matrimonio: versione completa (lettura, spiegazione, meditazione, domanda, sfida, preghiera)
(function(){
var D=[
{t:"Affidare il matrimonio a Dio",ref:"Qo 4,9-12",v:"una corda a tre capi non si rompe tanto presto.",
exp:"Il saggio Qoèlet osserva la vita e conclude: due sono meglio di uno. Se uno cade, l’altro lo rialza; se fa freddo, i due si scaldano; se qualcuno attacca, i due resistono insieme. E chiude con un’immagine: una corda a tre fili è molto più difficile da spezzare.",
med:["Nella tradizione cristiana, questi tre fili sono il marito, la moglie e Dio. Un matrimonio con due soli fili può anche reggere, ma ogni strattone più forte lo mette in pericolo. Quando Dio è il terzo filo, la coppia riceve una forza che non viene da sé.","Affidare il matrimonio a Dio non vuol dire smettere di lottare per il vostro amore. Vuol dire riconoscere che non devi portare da sola il peso di far andare tutto bene. In questi 30 giorni intreccerai questo terzo filo, un giorno alla volta."],
perg:"Che cosa sto cercando di risolvere da sola nel mio matrimonio e devo affidare a Dio?",
des:"Scrivi su un foglio: «Signore, il nostro matrimonio è tuo». Aggiungi la data e conservalo nella tua Bibbia o nel tuo planner. Stasera prega in silenzio per lui mentre dorme o prima di addormentarvi.",
ora:"Signore, ti affido il mio matrimonio. Sii tu il terzo filo che ci unisce e ci sostiene quando siamo deboli. Amen."},

{t:"Gratitudine per mio marito",ref:"Fil 1,3-11",v:"Ringrazio il mio Dio ogni volta ch'io mi ricordo di voi",
exp:"San Paolo scrive dal carcere alla comunità di Filippi. Anche se prigioniero, comincia la lettera ringraziando: ogni volta che si ricorda di loro, ringrazia Dio con gioia. E prega perché il loro amore cresca sempre di più, in conoscenza e in discernimento.",
med:["La routine ha un effetto curioso: col tempo notiamo più ciò che manca che ciò che c’è. L’asciugamano bagnato sul letto si vede più di tutto il lavoro che lui fa per mandare avanti la casa.","La gratitudine è un esercizio dello sguardo. Quando ringraziamo, gli occhi si riabituano a vedere il bene. E il cuore si addolcisce. Oggi fai come Paolo: ricordati di tuo marito e ringrazia Dio per lui."],
perg:"Quali qualità di mio marito ho smesso di vedere con il tempo?",
des:"Scrivi tre cose per cui sei grata a tuo marito. Scegline una e diglielo oggi, con semplicità: «Grazie per...». Va bene anche un messaggio, se ti viene più facile.",
ora:"Signore, grazie per il marito che hai messo al mio fianco. Apri i miei occhi sul bene che c’è in lui e fa’ crescere il nostro amore. Amen."},

{t:"Saper ascoltare",ref:"Gc 1,19-26",v:"sia ognuno pronto ad ascoltare, lento a parlare, lento all'ira.",
exp:"San Giacomo dà un consiglio molto pratico: essere svelti ad ascoltare, lenti a parlare e ancora più lenti ad arrabbiarsi. E ricorda che non basta ascoltare la Parola di Dio: bisogna metterla in pratica. Chi non tiene a freno la lingua, dice, inganna il proprio cuore.",
med:["Molte liti nel matrimonio nascono dal non ascoltare fino in fondo. Mentre l’altro parla, stiamo già preparando la risposta. Ascoltare davvero è un atto d’amore: dice all’altro «tu sei importante per me».","Gli uomini spesso parlano meno e per altre strade: in macchina, mentre aggiustano qualcosa, con un commento al volo. Imparare ad ascoltare tuo marito è anche imparare il suo modo di aprirsi."],
perg:"Quand’è stata l’ultima volta che ho ascoltato mio marito fino in fondo, senza interromperlo né correggerlo?",
des:"Oggi fai a tuo marito una domanda sulla sua giornata o su qualcosa che gli piace e ascoltalo con attenzione, senza telefono in mano e senza interrompere. Poi digli soltanto: «Grazie di avermelo raccontato».",
ora:"Spirito Santo, insegnami ad ascoltare con il cuore. Metti una guardia alla mia bocca e pazienza nelle mie risposte. Amen."},

{t:"Il perdono che libera",ref:"Col 3,12-17",v:"sopportandovi a vicenda e perdonandovi scambievolmente … Come il Signore vi ha perdonato, così fate anche voi.",
exp:"San Paolo descrive l’«abito» del cristiano: misericordia, bontà, umiltà, mitezza e pazienza. Sopra tutto, l’amore, che tiene insieme ogni cosa nella perfezione. E chiede di perdonarsi a vicenda, come il Signore ha perdonato noi.",
med:["Perdonare non è far finta che non sia successo niente, né pensare che l’offesa non abbia fatto male. È decidere di non riscuotere più il debito. È liberare l’altro dalla nostra prigione, e i primi a uscirne liberi siamo noi.","Nel matrimonio, le piccole ferite non perdonate si accumulano come la polvere su un mobile. Un giorno nessuno ricorda più il colore originale. Il perdono di oggi toglie la polvere prima che si incrosti."],
perg:"Quale ferita causata da mio marito porto ancora nel cuore? Sono pronta ad affidarla a Dio?",
des:"Scrivi su un foglietto una ferita che ti porti dentro. Prega: «Signore, io scelgo di perdonare». Poi strappa il foglio. Se è qualcosa che ha bisogno di una conversazione, chiedi a Dio il momento giusto e le parole giuste.",
ora:"Signore, tu mi perdoni sempre. Dammi la grazia di perdonare mio marito come tu perdoni me. Guarisci ciò che si è ferito tra noi. Amen."},

{t:"La pazienza, frutto dello Spirito",ref:"Gal 5,16-26",v:"Il frutto dello Spirito invece è amore, gioia, pace, pazienza, benevolenza, bontà, fedeltà, mitezza, dominio di sé",
exp:"San Paolo mette a confronto due modi di vivere: secondo la carne, che genera litigi, gelosie, ire e divisioni; e secondo lo Spirito, che porta frutto. La pazienza compare nell’elenco come un frutto: non è qualcosa che fabbrichiamo a forza, ma qualcosa che cresce in noi quando lasciamo agire Dio.",
med:["Nessuno cambia da un giorno all’altro, né io né lui. La pazienza è l’amore che sa aspettare i tempi dell’altro, come il contadino aspetta che il frutto maturi.","Quando oggi la pazienza finisce, invece di esplodere, fai una preghiera piccolissima: «Spirito Santo, dammi il tuo frutto». Il frutto non si strappa: si coltiva, con tempo e preghiera."],
perg:"In quale situazione con mio marito la mia pazienza finisce per prima?",
des:"Scegli una sua abitudine che ti irrita e decidi di non dire nulla al riguardo per tutta la giornata di oggi. Ogni volta che la noti, prega per lui in silenzio.",
ora:"Spirito Santo, fa’ crescere in me il frutto della pazienza. Che io sappia aspettare i tempi di mio marito come tu aspetti i miei. Amen."},

{t:"La sua salute",ref:"Gc 5,13-16",v:"E la preghiera fatta con fede salverà il malato: il Signore lo rialzerà",
exp:"San Giacomo insegna alla comunità a pregare in ogni situazione: nella tristezza, nella gioia e nella malattia. Chi è malato chiami i presbiteri, perché preghino su di lui e lo ungano con olio nel nome del Signore. È l’origine del sacramento dell’Unzione degli infermi. E conclude: la preghiera del giusto ha molta forza.",
med:["Prendersi cura della salute del marito è anche un modo di amarlo: nel corpo, nella mente e nell’anima. Molti uomini portano stanchezza, preoccupazioni e dolori in silenzio, perché hanno imparato che non possono mostrarsi deboli.","La tua preghiera è la prima cura. Ma l’amore si vede anche in gesti semplici: insistere con dolcezza perché faccia quel controllo, preparargli un piatto che gli faccia bene, lasciarlo riposare."],
perg:"Quale stanchezza, dolore o preoccupazione mio marito sta portando in silenzio?",
des:"Stasera posa la mano sulla spalla o sul capo di tuo marito (anche mentre dorme) e prega per la salute del suo corpo, della sua mente e della sua anima. Se c’è un esame o una visita che continua a rimandare, offriti di aiutarlo a prenotarla.",
ora:"Signore Gesù, medico delle anime e dei corpi, prenditi cura della salute di mio marito. Dagli forza, riposo e pace. Amen."},

{t:"Il lavoro di ogni giorno",ref:"Sal 90,12-17",v:"Sia su di noi la bontà del Signore, nostro Dio: rafforza per noi l'opera delle nostre mani",
exp:"Il salmista riconosce che la vita è breve e chiede a Dio la sapienza di contare bene i nostri giorni. Alla fine fa una richiesta bellissima: che Dio benedica e renda salda l’opera delle nostre mani, perché abbia senso e duri nel tempo.",
med:["Il lavoro fa parte della vocazione di ognuno. Spesso tuo marito affronta pressioni, capi difficili, la paura di perdere il posto o di non arrivare a fine mese. Non sempre ne parla.","Pregare per il suo lavoro è sostenere la casa in ginocchio. E dare valore al suo impegno, con una parola di riconoscimento, rinnova le forze di qualsiasi uomo."],
perg:"Che cosa so delle preoccupazioni di mio marito al lavoro? Gli ho mai chiesto come sta?",
des:"Manda a tuo marito un messaggio a metà giornata per dirgli che stai pregando per lui e per il suo lavoro. Stasera ringrazialo per l’impegno che mette per la famiglia.",
ora:"Signore, benedici il lavoro di mio marito. Dagli sapienza, pace nelle decisioni e frutti per il suo impegno. Rendi salda l’opera delle sue mani. Amen."},

{t:"La fede di mio marito",ref:"Ef 3,14-21",v:"Che il Cristo abiti per la fede nei vostri cuori e così, radicati e fondati nella carità",
exp:"San Paolo si inginocchia davanti al Padre e prega per la comunità: che siano rafforzati dallo Spirito, che Cristo abiti nei loro cuori e che conoscano l’amore di Cristo, che supera ogni conoscenza. Conclude lodando Dio, che può fare molto più di quanto chiediamo o immaginiamo.",
med:["Ognuno ha i suoi tempi e il suo cammino con Dio. Forse tuo marito prega più di te, forse è ancora lontano. La tua missione non è pretendere né fare prediche: è pregare e amare.","Santa Monica pregò per anni per la conversione del marito e del figlio, sant’Agostino. La preghiera paziente di una moglie prepara il terreno con amore, e Dio può fare molto più di quanto immaginiamo."],
perg:"Com’è oggi la fede di mio marito? Che cosa posso chiedere a Dio per lui, senza pretendere niente da lui?",
des:"Oggi prega per lui la preghiera di san Paolo (Ef 3,14-21), mettendo il suo nome al posto di «voi». Se è d’accordo, invitalo con leggerezza ad andare insieme a Messa domenica prossima.",
ora:"Signore, che Cristo abiti nel cuore di mio marito. Radicalo nel tuo amore e fa’ molto più di quanto io riesca a chiedere. Santa Monica, prega per noi. Amen."},

{t:"Protezione nelle tentazioni",ref:"Mt 26,36-41",v:"Vegliate e pregate, per non cadere in tentazione. Lo spirito è pronto, ma la carne è debole.",
exp:"Nel Getsèmani, prima della Passione, Gesù va a pregare e chiede a Pietro, Giacomo e Giovanni di restare con lui. Prega nell’angoscia, ma quando torna trova i discepoli addormentati. Allora chiede loro di vegliare e pregare, perché tutti siamo deboli.",
med:["Siamo tutti fragili. Ci sono tentazioni che girano attorno a ogni matrimonio: l’indifferenza, la pornografia, le dipendenze, i confronti, un’amicizia che va troppo in là. Nessuno ne è immune, né lui né tu.","La preghiera della moglie è uno scudo per il marito. E la coppia si protegge anche con le scelte: trasparenza, tempo insieme, attenzione a ciò che entra dal cellulare e dalla TV."],
perg:"Quale tentazione o pericolo minaccia di più il nostro matrimonio oggi? E me?",
des:"Oggi recita la preghiera a San Michele Arcangelo per tuo marito e per il tuo matrimonio. Se serve, scegli un gesto concreto di protezione per te (un’app, una conversazione, un’abitudine).",
ora:"San Michele Arcangelo, difendi il nostro matrimonio nella lotta. Signore, proteggi mio marito e me da ogni tentazione e da ogni male. Amen."},

{t:"Una sola carne",ref:"Mc 10,6-9",v:"Sicché non sono più due, ma una sola carne. L'uomo dunque non separi ciò che Dio ha congiunto.",
exp:"I farisei chiedono a Gesù se un marito può ripudiare la moglie. Gesù torna all’inizio della creazione: Dio fece l’uomo e la donna, e i due diventano una sola carne. Il matrimonio non è un contratto che si scioglie quando ci si stanca: è un’unione fatta da Dio.",
med:["Essere una cosa sola non vuol dire pensarla allo stesso modo su tutto né amare le stesse cose. Vuol dire camminare nella stessa direzione, anche con caratteri diversi. Significa dire «noi» più che «io».","L’unità si costruisce nei piccoli «noi»: «risolviamolo insieme», «la nostra famiglia», «i nostri soldi», «il nostro sogno». Ogni volta che diciamo «noi», aggiungiamo un punto alla cucitura di Dio."],
perg:"In quale ambito del nostro matrimonio stiamo vivendo più da «due» che da «uno»?",
des:"Oggi proponi a tuo marito di fare insieme qualcosa che di solito ognuno fa da solo: riordinare la cucina, fare la spesa, accompagnare i figli, fare una passeggiata. Alla fine ringrazialo per la compagnia.",
ora:"Signore, ciò che tu hai unito nessuno lo separi. Fa’ di noi una sola carne, un solo cuore, una sola direzione. Amen."},

{t:"Onorarsi a vicenda",ref:"Rm 12,9-13",v:"amatevi gli uni gli altri con affetto fraterno, gareggiate nello stimarvi a vicenda.",
exp:"San Paolo descrive com’è l’amore vero: sincero, che detesta il male e si attacca al bene. E dà un consiglio sorprendente: fare a gara a chi onora di più l’altro. Ed essere pieni di gioia nella speranza, pazienti nelle prove e costanti nella preghiera.",
med:["Onorare è dare valore all’altro, in pubblico e in privato. Un complimento a tuo marito davanti ai figli vale oro, e una critica davanti a loro ferisce nel profondo.","Molti uomini si sentono poco ammirati dentro casa. Quando la moglie riconosce il suo valore, lui cresce. La stima è come l’acqua per una pianta: fa fiorire il meglio che c’è."],
perg:"Come parlo di mio marito ai figli, alla famiglia e alle amiche?",
des:"Oggi fai un complimento a tuo marito davanti ai figli o a qualcuno della famiglia, per qualcosa di concreto. E se di solito ti lamenti di lui con qualcuno, decidi di non farlo per tutta questa settimana.",
ora:"Signore, insegnami a onorare mio marito con le parole e con i gesti. Che la nostra casa sia un luogo di rispetto e di ammirazione. Amen."},

{t:"Un tempo per ridere",ref:"Qo 3,1-8",v:"Un tempo per piangere e un tempo per ridere, un tempo per gemere e un tempo per ballare.",
exp:"Qoèlet scrive una poesia famosa: c’è un tempo per ogni cosa sotto il cielo. Un tempo per piantare e uno per raccogliere, per piangere e per ridere, per tacere e per parlare. La vita ha le sue stagioni, e ognuna ha il suo valore.",
med:["Anche i matrimoni hanno bisogno di risate. Quando la routine pesa, le conversazioni diventano solo conti, problemi e cose da fare. La leggerezza protegge l’amore e vi ricorda perché vi siete scelti.","Il libro dei Proverbi dice che un cuore lieto è un buon rimedio (Pr 17,22). Che oggi sia un tempo per ridere, anche se la stagione è difficile."],
perg:"Quand’è stata l’ultima volta che io e mio marito abbiamo riso insieme di cuore?",
des:"Ricordate insieme un episodio divertente del fidanzamento o dei primi tempi di matrimonio. Oppure guardate vecchie foto. Se puoi, prepara una piccola sorpresa: il suo piatto preferito, un film comico.",
ora:"Signore, riporta la gioia nella nostra casa. Che sappiamo ridere insieme, anche nei giorni difficili. Amen."},

{t:"Le finanze di casa",ref:"Mt 6,25-34",v:"Cercate prima il regno di Dio e la sua giustizia, e tutte queste cose vi saranno date in aggiunta.",
exp:"Nel Discorso della Montagna, Gesù parla dell’ansia per il cibo, le bevande e i vestiti. Indica gli uccelli del cielo e i gigli del campo: il Padre si prende cura di loro. E conclude invitando a non affannarsi per il domani: chi cerca prima di tutto il Regno riceverà anche il resto.",
med:["Il denaro è uno dei motivi più frequenti di litigio nel matrimonio: debiti nascosti, modi diversi di spendere, paura del futuro. Gesù non chiede di essere irresponsabili: chiede fiducia e le giuste priorità.","Quando la coppia mette le finanze davanti a Dio e ne parla con trasparenza, il denaro smette di essere motivo di lite e diventa motivo di unione e di condivisione."],
perg:"Come parliamo di soldi io e mio marito? C’è qualcosa che nascondo o che mi angoscia?",
des:"Proponi a tuo marito una conversazione tranquilla sulle finanze di casa, senza accuse, cominciando con una preghiera. Se per ora non è possibile, scrivi le tue preoccupazioni e affidale a Dio.",
ora:"Padre, tu ti prendi cura degli uccelli e dei gigli. Prenditi cura anche della nostra casa. Dacci sapienza, trasparenza e fiducia in te. Amen."},

{t:"Tenerezza e intimità",ref:"Ct 8,6-7",v:"Le grandi acque non possono spegnere l'amore né i fiumi travolgerlo.",
exp:"Il Cantico dei Cantici è un poema d’amore tra uno sposo e una sposa. La Chiesa vi vede anche l’amore di Dio per il suo popolo. Alla fine, l’amata chiede all’amato di portarla come un sigillo sul cuore, perché l’amore è forte come la morte.",
med:["La tenerezza è un linguaggio di Dio dentro il matrimonio. L’intimità della coppia, in tutte le sue forme, è sacra ed è stata benedetta da lui. Non è qualcosa di minor valore nella vita di fede.","Tra figli, conti e stanchezza, le carezze vanno sparendo. Piccoli gesti tengono viva la fiamma: un abbraccio lungo, tenersi per mano, un bacio vero quando ci si saluta. Le grandi acque della vita di ogni giorno non devono spegnere l’amore."],
perg:"Quali gesti di tenerezza sono spariti a poco a poco dalla nostra routine?",
des:"Oggi dai a tuo marito un abbraccio lungo, di almeno 20 secondi, senza un motivo particolare. Salutalo quando esce e accoglilo quando torna con un bacio vero.",
ora:"Signore, tu hai benedetto l’amore tra l’uomo e la donna. Riaccendi l’affetto e la tenerezza tra noi. Mettici come un sigillo l’uno sul cuore dell’altra. Amen."},

{t:"Decidere insieme",ref:"Fil 2,1-5",v:"con l'unione dei vostri spiriti, con la stessa carità, con i medesimi sentimenti",
exp:"San Paolo chiede alla comunità di vivere nell’unità: che nessuno agisca per rivalità o vanagloria, e che ognuno non guardi solo ai propri interessi ma anche a quelli degli altri. E indica il modello: avere gli stessi sentimenti di Cristo Gesù.",
med:["Decidere insieme costa fatica, chiede dialogo e a volte qualche rinuncia. Ma costruisce fiducia. Quando uno decide sempre da solo, l’altro si sente escluso, e quando tutto è imposto, nasce la rivalità.","Avere i sentimenti di Cristo è cercare ciò che è bene per tutti e due, non vincere la discussione."],
perg:"Quale decisione importante è in sospeso tra noi? Sto ascoltando quello che pensa lui?",
des:"Scegliete insieme qualcosa di semplice da decidere oggi (il menù del fine settimana, una gita, un acquisto). Prima di dire la tua, chiedi la sua opinione e ascoltala.",
ora:"Signore, donaci un solo sentire e un solo pensiero. Che le nostre decisioni siano prese insieme, con te in mezzo a noi. Amen."},

{t:"Il papà dei miei figli",ref:"Sal 103,8-14",v:"Come un padre ha pietà dei suoi figli, così il Signore ha pietà di quanti lo temono.",
exp:"Il salmo canta la bontà di Dio: è misericordioso e pietoso, lento all’ira e grande nell’amore. Non ci tratta secondo i nostri peccati. E paragona il suo amore a quello di un padre che ha compassione dei figli, perché sa di che argilla siamo fatti.",
med:["Anche tuo marito sta imparando a essere padre, spesso senza aver avuto un buon esempio. Sbaglia, come sbagli tu come mamma. Dio guarda tutti e due con compassione.","Quando la mamma sostiene il papà davanti ai figli, la sua autorità cresce e i bambini si sentono al sicuro. E quando preghi per lui come padre, Dio lo forma nell’amore paterno. Se non avete ancora figli, prega per il padre che sarà."],
perg:"Come sto sostenendo mio marito come padre? Lo correggo davanti ai bambini?",
des:"Oggi di’ a tuo marito una cosa che ammiri in lui come papà (o che ammirerai). Chiedi ai figli di fargli un bigliettino o un disegno.",
ora:"Padre del cielo, insegna a mio marito a essere padre come lo sei tu: fermo, paziente e pieno d’amore. Benedici il suo rapporto con i nostri figli. Amen."},

{t:"Rivestite di umiltà",ref:"1Pt 5,5-7",v:"Rivestitevi tutti di umiltà gli uni verso gli altri … gettando in lui ogni vostra preoccupazione, perché egli ha cura di voi.",
exp:"San Pietro chiede ai cristiani di rivestirsi di umiltà, perché Dio resiste ai superbi e dà grazia agli umili. Chi si umilia sotto la mano di Dio sarà innalzato al momento giusto. E chiude con una consolazione: possiamo gettare in lui ogni preoccupazione, perché si prende cura di noi.",
med:["Voler avere sempre ragione stanca il matrimonio. L’umiltà è saper dire «hai ragione», «ho sbagliato», «scusami» e anche «non lo so».","Umiltà non è sminuirsi né accettare la mancanza di rispetto. È lasciare da parte l’orgoglio che trasforma ogni conversazione in una gara. Dio dà la grazia a chi si fa piccolo."],
perg:"Su quale argomento ho sempre bisogno di avere l’ultima parola con mio marito?",
des:"Oggi riconosci almeno una volta, ad alta voce, che lui ha ragione su qualcosa. Se di recente hai sbagliato, chiedi scusa in modo semplice, senza «ma».",
ora:"Signore, rivestimi di umiltà. Togli da me l’orgoglio che ferisce il nostro amore e donami la tua grazia. Amen."},

{t:"Parole che costruiscono",ref:"Ef 4,25-32",v:"Nessuna parola cattiva esca più dalla vostra bocca; ma piuttosto, parole buone che possano servire per la necessaria edificazione",
exp:"San Paolo chiede ai cristiani di abbandonare la menzogna, di non lasciar tramontare il sole sulla loro ira e di non dare spazio al diavolo. Dalla loro bocca devono uscire parole che edificano e fanno bene a chi ascolta. E conclude invitando a essere buoni e misericordiosi gli uni con gli altri, perdonandosi a vicenda.",
med:["Le parole costruiscono o abbattono una casa. Una frase detta con rabbia può restare per anni nel cuore dell’altro. E così anche un complimento sincero.","Oggi fai caso al tuo tono di voce, alle ironie, ai paragoni. Prima di parlare, chiediti: quello che sto per dire costruisce?"],
perg:"Quale mia parola o quale mio tono ha ferito mio marito, anche senza che me ne accorgessi?",
des:"Oggi fai il «digiuno dalle critiche»: nessuna critica, ironia o lamentela verso tuo marito per tutta la giornata. Sostituiscile ognuna con una parola gentile.",
ora:"Signore, metti una guardia alla mia bocca. Che le mie parole edifichino mio marito e la nostra casa. Amen."},

{t:"Dio fa una cosa nuova",ref:"Is 43,16-21",v:"Non ricordate più le cose passate, non pensate più alle cose antiche! … Ecco, faccio una cosa nuova: proprio ora germoglia, non ve ne accorgete?",
exp:"Dio ricorda al popolo di aver aperto una strada nel mare e di aver liberato Israele dall’Egitto. Ma gli chiede di non restare prigioniero del passato. Sta per fare qualcosa di nuovo: aprire una strada nel deserto e far scorrere fiumi nella terra arida.",
med:["Ogni matrimonio ha ferite antiche: parole dette, tradimenti, delusioni, anni difficili. A volte viviamo guardando indietro, rinfacciando ciò che è passato.","Dio è specialista nei nuovi inizi. Non cancella la storia, ma la guarisce e fa germogliare qualcosa di nuovo. Chiedigli occhi per accorgerti del nuovo che sta già germogliando tra voi."],
perg:"Quale ferita del passato pesa ancora sul nostro matrimonio? Sono disposta a lasciare che Dio la guarisca?",
des:"Scrivi una lettera a Dio per affidargli una ferita del passato del vostro matrimonio. Non devi mostrarla a nessuno. Alla fine scrivi: «Signore, fa’ una cosa nuova». Se la ferita è molto profonda, valuta di chiedere aiuto a un sacerdote o a un terapeuta.",
ora:"Signore, tu fai nuove tutte le cose. Guarisci le ferite del nostro passato e fa’ germogliare qualcosa di nuovo nel nostro matrimonio. Amen."},

{t:"Pregare in due",ref:"Mt 18,19-20",v:"Perché dove sono due o tre riuniti nel mio nome, io sono in mezzo a loro.",
exp:"Gesù fa una promessa: se due sulla terra si mettono d’accordo per chiedere qualcosa, il Padre del cielo lo concederà. E dove due o tre sono riuniti nel suo nome, lui è in mezzo a loro.",
med:["La preghiera di coppia ha una forza speciale: è la preghiera di una «chiesa domestica». Eppure molte coppie cattoliche non hanno mai pregato insieme, per timidezza o per mancanza di abitudine.","Può essere molto semplice: un Padre Nostro mano nella mano prima di dormire, una benedizione prima dei pasti. L’importante non è pregare in modo perfetto, è pregare insieme."],
perg:"Io e mio marito abbiamo mai pregato insieme? Che cosa ce lo impedisce?",
des:"Invita tuo marito a recitare insieme un Padre Nostro prima di dormire, tenendovi per mano. Se ancora non se la sente, prega tu sottovoce accanto a lui, senza pretendere nulla.",
ora:"Gesù, tu hai promesso di essere in mezzo a noi. Vieni ad abitare nella preghiera della nostra coppia e fa’ della nostra casa una piccola chiesa. Amen."},

{t:"Servire con amore",ref:"Gv 13,1-15",v:"Se dunque io, il Signore e il Maestro, ho lavato i vostri piedi, anche voi dovete lavarvi i piedi gli uni gli altri.",
exp:"Nell’Ultima Cena, Gesù si alza, depone il mantello, prende un asciugamano e lava i piedi ai discepoli, un servizio da schiavi. Pietro non vuole accettarlo. Gesù spiega di aver dato l’esempio: come ha fatto lui, così dobbiamo fare noi gli uni per gli altri.",
med:["Servire non significa valere di meno. Gesù, il Signore, si è inginocchiato. Nel matrimonio, servire è il linguaggio più concreto dell’amore, ma ha valore solo quando è libero, non quando diventa pretesa o merce di scambio.","Spesso serviamo brontolando, o tenendo il conto di quello che facciamo. Oggi servi di nascosto, come Gesù: senza aspettarti complimenti."],
perg:"Servo mio marito con gioia o rinfacciandoglielo? Che cosa apprezza di più che io faccia per lui?",
des:"Oggi fai qualcosa che piace a tuo marito, senza che lui lo chieda e senza farglielo notare dopo: il caffè come piace a lui, i vestiti già pronti, un piatto speciale, un bigliettino affettuoso nel pranzo da portare al lavoro.",
ora:"Gesù, che hai lavato i piedi ai tuoi amici, insegnami a servire mio marito con gioia e umiltà. Amen."},

{t:"Riposare insieme",ref:"Mc 6,30-32",v:"Venite in disparte, in un luogo solitario, e riposatevi un po'.",
exp:"Gli apostoli tornano dalla missione e raccontano a Gesù tutto quello che hanno fatto. C’è così tanta gente che va e viene che non hanno neppure il tempo di mangiare. Allora Gesù li chiama in un luogo tranquillo, soli con lui, per riposare un po’.",
med:["Gesù si preoccupava della stanchezza dei suoi amici. Anche la coppia ha bisogno di una pausa: tempo solo per voi due, senza figli, senza faccende, senza cellulare. Non è egoismo: è un investimento nell’amore.","Molte coppie parlano solo di problemi e di organizzazione. Riposare insieme vi ricorda che siete, prima di tutto, una coppia che si ama."],
perg:"Quand’è stata l’ultima volta che io e mio marito siamo stati insieme solo per il gusto di stare insieme, senza niente da fare?",
des:"Organizzate un momento di riposo a due in questa settimana: un caffè, una passeggiata, un film quando i bambini dormono. Spegnete i cellulari durante quel tempo.",
ora:"Gesù, chiamaci a riposare con te. Rinnova il nostro amore nei momenti di pausa e di gioia a due. Amen."},

{t:"Amici veri",ref:"Gv 15,12-17",v:"Non vi chiamo più servi … vi ho chiamati amici",
exp:"Nell’Ultima Cena, Gesù lascia il suo comandamento: amarsi gli uni gli altri come lui ci ha amati. E dice che non c’è amore più grande che dare la vita per i propri amici. Chiama i discepoli amici, perché ha fatto conoscere loro tutto ciò che ha udito dal Padre.",
med:["Il matrimonio è l’amicizia più profonda che esista. Gli amici si sostengono nelle cadute, si confidano, fanno il tifo l’uno per l’altro, amano stare insieme.","Con il tempo, alcune coppie diventano soci nella gestione della casa e smettono di essere amici. Oggi riconquista l’amicizia: interessati a ciò che piace a lui, raccontagli quello che hai nel cuore."],
perg:"Sono amica di mio marito? Che cosa gli piace fare che potrei condividere con lui?",
des:"Chiedi a tuo marito di qualcosa che gli piace (una squadra, un hobby, un sogno) e mostra un interesse sincero. Raccontagli qualcosa di te che non gli hai ancora detto.",
ora:"Gesù, amico fedele, fa’ di noi amici veri, che si sostengono, si ascoltano e amano camminare insieme. Amen."},

{t:"Fedeltà nelle piccole cose",ref:"Os 2,16-22",v:"Ti farò mia sposa per sempre, ti farò mia sposa nella giustizia e nel diritto, nella benevolenza e nell'amore, ti fidanzerò con me nella fedeltà.",
exp:"Il profeta Osea usa la sua stessa storia, con una moglie infedele, per parlare dell’amore di Dio per il suo popolo. Anche tradito, Dio non si arrende: conduce il popolo nel deserto, parla al suo cuore e rinnova l’alleanza per sempre, nella fedeltà.",
med:["La fedeltà di Dio è il modello della nostra. Non è solo non tradire: è donarsi per intero, ogni giorno, nei dettagli. Nello sguardo, nelle conversazioni, nelle amicizie, nel cellulare, nei pensieri.","Fedeltà è anche mantenere le piccole promesse: arrivare all’ora stabilita, fare quello che si è detto, custodire i segreti dell’altro."],
perg:"In quali piccoli dettagli posso essere più fedele a mio marito?",
des:"Oggi prega per la fedeltà di tutti e due. Scegli una piccola promessa fatta a tuo marito che non hai mantenuto e mantienila oggi.",
ora:"Signore, tu sei fedele per sempre. Custodisci la nostra fedeltà nell’amore e nella tenerezza, nelle cose grandi e in quelle piccole. Amen."},

{t:"Pace nelle discussioni",ref:"Mt 5,21-24",v:"va' prima a riconciliarti con il tuo fratello e poi torna ad offrire il tuo dono.",
exp:"Nel Discorso della Montagna, Gesù insegna che non basta non uccidere: anche la rabbia e le parole di disprezzo feriscono. Se stai portando la tua offerta all’altare e ti ricordi che qualcuno ha qualcosa contro di te, lascia lì l’offerta e va’ prima a fare pace.",
med:["Non essere d’accordo è normale, perfino sano. Quello che ferisce è il modo di discutere: urla, disprezzo, silenzi che puniscono, andare a dormire arrabbiati. Anche san Paolo chiede di non lasciar tramontare il sole sulla nostra ira (Ef 4,26).","Gesù mette la riconciliazione persino al di sopra dell’offerta all’altare. Per Dio, la pace tra voi conta più di tante preghiere fatte con il cuore chiuso."],
perg:"Come mi comporto di solito in una discussione? C’è qualcosa in sospeso tra noi che ha bisogno di pace?",
des:"Se c’è qualcosa di irrisolto, fai oggi il primo passo verso la riconciliazione. Stabilite una «regola della pace»: mai andare a dormire senza aver fatto pace, anche solo con un «ti amo, ne parliamo domani».",
ora:"Gesù, Principe della pace, insegnaci a non essere d’accordo senza ferirci e a fare pace prima del tramonto. Amen."},

{t:"Sognare insieme",ref:"Pr 16,1-9",v:"Affida al Signore la tua attività e i tuoi progetti riusciranno.",
exp:"Il libro dei Proverbi raccoglie consigli di sapienza. Questo brano ricorda che l’uomo fa progetti, ma è il Signore che guida i suoi passi. Chi affida a Dio ciò che fa vede i suoi progetti realizzarsi.",
med:["Le coppie che sognano insieme camminano nella stessa direzione. I sogni possono essere grandi (una casa, i figli, un trasloco) o piccoli (un viaggio, una cena fuori, imparare qualcosa insieme).","A Dio piace partecipare ai nostri progetti. Quando la coppia sogna davanti a lui, i sogni diventano più puri e il cammino più leggero."],
perg:"Quali sogni abbiamo in comune io e mio marito? Qualcuno si è perso per strada?",
des:"Parlate oggi di tre sogni per i prossimi anni. Scriveteli insieme su un foglio e pregate affidandoli a Dio.",
ora:"Signore, ti affidiamo i nostri sogni e i nostri progetti. Guida i nostri passi e facci camminare insieme nella tua volontà. Amen."},

{t:"La sua famiglia e la mia",ref:"Rt 1,14-18",v:"perché dove andrai tu andrò anch'io; dove ti fermerai mi fermerò; il tuo popolo sarà il mio popolo e il tuo Dio sarà il mio Dio…",
exp:"Noemi ha perso il marito e i figli e decide di tornare nella sua terra. Chiede alle nuore di tornare dalle loro famiglie. Una se ne va, ma Rut resta: abbraccia la suocera e promette di seguirla ovunque vada. Rut diventerà la bisnonna del re Davide.",
med:["Suoceri, cognati, famiglie con abitudini diverse: molte tensioni nel matrimonio nascono da lì. La storia di Rut mostra che è possibile amare la famiglia dell’altro ed esserne amati.","Amare la sua famiglia non vuol dire lasciare che comandi nella coppia. Vuol dire onorarla, pregare per lei e costruire ponti, tenendo la coppia al primo posto."],
perg:"Com’è il mio rapporto con la famiglia di mio marito? C’è qualcuno a cui devo avvicinarmi o che devo perdonare?",
des:"Oggi prega per nome per i suoceri e i cognati. Fai un gesto affettuoso verso la sua famiglia: una telefonata, un messaggio, un invito.",
ora:"Signore, benedici la famiglia di mio marito e la mia. Donaci pace, rispetto e amore tra tutti. Amen."},

{t:"Il vino buono del matrimonio",ref:"Gv 2,1-11",v:"Fate quello che vi dirà",
exp:"A una festa di nozze a Cana, finisce il vino. Maria se ne accorge e lo dice a Gesù. Poi chiede ai servitori di fare tutto quello che lui dirà. Gesù trasforma in vino l’acqua di sei anfore di pietra, e il vino migliore viene servito per ultimo. Fu il suo primo miracolo.",
med:["Gesù ha compiuto il suo primo miracolo a un matrimonio. Nel matrimonio lui è presente attraverso un sacramento: la coppia riceve una grazia speciale per amarsi.","Quando il «vino» finisce, quando la gioia e l’amore sembrano seccarsi, Maria è attenta e intercede. E Gesù trasforma ancora l’acqua in vino, se facciamo quello che lui ci dice."],
perg:"Dove è finito il «vino» nel nostro matrimonio? Ho già chiesto a Maria di intercedere?",
des:"Ricorda la data del tuo matrimonio e, se puoi, guarda le foto o il video. Prega una decina del Rosario chiedendo a Maria di intercedere per un vino nuovo nel tuo matrimonio.",
ora:"Maria, tu che ti sei accorta che il vino era finito, guarda il nostro matrimonio. Gesù, trasforma la nostra acqua in vino buono. Amen."},

{t:"Sotto la protezione della Santa Famiglia",ref:"Lc 2,41-52",v:"Ecco, tuo padre e io, angosciati, ti cercavamo",
exp:"A dodici anni, Gesù va a Gerusalemme con Maria e Giuseppe per la Pasqua. Al ritorno, si accorgono che il ragazzo è rimasto indietro. Lo cercano angosciati per tre giorni, finché lo trovano nel Tempio. Maria custodisce tutto nel suo cuore.",
med:["Anche Maria e Giuseppe hanno conosciuto l’angoscia: una gravidanza inattesa, un viaggio difficile, la fuga in Egitto, il figlio perso a Gerusalemme. Non avevano una vita perfetta, ma erano uniti in Dio.","Nota che, quando lo ritrovano, Maria parla di tutti e due: lei e Giuseppe lo hanno cercato insieme. La Santa Famiglia capisce le nostre difficoltà ed è modello e protettrice di tutte le coppie."],
perg:"Quale angoscia stiamo vivendo io e mio marito, che dobbiamo mettere nelle mani di Maria e Giuseppe?",
des:"Metti un’immagine o un santino della Santa Famiglia in un posto speciale della casa e consacrale il tuo matrimonio con la preghiera di oggi.",
ora:"Gesù, Maria e Giuseppe, a voi affido il mio cuore e la mia famiglia. Proteggete il nostro matrimonio e la nostra casa. Santa Famiglia di Nazaret, prega per noi. Amen."},

{t:"Rinnovare il sì",ref:"1Cor 13,4-13",v:"Tutto copre, tutto crede, tutto spera, tutto sopporta. La carità non avrà mai fine.",
exp:"San Paolo scrive l’inno all’amore: l’amore è paziente, è buono, non è invidioso né orgoglioso, non cerca il proprio interesse, non tiene conto del male ricevuto. Tutto passerà, ma l’amore resta. Tra la fede, la speranza e l’amore, il più grande è l’amore.",
med:["Dopo 30 giorni, è il momento di guardare il cammino fatto. Forse sono cambiate molte cose; forse poche. Ma tu hai intrecciato il terzo filo, giorno dopo giorno, e Dio ha agito, anche dove non l’hai visto.","Il giorno del matrimonio vi siete detti «sì». Oggi è il giorno per rinnovare quel sì, non alle emozioni dell’inizio, ma all’amore che sceglie, persevera e spera."],
perg:"Che cosa è cambiato in me e nel mio matrimonio in questi 30 giorni? Qual è il mio «sì» di oggi?",
des:"Rinnova nella preghiera le promesse del tuo matrimonio: «Io N., accolgo te, N., come mio sposo. Con la grazia di Cristo prometto di esserti fedele sempre, nella gioia e nel dolore, nella salute e nella malattia, e di amarti e onorarti tutti i giorni della vita.» Se lui è d’accordo, pregate insieme. Scrivigli una lettera d’amore.",
ora:"Signore, oggi rinnovo il mio sì. Grazie per questi 30 giorni. Continua a prenderti cura del nostro matrimonio, perché l’amore non avrà mai fine. Amen."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="casamento30"){PLANOS[i].d=D;PLANOS[i].resumo="Un mese intero per mettere il tuo matrimonio nelle mani di Dio. Ogni giorno porta una lettura della Bibbia spiegata, una meditazione, uno spazio per scrivere e una sfida concreta da vivere con tuo marito.";}}
