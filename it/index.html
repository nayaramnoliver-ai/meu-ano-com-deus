<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}/* Layout: coluna única de celular (máx. 480px), cartões brancos com contorno pontilhado pastel, barra de abas fixa embaixo */
:root{
  /* Paleta mariana: azul claro, azul-marinho e caramelo; as cores litúrgicas ficam à parte (--lit-*) */
  --fundo:#FFFFFF;
  --tinta:#6E5440;      /* texto corrido, caramelo escuro */
  --titulo:#2F4C7C;     /* títulos azul-marinho */
  --suave:#A88C70;      /* legendas caramelo */
  --rosa:#5F87BC;       /* destaque azul mariano (nome antigo mantido) */
  --mao:#B98450;        /* letra manuscrita caramelo */
  --linha:#E7EDF5;
  --lil:#ECEEFA; --lil2:#AEB6E0;    /* azul-lavanda */
  --pk:#EAF1FA;  --pk2:#A9C4E6;     /* azul bem claro (padrão) */
  --az:#E3EEF9;  --az2:#8FB3DD;     /* azul claro */
  --ceu:#EEF6FC; --ceu2:#B2D1EE;    /* céu */
  --car:#F6ECDF; --car2:#D9B48C;    /* caramelo claro */
  --am:#FAF2E0;  --am2:#E0BE7C;     /* dourado */
  --vd:#ECF4F8;  --vd2:#A9C9DD;
  --lit-roxo:#B9A3DA; --lit-roxo-c:#F1EAF7;
  --lit-rosa:#EDA7B2; --lit-rosa-c:#FBE6E9;
  --lit-branco:#E3C25E; --lit-branco-c:#FCF4D6;
  --lit-verde:#A6C9A0; --lit-verde-c:#E4F0E2;
  --lit-verm:#E07F8E; --lit-verm-c:#FBE3E6;
  --verde-acao:#34578E;  /* botão principal: azul-marinho */
  --f-tit:"Fraunces",Georgia,"Times New Roman",serif;
  --f-txt:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mao:"Caveat","Segoe Print","Bradley Hand",cursive;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--fundo)}
body{margin:0;color:var(--tinta);font-family:var(--f-txt);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--rosa);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

#app{max-width:480px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-top:6px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;padding-block:8px 0}
.marca{font-family:var(--f-txt);font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--suave);display:flex;align-items:center;gap:7px}
.marca svg{width:16px;height:16px;color:var(--rosa)}
.icbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--titulo)}
.icbtn:active{background:var(--pk)}
.sub{display:flex;align-items:center;gap:6px;padding-block:6px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--fundo);z-index:5;margin-inline:-6px;padding-inline:0 6px}
.sub .icbtn{flex:none}
.sub span{font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

h1,h2,h3{font-family:var(--f-tit);color:var(--titulo);margin:0;line-height:1.15;text-wrap:balance;font-weight:700}
h1{font-size:30px;letter-spacing:-.01em}
h2{font-size:21px}
h3{font-size:17px}
p{margin:0}
.mao{font-family:var(--f-mao);color:var(--mao);font-size:24px;line-height:1.1}
.mini{font-size:12px;color:var(--suave)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--suave)}
.tag{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:var(--tg,var(--pk));color:var(--titulo);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border-radius:99px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}

/* cores pastel por tema */
.c-lilas{--bg:var(--lil);--bd:var(--lil2);--tg:var(--lil)}
.c-rosa{--bg:var(--car);--bd:var(--car2);--tg:var(--car)}
.c-azul{--bg:var(--az);--bd:var(--az2);--tg:var(--az)}
.c-verde{--bg:var(--ceu);--bd:var(--ceu2);--tg:var(--ceu)}
.c-amarelo{--bg:var(--am);--bd:var(--am2);--tg:var(--am)}

/* cartões */
.card{background:#fff;border:1.6px dashed var(--bd,var(--pk2));border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card.cheio{background:var(--bg);border-style:solid;border-color:transparent}
.card p{font-size:15px}

/* olá */
.ola{display:flex;flex-direction:column;gap:2px;padding-top:4px}
.ola h1{font-size:28px}

/* faixa do tempo litúrgico */
.tempo{background:var(--bg);border-radius:22px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.tempo .txt{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.tempo .tag{background:#fff}
.tempo p{font-size:14px}
.tempo p span{display:block;margin-top:3px;font-size:14.5px;font-weight:500;color:var(--tinta)}
.tempo b{font-family:var(--f-tit);color:var(--titulo);font-size:19px;font-weight:700;display:block;line-height:1.2}
.velas{display:flex;gap:6px;align-items:flex-end;flex:none}
.velas svg{width:16px;height:46px}

.corlit{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--suave)}
.corlit i{width:10px;height:10px;border-radius:50%;display:inline-block}
.santo{font-size:14px}
.santo b{color:var(--titulo);font-weight:600}

/* botões */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--verde-acao);color:#fff;font-weight:600;font-size:15px;border-radius:99px;padding:14px 20px;text-align:center;text-decoration:none;width:100%}
.btn svg{width:18px;height:18px}
.btn:active{filter:brightness(.95)}
.btn.sec{background:#fff;color:var(--titulo);border:1.6px solid var(--az2)}
.btn.rosa{background:var(--rosa)}
.marca svg{color:var(--mao)}
.btn.peq{padding:9px 16px;font-size:13.5px;width:auto}
.lnk{color:var(--rosa);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.feito{display:inline-flex;align-items:center;gap:6px;color:var(--verde-acao);font-weight:600;font-size:13px}
.feito svg{width:18px;height:18px}

blockquote{margin:0;font-family:var(--f-tit);font-style:italic;font-weight:500;font-size:19px;line-height:1.4;color:var(--titulo)}
cite{font-style:normal;font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--mao)}

/* semana */
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.semana span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--suave)}
.semana i{width:30px;height:30px;border-radius:50%;border:1.6px dashed var(--pk2);display:grid;place-items:center;color:#fff}
.semana i.ok{background:var(--rosa);border-color:var(--rosa)}
.semana i.hj{border-style:solid}
.semana i svg{width:16px;height:16px}

/* atalhos */
.atalhos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.atalho{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;text-align:center;line-height:1.25}
.atalho span{width:56px;height:56px;border-radius:18px;background:var(--bg);display:grid;place-items:center;color:var(--titulo)}
.atalho svg{width:26px;height:26px}

/* passos numerados (momento, novena) */
.passos{display:flex;flex-direction:column;gap:14px}
.passo{display:grid;grid-template-columns:30px 1fr;gap:12px}
.passo .n{width:30px;height:30px;border-radius:50%;background:var(--az);color:var(--titulo);font-family:var(--f-tit);font-weight:700;display:grid;place-items:center;font-size:15px}
.passo .c{display:flex;flex-direction:column;gap:8px;min-width:0;padding-top:3px}
.passo h3{font-size:16px}

textarea,input[type=text],input[type=date]{width:100%;font:inherit;font-size:15px;color:var(--tinta);background:#fff;border:1.6px dashed var(--pk2);border-radius:16px;padding:12px 14px;resize:vertical;background-image:repeating-linear-gradient(transparent 0 29px,var(--linha) 29px 30px);background-position:0 10px;line-height:30px}
input[type=text],input[type=date]{background-image:none;line-height:1.4}
textarea:focus,input:focus{outline:none;border-style:solid;border-color:var(--rosa)}
label.lb{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-inline:-18px;padding-inline:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1.4px solid var(--linha);font-size:13px;font-weight:600;color:var(--suave);background:#fff;white-space:nowrap}
.chip.on{background:var(--pk);border-color:var(--pk);color:var(--titulo)}
.chip[disabled]{opacity:.55;cursor:default}

/* planos */
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{background:var(--bg);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:168px;position:relative}
.pcard .pic{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--titulo)}
.pcard .pic svg{width:24px;height:24px}
.pcard .ptit{font-family:var(--f-tit);font-weight:700;color:var(--titulo);font-size:16px;line-height:1.2}
.pcard .pdias{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta);opacity:.75}
.pcard .novo{position:absolute;top:12px;right:12px;font-family:var(--f-mao);color:var(--mao);font-size:19px;line-height:1}
.barra{height:7px;border-radius:9px;background:#fff;overflow:hidden;margin-top:auto}
.barra i{display:block;height:100%;background:var(--rosa);border-radius:9px}
.card .barra{background:var(--pk)}
.andamento{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:18px;padding:12px 14px;width:100%}
.andamento .pic{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--titulo);flex:none}
.andamento .t{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.andamento b{font-family:var(--f-tit);color:var(--titulo);font-size:15px;line-height:1.2}
.andamento small{font-size:12px}

.phero{background:var(--bg);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.phero .tag{background:#fff}
.phero .pic{width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--titulo)}
.phero .pic svg{width:28px;height:28px}

.dias{display:flex;flex-direction:column}
.dia-row{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1.4px dashed var(--linha);width:100%}
.dia-row:last-child{border-bottom:0}
.dia-row .t{display:flex;flex-direction:column;min-width:0;flex:1}
.dia-row small{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.dia-row b{font-weight:600;font-size:14.5px;color:var(--tinta)}
.chk{width:28px;height:28px;border-radius:50%;border:1.6px dashed var(--bd,var(--pk2));display:grid;place-items:center;flex:none;color:#fff}
.chk.ok{background:var(--rosa);border:0}
.chk svg{width:16px;height:16px}
.dia-row .seta{color:var(--suave)}
.dia-row .seta svg{width:18px;height:18px}

.bloco{display:flex;flex-direction:column;gap:6px}
.oracao-txt{white-space:pre-line;font-size:16px;line-height:1.7}
.oracao-curta{font-family:var(--f-tit);font-style:italic;font-size:17px;color:var(--titulo);line-height:1.45}
.navdias{display:flex;justify-content:space-between;gap:10px}

/* listas de orações */
.lista{display:flex;flex-direction:column;background:#fff;border:1.6px dashed var(--bd,var(--pk2));border-radius:20px;padding:4px 16px}
.lista .item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1.4px dashed var(--linha);width:100%}
.lista .item:last-child{border-bottom:0}
.lista .item b{flex:1;font-weight:600;font-size:14.5px}
.lista .item small{display:block;font-weight:500;font-size:12px;color:var(--suave)}
.lista .item svg{color:var(--suave);width:18px;height:18px}
details.item{display:block}
details.item summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:600;font-size:14.5px}
details.item summary::-webkit-details-marker{display:none}
details.item summary b{flex:1}
details.item p{padding-top:8px;white-space:pre-line}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{background:var(--bg);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mcard .pic{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--titulo)}
.mcard b{font-family:var(--f-tit);color:var(--titulo);font-size:17px;line-height:1.15}
.mcard small{font-size:12.5px;line-height:1.35}

/* terço */
.terco-top{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.contas{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;padding-block:6px}
.contas i{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--az2);background:#fff;transition:background .2s,transform .2s}
.contas i.g{width:26px;height:26px}
.contas i.ok{background:var(--az2)}
.contas i.at{background:var(--titulo);border-color:var(--titulo);transform:scale(1.15)}
.terco-orar{min-height:200px}
.terco-orar h2{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.terco-orar h2 small{font-family:var(--f-mao);color:var(--mao);font-size:22px;font-weight:400}
.terco-bts{display:grid;grid-template-columns:auto 1fr;gap:10px}
.terco-bts .btn.sec{width:auto;padding-inline:18px}
.misterio{background:var(--lil);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px}

/* novenas */
.nove{display:flex;gap:6px}
.nove i{width:24px;height:24px;border-radius:50%;border:1.6px dashed var(--bd,var(--lil2));display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:600;color:var(--suave)}
.nove i.ok{background:var(--rosa);border:0;color:#fff}

/* pedidos */
.pedido{display:flex;flex-direction:column;gap:6px}
.pedido .para{font-family:var(--f-mao);color:var(--mao);font-size:22px;line-height:1}
.pedido .acoes{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.vazio{text-align:center;padding:22px 10px;display:flex;flex-direction:column;gap:6px;align-items:center}
.vazio svg{width:34px;height:34px;color:var(--pk2)}

/* rotina kids */
.rotina{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rot{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;border:1.6px dashed var(--am2);font-size:13.5px;font-weight:600;line-height:1.25}
.rot svg{width:22px;height:22px;color:var(--titulo)}
.rot.ok{background:var(--am);border-style:solid;border-color:var(--am)}
.estrelas{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.estrelas span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--suave)}
.estrelas b{font-family:var(--f-tit);color:var(--titulo);font-size:15px}
.estrelas svg{width:18px;height:18px;color:var(--am2)}
.estrelas .cheia svg{fill:var(--am2)}
.historia{white-space:pre-line;font-size:16.5px;line-height:1.75}
.conversa{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* calendário */
.mesnav{display:flex;align-items:center;justify-content:space-between}
.mesnav h2{text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .ds{font-size:10.5px;font-weight:600;color:var(--suave);padding-bottom:4px}
.cal button{aspect-ratio:1;max-width:100%;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.cal button i{width:6px;height:6px;border-radius:50%}
.cal button.esp{font-weight:700;color:var(--titulo)}
.cal button.dom{color:var(--mao)}
.cal button.hj{border:1.6px solid var(--rosa)}
.cal button.sel{background:var(--pk)}
.cal button:disabled{opacity:.35}
.legenda{display:flex;flex-direction:column;gap:10px}
.legenda div{display:grid;grid-template-columns:14px 1fr;gap:10px;align-items:start;font-size:13.5px;line-height:1.4}
.legenda i{width:12px;height:12px;border-radius:50%;margin-top:3px}
.legenda b{display:block;color:var(--titulo);font-weight:600}
.cores-leg summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.cores-leg summary::-webkit-details-marker{display:none}
.cores-leg summary svg{width:18px;height:18px;color:var(--suave);transform:rotate(90deg);transition:transform .2s}
.cores-leg:not([open]) summary svg{transform:none}
.datas{display:flex;flex-direction:column;gap:2px}
.datas button{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1.4px dashed var(--linha);width:100%}
.datas button:last-child{border-bottom:0}
.datas .d{font-family:var(--f-mao);color:var(--mao);font-size:24px;line-height:1;min-width:30px}
.datas b{font-weight:600;font-size:14px}

/* aviso de confirmação */
.confirma{background:var(--pk);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px}

/* barra de abas */
#nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1.6px dashed var(--linha);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));z-index:20}
#nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--suave);padding:6px 0;text-align:center}
#nav button svg{width:24px;height:24px}
#nav button.on{color:var(--rosa)}
#nav button.on span{background:var(--pk);border-radius:99px;padding:2px 12px}
#nav button span{padding:2px 12px;display:grid;place-items:center}

#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--titulo);color:#fff;font-weight:600;font-size:14px;padding:12px 18px;border-radius:99px;opacity:0;transition:opacity .25s,transform .25s;z-index:30;max-width:calc(100% - 40px);text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

.sep{height:0;border-top:1.6px dashed var(--linha)}
.rodape{text-align:center;padding-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Pontos de quebra em azul-marinho: 1 ou 2 por tela, sempre o foco principal */
.escuro{--esc:#2B4774;background:var(--esc);color:#F3F7FC;border:0;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;outline:1.4px dashed rgba(255,255,255,.32);outline-offset:-8px}
.escuro h1,.escuro h2,.escuro h3,.escuro b{color:#fff}
.escuro .eyebrow,.escuro .mini{color:#B7CDEB}
.escuro blockquote{color:#fff}
.escuro cite,.escuro .mao{color:#E9C99E}
.escuro .tag{background:rgba(255,255,255,.16);color:#fff}
.escuro .corlit{color:#C9D9EF}
.escuro .btn{background:#fff;color:var(--esc)}
.escuro .btn.sec{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.escuro .feito{color:#CFE3FA}
.escuro .santo b{color:#E9C99E}
.escuro .pic{background:rgba(255,255,255,.14)!important;color:#fff!important}
.escuro .semana span{color:#B7CDEB}
.escuro .semana i{border-color:rgba(255,255,255,.45)}
.escuro .semana i.ok{background:#E9C99E;border-color:#E9C99E;color:var(--esc)}
.escuro .semana i.hj{border-style:solid;border-color:#fff}
.escuro .sep{border-color:rgba(255,255,255,.22)}
.escuro .lnk{color:#E9C99E}

/* Tutorial: colocar na tela do celular (letras maiores, para todas as idades) */
.tut .grande,.tut p.grande{font-size:17px;line-height:1.6}
.iconeapp{width:64px;height:64px;flex:none;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(47,76,124,.18)}
.iconeapp svg{width:100%;height:100%;display:block}
.tcel{gap:10px}
.tbt{border:2px solid var(--az2);border-radius:18px;padding:16px 12px;font-family:var(--f-tit);font-weight:700;font-size:20px;color:var(--titulo);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff}
.tbt small{font-family:var(--f-txt);font-weight:500;font-size:11.5px;color:var(--suave);line-height:1.3}
.tbt.on{background:var(--titulo);border-color:var(--titulo);color:#fff}
.tbt.on small{color:#C9D9EF}
.tpassos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.tpasso{display:grid;grid-template-columns:40px 1fr;gap:12px;border:1.6px dashed var(--pk2);border-radius:20px;padding:16px 14px}
.tnum{width:40px;height:40px;border-radius:50%;background:var(--titulo);color:#fff;font-family:var(--f-tit);font-weight:700;font-size:20px;display:grid;place-items:center}
.tc{display:flex;flex-direction:column;gap:10px;min-width:0}
.tc h3{font-size:20px;padding-top:6px}
.tc p{font-size:17px;line-height:1.6}
.tc .dica{font-size:15px;background:var(--am);border-radius:14px;padding:10px 12px}
.ilu{width:76px;height:76px;border-radius:20px;background:var(--az);display:grid;place-items:center;color:var(--titulo);border:2.5px solid var(--mao)}
.ilu svg{width:44px;height:44px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Desafio especial em destaque na tela de início */
.dest{--dbg:var(--lit-roxo-c);--dbd:var(--lit-roxo);background:var(--dbg);border:2px solid var(--dbd);border-radius:24px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;outline:1.4px dashed var(--dbd);outline-offset:-9px}
.dest.d-ouro{--dbg:var(--am);--dbd:var(--am2)}
.dest .dtopo{display:flex;gap:14px;align-items:center;justify-content:space-between}
.dest .tag{background:#fff}
.dest h2{font-size:25px;line-height:1.15;text-wrap:balance}
.dest .grande{font-size:16px;line-height:1.5;color:var(--tinta)}
.dest .grande b,.dest p b{color:var(--titulo)}
.dest .cont{flex:none;width:82px;height:82px;border-radius:50%;background:#fff;border:2px dashed var(--dbd);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;color:var(--titulo);text-align:center}
.dest .cont b{font-family:var(--f-tit);font-size:30px;font-weight:700}
.dest .cont small{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta)}
.dest .barra{background:#fff;height:9px}
.dest .dok{display:flex;gap:8px;align-items:flex-start;font-weight:600;color:var(--titulo);font-size:15px}
.dest .dok svg{width:20px;height:20px;flex:none;margin-top:2px;color:var(--verde-acao)}

/* dia completo dos desafios */
.dcel{font-size:14px;font-weight:600;color:var(--mao)}
.daviso .eyebrow{display:flex;align-items:center;gap:6px;color:var(--titulo)}
.daviso .eyebrow svg{width:15px;height:15px}
.daviso p{font-size:15px;color:var(--tinta)}
.dpal .mini{color:var(--tinta)}
.dpal .btn{align-self:flex-start}
.dperg .grande b{font-family:var(--f-tit);font-size:19px;line-height:1.35;color:var(--titulo);font-weight:700}
.escuro .grande{font-size:16px;line-height:1.55}
.bloco p+p{margin-top:6px}
/* lembrete diário */
select{width:100%;font:inherit;font-size:17px;font-weight:600;color:var(--titulo);background:#fff;border:1.6px dashed var(--pk2);border-radius:16px;padding:12px 14px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--titulo) 50%),linear-gradient(135deg,var(--titulo) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.lembc .pic{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--titulo);flex:none}
.lembc .pic svg{width:24px;height:24px}
#lembrete{scroll-margin-top:72px}
</style>

"2027-01-04":{t:"Feria del tempo di Natale (4 gennaio)",cor:"branco",b:"I primi discepoli seguono Gesù e restano con Lui. Anche noi cominciamo l’anno nuovo fermandoci un po’ con Lui.",x:"Scegli una nuova abitudine per cominciare l’anno con Dio."},

"2027-01-06":{t:"Epifania del Signore",g:"Solennità",cor:"branco",b:"I Magi seguono la stella e adorano il Bambino, offrendo oro, incenso e mirra. Gesù è venuto per tutti i popoli! È giorno di precetto. Per i bambini è anche il giorno della Befana, ma il cuore della festa è Gesù.",x:"Mettete i Magi nel presepe e raccontate la loro storia ai bambini."},
"2027-01-07":{t:"Giovedì dopo l’Epifania",cor:"branco",s:"San Raimondo de Peñafort",b:"Un sacerdote che aiutò tante persone a fare una buona confessione.",x:"Segna in agenda la data della tua prossima Confessione."},
"2027-01-08":{t:"Venerdì dopo l’Epifania",cor:"branco",b:"Gesù continua a mostrarsi a noi nelle piccole cose di ogni giorno.",x:"Stasera racconta alla tua famiglia dove hai visto Dio oggi."},
"2027-01-09":{t:"Sabato dopo l’Epifania",cor:"branco",b:"Un sabato con la Madonna. Lei custodiva tutte queste cose nel suo cuore.",x:"Recitate in famiglia il Rosario (o una decina)."},
"2027-01-10":{t:"Battesimo del Signore",g:"Festa",cor:"branco",b:"Gesù viene battezzato nel fiume Giordano e il Padre lo presenta come il suo Figlio amato. Oggi finisce il tempo di Natale.",x:"Scopri (o ricorda) la data del battesimo di ciascuno dei tuoi figli e annotala nel calendario dell’app."},
"2027-01-11":{t:"Lunedì della I settimana del Tempo Ordinario",cor:"verde",b:"Comincia il Tempo Ordinario: un tempo per crescere nella fede giorno dopo giorno, come una pianta che cresce piano piano.",x:"Scegli uno dei percorsi dell’app da vivere nelle prossime settimane."},
"2027-01-12":{t:"Martedì della I settimana del Tempo Ordinario",cor:"verde",b:"Gesù chiama persone semplici, nel mezzo del loro lavoro, a seguirlo.",x:"Offri a Dio le faccende di casa di oggi."},
"2027-01-13":{t:"Mercoledì della I settimana del Tempo Ordinario",cor:"verde",s:"Sant’Ilario",b:"Vescovo e Dottore della Chiesa che difese con fermezza che Gesù è Dio.",x:"Recita il Credo lentamente, facendo attenzione a ogni frase."},
"2027-01-14":{t:"Giovedì della I settimana del Tempo Ordinario",cor:"verde",b:"Gesù ha compassione e tocca chi ha bisogno di guarigione.",x:"Prega per qualcuno che è malato e, se puoi, fagli visita o telefonagli."},
"2027-01-15":{t:"Venerdì della I settimana del Tempo Ordinario",cor:"verde",b:"Gli amici del paralitico lo calarono dal tetto fino a Gesù. La fede degli amici fa miracoli.",x:"Porta a Gesù, nella preghiera, qualcuno che non riesce a pregare da solo."},
"2027-01-16":{t:"Sabato della I settimana del Tempo Ordinario",cor:"verde",b:"Gesù siede a tavola con tutti. Nessuno è troppo lontano per Lui.",x:"Fate un pasto in famiglia senza cellulari a tavola."},
"2027-01-17":{t:"II Domenica del Tempo Ordinario",g:"Domenica",cor:"verde",s:"Sant’Antonio abate",b:"La domenica è il Giorno del Signore. Sant’Antonio abate, che ricordiamo oggi, lasciò tutto per vivere solo per Dio. In tanti paesi oggi si benedicono gli animali.",x:"Andate a Messa in famiglia e poi parlate insieme del Vangelo."},
"2027-01-18":{t:"Lunedì della II settimana del Tempo Ordinario",cor:"verde",b:"Vino nuovo in otri nuovi: Dio vuole rinnovare la nostra vita.",x:"Oggi trasforma una lamentela in un «grazie»."},
"2027-01-19":{t:"Martedì della II settimana del Tempo Ordinario",cor:"verde",b:"Gesù insegna che il sabato è fatto per l’uomo: Dio vuole il nostro riposo.",x:"Regalati 20 minuti di riposo senza sentirti in colpa."},
"2027-01-20":{t:"Mercoledì della II settimana del Tempo Ordinario",cor:"verde",s:"San Fabiano · San Sebastiano",b:"San Sebastiano fu un soldato romano rimasto fedele a Gesù fino alla fine; è sepolto a Roma, sulla via Appia. San Fabiano fu papa e martire.",x:"Chiedi a San Sebastiano il coraggio di vivere la fede senza paura."},
"2027-01-21":{t:"Sant’Agnese",g:"Memoria",cor:"vermelho",s:"Sant’Agnese",b:"Una ragazza giovanissima che donò la vita a Gesù con coraggio. Patrona delle ragazze.",x:"Prega per le bambine e le ragazze della tua famiglia e per la purezza del loro cuore."},
"2027-01-22":{t:"Venerdì della II settimana del Tempo Ordinario",cor:"verde",s:"San Vincenzo",b:"Diacono e martire di Spagna, saldo e gioioso nella fede.",x:"Servi qualcuno della tua famiglia senza aspettarti un grazie."},
"2027-01-23":{t:"Sabato della II settimana del Tempo Ordinario",cor:"verde",b:"Un sabato con la Madonna. Lei intercede per le nostre necessità, come alle nozze di Cana.",x:"Racconta alla Madonna che cosa «manca» nella tua casa."},
"2027-01-24":{t:"III Domenica del Tempo Ordinario (Domenica della Parola di Dio)",g:"Domenica",cor:"verde",s:"San Francesco di Sales",b:"Una domenica dedicata alla Bibbia. San Francesco di Sales insegnò che si può diventare sante nella vita di tutti i giorni.",x:"Metti la Bibbia in un posto d’onore della casa, aperta sul Vangelo del giorno."},
"2027-01-25":{t:"Conversione di San Paolo apostolo",g:"Festa",cor:"branco",s:"San Paolo",b:"Paolo perseguitava i cristiani finché incontrò Gesù sulla via di Damasco. Nessuna vita è perduta per Dio.",x:"Prega senza scoraggiarti per qualcuno della tua famiglia che è lontano dalla fede."},
"2027-01-26":{t:"Santi Timoteo e Tito",g:"Memoria",cor:"branco",s:"San Timoteo e San Tito",b:"Timoteo imparò la fede dalla mamma Eunice e dalla nonna Loide. La fede passa da madre in figlio!",x:"Ringrazia per chi ti ha insegnato la fede, e insegna oggi a tuo figlio qualcosa su Dio."},
"2027-01-27":{t:"Mercoledì della III settimana del Tempo Ordinario",cor:"verde",s:"Sant’Angela Merici",b:"Nata sul lago di Garda, fondò un’opera per educare le ragazze nella fede. Credeva molto nella forza delle donne.",x:"Prega per le maestre e le catechiste dei tuoi figli."},
"2027-01-28":{t:"San Tommaso d’Aquino",g:"Memoria",cor:"branco",s:"San Tommaso d’Aquino",b:"Uno dei più grandi sapienti della Chiesa, eppure molto umile. Pregava prima di studiare.",x:"Prega con i tuoi figli prima dei compiti."},
"2027-01-29":{t:"Venerdì della III settimana del Tempo Ordinario",cor:"verde",b:"Il Regno di Dio cresce come un piccolo seme, anche quando non lo vediamo.",x:"Non scoraggiarti per i frutti che ancora non si vedono: continua a seminare."},
"2027-01-30":{t:"Sabato della III settimana del Tempo Ordinario",cor:"verde",b:"Gesù calma la tempesta. Lui è sulla barca della tua famiglia.",x:"Affida a Gesù la «tempesta» di questa settimana."},
"2027-01-31":{t:"IV Domenica del Tempo Ordinario",g:"Domenica",cor:"verde",s:"San Giovanni Bosco",b:"Il Giorno del Signore. San Giovanni Bosco, il santo di Torino, educava i ragazzi con allegria, ragione e tanto amore.",x:"Gioca oggi con i tuoi figli: anche la gioia educa."}
};

// Il mio momento con Dio — 5 minuti al giorno

window.MOMENTO = {
"2026-11-22":{v:"Il mio regno non è di questo mondo",r:"Gv 18,36",p:"Gesù non regna con la forza né alzando la voce. Regna servendo, con pazienza e amore, proprio come una mamma regna nel cuore della casa.",q:"In quale parte della mia vita non ho ancora lasciato che Gesù sia il Re?",o:"Gesù, Re del mio cuore, regna nella mia casa, nelle mie giornate e nelle mie parole."},
"2026-11-23":{v:"questa invece nella sua miseria ha dato tutto quanto aveva per vivere",r:"Lc 21,4",p:"La vedova ha dato poco, ma ha dato tutto. Dio non misura la grandezza dell’offerta, misura la grandezza dell’amore.",q:"Qual è il «poco» della mia vita che oggi posso offrire con tanto amore?",o:"Signore, accogli il poco che sono oggi. Nelle tue mani diventa tanto."},
"2026-11-24":{v:"Mettetevi bene in mente di non preparare prima la vostra difesa",r:"Lc 21,14",p:"Nei momenti difficili è Dio stesso a metterci sulle labbra le parole giuste. Non dobbiamo preparare tutto da sole.",q:"Quale conversazione mi preoccupa e non l’ho ancora affidata a Dio?",o:"Spirito Santo, parla tu per me quando non so cosa dire."},
"2026-11-25":{v:"Con la vostra perseveranza salverete le vostre anime.",r:"Lc 21,19",p:"Perseverare è andare avanti, anche piano. La fede di una mamma è fatta di piccoli nuovi inizi, ogni giorno.",q:"In che cosa devo perseverare, anche se sono stanca?",o:"Signore, dammi la perseveranza di continuare a fare il bene, un giorno alla volta."},
"2026-11-26":{v:"alzatevi e levate il capo, perché la vostra liberazione è vicina",r:"Lc 21,28",p:"Dio non vuole che viviamo a testa bassa. Anche nelle difficoltà, Lui sta arrivando per soccorrerci.",q:"Che cosa mi ha fatto camminare a testa bassa ultimamente?",o:"Padre, solleva il mio sguardo verso di te. Ho fiducia che sei vicino."},
"2026-11-27":{v:"Fate quello che vi dirà",r:"Gv 2,5",p:"Il consiglio di Maria è semplice: ascoltare Gesù e fare ciò che dice. Lei ci porta sempre più vicino a suo Figlio.",q:"Che cosa mi sta chiedendo Gesù che continuo a rimandare?",o:"Maria, Madre mia, insegnami a fare tutto quello che Gesù mi dirà."},
"2026-11-28":{v:"Vegliate e pregate in ogni momento",r:"Lc 21,36",p:"Domani comincia l’Avvento. È tempo di preparare la casa e, ancora di più, il cuore.",q:"Come voglio arrivare al Natale quest’anno?",o:"Signore, prepara il mio cuore ad accoglierti in questo Avvento."},
"2026-11-29":{v:"Vigilate dunque, poiché non sapete quando il padrone di casa ritornerà",r:"Mc 13,35",p:"Vegliare non è vivere nella paura, è vivere sveglie per Dio. Lui arriva ogni giorno nei piccoli dettagli della quotidianità.",q:"Dove potrebbe cercare di incontrarmi Dio in questa settimana?",o:"Vieni, Signore Gesù! Trova il mio cuore sveglio e le mie porte spalancate."},
"2026-11-30":{v:"Seguitemi, vi farò pescatori di uomini",r:"Mt 4,19",p:"Andrea lasciò subito le reti. A volte seguire Gesù comincia con un piccolo «sì» nel mezzo del lavoro.",q:"Quale «rete» devo lasciare per seguire Gesù più da vicino?",o:"Gesù, voglio seguirti oggi, anche in mezzo alle faccende di casa."},
"2026-12-01":{v:"Il lupo dimorerà insieme con l'agnello",r:"Is 11,6",p:"Il sogno di Dio è la pace. Una pace che comincia dentro di noi e si diffonde in tutta la casa.",q:"Dove manca la pace nella mia casa?",o:"Principe della Pace, abita nella mia casa e calma i nostri cuori."},
"2026-12-02":{v:"Sento compassione di questa folla",r:"Mt 15,32",p:"Gesù si accorge della stanchezza e della fame delle persone. Si accorge anche della tua stanchezza.",q:"Di che cosa ho «fame» oggi: di riposo, di affetto, di silenzio?",o:"Signore, tu conosci la mia stanchezza. Nutrimi con la tua presenza."},
"2026-12-03":{v:"Andate in tutto il mondo e predicate il vangelo ad ogni creatura.",r:"Mc 16,15",p:"Non ogni missione è dall’altra parte del mondo. La prima terra di missione di una mamma è la sua casa.",q:"Come posso annunciare Gesù in casa senza bisogno di parole?",o:"Gesù, fa’ della mia casa una piccola terra di missione, piena del tuo amore."},
"2026-12-04":{v:"Sia fatto a voi secondo la vostra fede",r:"Mt 9,29",p:"I ciechi hanno insistito e Gesù li ha guariti. La fede che insiste non disturba Dio: lo commuove.",q:"Per quale richiesta devo continuare a insistere con fede?",o:"Signore, aumenta la mia fede. Continuo a sperare in te."},
"2026-12-05":{v:"Gratuitamente avete ricevuto, gratuitamente date.",r:"Mt 10,8",p:"Tutto ciò che abbiamo lo abbiamo ricevuto da Dio. Donare con generosità è restituire un po’ del tanto che Lui ci dà.",q:"Che cosa ho ricevuto gratuitamente e posso condividere oggi?",o:"Padre, dammi un cuore generoso, che condivide con gioia."},
"2026-12-06":{v:"preparate la strada del Signore, raddrizzate i suoi sentieri",r:"Mc 1,3",p:"Preparare la via è togliere i sassi: un rancore, una cattiva abitudine, una fretta che non lascia spazio a Dio.",q:"Quale «sasso» voglio togliere dalla strada prima di Natale?",o:"Signore, aiutami a preparare la via, perché tu possa arrivare fino a me."},
"2026-12-07":{v:"Uomo, i tuoi peccati ti sono rimessi",r:"Lc 5,20",p:"Prima di guarire il corpo, Gesù guarisce il cuore. Il perdono di Dio è il regalo più grande che possiamo ricevere in Avvento.",q:"C’è qualcosa che devo portare alla Confessione prima di Natale?",o:"Gesù misericordioso, confido nel tuo perdono. Rinnova il mio cuore."},
"2026-12-08":{v:"Ti saluto, o piena di grazia, il Signore è con te",r:"Lc 1,28",p:"Fin dal primo istante Dio ha preparato Maria per essere la casa di Gesù. Oggi celebriamo l’Immacolata Concezione. Lei ci aiuta a diventare anche noi casa di Gesù.",q:"Che cosa voglio chiedere alla Madonna per la mia famiglia?",o:"Immacolata Concezione, Madre cara, ti consacro la mia casa e i miei figli."},
"2026-12-09":{v:"Venite a me, voi tutti, che siete affaticati e oppressi, e io vi ristorerò.",r:"Mt 11,28",p:"Gesù non ci chiede di arrivare da Lui già riposate. Ci chiede di andare così come siamo.",q:"Che cosa pesa oggi sulle mie spalle?",o:"Gesù, vengo così come sono. Donami il tuo riposo."},
"2026-12-10":{v:"Io sono il Signore tuo Dio che ti insegno per il tuo bene",r:"Is 48,17",p:"Dio è il maestro migliore. Ci insegna con pazienza, come noi insegniamo ai nostri figli.",q:"Che cosa mi sta insegnando Dio in questo periodo?",o:"Signore, insegnami la tua via e io la percorrerò."},
"2026-12-11":{v:"Ma alla sapienza è stata resa giustizia dalle sue opere",r:"Mt 11,19",p:"La sapienza di Dio si vede più in quello che facciamo che in quello che diciamo.",q:"Quale mio gesto di oggi mostra che appartengo a Dio?",o:"Signore, che i miei gesti parlino di te."},
"2026-12-12":{v:"Non sono forse qui io che sono tua Madre?",r:"La Madonna di Guadalupe a san Juan Diego",p:"Oggi ricordiamo la Madonna di Guadalupe, Patrona delle Americhe. Maria disse a Juan Diego che lui era tra le sue braccia. Anche tu sei in braccio alla Madre.",q:"Quale preoccupazione voglio mettere tra le braccia della Madonna?",o:"Madre di Guadalupe, mi affido alle tue braccia con tutto ciò che mi preoccupa."},
"2026-12-13":{v:"Rallegratevi nel Signore, sempre … Il Signore è vicino!",r:"Fil 4,4-5",p:"La gioia cristiana non dipende dal fatto che tutto sia perfetto. Nasce dal sapere che Dio è vicino.",q:"Quali sono tre motivi di gioia che ho oggi?",o:"Signore, riempi la mia casa della gioia che viene da te."},
"2026-12-14":{v:"Alla sera della vita, saremo giudicati sull’amore.",r:"San Giovanni della Croce",p:"Alla fine non contano la casa perfetta né l’agenda piena. Conta l’amore che mettiamo in ogni cosa.",q:"In quale impegno di oggi posso mettere più amore?",o:"Signore, fa’ che io compia le piccole cose con grande amore."},
"2026-12-15":{v:"I pubblicani e le prostitute vi passano avanti nel regno di Dio.",r:"Mt 21,31",p:"Dio dà valore a chi si pente e cambia davvero. Non è mai troppo tardi per ricominciare.",q:"Da dove voglio ricominciare prima di Natale?",o:"Signore, grazie perché con te posso sempre ricominciare."},
"2026-12-16":{v:"i ciechi riacquistano la vista, gli zoppi camminano … ai poveri è annunziata la buona novella.",r:"Lc 7,22",p:"Gesù si riconosce dal bene che fa. I suoi segni compaiono anche nella nostra casa.",q:"Quale segno dell’amore di Dio ho visto questa settimana?",o:"Gesù, apri i miei occhi per vedere i tuoi segni nella mia casa."},
"2026-12-17":{v:"Genealogia di Gesù Cristo figlio di Davide…",r:"Mt 1,1",p:"Nella famiglia di Gesù c’erano santi e peccatori. Dio non ha paura della storia della nostra famiglia: la abbraccia.",q:"Quale parte della storia della mia famiglia devo affidare a Dio?",o:"Gesù, Sapienza di Dio, entra nella storia della mia famiglia e guarisci ciò che ha bisogno di guarigione."},
"2026-12-18":{v:"fece come gli aveva ordinato l'angelo del Signore",r:"Mt 1,24",p:"Giuseppe non capiva tutto, ma si è fidato e ha agito. A volte la fede è fare il passo successivo senza vedere tutta la scala.",q:"Quale passo mi chiede Dio, anche se non capisco tutto?",o:"San Giuseppe, insegnami a fidarmi e a obbedire con il cuore in pace."},
"2026-12-19":{v:"nulla è impossibile a Dio",r:"Lc 1,37",p:"Elisabetta era anziana ed è diventata mamma. Dio sa agire nei suoi tempi, anche quando sembra troppo tardi.",q:"Che cosa mi sembra impossibile oggi?",o:"Signore, credo che per te niente sia impossibile."},
"2026-12-20":{v:"Eccomi, sono la serva del Signore, avvenga di me quello che hai detto",r:"Lc 1,38",p:"Il «sì» di Maria ha cambiato la storia. Anche il nostro piccolo «sì» di ogni giorno cambia la nostra casa.",q:"A che cosa voglio dire «sì» a Dio in questa settimana di Natale?",o:"Signore, come Maria ti dico il mio sì: fai di me ciò che vuoi."},
"2026-12-21":{v:"E beata colei che ha creduto",r:"Lc 1,45",p:"Maria andò in fretta ad aiutare Elisabetta. La fede vera si trasforma in servizio.",q:"Chi ha bisogno di una mia visita o di una mano?",o:"Maria, insegnami a servire con gioia, come hai fatto con Elisabetta."},
"2026-12-22":{v:"L'anima mia magnifica il Signore",r:"Lc 1,46",p:"Maria canta le meraviglie di Dio. La gratitudine è il modo più bello di pregare.",q:"Quali meraviglie ha fatto Dio nella mia vita quest’anno?",o:"Signore, come Maria anche la mia anima ti loda, perché hai fatto meraviglie nella mia vita."},
"2026-12-23":{v:"Giovanni è il suo nome",r:"Lc 1,63",p:"Zaccaria tornò a parlare quando si fidò di Dio. La fiducia scioglie la nostra voce per lodare.",q:"Dove sono rimasta «muta» per paura o per sfiducia?",o:"Signore, sciogli la mia voce per lodarti e per dire parole di vita."},
"2026-12-24":{v:"grazie alla bontà misericordiosa del nostro Dio, per cui verrà a visitarci dall'alto un sole che sorge",r:"Lc 1,78",p:"Questa notte arriva la luce. Non importa quanto sia stato buio quest’anno: Gesù viene a illuminare.",q:"Quale buio voglio che la luce di Gesù illumini questa notte?",o:"Vieni, Gesù Bambino! Nasci nel mio cuore e nella mia casa questa notte."},
"2026-12-25":{v:"oggi vi è nato nella città di Davide un salvatore, che è il Cristo Signore.",r:"Lc 2,11",p:"Dio si è fatto piccolo perché nessuno avesse paura di avvicinarsi a Lui. Sta in una mangiatoia, e sta anche nel tuo cuore.",q:"Che cosa voglio dire a Gesù Bambino in questo Natale?",o:"Gesù Bambino, grazie perché sei venuto ad abitare con noi. Buon Natale, mio Signore!"},
"2026-12-26":{v:"Signore Gesù, accogli il mio spirito",r:"At 7,59",p:"Stefano è morto perdonando. Il Natale ci dà la forza di perdonare come Gesù.",q:"Chi devo perdonare per vivere in pace?",o:"Gesù, dammi un cuore che perdona, come quello di Stefano."},
"2026-12-27":{v:"E Gesù cresceva in sapienza, età e grazia davanti a Dio e agli uomini.",r:"Lc 2,52",p:"Gesù è cresciuto in una casa semplice, fatta di abitudini, lavoro e preghiera. Anche la nostra casa può essere santa.",q:"Quale abitudine della casa di Nazaret voglio portare nella mia casa?",o:"Gesù, Maria e Giuseppe, fate che la mia famiglia somigli alla vostra."},
"2026-12-28":{v:"Alzati, prendi con te il bambino e sua madre e fuggi in Egitto",r:"Mt 2,13",p:"Giuseppe ha protetto la sua famiglia senza esitare. Dio ci dà la grazia di proteggere i nostri piccoli.",q:"Da che cosa devo proteggere i miei figli oggi?",o:"Signore, custodisci i miei figli da ogni male e avvolgili con il tuo amore."},
"2026-12-29":{v:"perché i miei occhi han visto la tua salvezza",r:"Lc 2,30",p:"Simeone ha aspettato tutta la vita e ha visto Gesù. L’attesa con Dio non è mai inutile.",q:"Che cosa sto aspettando da Dio con pazienza?",o:"Signore, dammi la pazienza di Simeone per aspettare i tuoi tempi."},
"2026-12-30":{v:"parlava del bambino a quanti aspettavano la redenzione di Gerusalemme.",r:"Lc 2,38",p:"Anna, anziana e piena di fede, non tenne la gioia per sé. La raccontò a tutti.",q:"A chi posso raccontare qualcosa di bello che Dio ha fatto per me?",o:"Signore, fa’ che io parli di te con gioia, come la profetessa Anna."},
"2026-12-31":{v:"in ogni cosa rendete grazie",r:"1Ts 5,18",p:"Concludi l’anno ringraziando: per i giorni belli, per quelli difficili e per tutto ciò che Dio ti ha insegnato lungo il cammino.",q:"Quali sono state le grazie più grandi del 2026 per me e per la mia famiglia?",o:"Grazie, Signore, per ogni giorno di quest’anno. Metto il 2026 nelle tue mani."},
"2027-01-01":{v:"Maria, da parte sua, serbava tutte queste cose meditandole nel suo cuore.",r:"Lc 2,19",p:"L’anno comincia con Maria, la Madre di Dio. Lei ci insegna a custodire e meditare, non a correre e preoccuparci.",q:"Che cosa voglio custodire nel cuore nel 2027?",o:"Santa Maria, Madre di Dio, ti affido questo nuovo anno e la mia famiglia."},
"2027-01-02":{v:"Io sono voce di uno che grida nel deserto…",r:"Gv 1,23",p:"Giovanni Battista sapeva chi era e chi non era. Sapere che non dobbiamo essere tutto ci dona pace.",q:"Che cosa non devo portare da sola quest’anno?",o:"Signore, aiutami a essere soltanto ciò che tu vuoi che io sia."},
"2027-01-03":{v:"per un'altra strada fecero ritorno al loro paese.",r:"Mt 2,12",p:"Chi incontra Gesù non torna più come prima. In questa II Domenica dopo Natale, ricordiamo che il Natale lascia un segno sul nostro cammino.",q:"Quale cambiamento ha lasciato in me il Natale?",o:"Signore, quest’anno fammi prendere un’altra strada: la tua."},
"2027-01-04":{v:"Venite e vedrete",r:"Gv 1,39",p:"Gesù non fa una lezione ai discepoli: li invita a stare con Lui. La fede è vivere insieme a Lui.",q:"Come voglio passare più tempo con Gesù quest’anno?",o:"Gesù, voglio venire a vedere dove abiti. Voglio stare con te ogni giorno."},
"2027-01-05":{v:"Vieni e vedi",r:"Gv 1,46",p:"Filippo non discusse con Natanaele, lo invitò soltanto. Un invito semplice è il modo migliore per annunciare la fede.",q:"Chi posso invitare ad avvicinarsi a Dio?",o:"Signore, dammi il coraggio di invitare con dolcezza."},
"2027-01-06":{v:"Abbiamo visto sorgere la sua stella, e siamo venuti per adorarlo",r:"Mt 2,2",p:"Oggi è l’Epifania. I Magi hanno fatto tanta strada per adorare Gesù. L’adorazione è il posto migliore da cui cominciare l’anno.",q:"Quale «stella» sta usando Dio per guidarmi?",o:"Gesù, vengo ad adorarti. Guida i miei passi in questo anno."},
"2027-01-07":{v:"il popolo immerso nelle tenebre ha visto una grande luce",r:"Mt 4,16",p:"Gesù comincia a predicare e la luce si diffonde. Vuole illuminare ogni angolo della nostra quotidianità.",q:"Quale parte delle mie giornate ha bisogno di luce?",o:"Gesù, Luce del mondo, illumina le mie giornate e i miei progetti."},
"2027-01-08":{v:"Voi stessi date loro da mangiare",r:"Mc 6,37",p:"I discepoli pensavano di avere troppo poco. Nelle mani di Gesù, cinque pani hanno sfamato migliaia di persone.",q:"Che cosa mi sembra troppo poco, ma posso donarlo a Gesù?",o:"Signore, moltiplica il poco che ho: il mio tempo, le mie forze, il mio amore."},
"2027-01-09":{v:"Coraggio, sono io, non temete!",r:"Mc 6,50",p:"In mezzo al vento contrario, Gesù arriva camminando sulle acque. Arriva proprio nel mezzo della tempesta.",q:"Quale paura voglio consegnare a Gesù oggi?",o:"Gesù, quando ho paura, fa’ che io senta la tua voce che mi dà coraggio."},
"2027-01-10":{v:"Tu sei il Figlio mio prediletto, in te mi sono compiaciuto",r:"Mc 1,11",p:"Nel Battesimo Dio ha detto anche di te: figlia amata. Prima di qualunque cosa tu faccia, tu sei amata.",q:"Come sarebbe vivere questa giornata credendo di essere la figlia amata di Dio?",o:"Padre, grazie perché mi chiami figlia. Aiutami a vivere come tua figlia amata."},
"2027-01-11":{v:"Il tempo è compiuto e il regno di Dio è vicino",r:"Mc 1,15",p:"Il Tempo Ordinario non è un tempo senza grazia. È il tempo per crescere nella fede attraverso le cose di ogni giorno.",q:"Dove vuole crescere Dio in me in questo Tempo Ordinario?",o:"Signore, fa’ crescere il tuo Regno in me, nel mezzo della vita di tutti i giorni."},
"2027-01-12":{v:"perché insegnava loro come uno che ha autorità e non come gli scribi.",r:"Mc 1,22",p:"La parola di Gesù ha forza. Quando la lasciamo entrare, ci trasforma da dentro.",q:"Quale parola di Gesù voglio ripetere oggi?",o:"Gesù, parla al mio cuore. La tua parola mi basta."},
"2027-01-13":{v:"Tutti ti cercano!",r:"Mc 1,37",p:"Anche se tutti lo cercavano, Gesù usciva prima dell’alba per pregare. La preghiera è la sorgente di tutto.",q:"Qual è il momento migliore della giornata per pregare?",o:"Signore, aiutami a custodire ogni giorno un tempo solo per te."},
"2027-01-14":{v:"Se vuoi, puoi guarirmi!",r:"Mc 1,40",p:"Il lebbroso si avvicinò con umiltà e Gesù lo toccò. Lui non ha ribrezzo delle nostre ferite.",q:"Quale ferita voglio mostrare a Gesù?",o:"Signore, so che puoi guarirmi. Mi affido al tuo tocco."},
"2027-01-15":{v:"Gesù, vista la loro fede, disse al paralitico: «Figliolo, ti sono rimessi i tuoi peccati».",r:"Mc 2,5",p:"La fede degli amici portò il paralitico fino a Gesù. Anche la tua fede porta la tua famiglia.",q:"Chi sto «portando» a Gesù nella preghiera?",o:"Gesù, ti presento le persone che amo. Guarisci e benedici ciascuna di loro."},
"2027-01-16":{v:"non sono venuto per chiamare i giusti, ma i peccatori",r:"Mc 2,17",p:"Gesù è medico. Non aspetta che stiamo bene per avvicinarsi a noi.",q:"Dove devo lasciare che Gesù si prenda cura di me?",o:"Gesù, medico della mia anima, prenditi cura di me."},
"2027-01-17":{v:"Parla, Signore, perché il tuo servo ti ascolta",r:"1Sam 3,9",p:"Samuele imparò ad ascoltare Dio quando era ancora bambino. Quanto silenzio c’è nella nostra casa per ascoltare?",q:"Come posso creare un po’ di silenzio nella mia giornata?",o:"Signore, eccomi: parlami, tua figlia ti ascolta."},
"2027-01-18":{v:"ma vino nuovo in otri nuovi",r:"Mc 2,22",p:"Dio vuole fare cose nuove, ma ci serve un cuore aperto per accoglierle.",q:"Quale cosa nuova vuole fare Dio in me?",o:"Signore, rinnova il mio cuore perché sappia accogliere ciò che è nuovo."},
"2027-01-19":{v:"Il sabato è stato fatto per l'uomo",r:"Mc 2,27",p:"Anche riposare è obbedire a Dio. Una mamma riposata ama meglio.",q:"Come posso riposare un po’ questa settimana?",o:"Signore, insegnami a riposare in te senza sensi di colpa."},
"2027-01-20":{v:"Sii fedele fino alla morte e ti darò la corona della vita.",r:"Ap 2,10",p:"San Sebastiano fu fedele fino alla fine. Anche la fedeltà di ogni giorno, nelle piccole cose, è eroica.",q:"In quale piccola cosa posso essere fedele oggi?",o:"San Sebastiano, prega per noi e per la fedeltà della mia famiglia."},
"2027-01-21":{v:"Dio ha scelto ciò che nel mondo è debole per confondere i forti",r:"1Cor 1,27",p:"Sant’Agnese era solo una ragazzina, ma aveva un cuore immenso. Dio agisce attraverso i piccoli.",q:"In che cosa mi sento debole e posso lasciare agire Dio?",o:"Signore, la tua forza si mostra nella mia debolezza."},
"2027-01-22":{v:"Salì poi sul monte, chiamò a sé quelli che egli volle",r:"Mc 3,13",p:"Sei stata chiamata per nome. Gesù ti ha voluta, così come sei.",q:"A che cosa mi sta chiamando Gesù in questa fase della vita?",o:"Gesù, grazie perché mi chiami. Eccomi."},
"2027-01-23":{v:"Non hanno più vino",r:"Gv 2,3",p:"Maria si accorge prima di tutti di ciò che manca e lo porta a Gesù. Lo fa anche per la tua casa.",q:"Che cosa manca oggi nella mia casa?",o:"Maria, guarda la mia casa e presenta a Gesù ciò che ci manca."},
"2027-01-24":{v:"Lampada per i miei passi è la tua parola, luce sul mio cammino.",r:"Sal 119,105",p:"La Bibbia non è un libro da tenere sullo scaffale. È luce per il passo di oggi.",q:"Quale brano della Bibbia voglio leggere con i miei figli?",o:"Signore, che la tua Parola illumini ogni passo della mia famiglia."},
"2027-01-25":{v:"Che devo fare, Signore?",r:"At 22,10",p:"Paolo cadde, rimase cieco e poi vide come mai prima. A volte Dio usa le nostre cadute per convertirci.",q:"Che cosa vuole Dio che io faccia da oggi in poi?",o:"Signore, che cosa vuoi che io faccia? Sono pronta ad ascoltare."},
"2027-01-26":{v:"Mi ricordo infatti della tua fede schietta, fede che fu prima nella tua nonna Lòide, poi in tua madre Eunìce",r:"2Tm 1,5",p:"La fede di Timoteo è cominciata con la mamma e la nonna. Anche la tua fede si sta seminando nei tuoi figli.",q:"Quali semi di fede ho già piantato nei miei figli?",o:"Signore, che la mia fede sia un’eredità viva per i miei figli."},
"2027-01-27":{v:"E un'altra cadde sulla terra buona, diede frutto",r:"Mc 4,8",p:"Non ogni seme germoglia subito. Continua a seminare: alla crescita pensa Dio.",q:"Dove mi sono scoraggiata nel seminare?",o:"Signore, fa’ del mio cuore un terreno buono per la tua Parola."},
"2027-01-28":{v:"Si porta forse la lampada per metterla sotto il moggio o sotto il letto? O piuttosto per metterla sul lucerniere?",r:"Mc 4,21",p:"La tua fede non è fatta per restare nascosta. Illumina tutta la casa.",q:"Come posso lasciar brillare oggi la luce di Dio in casa?",o:"Signore, che la mia vita sia una luce accesa nella mia casa."},
"2027-01-29":{v:"il seme germoglia e cresce; come, egli stesso non lo sa.",r:"Mc 4,27",p:"Dio lavora in silenzio nel cuore dei nostri figli, anche quando non vediamo risultati.",q:"Per quale figlio (o persona) devo continuare ad avere fiducia?",o:"Signore, mi fido del tuo lavoro silenzioso nel cuore di chi amo."},
"2027-01-30":{v:"Perché siete così paurosi? Non avete ancora fede?",r:"Mc 4,40",p:"Gesù era nella barca per tutto il tempo. È anche nella barca della tua famiglia.",q:"Quale tempesta sto affrontando adesso?",o:"Gesù, calma le tempeste della mia casa. So che sei con me."},
"2027-01-31":{v:"Beati i miti, perché erediteranno la terra.",r:"Mt 5,5",p:"La mitezza non è debolezza. È forza unita alla dolcezza, quella che cambia il clima di una casa.",q:"In quale momento della giornata ho più bisogno di mitezza?",o:"Gesù, mite e umile di cuore, rendi il mio cuore simile al tuo."}
};
