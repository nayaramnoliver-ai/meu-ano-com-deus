<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}/* Layout: coluna única de celular (máx. 480px), cartões brancos com contorno pontilhado pastel, barra de abas fixa embaixo */
:root{
  /* Paleta mariana: azul claro, azul-marinho e caramelo; as cores litúrgicas ficam à parte (--lit-*) */
  --fundo:#FFFFFF;
  --tinta:#6E5440;      /* texto corrido, caramelo escuro */
  --titulo:#2F4C7C;     /* títulos azul-marinho */
  --suave:#A88C70;      /* legendas caramelo */
  --rosa:#5F87BC;       /* destaque azul mariano (nome antigo mantido) */
  --mao:#B98450;        /* letra manuscrita caramelo */
  --linha:#E7EDF5;
  --lil:#ECEEFA; --lil2:#AEB6E0;    /* azul-lavanda */
  --pk:#EAF1FA;  --pk2:#A9C4E6;     /* azul bem claro (padrão) */
  --az:#E3EEF9;  --az2:#8FB3DD;     /* azul claro */
  --ceu:#EEF6FC; --ceu2:#B2D1EE;    /* céu */
  --car:#F6ECDF; --car2:#D9B48C;    /* caramelo claro */
  --am:#FAF2E0;  --am2:#E0BE7C;     /* dourado */
  --vd:#ECF4F8;  --vd2:#A9C9DD;
  --lit-roxo:#B9A3DA; --lit-roxo-c:#F1EAF7;
  --lit-rosa:#EDA7B2; --lit-rosa-c:#FBE6E9;
  --lit-branco:#E3C25E; --lit-branco-c:#FCF4D6;
  --lit-verde:#A6C9A0; --lit-verde-c:#E4F0E2;
  --lit-verm:#E07F8E; --lit-verm-c:#FBE3E6;
  --verde-acao:#34578E;  /* botão principal: azul-marinho */
  --f-tit:"Fraunces",Georgia,"Times New Roman",serif;
  --f-txt:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mao:"Caveat","Segoe Print","Bradley Hand",cursive;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--fundo)}
body{margin:0;color:var(--tinta);font-family:var(--f-txt);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--rosa);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

#app{max-width:480px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-top:6px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;padding-block:8px 0}
.marca{font-family:var(--f-txt);font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--suave);display:flex;align-items:center;gap:7px}
.marca svg{width:16px;height:16px;color:var(--rosa)}
.icbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--titulo)}
.icbtn:active{background:var(--pk)}
.sub{display:flex;align-items:center;gap:6px;padding-block:6px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--fundo);z-index:5;margin-inline:-6px;padding-inline:0 6px}
.sub .icbtn{flex:none}
.sub span{font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

h1,h2,h3{font-family:var(--f-tit);color:var(--titulo);margin:0;line-height:1.15;text-wrap:balance;font-weight:700}
h1{font-size:30px;letter-spacing:-.01em}
h2{font-size:21px}
h3{font-size:17px}
p{margin:0}
.mao{font-family:var(--f-mao);color:var(--mao);font-size:24px;line-height:1.1}
.mini{font-size:12px;color:var(--suave)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--suave)}
.tag{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:var(--tg,var(--pk));color:var(--titulo);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border-radius:99px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}

/* cores pastel por tema */
.c-lilas{--bg:var(--lil);--bd:var(--lil2);--tg:var(--lil)}
.c-rosa{--bg:var(--car);--bd:var(--car2);--tg:var(--car)}
.c-azul{--bg:var(--az);--bd:var(--az2);--tg:var(--az)}
.c-verde{--bg:var(--ceu);--bd:var(--ceu2);--tg:var(--ceu)}
.c-amarelo{--bg:var(--am);--bd:var(--am2);--tg:var(--am)}

/* cartões */
.card{background:#fff;border:1.6px dashed var(--bd,var(--pk2));border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card.cheio{background:var(--bg);border-style:solid;border-color:transparent}
.card p{font-size:15px}

/* olá */
.ola{display:flex;flex-direction:column;gap:2px;padding-top:4px}
.ola h1{font-size:28px}

/* faixa do tempo litúrgico */
.tempo{background:var(--bg);border-radius:22px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.tempo .txt{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.tempo .tag{background:#fff}
.tempo p{font-size:14px}
.tempo p span{display:block;margin-top:3px;font-size:14.5px;font-weight:500;color:var(--tinta)}
.tempo b{font-family:var(--f-tit);color:var(--titulo);font-size:19px;font-weight:700;display:block;line-height:1.2}
.velas{display:flex;gap:6px;align-items:flex-end;flex:none}
.velas svg{width:16px;height:46px}

.corlit{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--suave)}
.corlit i{width:10px;height:10px;border-radius:50%;display:inline-block}
.santo{font-size:14px}
.santo b{color:var(--titulo);font-weight:600}

/* botões */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--verde-acao);color:#fff;font-weight:600;font-size:15px;border-radius:99px;padding:14px 20px;text-align:center;text-decoration:none;width:100%}
.btn svg{width:18px;height:18px}
.btn:active{filter:brightness(.95)}
.btn.sec{background:#fff;color:var(--titulo);border:1.6px solid var(--az2)}
.btn.rosa{background:var(--rosa)}
.marca svg{color:var(--mao)}
.btn.peq{padding:9px 16px;font-size:13.5px;width:auto}
.lnk{color:var(--rosa);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.feito{display:inline-flex;align-items:center;gap:6px;color:var(--verde-acao);font-weight:600;font-size:13px}
.feito svg{width:18px;height:18px}

blockquote{margin:0;font-family:var(--f-tit);font-style:italic;font-weight:500;font-size:19px;line-height:1.4;color:var(--titulo)}
cite{font-style:normal;font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--mao)}

/* semana */
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.semana span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--suave)}
.semana i{width:30px;height:30px;border-radius:50%;border:1.6px dashed var(--pk2);display:grid;place-items:center;color:#fff}
.semana i.ok{background:var(--rosa);border-color:var(--rosa)}
.semana i.hj{border-style:solid}
.semana i svg{width:16px;height:16px}

/* atalhos */
.atalhos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.atalho{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;text-align:center;line-height:1.25}
.atalho span{width:56px;height:56px;border-radius:18px;background:var(--bg);display:grid;place-items:center;color:var(--titulo)}
.atalho svg{width:26px;height:26px}

/* passos numerados (momento, novena) */
.passos{display:flex;flex-direction:column;gap:14px}
.passo{display:grid;grid-template-columns:30px 1fr;gap:12px}
.passo .n{width:30px;height:30px;border-radius:50%;background:var(--az);color:var(--titulo);font-family:var(--f-tit);font-weight:700;display:grid;place-items:center;font-size:15px}
.passo .c{display:flex;flex-direction:column;gap:8px;min-width:0;padding-top:3px}
.passo h3{font-size:16px}

textarea,input[type=text],input[type=date]{width:100%;font:inherit;font-size:15px;color:var(--tinta);background:#fff;border:1.6px dashed var(--pk2);border-radius:16px;padding:12px 14px;resize:vertical;background-image:repeating-linear-gradient(transparent 0 29px,var(--linha) 29px 30px);background-position:0 10px;line-height:30px}
input[type=text],input[type=date]{background-image:none;line-height:1.4}
textarea:focus,input:focus{outline:none;border-style:solid;border-color:var(--rosa)}
label.lb{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-inline:-18px;padding-inline:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1.4px solid var(--linha);font-size:13px;font-weight:600;color:var(--suave);background:#fff;white-space:nowrap}
.chip.on{background:var(--pk);border-color:var(--pk);color:var(--titulo)}
.chip[disabled]{opacity:.55;cursor:default}

/* planos */
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{background:var(--bg);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:168px;position:relative}
.pcard .pic{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--titulo)}
.pcard .pic svg{width:24px;height:24px}
.pcard .ptit{font-family:var(--f-tit);font-weight:700;color:var(--titulo);font-size:16px;line-height:1.2}
.pcard .pdias{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta);opacity:.75}
.pcard .novo{position:absolute;top:12px;right:12px;font-family:var(--f-mao);color:var(--mao);font-size:19px;line-height:1}
.barra{height:7px;border-radius:9px;background:#fff;overflow:hidden;margin-top:auto}
.barra i{display:block;height:100%;background:var(--rosa);border-radius:9px}
.card .barra{background:var(--pk)}
.andamento{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:18px;padding:12px 14px;width:100%}
.andamento .pic{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--titulo);flex:none}
.andamento .t{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.andamento b{font-family:var(--f-tit);color:var(--titulo);font-size:15px;line-height:1.2}
.andamento small{font-size:12px}

.phero{background:var(--bg);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.phero .tag{background:#fff}
.phero .pic{width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--titulo)}
.phero .pic svg{width:28px;height:28px}

.dias{display:flex;flex-direction:column}
.dia-row{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1.4px dashed var(--linha);width:100%}
.dia-row:last-child{border-bottom:0}
.dia-row .t{display:flex;flex-direction:column;min-width:0;flex:1}
.dia-row small{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.dia-row b{font-weight:600;font-size:14.5px;color:var(--tinta)}
.chk{width:28px;height:28px;border-radius:50%;border:1.6px dashed var(--bd,var(--pk2));display:grid;place-items:center;flex:none;color:#fff}
.chk.ok{background:var(--rosa);border:0}
.chk svg{width:16px;height:16px}
.dia-row .seta{color:var(--suave)}
.dia-row .seta svg{width:18px;height:18px}

.bloco{display:flex;flex-direction:column;gap:6px}
.oracao-txt{white-space:pre-line;font-size:16px;line-height:1.7}
.oracao-curta{font-family:var(--f-tit);font-style:italic;font-size:17px;color:var(--titulo);line-height:1.45}
.navdias{display:flex;justify-content:space-between;gap:10px}

/* listas de orações */
.lista{display:flex;flex-direction:column;background:#fff;border:1.6px dashed var(--bd,var(--pk2));border-radius:20px;padding:4px 16px}
.lista .item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1.4px dashed var(--linha);width:100%}
.lista .item:last-child{border-bottom:0}
.lista .item b{flex:1;font-weight:600;font-size:14.5px}
.lista .item small{display:block;font-weight:500;font-size:12px;color:var(--suave)}
.lista .item svg{color:var(--suave);width:18px;height:18px}
details.item{display:block}
details.item summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:600;font-size:14.5px}
details.item summary::-webkit-details-marker{display:none}
details.item summary b{flex:1}
details.item p{padding-top:8px;white-space:pre-line}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{background:var(--bg);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mcard .pic{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--titulo)}
.mcard b{font-family:var(--f-tit);color:var(--titulo);font-size:17px;line-height:1.15}
.mcard small{font-size:12.5px;line-height:1.35}

/* terço */
.terco-top{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.contas{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;padding-block:6px}
.contas i{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--az2);background:#fff;transition:background .2s,transform .2s}
.contas i.g{width:26px;height:26px}
.contas i.ok{background:var(--az2)}
.contas i.at{background:var(--titulo);border-color:var(--titulo);transform:scale(1.15)}
.terco-orar{min-height:200px}
.terco-orar h2{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.terco-orar h2 small{font-family:var(--f-mao);color:var(--mao);font-size:22px;font-weight:400}
.terco-bts{display:grid;grid-template-columns:auto 1fr;gap:10px}
.terco-bts .btn.sec{width:auto;padding-inline:18px}
.misterio{background:var(--lil);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px}

/* novenas */
.nove{display:flex;gap:6px}
.nove i{width:24px;height:24px;border-radius:50%;border:1.6px dashed var(--bd,var(--lil2));display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:600;color:var(--suave)}
.nove i.ok{background:var(--rosa);border:0;color:#fff}

/* pedidos */
.pedido{display:flex;flex-direction:column;gap:6px}
.pedido .para{font-family:var(--f-mao);color:var(--mao);font-size:22px;line-height:1}
.pedido .acoes{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.vazio{text-align:center;padding:22px 10px;display:flex;flex-direction:column;gap:6px;align-items:center}
.vazio svg{width:34px;height:34px;color:var(--pk2)}

/* rotina kids */
.rotina{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rot{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;border:1.6px dashed var(--am2);font-size:13.5px;font-weight:600;line-height:1.25}
.rot svg{width:22px;height:22px;color:var(--titulo)}
.rot.ok{background:var(--am);border-style:solid;border-color:var(--am)}
.estrelas{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.estrelas span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--suave)}
.estrelas b{font-family:var(--f-tit);color:var(--titulo);font-size:15px}
.estrelas svg{width:18px;height:18px;color:var(--am2)}
.estrelas .cheia svg{fill:var(--am2)}
.historia{white-space:pre-line;font-size:16.5px;line-height:1.75}
.conversa{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* calendário */
.mesnav{display:flex;align-items:center;justify-content:space-between}
.mesnav h2{text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .ds{font-size:10.5px;font-weight:600;color:var(--suave);padding-bottom:4px}
.cal button{aspect-ratio:1;max-width:100%;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.cal button i{width:6px;height:6px;border-radius:50%}
.cal button.esp{font-weight:700;color:var(--titulo)}
.cal button.dom{color:var(--mao)}
.cal button.hj{border:1.6px solid var(--rosa)}
.cal button.sel{background:var(--pk)}
.cal button:disabled{opacity:.35}
.legenda{display:flex;flex-direction:column;gap:10px}
.legenda div{display:grid;grid-template-columns:14px 1fr;gap:10px;align-items:start;font-size:13.5px;line-height:1.4}
.legenda i{width:12px;height:12px;border-radius:50%;margin-top:3px}
.legenda b{display:block;color:var(--titulo);font-weight:600}
.cores-leg summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.cores-leg summary::-webkit-details-marker{display:none}
.cores-leg summary svg{width:18px;height:18px;color:var(--suave);transform:rotate(90deg);transition:transform .2s}
.cores-leg:not([open]) summary svg{transform:none}
.datas{display:flex;flex-direction:column;gap:2px}
.datas button{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1.4px dashed var(--linha);width:100%}
.datas button:last-child{border-bottom:0}
.datas .d{font-family:var(--f-mao);color:var(--mao);font-size:24px;line-height:1;min-width:30px}
.datas b{font-weight:600;font-size:14px}

/* aviso de confirmação */
.confirma{background:var(--pk);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px}

/* barra de abas */
#nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1.6px dashed var(--linha);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));z-index:20}
#nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--suave);padding:6px 0;text-align:center}
#nav button svg{width:24px;height:24px}
#nav button.on{color:var(--rosa)}
#nav button.on span{background:var(--pk);border-radius:99px;padding:2px 12px}
#nav button span{padding:2px 12px;display:grid;place-items:center}

#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--titulo);color:#fff;font-weight:600;font-size:14px;padding:12px 18px;border-radius:99px;opacity:0;transition:opacity .25s,transform .25s;z-index:30;max-width:calc(100% - 40px);text-align:center;pointer-events:none}

.sep{height:0;border-top:1.6px dashed var(--linha)}
.rodape{text-align:center;padding-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Pontos de quebra em azul-marinho: 1 ou 2 por tela, sempre o foco principal */
.escuro{--esc:#2B4774;background:var(--esc);color:#F3F7FC;border:0;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;outline:1.4px dashed rgba(255,255,255,.32);outline-offset:-8px}
.escuro h1,.escuro h2,.escuro h3,.escuro b{color:#fff}
.escuro .eyebrow,.escuro .mini{color:#B7CDEB}
.escuro blockquote{color:#fff}
.escuro cite,.escuro .mao{color:#E9C99E}
.escuro .tag{background:rgba(255,255,255,.16);color:#fff}
.escuro .corlit{color:#C9D9EF}
.escuro .btn{background:#fff;color:var(--esc)}
.escuro .btn.sec{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.escuro .feito{color:#CFE3FA}
.escuro .santo b{color:#E9C99E}
.escuro .pic{background:rgba(255,255,255,.14)!important;color:#fff!important}

.escuro .semana i.ok{background:#E9C99E;border-color:#E9C99E;color:var(--esc)}
.escuro .semana i.hj{border-style:solid;border-color:#fff}
.escuro .sep{border-color:rgba(255,255,255,.22)}
.escuro .lnk{color:#E9C99E}

.iconeapp svg{width:100%;height:100%;display:block}
.tcel{gap:10px}

.tbt.on small{color:#C9D9EF}

.tpasso{display:grid;grid-template-columns:40px 1fr;gap:12px;border:1.6px dashed var(--pk2);border-radius:20px;padding:16px 14px}
.tnum{width:40px;height:40px;border-radius:50%;background:var(--titulo);color:#fff;font-family:var(--f-tit);font-weight:700;font-size:20px;display:grid;place-items:center}
.tc{display:flex;flex-direction:column;gap:10px;min-width:0}
.tc h3{font-size:20px;padding-top:6px}
.tc p{font-size:17px;line-height:1.6}
.tc .dica{font-size:15px;background:var(--am);border-radius:14px;padding:10px 12px}
.ilu{width:76px;height:76px;border-radius:20px;background:var(--az);display:grid;place-items:center;color:var(--titulo);border:2.5px solid var(--mao)}
.ilu svg{width:44px;height:44px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Desafio especial em destaque na tela de início */
.dest{--dbg:var(--lit-roxo-c);--dbd:var(--lit-roxo);background:var(--dbg);border:2px solid var(--dbd);border-radius:24px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;outline:1.4px dashed var(--dbd);outline-offset:-9px}
.dest.d-ouro{--dbg:var(--am);--dbd:var(--am2)}
.dest .dtopo{display:flex;gap:14px;align-items:center;justify-content:space-between}
.dest .tag{background:#fff}
.dest h2{font-size:25px;line-height:1.15;text-wrap:balance}
.dest .grande{font-size:16px;line-height:1.5;color:var(--tinta)}
.dest .grande b,.dest p b{color:var(--titulo)}
.dest .cont{flex:none;width:82px;height:82px;border-radius:50%;background:#fff;border:2px dashed var(--dbd);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;color:var(--titulo);text-align:center}
.dest .cont b{font-family:var(--f-tit);font-size:30px;font-weight:700}
.dest .cont small{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta)}
.dest .barra{background:#fff;height:9px}
.dest .dok{display:flex;gap:8px;align-items:flex-start;font-weight:600;color:var(--titulo);font-size:15px}
.dest .dok svg{width:20px;height:20px;flex:none;margin-top:2px;color:var(--verde-acao)}

/* dia completo dos desafios */
.dcel{font-size:14px;font-weight:600;color:var(--mao)}
.daviso .eyebrow{display:flex;align-items:center;gap:6px;color:var(--titulo)}
.daviso .eyebrow svg{width:15px;height:15px}
.daviso p{font-size:15px;color:var(--tinta)}
.dpal .mini{color:var(--tinta)}
.dpal .btn{align-self:flex-start}
.dperg .grande b{font-family:var(--f-tit);font-size:19px;line-height:1.35;color:var(--titulo);font-weight:700}
.escuro .grande{font-size:16px;line-height:1.55}
.bloco p+p{margin-top:6px}
/* lembrete diário */
select{width:100%;font:inherit;font-size:17px;font-weight:600;color:var(--titulo);background:#fff;border:1.6px dashed var(--pk2);border-radius:16px;padding:12px 14px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--titulo) 50%),linear-gradient(135deg,var(--titulo) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.lembc .pic{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--titulo);flex:none}
.lembc .pic svg{width:24px;height:24px}
#lembrete{scroll-margin-top:72px}

"2026-11-22":{v:"My kingdom does not belong to this world.",r:"Jn 18:36",p:"Jesus does not reign with force or by raising his voice. He reigns by serving, with patience and love, just as a mother reigns in the heart of her home.",q:"In what area of my life have I not yet let Jesus be King?",o:"Jesus, King of my heart, reign in my home, in my schedule and in my words."},
"2026-11-23":{v:"but she, from her poverty, has offered her whole livelihood.",r:"Lk 21:4",p:"The widow gave little, but she gave everything. God does not measure the size of the gift; he measures the size of the love.",q:"What “little” thing in my life can I offer with great love today?",o:"Lord, receive the little that I am today. In your hands, it becomes so much."},
"2026-11-24":{v:"Remember, you are not to prepare your defense beforehand",r:"Lk 21:14",p:"In hard moments, God himself puts the right words on our lips. We don’t have to rehearse everything on our own.",q:"Which conversation worries me that I have not yet given to God?",o:"Holy Spirit, speak through me when I don’t know what to say."},
"2026-11-25":{v:"By your perseverance you will secure your lives.",r:"Lk 21:19",p:"To persevere is to keep going, even slowly. A mother’s faith is made of small new beginnings every day.",q:"Where do I need to persevere, even when I am tired?",o:"Lord, give me perseverance to keep doing good, one day at a time."},
"2026-11-26":{v:"stand erect and raise your heads because your redemption is at hand.",r:"Lk 21:28",p:"God does not want us to live with our heads down. Even in difficulties, he is coming to help us. On this Thanksgiving Day, lift your eyes and give thanks.",q:"What has been keeping my head down lately?",o:"Father, lift my eyes to you. Thank you for all you have given my family. I trust that you are near."},
"2026-11-27":{v:"Do whatever he tells you.",r:"Jn 2:5",p:"Mary’s advice is simple: listen to Jesus and do what he says. She always brings us closer to her Son.",q:"What has Jesus been asking of me that I keep putting off?",o:"Mary, my Mother, teach me to do whatever Jesus tells me."},
"2026-11-28":{v:"Be vigilant at all times and pray",r:"Lk 21:36",p:"Advent begins tomorrow. It is time to prepare the house and, even more, the heart.",q:"How do I want to arrive at Christmas this year?",o:"Lord, prepare my heart to welcome you this Advent."},
"2026-11-29":{v:"Watch, therefore; you do not know when the lord of the house is coming…",r:"Mk 13:35",p:"To watch is not to live in fear; it is to live awake to God. He comes every day in the small details of our routine.",q:"Where might God be trying to meet me this week?",o:"Come, Lord Jesus! Find my heart awake and my doors wide open."},
"2026-11-30":{v:"Come after me, and I will make you fishers of men.",r:"Mt 4:19",p:"Andrew left his nets at once. Sometimes following Jesus begins with a small “yes” in the middle of our work.",q:"What “net” do I need to leave behind to follow Jesus more closely?",o:"Jesus, I want to follow you today, even in the middle of my housework."},
"2026-12-01":{v:"Then the wolf shall be a guest of the lamb",r:"Is 11:6",p:"God’s dream is peace. A peace that begins inside us and spreads through the whole house.",q:"Where is peace missing in my home?",o:"Prince of Peace, make your home in my home and calm our hearts."},
"2026-12-02":{v:"My heart is moved with pity for the crowd…",r:"Mt 15:32",p:"Jesus notices people’s weariness and hunger. He notices your weariness too.",q:"What am I “hungry” for today: rest, affection, silence?",o:"Lord, you know how tired I am. Feed me with your presence."},
"2026-12-03":{v:"Go into the whole world and proclaim the gospel to every creature.",r:"Mk 16:15",p:"Not every mission is on the other side of the world. A mother’s first mission field is her own home.",q:"How can I proclaim Jesus at home without needing words?",o:"Jesus, make my home a little mission field, full of your love."},
"2026-12-04":{v:"Let it be done for you according to your faith.",r:"Mt 9:29",p:"The blind men kept asking, and Jesus healed them. Persistent faith does not bother God; it moves his heart.",q:"What request do I need to keep bringing to God with faith?",o:"Lord, increase my faith. I keep my hope in you."},
"2026-12-05":{v:"Without cost you have received; without cost you are to give.",r:"Mt 10:8",p:"Everything we have, we received from God. Giving generously is returning a little of the much he gives us.",q:"What have I received freely that I can share today?",o:"Father, give me a generous heart that shares with joy."},
"2026-12-06":{v:"Prepare the way of the Lord, make straight his paths.",r:"Mk 1:3",p:"Preparing the way means clearing away the stones: a hurt, a bad habit, a hurry that leaves no room for God.",q:"What “stone” do I want to clear from the path before Christmas?",o:"Lord, help me prepare the way so that you can come to me."},
"2026-12-07":{v:"As for you, your sins are forgiven.",r:"Lk 5:20",p:"Before healing the body, Jesus heals the heart. God’s forgiveness is the greatest gift we can receive in Advent.",q:"Is there something I need to bring to Confession before Christmas?",o:"Merciful Jesus, I trust in your forgiveness. Make my heart new."},
"2026-12-08":{v:"Hail, favored one! The Lord is with you.",r:"Lk 1:28",p:"From the very first moment, God prepared Mary to be the home of Jesus. Today we celebrate the Immaculate Conception, Patroness of the United States. Mary helps us become a home for Jesus too.",q:"What do I want to ask Our Lady for my family?",o:"Immaculate Conception, dear Mother, I consecrate my home and my children to you."},
"2026-12-09":{v:"Come to me, all you who labor and are burdened, and I will give you rest.",r:"Mt 11:28",p:"Jesus does not ask us to come to him already rested. He asks us to come just as we are.",q:"What is weighing on my shoulders today?",o:"Jesus, I come just as I am. Give me your rest."},
"2026-12-10":{v:"I am the LORD, your God, teaching you how to prevail",r:"Is 48:17",p:"God is the best teacher. He teaches us with patience, the way we teach our children.",q:"What has God been teaching me in this season?",o:"Lord, teach me your way, and I will walk in it."},
"2026-12-11":{v:"But wisdom is vindicated by her works.",r:"Mt 11:19",p:"God’s wisdom shows more in what we do than in what we say.",q:"Which of my actions today shows that I belong to God?",o:"Lord, may my actions speak of you."},
"2026-12-12":{v:"Am I not here, I who am your mother?",r:"Our Lady of Guadalupe to St. Juan Diego",p:"Today we celebrate Our Lady of Guadalupe, Patroness of the Americas. Mary told Juan Diego that he was in the fold of her mantle. You are in the Mother’s arms too.",q:"What worry do I want to place in Our Lady’s arms?",o:"Mother of Guadalupe, I place myself in your arms with everything that worries me."},
"2026-12-13":{v:"Rejoice in the Lord always. … The Lord is near.",r:"Phil 4:4-5",p:"Christian joy does not depend on everything being perfect. It is born from knowing that God is near.",q:"What are three reasons for joy I have today?",o:"Lord, fill my home with the joy that comes from you."},
"2026-12-14":{v:"At the evening of life, we shall be judged on our love.",r:"St. John of the Cross (Catechism, 1022)",p:"In the end, what matters is not a perfect house or a full schedule. It is the love we put into each thing.",q:"Which of today’s tasks can I do with more love?",o:"Lord, help me do small things with great love."},
"2026-12-15":{v:"tax collectors and prostitutes are entering the kingdom of God before you.",r:"Mt 21:31",p:"God treasures those who truly repent and change. It is never too late to begin again.",q:"Where do I want to begin again before Christmas?",o:"Lord, thank you that I can always begin again with you."},
"2026-12-16":{v:"the blind regain their sight, the lame walk … the poor have the good news proclaimed to them.",r:"Lk 7:22",p:"Jesus is recognized by the good he does. Signs of him appear in our home too.",q:"What sign of God’s love did I see this week?",o:"Jesus, open my eyes to see your signs in my home."},
"2026-12-17":{v:"The book of the genealogy of Jesus Christ, the son of David",r:"Mt 1:1",p:"Jesus’ family tree had saints and sinners. God is not afraid of our family’s story: he embraces it.",q:"What part of my family’s story do I need to give to God?",o:"Jesus, Wisdom of God, enter my family’s story and heal what needs healing."},
"2026-12-18":{v:"he did as the angel of the Lord had commanded him",r:"Mt 1:24",p:"Joseph did not understand everything, but he trusted and acted. Sometimes faith is taking the next step without seeing the whole staircase.",q:"What step is God asking of me, even if I don’t understand it all?",o:"St. Joseph, teach me to trust and obey with a peaceful heart."},
"2026-12-19":{v:"nothing will be impossible for God.",r:"Lk 1:37",p:"Elizabeth was old, and she became a mother. God knows how to act in his own time, even when it seems too late.",q:"What seems impossible to me today?",o:"Lord, I believe that nothing is impossible for you."},
"2026-12-20":{v:"Behold, I am the handmaid of the Lord. May it be done to me according to your word.",r:"Lk 1:38",p:"Mary’s “yes” changed history. Our small “yes” each day changes our home too.",q:"What do I want to say “yes” to God about in this Christmas week?",o:"Lord, like Mary, I say: may your will be done in me."},
"2026-12-21":{v:"Blessed are you who believed",r:"Lk 1:45",p:"Mary went in haste to help Elizabeth. True faith turns into service.",q:"Who needs a visit or a helping hand from me?",o:"Mary, teach me to serve with joy, as you did with Elizabeth."},
"2026-12-22":{v:"My soul proclaims the greatness of the Lord",r:"Lk 1:46",p:"Mary sings of God’s wonders. Gratitude is the most beautiful way to pray.",q:"What wonders has God done in my life this year?",o:"Lord, like Mary, my soul praises you, because you have done great things for me."},
"2026-12-23":{v:"John is his name",r:"Lk 1:63",p:"Zechariah spoke again when he trusted God. Trust sets our voice free to praise.",q:"Where have I gone “silent” out of fear or doubt?",o:"Lord, set my voice free to praise you and to speak words of life."},
"2026-12-24":{v:"because of the tender mercy of our God by which the daybreak from on high will visit us",r:"Lk 1:78",p:"Tonight the light arrives. No matter how dark the year has been, Jesus comes to bring light.",q:"What darkness do I want the light of Jesus to shine on tonight?",o:"Come, Baby Jesus! Be born in my heart and in my home tonight."},
"2026-12-25":{v:"For today in the city of David a savior has been born for you who is Messiah and Lord.",r:"Lk 2:11",p:"God became small so that no one would be afraid to come close to him. He fits in a manger, and he fits in your heart.",q:"What do I want to tell Baby Jesus this Christmas?",o:"Baby Jesus, thank you for coming to live with us. Merry Christmas, my Lord!"},
"2026-12-26":{v:"Lord Jesus, receive my spirit.",r:"Acts 7:59",p:"Stephen died forgiving. Christmas gives us strength to forgive as Jesus did.",q:"Whom do I need to forgive in order to live in peace?",o:"Jesus, give me a forgiving heart, like Stephen’s."},
"2026-12-27":{v:"And Jesus advanced in wisdom and age and favor before God and man.",r:"Lk 2:52",p:"Jesus grew up in a simple home, with routine, work and prayer. Our home can be holy too.",q:"What habit from the home in Nazareth do I want to bring into my home?",o:"Jesus, Mary and Joseph, may my family become more like yours."},
"2026-12-28":{v:"Rise, take the child and his mother, flee to Egypt",r:"Mt 2:13",p:"Joseph protected his family without delay. God gives us the grace to protect our little ones.",q:"What do I need to protect my children from today?",o:"Lord, keep my children from all harm and cover them with your love."},
"2026-12-29":{v:"for my eyes have seen your salvation",r:"Lk 2:30",p:"Simeon waited his whole life, and he saw Jesus. Waiting with God is never in vain.",q:"What am I patiently waiting for from God?",o:"Lord, give me Simeon’s patience to wait for your time."},
"2026-12-30":{v:"spoke about the child to all who were awaiting the redemption of Jerusalem.",r:"Lk 2:38",p:"Anna, old and full of faith, did not keep her joy to herself. She told everyone.",q:"Whom can I tell about something good God has done for me?",o:"Lord, may I speak of you with joy, like the prophetess Anna."},
"2026-12-31":{v:"In all circumstances give thanks",r:"1 Thes 5:18",p:"End the year giving thanks: for the good days, for the hard ones, and for everything God taught you along the way.",q:"What were the greatest graces of 2026 for me and my family?",o:"Thank you, Lord, for every day of this year. I place 2026 in your hands."},
"2027-01-01":{v:"And Mary kept all these things, reflecting on them in her heart.",r:"Lk 2:19",p:"The year begins with Mary, the Mother of God. She teaches us to treasure and reflect, not to rush and worry.",q:"What do I want to treasure in my heart in 2027?",o:"Holy Mary, Mother of God, I entrust this new year and my family to you."},
"2027-01-02":{v:"I am ‘the voice of one crying out in the desert’",r:"Jn 1:23",p:"John the Baptist knew who he was and who he was not. Knowing we don’t have to be everything gives us peace.",q:"What don’t I need to carry alone this year?",o:"Lord, help me to be only what you want me to be."},
"2027-01-03":{v:"We saw his star at its rising and have come to do him homage.",r:"Mt 2:2",p:"The Magi traveled far to worship Jesus. Adoration is the best place to begin the year.",q:"What “star” has God been using to guide me?",o:"Jesus, I come to adore you. Guide my steps this year."},
"2027-01-04":{v:"Come, and you will see.",r:"Jn 1:39",p:"Jesus does not give his disciples a lecture; he invites them to be with him. Faith is time spent together. Today we remember St. Elizabeth Ann Seton, a wife and mother who found Jesus in everyday life.",q:"How do I want to spend more time with Jesus this year?",o:"Jesus, I want to come and see where you stay. I want to be with you every day."},
"2027-01-05":{v:"Come and see.",r:"Jn 1:46",p:"Philip did not argue with Nathanael; he simply invited him. A simple invitation is the best way to share our faith.",q:"Whom can I invite to come closer to God?",o:"Lord, give me the courage to invite with kindness."},
"2027-01-06":{v:"they departed for their country by another way.",r:"Mt 2:12",p:"Whoever meets Jesus does not go back the same. Christmas leaves its mark on our path.",q:"What change did Christmas leave in me?",o:"Lord, may I take another way this year: your way."},
"2027-01-07":{v:"the people who sit in darkness have seen a great light…",r:"Mt 4:16",p:"Jesus begins to preach, and the light spreads. He wants to light up every corner of our routine.",q:"What part of my routine needs light?",o:"Jesus, Light of the world, light up my routine and my plans."},
"2027-01-08":{v:"Give them some food yourselves.",r:"Mk 6:37",p:"The disciples thought they had too little. In Jesus’ hands, five loaves fed thousands.",q:"What do I think is too little that I can give to Jesus?",o:"Lord, multiply the little I have: my time, my strength, my love."},
"2027-01-09":{v:"Take courage, it is I, do not be afraid!",r:"Mk 6:50",p:"In the middle of a contrary wind, Jesus comes walking on the water. He arrives in the middle of the storm.",q:"What fear do I want to give to Jesus today?",o:"Jesus, when I am afraid, may I hear your voice: take courage, it is I."},
"2027-01-10":{v:"You are my beloved Son; with you I am well pleased.",r:"Mk 1:11",p:"At your Baptism, God said this about you too: beloved daughter. Before anything you do, you are loved.",q:"What would it be like to live this day believing that I am God’s beloved daughter?",o:"Father, thank you for calling me your daughter. Help me live as your beloved daughter."},
"2027-01-11":{v:"This is the time of fulfillment. The kingdom of God is at hand.",r:"Mk 1:15",p:"Ordinary Time is not a time without grace. It is the time to grow in faith through everyday things.",q:"Where does God want to grow in me during Ordinary Time?",o:"Lord, let your kingdom grow in me, in the middle of ordinary life."},
"2027-01-12":{v:"for he taught them as one having authority and not as the scribes.",r:"Mk 1:22",p:"Jesus’ word has power. When we let it in, it changes us from within.",q:"Which word of Jesus do I want to repeat today?",o:"Jesus, speak to my heart. Your word is enough for me."},
"2027-01-13":{v:"Everyone is looking for you.",r:"Mk 1:37",p:"Even with everyone looking for him, Jesus went out before dawn to pray. Prayer is the source of everything.",q:"What is the best time of day for me to pray?",o:"Lord, help me keep some time just for you, every day."},
"2027-01-14":{v:"If you wish, you can make me clean.",r:"Mk 1:40",p:"The leper came near with humility, and Jesus touched him. He is not put off by our wounds.",q:"What wound do I want to show Jesus?",o:"Lord, if you wish, you can heal me. I trust your touch."},
"2027-01-15":{v:"When Jesus saw their faith, he said to the paralytic, ‘Child, your sins are forgiven.’",r:"Mk 2:5",p:"The faith of his friends carried the paralyzed man to Jesus. Your faith carries your family too.",q:"Whom am I “carrying” to Jesus in prayer?",o:"Jesus, I bring you the people I love. Heal and bless each one."},
"2027-01-16":{v:"I did not come to call the righteous but sinners.",r:"Mk 2:17",p:"Jesus is a physician. He does not wait for us to be well before he comes close.",q:"Where do I need to let Jesus take care of me?",o:"Jesus, physician of my soul, take care of me."},
"2027-01-17":{v:"Speak, LORD, for your servant is listening.",r:"1 Sm 3:9",p:"Samuel learned to listen to God as a boy. How much silence is there in our home for listening?",q:"How can I make a little silence in my day?",o:"Speak, LORD, for your servant is listening."},
"2027-01-18":{v:"Rather, new wine is poured into fresh wineskins.",r:"Mk 2:22",p:"God wants to do new things, but we need an open heart to receive them.",q:"What new thing does God want to do in me?",o:"Lord, renew my heart so I can receive what is new."},
"2027-01-19":{v:"The sabbath was made for man…",r:"Mk 2:27",p:"Resting is also obedience to God. A rested mother loves better.",q:"How can I rest a little this week?",o:"Lord, teach me to rest in you without guilt."},
"2027-01-20":{v:"Remain faithful until death, and I will give you the crown of life.",r:"Rv 2:10",p:"St. Sebastian was faithful to the end. Faithfulness every day, in small things, is heroic too.",q:"In what small thing can I be faithful today?",o:"St. Sebastian, pray for us and for the faithfulness of my family."},
"2027-01-21":{v:"God chose the weak of the world to shame the strong",r:"1 Cor 1:27",p:"St. Agnes was just a girl, but she had an enormous heart. God works through the little ones.",q:"Where do I feel weak and can let God act?",o:"Lord, your strength shows itself in my weakness."},
"2027-01-22":{v:"He went up the mountain and summoned those whom he wanted",r:"Mk 3:13",p:"You were called by name. Jesus wanted you, just as you are.",q:"What is Jesus calling me to in this season of life?",o:"Jesus, thank you for calling me. Here I am."},
"2027-01-23":{v:"They have no wine.",r:"Jn 2:3",p:"Mary notices what is missing before anyone else and brings it to Jesus. She does this for your home too.",q:"What is missing in my home today?",o:"Mary, look at my home and bring to Jesus what we lack."},
"2027-01-24":{v:"Your word is a lamp for my feet, a light for my path.",r:"Ps 119:105",p:"The Bible is not a book for the shelf. It is light for today’s step.",q:"Which Bible passage do I want to read with my children?",o:"Lord, may your Word light every step of my family."},
"2027-01-25":{v:"What shall I do, sir?",r:"Acts 22:10",p:"Paul fell, was blinded, and then saw as never before. Sometimes God uses our falls to turn us toward him.",q:"What does God want me to do from today on?",o:"Lord, what do you want me to do? I am ready to listen."},
"2027-01-26":{v:"I recall your sincere faith that first lived in your grandmother Lois and in your mother Eunice",r:"2 Tm 1:5",p:"Timothy’s faith began with his mother and grandmother. Your faith is being planted in your children too.",q:"What seeds of faith have I already planted in my children?",o:"Lord, may my faith be a living inheritance for my children."},
"2027-01-27":{v:"And some seed fell on rich soil and produced fruit.",r:"Mk 4:8",p:"Not every seed sprouts right away. Keep sowing: God takes care of the growth.",q:"Where have I grown discouraged from sowing?",o:"Lord, make my heart good soil for your Word."},
"2027-01-28":{v:"Is a lamp brought in to be placed under a bushel basket or under a bed, and not to be placed on a lampstand?",r:"Mk 4:21",p:"Your faith is not meant to stay hidden. It lights up the whole house.",q:"How can I let God’s light shine at home today?",o:"Lord, may my life be a lamp that stays lit in my home."},
"2027-01-29":{v:"and the seed would sprout and grow, he knows not how.",r:"Mk 4:27",p:"God works quietly in our children’s hearts, even when we see no results.",q:"For which child (or person) do I need to keep trusting?",o:"Lord, I trust your quiet work in the hearts of those I love."},
"2027-01-30":{v:"Why are you terrified? Do you not yet have faith?",r:"Mk 4:40",p:"Jesus was in the boat the whole time. He is in your family’s boat too.",q:"What storm am I facing right now?",o:"Jesus, calm the storms in my home. I know you are with me."},
"2027-01-31":{v:"Blessed are the meek, for they will inherit the land.",r:"Mt 5:5",p:"Meekness is not weakness. It is strength with gentleness, the kind that changes the mood of a home.",q:"At what time of day do I most need meekness?",o:"Jesus, meek and humble of heart, make my heart like unto thine."}

// Advent Challenge 2026 (Nov 29 to Dec 24): one full day for each date, following the Church's readings (Year B, USCCB calendar).
// Fields: t title · cel celebration · aviso (holy day or note) · tipo/ref chosen reading · v line from the reading (NABRE, filled by preenche.py)
// exp what the reading says · med meditation (paragraphs) · perg question for the heart · des family challenge · ora prayer
(function(){
var D=[
{t:"Keeping watch with an awake heart",cel:"First Sunday of Advent",vela:1,
aviso:"Sunday Mass is an obligation: go to Holy Mass. Today a new liturgical year begins and we light the first candle of the wreath.",
tipo:"Gospel",ref:"Mk 13:33-37",v:"Watch, therefore; you do not know when the lord of the house is coming…",
exp:"Jesus tells the story of a man who goes on a journey and leaves his house in the care of his servants, each with his own work. The gatekeeper receives a special order: stay awake. No one knows when the master will come back. In the first reading (Is 63–64), the people beg God to tear open the heavens and come down.",
med:["Advent holds two kinds of waiting. We wait for Christmas, the memory of Jesus’ first coming in Bethlehem. And we wait for his return in glory at the end of time. Keeping watch means living both with an awake heart.","Keeping watch is not living in fear. It means taking good care of the “house” God has entrusted to us: our family, our work, our faith. The opposite of keeping watch is living on autopilot, rushing all day without noticing that God is passing through our life."],
perg:"In what part of my life am I “asleep” and need to wake up to God?",
des:"Make an Advent wreath together (a plate with four candles and a few green sprigs is enough) and light the first candle, the candle of hope. Explain to the kids: each Sunday we light one more candle, until Jesus comes.",
ora:"Come, Lord Jesus! Find our home awake and our hearts ready for you. Amen."},

{t:"Andrew brings his brother to Jesus",cel:"Saint Andrew, Apostle (Feast)",
tipo:"Gospel",ref:"Mt 4:18-22",v:"Come after me, and I will make you fishers of men.",
exp:"Jesus walks along the Sea of Galilee and sees two brothers, Simon (Peter) and Andrew, casting their nets. He calls them, and right away they leave their nets and follow him. Soon after, he calls James and John too. The Gospel of John tells us that it was Andrew who brought his brother to Jesus, telling him they had found the Messiah (Jn 1:41).",
med:["Andrew didn’t give great speeches. He met Jesus and ran to tell the person he loved. This is how faith spreads: from person to person, from home to home.","In Advent we prepare the way for Jesus to come. A beautiful way to do that is to bring someone along: an invitation to Mass, a word of hope, a prayer for someone who is far from God."],
perg:"Who could I bring closer to Jesus this Christmas?",
des:"Ask the kids: who can we bring close to Jesus this Christmas? Make a drawing or a little note together for that person and give it to them this week.",
ora:"Saint Andrew, teach our family to bring the people we love close to Jesus. Amen."},

{t:"A shoot from the stump",cel:"Tuesday of the First Week of Advent",
tipo:"first reading",ref:"Is 11:1-10",v:"But a shoot shall sprout from the stump of Jesse, and from his roots a bud shall blossom.",
exp:"The prophet Isaiah speaks of a stump that has been cut down: the family of King David, son of Jesse, which seemed finished. From it a shoot will sprout, filled with the Spirit of God: wisdom, understanding, counsel, strength, knowledge and fear of the Lord. With him comes a peace so great that the wolf and the lamb will live together.",
med:["That shoot is Jesus. God brings life out of the very place where nothing seemed left. That is God’s way: he doesn’t need everything to be perfect in order to act.","Maybe you have a “cut-down stump” in your life: a dream, a relationship, a hope that seems dead. Advent invites us to look at it with faith, because that is exactly where God can make something new sprout."],
perg:"What “cut-down stump” in my life do I want to give to God so he can make it sprout again?",
des:"Plant a seed together (a bean in a damp cotton ball works) and take care of it until Christmas. Every time you look at it, remember: God makes new life grow.",
ora:"Lord, make new life sprout where I had lost hope. May your Spirit rest upon our home. Amen."},

{t:"God will wipe away the tears",cel:"Wednesday of the First Week of Advent",
tipo:"first reading",ref:"Is 25:6-10a",v:"The Lord GOD will wipe away the tears from all faces",
exp:"Isaiah describes a great feast on the mountain, prepared by God for all peoples, with rich food and choice wines. On that day God will destroy death forever and wipe the tears from every face. In the Gospel of the day (Mt 15:29-37), Jesus heals many who are sick and multiplies the loaves for the crowd.",
med:["God is not indifferent to our tiredness or our tears. He prepares a table, cares for us and feeds us. Jesus showed this when he had compassion on a hungry crowd.","Mass is a little of that feast already today: God calls us to his table and feeds us with his own Body. Every simple family meal can also be a place to meet him."],
perg:"What tear of mine have I not yet let God wipe away?",
des:"At dinner tonight, pray together before eating, and let each person share one good thing from the day. Set the table with a little extra care, as if you were expecting a special guest.",
ora:"Lord, you prepare the table and wipe away our tears. Take my tiredness and fill our home with your peace. Amen."},

{t:"The house built on rock",cel:"Saint Francis Xavier, Priest (Memorial)",
tipo:"Gospel",ref:"Mt 7:21, 24-27",v:"Everyone who listens to these words of mine and acts on them will be like a wise man who built his house on rock.",
exp:"Jesus compares two houses. Both face rain, floods and wind. One stands because it was built on rock; the other collapses because it was built on sand. The difference is not in hearing the Word, but in putting it into practice.",
med:["Every home goes through storms: illness, money worries, arguments, exhaustion. We can’t choose whether the rain will come. We can choose what our house is built on.","Saint Francis Xavier, whom we celebrate today, carried the Gospel all the way to India and Japan. He didn’t just listen to Jesus: he lived the Word to the very end. That is what building on rock means: one small, concrete step at a time."],
perg:"What word of God do I already know but have not yet put into practice?",
des:"Draw a little house together and, inside each brick, write a way to live the Word at home: forgive, help, pray, say thank you. Put it near the Advent wreath.",
ora:"Jesus, be the rock of our home. May your Word not stay only in our ears, but reach our hands. Amen."},

{t:"Do you believe I can do this?",cel:"Friday of the First Week of Advent",
tipo:"Gospel",ref:"Mt 9:27-31",v:"‘Do you believe that I can do this?’ ‘Yes, Lord,’ they said to him.",
exp:"Two blind men follow Jesus, crying out to the Son of David for pity. They keep insisting until they come into the house where Jesus is. Before healing them, Jesus asks whether they believe. They say yes, and Jesus touches their eyes: it is done for them according to their faith. In the first reading (Is 29:17-24), Isaiah announces the day when the eyes of the blind will see.",
med:["The blind men didn’t give up. They followed Jesus down the street and went in after him into the house. Real faith keeps asking, even when the answer takes a while.","Jesus asks us the same question today, about whatever weighs most on our heart: “Do you believe I can?” Answering “Yes, Lord” is the first step to seeing with new eyes."],
perg:"Facing my biggest request today, can I honestly say: “Yes, Lord, I believe”?",
des:"Play blind man’s bluff for a few minutes. Then talk about it: what is it like not to see? Jesus came to bring light to our eyes and to our hearts.",
ora:"Son of David, have pity on me. I believe, Lord; increase my faith. Open my eyes so I can see you. Amen."},

{t:"This is the way; walk in it",cel:"Saturday of the First Week of Advent",
tipo:"first reading",ref:"Is 30:19-21, 23-26",v:"And your ears shall hear a word behind you: ‘This is the way; walk in it’",
exp:"Isaiah comforts a weary people: God will hear their cry and answer. He promises rain for the seed, plenty of bread and light as strong as the sun. And he promises to guide his people with a voice that shows them the way. In the Gospel (Mt 9:35–10:8), Jesus sees the tired crowds, like sheep without a shepherd, and sends out the apostles.",
med:["How often do we feel lost, not knowing which decision to make? God promises not to leave us alone: he speaks, points out the way and guides us step by step.","To hear that voice we need silence. In the middle of the December rush, Advent asks us for a few minutes of silence with God each day, to listen for where he wants us to go."],
perg:"What decision do I need to give to God, asking him to show me the way?",
des:"Make a “path” on the floor together with ribbons or paper, from a bedroom to the nativity scene (or to the wreath). Each day, the figures of Mary and Joseph can walk a little farther along the path until Christmas.",
ora:"Lord, show me your way and give me the courage to walk in it. Speak to my heart; I want to listen. Amen."},

{t:"Prepare the way of the Lord",cel:"Second Sunday of Advent",vela:2,
aviso:"Sunday Mass is an obligation: go to Holy Mass. Today we light the second candle of the wreath.",
tipo:"Gospel",ref:"Mk 1:1-8",v:"Prepare the way of the Lord, make straight his paths.",
exp:"The Gospel of Mark begins with John the Baptist in the desert. He proclaims a baptism of repentance, and many people come to him, confessing their sins. John wears camel’s hair, eats locusts and wild honey, and announces that someone mightier is coming after him. The first reading (Is 40:1-5, 9-11) opens with God asking for comfort to be given to his people.",
med:["Preparing the way means removing whatever stands in the way of Jesus’ coming. It might be a grudge we hold, a small bad habit, a reconciliation we keep putting off. The “potholes” and “mountains” on the road are inside us.","Advent is a wonderful time for Confession. It isn’t a burden: it is the way God found to comfort his people, just as Isaiah says. Look up the Confession times at your parish before Christmas."],
perg:"What do I need to clear from the road so that Jesus can truly reach my heart this Christmas?",
des:"Today is a day to “clear the way”: each person in the house picks a corner to tidy (a bedroom, a drawer, the toys) and sets aside something in good condition to donate.",
ora:"Lord, make straight the crooked paths of my heart. Give me the grace of a good Confession this Advent. Amen."},

{t:"Through the roof to Jesus",cel:"Saint Ambrose, Bishop and Doctor of the Church (Memorial)",
tipo:"Gospel",ref:"Lk 5:17-26",v:"As for you, your sins are forgiven.",
exp:"Some men carry a paralyzed friend on a stretcher, but they can’t get into the house because of the crowd. So they climb onto the roof, remove the tiles and lower their friend right in front of Jesus. Seeing their faith, Jesus first forgives the man’s sins and then heals him. In the first reading (Is 35:1-10), the desert blooms and the prophet tells the frightened to be strong and not to fear.",
med:["The sick man was healed through the faith of his friends. That is so beautiful: sometimes we are the one on the stretcher, and sometimes we are the friends who carry.","Our prayer can bring to Jesus those who can’t get there on their own: a child who has drifted away, a husband without faith, a friend who is sick. Don’t give up on “climbing onto the roof” for the people you love."],
perg:"Who am I carrying in prayer? Who do I need to start bringing to Jesus?",
des:"Write on a sheet of paper the names of people who need prayer. Put it near the nativity scene or the wreath and pray a Hail Mary together for them today.",
ora:"Jesus, I place before you the people I love who need you. Look at our faith and touch their lives. Amen."},

{t:"Full of grace from the very beginning",cel:"The Immaculate Conception of the Blessed Virgin Mary (Solemnity)",
aviso:"Holy day of obligation in the United States, and the patronal feast of our country: go to Holy Mass. Check the Mass times at your parish.",
tipo:"Gospel",ref:"Lk 1:26-38",v:"Hail, favored one! The Lord is with you.",
exp:"Today the Church celebrates that Mary was preserved from original sin from the very first moment of her life, by a special gift of God, to prepare her to be the Mother of Jesus. The Gospel tells of the angel Gabriel’s visit to Mary. The first reading (Gn 3:9-15, 20) recalls the sin of Adam and Eve and God’s promise: the offspring of the woman will overcome evil.",
med:["The angel doesn’t call Mary by her name: he calls her “full of grace.” It is as if that were her true name. There was no empty space in Mary: everything in her belonged to God.","We are not immaculate, but God also looks at us with love and wants to fill us with his grace. Through Confession and the Eucharist, he keeps cleansing and healing our hearts, so that Jesus finds a place ready for him."],
perg:"What part of my heart have I not yet let God fill with his grace?",
des:"Put an image of Our Lady in a special place in your home, with a flower or a candle. Pray the Rosary together (or one decade), asking her protection for your family.",
ora:"O Mary, conceived without sin, pray for us who have recourse to thee. Prepare my heart to receive Jesus, as God prepared yours. Amen."},

{t:"Wings like eagles",cel:"Wednesday of the Second Week of Advent",
tipo:"first reading",ref:"Is 40:25-31",v:"They that hope in the LORD will renew their strength, they will soar on eagles’ wings",
exp:"Isaiah speaks to a people who thought God had forgotten them, asking whether they have not heard and do not know. The Lord is the eternal God, creator of all things, who does not grow tired or weary. He gives strength to the weary. In the Gospel of the day (Mt 11:28-30), Jesus invites all who are tired and burdened to come to him.",
med:["December tends to be an exhausting month, full of plans, parties and bills. Today’s Word doesn’t say the tiredness will disappear. It says that those who hope in the Lord will renew their strength.","Hoping in the Lord means handing him the weight we can’t carry alone. The eagle doesn’t flap its wings all the time: it lets the wind carry it. Let God be the wind that holds you up today."],
perg:"What tiredness am I carrying alone that I need to give to God today?",
des:"Today, each person in the house chooses one task to lighten someone else’s load (doing the dishes, setting the table, a hug). No one tells who did what: it’s a secret gift.",
ora:"Lord, you never grow tired. Take my tiredness and renew my strength. Let me rest in you. Amen."},

{t:"Do not fear; I will help you",cel:"Thursday of the Second Week of Advent",
tipo:"first reading",ref:"Is 41:13-20",v:"For I am the LORD, your God, who grasp your right hand; It is I who say to you, Do not fear, I will help you.",
exp:"God speaks tenderly to his people, who felt small and weak, like a little worm. He promises to hold their hand, to open rivers on the heights and to make trees grow in the desert. In the Gospel (Mt 11:11-15), Jesus says that among those born of women there has been none greater than John the Baptist.",
med:["God doesn’t speak from far away: he holds our hand, the way a mother holds her child’s hand on a busy street. That is the image of Advent: a God who comes close.","When fear shows up today, remember this line. Repeat it in your heart: “Do not fear; I will help you.” It is meant for you."],
perg:"What fear has been taking away my peace the most? Can I give that hand to God?",
des:"At bedtime, hold each child’s hand and say: “God is holding your hand and saying: don’t be afraid, I will help you.” Pray the Guardian Angel prayer together.",
ora:"Lord, hold my hand. When I am afraid, remind me that you are with me and help me. Amen."},

{t:"God teaches what is good",cel:"Friday of the Second Week of Advent",
tipo:"first reading",ref:"Is 48:17-19",v:"I am the LORD, your God, teaching you how to prevail, leading you on the way you should go.",
exp:"God presents himself as a teacher and a guide. He laments that if his people had listened to his commandments, their peace would have been like a river. In the Gospel (Mt 11:16-19), Jesus compares his generation to children who won’t join any game: they didn’t listen to John, who fasted, nor to Jesus, who ate with sinners.",
med:["Peace like a river: what a beautiful image! It doesn’t come from everything going right, but from walking the path God teaches. The commandments are not a burden: they are the map of the path of peace.","Sometimes we complain about everything, like the children in the Gospel. Advent invites us to stop complaining and to listen: what is God trying to teach me through this situation?"],
perg:"What is God trying to teach me through whatever is bothering me today?",
des:"Have a “no complaining day”: whoever complains swaps the complaint for a thank-you. At the end of the day, count how many thank-yous showed up.",
ora:"Lord, teach me what is good and guide me on your way. May your peace flow through our home like a river. Amen."},

{t:"The Mother who comes to meet us",cel:"Our Lady of Guadalupe, Patroness of the Americas (Feast)",
tipo:"first reading",ref:"Zec 2:14-17",v:"Sing and rejoice, daughter Zion! Now, I am coming to dwell in your midst",
exp:"The prophet Zechariah announces that God is coming to dwell among his people, and many nations will join him. In 1531, in Mexico, Our Lady appeared to Saint Juan Diego, a humble native man, and left her image imprinted on his cloak (tilma). In the Gospel (Lk 1:39-47), Mary hurries to visit Elizabeth, carrying Jesus in her womb.",
med:["At Guadalupe, Mary appears pregnant, with a sash at her waist. She comes bringing Jesus. It is always like that: Mary never draws attention to herself; she leads us to Jesus.","Juan Diego thought he was small and unimportant. Our Lady said to him: “Am I not here, I who am your mother?” Those words are for you today, in whatever worries you."],
perg:"What worry do I want to place in Our Lady’s lap today?",
des:"Tell the kids the story of Juan Diego and the roses that bloomed in winter. Draw a cloak full of roses together and write on it: “Am I not here, I who am your mother?”",
ora:"Our Lady of Guadalupe, Mother of the Americas, cover our family with your mantle and lead us to Jesus. Amen."},

{t:"Rejoice: the Lord is near",cel:"Third Sunday of Advent (Gaudete Sunday)",vela:3,
aviso:"Sunday Mass is an obligation: go to Holy Mass. Today we light the third candle, the rose one, a sign of joy because Christmas is near.",
tipo:"Gospel",ref:"Jn 1:6-8, 19-28",v:"I am ‘the voice of one crying out in the desert, ‘Make straight the way of the Lord’’",
exp:"The priests ask John the Baptist who he is. He answers humbly: he is not the Messiah, nor Elijah, nor the Prophet. He is only “the voice” announcing someone who is already among them. In the second reading (1 Thes 5:16-24), Saint Paul asks us to rejoice always, pray without ceasing and give thanks in all circumstances.",
med:["Christian joy doesn’t depend on everything being fine. It comes from the certainty that the Lord is near. That is why, in the middle of Advent, the Church changes the color to rose and calls us to rejoice.","John the Baptist was joyful because he pointed to Jesus, not to himself. May our lives also be a “voice” that points to Jesus, with more kindness, more patience and more smiles at home."],
perg:"What has been stealing my joy? What reason do I have today to thank God?",
des:"Light the rose candle and make a “joy circle”: each person says three reasons to thank God this week. If you can, sing a Christmas song together.",
ora:"Lord, may I rejoice always, pray without ceasing and give thanks in everything. You are near. Amen."},

{t:"A star shall rise",cel:"Saint John of the Cross, Priest and Doctor of the Church (Memorial)",
tipo:"first reading",ref:"Nm 24:2-7, 15-17a",v:"A star shall advance from Jacob, and a scepter shall rise from Israel…",
exp:"Balaam, a foreign prophet, was called to curse Israel, but the Spirit of God made him bless it instead. He sees from afar a star that will rise from Jacob. The Church sees in that star the Messiah, Jesus. In the Gospel (Mt 21:23-27), the chief priests and elders question Jesus’ authority.",
med:["God uses even the people we least expect to announce Jesus. And Balaam’s star reminds us of the star that led the Magi to Bethlehem.","Saint John of the Cross, whom we celebrate today, went through great dark nights of the soul and still found God. He wrote: “At the evening of life, we shall be judged on our love.” When your night is dark, look for the star: Jesus is there."],
perg:"What “dark night” am I going through? Where can I look for God’s star in it?",
des:"Cut out a star from yellow paper together and write the name of Jesus on it. Hang it above the nativity scene or on the tree.",
ora:"Jesus, star shining in the night, light up my dark paths and guide our family to you. Amen."},

{t:"A humble, trusting people",cel:"Tuesday of the Third Week of Advent",
tipo:"first reading",ref:"Zep 3:1-2, 9-13",v:"But I will leave as a remnant in your midst a people humble and lowly, Who shall take refuge in the name of the LORD…",
exp:"The prophet Zephaniah denounces a rebellious city that neither listens to God nor trusts in him. But he announces that God will purify the hearts of his people and leave a humble “remnant” that trusts in him. In the Gospel (Mt 21:28-32), Jesus tells the story of two sons: one says “no” to his father but later changes his mind and goes to work; the other says “yes” but doesn’t go.",
med:["God isn’t looking for perfect people; he is looking for humble people. The first son got it wrong, but he turned back. The humility to admit a mistake opens the door to God.","At Christmas, God himself became small and poor, born in a manger. Those who are humble understand Christmas better than anyone."],
perg:"Is there a “no” I said to God that I still have time to take back?",
des:"Today is a day to say sorry. If someone at home hurt another person this week, let them ask forgiveness with a hug. Parents can go first and set the example.",
ora:"Lord, give me a humble heart that admits its mistakes and comes back to you. I want to belong to your little, trusting people. Amen."},

{t:"Let the heavens drop down the dew",cel:"Wednesday of the Third Week of Advent",
aviso:"Many families begin the Christmas Novena today, from December 16 to 24. You’ll find it here in the app, under Pray > Novenas.",
tipo:"first reading",ref:"Is 45:6b-8, 18, 21b-25",v:"Let justice descend, you heavens, like dew from above, like gentle rain let the clouds drop it down.",
exp:"God speaks with power: he is the Lord, and there is no other. Then comes a beautiful plea that the Church has sung in Advent for centuries (in Latin, “Rorate caeli”): that the heavens pour down the Savior like dew and the earth bring him forth. In the Gospel (Lk 7:19-23), John the Baptist sends messengers to ask Jesus whether he is the one who is to come.",
med:["Dew falls slowly, silently, during the night, and in the morning everything is wet. Jesus came like that: without noise, on a night in Bethlehem.","John the Baptist, in prison, had a doubt. And Jesus didn’t scold him: he pointed to the signs. We too can bring our doubts to Jesus. He answers by showing us what he is doing in our lives."],
perg:"What doubt am I carrying in my heart that I want to bring honestly to Jesus?",
des:"Begin the Christmas Novena as a family today, praying a little together each night until the 24th.",
ora:"Let the heavens drop down the dew! Come, Lord Jesus, and make salvation spring up in our home. Amen."},

{t:"Jesus has a family",cel:"December 17: the O Antiphons begin",
aviso:"From today until the 23rd, the Church prays the “O Antiphons,” seven calls to Jesus using his biblical names. Today’s antiphon calls him “O Wisdom.”",
tipo:"Gospel",ref:"Mt 1:1-17",v:"The book of the genealogy of Jesus Christ, the son of David, the son of Abraham.",
exp:"Saint Matthew presents Jesus’ family tree: from Abraham to David, from David to the exile in Babylon, from the exile to Joseph, the husband of Mary. The list includes kings and ordinary people, saints and sinners, and also foreign women like Ruth and Rahab. In the first reading (Gn 49), Jacob blesses Judah, from whom the king would come.",
med:["Jesus wanted a real family, with a history full of ups and downs. God is not ashamed of human history: he enters into it and saves it from within.","Our family also has wounds, mistakes and hard stories. Jesus doesn’t wait for it to be perfect before coming in. That is exactly where he wants to be born."],
perg:"What part of my family’s story do I need to give to God to be healed?",
des:"Show the kids photos of their grandparents and great-grandparents and tell them a beautiful story of faith from your family. Pray together for your ancestors, living and deceased.",
ora:"Jesus, Wisdom of God, come and teach us the way of prudence. Bless our family and our whole story. Amen."},

{t:"Joseph, the righteous man",cel:"December 18 · O Antiphon: O Lord and Ruler (Adonai)",
aviso:"Today’s antiphon calls Jesus “O Adonai,” the Lord who guides his people and comes to rescue them with his mighty arm.",
tipo:"Gospel",ref:"Mt 1:18-24",v:"Joseph, son of David, do not be afraid to take Mary your wife into your home.",
exp:"Joseph learns that Mary is with child and, being a righteous man, decides to divorce her quietly, without exposing her. In a dream, an angel explains that the child is from the Holy Spirit and that he is to be named Jesus, because he will save his people from their sins. He will be Emmanuel, God with us. Joseph wakes up and does everything the angel told him.",
med:["Joseph doesn’t say a single word in the Gospel. He listens and obeys. He didn’t understand everything, but he trusted and took Mary and Jesus into his life with all his love.","In family life, we often don’t understand what God is doing. Joseph teaches us to take the next step with trust, even without having all the answers."],
perg:"In what situation is God asking me to trust, even without understanding everything?",
des:"Today, honor dad (or whoever takes care of the family): make a card to thank him, just as Joseph took care of Jesus. Pray together asking Saint Joseph to protect your home.",
ora:"Saint Joseph, righteous and silent man, teach me to listen to God and to trust. Protect our family as you protected Mary and Jesus. Amen."},

{t:"Nothing is impossible for God",cel:"December 19 · O Antiphon: O Root of Jesse",
aviso:"Today’s antiphon calls Jesus “O Root of Jesse,” the sign raised up for all peoples, and asks him to come and save us without delay.",
tipo:"Gospel",ref:"Lk 1:5-25",v:"Do not be afraid, Zechariah, because your prayer has been heard.",
exp:"Zechariah and Elizabeth were righteous, but they had no children and were already old. While Zechariah is offering incense in the Temple, the angel Gabriel announces that Elizabeth will have a son, John, who will prepare the way of the Lord. Zechariah doubts and is left unable to speak until the child is born. In the first reading (Jgs 13), there is a similar announcement: the birth of Samson.",
med:["Elizabeth waited her whole life. When it seemed too late, God answered. God’s timing is not ours, but he never forgets a single prayer.","Zechariah fell silent because he doubted. Sometimes God also asks us for a season of silence so our faith can grow. Silence is not a punishment: it is preparation."],
perg:"What long-held prayer have I almost given up on? Can I hand it to God again today?",
des:"Have a family “minute of silence” before bed, everyone with eyes closed, listening to their heart. Then each person whispers one request to God.",
ora:"Lord, nothing is impossible for you. I place back in your hands the request I have carried for so long. Your will be done. Amen."},

{t:"Mary’s yes",cel:"Fourth Sunday of Advent · O Antiphon: O Key of David",vela:4,
aviso:"Sunday Mass is an obligation: go to Holy Mass. Today we light the fourth candle of the wreath. Today’s antiphon calls Jesus “O Key of David,” who comes to set free those who sit in darkness.",
tipo:"Gospel",ref:"Lk 1:26-38",v:"Behold, I am the handmaid of the Lord. May it be done to me according to your word.",
exp:"The angel Gabriel announces to Mary that she will be the mother of the Son of God. Mary asks how this will happen, and the angel answers that the Holy Spirit will come upon her. Then Mary says her “yes.” In the first reading (2 Sm 7), God promises David that his kingdom will last forever: that promise is fulfilled in Jesus.",
med:["Everything about Christmas begins with a “yes.” Mary didn’t know everything that would happen, but she said yes to God completely. And through that yes, God came into the world.","God asks for our “yes” every day too: in patience with the kids, in caring for our home, in a hard act of forgiveness. Every small yes makes room for Jesus to be born in our home."],
perg:"What is God asking me to say “yes” to at this moment in my life?",
des:"Light all four candles and read today’s Gospel together (Lk 1:26-38). Each person finishes the sentence: “This Christmas, I say yes to God by...”",
ora:"Mary, teach me to say yes to God the way you did. Let it be done to me according to his word. Amen."},

{t:"A visit full of joy",cel:"December 21 · O Antiphon: O Radiant Dawn",
aviso:"Today’s antiphon calls Jesus “O Radiant Dawn,” splendor of eternal light, who comes to shine on those who dwell in darkness.",
tipo:"Gospel",ref:"Lk 1:39-45",v:"Blessed are you who believed",
exp:"Mary travels in haste to Elizabeth’s house in the hill country. When Elizabeth hears Mary’s greeting, the baby John leaps for joy in her womb, and Elizabeth, filled with the Holy Spirit, cries out that Mary is blessed among women and blessed is the fruit of her womb. In the first reading (Sg 2:8-14), the beloved comes leaping across the mountains.",
med:["Mary had just received the most important news in history and, instead of thinking of herself, she went to help her elderly cousin. Whoever carries Jesus goes out to meet others.","December visits can be tiring, but they can also be like Mary’s: bringing Jesus into other people’s homes, with joy and service."],
perg:"Who needs a visit, a phone call or a helping hand from me these days?",
des:"Make a visit or a video call together to an older or lonely family member. Bring a little note or a homemade treat.",
ora:"Mary, who hurried to serve Elizabeth, teach me to bring Jesus to others with joy. Amen."},

{t:"My soul proclaims the greatness of the Lord",cel:"December 22 · O Antiphon: O King of All Nations",
aviso:"Today’s antiphon calls Jesus “O King of All Nations,” the cornerstone of the Church, who comes to save us, whom he formed from the dust.",
tipo:"Gospel",ref:"Lk 1:46-56",v:"My soul proclaims the greatness of the Lord; my spirit rejoices in God my savior.",
exp:"In Elizabeth’s house, Mary sings the Magnificat. She praises God because he has looked upon her lowliness, cast down the mighty and lifted up the lowly, filled the hungry with good things and kept the promise he made to Abraham. In the first reading (1 Sm 1:24-28), Hannah presents little Samuel to the Lord and gives thanks for the son she had longed for.",
med:["Mary asks for nothing in the Magnificat: she gives thanks. Gratitude is the prayer of someone who sees that everything is a gift from God.","Before the final Christmas rush, pause for a moment and look back: how many things has God done for you this year? Make your heart a Magnificat."],
perg:"What are the three greatest graces God has given me this year?",
des:"Write a “gratitude list for the year” together: each person in the house names good things God has done. Keep the list to read on Christmas Day.",
ora:"My soul proclaims the greatness of the Lord, because he has looked upon my lowliness. Thank you, my God, for everything you have done for us this year. Amen."},

{t:"His name is John",cel:"December 23 · O Antiphon: O Emmanuel",
aviso:"Today’s antiphon calls Jesus “O Emmanuel,” God with us, the hope of the nations, and asks him to come and save us.",
tipo:"Gospel",ref:"Lk 1:57-66",v:"John is his name",
exp:"Elizabeth gives birth to a son, and everyone rejoices. When it is time to name him, the relatives want to call him Zechariah, after his father. Elizabeth says he will be called John. Zechariah, still unable to speak, writes it on a tablet, and at that moment his mouth is opened and he praises God. In the first reading (Mal 3), God promises to send his messenger to prepare the way.",
med:["“John” means “God is gracious.” Zechariah spoke again when he obeyed God instead of following custom. Obedience opened his mouth to praise.","Tomorrow is Christmas Eve. With so little time left, the Lord asks whether there is still something we need to set right: a phone call, an act of forgiveness, a promise."],
perg:"What still needs to be set right in my heart before Jesus comes?",
des:"Tell the kids what each family member’s name means, and thank God for the name and the life of each person in your home.",
ora:"O Emmanuel, God with us, come! Our home is almost ready to welcome you. Open my mouth to praise you. Amen."},

{t:"The dawn from on high",cel:"Christmas Eve",vela:4,
aviso:"Tonight the Church celebrates the Christmas Vigil and Midnight Mass. The Nativity of the Lord (December 25) is a holy day of obligation: go to Holy Mass.",
tipo:"Gospel",ref:"Lk 1:67-79",v:"because of the tender mercy of our God by which the daybreak from on high will visit us",
exp:"Filled with the Holy Spirit, Zechariah sings the Benedictus. He blesses God, who has visited his people and kept the promise he made to Abraham. Then he looks at little John and says he will be called prophet of the Most High. And he ends by announcing Jesus as the dawn from on high who comes to give light to those who sit in darkness and to guide our feet into the way of peace.",
med:["The waiting is over. All through Advent you kept watch, prepared the way, rejoiced and said yes. Now all that is left is to welcome him: the dawn from on high is coming to visit your home.","In the rush of these last hours, keep a moment of silence. The most important thing about Christmas is not on the table or under the tree: it is Jesus, who wants to be born in your heart."],
perg:"How do I want to welcome Jesus on this Christmas night?",
des:"Before Christmas Eve dinner, gather the family around the nativity scene, place the Baby Jesus in the manger and pray together. Each person names one gift they want to give Jesus this year.",
ora:"Blessed be the Lord, the God of Israel, for he has visited his people! Come, Baby Jesus, be born in our home and in our hearts. Amen."}
];
