{id:"anjo",cat:"santos",t:"Guardian Angel Prayer",x:"Angel of God, my guardian dear, to whom God’s love commits me here, ever this day be at my side, to light and guard, to rule and guide. Amen."},
{id:"miguel",cat:"santos",t:"St. Michael the Archangel",x:"Saint Michael the Archangel, defend us in battle. Be our protection against the wickedness and snares of the devil.\nMay God rebuke him, we humbly pray, and do thou, O Prince of the heavenly hosts, by the power of God, cast into hell Satan, and all the evil spirits, who prowl about the world seeking the ruin of souls. Amen."},
{id:"saojose",cat:"santos",t:"Prayer to St. Joseph for the Family",x:"St. Joseph, guardian of the Holy Family, I place my home under your protection.\nYou who cared for Jesus and Mary with courage and silence, care for us too.\nProtect my husband and my children, bless our work and our daily bread, and teach us to trust in God even when we don’t understand everything.\nSt. Joseph, pray for us. Amen."},
{id:"sebastiao",cat:"santos",t:"Prayer to St. Sebastian",x:"Glorious St. Sebastian, who stayed faithful to Jesus to the very end, obtain for us from God the courage to live our faith with joy and steadfastness.\nProtect our family from sickness, violence and every evil.\nSt. Sebastian, pray for us. Amen."},
{id:"geraldo",cat:"santos",t:"Prayer to St. Gerard Majella",nota:"Patron of mothers and of those who long to be mothers",x:"St. Gerard Majella, friend of mothers and families, I come to you with confidence.\nPresent to God my desire to become a mother, and obtain for me the grace to live this time of waiting with faith and peace.\nProtect, too, all expectant mothers and the babies about to be born.\nSt. Gerard Majella, pray for us. Amen."},
{id:"luzia",cat:"santos",t:"Prayer to St. Lucy",x:"St. Lucy, who kept the light of faith burning in your heart, protect our eyes and our sight.\nHelp us to see God in people and in the little things of every day.\nSt. Lucy, pray for us. Amen."}
];

function sub(t){return '<header class="sub"><button class="icbtn" data-a="back" aria-label="Back">'+I("voltar")+"</button><span>"+esc(t)+"</span></header>";}
function barra(p){return '<div class="barra"><i style="width:'+Math.round(p*100)+'%"></i></div>';}
function confirma(id,txt,act,data){
  if(UI.confirma!==id)return "";
  return '<div class="confirma"><span>'+txt+'</span><div class="row"><button class="btn rosa peq" data-a="'+act+'" '+data+'>Yes</button><button class="btn sec peq" data-a="naoConfirma">No</button></div></div>';

function saudacao(){var h=new Date().getHours();return h<12?"Good morning":h<18?"Good afternoon":"Good evening";}

/* ---------- DESAFIOS ESPECIAIS (destaque na tela de início) ---------- */
var DESTAQUES=[
{id:"advento24",nome:"Advent Challenge",ini:"2026-11-29",fim:"2026-12-24",aviso:"2026-11-20",quando:"on Sunday, November 29, the first day of Advent",cor:"roxo",ic:"vela"},
{id:"anonovo7",nome:"New Year Challenge",ini:"2027-01-01",fim:"2027-01-07",aviso:"2026-12-25",quando:"on January 1",cor:"ouro",ic:"sol"},
{id:"quaresma40",nome:"Lent Challenge",ini:"2027-02-10",fim:"2027-03-27",aviso:"2027-01-27",quando:"on Ash Wednesday, February 10",cor:"roxo",ic:"vela"}
];
function destaqueAtual(){var s=hoje();for(var i=0;i<DESTAQUES.length;i++){var d=DESTAQUES[i];if(s>=d.aviso&&s<=d.fim){var p=plano(d.id);if(s>=d.ini&&!p)continue;return d;}}return null;}
function cardDestaque(d){
  var s=hoje(),p=plano(d.id),g=p?prog(d.id):null,h='<article class="dest d-'+d.cor+'">';
  if(s<d.ini){
    var f=diff(s,d.ini);
    h+='<div class="dtopo"><div class="stack" style="gap:6px;min-width:0"><span class="tag">Special challenge</span><h2>'+esc(d.nome)+'</h2></div><span class="cont"><small>'+(f===1?"starts":"in")+'</small>'+(f===1?'<b style="font-size:15px">tomorrow</b>':'<b>'+f+'</b>')+(f===1?"":"<small>days</small>")+"</span></div>";
    h+='<p class="grande">It starts <b>'+esc(d.quando)+"</b>."+(p?" "+esc(p.resumo):"")+"</p>";
    if(!p)h+='<p class="dok">'+I("check")+"It will show up here in the app before it starts. Stay tuned!</p>";
    else if(g)h+='<p class="dok">'+I("check")+"You’re signed up! On the day, your first step will appear right here.</p>"+'<button class="lnk" data-a="plano" data-id="'+d.id+'" style="align-self:center">See what the challenge is like</button>';
    else h+='<button class="btn" data-a="participar" data-id="'+d.id+'">Yes, I want to join</button><button class="lnk" data-a="plano" data-id="'+d.id+'" style="align-self:center">See what the challenge is like</button>';
    return h+"</article>";
  }
  var k=Math.min(diff(d.ini,s),p.d.length-1),tot=p.d.length,n=g?g.feitos.length:0;
  h+='<div class="dtopo"><div class="stack" style="gap:6px;min-width:0"><span class="tag">'+esc(d.nome)+'</span><h2>Today is day '+(k+1)+'</h2></div><span class="cont"><small>day</small><b>'+(k+1)+'</b><small>of '+tot+"</small></span></div>";
  h+='<p class="grande">Today’s step: <b>'+esc(tituloDia(p.d[k]))+"</b></p>";
  if(!g){
    h+='<p>'+(k===0?"The challenge starts today! It only takes a few minutes.":"There’s still time to join! Start with today’s step and catch up on the earlier days at your own pace, if you like.")+"</p>";
    h+='<button class="btn" data-a="comecarDest" data-id="'+d.id+'" data-i="'+k+'">'+(k===0?"Start the challenge now":"Start with today")+"</button>";
    if(k>0)h+='<button class="lnk" data-a="comecarDest" data-id="'+d.id+'" data-i="0" style="align-self:center">I’d rather start with day 1</button>';
  }else if(n>=tot){
    h+='<p class="dok">'+I("check")+"You completed the "+esc(d.nome)+". What a beautiful journey!</p>";
  }else{
    var feitoHj=g.feitos.indexOf(k)>=0,atras=proximoDia(p);
    h+=barra(n/tot)+'<p class="mini" style="margin-top:-4px">'+n+" of "+tot+" steps done</p>";
    if(feitoHj){h+='<p class="dok">'+I("check")+"Today’s step is done. Beautiful!</p>"+(k+1<tot?"<p>Tomorrow: <b>"+esc(tituloDia(p.d[k+1]))+"</b></p>":"");h+='<button class="btn sec" data-a="dia" data-id="'+d.id+'" data-i="'+k+'">Review today’s step</button>';}
    else h+='<button class="btn" data-a="dia" data-id="'+d.id+'" data-i="'+k+'">Do today’s step</button>';
    if(atras<k)h+='<button class="lnk" data-a="dia" data-id="'+d.id+'" data-i="'+atras+'" style="align-self:center">Missed a day? Go to day '+(atras+1)+"</button>";
  }
  return h+"</article>";
}

/* ---------- HOJE ---------- */
function linhaTempo(s,t){
  if(t.id==="advento"){var sem=Math.floor(diff("2026-11-29",s)/7)+1;var f=diff(s,"2026-12-25");return "<b>"+["First","Second","Third","Fourth"][Math.min(3,sem-1)]+" Week of Advent</b><span>"+(f===1?"Tomorrow is Christmas!":f+" days until Christmas")+"</span>";}
  if(t.id==="natal"){return "<b>"+(s<="2027-01-01"?"Octave of Christmas":"God came to dwell among us")+"</b><span>"+(s<="2027-01-01"?"Eight days of celebrating the birth of Jesus":"Living the joy of Christmas until the Baptism of the Lord")+"</span>";}
  if(t.id==="quaresma"){return "<b>"+t.sub+"</b><span>Until Easter, March 28</span>";}
  if(s<"2026-11-29"){var a=diff(s,"2026-11-29");return "<b>"+(a===1?"Advent starts tomorrow!":a+" days until Advent")+"</b><span>Advent begins on Sunday, November 29</span>";}
  if(s<"2027-02-10"&&diff(s,"2027-02-10")<=14){var q=diff(s,"2027-02-10");return "<b>"+(q===1?"Lent starts tomorrow!":q+" days until Lent")+"</b><span>Ash Wednesday, February 10</span>";}
  return "<b>"+t.sub+"</b><span>Growing in faith a little every day</span>";
}
function velas(s){
  var acesas=Math.min(4,Math.floor(diff("2026-11-29",s)/7)+1);var h="";
  for(var i=0;i<4;i++){var on=i<acesas;var cor=i===2?"#EDA7B2":"#C7B3E0";
    h+='<svg viewBox="0 0 16 46" aria-hidden="true">'+(on?'<path d="M8 2c2.4 2.6 2.6 4.8 0 7-2.6-2.2-2.4-4.4 0-7z" fill="#F2C46B"/>':'')+'<rect x="3" y="12" width="10" height="33" rx="3" fill="'+cor+'" opacity="'+(on?1:.45)+'"/><path d="M8 12V9.5" stroke="#A8774B" stroke-width="1.2"/></svg>';}
  return '<div class="velas" aria-label="'+acesas+' candles lit on the Advent wreath">'+h+"</div>";
}
function feitoMomento(s){return S.momento[s]&&S.momento[s].feito;}
function sequencia(){var s=hoje();if(!feitoMomento(s))s=addD(s,-1);var n=0;while(feitoMomento(s)){n++;s=addD(s,-1);}return n;}
function semanaDots(){
  var s=hoje();var d=parse(s);var ini=addD(s,-d.getDay());var h="";
  for(var i=0;i<7;i++){var di=addD(ini,i);var ok=feitoMomento(di);h+='<span>'+DLET[i]+'<i class="'+(ok?"ok":"")+(di===s?" hj":"")+'">'+(ok?I("check"):"")+"</i></span>";}
  var n=sequencia();
  return '<div class="row" style="justify-content:space-between"><span class="eyebrow">My week with God</span>'+(n>1?'<span class="mao" style="font-size:20px">'+n+" days in a row</span>":"")+'</div><div class="semana">'+h+"</div>";
}
function semana(){
  var s=hoje();var d=parse(s);var ini=addD(s,-d.getDay());var h="";
  for(var i=0;i<7;i++){var di=addD(ini,i);var ok=feitoMomento(di);h+='<span>'+DLET[i]+'<i class="'+(ok?"ok":"")+(di===s?" hj":"")+'">'+(ok?I("check"):"")+"</i></span>";}
  var n=sequencia();
  return '<article class="card"><div class="row" style="justify-content:space-between"><h3>My week with God</h3>'+(n>1?'<span class="mao" style="font-size:21px">'+n+" days in a row</span>":"")+'</div><div class="semana">'+h+"</div></article>";
}
function planosAtivos(){var a=[];PLANOS.forEach(function(p){var g=prog(p.id);if(g&&g.feitos.length<p.d.length)a.push(p);});return a;}
function proximoDia(p){var g=prog(p.id);if(!g)return 0;for(var i=0;i<p.d.length;i++)if(g.feitos.indexOf(i)<0)return i;return p.d.length-1;}
function cardAndamento(p){var g=prog(p.id);var n=g?g.feitos.length:0;var k=proximoDia(p);
  return '<button class="andamento c-'+p.cor+'" data-a="dia" data-id="'+p.id+'" data-i="'+k+'"><span class="pic">'+I(p.ic)+'</span><span class="t"><b>'+esc(p.titulo)+'</b><small>Continue on day '+(k+1)+" · "+n+" of "+p.d.length+" done</small>"+barra(n/p.d.length)+"</span></button>";}
function vHoje(){
  var s=hoje(),c=celebra(s),t=tempo(s),m=momento(s),cor=COR[c.cor]||COR.verde,feito=feitoMomento(s);
  var dq=destaqueAtual();
  var at=planosAtivos().filter(function(p){return !dq||p.id!==dq.id;});
  var h=topo();
  h+='<section class="ola"><p class="mao">'+saudacao()+(S.nome?", "+esc(S.nome):"")+'</p><h1>'+cap(dataLonga(s))+"</h1></section>";
  if(precisaTutorial())h+='<article class="card cheio c-rosa tut"><div class="row" style="gap:14px;align-items:center"><span class="iconeapp">'+ICONE_APP+'</span><div class="stack" style="gap:4px"><div class="eyebrow">First step</div><h2>Put the app on your home screen</h2></div></div><p class="grande">That way you can open it with one tap, every day. It only takes a minute.</p><button class="btn" data-a="tutorial">Show me how</button><button class="lnk" data-a="tutOk" style="align-self:center">Already done, hide this</button></article>';
  if(dq)h+=cardDestaque(dq);
  if(!precisaTutorial()&&!S.lembOk)h+='<article class="card cheio c-azul lembc"><div class="row" style="gap:14px;align-items:center"><span class="pic">'+I("sino")+'</span><div class="stack" style="gap:4px"><div class="eyebrow">So you don’t forget</div><h2>Would you like a daily reminder?</h2></div></div><p>A reminder on your phone, at the time you choose, for your moment with God and the day’s challenge.</p><button class="btn" data-a="lembConfig">Set my reminder</button><button class="lnk" data-a="lembNao" style="align-self:center">Not now</button></article>';
  h+='<section class="tempo '+(TEMPO_CL[t.id]||"c-verde")+'"><div class="txt"><span class="tag">'+esc(t.nome)+"</span><p>"+linhaTempo(s,t)+"</p></div>"+(t.id==="advento"?velas(s):"")+"</section>";
  h+='<article class="escuro"><div class="eyebrow">My moment with God · 5 minutes</div><blockquote>“'+esc(m.v)+'”</blockquote><cite>'+esc(m.r)+"</cite>";
  h+=(feito?'<span class="feito">'+I("check")+"Done today. Beautiful!</span>":"")+'<button class="btn" data-a="momento">'+(feito?"Review my moment":"Start my moment")+'</button><div class="sep"></div>'+semanaDots()+"</article>";
  h+='<article class="card" style="--bd:'+cor.bd+'"><div class="eyebrow">Today the Church celebrates</div><h2>'+esc(c.t)+"</h2>";
  h+='<div class="row" style="flex-wrap:wrap;gap:8px 12px">'+(c.g?'<span class="tag" style="--tg:'+cor.bg+'">'+esc(c.g)+"</span>":"")+'<span class="corlit"><i style="background:'+cor.bd+'"></i>liturgical color: '+cor.n+"</span></div>";
  h+="<p>"+esc(c.b)+"</p>"+(c.s?'<p class="santo"><b>Today we remember:</b> '+esc(c.s)+"</p>":"");
  h+='<a class="btn sec" href="'+LITURGIA+'" target="_blank" rel="noopener">'+I("livro")+"Read today’s Mass readings "+I("fora")+'</a><p class="mini" style="text-align:center">Daily readings and Gospel on the USCCB website</p></article>';
  h+='<article class="card cheio c-amarelo"><div class="eyebrow">To live today</div><p>'+esc(c.x)+"</p></article>";
  if(at.length){h+='<section class="stack"><h3>My plans in progress</h3>'+at.slice(0,2).map(cardAndamento).join("")+"</section>";}
  else if(!dq&&t.id==="advento"&&!prog("advento24")){h+='<button class="andamento c-lilas" data-a="plano" data-id="advento24"><span class="pic">'+I("vela")+'</span><span class="t"><b>Advent as a family</b><small>All of Advent until Christmas, with one simple activity a day to do with your kids</small></span>'+I("seta")+"</button>";}
  else{h+='<button class="andamento c-lilas" data-a="tab" data-t="planos"><span class="pic">'+I("estrela")+'</span><span class="t"><b>Choose a plan or challenge</b><small>Marriage, kids, Advent, peace of heart and much more</small></span>'+I("seta")+"</button>";}
  h+='<section class="atalhos">'+
    '<button class="atalho c-lilas" data-a="terco"><span>'+I("terco")+"</span>Rosary</button>"+
    '<button class="atalho c-azul" data-a="novenas"><span>'+I("bolinhas")+"</span>Novenas</button>"+
    '<button class="atalho c-rosa" data-a="pedidos"><span>'+I("envelope")+"</span>My prayer requests</button>"+
    '<button class="atalho c-verde" data-a="tab" data-t="orar"><span>'+I("maos")+"</span>Prayers</button></section>";
  return h;
}

/* ---------- MEU MOMENTO ---------- */
function vMomento(){
  var s=hoje(),m=momento(s),reg=S.momento[s]||{};
  var h=sub("My moment with God");
  h+='<section class="stack"><p class="mao">5 little minutes just for you and God</p><h1>'+cap(dataLonga(s))+"</h1></section>";
  h+='<section class="passos">';
  h+='<div class="passo"><span class="n">1</span><div class="c"><h3>Be still</h3><p>Take three slow, deep breaths. Place yourself in God’s presence and say in your heart: <em>Lord, here I am.</em></p></div></div>';
  h+='<div class="passo"><span class="n">2</span><div class="c"><h3>Listen to the Word</h3><div class="escuro"><blockquote>“'+esc(m.v)+'”</blockquote><cite>'+esc(m.r)+"</cite></div></div></div>";
  h+='<div class="passo"><span class="n">3</span><div class="c"><h3>Reflect</h3><p>'+esc(m.p)+"</p></div></div>";
  h+='<div class="passo"><span class="n">4</span><div class="c"><h3>Talk with God</h3><p><b>'+esc(m.q)+'</b></p><textarea id="momentoNota" rows="5" data-in="momento" placeholder="Write what’s on your heart...">'+esc(reg.nota||"")+"</textarea></div></div>";
  h+='<div class="passo"><span class="n">5</span><div class="c"><h3>Pray</h3><p class="oracao-curta">'+esc(m.o)+"</p></div></div>";
  h+="</section>";
  h+=reg.feito?'<span class="feito" style="justify-content:center">'+I("check")+"Today’s moment is complete</span>":'<button class="btn" data-a="concluirMomento">Finish my moment</button>';
  return h;
}

/* ---------- PLANOS ---------- */
var CATS=["All","Advent & Christmas","Marriage","Kids","Motherhood","Home","For me","Our Lady","New Year"];
function vPlanos(){

function vPlano(id){

function vDia(id,i){
  i=+i;var p=plano(id),d=p.d[i],g=prog(id),ok=g&&g.feitos.indexOf(i)>=0,nota=g&&g.notas&&g.notas[i]||"";

function fimDia(id,i,p,ok){

/* terço */
function passosTerco(){
  var p=[{f:"Opening",o:"sinal"},{f:"Opening",o:"creio"},{f:"Opening",o:"painosso"},
    {f:"Opening",o:"avemaria",n:1,de:3,obs:"for an increase of faith"},{f:"Opening",o:"avemaria",n:2,de:3,obs:"for an increase of hope"},{f:"Opening",o:"avemaria",n:3,de:3,obs:"for an increase of charity"},{f:"Opening",o:"gloria"}];
  for(var k=0;k<5;k++){var f=["First","Second","Third","Fourth","Fifth"][k];p.push({f:f,k:k,o:"anuncio"});p.push({f:f,k:k,o:"painosso"});
    for(var a=1;a<=10;a++)p.push({f:f,k:k,o:"avemaria",n:a,de:10});
    p.push({f:f,k:k,o:"gloria"});p.push({f:f,k:k,o:"omeujesus"});}
  p.push({f:"Closing",o:"salve"});
  return p;
}
var PT=null;
function vTerco(){
  var s=hoje();if(!S.terco||S.terco.data!==s){S.terco={data:s,set:misterioDoDia(s),i:0};save();}
  if(!PT)PT=passosTerco();
  var T=S.terco,M=MISTERIOS[T.set],st=PT[T.i];
  var h=sub("Holy Rosary");
  h+='<div class="chips">'+Object.keys(MISTERIOS).map(function(k){return '<button class="chip'+(T.set===k?" on":"")+'" data-a="tercoSet" data-k="'+k+'">'+MISTERIOS[k].t.replace(" Mysteries","")+"</button>";}).join("")+"</div>";
  h+='<section class="terco-top"><span class="tag" style="--tg:var(--lil)">'+M.t+'</span><h2>'+(st.k!=null?st.f+(T.set==="gozosos"?" Joyful":T.set==="dolorosos"?" Sorrowful":T.set==="gloriosos"?" Glorious":" Luminous")+" Mystery":st.f)+"</h2></section>";
  // contas
  var contas="";
  if(st.k!=null){var pos=st.o==="painosso"?0:st.o==="avemaria"?st.n:st.o==="anuncio"?-1:11;
    contas='<i class="g'+(pos===0?" at":pos>0?" ok":"")+'"></i>';for(var a=1;a<=10;a++)contas+='<i class="'+(a===pos?"at":a<pos?"ok":"")+'"></i>';}
  else if(st.f==="Opening"){var ord=["sinal","creio","painosso","a1","a2","a3","gloria"];var cur=st.o==="avemaria"?"a"+st.n:st.o;var ci=ord.indexOf(cur);
    contas='<i class="g'+(ci===2?" at":ci>2?" ok":"")+'"></i>';for(var b=1;b<=3;b++)contas+='<i class="'+(ci===2+b?"at":ci>2+b?"ok":"")+'"></i>';}
  h+='<div class="contas" aria-hidden="true">'+contas+"</div>";
  h+='<article class="card c-lilas terco-orar">';
  if(st.o==="anuncio"){var mi=M.m[st.k];h+='<div class="misterio"><div class="eyebrow">We contemplate</div><h2>'+esc(mi[0])+'</h2><p>'+esc(mi[1])+'</p></div><p class="mini">Pause for a moment, picture the scene and offer this mystery for your intention.</p>';}
  else{var o=st.o==="avemaria"?oracao("avemaria"):oracao(st.o);
    h+="<h2>"+esc(o.t)+(st.n?"<small>"+st.n+" of "+st.de+"</small>":"")+"</h2>"+(st.obs?'<p class="mao" style="font-size:20px">'+st.obs+"</p>":"")+'<p class="oracao-txt" style="font-size:15px">'+esc(o.x)+"</p>";}
  h+="</article>";
  var fim=T.i>=PT.length-1;
  h+=barra((T.i+1)/PT.length);
  h+='<div class="terco-bts"><button class="btn sec" data-a="tercoVolta" '+(T.i===0?"disabled":"")+' aria-label="Back">'+I("voltar")+"</button>"+(fim?'<button class="btn" data-a="tercoFim">I finished the Rosary</button>':'<button class="btn" data-a="tercoNext">'+(st.o==="avemaria"&&st.n<st.de?"Next Hail Mary":"Next")+"</button>")+"</div>";
  h+='<p class="mini" style="text-align:center">Tap “Next” after each prayer. The app remembers where you left off.</p>';
  return h;
}

/* novenas */

    var falha=function(){var ta=document.getElementById("restTxt");ta.value=txt;ta.select();toast("The backup is selected in the box below: copy it and keep it safe.");};
    try{navigator.clipboard.writeText(txt).then(ok,falha);}catch(err){falha();}},
  restaurar:function(){var t=document.getElementById("restTxt").value.trim();if(!t){toast("Choose the file or paste the backup text.");return;}restaurar(t);},
  pulaData:function(e){S.dataTeste=e.dataset.k||null;save();UI.calMes=null;UI.calSel=null;toast(S.dataTeste?"Viewing the app on "+dataCurta(S.dataTeste):"Back to today");setTab("hoje");}
};
function restaurar(t){try{var o=JSON.parse(t);var d=o.dados||o;if(!d||typeof d!=="object"||!("planos" in d))throw 0;var b=base();for(var k in d)b[k]=d[k];S=b;save();toast("Backup restored!");setTab("hoje");}catch(err){toast("We couldn’t read that backup. Please check the text.");}}

var tmr={};
function onInput(e){var el=e.target,k=el.dataset.in;if(!k)return;
  if((k==="dataTeste"||k==="restArq")&&e.type!=="change")return;
  if(k==="momento"){var s=hoje();var r=S.momento[s]||(S.momento[s]={});r.nota=el.value;}
  else if(k==="planoDiario"){var g2=S.planos[el.dataset.id]||(S.planos[el.dataset.id]={inicio:hoje(),feitos:[],notas:{}});g2.diario=g2.diario||{};g2.diario[el.dataset.i]=el.value;}
  else if(k==="planoNota"){var g=S.planos[el.dataset.id]||(S.planos[el.dataset.id]={inicio:hoje(),feitos:[],notas:{}});g.notas=g.notas||{};g.notas[el.dataset.i]=el.value;}
  else if(k==="novInt"){var n=S.novenas.filter(function(x){return x.uid===el.dataset.uid;})[0];if(n)n.intencao=el.value;}
  else if(k==="nome"){S.nome=el.value.trim();}
  else if(k==="lembHora"){S.lembHora=el.value;}
  else if(k==="dataTeste"){if(el.value){S.dataTeste=el.value;save();UI.calMes=null;UI.calSel=null;toast("Viewing the app on "+dataCurta(el.value));}return;}
  else if(k==="restArq"){var f=el.files&&el.files[0];if(f){var rd=new FileReader();rd.onload=function(){restaurar(String(rd.result));};rd.readAsText(f);}return;}
  clearTimeout(tmr.s);tmr.s=setTimeout(save,300);
}

function init(){
  app=document.getElementById("app");nav=document.getElementById("nav");toastEl=document.getElementById("toast");
  document.addEventListener("click",function(e){var el=e.target.closest("[data-a]");if(!el||el.disabled)return;var f=A[el.dataset.a];if(f){e.preventDefault();f(el);}});
  document.addEventListener("input",onInput);document.addEventListener("change",function(e){if(e.target.dataset.in==="restArq"||e.target.dataset.in==="dataTeste")onInput(e);});
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();instalaEvt=e;if(cur().v==="tutorial")render();});
  window.addEventListener("appinstalled",function(){S.tutOk=true;save();});
  render(true);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
