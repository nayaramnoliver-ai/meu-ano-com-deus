med:["For years, Jesus worked with Joseph as a carpenter. The Son of God sweated, grew tired and learned a trade. That means work, at home or outside it, can be holy.","Washing the dishes, caring for the laundry, putting in a day at work: all of it can be offered to God. What matters isn’t the size of the task, but the love with which it is done."],
perg:"What task in my day do I do grudgingly that I could offer to God?",
des:"Before each task today, say quietly: “This is for you, Lord.” Choose the task you like least and do it with extra care, praying for someone while you work.",
ora:"Saint Joseph the Worker, teach me to work with love. Lord, sanctify our daily work and make it an offering pleasing to you. Amen."},

{t:"Jesus grew",ref:"Lk 2:52",v:"And Jesus advanced in wisdom and age and favor before God and man.",
exp:"This verse closes the account of Jesus’ childhood. It shows that he truly grew, like every child: in body, in knowledge and in his relationship with God and with people. That growth happened within a family, with the help of Mary and Joseph.",
med:["Jesus didn’t skip any stages. He grew little by little, like our children and like us. Each stage has its own beauty and its own challenge.","Growing in grace is as important as growing in height. The family is where we learn to pray, to forgive and to love God."],
perg:"In what do I want to grow in faith, and in what do I want to help my family grow?",
des:"Notice something new your child (or someone at home) has learned or achieved, and thank God out loud, near them. If you can, teach a child a short prayer today.",
ora:"Jesus, who grew in wisdom and grace in Nazareth, bless the growth of my children and my family. Help us grow in your love as well. Amen."},

{t:"A family that prays",ref:"Lk 2:41-42",v:"Each year his parents went to Jerusalem for the feast of Passover",
exp:"Mary and Joseph were faithful to the practices of their faith: every year they made the pilgrimage to Jerusalem, a long and tiring journey, to celebrate Passover. When Jesus turned twelve, he went with them. Faith was lived as a family, with habits and commitments.",
med:["Habits of faith shape the heart. A child who sees their parents praying, going to Mass and celebrating the feasts learns that God is part of life, not a decoration.","It doesn’t need to be anything big: a prayer before meals, a blessing before bed, Sunday Mass together. What is constant is what lasts."],
perg:"What prayer habit could my family begin or pick up again?",
des:"Agree as a family on a prayer habit for the coming weeks (for example, praying before dinner or blessing the kids before bed). Start today.",
ora:"Holy Family of Nazareth, who celebrated God’s feasts together, teach our family to pray as one. May our home be a little church. Amen."},

{t:"In hard times",ref:"Mt 2:13-15",v:"Joseph rose and took the child and his mother by night and departed for Egypt.",
exp:"After the visit of the Magi, King Herod wants to kill the child. An angel warns Joseph in a dream, and in the middle of the night he takes Mary and Jesus and flees to Egypt. The Holy Family lives as refugees in a foreign land until Herod’s death.",
med:["The Holy Family knew fear, haste, upheaval and uncertainty. That is why they understand the struggles of our homes: money troubles, illness, moves, conflicts.","Joseph wasn’t paralyzed by fear: he listened to God and acted. In hard times, prayer doesn’t make the problem disappear right away, but it shows us the next step."],
perg:"What is the biggest difficulty in my home today? What next step is God showing me?",
des:"Write your family’s biggest difficulty on a piece of paper, place it at the foot of an image of the Holy Family (or in your Bible) and pray about it. Take one concrete step to face it, even a small one.",
ora:"Holy Family, who knew exile and fear, help us in our difficulties. Saint Joseph, guide our family on the right path. Amen."},

{t:"Searching for Jesus together",ref:"Lk 2:43-46",v:"After three days they found him in the temple, sitting in the midst of the teachers, listening to them and asking them questions…",
exp:"On the way back from Jerusalem, Mary and Joseph realize Jesus isn’t with them. They go back and search for three days, until they find him in the Temple, the house of God. They didn’t give up: they searched together until they found him.",
med:["Sometimes the whole family gets distracted and loses sight of Jesus in the rush of life. It happens to everyone; it even happened to the Holy Family.","The secret is to search together, and in the right place: in God’s house, in prayer, in the Word. A family that seeks Jesus together always finds him."],
perg:"How can my family search for Jesus together this week?",
des:"Visit a church together, even for five minutes, or go to Mass as a family. If possible, let the kids light a candle and say a prayer.",
ora:"Jesus, may our family always seek you and find you. When we get lost, lead us back to the Father’s house. Amen."},

{t:"The silence of Nazareth",ref:"1 Kgs 19:11-13",v:"after the fire, a light silent sound.",
exp:"The prophet Elijah, tired and afraid, hides in a cave on Mount Horeb. God tells him to come out and meet him. A strong wind passes, then an earthquake and a fire, but God is not in them. Then comes a light, gentle sound, and that is where Elijah senses God’s presence and covers his face.",
med:["God often speaks softly, in a gentle whisper. The house in Nazareth was simple and quiet, and it was in that silence that the Holy Family heard God’s voice.","Our homes are full of noise: TV, phones, hurry. A little silence as a family helps us hear God and also hear one another."],
perg:"What noise could I reduce in my home so I can hear God better?",
des:"Have five minutes of family silence today, with screens off (it can be before bed, with a candle lit). End with an Our Father prayed very slowly.",
ora:"Lord, teach us to be silent so we can hear you. May our home, like the one in Nazareth, be a place of peace where your voice is heard. Amen."},

{t:"Consecrating my family",ref:"Col 3:12-17",v:"And let the peace of Christ control your hearts, the peace into which you were also called in one body. And be thankful.",
exp:"Saint Paul describes the life of those who belong to Christ: putting on compassion, kindness, humility, gentleness and patience; bearing with one another and forgiving one another; and above all, having love. It is the reading the Church proclaims on the Feast of the Holy Family.",
med:["This is the portrait of a Christian family: not a perfect family, but a family that forgives, bears with one another patiently and lets the peace of Christ rule.","At the end of these ten days, you can consecrate your home to the Holy Family, asking Jesus, Mary and Joseph to live with you and guide every step."],
perg:"How has the way I see my family changed over these ten days?",
des:"Gather your family and pray the Consecration of the Home to the Holy Family (Pray tab). If someone is hurt, take the chance to ask for and offer forgiveness before the prayer.",
ora:"Jesus, Mary and Joseph, I consecrate my family to you. May the peace of Christ rule in our hearts. Make our home a place of love, forgiveness and gratitude. Amen."}
]};

P.gratidao14={resumo:"Two weeks to train your eyes and fill your home with thanksgiving, from the big things to the tiniest ones. Each day brings a reading explained, a meditation, a space to write and a gratitude challenge.",d:[
{t:"Not forgetting his blessings",ref:"Ps 103:1-5",v:"Bless the LORD, my soul; and do not forget all his gifts",
exp:"In this psalm, the psalmist speaks to his own soul and invites it to bless God. Then he lists what God does: forgives our sins, heals our ills, redeems our life from the pit, crowns us with love and mercy, fills our days with good things. Gratitude is born from remembering.",
med:["We quickly forget the good we have received and remember for a long time what went wrong. Gratitude is an exercise in memory: bringing back to the heart what God has already done.","Whoever remembers God’s blessings complains less, trusts more and sees life with new eyes."],
perg:"What blessings from God have I forgotten to give thanks for?",
des:"Start your gratitude list today: write below at least five things you are thankful for. You’ll come back to it over these 14 days.",
ora:"With all my soul I bless you, Lord. Thank you for all the good you do for me. May I never forget your blessings. Amen."},

{t:"For my life",ref:"Ps 139:13-16",v:"I praise you, because I am wonderfully made; wonderful are your works!",
exp:"The psalmist recognizes that God has known him since he was in his mother’s womb. It was God who formed him, who saw every stage of his growth and who has all his days written in his book. In the face of this, all he can do is praise.",
med:["Your life isn’t an accident. God formed you with tenderness, knows you completely and loves you just as you are.","We are often hard on ourselves. Today, look at yourself through God’s eyes and give thanks for being alive, for your body, your gifts and your story."],
perg:"What in myself do I find hard to give thanks for? How does God see it?",
des:"Write down three qualities or gifts God has given you. Standing in front of the mirror, say out loud: “I praise you, Lord, because you made me so wonderfully.”",
ora:"Lord, I praise you because you made me so wonderfully. Thank you for my life and for every day you give me. Amen."},

{t:"For our home",ref:"Is 32:15-18",v:"My people will live in peaceful country, in secure dwellings and quiet resting places.",
exp:"The prophet announces a time when the Spirit will be poured out from on high, and the desert will become a garden. The fruit of that time will be justice and peace, and God’s people will live in secure and peaceful dwellings.",
med:["No matter the size or condition of your home, it is your shelter, the place where your family gathers, rests and loves one another.","Giving thanks for your home changes the way you care for it. What we see as a gift we treat with tenderness, not as a burden."],
perg:"What am I most grateful for about my home, even with its imperfections?",
des:"Walk through your home and, in each room, thank God for something that happens there (meals in the kitchen, rest in the bedroom, laughter in the living room). If you can, bless each room with holy water.",
ora:"Lord, thank you for the home you have given us. May it always be a dwelling of peace, where you are welcome. Amen."},

{t:"Giving thanks in everything",ref:"1 Thes 5:16-18",v:"In all circumstances give thanks, for this is the will of God for you in Christ Jesus.",
exp:"Saint Paul writes to the community in Thessalonica, which was going through persecution, and gives three short pieces of advice: rejoice always, pray without ceasing and give thanks in all circumstances. He says this is God’s will for us.",
med:["Giving thanks in all circumstances isn’t pretending everything is fine. It is trusting that God is present in all things, including the hard ones.","Constant gratitude transforms the heart. The more we give thanks, the more reasons we notice to give thanks."],
perg:"In what difficult situation can I start giving thanks, even without understanding?",
des:"Give thanks out loud at least three times today, for simple things, right as they happen (a hot cup of coffee, light traffic, a hug). Write down below what they were.",
ora:"Lord, may I learn to give you thanks in all circumstances, because I know you are with me in everything. Amen."},

{t:"For our children and all the little ones",ref:"Ps 127:1-3",v:"Certainly sons are a gift from the LORD, the fruit of the womb, a reward.",
exp:"The psalm begins by reminding us that unless the Lord builds the house, the builders labor in vain. Everything is God’s gift, and children are presented as a heritage and a reward: gifts God entrusts to parents.",
med:["Children are a gift, even on days of tantrums, exhaustion and worry. They aren’t ours; they are God’s, entrusted to us for a time.","If you don’t have children yet, or if you have spiritual children, nieces and nephews, godchildren or students, you can also give thanks for the children God places on your path."],
perg:"What am I grateful for in each child God has placed in my life?",
des:"Tell each of your children (or a child you love): “I thank God for you,” and tell them why. Write below how each one reacted.",
ora:"Thank you, Lord, for every child you have entrusted to me. Build our home and watch over our little ones. Amen."},

{t:"For our daily bread",ref:"Mt 14:15-21",v:"Taking the five loaves and the two fish, and looking up to heaven, he said the blessing…",
exp:"A crowd follows Jesus to a deserted place, and evening comes without food. The disciples have only five loaves and two fish. Jesus takes the little there is, gives thanks and blesses it. Everyone eats, and there are still twelve baskets left over.",
med:["Jesus gave thanks before multiplying. Gratitude for the little we have makes room for God to act. The table, however simple, is a place of blessing.","How many hands worked to bring the food to your table? Giving thanks for our food is also remembering those who have none."],
perg:"What is my table like: a place of gratitude or of rushing?",
des:"Pray Grace Before Meals with your family today. If you can, set aside some food to donate to someone in need or to a food pantry.",
ora:"Bless, O Lord, the food we are about to receive and the hands that prepared it. Give bread to those who are hungry, and hunger for you to those who have bread. Amen."},

{t:"Even for the hard things",ref:"Rom 8:28-31",v:"We know that all things work for good for those who love God",
exp:"Saint Paul writes to the Romans about Christian hope. He declares that God works in all things, even in suffering, for the good of those who love him. And he concludes: if God is for us, who can be against us?",
med:["Some of the things that made us grow the most were hard to live through. God doesn’t want evil, but he is able to bring good even out of it.","Giving thanks for difficulties isn’t enjoying suffering, but recognizing that God didn’t abandon us in them and that we came out different on the other side."],
perg:"What difficulty in my past brought something good to me?",
des:"Write below a difficulty you went through and the good it brought (a lesson, a friendship, more faith). Thank God for being with you during that time.",
ora:"Lord, thank you even for the hard times that helped me grow. If you are for me, who can be against me? Amen."},

{t:"For our friendships",ref:"Ru 1:14-17",v:"Wherever you go I will go, wherever you lodge I will lodge. Your people shall be my people and your God, my God.",
exp:"Naomi loses her husband and her two sons and decides to return to her homeland. She asks her daughters-in-law to stay with their own families. Orpah says goodbye, but Ruth clings to her and promises to stay with her forever. From that faithfulness a new story is born: Ruth will become the great-grandmother of King David.",
med:["The friendship between Ruth and Naomi shows that true love stays, even when it would be easier to leave. Faithful friendships are a rare gift from God.","Think of the women who stood by you in hard times. They were signs of God’s care for you."],
perg:"Which friends have been a “Ruth” in my life?",
des:"Send a thank-you message to a friend, telling her specifically why you thank God for her. Pray also for a friend who is going through a hard time.",
ora:"Thank you, Lord, for the friends you have placed on my path. Bless each one of them and make me a faithful friend too. Amen."},

{t:"For our parents and grandparents",ref:"Sir 3:2-6",v:"Those who honor their father atone for sins; they store up riches who respect their mother.",
exp:"The Book of Sirach teaches how to live the fourth commandment. Honoring father and mother brings blessing, forgiveness and joy. Further on (Sir 3:12-14), it asks us to be patient with our aging parents, even when their minds fail. It is one of the readings for the Feast of the Holy Family.",
med:["From our parents and grandparents we received life and, often, the faith. Even with their mistakes and limits, there is much to give thanks for.","If your relationship with your parents is difficult, gratitude can start with something small. And if they have already passed away, prayer is the most beautiful way to thank them."],
perg:"What did I receive from my parents and grandparents that I want to give thanks for?",
des:"Call or visit your parents or grandparents and thank them for something specific. If they have passed away, pray for them today and, if you can, have a Mass offered for them.",
ora:"Thank you, Lord, for my parents and grandparents. Bless those who are living and grant eternal rest to those who have gone before us. Amen."},

{t:"For the gift of faith",ref:"Eph 2:4-10",v:"For by grace you have been saved through faith, and this is not from you; it is the gift of God",
exp:"Saint Paul reminds the Ephesians that God, rich in mercy, brought us to life with Christ when we were dead in sin. Salvation isn’t something we achieve: it is grace, a free gift, received through faith.",
med:["Faith isn’t our own merit; it is a gift from God. Often it reached us through someone’s hands: a grandmother who prayed, a catechist, a friend.","Giving thanks for our faith also means caring for it, feeding it with prayer, the Word and the sacraments, and passing it on."],
perg:"Who taught me to pray and to believe? How can I pass the faith on?",
des:"Thank God for the people who taught you the faith and, if possible, tell one of them. Pray the Creed slowly, giving thanks for each truth it professes.",
ora:"Thank you, Lord, for the gift of faith. Increase my faith and make me a witness of your love to my family. Amen."},

{t:"For the little things",ref:"Mt 6:25-34",v:"Learn from the way the wild flowers grow. They do not work or spin.",
exp:"In the Sermon on the Mount, Jesus asks us not to live worried about what to eat or wear. He points to the birds and the flowers: the Father cares for them tenderly. If he cares for the flowers like that, how much more for us. And he concludes: seek first the Kingdom of God.",
med:["Jesus paid attention to little things: flowers, birds, yeast, a seed. God speaks in simple things too.","Worry steals our ability to see. Whoever trusts in the Father’s care can notice the little joys scattered throughout the day."],
perg:"What little joys did I almost miss today?",
des:"Take a photo of or write down three little joys from today (a flower, sunlight in the window, someone’s laughter). Tonight, give thanks for each one before bed.",
ora:"Thank you, Lord, for the little joys of the day. Take away my worry and teach me to trust in your Father’s care. Amen."},

{t:"For the Eucharist",ref:"Lk 22:14-20",v:"Then he took the bread, said the blessing, broke it, and gave it to them, saying, ‘This is my body, which will be given for you; do this in memory of me.’",
exp:"At the Last Supper, before his Passion, Jesus celebrates the Passover with the apostles. He takes the bread and the wine, gives thanks and gives them as his Body and his Blood. He asks them to do this in memory of him. It is the institution of the Eucharist.",
med:["The word “Eucharist” means thanksgiving. Mass is the greatest thank-you there is: in it, we join our gratitude to Jesus’ thanksgiving to the Father.","Jesus wanted to stay with us in a real and simple way, in a piece of bread. What a gift! Gratitude for that gift makes us long more and more to be with him."],
perg:"How have I been living the Mass? Is it a moment of gratitude for me?",
des:"Go to Mass (it can be a weekday Mass) with the intention of giving thanks. If you can’t, make a Spiritual Communion and spend five minutes thanking Jesus for his presence in the Eucharist.",
ora:"Thank you, Jesus, for staying with us in the Eucharist. May every Mass be a great act of thanksgiving for me. Amen."},

{t:"Coming back to give thanks",ref:"Lk 17:11-19",v:"And one of them, realizing he had been healed, returned, glorifying God in a loud voice; and he fell at the feet of Jesus and thanked him.",
exp:"On the way to Jerusalem, Jesus meets ten lepers who cry out for mercy. He tells them to show themselves to the priests and, on the way, they are all healed. But only one comes back to give thanks, and he was a Samaritan, a foreigner. Jesus asks whether ten were not cleansed, and where the other nine are.",
med:["It is easy to ask and forget to give thanks. The nine were healed in body, but the one who came back received something more: he heard Jesus tell him that his faith had saved him.","Coming back to give thanks deepens our relationship with God. Gratitude draws us closer to the One who gave us the gift."],
perg:"What answered prayer have I not yet come back to give thanks for?",
des:"Look at your prayer requests in the Pray tab (or remember prayers that were answered) and choose one grace you received. Come back to give thanks: pray, write your thank-you below and, if you like, share your testimony with someone.",
ora:"Lord, I come back to thank you for the graces I have received. I don’t want to be like the nine who forgot. Thank you, Jesus. Amen."},

{t:"Great things",ref:"Lk 1:46-55",v:"The Mighty One has done great things for me, and holy is his name.",
exp:"Mary, in Elizabeth’s house, sings the Magnificat, her great hymn of thanksgiving. She recognizes that God has looked upon her littleness and done wonders in her. And she recalls that God is faithful to his promises, from generation to generation.",
med:["As these two weeks come to an end, do what Mary did: look back and recognize the great things God has done in you and in your family.","Gratitude doesn’t have to end here. It can become a way of life: eyes trained to see God in everything."],
perg:"What has changed in me over these two weeks of gratitude?",
des:"Reread your gratitude list from the first day and add what you discovered over these 14 days. Pray the Magnificat (Pray tab) and choose one gratitude habit to continue, like naming three things you are thankful for before bed.",
ora:"My soul proclaims your greatness, Lord, because you have done great things for me. Thank you, Lord, for everything. Amen."}
]};

for(var i=0;i<PLANOS.length;i++){var x=P[PLANOS[i].id];if(x){PLANOS[i].d=x.d;PLANOS[i].resumo=x.resumo;if(x.ini)PLANOS[i].ini=x.ini;}}
})();

// 21 days praying for my children: full version
(function(){
var D=[
{t:"Giving my children to God",ref:"1 Sm 1:20-28",v:"I prayed for this child, and the LORD granted my request. Now I, in turn, give him to the LORD",
exp:"Hannah could not have children and prayed with many tears at the sanctuary in Shiloh. God heard her, and she gave birth to Samuel. When the boy was a little older, Hannah brought him to the house of the Lord and dedicated him to the Lord for his whole life. Samuel became a great prophet.",
med:["Children are gifts from God, not our property. Hannah understood this: what she received from God, she gave back to God. And she didn’t lose her son; she gave him the best destiny possible.","Giving our children to God takes away the weight of having to control everything. We keep caring for them, raising them and protecting them, but knowing there is a Father who loves them even more than we do."],
perg:"What have I been trying to control in my children’s lives that I need to give to God?",
des:"Write each child’s name on a sheet of paper (or a card for each one) and, next to it, the words: “Lord, this child is yours.” Tonight, trace the Sign of the Cross on each child’s forehead before bed.",
ora:"Lord, I give you my children. They are yours before they are mine. Take care of them, guide them and make of them what you dreamed. Amen."},

{t:"Faith passed from mother to child",ref:"2 Tm 1:3-7",v:"I recall your sincere faith that first lived in your grandmother Lois and in your mother Eunice",
exp:"Saint Paul writes to young Timothy, whom he loves like a son. He recalls that Timothy’s faith began at home, with his grandmother and his mother. And he encourages him to stir into flame the gift of God within him, because God did not give us a spirit of cowardice but of power, love and self-control.",
med:["Faith is learned at home first: on a lap, in bedtime prayers, through example. No religion class can replace seeing your mother pray.","Lois and Eunice probably never imagined they were forming a bishop and a saint. Every little prayer you pray with your children is a seed God will make grow in his own time."],
perg:"How do my children see me live my faith day to day?",
des:"Today, let your children see you praying: a moment on the couch with your Bible, a Rosary, a prayer before a meal. If they ask, tell them why you pray.",
ora:"Lord, may my faith be sincere like that of Lois and Eunice, and may my children receive it as their inheritance. Amen."},

{t:"God’s protection",ref:"Ps 91:9-16",v:"For he commands his angels with regard to you, to guard you wherever you go.",
exp:"Psalm 91 is a prayer of trust from someone who takes refuge in God. It promises that no evil will overcome the one who trusts in the Lord, and that the angels will carry them in their hands so their foot will not stumble. At the end, God himself speaks: because they cling to him, he will deliver them.",
med:["Every mother knows she can’t be everywhere: at school, out on the street, on the phone, among their friends. That can cause a lot of anxiety.","God has placed a guardian angel beside each of your children. Praying for their protection is trusting that they are not alone when you aren’t nearby."],
perg:"What fear do I have about my children’s safety? Can I give it to God?",
des:"Teach your children (or pray together with them) the Guardian Angel prayer. Agree to pray it together every night until the end of this plan.",
ora:"Angel of God, my guardian dear, to whom God’s love commits me here, ever this day be at my side, to light and guard, to rule and guide. Amen. Lord, guard my children in all their ways."},

{t:"Health of body and soul",ref:"Mk 5:21-24, 35-43",v:"Do not be afraid; just have faith.",
exp:"Jairus, a synagogue official, falls at Jesus’ feet: his twelve-year-old daughter is dying. On the way, people come to say she has already died. Jesus tells Jairus not to be afraid, but only to have faith. He goes into the house, takes the girl by the hand and says, “Talitha koum,” telling her to get up. And she gets up.",
med:["Every mother knows the anguish of a sick child. Jairus didn’t stay home crying: he went to Jesus, knelt and asked. That is what we can do with every fever, every test, every diagnosis.","Jesus cares about the health of our children’s bodies and souls. And he tells us what he told Jairus: do not be afraid; just have faith."],
perg:"Is there anything about my children’s health (body, mind or soul) that worries me today?",
des:"Tonight, while your children are sleeping, place your hand on each one’s head and pray for their health, saying their name and asking for what they need.",
ora:"Jesus, you took Jairus’ daughter by the hand. Take my children by the hand too. Give them health of body, mind and soul. Amen."},

{t:"A kind heart",ref:"Lk 10:30-37",v:"Go and do likewise.",
exp:"A scholar of the law asks Jesus who his neighbor is. Jesus tells the story of a man who is robbed and left half-dead on the road. A priest and a Levite pass by on the other side. A Samaritan, someone seen as an enemy, stops, cares for his wounds and pays for his lodging. Jesus concludes: go and do the same.",
med:["More than “successful” children, we want good children. In a world that teaches competition and thinking only of yourself, a kind heart is a treasure.","Kindness is taught through small gestures: sharing a snack, comforting a classmate, helping at home without expecting anything in return. And it is taught by seeing Mom stop to help someone."],
perg:"In what situations do I see kindness in my children? Have I praised it?",
des:"Together today, do something kind for someone: donate a toy, bring something to a neighbor, write a note to someone who is sad. Afterward, talk about how it felt.",
ora:"Jesus, give my children a good heart like the Samaritan’s, one that sees who is suffering and stops to help. Amen."},

{t:"Good friendships",ref:"1 Sm 18:1-4",v:"Jonathan’s life became bound up with David’s life; he loved him as his very self.",
exp:"After David’s victory over Goliath, Jonathan, son of King Saul, forms a deep friendship with him. Jonathan gives David his cloak, his sword and his bow, and the two make a covenant. Later, Jonathan protects David, even against his own father.",
med:["Friendships shape our children’s hearts, sometimes more than their parents do. A good friend helps them grow; bad company can lead them far away.","Pray for your children’s friends, by name. And pray that they find friends like Jonathan: loyal, protective and who bring them closer to God."],
perg:"Do I know my children’s friends? Do any of them worry me?",
des:"Ask your children about their friends, with curiosity and without judgment. Pray today for each friend by name. If possible, invite one of their friends over for a snack.",
ora:"Lord, give my children true friends who help them grow in goodness. Keep them away from bad company. Amen."},

{t:"Studies and wisdom",ref:"1 Kgs 3:5-12",v:"Give your servant, therefore, a listening heart to judge your people and to distinguish between good and evil.",
exp:"God appears in a dream to the young King Solomon and tells him to ask for whatever he wants. Solomon doesn’t ask for riches, a long life or victory over his enemies. He asks for a listening heart, to know how to tell right from wrong. God is so pleased that he gives him wisdom and also what he didn’t ask for.",
med:["Wisdom goes beyond school grades. It is knowing how to choose what is good, listening to the right advice, thinking before acting. It is a gift we ask of God.","Pray for your children’s studies, for their focus, their memory, their teachers. But above all, ask for them to have a listening heart."],
perg:"What do I want most for my children: success or wisdom?",
des:"Before school (or homework), pray the prayer to the Holy Spirit with your children. Ask them: “If God said to you, ‘Ask for whatever you want,’ what would you ask for?”",
ora:"Holy Spirit, give my children a listening heart. Light up their studies and teach them to choose what is good. Amen."},

{t:"Beloved children of God",ref:"Mk 1:9-11",v:"You are my beloved Son; with you I am well pleased.",
exp:"Jesus goes to the Jordan River and is baptized by John. Coming up out of the water, he sees the heavens open and the Spirit come down like a dove. And a voice from heaven calls him the beloved Son. Jesus hadn’t worked a single miracle yet: the Father loves him before anything he does.",
med:["At Baptism, God said the same thing to each of your children: “You are my beloved child.” That love doesn’t depend on grades, behavior or achievements.","When children know they are loved unconditionally, they grow stronger to face the world. And they learn to see God as a Father through the way they are loved at home."],
perg:"Do my children feel loved even when they make mistakes?",
des:"Today, look each child in the eye and say: “You are loved by God and by me, just the way you are.” If you have photos from their Baptism, show them and tell them about that day.",
ora:"Father, thank you that my children are your beloved children. May they feel your love through mine. Amen."},

{t:"Obedience with love",ref:"Lk 2:41-52",v:"He went down with them and came to Nazareth, and was obedient to them … And Jesus advanced in wisdom and age and favor",
exp:"After being found in the Temple, where he had stayed talking with the teachers, Jesus goes back to Nazareth with Mary and Joseph and lives obedient to them. The Gospel sums up those years like this: Jesus grew in wisdom and age and favor before God and people.",
med:["Even Jesus, the Son of God, obeyed Mary and Joseph. Obedience isn’t only doing what we’re told: it is trusting the ones who love and guide us.","Obedience is taught with firmness and love together. Clear rules, calmly explained, consistently kept, and always with lots of affection."],
perg:"At home, have I been able to combine firmness and affection? Where do I go too far, or let things slide?",
des:"As a family, pick one or two house rules that have been hard to keep. Explain why they matter and agree on how to keep them. Praise every act of obedience today.",
ora:"Jesus, who were obedient in Nazareth, teach my children to obey with love, and teach me to guide them with firmness and tenderness. Amen."},

{t:"A pure heart",ref:"Mt 5:1-12",v:"Blessed are the clean of heart, for they will see God.",
exp:"On the mountain, Jesus teaches the Beatitudes, the path to true happiness: blessed are the poor in spirit, the meek, those who hunger for righteousness, the merciful, the peacemakers. And blessed are the clean of heart, for they will see God.",
med:["The world offers so much that stains our children’s hearts, earlier and earlier: images, songs, violent or impure content. A pure heart is a clean heart, able to see God.","Protecting our children’s purity is a mission that requires watchfulness (on the phone, the TV, with friends) and open conversation, without fear or shame."],
perg:"What comes in through my children’s eyes and ears every day?",
des:"Today, pay close attention to what your children watch and listen to. If needed, set up parental controls. Talk with them about what is good and what harms the heart.",
ora:"Lord, keep my children’s hearts pure and clean, so that they can see you. Protect their eyes and ears from all evil. Amen."},

{t:"Courage to face giants",ref:"1 Sm 17:32-37, 45-47",v:"You come against me with sword and spear and scimitar, but I come against you in the name of the LORD of hosts",
exp:"The giant Goliath challenges the army of Israel, and everyone is afraid. David, a young shepherd, offers to fight. Saul has his doubts, but David remembers that God rescued him from the lion and the bear. He faces Goliath without armor, with a sling and five stones, trusting in God, and he wins.",
med:["Your children will face giants: fear, shyness, tests, bullying, peer pressure. Brave children aren’t children without fear, but children who trust God even when they are afraid.","David remembered past victories to find courage. Help your children remember the times God has already helped them."],
perg:"What “giant” is each of my children facing today?",
des:"Tell the story of David and Goliath together (from the Bible or a children’s Bible). Ask each child what their “giant” is and pray together for courage.",
ora:"Lord, give my children David’s courage. Even when they are afraid, may they face their giants in your name. Amen."},

{t:"Brothers and sisters united",ref:"Gn 45:1-5, 14-15",v:"I am your brother Joseph … do not be distressed … It was really for the sake of saving lives that God sent me here ahead of you.",
exp:"Joseph was sold into slavery by his own brothers, out of jealousy. Years later, he becomes governor of Egypt, and his brothers come to ask for food. Joseph reveals who he is, weeps, embraces and forgives each of them. He recognizes that God turned evil into good.",
med:["Fights between siblings are normal and part of growing up. But a family can teach them to resolve those fights with forgiveness, as Joseph did with his brothers.","Siblings who are close as children are more likely to be friends for life. Psalm 133 says how good and pleasant it is when brothers live together in unity. If you have an only child, pray for the cousins and friends who are like siblings."],
perg:"How do my children treat each other? Do I compare them or feed rivalries without realizing it?",
des:"Suggest a “sibling kindness day” today: each one does something nice for another in secret and shares it at night. If there’s a fight, teach them to ask for and give forgiveness with a hug.",
ora:"Lord, unite my children in love. May they forgive each other, protect each other and be friends for life. Amen."},

{t:"Peace in their emotions",ref:"Mk 4:35-41",v:"‘Quiet! Be still!’ The wind ceased and there was great calm.",
exp:"In the evening, Jesus and the disciples cross the lake by boat. A violent storm comes up, and the boat begins to fill with water. Jesus is asleep. The terrified disciples wake him. Jesus gets up, commands the wind and the sea to be calm, and everything becomes still. Then he asks them why they are so afraid.",
med:["Children also feel anxiety, sadness, anger and fear, and often they don’t know how to name what they feel. For them, it is a storm inside the boat.","Jesus is in your children’s boat. Teach them to call on him in the storms. And be a calm presence yourself: welcome the feeling before correcting the behavior."],
perg:"What difficult emotion has each of my children been going through? Have I been able to welcome it?",
des:"Today, ask each child: “How is your heart today?” Listen without correcting. Teach them a short prayer for moments of fear or anger: “Jesus, calm my heart.”",
ora:"Jesus, you calmed the storm. Calm my children’s hearts too. Give them peace in their emotions and trust in you. Amen."},

{t:"Time and screens",ref:"Eph 5:15-20",v:"Watch carefully then how you live, not as foolish persons but as wise, making the most of the opportunity",
exp:"Saint Paul asks the Christians of Ephesus to live wisely, making the most of their time, because the days are evil. He asks them to try to understand God’s will and, instead of filling themselves with things that do them no good, to be filled with the Spirit, singing and giving thanks.",
med:["Screens compete for our children’s hearts and time. They aren’t bad in themselves, but without limits they steal sleep, conversation, play and even prayer.","Making the most of our time means choosing what fills the heart with life. We need wisdom (and to set an example: our own phone counts too)."],
perg:"How much time do my children (and I) spend on screens? What is being left out?",
des:"Agree today on a screen-free family time (a dinner, an hour before bed) and do something together: a game, a story, a conversation. Start by putting your own phone away.",
ora:"Lord, teach us to make good use of our time. May screens not steal what matters most in our home. Amen."},

{t:"Each child’s calling",ref:"Jer 1:4-10",v:"Before I formed you in the womb I knew you, before you were born I dedicated you",
exp:"God calls Jeremiah to be a prophet. Jeremiah thinks he is too young and says he doesn’t know how to speak. God answers that he knew him even before he was born, that he will be with him and that he will put his words in his mouth.",
med:["God has a plan for each of your children, from before they were in the womb. Our mission isn’t to choose their lives for them, but to help them discover what God has called them to.","A vocation isn’t only being a priest or a religious sister: it is the call to marriage, to consecrated life, to a profession, to a unique way of serving. Pray that they have ears to hear that call."],
perg:"What gifts do I see in each of my children? Have I given them room to grow?",
des:"Tell each child about one gift you see in them (“you are so caring,” “you have a gift for drawing”). Pray for each one’s vocation, open to whatever God wants.",
ora:"Lord, you have known my children since before they were in the womb. Show them their calling and give them the courage to say yes. Amen."},

{t:"A future full of hope",ref:"Jer 29:11-14",v:"plans for your welfare and not for woe, so as to give you a future of hope.",
exp:"The people of Israel were in exile in Babylon, far from home, not knowing what would happen. Through the prophet Jeremiah, God sends them a letter: he will take care of them, he has plans for their welfare and he will bring them home. When they seek him with all their heart, they will find him.",
med:["It is natural to worry about our children’s future: their career, their marriage, their faith, the world they will live in. But worrying doesn’t add a single day to their lives.","God has plans of peace for your children. Praying for their future is handing him what we can’t control and trusting that he will be there when we are not."],
perg:"What worry about my children’s future weighs most on my heart?",
des:"Write a letter to each child (or one for all of them) about your dreams for them and your certainty that God is with them. Keep it to give them at a special moment.",
ora:"Lord, you have plans of peace for my children. I give you their future and I trust in your love. Amen."},

{t:"The child who drifted away",ref:"Lk 15:11-24",v:"While he was still a long way off, his father caught sight of him, and was filled with compassion. He ran to his son, embraced him and kissed him.",
exp:"A son asks his father for his inheritance and leaves, wasting everything on a life without direction. When he hits bottom, he comes to his senses and decides to go home. The father, who had been waiting every day, sees him from far away, runs, embraces him and throws a feast. He doesn’t demand anything: he simply rejoices that his son has come home.",
med:["If one of your children has drifted away from the faith, from home or from you, don’t lose hope. The father in the parable didn’t force his son back, but he waited with the door open and his heart ready.","If your children are still young, pray that when they make mistakes, they will know they can always come home. The door of your home and the door of God are open."],
perg:"Is one of my children far away (from God, from home or from me)? How is the door of my heart toward them?",
des:"Pray a decade of the Rosary today for the child who most needs God. If they are far away, send a simple loving message, with no pressure. If your children are little, tell them: “No matter what happens, you can always come back to me.”",
ora:"Merciful Father, bring back the children who have drifted away. Give me a heart that waits with love and a door that is always open. Amen."},

{t:"Grateful children",ref:"Lk 17:11-19",v:"Ten were cleansed, were they not? Where are the other nine?",
exp:"Ten lepers ask Jesus to have pity on them. Jesus tells them to go show themselves to the priests, and on the way they are all healed. Only one, a Samaritan, comes back praising God and falls at Jesus’ feet to thank him. Jesus asks where the other nine are.",
med:["Gratitude is taught by practicing it. A grateful child is happier, more generous and complains less. And they realize that everything they have is a gift.","We often give our children everything and forget to teach them to say thank you: to God, to their grandparents, to their teacher, to whoever cooks their meals."],
perg:"Do my children usually say thank you? Do I give thanks in front of them?",
des:"At dinner today, each person in the family names three things they are grateful to God for. Help your children write a thank-you note to someone (a grandmother, a teacher, a catechist).",
ora:"Lord, teach my children to come back and give thanks, like the Samaritan. May our home be full of gratitude. Amen."},

{t:"The sacraments in our children’s lives",ref:"Mk 10:13-16",v:"Let the children come to me; do not prevent them, for the kingdom of God belongs to such as these.",
exp:"People bring children for Jesus to touch, but the disciples scold them. Jesus is indignant and tells them to let the children come to him. Then he takes them in his arms, lays his hands on them and blesses them.",
med:["The sacraments are real encounters with Jesus: Baptism, Confession, the Eucharist, Confirmation. Bringing our children to them is doing what those mothers did: bringing the children to Jesus so he could touch them.","Sometimes, in the rush of life, religious education becomes just one more thing on the schedule. Let your children see that Mass and the sacraments matter to you too."],
perg:"Where is each of my children in their sacramental life? Is anything overdue or forgotten?",
des:"Check whether each child is up to date with the sacraments and faith formation for their age. This Sunday, go to Mass together and, on the way out, talk about what they thought.",
ora:"Jesus, I bring my children to you. Touch them through the sacraments and bless them with your hands. Amen."},

{t:"Me, Mom, as an example",ref:"Dt 6:4-9",v:"Take to heart these words which I command you today. Keep repeating them to your children.",
exp:"Moses teaches the people the most important prayer of Israel, calling them to hear that the Lord is the only Lord and to love him with all their heart. And he asks that these words be taught to their children all the time: sitting at home, walking along the road, when lying down and when getting up.",
med:["Children learn much more from what they see than from what they hear us say. They watch how Mom reacts to stress, how she talks about her husband, how she prays, how she treats people who serve her.","This isn’t meant to weigh on you, but to encourage you: you don’t need to be perfect, you need to be real. When you get it wrong, say sorry to your children. That teaches them too."],
perg:"What example have I been setting without realizing it? What would I like my children to learn from me?",
des:"Today, choose an ordinary moment (in the car, at bath time, at bedtime) to talk about God with your children in a simple way, just as Moses asks. If you got it wrong with one of them recently, say sorry.",
ora:"Lord, may my life be an example of faith for my children. Forgive my failings and use even them to teach my children. Amen."},

{t:"Consecrating my children to Our Lady",ref:"Jn 19:25-27",v:"Woman, behold, your son. … Then he said to the disciple, ‘Behold, your mother.’",
exp:"At the foot of the cross stood Mary and the beloved disciple, John. Before he died, Jesus entrusted Mary to John as his mother and John to Mary as her son. And from that hour the disciple took her into his home. The Church understands that, there, Jesus gave Mary to all of us as our mother.",
med:["No one understands a mother’s heart better than Mary. She watched her son grow up, disappear, be misunderstood and suffer. And she kept standing, trusting.","Consecrating your children to Our Lady is placing them under the mantle of a Mother who never fails. After these 21 days, entrust to her the care of everything you have prayed for."],
perg:"What has changed in my mother’s heart over these 21 days?",
des:"Gather your children in front of an image of Our Lady and pray together a Hail Mary and today’s prayer of consecration. If you can, give Mary a flower.",
ora:"O Mary, my Mother, I consecrate my children to you. Cover them with your mantle, guard them from evil and always lead them to Jesus. They are yours. Amen."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="filhos21"){PLANOS[i].d=D;PLANOS[i].resumo="Three weeks covering your children in prayer: faith, protection, health, friendships, emotions, future and calling. Each day brings a reading explained, a meditation, a space to write and a challenge to live out with them.";}}
})();

// 30 days of prayer during pregnancy: full version
(function(){
var D=[
{t:"A new life within me",ref:"Ps 139:13-16",v:"You formed my inmost being; you knit me in my mother’s womb.",
exp:"The psalmist marvels at God’s work: it was God who formed every part of his being, in his mother’s womb, in secret. God’s eyes saw him unformed, and all the days of his life were already written in God’s book.",
med:["Right now, God is knitting a life within you. Every heartbeat, every tiny finger, every feature of your baby’s face is being formed by his hands.","You are taking part in the most beautiful work of creation. May these 30 days be a time to contemplate, give thanks and place this life in the hands of the One who is knitting it."],
perg:"What do I feel when I think that God is knitting my baby right now?",
des:"Place your hands on your belly, read Psalm 139:13-16 out loud to your baby and thank God for their life.",
ora:"Lord, thank you for the life you are knitting within me. Take care of every detail of my baby. This child is yours. Amen."},

{t:"A gift from God",ref:"Ps 127:3-5",v:"Certainly sons are a gift from the LORD, the fruit of the womb, a reward.",
exp:"This psalm reminds us that everything we build depends on God. And it presents children as a heritage and a gift from the Lord, like arrows in the hand of a warrior: a blessing that strengthens the family.",
med:["Every child is a gift, even when they arrive at an unexpected time or when pregnancy brings fear and insecurity. God has entrusted you with a unique life.","Receiving your child as a gift changes how you see things: not a burden or a problem to solve, but a gift to welcome and give thanks for."],
perg:"How did I receive the news of this pregnancy? Can I see this baby as a gift from God?",
des:"Write a list of reasons to give thanks for this pregnancy. Read it to the baby’s father or to someone you love.",
ora:"Lord, thank you for the gift of this child. May I receive this baby with joy and gratitude every day. Amen."},

{t:"Mary waited too",ref:"Lk 1:26-33",v:"you will conceive in your womb and bear a son, and you shall name him Jesus.",
exp:"The angel Gabriel visits a young woman of Nazareth named Mary and announces that she will conceive and bear a son, the Son of the Most High, whose kingdom will have no end. Mary, full of grace, welcomes the news that would change her life.",
med:["Our Lady also lived through a pregnancy: her body changing, the questions, the nausea, the anticipation, the journey to Bethlehem at the end of her pregnancy. She understands what you are feeling.","Mary kept all these things in her heart. You can talk with her about every stage, the way a daughter talks with her mother."],
perg:"What feeling about my pregnancy would I like to talk over with Our Lady?",
des:"Pray a decade of the Rosary today, meditating on the first Joyful Mystery (the Annunciation), and entrust your pregnancy to Mary.",
ora:"Mary, who waited for Jesus, walk with me through my pregnancy. Teach me to keep everything in my heart as you did. Amen."},

{t:"The baby who leaped for joy",ref:"Lk 1:39-45",v:"When Elizabeth heard Mary’s greeting, the infant leaped in her womb",
exp:"Mary, pregnant with Jesus, visits her cousin Elizabeth, pregnant with John. When Mary arrives and greets Elizabeth, the baby John leaps for joy in his mother’s womb. Elizabeth, filled with the Holy Spirit, recognizes the presence of the Lord.",
med:["Elizabeth’s baby recognized Jesus before he was born. The Bible shows that life in the womb is already full life, able to feel and to rejoice.","Your baby can also sense your voice, your affection, your peace. Your prayer already touches their life."],
perg:"How do I imagine my baby responding to my voice and my touch?",
des:"Talk to your baby today: tell them about your day, sing a song, pray a Hail Mary out loud with your hand on your belly.",
ora:"Lord, may my baby rejoice in your presence starting now, as John rejoiced in Elizabeth’s womb. Amen."},

{t:"The fears of pregnancy",ref:"Is 41:10-13",v:"Do not fear: I am with you; do not be anxious: I am your God.",
exp:"God speaks tenderly to his people: do not fear, I am with you, I will strengthen you, help you and uphold you. And he promises to hold them by the right hand.",
med:["It is normal to have fears during pregnancy: about the baby’s health, the birth, not being able to handle it, the changes in your life. Fear isn’t a lack of faith; it is a sign that you love.","God doesn’t say “don’t feel fear,” but “do not fear, for I am with you.” He holds your hand at every step."],
perg:"What is my biggest fear in this pregnancy?",
des:"Write your fears on a sheet of paper. Then, next to each one, write: “I am with you.” Pray, handing them over one by one.",
ora:"Lord, you are holding my hand. Take my fears and give me your peace. Amen."},

{t:"A changing body",ref:"2 Cor 4:7, 16-18",v:"But we hold this treasure in earthen vessels",
exp:"Saint Paul says we carry a treasure, God’s life, in fragile earthen vessels. That is why we do not lose heart: even if our outer self is wasting away, our inner self is being renewed day by day.",
med:["Your body is changing a lot: weight, skin, tiredness, shape. Sometimes it is hard to look in the mirror. But this “earthen vessel” is carrying a treasure.","Every stretch mark, every pound, every backache is part of the work of bringing a life into the world. Your body is doing something extraordinary."],
perg:"How have I been looking at my body during this pregnancy?",
des:"Look in the mirror today and, instead of criticizing, thank God for what your body is doing. Take a photo of your bump to keep.",
ora:"Lord, thank you for my body, which carries the treasure of life. Teach me to look at it with gratitude. Amen."},

{t:"On days of nausea and exhaustion",ref:"2 Cor 12:7-10",v:"My grace is sufficient for you, for power is made perfect in weakness.",
exp:"Saint Paul tells how he begged God three times to take away a suffering he called a “thorn in the flesh.” God answered that his grace was enough. And Paul understood: when I am weak, then I am strong.",
med:["There are days when pregnancy weighs on you: nausea, exhaustion, aches, sleepless nights. On those days, you don’t have to be strong. God’s grace is enough.","Offer your discomforts to God for your baby. It is an ancient and beautiful way of praying: turning tiredness into love."],
perg:"What has been weighing on my body most these days? Do I offer it to God?",
des:"Today, with each discomfort, say a short prayer: “Jesus, I offer you this for my baby.” And rest without guilt whenever you can.",
ora:"Lord, your grace is enough for me. On tired days, be my strength. I offer you every discomfort for my child. Amen."},

{t:"Called from the womb",ref:"Is 49:1-5",v:"Before birth the LORD called me, from my mother’s womb he gave me my name.",
exp:"The prophet speaks of his calling: before he was born, God had already called him and spoken his name. God prepared him like a hidden arrow, for a mission. Even when he thought he was working in vain, he knew his reward was with God.",
med:["God already knows your baby’s name, already knows their temperament and has a mission for them in the world. Before you meet them, God has already called them.","Your mission as a mother is to help this child discover God’s call. And that begins now, with prayer."],
perg:"What do I ask of God for my child’s life and mission?",
des:"Write a prayer for your baby’s vocation and keep it to read to them when they grow up.",
ora:"Lord, you have called my child from the womb. Prepare them for the mission you have for them. Amen."},

{t:"Blessing my belly",ref:"Nm 6:22-27",v:"The LORD bless you and keep you! The LORD let his face shine upon you…",
exp:"God teaches Moses the blessing the priests are to give the people: that the Lord bless and keep them, let his face shine on them, be gracious to them and give them peace. It is one of the oldest blessings in the Bible.",
med:["A mother’s blessing begins before birth. To bless your baby is to wish them every good thing, in God’s name.","The Church even has a blessing for expectant mothers that a priest can give. Ask at your parish."],
perg:"What blessings do I wish for my baby?",
des:"Make the Sign of the Cross over your belly and pray the blessing from Numbers for your baby. Ask the baby’s father to do the same. If possible, ask a priest for the blessing.",
ora:"May the Lord bless you and keep you, my child. May the Lord let his face shine upon you and give you peace. Amen."},

{t:"The baby’s father",ref:"Mt 1:18-24",v:"he did as the angel of the Lord had commanded him and took his wife into his home.",
exp:"Joseph learns that Mary is with child and thinks of leaving her quietly. In a dream, the angel explains that the child is from the Holy Spirit and tells Joseph not to be afraid to take Mary into his home. Joseph wakes up and does exactly what the angel said: he welcomes Mary and the child.",
med:["Joseph welcomed Mary and Jesus with love and courage, even without understanding everything. He was afraid too, and he also had to trust.","Your baby’s father is also living this pregnancy, in his own way. Men sometimes get quieter, but they also feel fear and worry."],
perg:"How is the baby’s father living this pregnancy? Have I been including him?",
des:"Invite the baby’s father to feel the baby move, go to an appointment or choose something for the nursery with you. Pray together for him and his mission as a father.",
ora:"Saint Joseph, protector of the Holy Family, watch over my baby’s father. Give him courage, faith and a welcoming heart. Amen."},

{t:"Preparing our home",ref:"Prv 31:10-12, 25-30",v:"the woman who fears the LORD is to be praised.",
exp:"The Book of Proverbs ends with praise for the wise and strong woman: she cares for her home with dedication, works with her own hands, reaches out to the poor, speaks with wisdom and fears the Lord. She looks to the future with a smile, because she trusts.",
med:["Getting the nursery, the baby clothes and the routine ready is also prayer when it is done with love. Every tiny outfit you fold can be accompanied by a prayer.","Nothing needs to be perfect or expensive. A baby needs love, arms to be held in and care, much more than decorations."],
perg:"What still worries me about preparing our home for the baby?",
des:"While you organize something for the baby today (clothes, the nursery, the hospital bag), pray a Hail Mary for each item or corner.",
ora:"Lord, bless our home as it gets ready to welcome this baby. May it be full of love and peace. Amen."},

{t:"Big brothers and sisters",ref:"Ps 133",v:"How good and how pleasant it is, when brothers dwell together as one!",
exp:"This short psalm celebrates the joy of unity among brothers and sisters. It compares that unity to precious oil poured out and to the dew that falls on the mountains. That is where God pours out his blessing and life.",
med:["If you already have children, they are living this pregnancy too: with joy, curiosity and sometimes jealousy and fear of losing their place.","Including the siblings in the waiting helps prepare their hearts. If this is your first child, pray for the cousins, the family and the siblings who may still come."],
perg:"How are the older siblings (or the family) experiencing the baby’s arrival?",
des:"Let the siblings take part: talk to the belly, choose a little outfit, draw something for the baby. Tell each one that Mommy’s love doesn’t get smaller; it only grows.",
ora:"Lord, unite my children in love starting now. Prepare each one’s heart to welcome their new sibling. Amen."},

{t:"Tests and appointments",ref:"Is 26:3-4",v:"With firm purpose you maintain peace; in peace, because of our trust in you.",
exp:"Isaiah sings of trust in the Lord, who is the eternal Rock. Whoever leans on him firmly is kept in peace. So he invites everyone to trust in the Lord forever.",
med:["Every test can bring anxiety: ultrasounds, blood work, waiting for results. It’s natural for your heart to tighten.","Bring God with you to every appointment. Pray before you go in, during the test and while you wait for the result. Peace comes from leaning on him."],
perg:"What test or result has been making me anxious?",
des:"Before your next appointment or test, pray Is 26:3-4. Pray also for the doctors and health professionals who care for you.",
ora:"Lord, keep me in peace. In every test and appointment, I lean on you and trust in your care. Amen."},

{t:"Anxiety and peace",ref:"Phil 4:4-9",v:"Have no anxiety at all … the peace of God that surpasses all understanding will guard your hearts",
exp:"Saint Paul asks Christians to rejoice in the Lord always and to bring all their requests to God in prayer and thanksgiving. He promises that the peace of God will guard their hearts. And he advises filling the mind with whatever is true, good and lovely.",
med:["Anxiety during pregnancy is common: what might go wrong, what lies ahead. And the internet sometimes makes the fear worse with too much information.","Paul gives us a path: hand it over in prayer and feed your thoughts with what is good. Choose carefully what you read and listen to during these months."],
perg:"What has been feeding my anxiety? What can I swap for good things?",
des:"Today, do a “search fast”: no looking up pregnancy questions online. Instead, read a psalm or listen to a song that brings you peace.",
ora:"Lord, take my anxiety. Guard my heart and my thoughts in your peace. Amen."},

{t:"Choosing the name",ref:"Is 43:1-4",v:"I have called you by name: you are mine. … Because you are precious in my eyes",
exp:"God speaks to his people: do not fear, for I have redeemed you; I have called you by name; you are mine. He promises to be with them through the waters and the fire, and says his people are precious and loved.",
med:["A name is the first gift we give our child. God calls each person by name, with a personal love. Your baby’s name will be spoken by God too.","Many Catholic families choose a saint’s name, and that saint becomes the child’s patron and example."],
perg:"What do I hope my child’s name will mean to them?",
des:"Look up the meaning of the name you have chosen (or the names you are considering) and whether there is a saint with that name. Pray, asking for that saint’s protection.",
ora:"Lord, you call each one by name. Bless my child’s name and make them precious in your eyes. Amen."},

{t:"Resting in God",ref:"Ps 23",v:"The LORD is my shepherd; there is nothing I lack. In green pastures he makes me lie down",
exp:"In the best-known psalm of the Bible, David describes God as a shepherd who cares for his sheep: he leads them to green pastures and still waters, guides them along the right path and is with them even in the dark valley.",
med:["Resting is part of caring for your baby. God himself “makes us lie down.” It isn’t laziness or weakness.","During pregnancy, your body asks for more rest. Listen to your body and let the Good Shepherd lead you to still waters."],
perg:"Have I been letting myself rest? Or do I feel guilty when I stop?",
des:"Today, take some real rest: lie down, put your feet up and slowly pray Psalm 23.",
ora:"Lord, my Shepherd, let me rest. With you, nothing is lacking, not for me and not for my baby. Amen."},

{t:"Our Lady of Happy Delivery",ref:"Lk 2:1-7",v:"While they were there, the time came for her to have her child, and she gave birth to her firstborn son.",
exp:"Because of a census, Joseph and Mary, already near the end of her pregnancy, travel from Nazareth to Bethlehem. There, the time comes for her to give birth. There is no room for them in the inn, and Mary gives birth to Jesus, wraps him in swaddling clothes and lays him in a manger.",
med:["Mary gave birth far from home, in a simple place, without the comforts she had planned. She understands the uncertainties of giving birth.","Our Lady of Happy Delivery is an old devotion among expectant mothers. They ask Mary to be with them at the moment of birth, the way a mother stays with her daughter."],
perg:"What would I like to ask Our Lady about my baby’s birth?",
des:"Pray the prayer to Our Lady of Happy Delivery today (or a decade of the Rosary meditating on the birth of Jesus), entrusting your delivery to her.",
ora:"Our Lady of Happy Delivery, be with me when my child is born. Cover us with your mantle. Amen."},

{t:"Life in abundance",ref:"Jn 10:10-11",v:"I came so that they might have life and have it more abundantly.",
exp:"Jesus presents himself as the Good Shepherd. He says the thief comes to steal and destroy, but he came to bring life, and life in abundance. The good shepherd lays down his life for his sheep.",
med:["Saint Gianna Beretta Molla was a physician, wife and mother. During her last pregnancy, she learned she had a serious illness and chose to protect her daughter’s life. She is an example of generous love for life.","Jesus came to bring abundant life. Pregnancy is a share in this work of God: giving life, caring for life, protecting life."],
perg:"What does “life in abundance” mean to me for my child?",
des:"Read a little about Saint Gianna and pray, asking her intercession for your pregnancy and for all expectant mothers.",
ora:"Saint Gianna, intercede for me and my baby. Jesus, give us life in abundance. Amen."},

{t:"Mercy from age to age",ref:"Lk 1:46-50",v:"His mercy is from age to age to those who fear him.",
exp:"Pregnant with Jesus, Mary sings the Magnificat in Elizabeth’s house. She praises God, who has looked on her lowliness and done great things for her. And she proclaims that God’s mercy passes from age to age.",
med:["Your baby is a new generation in your family. The mercy of God that reached your grandparents and parents now reaches your child.","Saint Gerard Majella, a Redemptorist brother, is often invoked as the patron of expectant mothers. Ask him to intercede for the new generation on its way."],
perg:"What inheritance of faith do I want to pass on to my child?",
des:"Pray the Magnificat (Lk 1:46-55) today and ask for Saint Gerard Majella’s intercession for your baby.",
ora:"Saint Gerard Majella, patron of expectant mothers, pray for us. Lord, may your mercy reach my child. Amen."},

{t:"Thinking about Baptism",ref:"Jn 3:1-6",v:"no one can enter the kingdom of God without being born of water and Spirit.",
exp:"Nicodemus, a Pharisee, visits Jesus at night. Jesus tells him that one must be born again. Nicodemus doesn’t understand: how can someone go back into his mother’s womb? Jesus explains that it means being born of water and Spirit.",
med:["Your baby will be born twice: from your womb and, at Baptism, of water and the Spirit, as a child of God. Baptism will be their first great encounter with Jesus.","Thinking about Baptism now helps you prepare it with love: choosing godparents well, the parish, the date."],
perg:"What kind of godparents do I want for my child? People who will help them in the faith?",
des:"Talk with the baby’s father about Baptism: the parish, possible godparents and the date. Pray for the future godparents.",
ora:"Lord, prepare my child to be born of water and the Spirit. May they be your beloved child from their Baptism on. Amen."},

{t:"Talking to my baby",ref:"Ps 145:1-7",v:"One generation praises your deeds to the next and proclaims your mighty works.",
exp:"The psalmist promises to praise God every day and says that each generation tells the next about God’s wonders. Faith is passed from parents to children through stories, songs and prayer.",
med:["Your baby already hears your voice in the womb and recognizes its tone. Your words, songs and prayers are already reaching them.","Telling your baby about God’s wonders starting now is beginning to pass on the faith. It is their very first lesson in faith, given with love."],
perg:"What would I like to tell my baby about God?",
des:"Today, sing a hymn to your baby or tell them a Bible story, with your hand on your belly.",
ora:"Lord, may my child hear about you from the womb. May our family proclaim your wonders. Amen."},

{t:"Caring for myself with love",ref:"3 Jn 2-4",v:"Beloved, I hope you are prospering in every respect and are in good health, just as your soul is prospering.",
exp:"The apostle John writes to a friend, Gaius, and begins by wishing that he may be healthy in body, just as he is in soul. And he says his greatest joy is knowing that his spiritual children are walking in the truth.",
med:["Eating well, drinking water, sleeping, keeping up with prenatal care, walking: all of this is also love for your baby. Caring for yourself is caring for them.","God desires your health in body and soul. Don’t forget your soul: prayer, the sacraments, some time in silence."],
perg:"How am I caring for my body and my soul during this pregnancy?",
des:"Choose one way to care for your body today (a healthy meal, more water, a walk) and one way to care for your soul (Mass, Confession, a time of prayer).",
ora:"Lord, help me take good care of my body and my soul, for my sake and for my baby’s. Amen."},

{t:"A circle of support",ref:"Lk 1:39-45, 56",v:"Mary remained with her about three months",
exp:"Right after the angel’s announcement, Mary hurries to the home of Elizabeth, who is also pregnant. The two meet, rejoice and pray together. Mary stays with Elizabeth about three months, until close to John’s birth.",
med:["Mary and Elizabeth supported each other in pregnancy. No woman was made to go through this season alone.","A circle of support (family, friends, community) makes a huge difference during pregnancy and after the birth. Don’t be ashamed to ask for help and accept it."],
perg:"Who is part of my circle of support? Who else could I reach out to?",
des:"Talk with someone you trust about how they can help you after the baby is born. Thank the people who are already supporting you.",
ora:"Lord, thank you for the people who support me. Place “Elizabeths” on my path to walk with me. Amen."},

{t:"Trusting God with the birth",ref:"Jn 16:20-22",v:"When a woman is in labor, she is in anguish because her hour has arrived; but when she has given birth to a child, she no longer remembers the pain",
exp:"At the Last Supper, Jesus prepares the disciples for his death and resurrection. To explain that their sorrow will turn into joy, he uses the image of childbirth: the pain is real, but the joy of a new life is greater.",
med:["Jesus used childbirth as an image of hope. He knows the pain of labor and the joy that comes after.","Being afraid of giving birth is natural. Give the moment of birth to God: the kind of delivery, the medical team, the day and the hour. He will be with you."],
perg:"How do I picture the moment of birth? What do I give to God today?",
des:"Write a prayer to pray on the day you give birth and keep it in your hospital bag. Ask someone you trust to pray for you that day.",
ora:"Jesus, you know the pain and the joy of birth. Stay with me when I give birth and turn every anguish into joy. Amen."},

{t:"The team who will care for us",ref:"Sir 38:1-4, 12-14",v:"God has also established him in his profession.",
exp:"The Book of Sirach teaches us to value doctors and to be grateful for them, because their knowledge comes from God. It says the Lord made the earth bring forth medicines and that the physician himself also prays to God to be right in his diagnosis and treatment.",
med:["Doctors, nurses, doulas and the whole team are instruments of God. Faith and medicine walk together.","Praying for the team who will care for you and your baby is an act of trust and of charity. They also need wisdom and peace."],
perg:"Do I trust the team caring for me? Have I been praying for them?",
des:"Pray today, by name (if you know them), for each professional caring for you during your pregnancy and who will be there at the birth.",
ora:"Lord, bless the doctors and the whole team caring for me and my baby. Give them wisdom, care and peace. Amen."},

{t:"For other expectant mothers",ref:"Gal 6:2-10",v:"Bear one another’s burdens",
exp:"Saint Paul asks Christians to help one another carry their burdens. And he encourages us: let us not grow tired of doing good, because in due time we will reap. While we have the opportunity, let us do good to all.",
med:["Many women are pregnant right now: some alone, afraid, without resources or in high-risk pregnancies. Some are thinking of giving up.","Praying for and helping other expectant mothers is a way to give thanks for your own pregnancy and to stand up for life."],
perg:"Do I know an expectant mother who needs support or prayer?",
des:"Pray today for all expectant mothers, especially those who are alone or afraid. If you can, donate something to a mother in need (baby clothes, diapers), for example through a local pregnancy center.",
ora:"Lord, take care of every expectant mother in the world, especially those who are alone or afraid. Protect every life. Amen."},

{t:"A family that prays",ref:"Ps 128",v:"Your wife will be like a fruitful vine within your home, your children like young olive plants around your table.",
exp:"The psalm describes the blessing of those who fear God: eating the fruit of their own labor, a wife like a fruitful vine, children around the table like olive shoots. It is the picture of a blessed and united family.",
med:["Your baby will arrive in a home. What kind of home will they find? A family that prays together gives a child firm roots.","You don’t have to wait for the baby to be born to start: family prayer can begin now, with the baby still in the womb."],
perg:"What do I want our family’s prayer life to look like when the baby arrives?",
des:"Agree with the baby’s father (and your other children, if you have them) on a simple family prayer, and start today, with your hand on your belly.",
ora:"Lord, may our family be like a fruitful vine and olive shoots around the table. May our child grow up in a home that prays. Amen."},

{t:"Entrusting the birth to God",ref:"Ps 22:10-12",v:"since my mother bore me you are my God. Do not stay far from me…",
exp:"In the middle of a psalm of great suffering (the psalm Jesus prayed on the cross), the psalmist remembers that God has cared for him since birth: it was God who drew him from his mother’s womb and made him rest safe at her breast. And he pleads: do not be far from me.",
med:["God has been with your baby since the womb, and he will be with them at birth and all through life. He is your child’s God already.","Entrusting the birth to God is trusting that he takes care of the exact moment, the way it happens and every detail."],
perg:"What detail of the birth am I still struggling to give to God?",
des:"Pray a prayer of surrender for the birth today, placing the due date, the place and each fear in God’s hands. Write it here.",
ora:"Lord, since the womb you have been my child’s God. Do not be far from us. I give you the moment of birth. Amen."},

{t:"Free from excessive worry",ref:"Mt 6:26-30",v:"Look at the birds in the sky; they do not sow or reap, they gather nothing into barns, yet your heavenly Father feeds them.",
exp:"Jesus invites us to look at nature: the birds don’t store up food, and the Father feeds them; the wild flowers don’t spin, yet they are dressed more beautifully than King Solomon. If God takes care of them like that, how much more will he take care of you, you of little faith!",
med:["Baby gear, the hospital bag, the nursery, finances, maternity leave: the list of worries seems endless.","It is good to prepare, but don’t let worry steal the joy of waiting. The Father who takes care of the little birds takes care of your baby."],
perg:"What practical worry has been stealing my peace?",
des:"Make a list of what still needs to be prepared and break it into small tasks. Give the list to God in prayer and choose just one task for today.",
ora:"Father, you take care of the birds and the flowers. Take care of us too. Take away my excessive worry. Amen."},

{t:"Consecrating my baby",ref:"Lk 2:22-35",v:"they took him up to Jerusalem to present him to the Lord",
exp:"Forty days after his birth, Mary and Joseph take Jesus to the Temple to present him to God, as the Law required. There, the old man Simeon takes the child in his arms and praises God: now he can go in peace, because he has seen salvation.",
med:["Mary and Joseph presented Jesus to God. You can do the same with your baby starting now, consecrating them to God and to Our Lady.","After these 30 days, give it all to him: the pregnancy, the birth, your child’s life, your mother’s heart."],
perg:"What has changed in my heart over these 30 days of prayer?",
des:"Pray a prayer consecrating your baby to God and to Our Lady, with your hand on your belly, together with the baby’s father if possible. Write the date here so you can tell your child about it someday.",
ora:"Lord, I present and consecrate my child to you. Mary, cover them with your mantle. This child is yours, from the womb and forever. Amen."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="gestacao30"){PLANOS[i].d=D;PLANOS[i].resumo="For moms-to-be: a month of praying for your baby, giving your fears to God and preparing your heart for the birth. Each day brings a reading explained, a meditation, a space to write and a small challenge.";}}
})();

// 21 days to restore my home: full version
(function(){
var D=[
{t:"God is the builder of the house",ref:"Ps 127:1-2",v:"Unless the LORD build the house, they labor in vain who build.",
exp:"This psalm was sung by pilgrims on their way to Jerusalem. It reminds us that all human effort is useless without God: building, keeping watch, rising early and going to bed late. God provides what we need even while we sleep.",
med:["When home life feels heavy, the first temptation is to fix everything ourselves: more rules, more demands, more exhaustion. The psalm reminds us to start with the foundation.","Restoring your home begins by inviting God to be the builder. You keep working, but you stop carrying the whole project alone."],
perg:"In what part of my home have I been working alone, without letting God build?",
des:"Walk through your house room by room and pray an Our Father in each one, asking God to be the builder of that place and of the people who live there.",
ora:"Lord, you build my house. Without you, all our effort is in vain. Be the foundation of our family. Amen."},

{t:"Inviting Jesus in",ref:"Lk 19:1-10",v:"Zacchaeus, come down quickly, for today I must stay at your house.",
exp:"Zacchaeus was a chief tax collector, wealthy and disliked by the people. Since he was short, he climbs a tree to see Jesus pass by. Jesus stops, looks up and says he wants to stay at his house. Zacchaeus welcomes Jesus with joy, and his life changes: he pays back what he stole and shares with the poor. Jesus says that salvation has come to that house today.",
med:["Jesus didn’t wait for Zacchaeus’ house to be tidy or his life to be sorted out. He wanted to come in right then. And once he came in, everything began to change.","Your home doesn’t need to be perfect for Jesus to come in either. He wants to stay with you today, just as you are."],
perg:"What room in my home (or in my life) am I ashamed to let Jesus into?",
des:"Place a crucifix or an image of Jesus somewhere visible in your home, where the family passes every day. Pray in front of it: “Jesus, stay in our home.”",
ora:"Jesus, come into my home today, as you came into the house of Zacchaeus. May salvation reach everyone who lives here. Amen."},

{t:"Tidying my heart first",ref:"Ps 51:3-14",v:"A clean heart create for me, God; renew within me a steadfast spirit.",
exp:"King David wrote this psalm after admitting a grave sin. He doesn’t make excuses: he asks for mercy, asks to be washed and cleansed. And he makes a beautiful request: a new heart, a steadfast spirit and the joy of salvation restored.",
med:["A home changes when the heart of the one who cares for it changes. It is easy to see what others need to change; it is harder to look inside.","This isn’t about blaming yourself for everything, but about starting where you have power: your own heart. A mother at peace brings peace to the whole house."],
perg:"What in my heart has been making my home feel heavier?",
des:"Make a good examination of conscience today and, if possible, go to Confession this week. Write down your parish’s Confession times here.",
