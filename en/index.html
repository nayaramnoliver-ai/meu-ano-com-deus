ora:"O God, give me a clean heart. Wash me, renew me and give me back my joy, so that I may bring peace to my home. Amen."},

{t:"Forgiving at home",ref:"Mt 18:21-35",v:"I say to you, not seven times but seventy-seven times.",
exp:"Peter asks Jesus how many times he must forgive: seven times? Jesus answers: seventy-seven times, that is, always. And he tells the parable of a servant whose huge debt was forgiven by the king, but who would not forgive a fellow servant a small debt.",
med:["In a family, we hurt and are hurt every day, almost always without meaning to. Without forgiveness, the home becomes a place of debts to collect.","Remembering how much God has already forgiven us helps us forgive others. Forgiveness isn’t a feeling: it is a decision we renew, again and again."],
perg:"Who in my home have I not yet truly forgiven?",
des:"Choose someone in the family with whom there is hurt and take a step toward reconciliation today: a hug, an apology, a kind word. Teach the kids to say: “I forgive you.”",
ora:"Lord, you forgave me a huge debt. Give me a heart that forgives the people in my home, again and again. Amen."},

{t:"Gentle words",ref:"Jas 3:2-10",v:"With it we bless the Lord and Father, and with it we curse human beings who are made in the likeness of God. … This need not be so.",
exp:"Saint James compares the tongue to a bit in a horse’s mouth, to the rudder of a ship and to a small spark that sets a whole forest on fire. Such a small part of the body can steer everything toward good or evil. And he warns that blessing and cursing should not come from the same mouth.",
med:["A tone of voice can change a whole conversation. The Book of Proverbs says that a mild answer calms wrath (Prv 15:1). Many arguments at home could end in minutes with a gentle word.","Notice today the words said on autopilot: yelling, sarcasm, nicknames, threats. They are small sparks that slowly burn the house down."],
perg:"What words or tone of mine have been starting fires at home?",
des:"Today, when you feel like yelling, lower your voice and move closer to the person to speak. Repeat this prayer throughout the day: “Lord, guard my mouth.”",
ora:"Lord, put a bridle on my tongue. May only words that bless my family come out of my mouth. Amen."},

{t:"Praying together",ref:"Acts 1:12-14",v:"All these devoted themselves with one accord to prayer, together with some women, and Mary the mother of Jesus",
exp:"After Jesus ascends into heaven, the apostles return to Jerusalem and gather in the upper room. There, together with Mary and some other women, they pray with one heart, waiting for the coming of the promised Holy Spirit.",
med:["The Church was born from a family that prayed together with Mary. Family prayer is also what brings the Holy Spirit to life within the home.","It doesn’t have to be long or perfect: an Our Father before bed, a blessing before a meal, a Hail Mary in the car. What matters is doing it consistently."],
perg:"At what moment of the day could my family pray together, even for a minute?",
des:"Choose a set time to pray together (at dinner or before bed) and start today with an Our Father and a Hail Mary, holding hands.",
ora:"Mary, pray with us as you prayed with the apostles. May our family persevere together in prayer. Amen."},

{t:"The peace Jesus gives",ref:"Jn 14:23-27",v:"Peace I leave with you; my peace I give to you. Not as the world gives do I give it to you.",
exp:"At the Last Supper, Jesus promises that if anyone loves him, he and the Father will come and dwell with that person. He also promises the Holy Spirit, who will teach them and remind them of everything. And he leaves a gift: his peace, different from the peace the world gives. He tells them not to let their hearts be troubled.",
med:["The world’s peace depends on everything being settled. Jesus’ peace lives in the heart even when there are problems, because it comes from his presence.","A peaceful home isn’t a home without conflict, but a home where Jesus lives and where conflicts find a way through."],
perg:"What has been stealing the peace in my home the most?",
des:"Before bed, stop by the room of each person in the house and say quietly (or out loud): “The peace of Jesus be with you.”",
ora:"Jesus, leave your peace in our home. Dwell in us and calm our hearts. Amen."},

{t:"Only one thing is needed",ref:"Lk 10:38-42",v:"Martha, Martha, you are anxious and worried about many things. There is need of only one thing.",
exp:"Jesus visits the home of Martha and Mary. Martha is busy with many tasks to welcome her guest well; Mary sits at Jesus’ feet to listen to him. Martha complains, and Jesus answers her tenderly: she is anxious about many things, but Mary has chosen the better part.",
med:["Martha wasn’t wrong to serve; the problem was the anxiety. Many homes are like that: so much to keep up with that there is no room left for what matters most.","Order and simplicity calm a home. Fewer things, fewer commitments, a simpler routine. And, in the middle of it all, some time at Jesus’ feet."],
perg:"How many things do I get anxious about every day? What could I simplify?",
des:"Choose one spot in the house that causes stress (a drawer, the table, the entryway) and organize it today. Set aside something you don’t use to donate. Then sit for 5 minutes in silence with Jesus.",
ora:"Lord, calm my anxiety. Teach me to choose the better part and to simplify life in our home. Amen."},

{t:"The family table",ref:"Acts 2:42-47",v:"breaking bread in their homes … They ate their meals with exultation and sincerity of heart",
exp:"Saint Luke describes the life of the first Christians: they devoted themselves to the teaching of the apostles, to the communal life, to the breaking of the bread and to the prayers. They shared what they had and gathered in their homes to eat together, with joy and simplicity.",
med:["The table is the family’s little altar. It is where we talk, laugh, share about our day and pray. Many families have lost the table to the TV and the phone.","It doesn’t have to be a feast: a simple meal with everyone together nourishes more than any fancy plate eaten alone on the couch."],
perg:"How often does my family eat together at the table? What gets in the way?",
des:"Have a meal together at the table today, with no TV and no phones. Pray before eating and, during the meal, let each person share the best part of their day.",
ora:"Lord, bless our table and make it a place of togetherness, joy and simplicity of heart. Amen."},

{t:"Keeping Sunday holy",ref:"Ex 20:8-11",v:"Remember the sabbath day—keep it holy.",
exp:"In the Ten Commandments, God asks his people to set aside one day each week for him: six days to work and one to rest and remember that life is God’s gift. For Christians, that day is Sunday, the day of Jesus’ Resurrection.",
med:["Sunday is God’s gift to the family. It isn’t only the day for Mass: it is a day to rest, to be together, to visit the people we love, to do something different.","When Sunday becomes just another day of chores and screens, the family loses its weekly breath of fresh air."],
perg:"What has Sunday been like for my family? Is it different from other days?",
des:"Plan next Sunday: Mass as a family and a special time together (a lunch, an outing, a game). Write down here what you will do.",
ora:"Lord, teach us to keep Sunday holy. May it be a day to meet you and to rest as a family. Amen."},

{t:"Healing our memories",ref:"Rv 21:1-5",v:"Behold, I make all things new.",
exp:"At the end of the Bible, Saint John has a vision: a new heaven, a new earth and the new Jerusalem coming down from heaven, beautiful as a bride. A voice says that God will dwell with his people and wipe away every tear, and there will be no more death or pain. And God says he is making all things new.",
med:["Some family wounds are old: stories of abandonment, violence, addiction, fights that run through generations. They repeat themselves without our noticing.","God wants to heal your family’s story and make something new of it. You can be the person in whom the wound stops and the healing begins."],
perg:"What old wound in my family do I not want to pass on to my children?",
des:"Write down the names of your parents, grandparents and ancestors and pray for them, asking God to heal the wounds in your family’s story. If possible, have a Mass offered for them.",
ora:"Lord, you make all things new. Heal the wounds of my family and begin a new story in us. Amen."},

{t:"Blessing our home",ref:"Nm 6:22-27",v:"The LORD bless you and keep you! The LORD let his face shine upon you, and be gracious to you!",
exp:"God teaches Moses a blessing for the priests to give the people: that the Lord bless and keep them, let his face shine on them, be gracious to them and give them peace. And he promises that when they invoke his name this way, he will bless them.",
med:["To bless is to wish someone good in God’s name. Fathers and mothers can and should bless their children and their home: it is an ancient and very beautiful gesture of faith.","A blessed home isn’t free of problems, but it is wrapped in God’s protection and his loving gaze."],
perg:"Do I usually bless my family? What blessing does my home need most today?",
des:"Today, bless each person in the house with the blessing from Numbers, tracing the Sign of the Cross on their forehead. If possible, ask a priest to come bless your home, or pray through the rooms with holy water.",
ora:"May the Lord bless us and keep us. May the Lord let his face shine upon us and give us peace. Amen."},

{t:"Open doors",ref:"Gn 18:1-10",v:"Sir, if I may ask you this favor, please do not go on past your servant.",
exp:"In the heat of midday, Abraham sees three men near his tent. He runs to meet them and offers water to wash their feet, rest and a meal lovingly prepared by Sarah. The visitors were messengers from God, and they announce that Sarah, already old, will have a son.",
med:["A restored home opens itself to others. The Letter to the Hebrews reminds us not to neglect hospitality, because through it some have entertained angels without knowing it (Heb 13:2).","Welcoming others doesn’t require a big house or expensive food. It requires an open heart: a cup of coffee, a conversation, a place at the table."],
perg:"Has my home been a place where people feel welcome?",
des:"Invite someone for coffee or a meal this week: a neighbor, someone who lives alone, a couple you are friends with. Prepare it with the care of Abraham and Sarah.",
ora:"Lord, may our home have open doors and a welcoming heart. In welcoming others, may I welcome you. Amen."},

{t:"Strength for the weary",ref:"1 Kgs 19:3-8",v:"Get up and eat or the journey will be too much for you!",
exp:"The prophet Elijah flees into the desert, hunted and exhausted. He sits under a tree and tells God he has had enough. He falls asleep. An angel touches him, offers him bread and water and tells him to get up and eat. Twice. With the strength of that food, Elijah walks forty days to the mountain of God.",
med:["Restoring a home is tiring. Many mothers reach Elijah’s “enough, Lord.” God didn’t scold him: he let him sleep, gave him food, and only then asked him to keep going.","Sometimes the most spiritual thing to do is to rest, eat well and accept help. And to be fed by the Bread of the Eucharist, which gives strength for the journey."],
perg:"What do my body and soul need today in order to keep going?",
des:"Today, take care of yourself: go to bed earlier, eat a meal slowly, ask for help with a task. If you can, go to a weekday Mass to receive the Bread for the journey.",
ora:"Lord, you know how tired I am. Touch me as you touched Elijah, feed me and give me strength for the journey. Amen."},

{t:"A bridge between those who quarrel",ref:"Gn 13:5-12",v:"Let there be no strife between you and me, or between your herders and my herders, for we are kindred.",
exp:"Abram and his nephew Lot had so many flocks that the land couldn’t support them both, and their herdsmen began to quarrel. Abram, the elder, could have imposed his will. Instead, he proposes peace and lets Lot choose first whatever land he wants.",
med:["Jesus called the peacemakers blessed (Mt 5:9). A mother is often the bridge between her husband and the kids, between siblings, between families. It is a beautiful and tiring mission.","Abram teaches us that for there to be peace, sometimes someone has to give way first. Giving way isn’t losing: it is choosing peace."],
perg:"Between whom, in my home, do I need to be a bridge of peace? Where can I give way?",
des:"If there is an unresolved fight between people at home, help them talk today, calmly, each one listening to the other. If the conflict is yours, give way on something small for the sake of peace.",
ora:"Lord, make me an instrument of your peace. Where there is discord, let me bring unity. Amen."},

{t:"God provides for our needs",ref:"2 Kgs 4:1-7",v:"Go sell the oil to pay off your creditor; with what remains, you and your children can live.",
exp:"A widow, deep in debt, is in danger of losing her sons as slaves. She goes to the prophet Elisha, who asks what she has in the house. Only a small jug of oil. Elisha tells her to borrow empty vessels from her neighbors and fill them all from that little bit of oil. The oil only stops when the vessels run out.",
med:["Tight money weighs heavily on a home: it brings fights, fear and shame. God is not indifferent to this. He asked the widow what she had in the house. He started with the little she had.","Restoring a family’s finances takes faith and also action: getting organized, talking, cutting what isn’t needed, seeking help. God multiplies the little we give him."],
perg:"What financial situation worries my home the most? What do I have “in the house” to give to God?",
des:"Make a simple list of your household expenses today and see where you can save. Pray over the bills, placing them before God. Share something, however small, with someone who has less.",
ora:"Lord, you multiplied the widow’s oil. Look upon the needs of our home and give us wisdom and provision. Amen."},

{t:"The armor of God",ref:"Eph 6:10-18",v:"Put on the armor of God so that you may be able to stand firm against the tactics of the Devil.",
exp:"Saint Paul reminds us that our struggle is not against people, but against evil. So he asks Christians to put on the armor of God: the belt of truth, the breastplate of righteousness, feet ready to bring the gospel of peace, the shield of faith, the helmet of salvation and the sword of the Spirit, which is the word of God. And to pray at every opportunity.",
med:["The family is deeply loved by God, and that is why it is also attacked: division, addiction, discouragement, lies. Many fights at home have a spiritual root.","Remember that your husband, your kids or your in-laws are not the enemy. The enemy is the evil that wants to divide. And against it, prayer is the family’s weapon."],
perg:"What division or attack has my home been suffering? Have I been fighting against people or against evil?",
des:"Pray the Saint Michael prayer for your whole family today. Read Eph 6:10-18 and choose one “piece of armor” to put on this week (for example: truth, peace, faith).",
ora:"Saint Michael the Archangel, defend our family in battle. Lord, clothe us in your armor and protect our home from all evil. Amen."},

{t:"The joy of the Lord is our strength",ref:"Neh 8:8-12",v:"Do not be saddened this day, for rejoicing in the LORD is your strength!",
exp:"After the exile, the people rebuild Jerusalem. The priest Ezra reads the law of God to everyone, and the people weep as they listen. Nehemiah tells them that today is holy to the Lord and they should not be sad: go, eat, drink and share with those who have nothing. And the people celebrate with great joy.",
med:["A restored home also laughs. Joy is a sign that God is present, and it is strength for facing hard days.","Sometimes we get so focused on problems that we forget to celebrate. Celebrating the little things is also an act of faith."],
perg:"When was the last time my family celebrated something together? What can we celebrate today?",
des:"Do something joyful together today: a special dessert, a song to dance to in the living room, a game, a picnic on the porch. Celebrate a small family victory.",
ora:"Lord, fill our home with your joy. May it be our strength on good days and hard ones. Amen."},

{t:"The value of small gestures",ref:"Mk 12:41-44",v:"Amen, I say to you, this poor widow put in more than all the other contributors to the treasury.",
exp:"Jesus watches people putting their offerings into the Temple treasury. Many rich people put in large amounts. A poor widow comes and puts in two small coins. Jesus calls his disciples and says she has given more than all the others, because she gave everything she had to live on.",
med:["God doesn’t measure the size of the gesture, but the love in it. Restoring a home is made of small gestures: a note, coffee brought to bed, dishes washed without complaining.","Maybe you feel you have little to give. But, like the widow, a little given with love is worth more than a lot given out of obligation."],
perg:"What small gesture of love can I offer each person in my home today?",
des:"Today, make a small gesture of love for each person in the house (a note, a hug, their favorite dish, a compliment). Write down how each one reacted.",
ora:"Lord, may I never look down on small gestures. Receive my two small coins of love and multiply them in my home. Amen."},

{t:"Mary in our home",ref:"Lk 1:39-45, 56",v:"Mary remained with her about three months and then returned to her home.",
exp:"Right after the angel’s announcement, Mary hurries to the home of Elizabeth, who is pregnant and already old. When she arrives, John leaps for joy in Elizabeth’s womb. Mary stays there three months, helping her cousin, until John is born.",
med:["Mary brought Jesus into Elizabeth’s house and stayed there to serve. Wherever Mary goes, Jesus comes and joy happens.","Inviting Mary into your home is asking her to care for your family the way a mother does: attentive, quiet, helpful and full of faith."],
perg:"What corner of my home and my routine can I dedicate to Our Lady?",
des:"Set up or tidy a little prayer corner at home with an image of Mary, a candle and a flower. Pray a decade of the Rosary there together.",
ora:"Mary, come into our home as you came into Elizabeth’s. Bring Jesus, bring joy and take care of our family. Amen."},

{t:"As for me and my household",ref:"Jos 24:14-18",v:"As for me and my household, we will serve the LORD.",
exp:"At the end of his life, Joshua gathers the people of Israel and tells them everything God has done for them. Then he sets a choice before them: whom will they serve? And he answers first, for himself and his household: they will serve the Lord. The people answer that they too will serve the Lord.",
med:["After 21 days, it is time to look back on the road you have traveled and make a choice, like Joshua. Maybe not everything has changed, but you have planted many seeds.","Joshua didn’t wait for everyone to agree before choosing. He decided for himself and for the household he led. You can also decide today that your home belongs to the Lord."],
perg:"What has changed in my home and in me over these 21 days? What choice do I want to make now?",
des:"Write today’s verse on a pretty piece of paper and put it on your front door or somewhere visible. Gather together for a prayer consecrating your family.",
ora:"Lord, my household and I will serve you. Thank you for these 21 days. Keep restoring and blessing our home. Amen."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="lar21"){PLANOS[i].d=D;PLANOS[i].resumo="For when home life feels heavy: 21 days bringing back peace, forgiveness, prayer and joy. Each day brings a reading explained, a meditation, a space to write and a challenge to live out at home.";}}
})();

// 14 days to become a more patient mom: full version
(function(){
var D=[
{t:"Patience is a fruit of the Spirit",ref:"Gal 5:22-25",v:"the fruit of the Spirit is love, joy, peace, patience, kindness, generosity, faithfulness, gentleness, self-control.",
exp:"Saint Paul lists the fruit the Holy Spirit produces in those who live united to God. He doesn’t speak of separate “fruits,” but of one fruit with many flavors. Patience and self-control are on the list: they aren’t achievements of effort alone, but gifts that grow in us.",
med:["Many moms blame themselves: “I should be more patient.” And they try to get there by sheer willpower, until they explode again. The good news is that patience doesn’t depend on you alone.","Fruit is cultivated: with prayer, rest and time. Over these 14 days, you will ask the Holy Spirit every day for the fruit of patience, and you will take small steps to help it grow."],
perg:"At what times of the day does my patience usually run out? What happens right before?",
des:"Write on a piece of paper or on your phone: “Holy Spirit, give me your fruit.” Put it somewhere you see several times a day (the fridge, the mirror, your phone’s lock screen) and pray it every time you look.",
ora:"Holy Spirit, make the fruit of patience grow in me. I can’t do it alone; work in me. Amen."},

{t:"God is patient with me",ref:"Lk 13:6-9",v:"Sir, leave it for this year also, and I shall cultivate the ground around it and fertilize it",
exp:"Jesus tells the parable of a man who had a fig tree that hadn’t produced fruit for three years. He orders it cut down. But the gardener asks for one more year: he will dig around it, fertilize it and wait. Maybe it will bear fruit.",
med:["That is how God is with me: the patient gardener who doesn’t give up, who asks for one more year, who fertilizes and waits. How many times has he already waited for me?","When we remember the patience God has with us, it becomes easier to be patient with our children, who are still growing and learning."],
perg:"In what area of my life has God been very patient with me?",
des:"Today, when one of your kids repeats a mistake, remember: “God is patient with me.” Instead of scolding, explain again calmly, like the gardener tending the fig tree.",
ora:"Lord, thank you for your patience with me. Teach me to be the gardener with my children, one who waits and cares. Amen."},

{t:"Breathe before you answer",ref:"Prv 15:1, 18; 16:32",v:"The patient are better than warriors, and those who rule their temper, better than the conqueror of a city.",
exp:"The Book of Proverbs gathers practical advice for life. It teaches that a mild answer calms anger, while a harsh word stirs up a fight. And it says that mastering yourself is a greater victory than conquering a city.",
med:["Between what our child does and how we respond there is a small space. Our freedom lives in that space. When we react on impulse, the space disappears.","Taking three deep breaths before answering seems like very little, but it creates the space to choose your response. It is a small act of self-control, greater than conquering a city."],
perg:"How do I usually react in the first second of a conflict with my children?",
des:"Practice the “3-breath rule” today: when something irritates you, take three deep breaths before saying anything. Tonight, write down how many times you managed it.",
ora:"Lord, give me self-control. Between what I feel and what I do, may there be room for your Spirit to work. Amen."},

{t:"Every stage has its time",ref:"Mk 4:26-29",v:"and the seed would sprout and grow, he knows not how.",
exp:"Jesus compares the Kingdom of God to a man who scatters seed on the ground. He sleeps and wakes, night and day, and the seed keeps growing on its own: first the blade, then the ear, then the full grain. When the grain is ripe, the harvest comes.",
med:["Children grow in stages, like the seed: first the blade, then the ear, and only then the grain. We often demand the ripe grain from them while they are still at the blade stage.","A two-year-old throws tantrums, a five-year-old disobeys to test limits, a teenager shuts down. Every stage has its time. Knowing the stage helps us be patient."],
perg:"Am I expecting something from my children that isn’t yet right for their age?",
des:"Look up or recall what is typical for each child’s age. Choose one behavior that annoys you and is typical for their stage, and decide to look at it with more understanding today.",
ora:"Lord, you make the seed grow at the right time. Give me patience with every stage of my children’s lives. Amen."},

{t:"A tired mom",ref:"Mt 11:28-30",v:"Come to me, all you who labor and are burdened, and I will give you rest.",
exp:"Jesus invites everyone who is carrying too much to come to him. He offers his yoke, which is easy, and his burden, which is light. And he presents himself as meek and humble of heart, someone with whom the soul finds rest.",
med:["Much impatience is built-up exhaustion: bad nights, work, the house, the kids, all at the same time. An exhausted mom loses patience faster, not for lack of love.","Jesus doesn’t ask you to handle everything. He invites you: “Come and rest.” Taking care of yourself isn’t selfish; it is what makes it possible to care well for others."],
perg:"How much of my tiredness turns into impatience with my children? What do I need in order to rest?",
des:"Today, ask for help with one task (your husband, an older child, a family member) and use that time to truly rest for 15 minutes, without guilt.",
ora:"Jesus, I am tired. I come to you. Give me your rest and teach me to ask for help. Amen."},

{t:"God’s gentle voice",ref:"1 Kgs 19:9-13",v:"after the fire, a light silent sound.",
exp:"The prophet Elijah is in a cave on the mountain of God. A mighty wind passes by, but God is not in the wind. Then an earthquake, and God is not in the earthquake. Then a fire, and God is not in the fire. Finally, a light, gentle sound. Elijah covers his face: that is where God was.",
med:["God chose to speak to Elijah in a gentle whisper, not a shout. God’s way is gentle.","With our children, a loud voice might frighten them for a moment, but it doesn’t reach the heart. Speaking softly, up close, looking them in the eye, works much better than yelling from across the house."],
perg:"What is my tone of voice like with my children? Do they listen more when I yell or when I come close?",
des:"Today, whenever you need to call or correct one of your children, go to them, get down to eye level and speak softly. Notice the difference in how they respond.",
ora:"Lord, may my voice be like your gentle whisper. Take away my yelling and give me the gentleness that reaches the heart. Amen."},

{t:"Saying sorry to my children",ref:"1 Jn 1:5-10",v:"If we acknowledge our sins, he is faithful and just and will forgive our sins",
exp:"Saint John says that God is light and that whoever walks in the light is in fellowship with him. If we say we have no sin, we deceive ourselves. But if we acknowledge our sins, God forgives us and cleanses us.",
med:["When a mom says sorry, she teaches her children humility, how to make up for a mistake and that we all fall short. It doesn’t take away her authority; it increases their respect.","After an outburst, many moms feel guilty and stay silent. But guilt without forgiveness only weighs us down. Saying sorry and starting over is much healthier for everyone."],
perg:"Have I ever said sorry to my children? Is there something I should apologize for today?",
des:"If you lost your patience with one of your children recently, say sorry today in simple words: “Mommy was wrong to yell at you. Will you forgive me?” Then give each other a hug.",
ora:"Lord, you always forgive me. Give me the humility to say sorry to my children and to teach them to forgive. Amen."},

{t:"Correcting with love",ref:"Heb 12:5-11",v:"for whom the Lord loves, he disciplines",
exp:"The Letter to the Hebrews reminds us that God disciplines us the way a father disciplines his children. At the time, all discipline seems a cause for pain, but later it brings the peaceful fruit of righteousness to those who are trained by it.",
med:["Correction is necessary: children without limits feel insecure. But the correction that truly teaches comes from love, not anger.","Correcting with love means separating the child from the behavior: “I love you, and what you did isn’t right.” It means explaining why, giving fair consequences and then hugging."],
perg:"When I correct my children, do they feel loved or rejected?",
des:"The next time you correct one of them, use this sentence: “I love you, and that’s why I can’t let you do this.” After the consequence, come close again with affection.",
ora:"Lord, teach me to correct the way you correct me: with firmness, fairness and lots of love. Amen."},

{t:"A routine that helps",ref:"Mk 1:32-39",v:"Rising very early before dawn, he left and went off to a deserted place, where he prayed.",
exp:"After a full day, healing many sick people late into the night, Jesus gets up very early, before dawn, and goes off to pray alone. When the disciples find him and say everyone is looking for him, he already knows where to go: to other villages to proclaim the Gospel.",
med:["Many fights with our children happen at the same times: waking up, leaving for school, bath time, bedtime. An organized routine prevents a lot of conflict.","Jesus had a routine too, and prayer was at the center of it. A moment with God before the house wakes up changes the tone of the whole day."],
perg:"At what time of day do most conflicts happen in my home? What could be better organized?",
des:"Choose the hardest time of the day and plan it better: get things ready the night before, give the kids a heads-up, simplify. Try waking up 10 minutes earlier to pray.",
ora:"Lord, help me organize our family routine and put yourself at the center of it. Amen."},

{t:"Every child is unique",ref:"Ps 139:13-16",v:"I praise you, because I am wonderfully made…",
exp:"The psalmist contemplates God’s work in himself: God formed him in his mother’s womb, knew every part of his being and saw his days before they existed. And he praises God for having made him so wonderfully.",
med:["Each child was knit together by God in a unique way: with their own pace, temperament, gifts and struggles. Comparing siblings (or comparing them with other people’s kids) makes a mom impatient and wounds children.","When we look at each child as God’s wonderful work, patience grows. They don’t need to be like their sibling; they need to be who God made them."],
perg:"Do I tend to compare my children with each other or with other kids?",
des:"Today, tell each child something that makes them unique and special in your eyes. Avoid any comparison all day.",
ora:"Lord, thank you for each child, wonderful work of your hands. Teach me to love each one the way you made them. Amen."},

{t:"Waiting for the fruit",ref:"Jas 5:7-11",v:"See how the farmer waits for the precious fruit of the earth",
exp:"Saint James asks Christians to be patient until the coming of the Lord, like the farmer who waits for the rains. He also asks them not to complain about one another. And he recalls Job, who persevered, and the Lord, who is full of mercy.",
med:["Raising children is planting today to harvest many years from now. Often we don’t see the fruit and think nothing we do makes a difference.","A farmer doesn’t pull up the plant to check whether the roots are growing. He trusts. Keep planting: every prayer, every conversation, every limit set with love is growing, even if you can’t see it."],
perg:"What fruit am I anxious to see in my children? Can I trust God’s timing?",
des:"Write a list of the “seeds” you are planting in your children (faith, respect, generosity...). Pray, handing those seeds over to God.",
ora:"Lord, teach me to wait like the farmer. May I keep planting with love and leave the time of harvest to you. Amen."},

{t:"What lies behind the behavior",ref:"Mt 18:1-5, 10",v:"See that you do not despise one of these little ones…",
exp:"The disciples ask who is the greatest in the Kingdom. Jesus calls a child, places the child in their midst and says that unless they become like children, they will not enter the Kingdom. And he warns: don’t despise any of these little ones, because their angels always look upon the face of the Father.",
med:["Behind a difficult behavior there is almost always a need: hunger, sleep, jealousy, fear, a need for attention. A tantrum is the language of someone who doesn’t yet know how to say what they feel.","Jesus put the child at the center. Listening to your child’s heart before reacting to the behavior is taking seriously someone God values so much."],
perg:"What difficult behavior in one of my children might be hiding a need?",
des:"Today, when faced with a difficult behavior, ask before correcting: “What’s going on with you?” Listen. Then talk together about what to do.",
ora:"Jesus, who placed the child at the center, teach me to listen to my children’s hearts behind every action. Amen."},

{t:"A gentle and calm spirit",ref:"1 Pt 3:3-4",v:"the hidden character of the heart, expressed in the imperishable beauty of a gentle and calm disposition, which is precious in the sight of God.",
exp:"Saint Peter writes to Christian women and says that true beauty isn’t in hairstyles, jewelry or clothes, but in the heart. A gentle and calm spirit is a beauty that doesn’t fade and is of great worth in God’s eyes.",
med:["Gentleness isn’t weakness or passivity. It is strength under control: the ability to be firm without being harsh. Jesus asked us to learn from him, for he is meek and humble of heart (Mt 11:29).","A calm spirit isn’t a mom who never feels angry, but a mom who has learned to return to peace more quickly. And that is precious in God’s sight."],
perg:"What takes away my calm? What helps me return to peace?",
des:"Choose a “peace anchor” to use when you feel worked up: a short prayer, a glass of water, stepping out of the room for a minute. Use it today whenever you need it.",
ora:"Jesus, meek and humble of heart, make my heart like yours. Give me a gentle and calm spirit. Amen."},

{t:"Starting over every day",ref:"Lam 3:19-26",v:"The LORD’s acts of mercy are not exhausted … They are renewed each morning",
exp:"The Book of Lamentations was born from the pain of Jerusalem’s destruction. In the middle of the lament, the author remembers something that gives back hope: God’s love never ends, his mercy is renewed every morning. It is good to wait in silence for the Lord’s salvation.",
med:["You don’t have to be a perfect mom. You will get it wrong again and lose your patience again. But every morning is a new chance, because God’s mercy is new too.","After these 14 days, look back on the road with tenderness. Even if you stumbled, you grew. Patience is a road, not a finish line."],
perg:"What has changed in me over these 14 days? What step do I want to keep taking?",
des:"Write a loving letter to yourself, the way a friend would: recognizing your effort, forgiving your mistakes and reminding yourself that tomorrow is a new day. Read it when you feel discouraged.",
ora:"Lord, thank you that your mercy is new every morning. Give me the grace to start over every day with patience and love. Amen."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="paciencia14"){PLANOS[i].d=D;PLANOS[i].resumo="Two weeks of small steps to trade yelling for calm, with the help of God’s grace. Each day brings a reading explained, a meditation, a space to write and a practical challenge with your kids.";}}
})();

// 30 days of faith while trying to conceive: full version
(function(){
var D=[
{t:"Pouring out my soul before God",ref:"1 Sm 1:9-18",v:"I was only pouring out my heart to the LORD.",
exp:"Hannah could not have children. At the sanctuary in Shiloh, she prays silently, only moving her lips, with many tears. Eli the priest thinks she is drunk. Hannah explains that she is pouring out her soul before the Lord. Eli blesses her, and she goes home with peace on her face.",
med:["The desire to be a mother is good and comes from God. You don’t need to hide it or pretend everything is fine. Hannah didn’t pretend: she poured out her whole soul.","The most beautiful part is the ending: before any answer came, Hannah already left with peace on her face. Her peace came from surrendering, not from receiving. Over these 30 days, you will learn to give this dream to God, day after day."],
perg:"If I poured out my soul before God today, what would I tell him?",
des:"Write an honest letter to God telling him everything you feel about wanting to be a mother: the dream, the fear, the pain, the hope. Keep it inside your Bible.",
ora:"Lord, I pour out my heart before you. You know my desire. Give me your peace while I wait. Amen."},

{t:"God knows me through and through",ref:"Ps 139:1-12",v:"LORD, you have probed me, you know me…",
exp:"The psalmist recognizes that God knows him completely: when he sits and when he stands, his thoughts, his words before they are spoken. There is nowhere he can go where God is not: not in the heavens, not in the depths, not in the darkness, which for God is as bright as day.",
med:["God knows every thought of yours, every tear hidden in the bathroom, every negative test no one else saw. Nothing you go through escapes him.","Sometimes waiting makes us feel alone and misunderstood. The psalm reminds us: there is no darkness where God is not with you."],
perg:"What part of my waiting do I feel no one understands? Have I told God about it?",
des:"Read all of Psalm 139 slowly and underline (or write down) the verse that touched your heart the most. Repeat it throughout the day.",
ora:"Lord, you know me through and through. Thank you that I am not alone, not even in the darkness. Amen."},

{t:"When the waiting hurts",ref:"1 Sm 1:1-8",v:"Hannah, why are you weeping? Why are you not eating? Why are you so miserable?",
exp:"Hannah was deeply loved by her husband, Elkanah, but she suffered because she had no children. Every year, when they went to the sanctuary, Elkanah’s other wife taunted her. Hannah would cry and not eat. Elkanah tries to comfort her, asking whether he isn’t worth more to her than ten sons.",
med:["The pain of trying to conceive is often made worse by comments: “So, when’s the baby coming?” “Just relax and it’ll happen.” Like Hannah, you may feel hurt even in places that should be full of joy.","Elkanah loved Hannah, but he couldn’t fully understand her pain. People won’t always understand. God does. And you have every right to protect yourself from hurtful comments."],
perg:"What comments or situations have made my pain worse? How can I protect myself with love?",
des:"Think of a simple, kind sentence to answer intrusive questions (for example: “We’re placing it in God’s hands”). Pray for the people who hurt you without meaning to.",
ora:"Lord, you see my tears as you saw Hannah’s. Protect my heart from words that wound and give me peace. Amen."},

{t:"Nothing is too hard for God",ref:"Gn 18:9-15",v:"Is anything too marvelous for the LORD to do?",
exp:"Three visitors come to Abraham’s tent and announce that Sarah, already old, will have a son the following year. Sarah, hidden behind the tent flap, laughs to herself: she thinks it is impossible. God asks why Sarah laughed, and whether anything is too marvelous for the Lord. A year later Isaac is born, whose name means “laughter.”",
med:["Sarah laughed because she thought it was impossible. Maybe you have laughed like that too, out of weariness or disbelief. God didn’t scold Sarah; he simply reminded her who he is.","God’s question isn’t a promise that everything will happen the way we want, but an invitation not to put limits on what he can do."],
perg:"Where have I been putting limits on what God can do in my life?",
des:"Write today’s verse on a card and put it where you will see it every day, especially on discouraging days.",
ora:"Lord, nothing is impossible for you. Take away my unbelief and teach me to trust in your power and your love. Amen."},

{t:"God remembered Rachel",ref:"Gn 30:22-24",v:"Then God remembered Rachel. God listened to her and made her fruitful.",
exp:"Rachel, Jacob’s dearly loved wife, had no children, while her sister Leah had several. She suffered over this for years. One day, the Bible simply says that God remembered Rachel. She gives birth to Joseph, who would become a great man of God.",
med:["Sometimes it seems God has forgotten us, while everyone around us receives what we are asking for. Rachel felt that too.","But in the Bible, when God “remembers,” it isn’t because he had forgotten: it is because the time has come for him to act. You are not forgotten. God holds your name."],
perg:"When do I feel forgotten by God?",
des:"Write your name on a piece of paper and underneath it: “God does not forget me.” Pray with those words today, handing him your comparisons.",
ora:"Lord, remember me. Even when I feel forgotten, I know my name is held in your heart. Amen."},

{t:"Your prayer has been heard",ref:"Lk 1:8-17",v:"Do not be afraid, Zechariah, because your prayer has been heard. Your wife Elizabeth will bear you a son",
exp:"Zechariah was a priest and, together with Elizabeth, had prayed for a child for many years. They were already old. While he is offering incense in the Temple, the angel Gabriel appears and tells him their prayer has been heard. Elizabeth will have a son, John, who will prepare the way of the Lord.",
med:["Elizabeth and Zechariah prayed for many years, perhaps with little hope left. But not one of those prayers was lost. God kept every one of them.","None of your prayers falls into empty space. God hears. The answer may come in a way or at a time different from what we imagine, but he hears."],
perg:"What prayer have I been praying for a long time and sometimes think God doesn’t hear?",
des:"Light a candle (or make some symbolic gesture) and pray, together with your husband if possible, entrusting your request for a child to God once again.",
ora:"Lord, I know you hear my prayer. Keep every one of my requests and answer in your time and in your way. Amen."},

{t:"Saint Anne and Saint Joachim",ref:"Rom 12:9-12",v:"Rejoice in hope, endure in affliction, persevere in prayer.",
exp:"The Bible doesn’t tell the story of Our Lady’s parents, but the Church’s tradition has kept their names: Joachim and Anne. According to an ancient Christian account, they too waited many years for a child, praying with faith, until God gave them Mary. In today’s reading, Saint Paul describes exactly that attitude: joy in hope, patience and prayer.",
med:["Joachim and Anne are the patrons of grandparents and are often invoked by couples hoping for children. They understand waiting, because they lived it.","Rejoicing in hope, enduring in affliction, persevering in prayer: this isn’t a list of demands; it is a path. Ask them both to walk it with you."],
perg:"How is my hope: joyful or tired? What would help me persevere?",
des:"Pray today, with your husband if possible, asking for the intercession of Saint Joachim and Saint Anne for your desire. If you can, look for an image of them.",
ora:"Saint Joachim and Saint Anne, you who waited with faith, intercede for us. Give us joy in hope and perseverance in prayer. Amen."},

{t:"One cycle at a time",ref:"Mt 6:31-34",v:"Do not worry about tomorrow; tomorrow will take care of itself. Sufficient for a day is its own evil.",
exp:"Jesus speaks about anxiety over life’s needs. He reminds us that the Father knows what we need and asks us to seek first the Kingdom of God. And he concludes: don’t worry about tomorrow; each day already brings its own burden.",
med:["The waiting of each month can turn into anxiety: counting days, looking for signs, imagining, being disappointed. Your whole life ends up hanging on the next result.","Jesus invites you to live one day at a time. Today, just today. That isn’t giving up on the dream; it is not letting it steal the life that is happening right now."],
perg:"How much of my life have I put on pause, waiting for the next result?",
des:"Do something today that brings you joy and has nothing to do with the waiting: a walk, a new recipe, time with friends. Live this whole day fully.",
ora:"Lord, teach me to live one day at a time. Take away my anxiety and give me back the joy of today. Amen."},

{t:"God’s timing",ref:"Eccl 3:1-11",v:"God has made everything appropriate to its time, but has put the timeless into their hearts",
exp:"Qoheleth, the wise man, reflects that everything in life has its time: a time to be born and a time to die, to plant and to harvest, to weep and to laugh. And he concludes that God makes everything beautiful in its time, even though people can’t grasp the whole of God’s work from beginning to end.",
med:["God’s timing isn’t ours, and that hurts. We want to understand why, when, how much longer. But the passage reminds us that we see only one piece of the story.","Trusting God’s timing isn’t sitting back and doing nothing; it is resting in the certainty that he makes everything beautiful, even when we can’t see it yet."],
perg:"What troubles me most about “God’s timing”?",
des:"Draw a simple timeline of your life and mark moments when God acted at the right time, even if you didn’t understand it then.",
ora:"Lord, you make everything beautiful in its time. Teach me to trust your clock, even when it seems slow. Amen."},

{t:"When the result doesn’t come",ref:"Ps 34:2-9, 18-19",v:"The LORD is close to the brokenhearted, saves those whose spirit is crushed.",
exp:"David writes this psalm after escaping a great danger. He invites everyone to bless the Lord and tells how he sought God and was answered. And he declares that the Lord is close to the brokenhearted and saves those whose spirit is crushed.",
med:["There are days when the news comes and your heart sinks. On those days you don’t need to be strong or find beautiful words. You only need to know that God is close.","He isn’t close only to those who are doing well. He is especially close to the brokenhearted. Let yourself be comforted."],
perg:"How do I usually react when the result doesn’t come? Do I let God and my husband comfort me?",
des:"Agree with your husband on a “comfort ritual” for hard days: a long hug, a prayer together, a walk. Write down here what it will be.",
ora:"Lord, you are close to the brokenhearted. On sad days, hold me and give me strength to keep going. Amen."},

{t:"Tears are prayer too",ref:"Jn 11:32-36",v:"And Jesus wept.",
exp:"Lazarus, Jesus’ friend, has died. When Jesus arrives, Mary, Lazarus’ sister, falls at his feet weeping. Jesus is deeply moved and asks where they have laid him. And then Jesus weeps. The people say: see how he loved him!",
med:["It is the shortest verse in the Bible and one of the most comforting. Jesus, even knowing he would raise Lazarus, wept with those who wept.","Tears aren’t a lack of faith: they are the heart speaking to God without words. Jesus weeps with you."],
perg:"Do I allow myself to cry? Or do I think crying is a sign of weak faith?",
des:"Today, if the tears come, let them come before God, without guilt. Afterward, write down here what was in your heart.",
ora:"Jesus, who wept with Mary and Martha, weep with me too. Receive my tears as a prayer. Amen."},

{t:"Waiting together",ref:"Tb 8:4-8",v:"Send down your mercy on me and on her, and grant that we may grow old together.",
exp:"On their wedding night, Tobiah and Sarah get up and pray together. Tobiah blesses God, recalls the creation of Adam and Eve and asks God to have mercy on them both and let them grow old together. And they both say: Amen, amen.",
med:["Waiting can bring a couple closer or push them apart. Sometimes one suffers more, the other tries to fix things, and intimacy becomes nothing but trying. You need to care for the “us,” not only the dream.","Tobiah and Sarah began their marriage by praying together. Your love is your first family, and it deserves to be cared for, with or without children."],
perg:"How has the waiting affected my marriage? What do I need to care for in our “us”?",
des:"Pray together today the prayer of Tobiah and Sarah (Tb 8:5-8). Plan some time together that has nothing to do with the waiting.",
ora:"Lord, have mercy on us both. Unite us more and more in this waiting and let us grow old together in your love. Amen."},

{t:"Caring for my body with love",ref:"1 Cor 6:19-20",v:"your body is a temple of the holy Spirit within you … Therefore, glorify God in your body.",
exp:"Saint Paul reminds the Christians of Corinth that the body isn’t something unimportant: it is a temple of the Holy Spirit. We were bought at a great price, the blood of Christ. So the body, too, is a place to glorify God.",
med:["Your body isn’t an enemy or a defect. It is God’s temple, even when it doesn’t respond the way you would like.","Caring for your body with love (food, sleep, exercise, medical care) is an act of love and faith. Not out of pressure, but out of respect for the temple God has given you."],
perg:"How have I been looking at my body during this waiting: with tenderness or with anger?",
des:"Do something today to care for your body: a walk, a nourishing meal, going to bed earlier, scheduling an appointment you have put off. Thank God for your body.",
ora:"Lord, thank you for my body, temple of your Spirit. Teach me to care for it with love and not to see it as an enemy. Amen."},

{t:"When someone else announces a pregnancy",ref:"Rom 12:9-16",v:"Rejoice with those who rejoice, weep with those who weep.",
exp:"Saint Paul describes what love among Christians should look like: sincere, affectionate, generous. Among his advice, he asks us to rejoice with those who rejoice and weep with those who weep, living in harmony with one another.",
med:["One of the hardest moments when you are trying to conceive is hearing someone else’s pregnancy announcement: a friend, a sister, a coworker. Another person’s joy can hurt so much, and that doesn’t make you a bad person.","You can rejoice for her and, at the same time, feel your own pain. Both fit in your heart. Bring both to God."],
perg:"How do I feel when someone close to me announces a pregnancy? Do I bring it to God?",
des:"If someone close to you is pregnant, pray for her and her baby today. Then pray for yourself, handing over the pain that news brings. Write down both feelings here.",
ora:"Lord, give me a heart that rejoices in the joy of others, and hold my pain when it comes. Amen."},

{t:"No more guilt",ref:"Rom 8:1-2, 31-39",v:"now there is no condemnation for those who are in Christ Jesus.",
exp:"Saint Paul declares that, in Christ, there is no condemnation. Then he asks a series of questions: if God is for us, who can be against us? Who will separate us from the love of Christ? And he answers: nothing, not death, nor life, nor present things, nor future things.",
med:["Many women trying to conceive carry guilt: “Is this a punishment?” “Did I do something wrong?” “Did I wait too long?” Those questions weigh heavily, and they don’t come from God.","God doesn’t punish with infertility. He is on your side. And nothing, absolutely nothing, can separate you from his love."],
perg:"What guilt am I carrying about the waiting? Am I ready to give it to God?",
des:"Write the guilt you carry on a piece of paper. Read Rom 8:1 out loud and then tear up the paper. If you need to, bring this to Confession too.",
ora:"Lord, there is no condemnation for those who are in you. Take all guilt from me and let me rest in your love. Amen."},

{t:"Resting in God’s arms",ref:"Ps 131",v:"Rather, I have stilled my soul, Like a weaned child to its mother, weaned is my soul.",
exp:"It is a tiny psalm, just three verses. The psalmist says he doesn’t busy himself with things too great for him and has quieted his soul, like a weaned child resting in its mother’s lap. And he invites the people to hope in the Lord.",
med:["God wants to be for you what a mother is for her baby: arms to rest in, safety, rest. What a beautiful image for someone who longs so much to be a mother.","Today you don’t need to solve anything or understand anything. Just rest in God’s arms, like a child."],
perg:"What do I need to stop trying to solve so that I can rest in God?",
des:"Set aside 10 minutes of silence today. Lie down or sit comfortably and slowly repeat: “I rest in your arms, Lord.” That’s all.",
ora:"Lord, I quiet my soul in your arms. I don’t need to understand everything; I only want to rest in you. Amen."},

{t:"Mary, Mother of mothers",ref:"Jn 19:25-27",v:"Behold, your mother.",
exp:"At the foot of the cross, Jesus gives Mary to the beloved disciple as his mother, and the disciple to Mary as her son. From that hour, the disciple takes her into his home. The Church sees in this gesture Jesus giving Mary as the Mother of us all.",
med:["Our Lady is the mother of all mothers and of all who long to be mothers. She understands your heart like no one else.","You are not alone. You have a Mother in heaven who prays for you and with you, and who knows the value of every life."],
perg:"What request do I want to place in Our Lady’s hands today?",
des:"Pray a Rosary (or one decade) today asking for Our Lady’s intercession for your desire to be a mother.",
ora:"Mary, Mother of mothers, take my desire and present it to Jesus. Teach me to trust as you trusted. Amen."},

{t:"Saint Gerard Majella",ref:"Jas 5:13-18",v:"The fervent prayer of a righteous person is very powerful.",
exp:"Saint James teaches us to pray in every situation. He recalls the prophet Elijah, a man like us, who prayed earnestly that it would not rain, and it did not rain; then he prayed again, and the sky gave rain and the earth produced its fruit.",
med:["Saint Gerard Majella, an 18th-century Italian Redemptorist brother, is known as the patron of mothers and expectant mothers. Many women ask for his intercession while hoping for a child.","The prayer of the saints has power because they are united to God. We aren’t alone: we have friends in heaven praying for us."],
perg:"Do I ask for the intercession of the saints? Which saint is walking with me in this waiting?",
des:"Look up the prayer to Saint Gerard Majella and pray it today. If you like, begin a novena to him.",
ora:"Saint Gerard Majella, patron of mothers, intercede for me before God. May the Father’s will be fulfilled in me. Amen."},

{t:"Saint Gianna, a courageous mother",ref:"1 Jn 4:16-19",v:"There is no fear in love, but perfect love drives out fear",
exp:"Saint John says that God is love, and whoever remains in love remains in God. And he declares that there is no fear in love, because perfect love drives out fear. We love because God first loved us.",
med:["Saint Gianna Beretta Molla was a physician, wife and mother in 20th-century Italy. She deeply loved life, her family and her children, and she is an example of holiness lived day to day.","Fear often comes along with the waiting: fear of it never happening, fear of the tests, fear of the future. Saint Gianna teaches us to live the love that drives out fear."],
perg:"What fear has been walking alongside my waiting?",
des:"Read a little about Saint Gianna’s life. Write down one of your fears here and, next to it, today’s verse.",
ora:"Saint Gianna, intercede for me. Lord, may your love drive every fear from my heart. Amen."},

{t:"Trusting without understanding",ref:"Prv 3:5-8",v:"Trust in the LORD with all your heart, on your own intelligence do not rely…",
exp:"The Book of Proverbs advises us to trust God with our whole heart, and not only in what we are able to understand. In all our ways, we are to acknowledge God, and he will make our paths straight.",
med:["We want to understand: why me? Why now? How much longer? We won’t always have the answers.","Trusting without understanding is the hardest and most beautiful kind of faith. It isn’t switching off your mind, but recognizing that God sees farther than we do."],
perg:"What “why” have I not yet been able to give to God?",
des:"Write all your unanswered questions on a sheet of paper. At the end, write: “Lord, I trust you, even without understanding.”",
ora:"Lord, I don’t understand everything, but I trust you with all my heart. Make my paths straight. Amen."},

{t:"I am more than this waiting",ref:"Eph 2:4-10",v:"For we are his handiwork, created in Christ Jesus for the good works that God has prepared in advance",
exp:"Saint Paul reminds us that God, rich in mercy, gave us life in Christ, by pure grace and not by our own merit. And he says we are God’s handiwork, like a masterpiece, created for the good works he himself prepared for us.",
med:["Your worth doesn’t depend on whether or not you become a mother. You are God’s masterpiece right now, just as you are. The waiting is part of your story, but it isn’t your whole story.","God has prepared good works for you: at work, in your marriage, in your family, in the Church, in other people’s lives. Today, look at those too."],
perg:"What gifts and good works has God placed in my life beyond this waiting?",
des:"List five good things you are or do (qualities, talents, ways you serve). Do a good deed for someone today, as an expression of who you are.",
ora:"Lord, thank you that I am your handiwork. Help me see my worth in you and live the good works you prepared for me. Amen."},

{t:"Grateful for what I already have",ref:"1 Thes 5:16-18",v:"In all circumstances give thanks, for this is the will of God for you",
exp:"At the end of his letter, Saint Paul gives the community three short pieces of advice: rejoice always, pray without ceasing and give thanks in all circumstances. This is God’s will in Christ Jesus.",
med:["Gratitude doesn’t erase the desire, but it opens our eyes to what God has already given: a husband, a home, health, friends, faith. When the desire fills our whole view, we stop seeing the gifts around us.","Paul doesn’t say to give thanks for all circumstances, but in all of them. Even in the middle of waiting, there are reasons to give thanks."],
perg:"What gifts from God have I stopped seeing because of the waiting?",
des:"Write a list today of 10 things you are grateful for. Read it out loud as a prayer.",
ora:"Lord, thank you for everything you have already given me. Open my eyes to your gifts, even while I wait. Amen."},

{t:"Faith through tests and appointments",ref:"Ps 121",v:"My help comes from the LORD, the maker of heaven and earth.",
exp:"This psalm was prayed by pilgrims going up to Jerusalem. Looking at the mountains, they ask where their help will come from. And they answer: from the Lord, who neither slumbers nor sleeps, who guards our coming and our going.",
med:["Appointments, tests, treatments and waiting for results can be exhausting and full of anxiety. Faith and medicine don’t compete: God also works through the hands of doctors.","When you go to an appointment or a test, remember: your help comes from the Lord. He guards your coming and your going."],
perg:"How do I feel about appointments and tests? Do I give them to God?",
des:"Pray for the doctors and health professionals who are caring for you both. Before your next appointment or test, pray Psalm 121.",
ora:"Lord, my help comes from you. Guide the doctors, calm my heart and guard my coming and my going. Amen."},

{t:"A hope that does not disappoint",ref:"Rom 5:1-5",v:"hope does not disappoint, because the love of God has been poured out into our hearts through the holy Spirit that has been given to us.",
exp:"Saint Paul explains that, through Jesus, we have peace with God. And he says something surprising: affliction produces endurance, endurance produces proven character, and proven character produces hope. And that hope does not disappoint, because it rests on God’s love.",
med:["Christian hope isn’t just wishing something will happen. It is the certainty that God loves us and cares for us, whatever happens.","That is why it doesn’t disappoint: it rests on God’s love, not on results. Ask today for that deeper hope."],
perg:"Where is my hope resting: on the result or on God’s love?",
des:"Write a prayer asking God for a hope that doesn’t depend on results. Pray it tonight with your husband.",
ora:"God of hope, fill me with joy and peace in believing. May my hope rest on your love. Amen."},

{t:"God does not forget me",ref:"Is 49:14-16",v:"Can a mother forget her infant … Even should she forget, I will never forget you.",
exp:"The people of Israel, in exile, were saying that the Lord had forsaken and forgotten them. And God answers with the image of a mother: can a woman forget the baby at her breast? Even if she could, God will not forget. He says he has written them on the palms of his hands.",
med:["Your mother’s heart already exists. You already love someone who hasn’t arrived yet. God, who gave you that heart, also has a mother’s heart for you.","Your name is written on the palm of God’s hand. He doesn’t forget you, nor your desire."],
perg:"How do I feel knowing that my name is written on God’s hands?",
des:"Write your name on the palm of your hand (with a pen) and leave it there all day, remembering that God did the same with you.",
ora:"Lord, you do not forget me. You have written my name on your hands. Comfort my mother’s heart. Amen."},

{t:"Mary’s yes",ref:"Lk 1:26-38",v:"Behold, I am the handmaid of the Lord. May it be done to me according to your word.",
exp:"The angel Gabriel announces to Mary that she will be the Mother of the Son of God. Mary asks an honest question: how will this happen? The angel explains and reminds her that Elizabeth, who was called barren, is with child, because nothing is impossible for God. And Mary says her yes.",
med:["Mary’s yes wasn’t resignation, but active trust. She asked, understood what she could and gave herself completely.","Opening yourself to God’s will is saying: “I want this so much, Lord, but I want what you want for me even more.” It is a hard prayer, and a freeing one."],
perg:"Can I pray “your will be done” over my desire to be a mother?",
des:"Pray the Angelus today (or three Hail Marys), asking Mary for a heart open to God’s will.",
ora:"Mary, teach me your yes. I want this child so much, Lord, but I want your will even more. Let it be done to me. Amen."},

{t:"The child God already knows",ref:"Jer 1:4-5",v:"Before I formed you in the womb I knew you",
exp:"God calls young Jeremiah to be a prophet and tells him that he knew him even before he was formed in his mother’s womb. Before he was born, Jeremiah already had a place in God’s heart and plan.",
med:["God already knows the children who will come into your family, whether through pregnancy, adoption or as spiritual children. You can pray for them starting now.","Praying for the child who hasn’t come yet is a way of loving them starting now. Motherhood begins in the heart."],
perg:"What would I already like to say to the child who hasn’t come yet?",
des:"Write a letter to the child you are hoping for. Tell them about your love, your prayers and how much they are wanted. Keep it close to your heart.",
ora:"Lord, you already know the children who will come into our family. Bless them starting now and prepare our hearts to welcome them. Amen."},

{t:"Praying for other women who are waiting",ref:"Gal 6:1-2, 9-10",v:"Bear one another’s burdens, and so you will fulfill the law of Christ.",
exp:"Saint Paul asks Christians to help one another carry life’s burdens. And he encourages us: let us not grow tired of doing good, because in due time we will reap our harvest, if we do not give up.",
med:["Many women are living the same waiting, often in silence. Praying for them takes the focus off our own pain and unites us in a great chain of prayer.","Those who have lived this waiting understand another woman’s pain like no one else. Maybe God wants to use your story to comfort someone."],
perg:"Do I know other women who are living this same waiting? How can I support them?",
des:"Pray today, by name, for other women you know who are trying to conceive (or for all who are waiting, if you don’t know anyone). If it feels right, send one of them a kind message.",
ora:"Lord, I bring before you every woman who is hoping for a child. Comfort them, strengthen them and fulfill their desires according to your will. Amen."},

{t:"The peace that guards the heart",ref:"Phil 4:4-7",v:"the peace of God that surpasses all understanding will guard your hearts and minds in Christ Jesus.",
exp:"Saint Paul asks Christians to rejoice in the Lord always and to have no anxiety at all. Instead, they should bring everything to God in prayer, with thanksgiving. And he promises that the peace of God will guard their hearts and minds, the way a soldier guards a city.",
med:["God’s peace doesn’t depend on understanding everything or having everything settled. It surpasses understanding: it comes even when reason can find no grounds for it.","Ask today for that guarding peace. You don’t need to feel it; just ask, and let God work."],
perg:"What has been taking away my peace in this waiting?",
des:"Bring every worry to God in prayer today, one by one, and then give thanks for something. Write down here what you handed over.",
ora:"Lord, guard my heart and my mind with your peace, which surpasses all understanding. Amen."},

{t:"Renewing my surrender",ref:"Ps 62:2-9",v:"My soul rests in God alone, from whom comes my salvation.",
exp:"The psalmist, surrounded by difficulties, declares firmly that his soul finds rest in God alone. He is rock, salvation and fortress. And he invites everyone to trust in him at all times and pour out their hearts before him.",
med:["After 30 days, the waiting may continue, but you are not the same. You poured out your soul, cried, rested, trusted. God was in every step.","Renewing your surrender isn’t giving up on the dream; it is placing it once again in the right hands. In God alone does the soul find rest."],
perg:"What has changed in my heart over these 30 days? How do I want to keep walking?",
des:"Reread the letter you wrote on the first day. Write a new letter to God, renewing your surrender. If you like, start the plan over whenever you feel the need.",
ora:"Lord, in you alone my soul finds rest. I renew the surrender of my desire to be a mother. Your will be done, in your time. Amen."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="tentante30"){PLANOS[i].d=D;PLANOS[i].resumo="For women trying to conceive: a month to give this dream to God, calm your heart with each cycle and walk with women of the Bible who also waited. Each day brings a reading explained, a meditation, a space to write and a small challenge.";}}
})();

// Everyday prayers, Rosary and novenas (English, United States)
// Traditional prayers use the standard texts prayed in the United States.
// The Magnificat is the NABRE text (Lk 1:46-55). The other prayers were written for this app.
window.ORACOES = [
// ——— Traditional prayers
{id:"sinal",cat:"sempre",t:"Sign of the Cross",x:"In the name of the Father, and of the Son, and of the Holy Spirit. Amen."},
{id:"painosso",cat:"sempre",t:"Our Father",x:"Our Father, who art in heaven, hallowed be thy name; thy kingdom come, thy will be done on earth as it is in heaven.\nGive us this day our daily bread, and forgive us our trespasses, as we forgive those who trespass against us; and lead us not into temptation, but deliver us from evil. Amen."},
{id:"avemaria",cat:"sempre",t:"Hail Mary",x:"Hail Mary, full of grace, the Lord is with thee. Blessed art thou among women, and blessed is the fruit of thy womb, Jesus.\nHoly Mary, Mother of God, pray for us sinners, now and at the hour of our death. Amen."},
{id:"gloria",cat:"sempre",t:"Glory Be",x:"Glory be to the Father and to the Son and to the Holy Spirit,\nas it was in the beginning, is now, and ever shall be, world without end. Amen."},
{id:"creio",cat:"sempre",t:"Apostles’ Creed",x:"I believe in God, the Father almighty, Creator of heaven and earth, and in Jesus Christ, his only Son, our Lord, who was conceived by the Holy Spirit, born of the Virgin Mary, suffered under Pontius Pilate, was crucified, died and was buried; he descended into hell; on the third day he rose again from the dead; he ascended into heaven, and is seated at the right hand of God the Father almighty; from there he will come to judge the living and the dead.\nI believe in the Holy Spirit, the holy catholic Church, the communion of saints, the forgiveness of sins, the resurrection of the body, and life everlasting. Amen."},
{id:"omeujesus",cat:"sempre",t:"Fatima Prayer",x:"O my Jesus, forgive us our sins, save us from the fires of hell, lead all souls to heaven, especially those in most need of thy mercy."},
{id:"espirito",cat:"sempre",t:"Come, Holy Spirit",x:"Come, Holy Spirit, fill the hearts of your faithful and kindle in them the fire of your love.\nSend forth your Spirit and they shall be created. And you shall renew the face of the earth.\nLet us pray: O God, who by the light of the Holy Spirit did instruct the hearts of the faithful, grant that by the same Holy Spirit we may be truly wise and ever enjoy his consolations. Through Christ our Lord. Amen."},
{id:"contricao",cat:"sempre",t:"Act of Contrition",x:"My God, I am sorry for my sins with all my heart. In choosing to do wrong and failing to do good, I have sinned against you whom I should love above all things.\nI firmly intend, with your help, to do penance, to sin no more, and to avoid whatever leads me to sin. Our Savior Jesus Christ suffered and died for us. In his name, my God, have mercy. Amen."},
{id:"comunhao",cat:"sempre",t:"Spiritual Communion",nota:"St. Alphonsus Liguori",x:"My Jesus, I believe that You are present in the Most Holy Sacrament. I love You above all things, and I desire to receive You into my soul. Since I cannot at this moment receive You sacramentally, come at least spiritually into my heart.\nI embrace You as if You were already there and unite myself wholly to You. Never permit me to be separated from You. Amen."},
{id:"angelus",cat:"sempre",t:"The Angelus",nota:"Traditionally prayed at 6 a.m., noon and 6 p.m.",x:"The Angel of the Lord declared unto Mary,\nAnd she conceived of the Holy Spirit.\nHail Mary...\n\nBehold the handmaid of the Lord.\nBe it done unto me according to thy word.\nHail Mary...\n\nAnd the Word was made flesh,\nAnd dwelt among us.\nHail Mary...\n\nPray for us, O holy Mother of God,\nThat we may be made worthy of the promises of Christ.\n\nLet us pray: Pour forth, we beseech thee, O Lord, thy grace into our hearts; that we, to whom the Incarnation of Christ, thy Son, was made known by the message of an angel, may by his Passion and Cross be brought to the glory of his Resurrection. Through the same Christ our Lord. Amen."},

// ——— Our Lady
{id:"salve",cat:"maria",t:"Hail, Holy Queen",x:"Hail, holy Queen, Mother of mercy, our life, our sweetness and our hope. To thee do we cry, poor banished children of Eve. To thee do we send up our sighs, mourning and weeping in this valley of tears.\nTurn then, most gracious advocate, thine eyes of mercy toward us, and after this our exile, show unto us the blessed fruit of thy womb, Jesus. O clement, O loving, O sweet Virgin Mary.\nPray for us, O holy Mother of God, that we may be made worthy of the promises of Christ. Amen."},
{id:"minhasenhora",cat:"maria",t:"My Queen and My Mother",nota:"Consecration to Our Lady",x:"My Queen and my Mother, I give myself entirely to you; and to show my devotion to you, I consecrate to you this day my eyes, my ears, my mouth, my heart, my whole being without reserve.\nWherefore, good Mother, as I am your own, keep me, guard me, as your property and possession. Amen."},
{id:"lembrai",cat:"maria",t:"The Memorare",x:"Remember, O most gracious Virgin Mary, that never was it known that anyone who fled to thy protection, implored thy help, or sought thine intercession was left unaided.\nInspired by this confidence, I fly unto thee, O Virgin of virgins, my mother; to thee do I come, before thee I stand, sinful and sorrowful.\nO Mother of the Word Incarnate, despise not my petitions, but in thy mercy hear and answer me. Amen."},
{id:"magnificat",cat:"maria",t:"The Magnificat (Canticle of Mary)",nota:"Lk 1:46-55",x:"My soul proclaims the greatness of the Lord;\nmy spirit rejoices in God my savior.\nFor he has looked upon his handmaid’s lowliness;\nbehold, from now on will all ages call me blessed.\nThe Mighty One has done great things for me,\nand holy is his name.\nHis mercy is from age to age\nto those who fear him.\nHe has shown might with his arm,\ndispersed the arrogant of mind and heart.\nHe has thrown down the rulers from their thrones\nbut lifted up the lowly.\nThe hungry he has filled with good things;\nthe rich he has sent away empty.\nHe has helped Israel his servant,\nremembering his mercy,\naccording to his promise to our fathers,\nto Abraham and to his descendants forever."},
{id:"concebida",cat:"maria",t:"O Mary, Conceived Without Sin",nota:"Miraculous Medal prayer",x:"O Mary, conceived without sin, pray for us who have recourse to thee."},
{id:"maecansada",cat:"maria",t:"A Mother’s Prayer to Our Mother",nota:"For the hard days",x:"Our Lady, you were a mother too. You know the sleepless nights, the worries and the heavy heart.\nToday I come to you as your daughter. Take my hand and walk with me. Watch over my children when I’m not near, bring calm to my home and teach me your patience and your tenderness.\nMay I keep the things of God in my heart, just as you did. Amen."},

// ——— For the family
{id:"sagradafamilia",cat:"familia",t:"Prayer to the Holy Family",x:"Jesus, Mary and Joseph, you who lived the simple love of every day in Nazareth, look upon our family.\nMake our home a little church: a place of prayer, of a shared table and of forgiveness.\nKeep us from quarrels, coldness and division. Heal those who are hurting and bring close those who are far away.\nMay our home be filled with the peace, the joy and the faith that filled yours. Jesus, Mary and Joseph, pray for us. Amen."},
{id:"consagracaolar",cat:"familia",t:"Consecration of the Home to the Holy Family",nota:"To pray with the whole family together",x:"Jesus, Mary and Joseph, today we consecrate to you our home and everyone who lives in it.\nJesus, be the center of our home: of our conversations, our meals, our work and our rest.\nMary, care for us as you cared for the home in Nazareth. Teach us tenderness, patience and prayer.\nSt. Joseph, protect this family, guard our door and sustain our work.\nMay this home be a place of peace, forgiveness and joy. From this day on, it belongs to you. Amen."},
{id:"pelosfilhos",cat:"familia",t:"A Mother’s Blessing for Her Children",x:"Lord, I bring my children before you (say each one’s name).\nYou knew them before I did, and you love them even more than I do. Place your hand upon them.\nProtect their bodies from every danger, their hearts from every sadness and their souls from every evil.\nGive them good friends, wisdom in their studies and a heart that loves you.\nMay their Guardian Angel walk beside them today and always. I place them in your hands and in the arms of Our Lady. Amen."},
{id:"peloesposo",cat:"familia",t:"Prayer for My Husband",x:"Lord, thank you for the man you placed at my side.\nBless his health, his work and his decisions. Give him strength on hard days and peace in his heart.\nDraw him ever closer to you, and make him a husband and father after your own heart.\nUnite us in love, respect and forgiveness. May our marriage be a sign of your love.\nSt. Joseph, pray for him. Amen."},
{id:"bencaocasa",cat:"familia",t:"Blessing of the Home",nota:"To pray as you walk through each room",x:"Lord, bless this home and everyone who lives here.\nMay only good things come through this door. May this living room be full of conversation and joy. May this kitchen never lack bread or gratitude. May these bedrooms be places of rest and peace.\nKeep far from here all discord, all sickness and all evil.\nMay this home be your dwelling place, Lord. Amen."},
{id:"gestante",cat:"familia",t:"Prayer During Pregnancy",x:"Lord of life, thank you for the baby growing within me.\nKeep my baby safe through every day of this pregnancy, form every part of this little one with your love, and prepare my heart to welcome them.\nOur Lady of Happy Delivery, stay with me until the day of birth and cover us both with your mantle. Amen."},
{id:"desejomae",cat:"familia",t:"Prayer of a Woman Longing to Be a Mother",nota:"For those who are trying to conceive",x:"Lord, God of life, you know my heart’s desire to become a mother.\nI place it in your hands, with everything I feel: the hope, the anxiety and the tears of each month of waiting.\nCalm my heart, strengthen my marriage and care for my body. Give me peace to live one day at a time, and trust in your timing.\nOur Lady, St. Anne and St. Joachim, St. Elizabeth and St. Gerard Majella, pray with me.\nYour will be done, Lord, and may I never forget that I am your beloved daughter. Amen."},
{id:"longe",cat:"familia",t:"For Someone Who Is Far from the Faith",x:"Father of mercy, I bring before you (say the name), who is far from you.\nYou never give up on anyone. Go out to meet them as the father ran to meet his son coming home.\nTouch their heart in the way only you know how, place good people in their path, and give me patience and love to wait for your timing.\nSt. Monica, who prayed so many years for her son, pray for us. Amen."},

// ——— Every day
{id:"manha",cat:"dia",t:"Morning Prayer",x:"Good morning, Lord! Thank you for another day.\nI offer you everything I will do, think and feel today: my work, my household tasks, caring for my family, the joys and the tiredness.\nGuide my steps, guard my words and give me patience and joy.\nOur Lady, hold my hand all through this day. Amen."},
{id:"noite",cat:"dia",t:"Night Prayer",x:"Lord, thank you for this day, for what went well and for what didn’t.\nForgive me for the times I failed to love, and help me to forgive as well.\nI place in your hands my family, my worries and tomorrow.\nWatch over our sleep and our home tonight. Holy Angel, keep watch over us. Amen."},
{id:"antesrefeicao",cat:"dia",t:"Grace Before Meals",x:"Bless us, O Lord, and these thy gifts, which we are about to receive from thy bounty. Through Christ our Lord. Amen."},
{id:"depoisrefeicao",cat:"dia",t:"Grace After Meals",x:"We give thee thanks, almighty God, for all thy benefits, who livest and reignest forever and ever. Amen."},
{id:"entrega",cat:"dia",t:"Prayer of Surrender (for Anxious Days)",x:"Jesus, I can’t carry everything on my own. Today I place in your hands (say what is worrying you).\nI won’t keep holding on to what is yours. You know what is best, and you take care of every detail.\nCalm my breathing, my thoughts and my heart.\nJesus, I trust in you. Jesus, I trust in you. Jesus, I trust in you. Amen."},
{id:"trabalho",cat:"dia",t:"For Our Work and Our Daily Bread",x:"Lord, who worked as a carpenter in Nazareth, bless the work of this family.\nGive us health to work, wisdom to care for what we have received and generosity to share.\nProvide what we are lacking and free us from excessive worry. We trust in your providence.\nSt. Joseph the Worker, pray for us. Amen."},
{id:"cansada",cat:"dia",t:"A Tired Mother’s Prayer",x:"Lord, I am tired today. You know my body, my mind and my heart.\nI’m not asking to be perfect, I’m asking not to be alone.\nGive me rest wherever there is a pause, patience wherever there is a tantrum, and tenderness wherever there is a rush.\nThank you, because your love for me doesn’t depend on how much I get done. Amen."},

// ——— Saints and angels
