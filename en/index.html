for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="advento24"){PLANOS[i].d=D;PLANOS[i].ini="2026-11-29";PLANOS[i].resumo="One day for every day of Advent, from November 29 to Christmas Eve, following the Church’s readings: the reading of the day explained, a meditation, a question for your heart, a family challenge and a prayer.";}}
})();

// 30 days praying for my marriage: full version (reading, explanation, meditation, question, challenge, prayer)
(function(){
var D=[
{t:"Giving my marriage to God",ref:"Eccl 4:9-12",v:"A three-ply cord is not easily broken.",
exp:"The wise Qoheleth looks at life and concludes that two are better than one. If one falls, the other helps him up; if it is cold, the two keep each other warm; if someone attacks, the two resist together. And he ends with an image: a cord of three strands is much harder to break.",
med:["In the Christian tradition, those three strands are the husband, the wife and God. A marriage with only two strands may hold, but any strong pull puts it at risk. When God is the third strand, the couple receives a strength that doesn’t come from themselves.","Giving your marriage to God doesn’t mean giving up on fighting for it. It means recognizing that you don’t have to carry the weight of making everything work all by yourself. Over these 30 days, you will weave that third strand, one day at a time."],
perg:"What have I been trying to fix on my own in my marriage that I need to give to God?",
des:"Write on a sheet of paper: “Lord, our marriage is yours.” Add today’s date and keep it inside your Bible or your planner. Tonight, pray for him in silence while he sleeps or before you both go to sleep.",
ora:"Lord, I give you my marriage. Be the third strand that unites us and holds us up when we are weak. Amen."},

{t:"Grateful for my husband",ref:"Phil 1:3-11",v:"I give thanks to my God at every remembrance of you",
exp:"Saint Paul writes from prison to the community in Philippi. Even in chains, he begins his letter by giving thanks: every time he remembers them, he thanks God with joy. And he prays that their love may keep growing, in knowledge and in every kind of perception.",
med:["Routine has a curious effect: over time, we notice what is missing more than what is there. The wet towel on the bed stands out more than all the work he does to support the family.","Gratitude is an exercise in seeing. When we give thanks, our eyes get used to seeing the good again. And our heart softens. Today, do what Paul did: remember your husband and thank God for him."],
perg:"What qualities in my husband have I stopped seeing over time?",
des:"Write down three things you are grateful for in your husband. Pick one and tell him today, simply: “Thank you for...” A text message is fine if that feels easier.",
ora:"Lord, thank you for the husband you placed at my side. Open my eyes to the good in him and make our love grow. Amen."},

{t:"Learning to listen",ref:"Jas 1:19-26",v:"everyone should be quick to hear, slow to speak, slow to wrath",
exp:"Saint James gives very practical advice: be quick to listen, slow to speak and even slower to get angry. And he reminds us that hearing the Word of God is not enough: we must put it into practice. Whoever doesn’t control the tongue, he says, deceives his own heart.",
med:["Many arguments in marriage begin with not listening all the way to the end. While the other is speaking, we are already preparing our answer. Truly listening is an act of love: it tells the other person, “You matter to me.”","Men often talk less and in other ways: in the car, while fixing something, in a quick comment. Learning to listen to your husband also means learning how he opens up."],
perg:"When was the last time I listened to my husband all the way to the end, without interrupting or correcting him?",
des:"Today, ask your husband a question about his day or about something he enjoys, and listen carefully, with no phone in your hand and without interrupting. Afterward, just say: “Thank you for telling me.”",
ora:"Holy Spirit, teach me to listen with my heart. Set a guard over my mouth and patience in my answers. Amen."},

{t:"The forgiveness that sets us free",ref:"Col 3:12-17",v:"bearing with one another and forgiving one another … as the Lord has forgiven you, so must you also do.",
exp:"Saint Paul describes the “clothing” of a Christian: compassion, kindness, humility, gentleness and patience. Over all of these, love, which binds everything together in perfect harmony. And he asks us to forgive one another, just as the Lord has forgiven us.",
med:["Forgiving doesn’t mean pretending nothing happened or that the hurt didn’t hurt. It means deciding to stop collecting the debt. It means releasing the other person from our prison, and the first one to walk out free is us.","In marriage, small hurts that go unforgiven pile up like dust on a piece of furniture. One day, no one remembers the original color. Today’s forgiveness wipes away the dust before it hardens."],
perg:"What hurt from my husband am I still holding in my heart? Am I ready to give it to God?",
des:"Write on a piece of paper a hurt you are holding on to. Pray: “Lord, I choose to forgive.” Then tear up the paper. If it is something that needs a conversation, ask God for the right moment and the right words.",
ora:"Lord, you always forgive me. Give me the grace to forgive my husband as you forgive me. Heal what has been wounded between us. Amen."},

{t:"Patience, a fruit of the Spirit",ref:"Gal 5:16-26",v:"the fruit of the Spirit is love, joy, peace, patience, kindness, generosity, faithfulness, gentleness, self-control.",
exp:"Saint Paul compares two ways of living: according to the flesh, which brings quarrels, jealousy, fits of rage and division; and according to the Spirit, which bears fruit. Patience appears on the list as a fruit: not something we produce by force, but something that grows in us when we let God work.",
med:["No one changes overnight, not me and not him. Patience is love that knows how to wait for the other person’s timing, the way a farmer waits for the fruit to ripen.","When your patience runs out today, instead of exploding, say a tiny prayer: “Holy Spirit, give me your fruit.” Fruit can’t be forced: it is cultivated, with time and prayer."],
perg:"In what situation with my husband does my patience usually run out first?",
des:"Pick one of his habits that annoys you and decide not to say a word about it all day today. Every time you notice it, pray for him in silence.",
ora:"Holy Spirit, make the fruit of patience grow in me. May I wait for my husband’s timing the way you wait for mine. Amen."},

{t:"His health",ref:"Jas 5:13-16",v:"the prayer of faith will save the sick person, and the Lord will raise him up.",
exp:"Saint James teaches the community to pray in every situation: in sorrow, in joy and in sickness. When someone is sick, they should call the presbyters to pray over them and anoint them with oil in the name of the Lord. This is the origin of the Sacrament of the Anointing of the Sick. And he concludes: the prayer of a righteous person is very powerful.",
med:["Caring for your husband’s health is also a way of loving him: body, mind and soul. Many men carry tiredness, worries and pain in silence, because they learned they aren’t allowed to look weak.","Your prayer is the first form of care. But love also shows up in simple gestures: lovingly insisting that he get that checkup, cooking something healthy, letting him rest."],
perg:"What tiredness, pain or worry has my husband been carrying in silence?",
des:"Tonight, place your hand on your husband’s shoulder or head (even while he sleeps) and pray for the health of his body, mind and soul. If there is a checkup or doctor’s appointment he has been putting off, offer to help schedule it.",
ora:"Lord Jesus, physician of souls and bodies, take care of my husband’s health. Give him strength, rest and peace. Amen."},

{t:"The work of each day",ref:"Ps 90:12-17",v:"May the favor of the Lord our God be ours. Prosper the work of our hands!",
exp:"The psalmist recognizes that life is short and asks God for the wisdom to number our days well. At the end, he makes a beautiful request: that God bless and prosper the work of our hands, so that it has meaning and lasts.",
med:["Work is part of each person’s calling. Your husband often faces pressure, difficult bosses, fear of losing his job or of not being able to pay the bills. He doesn’t always talk about it.","Praying for his work is holding up the house on your knees. And valuing his effort with a word of appreciation renews any man’s strength."],
perg:"What do I know about my husband’s worries at work? Have I asked him how he is doing?",
des:"Send your husband a text in the middle of the day saying you are praying for him and his work. Tonight, thank him for everything he does for the family.",
ora:"Lord, bless my husband’s work. Give him wisdom, peace in his decisions and fruit for his effort. Prosper the work of his hands. Amen."},

{t:"My husband’s faith",ref:"Eph 3:14-21",v:"that Christ may dwell in your hearts through faith; that you, rooted and grounded in love",
exp:"Saint Paul kneels before the Father and prays for the community: that they be strengthened by the Spirit, that Christ may dwell in their hearts and that they may know the love of Christ, which surpasses all knowledge. He ends by praising God, who can do far more than all we ask or imagine.",
med:["Each person has their own timing and their own path with God. Maybe your husband prays more than you do; maybe he is still far away. Your mission is not to pressure or preach: it is to pray and to love.","Saint Monica prayed for years for the conversion of her husband and of her son, Saint Augustine. A wife’s patient prayer prepares the ground with love, and God can do much more than we imagine."],
perg:"How is my husband’s faith today? What can I ask God for him, without pressuring him?",
des:"Today, pray Saint Paul’s prayer (Eph 3:14-21) for him, putting his name in the place of “you.” If he is open to it, gently invite him to go to Mass together next Sunday.",
ora:"Lord, may Christ dwell in my husband’s heart. Root him in your love and do far more than I know how to ask. Saint Monica, pray for us. Amen."},

{t:"Protection in temptation",ref:"Mt 26:36-41",v:"Watch and pray that you may not undergo the test. The spirit is willing, but the flesh is weak.",
exp:"In Gethsemane, before his Passion, Jesus goes to pray and asks Peter, James and John to stay with him. He prays in anguish, but when he returns he finds the disciples asleep. Then he asks them to watch and pray, because all of us are weak.",
med:["We are all fragile. There are temptations that circle every marriage: indifference, pornography, addiction, comparison, a friendship that goes too far. No one is immune, not him and not you.","A wife’s prayer is a shield for her husband. And a couple also protects itself through choices: transparency, time together, care with what comes in through the phone and the TV."],
perg:"What temptation or danger most threatens our marriage today? And me?",
des:"Today, pray the Saint Michael prayer for your husband and your marriage. If needed, choose one concrete step of protection for yourself (an app, a conversation, a habit).",
ora:"Saint Michael the Archangel, defend our marriage in battle. Lord, protect my husband and me from every temptation and every evil. Amen."},

{t:"One flesh",ref:"Mk 10:6-9",v:"So they are no longer two but one flesh. Therefore what God has joined together, no human being must separate.",
exp:"The Pharisees ask Jesus whether a husband may divorce his wife. Jesus goes back to the beginning of creation: God made them male and female, and the two become one flesh. Marriage is not a contract that falls apart when we get tired: it is a union made by God.",
med:["Being one doesn’t mean thinking alike about everything or liking the same things. It means walking in the same direction, even with different personalities. It means saying “we” more than “I.”","Unity is built in small “we’s”: “let’s solve it together,” “our family,” “our money,” “our dream.” Every time we say “we,” we add one more stitch to God’s seam."],
perg:"In what area of our marriage are we living more as “two” than as “one”?",
des:"Today, suggest to your husband that you do something together that you usually do separately: cleaning up the kitchen, grocery shopping, taking the kids somewhere, going for a walk. Afterward, thank him for his company.",
ora:"Lord, let no one separate what you have joined. Make us one flesh, one heart, one direction. Amen."},

{t:"Honoring each other",ref:"Rom 12:9-13",v:"love one another with mutual affection; anticipate one another in showing honor.",
exp:"Saint Paul describes what true love looks like: sincere, hating what is evil and holding on to what is good. And he gives surprising advice: compete to see who can honor the other more. Rejoice in hope, endure in affliction and persevere in prayer.",
med:["To honor is to value the other person in public and in private. A compliment about your husband in front of the kids is worth gold, and criticism in front of them cuts deep.","Many men feel little admiration at home. When a wife recognizes her husband’s worth, he grows. Honor is like water for a plant: it makes the best in him bloom."],
perg:"How have I been talking about my husband to the kids, to family and to my friends?",
des:"Today, praise your husband in front of the kids or a family member for something specific. And if you tend to complain about him to someone, decide not to do it this week.",
ora:"Lord, teach me to honor my husband with my words and actions. May our home be a place of respect and admiration. Amen."},

{t:"A time to laugh",ref:"Eccl 3:1-8",v:"A time to weep, and a time to laugh; a time to mourn, and a time to dance.",
exp:"Qoheleth writes a famous poem: there is a time for everything under heaven. A time to plant and a time to harvest, a time to weep and a time to laugh, a time to be silent and a time to speak. Life has seasons, and each one has its value.",
med:["Marriages need laughter too. When routine gets heavy, conversations turn into nothing but bills, problems and chores. Lightheartedness protects love and reminds you why you chose each other.","The Book of Proverbs says that a joyful heart is good medicine (Prv 17:22). May today be a time to laugh, even if the season is a hard one."],
perg:"When was the last time my husband and I really laughed together?",
des:"Remember together a funny story from when you were dating or newly married. Or look through old photos. If you can, plan a lighthearted surprise: his favorite meal, a comedy movie.",
ora:"Lord, bring joy back into our home. May we know how to laugh together, even on hard days. Amen."},

{t:"Our family finances",ref:"Mt 6:25-34",v:"But seek first the kingdom of God and his righteousness, and all these things will be given you besides.",
exp:"In the Sermon on the Mount, Jesus speaks about anxiety over food, drink and clothing. He points to the birds of the sky and the wild flowers: the Father takes care of them. And he concludes: don’t worry about tomorrow; seek first the Kingdom and the rest will be given to you.",
med:["Money is one of the biggest causes of conflict in marriage: hidden debts, different spending habits, fear of the future. Jesus doesn’t ask us to be irresponsible; he asks for trust and the right priorities.","When a couple places their finances before God and talks openly, money stops being a reason to fight and becomes a reason for unity and sharing."],
perg:"How do my husband and I talk about money? Is there something I hide or that keeps me anxious?",
des:"Suggest to your husband a calm conversation about the family finances, without accusations, beginning with a prayer. If that conversation isn’t possible yet, write down your worries and give them to God.",
ora:"Father, you care for the birds and the flowers of the field. Take care of our home too. Give us wisdom, transparency and trust in you. Amen."},

{t:"Affection and intimacy",ref:"Sg 8:6-7",v:"Deep waters cannot quench love, nor rivers sweep it away.",
exp:"The Song of Songs is a love poem between a bridegroom and a bride. The Church also sees in it God’s love for his people. At the end, the beloved asks to be set as a seal upon his heart, because love is strong as death.",
med:["Affection is God’s language within marriage. A couple’s intimacy, in all its forms, is sacred and blessed by him. It is not something of lesser value in a life of faith.","With kids, bills and exhaustion, touch slowly disappears. Small gestures keep the flame alive: a long hug, holding hands, a real kiss goodbye. The deep waters of everyday life don’t have to quench love."],
perg:"What gestures of affection have slowly disappeared from our routine?",
des:"Today, give your husband a long hug, at least 20 seconds, for no special reason. Say goodbye and welcome him home with a real kiss.",
ora:"Lord, you blessed the love between a man and a woman. Rekindle affection and tenderness between us. Set us as a seal on each other’s hearts. Amen."},

{t:"Deciding together",ref:"Phil 2:1-5",v:"of the same mind, with the same love, united in heart, thinking one thing.",
exp:"Saint Paul asks the community to live in unity: that no one act out of rivalry or vanity, and that each one look not only to his own interests but also to those of others. And he gives the model: have the same attitude as Christ Jesus.",
med:["Deciding together takes work. It requires conversation and sometimes letting go. But it builds trust. When one person always decides alone, the other feels left out, and when everything is imposed, rivalry is born.","Having the attitude of Christ means seeking what is good for both of you, not winning the argument."],
perg:"What important decision is pending between us? Have I been listening to what he thinks?",
des:"Pick something simple to decide together today (the weekend menu, an outing, a purchase). Before giving your opinion, ask for his and listen.",
ora:"Lord, give us one mind and one heart. May we make our decisions together, with you in our midst. Amen."},

{t:"The father of my children",ref:"Ps 103:8-14",v:"As a father has compassion on his children, so the LORD has compassion on those who fear him.",
exp:"The psalm sings of God’s goodness: he is gracious and merciful, slow to anger and abounding in love. He does not treat us according to our sins. And it compares his love to that of a father who has compassion on his children, because he knows what we are made of.",
med:["Your husband is also learning to be a father, often without having had a good example. He makes mistakes, just as you do as a mother. God looks on both of you with compassion.","When a mother supports the father in front of the kids, his authority grows and the children feel safe. And when you pray for him as a father, God shapes him in fatherly love. If you don’t have children yet, pray for the father he will be."],
perg:"How have I been supporting my husband as a father? Do I correct him in front of the kids?",
des:"Today, tell your husband one thing you admire in him as a father (or will admire). Ask the kids to make him a little note or a drawing.",
ora:"Heavenly Father, teach my husband to be a father as you are: firm, patient and full of love. Bless his relationship with our children. Amen."},

{t:"Clothed in humility",ref:"1 Pt 5:5-7",v:"And all of you, clothe yourselves with humility in your dealings with one another … Cast all your worries upon him because he cares for you.",
exp:"Saint Peter asks Christians to clothe themselves with humility, because God opposes the proud but gives grace to the humble. Whoever humbles himself under God’s hand will be exalted in due time. And he ends with a consolation: hand him your worries, because he cares for you.",
med:["Always needing to be right wears a marriage out. Humility is being able to say “you’re right,” “I was wrong,” “I’m sorry” and also “I don’t know.”","Humility isn’t making yourself small or accepting disrespect. It is setting aside the pride that turns every conversation into a contest. God gives grace to those who make themselves little."],
perg:"On what topic do I always need to have the last word with my husband?",
des:"Today, acknowledge out loud, at least once, that he is right about something. If you were wrong recently, apologize simply, with no “but.”",
ora:"Lord, clothe me in humility. Take from me the pride that wounds our love, and give me your grace. Amen."},

{t:"Words that build up",ref:"Eph 4:25-32",v:"No foul language should come out of your mouths, but only such as is good for needed edification",
exp:"Saint Paul asks Christians to put away falsehood, not to let the sun set on their anger and not to leave room for the devil. Only words that build up and do good to those who hear them should come out of their mouths. And he concludes: be kind and compassionate to one another, forgiving one another.",
med:["Words build a home up or tear it down. A sentence spoken in anger can stay in the other person’s heart for years. And so can a sincere compliment.","Notice your tone of voice today, the sarcasm, the comparisons. Before you speak, ask yourself: will what I’m about to say build him up?"],
perg:"What word or tone of mine has been hurting my husband, even without my realizing it?",
des:"Today, do a “criticism fast”: no criticism, sarcasm or complaints toward your husband all day. Swap each one for a kind word.",
ora:"Lord, set a guard over my mouth. May my words build up my husband and our home. Amen."},

{t:"God is doing something new",ref:"Is 43:16-21",v:"Remember not the events of the past, the things of long ago consider not; … See, I am doing something new! Now it springs forth, do you not perceive it?",
exp:"God reminds his people that he opened a way through the sea and freed Israel from Egypt. But he asks them not to stay stuck in the past. He is about to do something new: make a way in the desert and rivers in the dry land.",
med:["Every marriage has old wounds: words spoken, betrayals, disappointments, hard years. Sometimes we live looking back, holding the past against each other.","God specializes in new beginnings. He doesn’t erase our history, but he heals it and makes something new spring up. Ask him for eyes to see the new thing already springing up between you."],
perg:"What wound from the past still weighs on our marriage? Am I willing to let God heal it?",
des:"Write a letter to God, handing over a wound from your marriage’s past. You don’t have to show it to anyone. At the end, write: “Lord, do something new.” If the wound is very deep, consider seeking help from a priest or a counselor.",
ora:"Lord, you make all things new. Heal the wounds of our past and make something new spring up in our marriage. Amen."},

{t:"Praying as a couple",ref:"Mt 18:19-20",v:"For where two or three are gathered together in my name, there am I in the midst of them.",
exp:"Jesus makes a promise: if two on earth agree about anything they ask for, the Father in heaven will grant it. And where two or three are gathered in his name, he is there in their midst.",
med:["A couple’s prayer has a special strength: it is the prayer of a “domestic church.” But many Catholic couples have never prayed together, out of shyness or simply lack of habit.","It can be very simple: an Our Father holding hands before bed, a blessing before a meal. What matters isn’t praying beautifully; it is praying together."],
perg:"Have my husband and I ever prayed together? What holds us back?",
des:"Invite your husband to pray an Our Father together before bed, holding hands. If he doesn’t want to yet, pray quietly beside him, without pressuring him.",
ora:"Jesus, you promised to be in our midst. Come and dwell in our prayer as a couple, and make our home a little church. Amen."},

{t:"Serving with love",ref:"Jn 13:1-15",v:"If I, therefore, the master and teacher, have washed your feet, you ought to wash one another’s feet.",
exp:"At the Last Supper, Jesus gets up, takes off his outer garment, picks up a towel and washes the disciples’ feet, the work of a servant. Peter doesn’t want to accept it. Jesus explains that he has given them an example: as he has done, so we should do for one another.",
med:["Serving doesn’t make us less. Jesus, the Lord, knelt down. In marriage, serving is the most concrete language of love, but it only has value when it is freely given, not a demand or a bargaining chip.","We often serve while complaining, or while keeping score. Today, serve in secret, like Jesus: without expecting praise."],
perg:"Do I serve my husband with joy or with resentment? What does he most appreciate that I do for him?",
des:"Today, do something your husband loves without his asking and without mentioning it afterward: coffee the way he likes it, his clothes laid out, a special dish, a sweet note in his lunch.",
ora:"Jesus, who washed the feet of your friends, teach me to serve my husband with joy and humility. Amen."},

{t:"Resting together",ref:"Mk 6:30-32",v:"Come away by yourselves to a deserted place and rest a while.",
exp:"The apostles come back from their mission and tell Jesus everything they have done. So many people are coming and going that they don’t even have time to eat. So Jesus invites them to a quiet place, alone with him, to rest.",
med:["Jesus cared about his friends’ tiredness. A couple also needs to pause: time for just the two of you, without kids, chores or phones. That isn’t selfish; it is an investment in your love.","Many couples only talk about problems and logistics. Resting together reminds you that, before anything else, you are a couple who loves each other."],
perg:"When was the last time my husband and I spent time together just to be together, with nothing to get done?",
des:"Plan a time of rest for the two of you this week: a coffee, a walk, a movie after the kids are asleep. Turn off your phones during that time.",
ora:"Jesus, call us to rest with you. Renew our love in moments of rest and of joy together. Amen."},

{t:"True friends",ref:"Jn 15:12-17",v:"I no longer call you slaves … I have called you friends",
exp:"At the Last Supper, Jesus leaves us his commandment: love one another as I have loved you. And he says there is no greater love than to lay down one’s life for one’s friends. He calls the disciples friends, because he has told them everything he heard from the Father.",
med:["Marriage is the deepest friendship there is. Friends support each other when they fall, share secrets, cheer each other on and enjoy being together.","Over time, some couples become business partners in running the house and stop being friends. Today, win back the friendship: take an interest in what he enjoys, and share what is in your heart."],
perg:"Am I my husband’s friend? What does he enjoy doing that I could share with him?",
des:"Ask your husband about something he enjoys (a team, a hobby, a dream) and show real interest. Tell him something about yourself that you haven’t been sharing.",
ora:"Jesus, faithful friend, make us true friends who support each other, listen to each other and love walking together. Amen."},

{t:"Faithful in the little things",ref:"Hos 2:16-22",v:"I will betroth you to me forever: I will betroth you to me with justice and with judgment, with loyalty and with compassion",
exp:"The prophet Hosea uses his own story, with an unfaithful wife, to speak about God’s love for his people. Even when betrayed, God doesn’t give up: he leads his people into the desert, speaks to their heart and renews the covenant forever, with faithfulness.",
med:["God’s faithfulness is the model for ours. It isn’t only not cheating: it is giving yourself completely, every day, in the details. In how you look, in your conversations, your friendships, your phone, your thoughts.","Faithfulness also means keeping the little promises: arriving at the agreed time, doing what you said you would do, keeping the other person’s confidences."],
perg:"In what small details can I be more faithful to my husband?",
des:"Pray today for the faithfulness of you both. Choose a small promise to your husband that you haven’t kept, and keep it today.",
ora:"Lord, you are faithful forever. Guard our faithfulness in love and tenderness, in big things and in little ones. Amen."},

{t:"Peace in our disagreements",ref:"Mt 5:21-24",v:"go first and be reconciled with your brother, and then come and offer your gift.",
exp:"In the Sermon on the Mount, Jesus teaches that it isn’t enough not to kill: anger and contemptuous words also wound. If you are bringing your gift to the altar and remember that someone has something against you, leave your gift and go first to make peace.",
med:["Disagreeing is normal and even healthy. What hurts is how we argue: yelling, contempt, a silence meant to punish, going to bed angry. Saint Paul also asks us not to let the sun set on our anger (Eph 4:26).","Jesus places reconciliation even above the offering at the altar. For God, peace between the two of you matters more than many prayers said with a closed heart."],
perg:"How do I usually act in an argument? Is there something unresolved between us that needs peace?",
des:"If something is unresolved, take the first step toward reconciliation today. Agree on a “peace rule”: never go to sleep without making up, even if it’s just “I love you; let’s talk tomorrow.”",
ora:"Jesus, Prince of Peace, teach us to disagree without wounding and to make peace before the sun goes down. Amen."},

{t:"Dreaming together",ref:"Prv 16:1-9",v:"Entrust your works to the LORD, and your plans will succeed.",
exp:"The Book of Proverbs gathers words of wisdom. This passage reminds us that people make plans, but it is the Lord who directs their steps. Whoever entrusts their work to God sees their plans succeed.",
med:["Couples who dream together walk in the same direction. Dreams can be big (a house, children, a move) or small (a trip, a dinner out, learning something together).","God likes to be part of our plans. When a couple dreams in his presence, the dreams become purer and the journey lighter."],
perg:"What dreams do my husband and I share? Has any of them been forgotten along the way?",
des:"Talk today about three dreams for the coming years. Write them down together on a sheet of paper and pray, entrusting them to God.",
ora:"Lord, we entrust our dreams and plans to you. Direct our steps and help us walk together in your will. Amen."},

{t:"His family and mine",ref:"Ru 1:14-18",v:"Wherever you go I will go, wherever you lodge I will lodge. Your people shall be my people and your God, my God.",
exp:"Naomi has lost her husband and her sons and decides to return to her homeland. She tells her daughters-in-law to go back to their own families. One leaves, but Ruth stays: she clings to her mother-in-law and promises to follow her wherever she goes. Ruth becomes the great-grandmother of King David.",
med:["In-laws, siblings-in-law, families with different customs: many tensions in marriage come from there. Ruth’s story shows that it is possible to love the other person’s family and be loved by them.","Loving his family doesn’t mean letting them run your marriage. It means honoring them, praying for them and building bridges, while keeping your marriage the priority."],
perg:"How is my relationship with my husband’s family? Is there someone I need to get closer to or forgive?",
des:"Pray today, by name, for your in-laws and his siblings. Do something kind for his family: a call, a message, an invitation.",
ora:"Lord, bless my husband’s family and mine. Give us peace, respect and love among us all. Amen."},

{t:"The good wine of marriage",ref:"Jn 2:1-11",v:"Do whatever he tells you.",
exp:"At a wedding feast in Cana, the wine runs out. Mary notices and tells Jesus. Then she tells the servers to do whatever he tells them. Jesus turns six stone jars of water into wine, and the best wine is served last. It was his first miracle.",
med:["Jesus worked his first miracle at a wedding. In marriage he is present through a sacrament: the couple receives a special grace to love each other.","When the “wine” runs out, when joy and love seem dried up, Mary is paying attention and intercedes. And Jesus still turns water into wine, if we do whatever he tells us."],
perg:"Where has the “wine” run out in our marriage? Have I asked Mary to intercede?",
des:"Remember your wedding date and, if you can, look at the photos or the video. Pray one decade of the Rosary asking Mary to intercede for new wine in your marriage.",
ora:"Mary, you noticed when the wine ran out: look at our marriage. Jesus, turn our water into good wine. Amen."},

{t:"Under the protection of the Holy Family",ref:"Lk 2:41-52",v:"Your father and I have been looking for you with great anxiety.",
exp:"At twelve years old, Jesus goes with Mary and Joseph to Jerusalem for Passover. On the way home, they realize the boy has stayed behind. They search for him anxiously for three days, until they find him in the Temple. Mary keeps all these things in her heart.",
med:["Mary and Joseph also went through hard times: an unexpected pregnancy, a difficult journey, the flight into Egypt, losing their son in Jerusalem. Their life wasn’t perfect, but they were united in God.","Notice the words “your father and I”: they searched together. The Holy Family understands our struggles and is the model and protector of every married couple."],
perg:"What worry are my husband and I living through that we need to place in the hands of Mary and Joseph?",
des:"Put an image or picture of the Holy Family in a special place in your home and consecrate your marriage to them with today’s prayer.",
ora:"Jesus, Mary and Joseph, I give you my heart and my soul. Protect our marriage and our family. Holy Family of Nazareth, pray for us. Amen."},

{t:"Renewing our yes",ref:"1 Cor 13:4-13",v:"It bears all things, believes all things, hopes all things, endures all things. Love never fails.",
exp:"Saint Paul writes the hymn to love: love is patient, love is kind, it is not jealous or proud, it does not seek its own interests, it does not brood over injury. Everything else will pass, but love remains. Of faith, hope and love, the greatest is love.",
med:["After 30 days, it is time to look back over the road. Maybe a lot has changed; maybe only a little. But you have woven the third strand, day after day, and God has been at work, even where you didn’t see it.","On your wedding day, you both said “yes.” Today is a day to renew that yes, not to the feelings of the beginning, but to the love that chooses, perseveres and hopes."],
perg:"What has changed in me and in my marriage over these 30 days? What is my “yes” today?",
des:"In prayer, renew the promises of your marriage: “I take you to be my husband. I promise to be faithful to you, in good times and in bad, in sickness and in health, to love you and to honor you all the days of my life.” If he is open to it, pray together. Write him a love letter.",
ora:"Lord, today I renew my yes. Thank you for these 30 days. Keep taking care of our marriage, because love never fails. Amen."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="casamento30"){PLANOS[i].d=D;PLANOS[i].resumo="A whole month placing your marriage in God’s hands. Each day brings a Bible reading explained, a meditation, a space to write and a concrete challenge to live out with your husband.";}}
})();

// Short plans (part 1): New Year, peace, loved by God, family prayer. Full version.
(function(){
var P={};

P.anonovo7={ini:"2027-01-01",resumo:"One week, from January 1 to 7, to look back with gratitude and plan 2027 with God at the center, following the Church’s feasts as well. Each day brings a reading explained, a meditation, a space to write and a challenge.",d:[
{t:"Placing the year under God’s blessing",cel:"Mary, the Holy Mother of God (Solemnity) · World Day of Peace",
aviso:"Holy day of obligation: go to Holy Mass. Begin the year at the feet of Our Lady, Mother of God.",
tipo:"first reading",ref:"Nm 6:22-27",v:"The LORD bless you and keep you! The LORD let his face shine upon you … The LORD look upon you kindly and give you peace!",
exp:"On the first day of the year, the Church reads the blessing God taught Moses for the priests to give the people. And it celebrates Mary as the Mother of God: in the Gospel (Lk 2:16-21), the shepherds find the Child with Mary and Joseph, and Mary keeps all these things in her heart.",
med:["Before any resolution, we place the whole year in God’s hands and under Mary’s mantle. We don’t know what 2027 will bring, but we know who will walk with us.","Mary kept everything in her heart. This year, may you also learn to treasure and ponder what God does in your life, day after day."],
perg:"What do I want to give to God at the beginning of this year?",
des:"Gather your family and bless each person with the blessing from Numbers, tracing the Sign of the Cross on their forehead. Write at the top of a page: “2027 is yours, Lord,” and keep it in your Bible or planner.",
ora:"Holy Mary, Mother of God, I consecrate this year to you. Lord, bless us, keep us and give us your peace in 2027. Amen."},

{t:"Thus far the Lord has helped us",cel:"Saints Basil the Great and Gregory Nazianzen (Memorial)",
ref:"1 Sm 7:7-12",v:"As far as this place the LORD has been our help.",
exp:"The Philistines attack Israel. The frightened people ask Samuel not to stop praying. Samuel offers a sacrifice and cries out to the Lord, and God answers. After the victory, Samuel sets up a stone as a memorial and names it Ebenezer, “stone of help”: thus far the Lord has helped us.",
med:["Looking back with gratitude shows how many times God has held us up, even when we thought we couldn’t make it. Remembering God’s victories gives us courage for what lies ahead.","Today, set up your own Ebenezer stone: a sign to remind you that God was with you in 2026."],
perg:"At what moments in 2026 did I see God help me?",
des:"List at least five moments in 2026 when God helped you. Choose a small stone (or an object) and write “Ebenezer” or “Thus far” on it. Keep it somewhere visible all year.",
ora:"Lord, thus far you have helped us. Thank you for every help in 2026. I trust you will stay with us. Amen."},

{t:"Following the star",cel:"The Epiphany of the Lord (Solemnity)",
aviso:"Sunday Mass is an obligation: go to Holy Mass. Today the Church celebrates the Epiphany: Jesus is revealed to all peoples.",
tipo:"Gospel",ref:"Mt 2:1-12",v:"We saw his star at its rising and have come to do him homage.",
exp:"Magi from the East follow a star to Jerusalem and ask where the newborn king is. Herod is greatly troubled. The star leads them to Bethlehem, where they find the Child with Mary. They kneel, worship him and offer gold, frankincense and myrrh. Then, warned in a dream, they go home by another way.",
med:["The Magi made a long journey because of a star. They didn’t have all the answers, but they had a direction. And when they found Jesus, they went home “by another way”: the encounter changed their direction.","What star will guide your year? Goals are good, but what matters most is the direction: going to Jesus and letting him change your path."],
perg:"What star do I want to follow in 2027? What path do I need to change after meeting Jesus?",
des:"Make the three gifts of the Magi out of paper as a family: gold (the best we have), frankincense (our prayer) and myrrh (our sacrifices). Each person writes what they want to offer Jesus this year and places it near the nativity scene.",
ora:"Jesus, guide me as the star guided the Magi. May I find you, worship you and go home by a new way. Amen."},

{t:"Goals with God",cel:"Saint Elizabeth Ann Seton, Religious (Memorial)",
ref:"Lk 14:28-30",v:"Which of you wishing to construct a tower does not first sit down and calculate the cost",
exp:"Jesus uses a very practical image: anyone who wants to build a tower first sits down and calculates the cost, so as not to start and leave it half-finished. He is speaking about discipleship: following Jesus is a serious decision that needs to be thought through. The Book of Proverbs adds that whoever entrusts their works to the Lord will see their plans succeed (Prv 16:3).",
med:["Planning isn’t a lack of faith. Jesus himself praises the one who sits down and does the math. What changes is who we plan with: with God at the center, our goals become truer and lighter.","Too many goals wear us out and frustrate us. Choose a few, achievable ones that are good for your soul, your family and your body. Saint Elizabeth Ann Seton, wife, mother of five and the first saint born in the United States, shows that holiness fits into a full and busy life."],
perg:"What are the three most important goals for me in 2027?",
des:"Write three goals for 2027 in your planner: one for your life with God, one for your family and one for yourself. For each one, write the first concrete step.",
ora:"Lord, I give you my plans for 2027. Help me plan with wisdom and follow your will. Amen."},

{t:"Our family in 2027",cel:"Saint John Neumann, Bishop (Memorial)",
ref:"Col 3:12-17, 20-21",v:"And over all these put on love, that is, the bond of perfection.",
exp:"Saint Paul describes what Christian family life should look like: compassion, kindness, humility, patience, forgiveness. He asks that the peace of Christ rule in their hearts and that the word of God dwell in them. And he speaks to children, to obey their parents, and to parents, not to provoke their children.",
med:["What kind of family do you want to be in 2027? It isn’t about perfection, but direction: more peace, more prayer, more time together, less yelling.","The family is the place where we learn, in practice, to put on the “clothing” of love that Paul describes."],
perg:"What do I wish for my family in 2027? What depends on me?",
des:"Gather your family and ask each person: “What do you want our family to do more of in 2027?” Choose one commitment together (praying together, one outing a month, a phone-free dinner).",
ora:"Lord, bless our family in 2027. May your peace rule in our hearts and your love unite us. Amen."},

{t:"A habit of prayer",cel:"Wednesday after Epiphany",
tipo:"Gospel",ref:"Mk 6:45-52",v:"And when he had taken leave of them, he went off to the mountain to pray.",
exp:"After the multiplication of the loaves, Jesus sends the disciples across the lake and goes up the mountain to pray alone. At night he sees them struggling against the wind and comes to them walking on the water. He tells them to take courage and not be afraid. He gets into the boat, and the wind dies down.",
med:["Even with crowds looking for him, Jesus set time aside to pray. If even Jesus needed that time alone with the Father, how much more do we.","A prayer routine doesn’t have to be long: 5 minutes a day, at a set time, can change your year. It was from the mountain of prayer that Jesus saw his disciples in danger and went to them."],
perg:"What is the best time of my day to pray consistently?",
des:"Choose a set time and place for your moment with God in 2027. Set an alarm on your phone called “My moment with God” and start today.",
ora:"Lord, teach me to go up the mountain to pray every day. May prayer be at the center of my routine in 2027. Amen."},

{t:"Moving forward",cel:"Thursday after Epiphany",
ref:"Phil 3:7-14",v:"forgetting what lies behind but straining forward to what lies ahead",
exp:"Saint Paul says that everything he once considered important now counts for little compared with knowing Jesus. He admits he hasn’t reached perfection yet, but he keeps running toward the goal, forgetting what lies behind and straining forward to what lies ahead.",
med:["The past teaches us, but it doesn’t hold us. The mistakes, frustrations and hurts of 2026 can stay behind. God is opening a new path.","Paul doesn’t say he has arrived: he says he keeps running. 2027 doesn’t need to be perfect; it needs to be lived with God, one step at a time."],
perg:"What from 2026 do I need to leave behind in order to move forward?",
des:"Write on a piece of paper what you want to leave in 2026 and tear it up. Then write a sentence of hope for 2027 and put it on the first page of your planner.",
ora:"Lord, I leave behind what is past and move forward with you toward what lies ahead. Bless my 2027. Amen."}
]};

P.paz7={resumo:"For days of worry and anxiety: one week learning to place everything in God’s hands. Each day brings a reading explained, a meditation, a space to write and a small exercise in peace.",d:[
{t:"Casting my burden on the Lord",ref:"Ps 55:17-23",v:"Cast your care upon the LORD, who will give you support.",
exp:"The psalmist is in anguish: enemies pursue him, and even a friend has betrayed him. He cries out to God morning, noon and evening. And he arrives at a certainty: God hears and sustains whoever casts their burden on him.",
med:["We often carry, all alone, weights that were never meant for us: our children’s future, the bills, someone’s health, what other people think.","Casting your burden on the Lord isn’t running from responsibility; it is recognizing that God can carry what I can’t."],
perg:"What burden have I been carrying alone that I need to cast on the Lord?",
des:"Write down every worry that comes to mind on a sheet of paper. Read each one and say: “Lord, this is yours.” Then fold the sheet and place it inside your Bible.",
ora:"Lord, I cast my burden on you. Sustain me and give me your peace. Amen."},

{t:"Only today’s bread",ref:"Ex 16:4, 13-21",v:"I am going to rain down bread from heaven for you. Each day the people are to go out and gather their daily portion",
exp:"In the desert, the people of Israel are hungry. God sends manna, a bread that appears every morning. But there is a rule: each person gathers only enough for that day. Whoever tries to save some for the next day finds it spoiled.",
med:["Anxiety wants to secure tomorrow today. God taught his people to trust one day at a time: tomorrow there would be manna again.","Jesus taught us to ask for our daily bread. Today you only need today’s grace. Tomorrow’s will come tomorrow."],
perg:"What worry about tomorrow is stealing my today?",
des:"Today, whenever your mind races to the future, say: “Only today’s bread, Lord.” Make a list of only what needs to be done today.",
ora:"Father, give me today’s bread today. Teach me to trust you one day at a time. Amen."},

{t:"Breathing in the peace of Jesus",ref:"Jn 20:19-22",v:"Peace be with you. … And when he had said this, he breathed on them and said to them, ‘Receive the holy Spirit.’",
exp:"On the evening of the Resurrection, the disciples are locked inside, afraid. Jesus comes, stands in their midst and wishes them peace. He shows them his hands and his side, and they rejoice. Then he breathes on them and gives them the Holy Spirit.",
med:["Jesus came in through doors locked by fear. He can come into your heart when it is locked by anxiety.","And he breathed on them: he gave the Spirit like a breath. When anxiety tightens its grip, breathing slowly with a prayer helps body and soul return to peace."],
perg:"Where are the doors of my heart locked by fear?",
des:"Pray the “breath prayer” three times today: as you breathe in, say silently “Jesus”; as you breathe out, “I trust in you.” Repeat slowly for 2 minutes.",
ora:"Jesus, come in through the locked doors of my heart. Breathe your Spirit on me and leave me your peace. Amen."},

{t:"Take courage, it is I",ref:"Mt 14:22-33",v:"Take courage, it is I; do not be afraid.",
exp:"The disciples are in the boat before dawn, with the wind against them. Jesus comes walking on the water. They are terrified, thinking he is a ghost. Jesus tells them to take courage, it is he. Peter asks to come to him and walks on the water, but when he sees the wind, he becomes frightened and begins to sink. Jesus stretches out his hand and catches him.",
med:["Peter sank when he took his eyes off Jesus and looked at the wind. Anxiety does that: we look so hard at the problem that we forget who is with us.","Even when he sank, Peter wasn’t alone: Jesus reached out his hand right away. You aren’t alone either."],
perg:"What “wind” have I been looking at more than at Jesus?",
des:"When worry comes today, pray Peter’s prayer: “Lord, save me!” Write down here what happened afterward.",
ora:"Jesus, when I begin to sink, stretch out your hand. May my eyes stay fixed on you, not on the wind. Amen."},

{t:"Caring for my thoughts",ref:"Rom 12:1-2",v:"Do not conform yourselves to this age but be transformed by the renewal of your mind",
exp:"Saint Paul asks Christians to offer their whole lives to God and not to follow the world’s way of thinking. Transformation begins in the mind: renewing the way we think so we can discern what God wants, what is good, pleasing and perfect.",
med:["Much anxiety comes from the thoughts we feed: the news, comparisons on social media, “what if it goes wrong?” The mind needs care too.","Renewing your mind means choosing what to think about. You can’t control everything that pops up, but you can stop feeding what steals your peace."],
perg:"What thoughts have I been feeding that steal my peace?",
des:"Take a “news and social media fast” for a few hours today. Use that time to read a psalm, listen to calming music or talk with someone you love.",
ora:"Lord, renew my mind. Teach me to think about what is good, true and beautiful. Amen."},

{t:"Gratitude that brings calm",ref:"Ps 103:1-5",v:"Bless the LORD, my soul; and do not forget all his gifts",
exp:"The psalmist speaks to his own soul and invites it to bless God. He asks not to forget any of the good he has received: forgiveness, healing, a life redeemed, love, mercy and renewed strength.",
med:["Anxiety looks at what could go wrong; gratitude looks at what God has already done. The two can’t fit in the same place at the same time.","When we remember God’s blessings, the heart calms down, because it realizes it isn’t abandoned."],
perg:"What blessings from God have I forgotten?",
des:"Before bed, write ten good things that happened this week, even small ones. Read them out loud as a prayer.",
ora:"With all my soul I bless you, Lord. Thank you, my God, for everything you have done for me. Amen."},

{t:"Lying down in peace",ref:"Ps 4:2, 7-9",v:"In peace I will lie down and fall asleep, for you alone, LORD, make me secure.",
exp:"This psalm is a night prayer. The psalmist asks God to hear him in his distress, remembers that God has filled his heart with joy and ends with calm trust: he can lie down and sleep in peace, because he is safe in God.",
med:["Night is often the worst time for anxiety: the silence makes our thoughts louder. Giving the day to God before sleep helps body and soul to rest.","After these 7 days, you aren’t free from every worry, but you have learned ways to return to peace. Keep using each of them."],
perg:"What has changed in me over these 7 days? What peace exercise do I want to keep?",
des:"Create a small nighttime ritual: turn off your phone a little earlier, pray Psalm 4 and give the day to God. Start tonight.",
ora:"Lord, I lie down and sleep in peace, because you alone keep me safe. Guard my sleep and my heart. Amen."}
]};

P.amada7={resumo:"A week just for you: remembering who you are in God’s eyes, before you are a mom, a wife or the one who runs the house. Each day brings a reading explained, a meditation, a space to write and a small act of self-care.",d:[
{t:"Called by name",ref:"Jn 20:11-18",v:"Jesus said to her, ‘Mary!’ She turned and said to him in Hebrew, ‘Rabbouni’",
exp:"On Resurrection Sunday, Mary Magdalene weeps by the empty tomb. She sees Jesus but doesn’t recognize him; she thinks he is the gardener. Then Jesus calls her by name. At once she recognizes him. And Jesus sends her to tell the disciples that he is alive.",
med:["Mary Magdalene recognized Jesus when she heard her own name. God doesn’t love you as “just one more”: he calls you by name, with a personal love.","Before any role you play (mother, wife, daughter, professional), you are someone God calls by name."],
perg:"How do I feel when I imagine Jesus calling me by my name?",
des:"Read Jn 20:11-18 and put your own name in place of “Mary.” Spend a minute in silence, letting Jesus call you.",
ora:"Jesus, you call me by name. May I recognize your voice and rejoice that I am yours. Amen."},

{t:"Even the hairs of your head",ref:"Mt 10:29-31",v:"Even all the hairs of your head are counted. So do not be afraid; you are worth more than many sparrows.",
exp:"Jesus encourages the disciples who are about to face hardship in their mission. He reminds them that not even a sparrow, worth almost nothing at the market, falls to the ground without the Father knowing. And he says: you are worth much more.",
med:["You don’t have to earn God’s love. He already loves you just as you are, with your tiredness, your failings and your insecurities. Even the hairs of your head are counted.","In a world that measures worth by looks, productivity or likes, God reminds you: your worth lies in being loved by him."],
perg:"Where have I been looking for my worth? In my looks, in what I do, in other people’s approval?",
des:"Look in the mirror today and say, even if it feels strange: “I am precious to God.” Write down here what you felt.",
ora:"Father, thank you for caring even about the hairs on my head. Teach me to see my worth through your eyes. Amen."},

{t:"God taught me to walk",ref:"Hos 11:1-4",v:"I drew them with human cords, with bands of love; I fostered them like those who raise an infant to their cheeks",
exp:"Through the prophet Hosea, God speaks of his people as a little child. It was he who taught them to walk, holding them by the arms, who cared for their wounds, who bent down to feed them. Even when the people strayed, God drew them with bands of love.",
med:["You, who care for so many people, are cared for too. God bends down to you the way a mother bends over her baby.","Maybe you never even noticed, but God taught you to walk in many seasons of your life: he held you, lifted you and fed you."],
perg:"At what moment in my life did I feel God holding me close?",
des:"Set aside 10 minutes just for yourself today: a cup of tea, a calm bath, a walk. During that time, let God care for you.",
ora:"Lord, thank you for the bands of love with which you drew me. Let me rest in your arms today. Amen."},

{t:"God delights in you",ref:"Zep 3:14-17",v:"The LORD, your God, is in your midst, a mighty savior, Who will rejoice over you with gladness, and renew you in his love…",
exp:"The prophet Zephaniah invites Jerusalem to rejoice, because God has taken away her judgment. And he says something surprising: God is in the midst of his people and rejoices over them with gladness, renewing them in his love.",
med:["Many people imagine a God who looks at them with disappointment or constant demands. Today’s Word shows a God who looks at you and rejoices, like a father who sees his child and smiles.","You are not a burden to God. You are his joy."],
perg:"How do I imagine God looking at me: with demands or with joy?",
des:"Write Zep 3:17 on a piece of paper with your name in it: “The Lord your God rejoices over (your name) with gladness.” Stick it on your bathroom mirror.",
ora:"Lord, thank you for rejoicing over me. Renew me in your love and teach me to rejoice in you. Amen."},

{t:"You don’t have to be perfect",ref:"Lk 7:36-50",v:"her many sins have been forgiven; hence, she has shown great love.",
exp:"Jesus is having dinner at the house of a Pharisee. A woman known as a sinner comes in, weeps at Jesus’ feet, wipes them with her hair and anoints them with perfume. The Pharisee is scandalized. Jesus tells a parable about forgiveness and tells the woman that her sins are forgiven and she may go in peace.",
med:["That woman didn’t arrive perfect: she came with her story and her tears. And she was welcomed with love.","You don’t have to be perfect to be loved by God, or to serve him. He wants all of you, with your failings, your efforts and the love you have."],
perg:"What demand for perfection am I carrying that I need to give to Jesus?",
des:"Write down one demand you place on yourself (“I should...”). Next to it, write: “Jesus loves me as I am.” If you feel the need, go to Confession this week.",
ora:"Jesus, I come to your feet just as I am. Thank you for loving me and forgiving me. Give me your peace. Amen."},

{t:"Caring for yourself is holy too",ref:"Lk 5:15-16",v:"but he would withdraw to deserted places to pray.",
exp:"Jesus’ fame spreads, and crowds come to hear him and be healed. Even so, the Gospel tells us that Jesus would withdraw to quiet places to pray. He knew he needed that time alone with the Father.",
med:["Taking care of yourself isn’t selfish. It is caring for the house where God dwells. Jesus, with so many people needing him, set aside time to withdraw.","A worn-out woman can’t care well for anyone. Setting aside time for yourself (to rest, pray, do something you enjoy) is a necessity, not a luxury."],
perg:"When was the last time I took care of myself without guilt?",
des:"Choose one thing just for you today: something that does you good and that you’ve been putting off. Do it without guilt, offering it to God.",
ora:"Lord, teach me to care for myself the way you care for me. May I rest without guilt and pray without hurry. Amen."},

{t:"The better part",ref:"Lk 10:38-42",v:"Mary has chosen the better part and it will not be taken from her.",
exp:"Jesus visits Martha and Mary. Martha is busy with a thousand tasks; Mary sits at Jesus’ feet to listen. Martha complains, and Jesus tenderly says that Mary has chosen the better part.",
med:["After a week remembering who you are in God’s eyes, today’s Word invites you to choose the better part: being with him.","You will still have many tasks, like Martha. But every day you can sit at Jesus’ feet for a few minutes. No one can take that part away from you."],
perg:"What have I learned about myself this week? How can I choose the better part every day?",
des:"Write a letter from God to you, as if he were telling you everything you meditated on this week. Keep it to read on hard days.",
ora:"Jesus, I choose the better part: being with you. Thank you for loving me. May I never forget who I am in your eyes. Amen."}
]};

P.familia5={resumo:"One step a day to build simple habits of prayer with your kids, habits that fit into real life. Each day brings a reading explained, a meditation, a space to write and a habit to start.",d:[
{t:"Morning prayer",ref:"Ps 5:2-4",v:"in the morning you will hear my voice; in the morning I will plead before you and wait.",
exp:"The psalmist begins the day asking God to hear his cry. He brings his prayer first thing in the morning and stays alert, waiting for God’s answer.",
med:["Starting the day with God changes the whole day. It doesn’t have to be long: a Sign of the Cross and one sentence on waking already teach children that the day belongs to God.","Morning rush is real. That is why the prayer needs to be simple and fit into the routine: at breakfast, on the way to school, at the front door."],
perg:"What are mornings like in my home? When could a quick prayer fit in?",
des:"Tomorrow morning, when you wake your children, make the Sign of the Cross with them and say: “Good morning, Jesus! This day is yours.” Repeat it every day this week.",
ora:"Lord, in the morning we give you our day. Bless our family from the very first moment. Amen."},

{t:"Grace at meals",ref:"Lk 24:28-35",v:"With that their eyes were opened and they recognized him … he was made known to them in the breaking of the bread.",
exp:"Two disciples are walking to Emmaus, sad after Jesus’ death. Jesus walks with them, but they don’t recognize him. At table, Jesus takes the bread, blesses it, breaks it and gives it to them. At that moment their eyes are opened, and they recognize him.",
med:["The disciples recognized Jesus at the table, in the blessing of the bread. The family table can also be a place to meet him.","Praying before meals is one of the simplest and most beautiful habits. It teaches gratitude and reminds us that everything comes from God."],
perg:"Does my family usually pray before eating? What gets in the way?",
des:"Today, before lunch or dinner, pray together holding hands. It can be: “Bless, O Lord, this food and the hands that prepared it, and give bread to those who have none.” Let one of the kids lead the prayer.",
ora:"Lord, bless our table. May we recognize you at every meal we share. Amen."},

{t:"A parent’s blessing",ref:"Gn 48:8-16",v:"The God who has been my shepherd from my birth to this day … bless these boys",
exp:"In his old age, Jacob receives his grandsons, the sons of Joseph. He hugs them, kisses them and lays his hands on their heads to bless them, remembering the God who had been with him all his life.",
med:["A parent’s blessing is an ancient and powerful gesture. It tells a child: “You are loved, and God is with you.”","In many Catholic families, especially Hispanic and Filipino families, children still ask their parents and grandparents for a blessing (a “bendición” or “mano po”). Bringing that gesture back with your children is planting something they will carry for life."],
perg:"Do I bless my children? What was the blessing I received from my parents like?",
des:"Tonight, place your hand on each child’s head and say: “May God bless you and keep you, my child.” Teach them to ask for your blessing when they leave and when they come home.",
ora:"Lord, may my hands bless my children every day. Be their shepherd all their lives. Amen."},

{t:"Night prayer",ref:"Ps 63:2-9",v:"I will remember you upon my couch, and through the night-watches I will meditate on you: You are my help…",
exp:"The psalmist thirsts for God like a dry land. He remembers God even while lying in bed at night, and he feels safe in the shadow of God’s wings.",
med:["At night, the family slows down. It is the perfect time to give thanks for the day, say sorry and give our sleep to God.","A simple prayer before bed, with the kids tucked in, becomes one of the sweetest memories of childhood."],
perg:"What is bedtime like in my home? Is there room for a few minutes of prayer?",
des:"Tonight at bedtime, ask your children three questions: “What are you thankful for today?” “Is there anything you want to say sorry for?” “Who do you want to pray for?” End with the Guardian Angel prayer.",
ora:"Lord, guard our sleep. Thank you for this day. May your angels protect us tonight. Amen."},

{t:"A family time with God",ref:"Col 3:16-17",v:"Let the word of Christ dwell in you richly … do everything in the name of the Lord Jesus",
exp:"Saint Paul asks that the word of Christ dwell richly in Christians: that they teach and counsel one another, sing to God with gratitude, and do everything in the name of Jesus, giving thanks to the Father.",
med:["Along with small daily habits, a weekly family time with God helps faith grow: reading a Bible passage, singing, talking, praying together.","It doesn’t need to be complicated. Fifteen minutes a week, always on the same day, is enough for the Word to make its home in yours."],
perg:"What day and time of the week could my family set aside for a time with God?",
des:"Schedule your first weekly family time: light a candle, read a short Gospel passage (it can be Sunday’s), let each person say what they understood, and end with a song and an Our Father.",
ora:"Lord, may your Word dwell in our home. May everything we do be done in your name. Amen."}
]};

// Short plans (part 2): Our Lady, the Holy Family, gratitude. Full version.
(function(){
var P={};

P.maria9={resumo:"Nine days walking with Mary through the Gospel, from her yes at the Annunciation to the Upper Room. Each day brings a reading explained, a meditation, a space to write what God told you and a challenge to live like her.",d:[
{t:"Mary of the yes",ref:"Lk 1:26-38",v:"Behold, I am the handmaid of the Lord. May it be done to me according to your word.",
exp:"The angel Gabriel is sent to Nazareth, to a young woman named Mary, betrothed to Joseph. He announces that she will be the mother of the Son of the Most High. Mary doesn’t pretend to understand everything: she asks how this will happen. The angel answers that the Holy Spirit will come upon her and reminds her that nothing is impossible for God. Then Mary gives her answer: let it be done.",
med:["Mary didn’t have all the answers, but she had trust. She asked, listened and gave herself completely. Her yes wasn’t naïve: it was the yes of someone who knows whom she trusts.","God is also waiting for your small daily “yeses”: in caring for your home, in a forgiveness that costs you, in the prayer you keep putting off. Every yes makes room for Jesus to enter your story."],
perg:"In what area of my life is God asking me for a yes that I keep putting off?",
des:"Choose one concrete thing you have been putting off and know God is asking of you (a conversation, a Confession, a habit of prayer, an act of forgiveness). Take the first step today and pray three Hail Marys asking for Mary’s courage.",
ora:"Mary, woman of the yes, teach me to trust as you trusted. May I also give my whole yes to God, and let his word be done in me. Amen."},

{t:"Mary who serves",ref:"Lk 1:39-45",v:"During those days Mary set out and traveled to the hill country in haste to a town of Judah",
exp:"Right after the Annunciation, Mary learns that her elderly cousin Elizabeth is six months pregnant. She doesn’t stay still thinking about herself: she travels about 90 miles to help. When she arrives, the baby John leaps in Elizabeth’s womb, and Elizabeth, filled with the Holy Spirit, calls her blessed among women.",
med:["Mary was carrying Jesus in her womb, and the first thing she did was serve. Whoever carries Jesus within can’t stay closed in: they go out to meet those in need.","Mary’s service brought joy to that house. Your service each day, often hidden, also brings Jesus into your family and to the people around you."],
perg:"Who near me needs help, even without asking for it?",
des:"Today, do a concrete act of service for someone without being asked: bring a meal, help with a task, visit or call an elderly or sick person. Do it with joy, like Mary.",
ora:"Mary, who set out in haste to serve, give me an attentive heart and ready hands. In serving, may I bring Jesus to those in need. Amen."},

{t:"Mary who praises",ref:"Lk 1:46-55",v:"My soul proclaims the greatness of the Lord; my spirit rejoices in God my savior.",
exp:"In Elizabeth’s house, Mary answers with a song, the Magnificat. She praises God for what he has done in her, a simple young woman, and for the way God acts in history: he casts down the mighty, lifts up the lowly, fills the hungry and remembers his promises. It is the prayer the Church prays every evening at Evening Prayer (Vespers).",
med:["Mary doesn’t keep her joy to herself: she turns it into praise. She doesn’t say “I am great,” but “the Lord has done great things for me.” Humble gratitude is the secret of her heart.","Sometimes we only pray to ask for things. Today, learn from Mary to praise: look at your own life and recognize the wonders God has already done."],
perg:"What are the “great things” God has already done in my life?",
des:"Pray the Magnificat slowly (you’ll find it in the Pray tab). Then write your own “magnificat”: five lines beginning with “My soul praises the Lord because...”",
ora:"My soul praises you, Lord, and my spirit rejoices in you, my Savior, because you have looked upon me in my littleness. Mary, teach me to praise. Amen."},

{t:"Mary, mother in Bethlehem",ref:"Lk 2:1-7",v:"She gave birth to her firstborn son. She wrapped him in swaddling clothes and laid him in a manger, because there was no room for them in the inn.",
exp:"Because of a census, Joseph and Mary, already near the end of her pregnancy, travel from Nazareth to Bethlehem. They find no room in the inn, and the Son of God is born in a place for animals. Mary does what every mother does: she wraps the baby in swaddling clothes and lays him in the safest place she can find.",
med:["Jesus’ birth was surrounded by improvising, exhaustion and lack of resources. Even so, Mary cared for him with what she had, with all the love she could give.","The simple tasks of every day, like baths, meals, holding a child and clean clothes, are holy too. Done with love, they become prayer and prepare a place for Jesus in your home."],
perg:"In which simple tasks of my day can I see Jesus?",
des:"Quietly offer to God every act of care you do today for your family (or for yourself): “This is for you, Lord.” Tonight, write down which one was hardest to offer and why.",
ora:"Mary, who cared for Jesus with so little and with so much love, teach me to care with patience and tenderness. May my home be a welcoming manger for Jesus. Amen."},

{t:"Mary who treasures in her heart",ref:"Lk 2:15-19",v:"And Mary kept all these things, reflecting on them in her heart.",
exp:"The shepherds, told by the angels, go to Bethlehem and find Mary, Joseph and the infant lying in the manger. They tell everything they heard, and everyone is amazed. Mary, however, doesn’t get lost in the excitement: she keeps everything and reflects on it, that is, she puts the events together and tries to understand what God is doing.",
med:["Mary didn’t understand everything right away, but she didn’t discard anything. Her heart was like a treasure box where she kept God’s signs, to pray with them later.","We live in a rush and quickly forget what God has done. Treasuring things in the heart means stopping, remembering and letting the day’s events become prayer."],
perg:"What has God been doing in my life that I haven’t yet stopped to reflect on?",
des:"Spend 10 minutes in silence today, with no phone. Recall the events of the past week and write below one sign of God you noticed and want to treasure in your heart.",
ora:"Mary, who kept everything in your heart, teach me to be silent and to notice God in the events of my life. Amen."},

{t:"Mary who searches for Jesus",ref:"Lk 2:41-51",v:"Son, why have you done this to us? Your father and I have been looking for you with great anxiety.",
exp:"At twelve years old, Jesus goes with Mary and Joseph to Jerusalem for Passover. On the way back, his parents realize he isn’t in the caravan. They search anxiously for three days, until they find him in the Temple, among the teachers. Jesus answers that he had to be in his Father’s house. Mary doesn’t understand, but once again she keeps everything in her heart.",
med:["Even Mary went through anguish, searching and unanswered questions. That comforts us: feeling that Jesus is far away doesn’t mean we have been abandoned. It means it is time to search.","Mary and Joseph went back and searched until they found him. When busy life pulls us away from Jesus, the way back is to return to where he is: prayer, the Word, Mass, Confession."],
perg:"Where have I “lost sight of Jesus” lately? Where do I need to go back to?",
des:"Pick up again today a habit of faith you let slip (the Rosary, reading the Bible, weekday Mass, Confession). Put the day and time you’ll do it this week on your calendar.",
ora:"Mary, when I drift away from Jesus, hold my hand and help me find him again. May I never stop searching for him. Amen."},

{t:"Mary who intercedes",ref:"Jn 2:1-11",v:"His mother said to the servers, ‘Do whatever he tells you.’",
exp:"At a wedding in Cana, the wine runs out in the middle of the feast, which would be a great embarrassment for the newlyweds. Mary notices before anyone else and brings the need to Jesus: they have no wine. Then she tells the servers to do whatever he tells them. Jesus turns the water into wine, and this is his first sign.",
med:["Mary notices what is missing before anyone asks. She does this for your family too: she sees the needs of your home and presents them to Jesus.","Mary’s advice is still the same today: do whatever he tells you. Her intercession always leads us to obey her Son."],
perg:"What is missing in my home today? What “wine” has run out?",
des:"Write below a concrete need in your family and entrust it to Our Lady by praying a Rosary (or at least one decade) for that intention. Ask yourself too: what is Jesus asking me to do in this situation?",
ora:"Mary, attentive Mother, present to Jesus what my family is lacking. And give me a heart ready to do whatever he tells me. Amen."},

{t:"Mary at the foot of the cross",ref:"Jn 19:25-27",v:"Standing by the cross of Jesus were his mother and his mother’s sister, Mary the wife of Clopas, and Mary of Magdala.",
exp:"In the darkest hour, when almost everyone has fled, Mary is there, standing. From the cross, Jesus sees his mother and the beloved disciple. He gives the disciple to Mary as her son, and Mary to the disciple as his mother. From that hour, the disciple takes her into his home. The Church understands that, there, Jesus gave us Mary as our Mother.",
med:["Mary couldn’t prevent her Son’s suffering, but she didn’t leave him alone. Standing beside someone who suffers is also love, sometimes the greatest love we can give.","She knows what it is to suffer as a woman and as a mother. So you can bring her your sorrows without fear: she understands and stays with you."],
perg:"What sorrow am I carrying today that I want to place in Mary’s hands?",
des:"Think of a woman who is suffering (illness, grief, a child who has drifted away, a hard marriage). Pray for her today and, if you can, send her a loving message or pay her a visit. Just be present.",
ora:"Mary, Our Lady of Sorrows, who stood by the cross, stay with me in hard times. I welcome you into my home, like the beloved disciple. Amen."},

{t:"Mary who prays with the Church",ref:"Acts 1:12-14",v:"All these devoted themselves with one accord to prayer, together with some women, and Mary the mother of Jesus",
exp:"After Jesus’ Ascension, the apostles return to Jerusalem and gather in the upper room. There they wait for the promised Holy Spirit, praying together. Mary is in their midst. She, who received the Spirit at the Annunciation, now accompanies the newborn Church in prayer.",
med:["Mary doesn’t stay in the Gospel’s past: she remains in the midst of the Church, praying with us. Wherever a community prays, the Mother is there.","At the end of these nine days, you can do what the beloved disciple did: welcome Mary into your home and give yourself to her, so that she always leads you to Jesus."],
perg:"What have I learned from Mary over these nine days that I want to carry into my life?",
des:"Make your consecration to Our Lady with the prayer “My Queen and My Mother” (Pray tab). If you can, pray a Rosary with your family or with others, as Mary prayed with the apostles.",
ora:"My Queen and my Mother, I give myself entirely to you; and to show my devotion to you, I consecrate to you this day my eyes, my ears, my mouth, my heart, my whole being without reserve. Wherefore, good Mother, as I am your own, keep me, guard me, as your property and possession. Amen."}
]};

P.sagrada10={resumo:"Ten days learning from Jesus, Mary and Joseph how to live the faith in everyday family life. Each day brings a reading explained, a meditation, a space to write and a challenge to do with your family.",d:[
{t:"God chose a family",ref:"Lk 2:39-40",v:"The child grew and became strong, filled with wisdom; and the favor of God was upon him.",
exp:"After presenting Jesus in the Temple, Mary and Joseph return to Nazareth, an unimportant little town. Jesus will spend about 30 years there, in a hidden life of home and work. The Gospel sums up that time in just a few words: the child grew, and the favor of God was upon him.",
med:["God could have come into the world in many ways, but he chose to be born and grow up in a family. That shows the enormous value the family has for him.","Your home, with its routines, its tiredness and its joys, can also be a little Nazareth: a place where God’s grace is present in the ordinary moments of each day."],
perg:"What would make my home a little Nazareth?",
des:"Place an image or small picture of the Holy Family somewhere special in your home. Gather the family for a minute, show them the image and pray together: “Jesus, Mary and Joseph, bless our family.”",
ora:"Jesus, Mary and Joseph, who lived a simple life full of love in Nazareth, bless my family and make our home a place where God dwells. Amen."},

{t:"Mary, the attentive mother",ref:"Lk 2:48-52",v:"He went down with them and came to Nazareth, and was obedient to them; and his mother kept all these things in her heart.",
exp:"After finding Jesus in the Temple, the family goes home. Jesus, though he is God, obeys Mary and Joseph. And Mary keeps doing what she has always done: keeping everything in her heart. She is a mother who watches, listens and prays over her son’s life.",
med:["Mary wasn’t a distracted mother. She paid attention to Jesus, even when she didn’t understand. Attention is one of the most beautiful forms of love.","In the middle of all our tasks, it is easy to look at our children (or the people at home) only to correct them or give orders. Mary teaches us to look in order to admire, understand and pray for them."],
perg:"What have I noticed in the people in my home that I need to bring to prayer?",
des:"Today, set aside 15 minutes of full attention for one of your kids, your husband or someone at home: no phone, just talking or playing. Tonight, write down something beautiful you discovered in that time.",
ora:"Mary, attentive mother, teach me to look at my family the way you look at them and to treasure every moment in my heart. Amen."},

{t:"Joseph, the righteous man",ref:"Mt 1:18-24",v:"Joseph her husband, since he was a righteous man, yet unwilling to expose her to shame, decided to divorce her quietly.",
exp:"Joseph learns that Mary is with child before they live together. Being a righteous man, he doesn’t want to expose her to shame. While he is considering this, an angel appears to him in a dream and explains that the child is from the Holy Spirit. When he wakes, Joseph does as the angel commanded and takes Mary into his home.",
med:["Joseph is the man of silence and action. In the Gospel he doesn’t say a single word, but he obeys God promptly and protects Mary and Jesus with courage.","The men in your family, your husband, your father, your sons, also need prayer. Saint Joseph is a model and protector for them, and for every family that places itself in his care."],
perg:"Which men in my family do I want to place under Saint Joseph’s protection?",
des:"Pray the Prayer to St. Joseph for the Family (Pray tab) for your husband, your father or the father of your children. Then tell him something you admire about him, by text or in person.",
ora:"Saint Joseph, righteous and faithful man, protect my family as you protected Jesus and Mary. Watch over the men in my home and teach them to trust in God. Amen."},

{t:"The work of Nazareth",ref:"Mt 13:53-58",v:"Is he not the carpenter’s son? Is not his mother named Mary…",
exp:"Jesus returns to his hometown and teaches in the synagogue. The people are amazed, but also suspicious: they knew Jesus as the carpenter’s son, an ordinary man who worked with his hands. Because of their lack of faith, he doesn’t work many mighty deeds there.",
