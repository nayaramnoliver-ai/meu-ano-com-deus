ora:"Senhor, para Ti nada é impossível. Eu entrego de novo em tuas mãos o pedido que carrego há tanto tempo. Faça-se a tua vontade. Amém."},

{t:"O sim de Maria",cel:"4º Domingo do Advento · Antífona do Ó: Ó Chave de Davi",vela:4,
aviso:"Domingo é dia de preceito: participe da Santa Missa. Hoje se acende a quarta vela da coroa. Antífona: “Ó Chave de Davi, vinde e libertai os que estão nas trevas!”.",
tipo:"Evangelho",ref:"Lc 1,26-38",v:"Eis aqui a serva do Senhor; faça-se em mim segundo a tua palavra!",
exp:"O anjo Gabriel anuncia a Maria que ela será a mãe do Filho de Deus. Maria pergunta como isso vai acontecer, e o anjo responde que o Espírito Santo virá sobre ela. Então Maria diz o seu “sim”. Na primeira leitura (2Sm 7), Deus promete a Davi que o seu reino durará para sempre: essa promessa se cumpre em Jesus.",
med:["Tudo no Natal começa com um “sim”. Maria não sabia tudo o que ia acontecer, mas disse sim a Deus por inteiro. E por esse sim Deus entrou no mundo.","Deus também pede o nosso “sim” todos os dias: na paciência com os filhos, no cuidado com o lar, no perdão difícil. Cada pequeno sim abre espaço para Jesus nascer na nossa casa."],
perg:"Para o que Deus está me pedindo um “sim” neste momento da minha vida?",
des:"Acendam as quatro velas e leiam juntos o Evangelho de hoje (Lc 1,26-38). Cada pessoa completa a frase: “Neste Natal, eu digo sim a Deus para...”.",
ora:"Maria, ensina-me a dizer sim a Deus como tu disseste. Faça-se em mim segundo a tua palavra. Amém."},

{t:"A visita que enche de alegria",cel:"21 de dezembro · Antífona do Ó: Ó Sol nascente",
aviso:"Antífona de hoje: “Ó Sol nascente, esplendor da luz eterna, vinde iluminar os que estão nas trevas!”.",
tipo:"Evangelho",ref:"Lc 1,39-45",v:"Bem-aventurada aquela que acreditou.",
exp:"Maria vai às pressas até a casa de Isabel, nas montanhas. Quando Isabel ouve a saudação de Maria, o bebê João pula de alegria no seu ventre e Isabel, cheia do Espírito Santo, exclama: “Bendita és tu entre as mulheres e bendito é o fruto do teu ventre!”. Na primeira leitura (Ct 2,8-14), o amado chega “saltando sobre os montes”.",
med:["Maria acabou de receber a notícia mais importante da história e, em vez de pensar em si, vai ajudar a prima idosa. Quem carrega Jesus vai ao encontro dos outros.","As visitas de dezembro podem ser cansativas, mas também podem ser como a de Maria: levar Jesus para dentro da casa dos outros, com alegria e serviço."],
perg:"Quem está precisando de uma visita, de uma ligação ou de uma ajuda minha nestes dias?",
des:"Façam juntos uma visita ou uma ligação de vídeo para alguém mais velho ou sozinho da família. Levem um bilhetinho ou um docinho.",
ora:"Maria, que foste às pressas servir Isabel, ensina-me a levar Jesus aos outros com alegria. Amém."},

{t:"A minha alma engrandece o Senhor",cel:"22 de dezembro · Antífona do Ó: Ó Rei das nações",
aviso:"Antífona de hoje: “Ó Rei das nações e pedra angular da Igreja, vinde salvar o homem que formastes do pó!”.",
tipo:"Evangelho",ref:"Lc 1,46-56",v:"A minha alma engrandece o Senhor, e o meu espírito se alegra em Deus, meu Salvador.",
exp:"Na casa de Isabel, Maria canta o Magnificat. Ela louva a Deus porque olhou para a sua pequenez, derrubou os poderosos e elevou os humildes, encheu de bens os famintos e cumpriu a promessa feita a Abraão. Na primeira leitura (1Sm 1,24-28), Ana entrega o pequeno Samuel ao Senhor e agradece pelo filho tão esperado.",
med:["Maria não pede nada no Magnificat: ela agradece. A gratidão é a oração de quem reconhece que tudo é presente de Deus.","Antes da correria final do Natal, pare um pouco e olhe para trás: quantas coisas Deus fez por você neste ano? Faça do seu coração um Magnificat."],
perg:"Quais foram as três maiores graças que Deus me deu neste ano?",
des:"Escrevam juntos a “lista de gratidão do ano”: cada pessoa da casa diz coisas boas que Deus fez. Guardem a lista para ler no Natal.",
ora:"A minha alma engrandece o Senhor, porque Ele olhou para a minha pequenez. Obrigada, meu Deus, por tudo o que fizeste por nós neste ano. Amém."},

{t:"O nome dele é João",cel:"23 de dezembro · Antífona do Ó: Ó Emanuel",
aviso:"Antífona de hoje: “Ó Emanuel, Deus conosco, esperança das nações, vinde salvar-nos, Senhor nosso Deus!”.",
tipo:"Evangelho",ref:"Lc 1,57-66",v:"O seu nome é João.",
exp:"Isabel dá à luz um menino e todos se alegram. Na hora de dar o nome, os parentes querem chamá-lo Zacarias, como o pai. Isabel diz que será João. Zacarias, ainda mudo, escreve numa tabuinha: “O seu nome é João”. Na mesma hora a sua boca se abre e ele louva a Deus. Na primeira leitura (Ml 3), Deus promete enviar o seu mensageiro para preparar o caminho.",
med:["“João” quer dizer “Deus é misericordioso”. Zacarias voltou a falar quando obedeceu a Deus em vez de seguir o costume. A obediência abriu a sua boca para o louvor.","Amanhã é véspera de Natal. Faltando tão pouco, o Senhor pergunta se ainda há algo que precisamos acertar: uma ligação, um perdão, uma promessa."],
perg:"O que ainda falta acertar no meu coração antes de Jesus chegar?",
des:"Contem às crianças o significado do nome de cada um da família e agradeçam a Deus pelo nome e pela vida de cada pessoa da casa.",
ora:"Ó Emanuel, Deus conosco, vem! A nossa casa está quase pronta para Te receber. Abre a minha boca para o louvor. Amém."},

{t:"O sol que nasce do alto",cel:"Véspera de Natal",vela:4,
aviso:"Hoje à noite a Igreja celebra a Missa da Noite de Natal. O Natal do Senhor (25/12) é dia de preceito: participe da Santa Missa.",
tipo:"Evangelho",ref:"Lc 1,67-79",v:"Graças ao coração misericordioso do nosso Deus, o sol que nasce do alto nos visitará.",
exp:"Cheio do Espírito Santo, Zacarias canta o Benedictus. Ele bendiz a Deus que visitou o seu povo e cumpriu a promessa feita a Abraão. Depois olha para o pequeno João e diz: “Tu serás chamado profeta do Altíssimo”. E termina anunciando Jesus como o sol que vem iluminar os que estão nas trevas e guiar os nossos passos no caminho da paz.",
med:["A espera terminou. Durante todo o Advento você vigiou, preparou o caminho, alegrou-se e disse sim. Agora é só acolher: o sol nasce do alto e vem visitar a sua casa.","Na correria das últimas horas, guarde um momento de silêncio. O mais importante do Natal não está na mesa nem nos presentes: é Jesus, que quer nascer no seu coração."],
perg:"Como eu quero receber Jesus nesta noite de Natal?",
des:"Antes da ceia, reúnam a família em volta do presépio, coloquem o Menino Jesus na manjedoura e rezem juntos. Cada pessoa diz um presente que quer dar a Jesus neste ano.",
ora:"Bendito seja o Senhor, Deus de Israel, que visitou o seu povo! Vem, Menino Jesus, nasce na nossa casa e no nosso coração. Amém."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="advento24"){PLANOS[i].d=D;PLANOS[i].ini="2026-11-29";PLANOS[i].resumo="Um dia para cada dia do Advento, de 29 de novembro até a véspera do Natal, seguindo as leituras da Igreja: a leitura do dia explicada, uma meditação, uma pergunta para o coração, um desafio em família e uma oração.";}}
})();

// 30 dias orando pelo meu casamento: versão completa (leitura, explicação, meditação, pergunta, desafio, oração)
(function(){
var D=[
{t:"Entregar o casamento a Deus",ref:"Ecl 4,9-12",v:"O cordão de três fios não se rompe facilmente.",
exp:"O sábio Coélet observa a vida e conclui: dois são melhores do que um. Se um cai, o outro o levanta; se faz frio, os dois se aquecem; se alguém ataca, os dois resistem juntos. E termina com uma imagem: um cordão de três fios é muito mais difícil de arrebentar.",
med:["Na tradição cristã, esses três fios são o esposo, a esposa e Deus. Um casamento só com dois fios até se segura, mas qualquer puxão mais forte ameaça. Quando Deus é o terceiro fio, o casal ganha uma força que não vem de si.","Entregar o casamento a Deus não é desistir de lutar por ele. É reconhecer que você não precisa carregar sozinha o peso de fazer tudo dar certo. Nestes 30 dias, você vai trançar esse terceiro fio, um dia de cada vez."],
perg:"O que eu tenho tentado resolver sozinha no meu casamento e preciso entregar a Deus?",
des:"Escreva numa folha: “Senhor, o nosso casamento é teu”. Coloque a data e guarde dentro da sua Bíblia ou do seu planner. Hoje à noite, reze em silêncio por ele enquanto ele dorme ou antes de vocês dormirem.",
ora:"Senhor, eu te entrego o meu casamento. Sê o terceiro fio que nos une e nos sustenta quando estivermos fracos. Amém."},

{t:"Gratidão pelo meu esposo",ref:"Fl 1,3-11",v:"Dou graças ao meu Deus todas as vezes que me lembro de vós.",
exp:"São Paulo escreve da prisão para a comunidade de Filipos. Mesmo preso, ele começa a carta agradecendo: cada vez que se lembra deles, agradece a Deus com alegria. E reza para que o amor deles cresça cada vez mais, em conhecimento e discernimento.",
med:["A rotina tem um efeito curioso: com o tempo, passamos a reparar mais no que falta do que no que existe. A toalha molhada na cama aparece mais do que o trabalho dele para sustentar a casa.","A gratidão é um exercício de olhar. Quando agradecemos, os olhos se acostumam de novo a ver o bem. E o coração amolece. Hoje, faça como Paulo: lembre-se do seu esposo e agradeça a Deus por ele."],
perg:"Quais são as qualidades do meu esposo que eu deixei de enxergar com o tempo?",
des:"Escreva três coisas pelas quais você é grata no seu esposo. Escolha uma e diga a ele hoje, com simplicidade: “Obrigada por...”. Pode ser por mensagem, se ficar mais fácil.",
ora:"Senhor, obrigada pelo esposo que colocaste ao meu lado. Abre os meus olhos para o bem que existe nele e faz crescer o nosso amor. Amém."},

{t:"Saber ouvir",ref:"Tg 1,19-26",v:"Todo homem seja pronto para ouvir, lento para falar e lento para se irar.",
exp:"São Tiago dá um conselho muito prático: ouvir rápido, falar devagar, irritar-se mais devagar ainda. E lembra que não basta ouvir a Palavra de Deus: é preciso colocá-la em prática. Quem não controla a língua, diz ele, engana o próprio coração.",
med:["Muitas brigas no casamento nascem de não ouvir até o fim. Enquanto o outro fala, já estamos preparando a resposta. Ouvir de verdade é um ato de amor: diz ao outro “você é importante para mim”.","Os homens muitas vezes falam menos e por outros caminhos: no carro, consertando algo, num comentário rápido. Aprender a ouvir o seu esposo é também aprender o jeito dele de se abrir."],
perg:"Quando foi a última vez que eu ouvi o meu esposo até o fim, sem interromper nem corrigir?",
des:"Hoje, faça ao seu esposo uma pergunta sobre o dia dele ou sobre algo que ele gosta e escute com atenção, sem celular na mão e sem interromper. Depois, só diga: “Obrigada por me contar”.",
ora:"Espírito Santo, ensina-me a ouvir com o coração. Coloca guarda na minha boca e paciência nas minhas respostas. Amém."},

{t:"O perdão que liberta",ref:"Cl 3,12-17",v:"Suportai-vos uns aos outros e perdoai-vos mutuamente. Como o Senhor vos perdoou, assim perdoai vós também.",
exp:"São Paulo descreve a “roupa” do cristão: misericórdia, bondade, humildade, mansidão e paciência. Por cima de tudo, o amor, que é o vínculo da perfeição. E pede: perdoem-se, do mesmo jeito que o Senhor perdoou vocês.",
med:["Perdoar não é fingir que nada aconteceu nem achar que a ofensa não doeu. É decidir não cobrar mais a dívida. É soltar o outro da nossa prisão, e quem sai livre primeiro somos nós.","No casamento, pequenas mágoas não perdoadas vão se acumulando como pó em cima de um móvel. Um dia, ninguém lembra mais a cor original. O perdão de hoje limpa o pó antes que ele endureça."],
perg:"Que mágoa do meu esposo eu ainda guardo no coração? Estou pronta para entregá-la a Deus?",
des:"Escreva num papel uma mágoa que você guarda. Reze: “Senhor, eu escolho perdoar”. Depois rasgue o papel. Se for algo que precisa de conversa, peça a Deus o momento certo e a palavra certa.",
ora:"Senhor, Tu me perdoas sempre. Dá-me a graça de perdoar o meu esposo como Tu me perdoas. Cura o que ficou ferido entre nós. Amém."},

{t:"Paciência, fruto do Espírito",ref:"Gl 5,16-26",v:"O fruto do Espírito é amor, alegria, paz, paciência, bondade, benignidade, fidelidade, mansidão, domínio de si.",
exp:"São Paulo compara duas maneiras de viver: segundo a carne, que gera brigas, ciúmes, raivas e divisões; e segundo o Espírito, que dá frutos. A paciência aparece na lista como fruto: não é algo que fabricamos à força, mas algo que cresce em nós quando deixamos Deus agir.",
med:["Ninguém muda de um dia para o outro, nem eu nem ele. A paciência é o amor que sabe esperar o tempo do outro, como o agricultor espera o fruto amadurecer.","Quando a paciência acabar hoje, em vez de explodir, faça uma oração curtinha: “Espírito Santo, me dá o teu fruto”. Fruto não se arranca: se cultiva, com tempo e oração."],
perg:"Em que situação com o meu esposo a minha paciência costuma acabar primeiro?",
des:"Escolha uma mania dele que te irrita e decida não comentar nada sobre ela durante o dia de hoje. Cada vez que perceber, reze por ele em silêncio.",
ora:"Espírito Santo, faz crescer em mim o fruto da paciência. Que eu saiba esperar o tempo do meu esposo como Tu esperas o meu. Amém."},

{t:"A saúde dele",ref:"Tg 5,13-16",v:"A oração da fé salvará o doente e o Senhor o levantará.",
exp:"São Tiago ensina a comunidade a rezar em todas as situações: na tristeza, na alegria e na doença. Quando alguém estiver doente, que chame os presbíteros para rezar e ungir com óleo, em nome do Senhor. É a origem do sacramento da Unção dos Enfermos. E termina: a oração do justo tem muito poder.",
med:["Cuidar da saúde do esposo também é amar: do corpo, da mente e da alma. Muitos homens carregam cansaço, preocupações e dores em silêncio, porque aprenderam que não podem fraquejar.","A sua oração é o primeiro cuidado. Mas o amor também aparece em gestos simples: insistir com carinho para ele fazer aquele exame, preparar uma comida que faça bem, deixá-lo descansar."],
perg:"Que cansaço, dor ou preocupação o meu esposo tem carregado em silêncio?",
des:"Hoje à noite, coloque a mão sobre o ombro ou a cabeça do seu esposo (pode ser enquanto ele dorme) e reze por sua saúde do corpo, da mente e da alma. Se houver um exame ou consulta adiada, ofereça-se para ajudar a marcar.",
ora:"Senhor Jesus, médico das almas e dos corpos, cuida da saúde do meu esposo. Dá-lhe força, descanso e paz. Amém."},

{t:"O trabalho de cada dia",ref:"Sl 90(89),12-17",v:"Que a bondade do Senhor esteja sobre nós; confirma a obra de nossas mãos.",
exp:"O salmista reconhece que a vida é curta e pede a Deus sabedoria para contar bem os dias. No final, faz um pedido bonito: que Deus abençoe e confirme o trabalho das nossas mãos, para que ele tenha sentido e dure.",
med:["O trabalho é parte da vocação de cada um. Muitas vezes o seu esposo enfrenta pressões, chefes difíceis, medo de perder o emprego ou de não dar conta das contas. Ele nem sempre conta.","Rezar pelo trabalho dele é sustentar a casa de joelhos. E valorizar o esforço dele, com uma palavra de reconhecimento, renova as forças de qualquer homem."],
perg:"O que eu sei sobre as preocupações do meu esposo no trabalho? Já perguntei como ele está?",
des:"Envie uma mensagem para o seu esposo no meio do dia dizendo que está rezando por ele e pelo trabalho dele. À noite, agradeça pelo esforço que ele faz pela família.",
ora:"Senhor, abençoa o trabalho do meu esposo. Dá-lhe sabedoria, paz nas decisões e frutos do seu esforço. Confirma a obra das suas mãos. Amém."},

{t:"A fé do meu esposo",ref:"Ef 3,14-21",v:"Que Cristo habite pela fé em vossos corações, e que estejais enraizados e fundados no amor.",
exp:"São Paulo se ajoelha diante do Pai e faz uma oração pela comunidade: que sejam fortalecidos pelo Espírito, que Cristo habite nos seus corações e que conheçam o amor de Cristo, que ultrapassa todo conhecimento. Termina louvando a Deus, que pode fazer muito mais do que pedimos ou imaginamos.",
med:["Cada pessoa tem o seu tempo e o seu caminho com Deus. Talvez o seu esposo reze mais do que você, talvez ainda esteja longe. A sua missão não é cobrar nem pregar: é rezar e amar.","Santa Mônica rezou anos pela conversão do marido e do filho, Santo Agostinho. A oração paciente de uma esposa prepara o terreno com amor, e Deus pode fazer muito mais do que imaginamos."],
perg:"Como está a fé do meu esposo hoje? O que eu posso pedir a Deus por ele, sem cobrar dele?",
des:"Reze hoje, por ele, a oração de São Paulo (Ef 3,14-21), colocando o nome dele no lugar de “vós”. Se ele aceitar, convide-o com leveza para irem juntos à Missa no próximo domingo.",
ora:"Senhor, que Cristo habite no coração do meu esposo. Enraíza-o no teu amor e faz muito mais do que eu consigo pedir. Santa Mônica, rogai por nós. Amém."},

{t:"Proteção nas tentações",ref:"Mt 26,36-41",v:"Vigiai e orai, para não cairdes em tentação; o espírito está pronto, mas a carne é fraca.",
exp:"No Getsêmani, antes da Paixão, Jesus vai rezar e pede a Pedro, Tiago e João que fiquem com Ele. Ele reza angustiado, mas, ao voltar, encontra os discípulos dormindo. Então pede: vigiem e rezem, porque todos somos fracos.",
med:["Todos somos frágeis. Há tentações que rondam qualquer casamento: a indiferença, a pornografia, o vício, a comparação, a amizade que vai longe demais. Ninguém está imune, nem ele, nem você.","A oração da esposa é um escudo para o marido. E o casal se protege também com atitudes: transparência, tempo juntos, cuidado com o que entra pelo celular e pela TV."],
perg:"Que tentação ou perigo mais ameaça o nosso casamento hoje? E a mim?",
des:"Reze hoje a oração a São Miguel Arcanjo pelo seu esposo e pelo seu casamento. Se for o caso, escolha uma atitude concreta de proteção para você (um aplicativo, uma conversa, um hábito).",
ora:"São Miguel Arcanjo, defendei o nosso casamento no combate. Senhor, protege o meu esposo e a mim de toda tentação e de todo mal. Amém."},

{t:"Uma só carne",ref:"Mc 10,6-9",v:"Já não são dois, mas uma só carne. Portanto, o que Deus uniu o homem não separe.",
exp:"Os fariseus perguntam a Jesus se é permitido ao homem despedir a mulher. Jesus volta ao início da criação: Deus fez o homem e a mulher, e os dois se tornam uma só carne. O matrimônio não é um contrato que se desfaz quando cansa: é uma união feita por Deus.",
med:["Ser um só não é pensar igual em tudo nem gostar das mesmas coisas. É caminhar na mesma direção, mesmo com jeitos diferentes. É dizer “nós” mais do que “eu”.","A unidade se constrói nos pequenos “nós”: “vamos resolver juntos”, “nossa família”, “nosso dinheiro”, “nosso sonho”. Cada vez que dizemos “nós”, damos um ponto a mais na costura de Deus."],
perg:"Em que área do nosso casamento estamos vivendo mais como “dois” do que como “um”?",
des:"Hoje, proponha ao seu esposo fazerem algo juntos que normalmente cada um faz sozinho: arrumar a cozinha, fazer o mercado, levar os filhos, caminhar. Ao final, agradeça pela companhia.",
ora:"Senhor, o que Tu uniste ninguém separe. Faz de nós uma só carne, um só coração, uma só direção. Amém."},

{t:"Honrar um ao outro",ref:"Rm 12,9-13",v:"Amai-vos uns aos outros com amor fraterno; adiantai-vos em honrar uns aos outros.",
exp:"São Paulo descreve como é o amor verdadeiro: sem fingimento, que detesta o mal e se apega ao bem. E dá um conselho surpreendente: competir para ver quem honra mais o outro. Ser alegre na esperança, paciente na tribulação e perseverante na oração.",
med:["Honrar é valorizar o outro em público e em particular. Um elogio ao seu esposo diante dos filhos vale ouro, e uma crítica diante deles fere fundo.","Muitos homens se sentem pouco admirados dentro de casa. Quando a esposa reconhece o valor dele, ele cresce. A honra é como água para a planta: faz florescer o melhor que existe."],
perg:"Como eu tenho falado do meu esposo para os filhos, para a família e para as amigas?",
des:"Hoje, elogie o seu esposo diante dos filhos ou de alguém da família, por algo concreto. E, se você costuma reclamar dele com alguém, decida não fazer isso nesta semana.",
ora:"Senhor, ensina-me a honrar o meu esposo com as minhas palavras e atitudes. Que a nossa casa seja lugar de respeito e admiração. Amém."},

{t:"Tempo de rir",ref:"Ecl 3,1-8",v:"Há tempo de chorar e tempo de rir; tempo de gemer e tempo de dançar.",
exp:"Coélet escreve um poema famoso: para tudo há um tempo debaixo do céu. Tempo de plantar e de colher, de chorar e de rir, de calar e de falar. A vida tem estações, e cada uma tem o seu valor.",
med:["Casamentos também precisam de risadas. Quando a rotina pesa, as conversas viram só contas, problemas e tarefas. A leveza protege o amor e lembra por que vocês se escolheram.","O livro dos Provérbios diz que coração alegre é bom remédio (Pr 17,22). Que hoje seja um tempo de rir, mesmo que a estação esteja difícil."],
perg:"Quando foi a última vez que eu e o meu esposo rimos juntos de verdade?",
des:"Relembrem juntos uma história engraçada do namoro ou do começo do casamento. Ou vejam fotos antigas. Se puder, prepare uma surpresa leve: a comida preferida dele, um filme de comédia.",
ora:"Senhor, devolve a alegria à nossa casa. Que saibamos rir juntos, mesmo nos dias difíceis. Amém."},

{t:"As finanças da casa",ref:"Mt 6,25-34",v:"Buscai em primeiro lugar o Reino de Deus e a sua justiça, e todas essas coisas vos serão dadas por acréscimo.",
exp:"No Sermão da Montanha, Jesus fala da ansiedade com o comer, o beber e o vestir. Ele aponta para os pássaros e os lírios do campo: o Pai cuida deles. E conclui: não fiquem aflitos com o amanhã; busquem primeiro o Reino e o resto virá.",
med:["Dinheiro é um dos maiores motivos de brigas no casamento: dívidas escondidas, gastos diferentes, medo do futuro. Jesus não pede irresponsabilidade, pede confiança e prioridade certa.","Quando o casal coloca as finanças diante de Deus e conversa com transparência, o dinheiro deixa de ser motivo de briga e passa a ser motivo de união e de partilha."],
perg:"Como eu e o meu esposo conversamos sobre dinheiro? Há algo que eu escondo ou que me angustia?",
des:"Proponha ao seu esposo uma conversa tranquila sobre as finanças da casa, sem acusações, começando com uma oração. Se a conversa ainda não for possível, escreva as preocupações e entregue-as a Deus.",
ora:"Pai, Tu cuidas dos pássaros e dos lírios. Cuida também da nossa casa. Dá-nos sabedoria, transparência e confiança em Ti. Amém."},

{t:"Carinho e intimidade",ref:"Ct 8,6-7",v:"As muitas águas não podem apagar o amor, nem os rios afogá-lo.",
exp:"O Cântico dos Cânticos é um poema de amor entre um noivo e uma noiva. A Igreja vê nele também o amor de Deus pelo seu povo. No final, a amada pede: “Põe-me como selo sobre o teu coração”, porque o amor é forte como a morte.",
med:["O carinho é linguagem de Deus dentro do casamento. A intimidade do casal, em todas as suas formas, é sagrada e foi abençoada por Ele. Não é algo de menos valor na vida de fé.","Com os filhos, as contas e o cansaço, o toque vai sumindo. Pequenos gestos mantêm a chama: um abraço demorado, segurar a mão, um beijo de verdade na despedida. As muitas águas do dia a dia não precisam apagar o amor."],
perg:"Que gestos de carinho foram desaparecendo da nossa rotina?",
des:"Hoje, dê ao seu esposo um abraço demorado, de pelo menos 20 segundos, sem motivo especial. Despeça-se e receba-o com um beijo de verdade.",
ora:"Senhor, Tu abençoaste o amor entre homem e mulher. Reacende o carinho e a ternura entre nós. Põe-nos como selo no coração um do outro. Amém."},

{t:"Decidir juntos",ref:"Fl 2,1-5",v:"Tende um mesmo sentir, um mesmo amor, uma só alma e um só pensamento.",
exp:"São Paulo pede que a comunidade viva em unidade: que ninguém aja por rivalidade ou vaidade, e que cada um não olhe só para os próprios interesses, mas também para os dos outros. E dá o modelo: ter os mesmos sentimentos de Cristo Jesus.",
med:["Decidir juntos dá trabalho, pede conversa e às vezes abrir mão. Mas constrói confiança. Quando um decide sempre sozinho, o outro se sente de fora, e quando tudo é imposto, nasce a rivalidade.","Ter os sentimentos de Cristo é buscar o que é bom para os dois, e não ganhar a discussão."],
perg:"Que decisão importante está pendente entre nós? Eu tenho ouvido o que ele pensa?",
des:"Escolham juntos algo simples para decidir hoje (o cardápio do fim de semana, um passeio, uma compra). Antes de dar a sua opinião, pergunte e ouça a dele.",
ora:"Senhor, dá-nos um mesmo sentir e um só pensamento. Que as nossas decisões sejam tomadas juntos, contigo no meio. Amém."},

{t:"O pai dos meus filhos",ref:"Sl 103(102),8-14",v:"Como um pai tem compaixão de seus filhos, o Senhor tem compaixão dos que o temem.",
exp:"O salmo canta a bondade de Deus: Ele é clemente, compassivo, lento para a ira e rico em amor. Não nos trata segundo os nossos pecados. E compara o seu amor ao de um pai que tem compaixão dos filhos, porque sabe de que barro somos feitos.",
med:["O seu esposo também está aprendendo a ser pai, muitas vezes sem ter tido um bom exemplo. Ele erra, como você erra como mãe. Deus olha para os dois com compaixão.","Quando a mãe apoia o pai diante dos filhos, a autoridade dele cresce e as crianças se sentem seguras. E quando você reza por ele como pai, Deus o forma no amor paterno. Se ainda não têm filhos, reze pelo pai que ele será."],
perg:"Como eu tenho apoiado o meu esposo como pai? Eu o corrijo diante das crianças?",
des:"Hoje, diga ao seu esposo uma coisa que você admira nele como pai (ou que vai admirar). Peça aos filhos que façam um bilhetinho ou um desenho para ele.",
ora:"Pai do céu, ensina o meu esposo a ser pai como Tu és: firme, paciente e cheio de amor. Abençoa a relação dele com os nossos filhos. Amém."},

{t:"Revestidas de humildade",ref:"1Pd 5,5-7",v:"Revesti-vos todos de humildade uns para com os outros. Lançai sobre ele toda a vossa preocupação, pois ele cuida de vós.",
exp:"São Pedro pede aos cristãos que se revistam de humildade, porque Deus resiste aos soberbos e dá a graça aos humildes. Quem se humilha debaixo da mão de Deus será exaltado no tempo certo. E termina com uma consolação: entreguem a Ele as preocupações, porque Ele cuida.",
med:["Querer sempre ter razão cansa o casamento. A humildade é saber dizer “você tem razão”, “eu errei”, “me desculpe” e também “eu não sei”.","Humildade não é se diminuir nem aceitar desrespeito. É deixar de lado o orgulho que transforma toda conversa numa disputa. Deus dá a graça a quem se faz pequeno."],
perg:"Em que assunto eu sempre preciso ter a última palavra com o meu esposo?",
des:"Hoje, reconheça uma vez, em voz alta, que ele tem razão em algo. Se você errou recentemente, peça desculpas de forma simples, sem “mas”.",
ora:"Senhor, reveste-me de humildade. Tira de mim o orgulho que fere o nosso amor e dá-me a tua graça. Amém."},

{t:"Palavras que constroem",ref:"Ef 4,25-32",v:"Nenhuma palavra má saia da vossa boca, mas só a que for boa para edificar.",
exp:"São Paulo pede que os cristãos deixem a mentira, não deixem o sol se pôr sobre a ira e não deem lugar ao demônio. Que de sua boca saiam palavras que edificam e fazem bem a quem ouve. E termina: sede bondosos e compassivos uns com os outros, perdoando-vos.",
med:["As palavras constroem ou derrubam uma casa. Uma frase dita com raiva pode ficar anos no coração do outro. E um elogio sincero também.","Repare hoje no seu tom de voz, nas ironias, nas comparações. Antes de falar, pergunte: isso que vou dizer edifica?"],
perg:"Que palavra ou tom meu tem ferido o meu esposo, mesmo sem eu perceber?",
des:"Faça hoje o “jejum de críticas”: nenhuma crítica, ironia ou reclamação ao seu esposo durante o dia. Troque cada uma por uma palavra gentil.",
ora:"Senhor, coloca guarda na minha boca. Que as minhas palavras edifiquem o meu esposo e a nossa casa. Amém."},

{t:"Deus faz uma coisa nova",ref:"Is 43,16-21",v:"Não vos lembreis das coisas passadas. Eis que faço uma coisa nova; ela já está brotando, não percebeis?",
exp:"Deus lembra ao povo que Ele abriu caminho no mar e libertou Israel do Egito. Mas pede: não fiquem presos ao passado. Ele vai fazer algo novo: abrir caminho no deserto e rios na terra seca.",
med:["Todo casamento tem feridas antigas: palavras ditas, traições, decepções, anos difíceis. Às vezes vivemos olhando para trás, cobrando o que passou.","Deus é especialista em começar de novo. Ele não apaga a história, mas cura e faz brotar algo novo. Peça a Ele olhos para perceber o novo que já está brotando entre vocês."],
perg:"Que ferida do passado ainda pesa no nosso casamento? Estou disposta a deixar Deus curar?",
des:"Escreva uma carta para Deus entregando uma ferida do passado do casamento. Não precisa mostrar a ninguém. No final, escreva: “Senhor, faz uma coisa nova”. Se a ferida for muito profunda, considere procurar ajuda de um padre ou de um terapeuta.",
ora:"Senhor, Tu fazes novas todas as coisas. Cura as feridas do nosso passado e faz brotar algo novo no nosso casamento. Amém."},

{t:"Rezar a dois",ref:"Mt 18,19-20",v:"Onde dois ou três estiverem reunidos em meu nome, eu estou ali, no meio deles.",
exp:"Jesus faz uma promessa: se dois na terra estiverem de acordo para pedir qualquer coisa, o Pai do céu vai conceder. E onde dois ou três estiverem reunidos em seu nome, Ele está no meio deles.",
med:["A oração do casal tem uma força especial: é a oração de uma “igreja doméstica”. Mas muitos casais católicos nunca rezaram juntos, por vergonha ou falta de costume.","Pode ser bem simples: um Pai-Nosso de mãos dadas antes de dormir, uma bênção antes da refeição. O importante não é rezar bonito, é rezar juntos."],
perg:"Eu e o meu esposo já rezamos juntos? O que nos impede?",
des:"Convide o seu esposo para rezarem juntos um Pai-Nosso antes de dormir, de mãos dadas. Se ele ainda não quiser, reze você baixinho ao lado dele, sem cobrar.",
ora:"Jesus, Tu prometeste estar no meio de nós. Vem morar na oração do nosso casal e faz da nossa casa uma pequena igreja. Amém."},

{t:"Servir com amor",ref:"Jo 13,1-15",v:"Se eu, o Senhor e Mestre, vos lavei os pés, também vós deveis lavar os pés uns dos outros.",
exp:"Na Última Ceia, Jesus se levanta, tira o manto, pega uma toalha e lava os pés dos discípulos, um serviço de escravo. Pedro não quer aceitar. Jesus explica que deu o exemplo: assim como Ele fez, devemos fazer uns aos outros.",
med:["Servir não é ser menos. Jesus, o Senhor, se ajoelhou. No casamento, servir é a linguagem mais concreta do amor, mas ela só tem valor quando é livre, e não cobrança ou moeda de troca.","Muitas vezes servimos reclamando, ou contando o que fizemos. Hoje, sirva escondido, como Jesus: sem esperar elogio."],
perg:"Eu sirvo o meu esposo com alegria ou com cobrança? O que ele mais valoriza que eu faça por ele?",
des:"Faça hoje algo que o seu esposo gosta, sem ele pedir e sem comentar depois: o café do jeito dele, a roupa separada, um prato especial, um recado carinhoso na marmita.",
ora:"Jesus, que lavaste os pés dos teus amigos, ensina-me a servir o meu esposo com alegria e humildade. Amém."},

{t:"Descansar juntos",ref:"Mc 6,30-32",v:"Vinde vós, sozinhos, para um lugar deserto, e descansai um pouco.",
exp:"Os apóstolos voltam da missão e contam a Jesus tudo o que fizeram. Era tanta gente indo e vindo que eles nem tinham tempo para comer. Então Jesus os chama para um lugar tranquilo, só com Ele, para descansar.",
med:["Jesus se preocupava com o cansaço dos amigos. O casal também precisa de pausa: tempo só os dois, sem filhos, sem tarefas, sem celular. Isso não é egoísmo, é investimento no amor.","Muitos casais só conversam sobre problemas e logística. Descansar juntos é lembrar que vocês são, antes de tudo, um casal que se ama."],
perg:"Quando foi o último momento em que eu e o meu esposo ficamos juntos só por estar, sem tarefas?",
des:"Combinem um momento de descanso a dois nesta semana: um café, uma caminhada, um filme depois que as crianças dormirem. Desliguem os celulares durante esse tempo.",
ora:"Jesus, chama-nos para descansar contigo. Renova o nosso amor nos momentos de pausa e de alegria a dois. Amém."},

{t:"Amigos de verdade",ref:"Jo 15,12-17",v:"Já não vos chamo servos, mas amigos.",
exp:"Na Última Ceia, Jesus deixa o seu mandamento: amai-vos uns aos outros como eu vos amei. E diz que não existe amor maior do que dar a vida pelos amigos. Ele chama os discípulos de amigos, porque contou a eles tudo o que ouviu do Pai.",
med:["O casamento é a amizade mais profunda que existe. Amigos se apoiam nas quedas, contam segredos, torcem um pelo outro, gostam de estar juntos.","Com o tempo, alguns casais viram sócios da casa e deixam de ser amigos. Hoje, reconquiste a amizade: interesse-se pelo que ele gosta, conte o que vai no seu coração."],
perg:"Eu sou amiga do meu esposo? O que ele gosta de fazer que eu poderia compartilhar com ele?",
des:"Pergunte ao seu esposo sobre algo que ele gosta (um time, um hobby, um sonho) e mostre interesse de verdade. Conte a ele algo seu que você não tem contado.",
ora:"Jesus, amigo fiel, faz de nós amigos de verdade, que se apoiam, se escutam e gostam de caminhar juntos. Amém."},

{t:"Fidelidade nos detalhes",ref:"Os 2,16-22",v:"Eu te desposarei para sempre; eu te desposarei na justiça e no direito, no amor e na ternura.",
exp:"O profeta Oseias usa a própria história, com uma esposa infiel, para falar do amor de Deus pelo seu povo. Mesmo traído, Deus não desiste: Ele leva o povo ao deserto, fala ao seu coração e renova a aliança para sempre, com fidelidade.",
med:["A fidelidade de Deus é o modelo da nossa. Ela não é só não trair: é se dar por inteiro, todos os dias, nos detalhes. No olhar, nas conversas, nas amizades, no celular, no pensamento.","Fidelidade também é cumprir as pequenas promessas: chegar na hora combinada, fazer o que disse que faria, guardar os segredos do outro."],
perg:"Em que pequenos detalhes eu posso ser mais fiel ao meu esposo?",
des:"Reze hoje pela fidelidade de vocês dois. Escolha uma pequena promessa feita ao seu esposo que você deixou de cumprir e cumpra hoje.",
ora:"Senhor, Tu és fiel para sempre. Guarda a nossa fidelidade no amor e na ternura, nos grandes e nos pequenos detalhes. Amém."},

{t:"Paz nas discussões",ref:"Mt 5,21-24",v:"Vai primeiro reconciliar-te com o teu irmão, e depois vem apresentar a tua oferta.",
exp:"No Sermão da Montanha, Jesus ensina que não basta não matar: a raiva e as palavras de desprezo também ferem. Se você está levando sua oferta ao altar e lembra que alguém tem algo contra você, deixe a oferta e vá primeiro fazer as pazes.",
med:["Discordar é normal e até saudável. O que fere é o jeito de discutir: gritos, desprezo, silêncio que pune, dormir com raiva. São Paulo também pede: “não se ponha o sol sobre a vossa ira” (Ef 4,26).","Jesus coloca a reconciliação acima até da oferta no altar. Para Deus, a paz entre vocês importa mais do que muitas orações feitas com o coração fechado."],
perg:"Como eu costumo agir numa discussão? Há algo pendente entre nós que precisa de paz?",
des:"Se houver algo mal resolvido, dê hoje o primeiro passo para a reconciliação. Combinem uma “regra de paz”: nunca dormir sem fazer as pazes, nem que seja com um “eu te amo, amanhã conversamos”.",
ora:"Jesus, Príncipe da Paz, ensina-nos a discordar sem ferir e a fazer as pazes antes do pôr do sol. Amém."},

{t:"Sonhar juntos",ref:"Pr 16,1-9",v:"Confia ao Senhor as tuas obras, e os teus projetos se realizarão.",
exp:"O livro dos Provérbios reúne conselhos de sabedoria. Este trecho lembra que o ser humano faz planos, mas é o Senhor quem dirige os passos. Quem entrega a Deus o que faz vê os projetos firmarem-se.",
med:["Casais que sonham juntos caminham na mesma direção. Sonhos podem ser grandes (uma casa, filhos, uma mudança) ou pequenos (uma viagem, um jantar fora, aprender algo juntos).","Deus gosta de participar dos nossos planos. Quando o casal sonha diante dele, os sonhos ficam mais puros e a caminhada mais leve."],
perg:"Quais sonhos eu e o meu esposo temos em comum? Algum foi esquecido no caminho?",
des:"Conversem hoje sobre três sonhos para os próximos anos. Escrevam juntos numa folha e rezem entregando-os a Deus.",
ora:"Senhor, confiamos a Ti os nossos sonhos e projetos. Dirige os nossos passos e faz-nos caminhar juntos na tua vontade. Amém."},

{t:"A família dele e a minha",ref:"Rt 1,14-18",v:"Aonde fores, irei; onde habitares, habitarei; o teu povo será o meu povo, e o teu Deus será o meu Deus.",
exp:"Noemi perdeu o marido e os filhos e decide voltar para a sua terra. Pede às noras que voltem para as famílias delas. Uma vai, mas Rute fica: ela abraça a sogra e promete segui-la para onde for. Rute se torna bisavó do rei Davi.",
med:["Sogros, cunhados, famílias com costumes diferentes: muitas tensões do casamento vêm daí. A história de Rute mostra que é possível amar a família do outro e ser amada por ela.","Amar a família dele não é deixar que ela mande no casal. É honrar, rezar e construir pontes, mantendo o casal como prioridade."],
perg:"Como está a minha relação com a família do meu esposo? Há alguém de quem eu preciso me aproximar ou perdoar?",
des:"Reze hoje, pelo nome, pelos sogros e cunhados. Faça um gesto de carinho para a família dele: uma ligação, uma mensagem, um convite.",
ora:"Senhor, abençoa a família do meu esposo e a minha. Dá-nos paz, respeito e amor entre todos. Amém."},

{t:"O vinho bom do matrimônio",ref:"Jo 2,1-11",v:"Fazei tudo o que ele vos disser.",
exp:"Numa festa de casamento em Caná, o vinho acaba. Maria percebe e avisa Jesus. Depois diz aos empregados: “Fazei tudo o que ele vos disser”. Jesus transforma seis talhas de água em vinho, e o melhor vinho foi servido por último. Foi o seu primeiro milagre.",
med:["Jesus fez o primeiro milagre num casamento. No matrimônio, Ele está presente como num sacramento: o casal recebe uma graça especial para se amar.","Quando o “vinho” acaba, quando a alegria e o amor parecem secos, Maria está atenta e intercede. E Jesus ainda transforma água em vinho, se fizermos o que Ele disser."],
perg:"Onde o “vinho” acabou no nosso casamento? Eu já pedi a Maria que interceda?",
des:"Releia a data do seu casamento e, se puder, veja as fotos ou o vídeo. Reze uma dezena do terço pedindo a Maria que interceda pelo vinho novo no seu casamento.",
ora:"Maria, Tu que percebeste que o vinho acabou, olha para o nosso casamento. Jesus, transforma a nossa água em vinho bom. Amém."},

{t:"Sob a proteção da Sagrada Família",ref:"Lc 2,41-52",v:"Teu pai e eu, aflitos, te procurávamos.",
exp:"Aos doze anos, Jesus vai com Maria e José a Jerusalém para a Páscoa. Na volta, eles percebem que o menino ficou para trás. Procuram-no aflitos durante três dias, até encontrá-lo no Templo. Maria guarda tudo no coração.",
med:["Maria e José também passaram por angústias: uma gravidez inesperada, uma viagem difícil, a fuga para o Egito, a perda do filho em Jerusalém. Eles não tinham uma vida perfeita, mas estavam unidos em Deus.","Repare: “teu pai e eu”. Eles procuraram juntos. A Sagrada Família entende as nossas dificuldades e é modelo e protetora de todos os casais."],
perg:"Que angústia eu e o meu esposo estamos vivendo e precisamos colocar nas mãos de Maria e José?",
des:"Coloque uma imagem ou estampa da Sagrada Família num lugar de destaque da casa e consagre o seu casamento a ela com a oração de hoje.",
ora:"Jesus, Maria e José, eu vos dou o coração e a alma. Protegei o nosso casamento e a nossa família. Sagrada Família de Nazaré, rogai por nós. Amém."},

{t:"Renovar o sim",ref:"1Cor 13,4-13",v:"O amor tudo desculpa, tudo crê, tudo espera, tudo suporta. O amor jamais passará.",
exp:"São Paulo escreve o hino ao amor: o amor é paciente, é bondoso, não é invejoso nem orgulhoso, não procura o próprio interesse, não guarda rancor. Tudo vai passar, mas o amor permanece. Entre a fé, a esperança e o amor, o maior é o amor.",
med:["Depois de 30 dias, é hora de olhar para o caminho. Talvez muita coisa tenha mudado; talvez pouco. Mas você trançou o terceiro fio, dia após dia, e Deus agiu, mesmo onde você não viu.","No dia do casamento vocês disseram “sim”. Hoje é dia de renovar esse sim, não às emoções do começo, mas ao amor que escolhe, persevera e espera."],
perg:"O que mudou em mim e no meu casamento nestes 30 dias? Qual é o meu “sim” de hoje?",
des:"Renove, em oração, as promessas do seu casamento: “Eu te recebo e prometo ser fiel, amar-te e respeitar-te, na alegria e na tristeza, na saúde e na doença, todos os dias da minha vida”. Se ele aceitar, rezem juntos. Escreva uma carta de amor para ele.",
ora:"Senhor, eu renovo hoje o meu sim. Obrigada por estes 30 dias. Continua a cuidar do nosso casamento, porque o amor jamais passará. Amém."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="casamento30"){PLANOS[i].d=D;PLANOS[i].resumo="Um mês inteiro colocando o seu casamento nas mãos de Deus. Cada dia traz uma leitura da Bíblia explicada, uma meditação, um espaço para escrever e um desafio concreto para viver com o seu esposo.";}}
})();

// Planos curtos (parte 1): ano novo, paz, amada por Deus, oração em família. Versão completa.
(function(){
var P={};

P.anonovo7={ini:"2027-01-01",resumo:"Uma semana, de 1º a 7 de janeiro, para olhar para trás com gratidão e planejar 2027 com Deus no centro, seguindo também as festas da Igreja. Cada dia traz uma leitura explicada, uma meditação, um espaço para escrever e um desafio.",d:[
{t:"Entregar o ano à bênção de Deus",cel:"Santa Maria, Mãe de Deus (solenidade) · Dia Mundial da Paz",
aviso:"Dia de preceito no Brasil: participe da Santa Missa. Comece o ano aos pés de Nossa Senhora, Mãe de Deus.",
tipo:"1ª leitura",ref:"Nm 6,22-27",v:"O Senhor te abençoe e te guarde! O Senhor faça brilhar sobre ti a sua face e te conceda a paz.",
exp:"No primeiro dia do ano, a Igreja lê a bênção que Deus ensinou a Moisés para os sacerdotes darem ao povo. E celebra Maria como Mãe de Deus: no Evangelho (Lc 2,16-21), os pastores encontram o Menino com Maria e José, e Maria guarda tudo no coração.",
med:["Antes de qualquer meta, entregamos o ano inteiro nas mãos de Deus e debaixo do manto de Maria. Não sabemos o que 2027 vai trazer, mas sabemos quem vai caminhar conosco.","Maria guardava tudo no coração. Que este ano você também aprenda a guardar e meditar o que Deus fizer na sua vida, dia após dia."],
perg:"O que eu quero entregar a Deus no começo deste ano?",
des:"Reúna a família e abençoe cada pessoa com a bênção de Números, fazendo o sinal da cruz na testa. Escreva no topo de uma folha: “2027 é teu, Senhor” e guarde na Bíblia ou no planner.",
ora:"Santa Maria, Mãe de Deus, eu te consagro este ano. Senhor, abençoa-nos, guarda-nos e dá-nos a tua paz em 2027. Amém."},

{t:"Até aqui o Senhor nos ajudou",cel:"São Basílio Magno e São Gregório Nazianzeno (memória)",
ref:"1Sm 7,7-12",v:"Samuel tomou uma pedra e chamou-a Ebenézer, dizendo: Até aqui o Senhor nos ajudou.",
exp:"Os filisteus atacam Israel. O povo, com medo, pede a Samuel que não pare de rezar. Samuel oferece um sacrifício e clama ao Senhor, e Deus responde. Depois da vitória, Samuel coloca uma pedra como memorial e lhe dá o nome de Ebenézer, “pedra do socorro”: até aqui o Senhor nos ajudou.",
med:["Olhar para trás com gratidão mostra quantas vezes Deus nos sustentou, até nos momentos em que achamos que não íamos conseguir. A memória das vitórias de Deus dá coragem para o que vem.","Hoje, levante a sua pedra de Ebenézer: um sinal para lembrar que Deus esteve com você em 2026."],
perg:"Em que momentos de 2026 eu vi Deus me ajudar?",
des:"Liste pelo menos cinco momentos de 2026 em que Deus te ajudou. Escolha uma pedrinha (ou um objeto) e escreva nela “Ebenézer” ou “Até aqui”. Deixe num lugar visível o ano todo.",
ora:"Senhor, até aqui Tu nos ajudaste. Obrigada por cada socorro de 2026. Confio que continuarás conosco. Amém."},

{t:"Seguir a estrela",cel:"Epifania do Senhor (solenidade)",
aviso:"Domingo é dia de preceito: participe da Santa Missa. Hoje a Igreja celebra a Epifania: Jesus se manifesta a todos os povos.",
tipo:"Evangelho",ref:"Mt 2,1-12",v:"Vimos a sua estrela no Oriente e viemos adorá-lo.",
exp:"Magos vindos do Oriente seguem uma estrela até Jerusalém e perguntam onde está o rei que nasceu. Herodes fica perturbado. A estrela os conduz até Belém, onde encontram o Menino com Maria. Eles se ajoelham, adoram e oferecem ouro, incenso e mirra. Depois, avisados em sonho, voltam por outro caminho.",
med:["Os Magos fizeram uma longa viagem por causa de uma estrela. Eles não tinham todas as respostas, mas tinham um rumo. E quando encontraram Jesus, voltaram “por outro caminho”: o encontro mudou a direção deles.","Que estrela vai guiar o seu ano? Metas são boas, mas o mais importante é a direção: ir até Jesus e deixar que Ele mude o caminho."],
perg:"Que estrela eu quero seguir em 2027? Que caminho eu preciso mudar depois de encontrar Jesus?",
des:"Monte com a família os três presentes dos Magos em papel: ouro (o que temos de melhor), incenso (a nossa oração) e mirra (os nossos sacrifícios). Cada um escreve o que quer oferecer a Jesus neste ano e coloca perto do presépio.",
ora:"Jesus, guia-me como a estrela guiou os Magos. Que eu te encontre, te adore e volte por um caminho novo. Amém."},

{t:"Metas com Deus",cel:"Segunda-feira depois da Epifania",
ref:"Lc 14,28-30",v:"Qual de vós, querendo construir uma torre, não se senta primeiro para calcular os gastos?",
exp:"Jesus usa uma imagem bem prática: quem quer construir uma torre primeiro faz as contas, para não começar e deixar pela metade. Ele fala do discipulado: seguir Jesus é uma decisão séria, que precisa ser pensada. O livro dos Provérbios completa: “Confia ao Senhor as tuas obras, e os teus projetos se realizarão” (Pr 16,3).",
med:["Planejar não é falta de fé. Jesus mesmo elogia quem senta e faz as contas. O que muda é com quem planejamos: com Deus no centro, as metas ficam mais verdadeiras e mais leves.","Metas demais cansam e frustram. Escolha poucas, possíveis, que façam bem à sua alma, à sua família e ao seu corpo."],
perg:"Quais são as três metas mais importantes para mim em 2027?",
des:"Escreva no seu planner três metas para 2027: uma para a sua vida com Deus, uma para a família e uma para você. Para cada uma, escreva o primeiro passo concreto.",
ora:"Senhor, eu te entrego os meus projetos para 2027. Ajuda-me a planejar com sabedoria e a seguir a tua vontade. Amém."},

{t:"A família em 2027",cel:"Terça-feira depois da Epifania",
ref:"Cl 3,12-17.20-21",v:"Acima de tudo, revesti-vos do amor, que é o vínculo da perfeição.",
exp:"São Paulo descreve como deve ser a vida de uma família cristã: misericórdia, bondade, humildade, paciência, perdão. Pede que a paz de Cristo reine nos corações e que a Palavra de Deus habite neles. E fala aos filhos, para que obedeçam aos pais, e aos pais, para que não irritem os filhos.",
med:["Que tipo de família vocês querem ser em 2027? Não se trata de perfeição, mas de direção: mais paz, mais oração, mais tempo juntos, menos gritos.","A família é o lugar onde se aprende, na prática, a vestir a “roupa” do amor que Paulo descreve."],
perg:"O que eu desejo para a minha família em 2027? O que depende de mim?",
des:"Reúna a família e pergunte a cada um: “O que você quer que a nossa família faça mais em 2027?”. Escolham juntos um compromisso (rezar juntos, um passeio por mês, um jantar sem celular).",
ora:"Senhor, abençoa a nossa família em 2027. Que a tua paz reine em nossos corações e o teu amor nos una. Amém."},

{t:"Uma rotina de oração",cel:"Quarta-feira depois da Epifania",
tipo:"Evangelho",ref:"Mc 6,45-52",v:"Depois de se despedir deles, Jesus foi ao monte para rezar.",
exp:"Depois da multiplicação dos pães, Jesus manda os discípulos atravessarem o lago e sobe ao monte para rezar sozinho. À noite, vê os discípulos lutando contra o vento e vai até eles andando sobre as águas. Diz: “Coragem! Sou eu. Não tenhais medo”. Ele sobe no barco e o vento se acalma.",
med:["Mesmo com a multidão o procurando, Jesus separava tempo para rezar. Se até Jesus precisava desse momento a sós com o Pai, quanto mais nós.","Uma rotina de oração não precisa ser longa: 5 minutos por dia, num horário fixo, já mudam o ano. Foi do monte da oração que Jesus viu os discípulos em perigo e foi até eles."],
perg:"Qual é o melhor momento do meu dia para rezar com constância?",
des:"Escolha um horário e um lugar fixos para o seu momento com Deus em 2027. Coloque um alarme no celular com o nome “Meu momento com Deus” e comece hoje.",
ora:"Senhor, ensina-me a subir ao monte para rezar todos os dias. Que a oração seja o centro da minha rotina em 2027. Amém."},

{t:"Seguir em frente",cel:"Quinta-feira depois da Epifania",
ref:"Fl 3,7-14",v:"Esquecendo o que fica para trás, lanço-me para o que está à frente.",
exp:"São Paulo diz que tudo o que antes considerava importante agora vale pouco diante do valor de conhecer Jesus. Ele reconhece que ainda não chegou à perfeição, mas corre para a meta, esquecendo o que ficou para trás e avançando para o que está à frente.",
med:["O passado ensina, mas não prende. Erros, frustrações e mágoas de 2026 podem ficar para trás. Deus abre um caminho novo.","Paulo não diz que já chegou: diz que continua correndo. 2027 não precisa ser perfeito; precisa ser vivido com Deus, um passo de cada vez."],
perg:"O que de 2026 eu preciso deixar para trás para seguir em frente?",
des:"Escreva num papel o que você quer deixar em 2026 e rasgue. Depois escreva uma frase de esperança para 2027 e coloque na primeira página do seu planner.",
ora:"Senhor, eu deixo para trás o que passou e avanço contigo para o que está à frente. Abençoa o meu 2027. Amém."}
]};

P.paz7={resumo:"Para os dias de preocupação e ansiedade: uma semana aprendendo a entregar tudo nas mãos de Deus. Cada dia traz uma leitura explicada, uma meditação, um espaço para escrever e um pequeno exercício de paz.",d:[
{t:"Lançar o fardo no Senhor",ref:"Sl 55(54),17-23",v:"Lança sobre o Senhor o teu fardo, e ele te sustentará.",
exp:"O salmista está angustiado: inimigos o perseguem e até um amigo o traiu. Ele clama a Deus de manhã, ao meio-dia e à tarde. E chega a uma certeza: Deus ouve e sustenta quem lança sobre Ele o seu peso.",
med:["Muitas vezes carregamos sozinhas pesos que não foram feitos para nós: o futuro dos filhos, as contas, a saúde de alguém, o que os outros pensam.","Lançar o fardo não é fugir da responsabilidade; é reconhecer que Deus pode carregar o que eu não posso."],
perg:"Que fardo eu tenho carregado sozinha e preciso lançar sobre o Senhor?",
des:"Escreva numa folha todas as preocupações que vierem à mente. Leia cada uma e diga: “Senhor, isto é teu”. Depois dobre a folha e coloque dentro da Bíblia.",
ora:"Senhor, eu lanço sobre Ti o meu fardo. Sustenta-me e dá-me a tua paz. Amém."},

{t:"Só o pão de hoje",ref:"Ex 16,4.13-21",v:"Farei chover pão do céu. Cada um recolherá a porção de cada dia.",
exp:"No deserto, o povo de Israel tem fome. Deus manda o maná, um pão que aparece toda manhã. Mas há uma regra: cada um recolhe só o suficiente para o dia. Quem tenta guardar para o dia seguinte encontra o maná estragado.",
med:["A ansiedade quer garantir o amanhã hoje. Deus ensinou o povo a confiar um dia de cada vez: amanhã haverá maná de novo.","Jesus nos ensinou a pedir “o pão nosso de cada dia”. Hoje você só precisa da graça de hoje. A de amanhã chegará amanhã."],
perg:"Que preocupação com o amanhã está roubando o meu hoje?",
des:"Hoje, sempre que a mente correr para o futuro, diga: “Só o pão de hoje, Senhor”. Faça uma lista só com o que precisa ser feito hoje.",
ora:"Pai, dá-me hoje o pão de hoje. Ensina-me a confiar um dia de cada vez. Amém."},

{t:"Respirar a paz de Jesus",ref:"Jo 20,19-22",v:"A paz esteja convosco. E, dizendo isso, soprou sobre eles: Recebei o Espírito Santo.",
exp:"Na tarde da Ressurreição, os discípulos estão trancados em casa, com medo. Jesus entra, fica no meio deles e diz: “A paz esteja convosco”. Mostra as mãos e o lado, e eles se alegram. Depois sopra sobre eles e dá o Espírito Santo.",
med:["Jesus entrou por portas trancadas pelo medo. Ele pode entrar no seu coração fechado pela ansiedade.","E Ele soprou: deu o Espírito como um respiro. Quando a ansiedade aperta, respirar devagar com uma oração ajuda o corpo e a alma a voltarem para a paz."],
perg:"Onde as portas do meu coração estão trancadas pelo medo?",
des:"Faça hoje três vezes a “oração da respiração”: ao inspirar, diga em pensamento “Jesus”; ao expirar, “eu confio em Ti”. Repita devagar por 2 minutos.",
ora:"Jesus, entra pelas portas trancadas do meu coração. Sopra sobre mim o teu Espírito e deixa a tua paz. Amém."},

{t:"Coragem, sou eu",ref:"Mt 14,22-33",v:"Coragem! Sou eu. Não tenhais medo.",
exp:"Os discípulos estão no barco, de madrugada, com o vento contra. Jesus vem andando sobre as águas. Eles se assustam, achando que é um fantasma. Jesus diz: “Coragem, sou eu”. Pedro pede para ir até Ele e anda sobre as águas, mas, ao olhar o vento, tem medo e começa a afundar. Jesus estende a mão e o segura.",
med:["Pedro afundou quando tirou os olhos de Jesus e olhou para o vento. A ansiedade faz isso: olhamos tanto para o problema que esquecemos quem está conosco.","Mesmo quando afundou, Pedro não ficou sozinho: Jesus estendeu a mão na hora. Você também não está sozinha."],
perg:"Para qual “vento” eu tenho olhado mais do que para Jesus?",
des:"Quando a preocupação vier hoje, faça a oração de Pedro: “Senhor, salva-me!”. Escreva aqui o que aconteceu depois.",
ora:"Jesus, quando eu começar a afundar, estende a tua mão. Que os meus olhos fiquem fixos em Ti, e não no vento. Amém."},

{t:"Cuidar dos pensamentos",ref:"Rm 12,1-2",v:"Não vos conformeis com este mundo, mas transformai-vos pela renovação da vossa mente.",
exp:"São Paulo pede que os cristãos ofereçam a própria vida a Deus e não sigam o modo de pensar do mundo. A transformação começa pela mente: renovar o jeito de pensar para perceber o que Deus quer, o que é bom, agradável e perfeito.",
med:["Muito da ansiedade nasce dos pensamentos que alimentamos: notícias, comparações nas redes, “e se der errado?”. A mente também precisa de cuidado.","Renovar a mente é escolher em que pensar. Não dá para controlar tudo o que aparece, mas dá para não ficar alimentando o que tira a paz."],
perg:"Que pensamentos eu tenho alimentado que roubam a minha paz?",
des:"Faça hoje um “jejum de notícias e redes sociais” por algumas horas. Use esse tempo para ler um salmo, ouvir uma música que acalma ou conversar com alguém querido.",
ora:"Senhor, renova a minha mente. Ensina-me a pensar no que é bom, verdadeiro e bonito. Amém."},

{t:"Gratidão que acalma",ref:"Sl 103(102),1-5",v:"Bendize, ó minha alma, o Senhor, e não esqueças nenhum dos seus benefícios.",
exp:"O salmista conversa com a própria alma e a convida a bendizer a Deus. Pede para não esquecer nenhum bem recebido: o perdão, a cura, a vida resgatada, o amor, a misericórdia, a renovação das forças.",
med:["A ansiedade olha para o que pode dar errado; a gratidão olha para o que Deus já fez. As duas não cabem ao mesmo tempo no mesmo lugar.","Quando lembramos dos benefícios de Deus, o coração se acalma, porque percebe que não está desamparado."],
perg:"Que benefícios de Deus eu tenho esquecido?",
des:"Antes de dormir, escreva dez coisas boas que aconteceram nesta semana, mesmo pequenas. Leia em voz alta, como oração.",
ora:"Bendize, ó minha alma, o Senhor. Obrigada, meu Deus, por tudo o que fizeste por mim. Amém."},

{t:"Deitar em paz",ref:"Sl 4,2.7-9",v:"Em paz me deito e logo adormeço, porque só tu, Senhor, me fazes viver em segurança.",
exp:"Este salmo é uma oração da noite. O salmista pede que Deus o ouça na angústia, lembra que Deus encheu o seu coração de alegria e termina com uma confiança tranquila: pode deitar e dormir em paz, porque está seguro em Deus.",
med:["A noite costuma ser o pior horário para a ansiedade: o silêncio faz os pensamentos ficarem mais altos. Entregar o dia a Deus antes de dormir ajuda o corpo e a alma a descansarem.","Depois destes 7 dias, você não ficou livre de todas as preocupações, mas aprendeu caminhos para voltar à paz. Continue usando cada um deles."],
perg:"O que mudou em mim nestes 7 dias? Qual exercício de paz eu quero manter?",
des:"Crie um pequeno ritual de noite: desligar o celular um pouco antes, rezar o Salmo 4 e entregar o dia a Deus. Comece hoje.",
ora:"Senhor, em paz me deito e logo adormeço, porque só Tu me fazes viver em segurança. Guarda o meu sono e o meu coração. Amém."}
]};

P.amada7={resumo:"Uma semana só para você: lembrar quem você é aos olhos de Deus, antes de ser mãe, esposa ou dona de casa. Cada dia traz uma leitura explicada, uma meditação, um espaço para escrever e um pequeno cuidado com você.",d:[
{t:"Chamada pelo nome",ref:"Jo 20,11-18",v:"Jesus disse: Maria! Ela, voltando-se, disse: Rabûni!",
exp:"No domingo da Ressurreição, Maria Madalena chora junto ao túmulo vazio. Ela vê Jesus, mas não o reconhece; pensa que é o jardineiro. Então Jesus a chama pelo nome: “Maria!”. Na hora ela o reconhece. E Jesus a envia para anunciar aos discípulos que Ele vive.",
med:["Maria Madalena reconheceu Jesus quando ouviu o próprio nome. Deus não te ama como “mais uma”: Ele te chama pelo nome, com carinho pessoal.","Antes de qualquer papel que você exerce (mãe, esposa, filha, profissional), você é alguém que Deus chama pelo nome."],
perg:"Como eu me sinto ao imaginar Jesus me chamando pelo meu nome?",
des:"Leia Jo 20,11-18 e, no lugar de “Maria”, coloque o seu nome. Fique um minuto em silêncio deixando Jesus te chamar.",
ora:"Jesus, Tu me chamas pelo nome. Que eu reconheça a tua voz e me alegre por ser tua. Amém."},

{t:"Até os cabelos estão contados",ref:"Mt 10,29-31",v:"Até os cabelos da vossa cabeça estão todos contados. Não tenhais medo: vós valeis mais do que muitos pardais.",
exp:"Jesus encoraja os discípulos que vão enfrentar dificuldades na missão. Ele lembra que nem um pardal, que valia quase nada no mercado, cai no chão sem que o Pai saiba. E diz: vocês valem muito mais.",
med:["Você não precisa ganhar o amor de Deus. Ele já te ama do jeito que você é, com o cansaço, as falhas e as inseguranças. Até os seus cabelos estão contados.","Num mundo que mede o valor pela aparência, pela produtividade ou pelos likes, Deus lembra: o seu valor está em ser amada por Ele."],
perg:"Onde eu tenho buscado o meu valor? Na aparência, no que faço, na aprovação dos outros?",
des:"Olhe-se no espelho hoje e diga, mesmo que pareça estranho: “Eu sou preciosa para Deus”. Escreva aqui o que você sentiu.",
ora:"Pai, obrigada porque Tu cuidas até dos meus cabelos. Ensina-me a ver o meu valor nos teus olhos. Amém."},

{t:"Deus me ensinou a andar",ref:"Os 11,1-4",v:"Eu os atraía com laços de amor; era para eles como quem levanta uma criança ao rosto.",
exp:"Pelo profeta Oseias, Deus fala do seu povo como de um filho pequeno. Foi Ele quem o ensinou a andar, segurando pelos braços, quem cuidou das suas feridas, quem se inclinou para alimentá-lo. Mesmo quando o povo se afastou, Deus o atraiu com laços de amor.",
med:["Você, que cuida de tanta gente, também é cuidada. Deus se inclina sobre você como uma mãe se inclina sobre o bebê.","Talvez você nem tenha percebido, mas Deus te ensinou a andar em muitas fases da vida: segurou, levantou, alimentou."],
perg:"Em que momento da minha vida eu senti Deus me segurando no colo?",
des:"Separe 10 minutos só para você hoje: um chá, um banho calmo, uma caminhada. Durante esse tempo, deixe-se cuidar por Deus.",
ora:"Senhor, obrigada pelos laços de amor com que me atraíste. Deixa-me descansar no teu colo hoje. Amém."},

{t:"Deus se alegra em você",ref:"Sf 3,14-17",v:"O Senhor, teu Deus, está no meio de ti; ele exulta de alegria por tua causa e te renova com o seu amor.",
exp:"O profeta Sofonias convida Jerusalém a se alegrar, porque Deus tirou dela a condenação. E faz uma afirmação surpreendente: Deus está no meio do seu povo e dança de alegria por causa dele, renovando-o com amor.",
med:["Muitas pessoas imaginam um Deus que olha com cobrança ou decepção. A Palavra de hoje mostra um Deus que olha para você e se alegra, como um pai que vê o filho e sorri.","Você não é um peso para Deus. Você é a alegria dele."],
perg:"Como eu imagino o olhar de Deus sobre mim: de cobrança ou de alegria?",
des:"Escreva Sf 3,17 num papel com o seu nome: “O Senhor exulta de alegria por causa de (seu nome)”. Cole no espelho do banheiro.",
ora:"Senhor, obrigada porque Tu te alegras comigo. Renova-me com o teu amor e ensina-me a me alegrar em Ti. Amém."},

{t:"Não precisa ser perfeita",ref:"Lc 7,36-50",v:"Os seus muitos pecados estão perdoados, porque ela muito amou.",
exp:"Jesus está jantando na casa de um fariseu. Uma mulher conhecida como pecadora entra, chora aos pés de Jesus, enxuga-os com os cabelos e os perfuma. O fariseu se escandaliza. Jesus conta uma parábola sobre o perdão e diz à mulher: “Os teus pecados estão perdoados. Vai em paz”.",
med:["Aquela mulher não chegou perfeita: chegou com a sua história e as suas lágrimas. E foi acolhida com amor.","Você não precisa ser perfeita para ser amada por Deus, nem para servir a Ele. Ele quer você inteira, com as falhas, as tentativas e o amor que você tem."],
perg:"Que cobrança de perfeição eu carrego e preciso entregar a Jesus?",
des:"Escreva uma cobrança que você faz a si mesma (“eu deveria...”). Ao lado, escreva: “Jesus me ama como eu sou”. Se sentir necessidade, procure a Confissão nesta semana.",
ora:"Jesus, eu chego aos teus pés como sou. Obrigada por me amar e me perdoar. Dá-me a tua paz. Amém."},

{t:"Cuidar de si também é santo",ref:"Lc 5,15-16",v:"Jesus, porém, retirava-se para lugares desertos e orava.",
exp:"A fama de Jesus se espalha e multidões vêm para ouvi-lo e ser curadas. Mesmo assim, o Evangelho conta que Jesus se retirava para lugares tranquilos para rezar. Ele sabia que precisava desse tempo a sós com o Pai.",
med:["Cuidar de si não é egoísmo. É cuidar da casa onde Deus mora. Jesus, com tanta gente precisando dele, separava tempo para se recolher.","Uma mulher esgotada não consegue cuidar bem de ninguém. Separar um tempo para você (descansar, rezar, fazer algo que gosta) é necessário, não luxo."],
perg:"Quando foi a última vez que eu cuidei de mim sem culpa?",
des:"Escolha hoje um cuidado só para você: algo que te faz bem e que você tem adiado. Faça sem culpa, oferecendo a Deus.",
ora:"Senhor, ensina-me a cuidar de mim como Tu cuidas de mim. Que eu descanse sem culpa e reze sem pressa. Amém."},

{t:"A melhor parte",ref:"Lc 10,38-42",v:"Maria escolheu a melhor parte, que não lhe será tirada.",
exp:"Jesus visita Marta e Maria. Marta se ocupa com mil tarefas; Maria senta aos pés de Jesus para ouvir. Marta reclama, e Jesus diz com carinho que Maria escolheu a melhor parte.",
med:["Depois de uma semana lembrando quem você é aos olhos de Deus, a Palavra de hoje convida a escolher a melhor parte: estar com Ele.","Você vai continuar com muitas tarefas, como Marta. Mas pode, todos os dias, sentar alguns minutos aos pés de Jesus. Essa parte ninguém tira de você."],
perg:"O que eu aprendi sobre mim nesta semana? Como posso escolher a melhor parte todos os dias?",
des:"Escreva uma carta de Deus para você, como se Ele estivesse dizendo tudo o que você meditou nesta semana. Guarde para ler nos dias difíceis.",
ora:"Jesus, eu escolho a melhor parte: estar contigo. Obrigada por me amares. Que eu nunca me esqueça de quem sou aos teus olhos. Amém."}
]};

P.familia5={resumo:"Um passo por dia para criar hábitos simples de oração com as crianças, que cabem na rotina de verdade. Cada dia traz uma leitura explicada, uma meditação, um espaço para escrever e um hábito para começar.",d:[
{t:"A oração da manhã",ref:"Sl 5,2-4",v:"De manhã ouves a minha voz; de manhã te apresento a minha súplica e fico esperando.",
exp:"O salmista começa o dia pedindo que Deus escute o seu clamor. Ele apresenta a sua oração logo de manhã e fica atento, esperando a resposta de Deus.",
med:["Começar o dia com Deus muda o dia inteiro. Não precisa ser longo: um sinal da cruz e uma frase ao acordar já ensinam às crianças que o dia pertence a Deus.","A pressa da manhã é real. Por isso a oração precisa ser simples e caber na rotina: no café, no caminho da escola, na porta de casa."],
perg:"Como são as manhãs na minha casa? Em que momento cabe uma oração rápida?",
des:"Amanhã de manhã, ao acordar os filhos, faça com eles o sinal da cruz e diga: “Bom dia, Jesus! Este dia é teu”. Repita todos os dias desta semana.",
ora:"Senhor, de manhã nós te entregamos o nosso dia. Abençoa a nossa família desde o primeiro momento. Amém."},

{t:"A oração das refeições",ref:"Lc 24,28-35",v:"Reconheceram-no ao partir o pão.",
exp:"Dois discípulos caminham para Emaús, tristes depois da morte de Jesus. Jesus caminha com eles, mas eles não o reconhecem. À mesa, Jesus toma o pão, abençoa, parte e dá a eles. Nesse momento os olhos deles se abrem e eles o reconhecem.",
med:["Os discípulos reconheceram Jesus à mesa, no gesto de abençoar o pão. A mesa da família também pode ser lugar de encontro com Ele.","Rezar antes das refeições é um dos hábitos mais simples e mais bonitos. Ensina gratidão e lembra que tudo vem de Deus."],
perg:"A minha família costuma rezar antes de comer? O que impede?",
des:"Hoje, antes do almoço ou do jantar, rezem juntos de mãos dadas. Pode ser: “Abençoa, Senhor, este alimento e quem o preparou, e dá pão a quem não tem”. Deixe um filho puxar a oração.",
ora:"Senhor, abençoa a nossa mesa. Que nós te reconheçamos em cada refeição partilhada. Amém."},

{t:"A bênção dos pais",ref:"Gn 48,8-16",v:"O Deus que tem sido o meu pastor desde que existo até hoje, abençoe estes meninos.",
exp:"Já idoso, Jacó recebe os netos, filhos de José. Ele os abraça, beija e coloca as mãos sobre a cabeça deles para abençoá-los, lembrando o Deus que o acompanhou a vida inteira.",
med:["A bênção dos pais é um gesto antigo e poderoso. Ela diz ao filho: “Você é amado e Deus está com você”.","Muitas famílias brasileiras guardam o costume de pedir a bênção aos pais e avós. Retomar esse gesto com os filhos é plantar algo que eles vão levar para a vida."],
perg:"Eu costumo abençoar os meus filhos? Como foi a bênção que recebi dos meus pais?",
des:"Hoje à noite, coloque a mão sobre a cabeça de cada filho e diga: “Deus te abençoe e te guarde, meu filho”. Ensine-os a pedir a bênção ao sair e ao chegar.",
ora:"Senhor, que as minhas mãos abençoem os meus filhos todos os dias. Sê Tu o pastor deles por toda a vida. Amém."},

{t:"A oração da noite",ref:"Sl 63(62),2-9",v:"Quando me lembro de ti no meu leito, passo a noite pensando em ti, porque foste o meu auxílio.",
exp:"O salmista tem sede de Deus como uma terra seca. Ele se lembra de Deus mesmo deitado, durante a noite, e se sente seguro à sombra das suas asas.",
med:["À noite, a família desacelera. É o momento perfeito para agradecer pelo dia, pedir perdão e entregar o sono a Deus.","Uma oração simples antes de dormir, com as crianças na cama, vira uma das memórias mais doces da infância."],
perg:"Como é a hora de dormir na minha casa? Dá para colocar alguns minutos de oração?",
des:"Hoje, na hora de dormir, faça com os filhos três perguntas: “Pelo que você agradece hoje?”, “Você quer pedir perdão por algo?”, “Por quem você quer rezar?”. Terminem com o Santo Anjo.",
ora:"Senhor, guarda o nosso sono. Obrigada por este dia. Que os teus anjos nos protejam nesta noite. Amém."},

{t:"Um encontro de família com Deus",ref:"Cl 3,16-17",v:"A Palavra de Cristo habite em vós com toda a sua riqueza. Tudo o que fizerdes, fazei-o em nome do Senhor Jesus.",
exp:"São Paulo pede que a Palavra de Cristo more nos cristãos com abundância: que eles se ensinem e se aconselhem, cantem a Deus com gratidão, e que tudo seja feito em nome de Jesus, dando graças ao Pai.",
med:["Além dos pequenos hábitos diários, um encontro semanal em família faz a fé crescer: ler um trecho da Bíblia, cantar, conversar, rezar juntos.","Não precisa ser complicado. Quinze minutos por semana, sempre no mesmo dia, já fazem a Palavra morar na casa."],
perg:"Que dia e horário da semana a minha família poderia separar para um encontro com Deus?",
des:"Marque o primeiro encontro semanal em família: acendam uma vela, leiam um Evangelho curto (pode ser o do domingo), cada um diz o que entendeu e terminem com uma música e um Pai-Nosso.",
ora:"Senhor, que a tua Palavra more na nossa casa. Que tudo o que fizermos seja em teu nome. Amém."}
]};
