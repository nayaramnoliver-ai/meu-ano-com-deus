})();

// Planos curtos (parte 2): Nossa Senhora, Sagrada Família, gratidão. Versão completa.
(function(){
var P={};

P.maria9={resumo:"Nove dias caminhando com Maria pelo Evangelho, do sim da Anunciação até o Cenáculo. Cada dia traz uma leitura explicada, uma meditação, um espaço para escrever o que Deus falou e um desafio para viver como ela.",d:[
{t:"Maria do sim",ref:"Lc 1,26-38",v:"Eis a serva do Senhor; faça-se em mim segundo a tua palavra.",
exp:"O anjo Gabriel é enviado a Nazaré, a uma jovem chamada Maria, prometida em casamento a José. Ele anuncia que ela será mãe do Filho do Altíssimo. Maria não finge entender tudo: pergunta “como acontecerá isso?”. O anjo responde que o Espírito Santo virá sobre ela e lembra que para Deus nada é impossível. Então Maria dá a sua resposta: “faça-se”.",
med:["Maria não tinha todas as respostas, mas tinha confiança. Ela perguntou, ouviu e se entregou. O sim dela não foi ingênuo: foi o sim de quem sabe em quem confia.","Deus também espera os seus pequenos “sins” de cada dia: no cuidado com a casa, no perdão que custa, na oração que você adia. Cada sim abre espaço para Jesus entrar na sua história."],
perg:"Em que área da minha vida Deus está me pedindo um sim que eu venho adiando?",
des:"Escolha uma coisa concreta que você vem adiando e que sabe que Deus te pede (uma conversa, uma confissão, um hábito de oração, um perdão). Dê hoje o primeiro passo e reze três Ave-Marias pedindo a coragem de Maria.",
ora:"Maria, mulher do sim, ensina-me a confiar como tu confiaste. Que eu também possa dizer: eis a serva do Senhor, faça-se em mim segundo a tua palavra. Amém."},

{t:"Maria que serve",ref:"Lc 1,39-45",v:"Naqueles dias, Maria partiu apressadamente para a região montanhosa, a uma cidade de Judá.",
exp:"Logo depois da Anunciação, Maria sabe que a prima Isabel, já idosa, está grávida de seis meses. Ela não fica parada pensando em si: viaja cerca de 150 km para ajudar. Quando chega, o menino João salta no ventre de Isabel, e Isabel, cheia do Espírito Santo, a chama de “bendita entre as mulheres”.",
med:["Maria carregava Jesus no ventre e a primeira coisa que fez foi servir. Quem tem Jesus dentro de si não consegue ficar fechado: sai ao encontro de quem precisa.","O serviço de Maria levou alegria àquela casa. O seu serviço de cada dia, muitas vezes escondido, também leva Jesus para dentro da sua família e para quem está perto de você."],
perg:"Quem perto de mim está precisando de ajuda, mesmo sem pedir?",
des:"Faça hoje um serviço concreto para alguém sem que ela peça: levar uma refeição, ajudar numa tarefa, visitar ou ligar para uma pessoa idosa ou doente. Faça com alegria, como Maria.",
ora:"Maria, que partiste apressada para servir, dá-me um coração atento e mãos prontas. Que, servindo, eu leve Jesus a quem precisa. Amém."},

{t:"Maria que louva",ref:"Lc 1,46-55",v:"A minha alma engrandece o Senhor, e o meu espírito exulta em Deus, meu Salvador.",
exp:"Na casa de Isabel, Maria responde com um cântico, o Magnificat. Ela louva a Deus pelo que fez nela, uma jovem simples, e pelo jeito de Deus agir na história: derruba os poderosos, eleva os humildes, sacia os famintos e se lembra das suas promessas. É a oração que a Igreja reza todas as tardes nas Vésperas.",
med:["Maria não guarda para si a alegria: transforma em louvor. Ela não diz “eu sou grande”, mas “o Senhor fez em mim grandes coisas”. A gratidão humilde é o segredo do seu coração.","Às vezes a gente só reza para pedir. Hoje, aprenda com Maria a louvar: olhar para a própria vida e reconhecer as maravilhas que Deus já fez."],
perg:"Quais são as “grandes coisas” que Deus já fez na minha vida?",
des:"Reze o Magnificat devagar (está na aba Orar). Depois, escreva o seu próprio “magnificat”: cinco linhas começando com “A minha alma engrandece o Senhor porque...”.",
ora:"A minha alma engrandece o Senhor, e o meu espírito exulta em Deus, meu Salvador, porque olhou para a humildade da sua serva. Maria, ensina-me a louvar. Amém."},

{t:"Maria, mãe em Belém",ref:"Lc 2,1-7",v:"Ela deu à luz o seu filho primogênito, envolveu-o em faixas e deitou-o numa manjedoura, porque não havia lugar para eles na hospedaria.",
exp:"Por causa de um recenseamento, José e Maria, já no fim da gravidez, viajam de Nazaré a Belém. Não encontram lugar na hospedaria e o Filho de Deus nasce num lugar de animais. Maria faz o que toda mãe faz: envolve o bebê em faixas e o coloca no lugar mais seguro que encontra.",
med:["O nascimento de Jesus foi cercado de improviso, cansaço e falta de recursos. Mesmo assim, Maria cuidou com o que tinha, com todo o amor que podia dar.","Os cuidados simples de cada dia, como banho, comida, colo e roupa limpa, também são santos. Feitos com amor, eles se tornam oração e preparam um lugar para Jesus na sua casa."],
perg:"Em quais cuidados simples do meu dia eu posso enxergar Jesus?",
des:"Ofereça a Deus, em voz baixa, cada cuidado que fizer hoje com a sua família (ou consigo mesma): “é para Ti, Senhor”. À noite, escreva qual deles foi mais difícil de oferecer e por quê.",
ora:"Maria, que cuidaste de Jesus com tão pouco e com tanto amor, ensina-me a cuidar com paciência e ternura. Que a minha casa seja uma manjedoura acolhedora para Jesus. Amém."},

{t:"Maria que guarda no coração",ref:"Lc 2,15-19",v:"Maria, porém, guardava todas estas coisas, meditando-as no seu coração.",
exp:"Os pastores, avisados pelos anjos, vão a Belém e encontram Maria, José e o menino deitado na manjedoura. Contam tudo o que ouviram, e todos ficam admirados. Maria, porém, não se perde no barulho: guarda tudo e medita, isto é, junta os acontecimentos e procura entender o que Deus está fazendo.",
med:["Maria não entendia tudo na hora, mas não descartava nada. O coração dela era como um cofre onde guardava os sinais de Deus para rezar com eles depois.","Vivemos correndo e esquecemos depressa o que Deus fez. Guardar no coração é parar, lembrar e deixar que os fatos do dia virem oração."],
perg:"O que Deus tem feito na minha vida que eu ainda não parei para meditar?",
des:"Faça hoje 10 minutos de silêncio, sem celular. Relembre os acontecimentos da última semana e escreva abaixo um sinal de Deus que você percebeu e quer guardar no coração.",
ora:"Maria, que guardavas tudo no coração, ensina-me a fazer silêncio e a perceber Deus nos acontecimentos da minha vida. Amém."},

{t:"Maria que procura Jesus",ref:"Lc 2,41-51",v:"Meu filho, por que agiste assim conosco? Olha que teu pai e eu, aflitos, te procurávamos.",
exp:"Aos 12 anos, Jesus vai com Maria e José a Jerusalém para a Páscoa. Na volta, os pais percebem que ele não está na caravana. Procuram por três dias, angustiados, até o encontrarem no Templo, entre os mestres. Jesus responde que precisava estar na casa do seu Pai. Maria não entende, mas, de novo, guarda tudo no coração.",
med:["Até Maria passou por angústia, procura e falta de respostas. Isso nos consola: sentir Jesus distante não significa que fomos abandonadas. Significa que é hora de procurar.","Maria e José voltaram e procuraram até encontrar. Quando a vida corrida nos afasta de Jesus, o caminho é voltar ao lugar onde Ele está: a oração, a Palavra, a Missa, a confissão."],
perg:"Onde eu “perdi Jesus de vista” nos últimos tempos? Para onde preciso voltar?",
des:"Retome hoje um hábito de fé que você deixou de lado (o terço, a leitura da Bíblia, a Missa durante a semana, a confissão). Marque na agenda o dia e a hora em que vai fazer isso nesta semana.",
ora:"Maria, quando eu me afastar de Jesus, segura a minha mão e ajuda-me a encontrá-lo de novo. Que eu nunca desista de procurá-lo. Amém."},

{t:"Maria que intercede",ref:"Jo 2,1-11",v:"Disse a mãe de Jesus aos que estavam servindo: Fazei tudo o que ele vos disser.",
exp:"Num casamento em Caná, o vinho acaba no meio da festa, o que seria uma grande vergonha para os noivos. Maria percebe antes de todos e leva a necessidade a Jesus: “eles não têm mais vinho”. Depois, orienta os serventes: “fazei tudo o que ele vos disser”. Jesus transforma a água em vinho, e esse é o seu primeiro sinal.",
med:["Maria percebe o que falta antes que alguém peça. Ela faz isso pela sua família também: vê as necessidades da sua casa e as apresenta a Jesus.","O conselho de Maria é o mesmo até hoje: “fazei tudo o que ele vos disser”. A intercessão dela sempre nos leva a obedecer ao Filho."],
perg:"O que está faltando na minha casa hoje? Que “vinho” acabou?",
des:"Escreva abaixo uma necessidade concreta da sua família e entregue a Nossa Senhora rezando um terço (ou pelo menos uma dezena) por essa intenção. Pergunte também: o que Jesus está me pedindo para fazer nessa situação?",
ora:"Maria, Mãe atenta, apresenta a Jesus o que falta na minha família. E dá-me um coração disposto a fazer tudo o que Ele me disser. Amém."},

{t:"Maria ao pé da cruz",ref:"Jo 19,25-27",v:"Junto à cruz de Jesus estavam de pé a sua mãe, a irmã de sua mãe, Maria de Cléofas, e Maria Madalena.",
exp:"Na hora mais escura, quando quase todos fugiram, Maria está ali, de pé. Jesus, do alto da cruz, vê a mãe e o discípulo amado e diz: “Mulher, eis o teu filho”, e ao discípulo: “eis a tua mãe”. A partir daquela hora, o discípulo a recebe em sua casa. A Igreja entende que, ali, Jesus nos deu Maria como Mãe.",
med:["Maria não pôde impedir o sofrimento do Filho, mas não o deixou sozinho. Ficar de pé ao lado de quem sofre também é amor, às vezes o maior que podemos dar.","Ela sabe o que é sofrer como mulher e como mãe. Por isso, você pode levar a ela as suas dores sem medo: ela entende e fica com você."],
perg:"Qual dor eu carrego hoje que quero colocar nas mãos de Maria?",
des:"Pense numa mulher que está sofrendo (doença, luto, filho afastado, casamento difícil). Reze por ela hoje e, se puder, mande uma mensagem carinhosa ou faça uma visita. Apenas esteja presente.",
ora:"Maria, Mãe das Dores, que ficaste de pé junto à cruz, fica comigo nos momentos difíceis. Eu te recebo na minha casa, como o discípulo amado. Amém."},

{t:"Maria que reza com a Igreja",ref:"At 1,12-14",v:"Todos eles perseveravam unânimes na oração, com algumas mulheres, entre as quais Maria, a mãe de Jesus.",
exp:"Depois da Ascensão de Jesus, os apóstolos voltam a Jerusalém e se reúnem na sala de cima, o Cenáculo. Ali esperam o Espírito Santo prometido, rezando juntos. No meio deles está Maria. Ela, que recebeu o Espírito na Anunciação, agora acompanha a Igreja nascente na oração.",
med:["Maria não fica no passado do Evangelho: ela continua no meio da Igreja, rezando conosco. Onde há uma comunidade que reza, ali está a Mãe.","Ao fim destes nove dias, você pode fazer como o discípulo amado: receber Maria na sua casa e se entregar a ela, para que ela te conduza sempre a Jesus."],
perg:"O que eu aprendi com Maria nestes nove dias e quero levar para a minha vida?",
des:"Faça a consagração a Nossa Senhora com a oração “Ó minha Senhora e também minha Mãe” (aba Orar). Se puder, reze um terço com a família ou com outras pessoas, como Maria rezava com os apóstolos.",
ora:"Ó minha Senhora e também minha Mãe, eu me ofereço toda a vós. Em prova da minha devoção, eu vos consagro neste dia os meus olhos, os meus ouvidos, a minha boca, o meu coração e inteiramente todo o meu ser. Guardai-me e defendei-me como coisa e propriedade vossa. Amém."}
]};

P.sagrada10={resumo:"Dez dias para aprender com Jesus, Maria e José a viver a fé no dia a dia da casa. Cada dia traz uma leitura explicada, uma meditação, um espaço para escrever e um desafio para fazer com a família.",d:[
{t:"Deus escolheu uma família",ref:"Lc 2,39-40",v:"O menino crescia e se fortalecia, cheio de sabedoria; e a graça de Deus estava com ele.",
exp:"Depois de apresentarem Jesus no Templo, Maria e José voltam para Nazaré, uma cidadezinha sem importância. Ali Jesus vai passar cerca de 30 anos, numa vida escondida, de casa e trabalho. O Evangelho resume esse tempo em poucas palavras: o menino crescia, e a graça de Deus estava com ele.",
med:["Deus poderia ter vindo ao mundo de muitos jeitos, mas escolheu nascer e crescer numa família. Isso mostra o valor enorme que a família tem para Ele.","A sua casa, com as suas rotinas, cansaços e alegrias, também pode ser uma pequena Nazaré: um lugar onde a graça de Deus está presente no comum de cada dia."],
perg:"O que faria da minha casa uma pequena Nazaré?",
des:"Coloque uma imagem ou um quadrinho da Sagrada Família num lugar de destaque da casa. Reúna a família por um minuto, apresente a imagem e rezem juntos: “Jesus, Maria e José, abençoai a nossa família”.",
ora:"Jesus, Maria e José, que vivestes em Nazaré uma vida simples e cheia de amor, abençoai a minha família e fazei da nossa casa um lar onde Deus mora. Amém."},

{t:"Maria, a mãe atenta",ref:"Lc 2,48-52",v:"Desceu então com eles para Nazaré e era-lhes submisso. Sua mãe guardava todas estas coisas no coração.",
exp:"Depois de reencontrar Jesus no Templo, a família volta para casa. Jesus, sendo Deus, obedece a Maria e José. E Maria continua fazendo o que sempre fez: guardar tudo no coração. Ela é uma mãe que observa, escuta e reza a vida do filho.",
med:["Maria não era uma mãe distraída. Ela prestava atenção em Jesus, mesmo quando não entendia. A atenção é uma das formas mais bonitas de amor.","No meio das tarefas, é fácil olhar os filhos (ou as pessoas da casa) só para corrigir ou mandar. Maria nos ensina a olhar para admirar, entender e rezar por eles."],
perg:"O que tenho percebido nas pessoas da minha casa que preciso levar à oração?",
des:"Hoje, separe 15 minutos de atenção total a um filho, ao esposo ou a alguém da casa: sem celular, só conversando ou brincando. À noite, escreva algo bonito que você descobriu nesse momento.",
ora:"Maria, mãe atenta, ensina-me a olhar a minha família com o teu olhar e a guardar no coração cada momento. Amém."},

{t:"José, o justo",ref:"Mt 1,18-24",v:"José, seu esposo, sendo justo e não querendo difamá-la, resolveu abandoná-la em segredo.",
exp:"José descobre que Maria está grávida antes de morarem juntos. Sendo justo, não quer expô-la à vergonha. Enquanto pensa, um anjo lhe aparece em sonho e explica que o filho vem do Espírito Santo. Ao despertar, José faz como o anjo mandou e recebe Maria em sua casa.",
med:["José é o homem do silêncio e da ação. No Evangelho, ele não diz uma palavra, mas obedece a Deus prontamente e protege Maria e Jesus com coragem.","Os homens da sua família, esposo, pai, filhos, também precisam de oração. São José é modelo e protetor para eles, e para cada família que se coloca sob o seu cuidado."],
perg:"Quais homens da minha família eu quero colocar sob a proteção de São José?",
des:"Reze a oração a São José (aba Orar) pelo seu esposo, pelo seu pai ou pelo pai dos seus filhos. Depois, diga a ele algo que você admira nele, por mensagem ou pessoalmente.",
ora:"São José, homem justo e fiel, protege a minha família como protegeste Jesus e Maria. Guarda os homens da minha casa e ensina-os a confiar em Deus. Amém."},

{t:"O trabalho de Nazaré",ref:"Mt 13,53-58",v:"Não é este o filho do carpinteiro? Sua mãe não se chama Maria?",
exp:"Jesus volta à sua terra e ensina na sinagoga. As pessoas ficam admiradas, mas também desconfiadas: conheciam Jesus como o filho do carpinteiro, alguém comum, que trabalhava com as mãos. Por causa da falta de fé, Ele não faz ali muitos milagres.",
med:["Durante anos, Jesus trabalhou com José como carpinteiro. O Filho de Deus suou, se cansou e aprendeu um ofício. Isso significa que o trabalho, de casa ou de fora, pode ser santo.","A lavar a louça, cuidar das roupas, cumprir um expediente: tudo pode ser oferecido a Deus. Não é o tamanho da tarefa que importa, mas o amor com que ela é feita."],
perg:"Qual tarefa do meu dia eu faço de má vontade e poderia oferecer a Deus?",
des:"Antes de cada tarefa hoje, diga baixinho: “é para Ti, Senhor”. Escolha a tarefa de que você menos gosta e faça com capricho, rezando por alguém enquanto trabalha.",
ora:"São José operário, ensina-me a trabalhar com amor. Senhor, santifica o nosso trabalho de cada dia e faz dele uma oferta agradável a Ti. Amém."},

{t:"Jesus crescia",ref:"Lc 2,52",v:"E Jesus crescia em sabedoria, em estatura e em graça diante de Deus e dos homens.",
exp:"Este versículo encerra o relato da infância de Jesus. Mostra que Ele cresceu de verdade, como toda criança: no corpo, no conhecimento e na relação com Deus e com as pessoas. Esse crescimento aconteceu dentro de uma família, com a ajuda de Maria e José.",
med:["Jesus não pulou etapas. Cresceu aos poucos, como os nossos filhos e como nós mesmas. Cada fase tem a sua beleza e o seu desafio.","Crescer em graça é tão importante quanto crescer em tamanho. A família é o lugar onde se aprende a rezar, a perdoar e a amar a Deus."],
perg:"Em que eu quero crescer na fé, e em que quero ajudar a minha família a crescer?",
des:"Observe algo novo que o seu filho (ou alguém da casa) aprendeu ou conquistou e agradeça a Deus em voz alta, perto dele. Se puder, ensine hoje uma oração curta a uma criança.",
ora:"Jesus, que crescestes em sabedoria e graça em Nazaré, abençoa o crescimento dos meus filhos e da minha família. Faz-nos crescer também no teu amor. Amém."},

{t:"Uma família que reza",ref:"Lc 2,41-42",v:"Seus pais iam todos os anos a Jerusalém, para a festa da Páscoa.",
exp:"Maria e José eram fiéis às práticas da fé: todos os anos faziam a peregrinação a Jerusalém, uma viagem longa e cansativa, para celebrar a Páscoa. Quando Jesus completou 12 anos, foi com eles. A fé era vivida como família, com hábitos e compromissos.",
med:["Os hábitos de fé formam o coração. Uma criança que vê os pais rezando, indo à Missa e celebrando as festas aprende que Deus é parte da vida, não um enfeite.","Não precisa ser algo grande: uma oração antes das refeições, uma bênção antes de dormir, a Missa de domingo juntos. O que é constante é o que fica."],
perg:"Qual hábito de oração a minha família poderia começar ou retomar?",
des:"Combine com a família um hábito de oração para as próximas semanas (por exemplo, rezar antes do jantar ou abençoar os filhos antes de dormir). Comecem hoje mesmo.",
ora:"Sagrada Família de Nazaré, que celebráveis juntos as festas de Deus, ensinai a nossa família a rezar unida. Que o nosso lar seja uma pequena igreja. Amém."},

{t:"Nas dificuldades",ref:"Mt 2,13-15",v:"José levantou-se de noite, tomou o menino e sua mãe e partiu para o Egito.",
exp:"Depois da visita dos Magos, o rei Herodes quer matar o menino. Um anjo avisa José em sonho, e ele, no meio da noite, pega Maria e Jesus e foge para o Egito. A Sagrada Família vive como refugiada numa terra estrangeira até a morte de Herodes.",
med:["A Sagrada Família conheceu o medo, a pressa, a mudança e a incerteza. Por isso, ela entende as dificuldades das nossas casas: falta de dinheiro, doença, mudanças, conflitos.","José não ficou paralisado pelo medo: ouviu Deus e agiu. Nas dificuldades, a oração não tira o problema na hora, mas mostra o próximo passo."],
perg:"Qual é a maior dificuldade da minha casa hoje? Qual o próximo passo que Deus me mostra?",
des:"Escreva a maior dificuldade da sua família num papel, coloque aos pés da imagem da Sagrada Família (ou na Bíblia) e reze por ela. Dê um passo concreto para enfrentá-la, mesmo que pequeno.",
ora:"Sagrada Família, que conhecestes o exílio e o medo, ajudai-nos nas nossas dificuldades. São José, guia a nossa família no caminho certo. Amém."},

{t:"Procurar Jesus juntos",ref:"Lc 2,43-46",v:"Três dias depois, o encontraram no Templo, sentado no meio dos mestres, escutando-os e fazendo-lhes perguntas.",
exp:"Na volta de Jerusalém, Maria e José percebem que Jesus não está com eles. Voltam e procuram durante três dias, até encontrá-lo no Templo, a casa de Deus. Eles não desistiram: procuraram juntos até achar.",
med:["Às vezes a família inteira se distrai e perde Jesus de vista no meio da correria. Isso acontece com todo mundo, até aconteceu com a Sagrada Família.","O segredo é procurar juntos, e procurar no lugar certo: na casa de Deus, na oração, na Palavra. Uma família que busca Jesus unida sempre o encontra."],
perg:"Como a minha família pode procurar Jesus juntos nesta semana?",
des:"Visitem uma igreja juntos, nem que seja por cinco minutos, ou participem da Missa em família. Se for possível, deixem as crianças acenderem uma vela e fazerem um pedido.",
ora:"Jesus, que a nossa família sempre te procure e te encontre. Quando nos perdermos, conduz-nos de volta à casa do Pai. Amém."},

{t:"O silêncio de Nazaré",ref:"1Rs 19,11-13",v:"Depois do fogo, ouviu-se o murmúrio de uma brisa suave.",
exp:"O profeta Elias, cansado e com medo, se esconde numa caverna no monte Horeb. Deus manda que ele saia para encontrá-lo. Passa um vento forte, um terremoto e um fogo, mas Deus não estava neles. Depois vem uma brisa suave, e é ali que Elias percebe a presença de Deus e cobre o rosto.",
med:["Deus muitas vezes fala baixinho, na brisa suave. A casa de Nazaré era simples e silenciosa, e foi nesse silêncio que a Sagrada Família ouviu a voz de Deus.","Nas nossas casas há muito barulho: televisão, celular, pressa. Um pouco de silêncio em família ajuda a ouvir Deus e também a ouvir uns aos outros."],
perg:"Que barulhos eu poderia diminuir na minha casa para ouvir melhor a Deus?",
des:"Faça hoje um momento de silêncio em família, de cinco minutos, com as telas desligadas (pode ser antes de dormir, com uma vela acesa). Termine com um Pai-Nosso rezado bem devagar.",
ora:"Senhor, ensina-nos a fazer silêncio para te ouvir. Que a nossa casa, como a de Nazaré, seja um lugar de paz onde a tua voz é escutada. Amém."},

{t:"Consagrar a família",ref:"Cl 3,12-17",v:"Reine em vossos corações a paz de Cristo, à qual fostes chamados em um só corpo. E sede agradecidos.",
exp:"São Paulo descreve como deve ser a vida de quem pertence a Cristo: revestir-se de misericórdia, bondade, humildade, mansidão e paciência; suportar-se e perdoar-se mutuamente; e, acima de tudo, ter amor. É a leitura que a Igreja proclama na festa da Sagrada Família.",
med:["Este é o retrato de uma família cristã: não uma família perfeita, mas uma família que se perdoa, se suporta com paciência e deixa a paz de Cristo reinar.","Ao final destes dez dias, você pode consagrar a sua casa à Sagrada Família, pedindo que Jesus, Maria e José morem com vocês e guiem cada passo."],
perg:"O que mudou no meu olhar sobre a minha família nestes dez dias?",
des:"Reúna a família e façam a consagração do lar à Sagrada Família (aba Orar). Se alguém estiver magoado, aproveite para pedir e oferecer perdão antes da oração.",
ora:"Jesus, Maria e José, a vós consagro a minha família. Reine em nossos corações a paz de Cristo. Fazei da nossa casa um lugar de amor, perdão e gratidão. Amém."}
]};

P.gratidao14={resumo:"Duas semanas para treinar o olhar e encher a casa de agradecimento, das coisas grandes às pequeninas. Cada dia traz uma leitura explicada, uma meditação, um espaço para escrever e um desafio de gratidão.",d:[
{t:"Não esquecer os benefícios",ref:"Sl 103(102),1-5",v:"Bendize, ó minha alma, o Senhor, e não esqueças nenhum de seus benefícios.",
exp:"Neste salmo, o salmista conversa com a própria alma e a convida a bendizer a Deus. Depois, lista o que Deus faz: perdoa as culpas, cura as doenças, livra da morte, coroa de amor e misericórdia, sacia de bens. A gratidão nasce de lembrar.",
med:["Esquecemos depressa o bem recebido e lembramos por muito tempo o que deu errado. A gratidão é um exercício de memória: trazer de volta ao coração o que Deus já fez.","Quem lembra dos benefícios de Deus reclama menos, confia mais e enxerga a vida com outros olhos."],
perg:"Quais benefícios de Deus eu tenho esquecido de agradecer?",
des:"Comece hoje a sua lista de gratidão: escreva abaixo pelo menos cinco coisas pelas quais você agradece. Você vai voltar a ela ao longo destes 14 dias.",
ora:"Bendize, ó minha alma, o Senhor. Obrigada, Senhor, por todo o bem que me fazes. Que eu nunca esqueça os teus benefícios. Amém."},

{t:"Pela minha vida",ref:"Sl 139(138),13-16",v:"Eu te louvo porque me fizeste de modo tão maravilhoso. São admiráveis as tuas obras.",
exp:"O salmista reconhece que Deus o conhece desde o ventre da mãe. Foi Deus quem o formou, quem viu cada etapa do seu crescimento e quem tem os seus dias escritos no seu livro. Diante disso, só resta louvar.",
med:["A sua vida não é um acaso. Deus te formou com carinho, te conhece por inteiro e te ama do jeito que você é.","Muitas vezes somos duras com nós mesmas. Hoje, olhe para você com os olhos de Deus e agradeça por existir, pelo seu corpo, pelos seus dons e pela sua história."],
perg:"O que em mim eu tenho dificuldade de agradecer? Como Deus vê isso?",
des:"Escreva três qualidades ou dons que Deus te deu. Diante do espelho, diga em voz alta: “eu te louvo, Senhor, porque me fizeste de modo maravilhoso”.",
ora:"Senhor, eu te louvo porque me fizeste de modo tão maravilhoso. Obrigada pela minha vida e por cada dia que me dás. Amém."},

{t:"Pela casa",ref:"Is 32,15-18",v:"O meu povo habitará em moradas de paz, em habitações seguras, em lugares de repouso tranquilo.",
exp:"O profeta anuncia um tempo em que o Espírito será derramado do alto, e o deserto se tornará jardim. Fruto desse tempo será a justiça e a paz, e o povo de Deus viverá em moradas seguras e tranquilas.",
med:["Não importa o tamanho nem o estado da sua casa: ela é o seu abrigo, o lugar onde a sua família se encontra, descansa e se ama.","Agradecer pela casa muda o jeito de cuidar dela. O que é visto como presente é tratado com carinho, não como peso."],
perg:"O que eu mais agradeço na minha casa, mesmo com as imperfeições dela?",
des:"Ande pela casa e, em cada cômodo, agradeça a Deus por algo que acontece ali (as refeições na cozinha, o descanso no quarto, as risadas na sala). Se puder, abençoe cada ambiente com água benta.",
ora:"Senhor, obrigada pela casa que nos deste. Que ela seja sempre uma morada de paz, onde Tu és bem-vindo. Amém."},

{t:"Dar graças por tudo",ref:"1Ts 5,16-18",v:"Em todas as circunstâncias, dai graças, porque esta é a vontade de Deus a vosso respeito em Cristo Jesus.",
exp:"São Paulo escreve à comunidade de Tessalônica, que passava por perseguições, e dá três conselhos curtos: estai sempre alegres, rezai sem cessar e dai graças em todas as circunstâncias. Ele diz que essa é a vontade de Deus para nós.",
med:["Dar graças em todas as circunstâncias não é fingir que tudo está bem. É confiar que Deus está presente em todas as coisas, inclusive nas difíceis.","A gratidão constante transforma o coração. Quanto mais agradecemos, mais percebemos motivos para agradecer."],
perg:"Em que situação difícil eu posso começar a agradecer mesmo sem entender?",
des:"Agradeça em voz alta pelo menos três vezes hoje, por coisas simples, no momento em que acontecerem (um café quente, um trânsito tranquilo, um abraço). Anote abaixo quais foram.",
ora:"Senhor, que eu aprenda a te dar graças em todas as circunstâncias, porque sei que estás comigo em tudo. Amém."},

{t:"Pelos filhos e pelas crianças",ref:"Sl 127(126),1-3",v:"Os filhos são herança do Senhor, o fruto do ventre é uma recompensa.",
exp:"O salmo começa lembrando que, se o Senhor não construir a casa, em vão trabalham os construtores. Tudo é dom de Deus, e os filhos são apresentados como herança e recompensa: presentes que Deus confia aos pais.",
med:["Os filhos são presente, mesmo nos dias de birra, cansaço e preocupação. Eles não são nossos, são de Deus, confiados a nós por um tempo.","Se você ainda não tem filhos, ou se tem filhos espirituais, sobrinhos, afilhados, alunos, também pode agradecer pelas crianças que Deus coloca no seu caminho."],
perg:"O que eu agradeço em cada criança que Deus colocou na minha vida?",
des:"Diga a cada filho (ou a uma criança querida): “eu agradeço a Deus por você”, e conte por quê. Escreva abaixo como cada um reagiu.",
ora:"Obrigada, Senhor, por cada criança que me confiaste. Constrói Tu a nossa casa e guarda os nossos pequenos. Amém."},

{t:"Pelo pão de cada dia",ref:"Mt 14,15-21",v:"Tomou os cinco pães e os dois peixes, ergueu os olhos para o céu e pronunciou a bênção.",
exp:"Uma multidão segue Jesus até um lugar deserto, e a noite chega sem comida. Os discípulos só têm cinco pães e dois peixes. Jesus toma o pouco que há, agradece e abençoa. Todos comem e ainda sobram doze cestos.",
med:["Jesus agradeceu antes de multiplicar. A gratidão pelo pouco abre espaço para Deus agir. A mesa, por mais simples que seja, é lugar de bênção.","Quantas mãos trabalharam para o alimento chegar até a sua mesa? Agradecer pela comida é também lembrar de quem não tem."],
perg:"Como está a minha mesa: é um lugar de gratidão ou de pressa?",
des:"Reze a oração antes das refeições com a família hoje. Se puder, separe um alimento para doar a alguém que precisa ou a uma instituição.",
ora:"Abençoa, Senhor, o alimento que vamos receber e as mãos que o prepararam. Dá pão a quem tem fome e fome de Ti a quem tem pão. Amém."},

{t:"Até pelas dificuldades",ref:"Rm 8,28-31",v:"Sabemos que todas as coisas concorrem para o bem daqueles que amam a Deus.",
exp:"São Paulo escreve aos romanos sobre a esperança cristã. Ele afirma que Deus age em todas as coisas, inclusive no sofrimento, para o bem de quem o ama. E conclui: se Deus é por nós, quem será contra nós?",
med:["Algumas das coisas que mais nos fizeram crescer foram difíceis de viver. Deus não quer o mal, mas é capaz de tirar bem até dele.","Agradecer pelas dificuldades não é gostar de sofrer, mas reconhecer que Deus não nos abandonou nelas e que saímos diferentes do outro lado."],
perg:"Qual dificuldade do meu passado trouxe algo bom para mim?",
des:"Escreva abaixo uma dificuldade que você viveu e o bem que ela trouxe (uma lição, uma amizade, mais fé). Agradeça a Deus por ter estado com você naquele tempo.",
ora:"Senhor, obrigada até pelas dificuldades que me fizeram crescer. Se Tu és por mim, quem será contra mim? Amém."},

{t:"Pelas amizades",ref:"Rt 1,14-17",v:"Aonde fores, irei também; onde ficares, ficarei; teu povo será meu povo, e teu Deus será meu Deus.",
exp:"Noemi perde o marido e os dois filhos e decide voltar para a sua terra. Ela pede às noras que fiquem com suas famílias. Orfa se despede, mas Rute se agarra a ela e promete acompanhá-la para sempre. Dessa fidelidade nasce uma nova história: Rute será bisavó do rei Davi.",
med:["A amizade entre Rute e Noemi mostra que o amor verdadeiro fica, mesmo quando é mais fácil ir embora. Amizades fiéis são um presente raro de Deus.","Pense nas mulheres que estiveram ao seu lado nos momentos difíceis. Elas foram sinais do cuidado de Deus por você."],
perg:"Quais amigas foram uma “Rute” na minha vida?",
des:"Mande uma mensagem de gratidão para uma amiga, dizendo concretamente por que você agradece a Deus por ela. Reze também por uma amiga que está passando por um momento difícil.",
ora:"Obrigada, Senhor, pelas amigas que colocaste no meu caminho. Abençoa cada uma delas e faz de mim também uma amiga fiel. Amém."},

{t:"Pelos pais e avós",ref:"Eclo 3,2-6",v:"Quem honra seu pai alcança o perdão dos pecados; e quem respeita sua mãe é como quem ajunta tesouros.",
exp:"O livro do Eclesiástico ensina como viver o quarto mandamento. Honrar pai e mãe traz bênção, perdão e alegria. Mais adiante (Eclo 3,12-14), pede paciência com os pais idosos, mesmo quando a mente deles enfraquece. É uma das leituras da festa da Sagrada Família.",
med:["Recebemos dos nossos pais e avós a vida e, muitas vezes, a fé. Mesmo com os erros e limites deles, há muito a agradecer.","Se a relação com os pais é difícil, a gratidão pode começar por algo pequeno. E se eles já partiram, a oração é a forma mais bonita de agradecer."],
perg:"O que eu recebi dos meus pais e avós que quero agradecer?",
des:"Ligue ou faça uma visita aos seus pais ou avós e agradeça algo concreto. Se já partiram, reze por eles hoje e, se puder, mande celebrar uma Missa nas intenções deles.",
ora:"Obrigada, Senhor, pelos meus pais e avós. Abençoa os que estão vivos e dá o descanso eterno aos que já partiram. Amém."},

{t:"Pelo dom da fé",ref:"Ef 2,4-10",v:"É pela graça que fostes salvos, mediante a fé. Isso não vem de vós: é dom de Deus.",
exp:"São Paulo lembra aos efésios que Deus, rico em misericórdia, nos deu vida com Cristo quando estávamos mortos pelo pecado. A salvação não é conquista nossa: é graça, presente gratuito, recebido pela fé.",
med:["A fé não é mérito nosso, é presente de Deus. Muitas vezes ela chegou até nós pelas mãos de alguém: uma avó que rezava, uma catequista, uma amiga.","Agradecer pela fé é também cuidar dela, alimentando-a com a oração, a Palavra e os sacramentos, e passando-a adiante."],
perg:"Quem me ensinou a rezar e a crer? Como posso passar a fé adiante?",
des:"Agradeça a Deus pelas pessoas que te ensinaram a fé e, se possível, diga isso a uma delas. Reze o Creio pausadamente, agradecendo por cada verdade que professa.",
ora:"Obrigada, Senhor, pelo dom da fé. Aumenta a minha fé e faz de mim uma testemunha do teu amor para a minha família. Amém."},

{t:"Pelas pequenas coisas",ref:"Mt 6,25-34",v:"Olhai os lírios do campo, como crescem: não trabalham nem fiam.",
exp:"No Sermão da Montanha, Jesus pede que não vivamos preocupados com o que comer ou vestir. Ele aponta para os pássaros e as flores: o Pai cuida deles com carinho. Se cuida assim das flores, quanto mais de nós. E conclui: buscai primeiro o Reino de Deus.",
med:["Jesus prestava atenção nas pequenas coisas: as flores, os pássaros, o fermento, a semente. Deus fala também no simples.","A preocupação rouba o olhar. Quem confia no cuidado do Pai consegue perceber as pequenas alegrias que estão espalhadas pelo dia."],
perg:"Quais pequenas alegrias de hoje eu quase deixei passar?",
des:"Fotografe ou anote três pequenas alegrias de hoje (uma flor, o sol na janela, a risada de alguém). À noite, agradeça por cada uma antes de dormir.",
ora:"Obrigada, Senhor, pelas pequenas alegrias do dia. Tira de mim a preocupação e ensina-me a confiar no teu cuidado de Pai. Amém."},

{t:"Pela Eucaristia",ref:"Lc 22,14-20",v:"Tomou o pão, deu graças, partiu-o e deu-lhes, dizendo: Isto é o meu corpo, que é dado por vós. Fazei isto em memória de mim.",
exp:"Na Última Ceia, antes da sua Paixão, Jesus celebra a Páscoa com os apóstolos. Toma o pão e o vinho, dá graças e os entrega como seu Corpo e seu Sangue. Ele pede que façam isso em sua memória. É a instituição da Eucaristia.",
med:["A palavra “Eucaristia” quer dizer ação de graças. A Missa é o maior agradecimento que existe: nela, unimos a nossa gratidão à de Jesus ao Pai.","Jesus quis ficar conosco de um jeito real e simples, num pedaço de pão. Que presente! A gratidão por esse dom nos leva a desejar cada vez mais estar com Ele."],
perg:"Como eu tenho vivido a Missa? Ela é para mim um momento de gratidão?",
des:"Participe de uma Missa (pode ser durante a semana) com a intenção de agradecer. Se não puder, faça uma comunhão espiritual e passe cinco minutos agradecendo a Jesus pela sua presença na Eucaristia.",
ora:"Obrigada, Jesus, por ficares conosco na Eucaristia. Que cada Missa seja para mim uma grande ação de graças. Amém."},

{t:"Voltar para agradecer",ref:"Lc 17,11-19",v:"Um deles, vendo-se curado, voltou glorificando a Deus em alta voz e prostrou-se aos pés de Jesus, agradecendo-lhe.",
exp:"A caminho de Jerusalém, Jesus encontra dez leprosos que gritam pedindo compaixão. Ele os manda apresentar-se aos sacerdotes e, no caminho, todos ficam curados. Mas só um volta para agradecer, e era um samaritano, um estrangeiro. Jesus pergunta: “não foram dez os curados? Onde estão os outros nove?”.",
med:["É fácil pedir e esquecer de agradecer. Os nove foram curados no corpo, mas o que voltou recebeu algo a mais: ouviu de Jesus “a tua fé te salvou”.","Voltar para agradecer aprofunda a relação com Deus. A gratidão nos aproxima de quem nos deu o presente."],
perg:"Qual oração atendida eu ainda não voltei para agradecer?",
des:"Veja os seus pedidos na aba Orar (ou relembre orações atendidas) e escolha uma graça recebida. Volte para agradecer: reze, escreva abaixo o seu agradecimento e, se quiser, conte o testemunho para alguém.",
ora:"Senhor, eu volto para te agradecer pelas graças recebidas. Não quero ser como os nove que esqueceram. Obrigada, Jesus. Amém."},

{t:"Grandes coisas",ref:"Lc 1,46-55",v:"O Todo-poderoso fez em mim grandes coisas. Santo é o seu nome.",
exp:"Maria, na casa de Isabel, canta o Magnificat, o seu grande hino de gratidão. Ela reconhece que Deus olhou para a sua pequenez e fez nela maravilhas. E lembra que Deus é fiel às suas promessas, de geração em geração.",
med:["Ao terminar estas duas semanas, faça como Maria: olhe para trás e reconheça as grandes coisas que Deus fez em você e na sua família.","A gratidão não precisa acabar aqui. Ela pode virar um jeito de viver: um olhar treinado para enxergar Deus em tudo."],
perg:"O que mudou em mim nestas duas semanas de gratidão?",
des:"Releia a sua lista de gratidão do primeiro dia e acrescente o que descobriu nestes 14 dias. Reze o Magnificat (aba Orar) e escolha um hábito de gratidão para continuar, como agradecer três coisas antes de dormir.",
ora:"A minha alma engrandece o Senhor, porque o Todo-poderoso fez em mim grandes coisas. Obrigada, Senhor, por tudo. Amém."}
]};

})();

// 21 dias orando pelos meus filhos: versão completa
(function(){
var D=[
{t:"Entregar meus filhos a Deus",ref:"1Sm 1,20-28",v:"Por este menino eu orava, e o Senhor me concedeu o que lhe pedi. Por isso eu também o dedico ao Senhor.",
exp:"Ana não conseguia ter filhos e rezou com muitas lágrimas no santuário de Silo. Deus ouviu e ela deu à luz Samuel. Quando o menino cresceu um pouco, Ana o levou ao Templo e o consagrou ao Senhor por toda a vida. Samuel se tornou um grande profeta.",
med:["Os filhos são presentes de Deus, não propriedade nossa. Ana entendeu isso: o que recebeu de Deus, devolveu a Deus. E não perdeu o filho; deu a ele o melhor destino possível.","Entregar os filhos a Deus tira de nós o peso de controlar tudo. Continuamos cuidando, educando e protegendo, mas sabendo que há um Pai que os ama ainda mais do que nós."],
perg:"O que eu tenho tentado controlar na vida dos meus filhos e preciso entregar a Deus?",
des:"Escreva o nome de cada filho numa folha (ou um cartão para cada um) e, ao lado, a frase: “Senhor, ele (ela) é teu”. Hoje à noite, faça o sinal da cruz na testa de cada um antes de dormir.",
ora:"Senhor, eu te entrego os meus filhos. Eles são teus antes de serem meus. Cuida deles, guia-os e faz deles o que sonhaste. Amém."},

{t:"A fé que passa de mãe para filho",ref:"2Tm 1,3-7",v:"Recordo a tua fé sincera, que habitou primeiro em tua avó Loide e em tua mãe Eunice.",
exp:"São Paulo escreve ao jovem Timóteo, a quem ama como filho. Ele lembra que a fé de Timóteo começou em casa, com a avó e a mãe. E o encoraja: reavive o dom de Deus que está em você, porque Deus não nos deu um espírito de medo, mas de força, de amor e de sabedoria.",
med:["A fé se aprende primeiro em casa: no colo, nas orações da noite, no exemplo. Nenhuma catequese substitui ver a mãe rezando.","Loide e Eunice talvez não imaginassem que estavam formando um bispo e santo. Cada pequena oração que você reza com seus filhos é semente que Deus vai fazer crescer no tempo dele."],
perg:"Como os meus filhos me veem viver a fé no dia a dia?",
des:"Hoje, deixe que os seus filhos vejam você rezando: um momento no sofá com a Bíblia, um terço, uma oração antes da refeição. Se perguntarem, conte por que você reza.",
ora:"Senhor, que a minha fé seja sincera como a de Loide e Eunice, e que os meus filhos a recebam como herança. Amém."},

{t:"Proteção de Deus",ref:"Sl 91(90),9-16",v:"Ele dará ordem aos seus anjos para te guardarem em todos os teus caminhos.",
exp:"O Salmo 91 é uma oração de confiança de quem se abriga em Deus. Ele promete que nenhum mal vai dominar quem confia no Senhor, e que os anjos levam pela mão, para que o pé não tropece. No final, o próprio Deus fala: “Porque se apegou a mim, eu o livrarei”.",
med:["Toda mãe sabe que não consegue estar em todos os lugares: na escola, na rua, no celular, nas amizades. Isso pode gerar muita ansiedade.","Deus colocou um anjo da guarda ao lado de cada filho seu. Rezar pela proteção deles é confiar que eles não estão sozinhos quando você não está por perto."],
perg:"Que medo eu tenho em relação à segurança dos meus filhos? Consigo entregá-lo a Deus?",
des:"Ensine (ou reze junto com) os seus filhos a oração do Santo Anjo. Combine que vão rezá-la juntos todas as noites até o fim deste plano.",
ora:"Santo Anjo do Senhor, meu zeloso guardador, se a ti me confiou a piedade divina, sempre me rege, me guarda, me governa e me ilumina. Amém. Senhor, guarda os meus filhos em todos os seus caminhos."},

{t:"Saúde do corpo e da alma",ref:"Mc 5,21-24.35-43",v:"Não tenhas medo; somente crê.",
exp:"Jairo, chefe da sinagoga, cai aos pés de Jesus: a sua filhinha de doze anos está morrendo. No caminho, chegam avisando que ela já morreu. Jesus diz a Jairo: “Não tenhas medo, somente crê”. Ele entra na casa, pega a mão da menina e diz: “Talitá cum”, “Menina, levanta-te!”. E ela se levanta.",
med:["Toda mãe conhece a angústia de um filho doente. Jairo não ficou em casa chorando: foi até Jesus, ajoelhou-se e pediu. É isso que podemos fazer em cada febre, em cada exame, em cada diagnóstico.","Jesus se importa com a saúde do corpo e da alma dos nossos filhos. E diz a nós o mesmo que disse a Jairo: não tenha medo, somente creia."],
perg:"Há algo na saúde (do corpo, da mente ou da alma) dos meus filhos que me preocupa hoje?",
des:"Hoje, quando os seus filhos estiverem dormindo, coloque a mão sobre a cabeça de cada um e reze pela saúde deles, dizendo o nome e pedindo o que precisam.",
ora:"Jesus, Tu tomaste a mão da filha de Jairo. Toma também a mão dos meus filhos. Dá-lhes saúde do corpo, da mente e da alma. Amém."},

{t:"Um coração bondoso",ref:"Lc 10,30-37",v:"Vai, e faze tu o mesmo.",
exp:"Um especialista na Lei pergunta a Jesus: “Quem é o meu próximo?”. Jesus conta a história de um homem assaltado e deixado meio morto na estrada. Um sacerdote e um levita passam e desviam. Um samaritano, que era visto como inimigo, para, cuida das feridas e paga a hospedagem. Jesus conclui: faça você o mesmo.",
med:["Mais do que filhos “bem-sucedidos”, queremos filhos bons. Num mundo que ensina a competir e a pensar só em si, um coração bondoso é um tesouro.","A bondade se ensina com pequenos gestos: dividir o lanche, consolar o colega, ajudar em casa sem pedir nada em troca. E se ensina vendo a mãe parar para ajudar alguém."],
perg:"Em que situações eu vejo bondade nos meus filhos? Eu tenho elogiado isso?",
des:"Façam juntos hoje um gesto de bondade por alguém: doar um brinquedo, levar algo para um vizinho, escrever um bilhete para alguém triste. Depois conversem sobre como se sentiram.",
ora:"Jesus, dá aos meus filhos um coração bom como o do samaritano, que vê quem sofre e para para ajudar. Amém."},

{t:"Boas amizades",ref:"1Sm 18,1-4",v:"A alma de Jônatas apegou-se à alma de Davi, e Jônatas o amou como a si mesmo.",
exp:"Depois da vitória de Davi sobre Golias, Jônatas, filho do rei Saul, faz uma amizade profunda com ele. Jônatas dá a Davi o seu manto, a espada e o arco, e os dois fazem uma aliança. Mais tarde, Jônatas protege Davi até contra o próprio pai.",
med:["As amizades moldam o coração dos filhos, às vezes mais do que os pais. Um bom amigo ajuda a crescer; uma má companhia pode levar para longe.","Reze pelos amigos dos seus filhos, pelo nome. E reze para que eles encontrem amigos como Jônatas: leais, que protegem e que levam para perto de Deus."],
perg:"Eu conheço os amigos dos meus filhos? Algum me preocupa?",
des:"Pergunte aos seus filhos sobre os amigos deles, com curiosidade e sem julgamento. Reze hoje por cada amigo pelo nome. Se possível, convide um amigo deles para lanchar em casa.",
ora:"Senhor, dá aos meus filhos amigos verdadeiros, que os ajudem a crescer no bem. Afasta deles as más companhias. Amém."},

{t:"Estudos e sabedoria",ref:"1Rs 3,5-12",v:"Dá ao teu servo um coração que escuta, para governar o teu povo e discernir entre o bem e o mal.",
exp:"Deus aparece em sonho ao jovem rei Salomão e diz: “Pede o que queres”. Salomão não pede riqueza, nem vida longa, nem vitória sobre os inimigos. Pede um coração que escuta, para saber distinguir o bem do mal. Deus fica tão contente que lhe dá sabedoria e também o que ele não pediu.",
med:["A sabedoria vai além das notas da escola. É saber escolher o bem, ouvir os conselhos certos, pensar antes de agir. É um dom que se pede a Deus.","Reze pelos estudos dos seus filhos, pela concentração, pela memória, pelos professores. Mas, acima de tudo, peça para eles um coração que escuta."],
perg:"O que eu mais desejo para os meus filhos: sucesso ou sabedoria?",
des:"Antes da escola (ou da lição de casa), reze com seus filhos a oração ao Espírito Santo. Pergunte a eles: “Se Deus te dissesse ‘pede o que quiseres’, o que você pediria?”.",
ora:"Espírito Santo, dá aos meus filhos um coração que escuta. Ilumina os seus estudos e ensina-os a escolher o bem. Amém."},

{t:"Filhos amados de Deus",ref:"Mc 1,9-11",v:"Tu és o meu Filho amado; em ti está o meu agrado.",
exp:"Jesus vai até o rio Jordão e é batizado por João. Ao sair da água, vê os céus se abrirem e o Espírito descer como uma pomba. E uma voz do céu diz: “Tu és o meu Filho amado”. Jesus ainda não tinha feito nenhum milagre: o Pai o ama antes de qualquer coisa que Ele faça.",
med:["No Batismo, Deus disse o mesmo a cada um dos seus filhos: “Tu és meu filho amado”. Esse amor não depende de notas, comportamento ou conquistas.","Quando a criança sabe que é amada sem condições, fica mais forte para enfrentar o mundo. E aprende a ver Deus como um Pai, a partir de como é amada em casa."],
perg:"Os meus filhos sentem que são amados mesmo quando erram?",
des:"Diga hoje a cada filho, olhando nos olhos: “Você é amado(a) por Deus e por mim, do jeito que você é”. Se tiverem fotos do Batismo, mostrem e contem como foi esse dia.",
ora:"Pai, obrigada porque os meus filhos são teus filhos amados. Que eles sintam o teu amor através do meu. Amém."},

{t:"Obediência com amor",ref:"Lc 2,41-52",v:"Desceu com eles para Nazaré e era-lhes submisso. E Jesus crescia em sabedoria, estatura e graça.",
exp:"Depois de ser encontrado no Templo, onde ficou conversando com os mestres, Jesus volta com Maria e José para Nazaré e vive obediente a eles. O Evangelho resume aqueles anos assim: Jesus crescia em sabedoria, em estatura e em graça diante de Deus e das pessoas.",
med:["Até Jesus, o Filho de Deus, obedeceu a Maria e José. A obediência não é só fazer o que mandam: é confiar em quem nos ama e nos guia.","Obediência se ensina com firmeza e amor, juntos. Regras claras, explicadas com calma, cumpridas com coerência, e sempre com muito carinho."],
perg:"Em casa, eu tenho conseguido unir firmeza e carinho? Onde exagero ou deixo de lado?",
des:"Escolham juntos, em família, uma ou duas regras da casa que estão difíceis de cumprir. Expliquem o porquê delas e combinem como fazer. Elogie cada obediência de hoje.",
ora:"Jesus, que foste obediente em Nazaré, ensina os meus filhos a obedecer com amor, e ensina-me a guiá-los com firmeza e ternura. Amém."},

{t:"Coração puro",ref:"Mt 5,1-12",v:"Felizes os puros de coração, porque verão a Deus.",
exp:"No alto do monte, Jesus ensina as bem-aventuranças, o caminho da verdadeira felicidade: felizes os pobres de espírito, os mansos, os que têm fome de justiça, os misericordiosos, os que promovem a paz. E felizes os puros de coração, porque verão a Deus.",
med:["O mundo oferece muita coisa que suja o coração dos nossos filhos, cada vez mais cedo: imagens, músicas, conteúdos violentos ou impuros. Um coração puro é um coração limpo para enxergar Deus.","Proteger a pureza dos filhos é uma missão que exige vigilância (no celular, na TV, nas amizades) e diálogo aberto, sem medo nem vergonha."],
perg:"O que entra pelo olhar e pelos ouvidos dos meus filhos todos os dias?",
des:"Hoje, olhe com atenção o que os seus filhos assistem e ouvem. Se precisar, configure o controle parental. Converse com eles sobre o que é bom e o que faz mal ao coração.",
ora:"Senhor, guarda o coração dos meus filhos puro e limpo, para que eles possam te ver. Protege os seus olhos e ouvidos de todo mal. Amém."},

{t:"Coragem para enfrentar gigantes",ref:"1Sm 17,32-37.45-47",v:"Tu vens a mim com espada e lança, mas eu vou a ti em nome do Senhor.",
exp:"O gigante Golias desafia o exército de Israel e todos têm medo. Davi, um jovem pastor, se oferece para lutar. Saul duvida, mas Davi lembra que Deus o livrou do leão e do urso. Ele enfrenta Golias sem armadura, com uma funda e cinco pedras, confiando em Deus, e vence.",
med:["Seus filhos vão enfrentar gigantes: medo, timidez, provas, bullying, pressão dos amigos. Filhos corajosos não são filhos sem medo, mas filhos que confiam em Deus mesmo com medo.","Davi lembrou das vitórias passadas para ter coragem. Ajude os seus filhos a lembrarem das vezes em que Deus já os ajudou."],
perg:"Qual é o “gigante” que cada filho meu está enfrentando hoje?",
des:"Contem juntos a história de Davi e Golias (pode ser lendo na Bíblia ou numa Bíblia infantil). Pergunte a cada filho qual é o “gigante” dele e rezem juntos por coragem.",
ora:"Senhor, dá aos meus filhos a coragem de Davi. Que, mesmo com medo, eles enfrentem os gigantes em teu nome. Amém."},

{t:"Irmãos unidos",ref:"Gn 45,1-5.14-15",v:"Eu sou José, vosso irmão. Não fiqueis tristes, porque foi para salvar vidas que Deus me enviou adiante de vós.",
exp:"José foi vendido como escravo pelos próprios irmãos, por inveja. Anos depois, ele se torna governador do Egito e os irmãos vão até lá pedir comida. José se revela, chora, abraça e perdoa cada um. Ele reconhece que Deus transformou o mal em bem.",
med:["Brigas entre irmãos são normais e fazem parte do crescimento. Mas a família pode ensinar a resolver as brigas com perdão, como José fez com os irmãos.","Irmãos unidos na infância têm mais chance de serem amigos para a vida. Como diz o salmo: “Como é bom e agradável os irmãos viverem unidos!” (Sl 133). Se você tem filho único, reze pelos primos e amigos que são como irmãos."],
perg:"Como os meus filhos se tratam? Eu comparo ou alimento rivalidades sem perceber?",
des:"Proponha hoje um “dia de gentileza entre irmãos”: cada um faz algo bom pelo outro em segredo e, à noite, conta. Se houver briga, ensine a pedir e a dar perdão com um abraço.",
ora:"Senhor, une os meus filhos no amor. Que eles se perdoem, se protejam e sejam amigos para a vida toda. Amém."},

{t:"Emoções em paz",ref:"Mc 4,35-41",v:"Silêncio! Cala-te! O vento cessou e houve grande calmaria.",
exp:"À tarde, Jesus e os discípulos atravessam o lago de barco. Vem uma tempestade forte e o barco começa a encher de água. Jesus está dormindo. Os discípulos o acordam apavorados. Jesus se levanta, ordena ao vento e ao mar que se acalmem, e tudo fica em paz. Então pergunta: “Por que tendes tanto medo?”.",
med:["Crianças também sentem ansiedade, tristeza, raiva e medo, e muitas vezes não sabem dar nome ao que sentem. Para elas, é uma tempestade dentro do barco.","Jesus está no barco dos seus filhos. Ensine-os a chamá-lo nas tempestades. E seja você também uma presença calma: acolha o sentimento antes de corrigir o comportamento."],
perg:"Que emoção difícil cada um dos meus filhos tem vivido? Eu tenho conseguido acolher?",
des:"Hoje, pergunte a cada filho: “Como está o seu coração hoje?”. Ouça sem corrigir. Ensine uma oração curtinha para os momentos de medo ou raiva: “Jesus, acalma o meu coração”.",
ora:"Jesus, Tu acalmaste a tempestade. Acalma também o coração dos meus filhos. Dá-lhes paz nas emoções e confiança em Ti. Amém."},

{t:"O tempo e as telas",ref:"Ef 5,15-20",v:"Vede bem como vos comportais: não como insensatos, mas como sábios, que aproveitam bem o tempo.",
exp:"São Paulo pede aos cristãos de Éfeso que vivam com sabedoria, aproveitando bem o tempo, porque os dias são maus. Que procurem entender a vontade de Deus e, em vez de se encherem de coisas que não fazem bem, se encham do Espírito, cantando e dando graças.",
med:["As telas disputam o coração e o tempo dos nossos filhos. Elas não são más em si, mas sem limites roubam o sono, a conversa, a brincadeira e até a oração.","Aproveitar bem o tempo é escolher o que enche o coração de vida. Precisamos de sabedoria (e de exemplo: o nosso próprio celular também conta)."],
perg:"Quanto tempo os meus filhos (e eu) passamos nas telas? O que está ficando de fora?",
des:"Combinem hoje um momento sem telas em família (um jantar, uma hora antes de dormir) e façam algo juntos: um jogo, uma história, uma conversa. Comece guardando o seu celular.",
ora:"Senhor, ensina-nos a aproveitar bem o tempo. Que as telas não roubem o que é mais importante na nossa casa. Amém."},

{t:"A vocação de cada filho",ref:"Jr 1,4-10",v:"Antes de te formar no ventre materno, eu te conheci; antes que saísses do seio, eu te consagrei.",
exp:"Deus chama Jeremias para ser profeta. Jeremias se acha muito jovem e diz que não sabe falar. Deus responde que o conhecia antes mesmo de ele nascer, que vai estar com ele e que vai colocar as suas palavras na boca dele.",
med:["Deus tem um plano para cada filho seu, desde antes do ventre. A nossa missão não é escolher a vida deles, mas ajudá-los a descobrir para o que Deus os chamou.","Vocação não é só ser padre ou freira: é o chamado ao matrimônio, à vida consagrada, a uma profissão, a um jeito único de servir. Reze para que eles tenham ouvidos para ouvir esse chamado."],
perg:"Que dons eu vejo em cada um dos meus filhos? Eu tenho dado espaço para que se desenvolvam?",
des:"Diga a cada filho um dom que você enxerga nele (“você é muito cuidadoso”, “você tem jeito com desenho”). Reze pela vocação de cada um, aberta ao que Deus quiser.",
ora:"Senhor, Tu conheces os meus filhos desde antes do ventre. Mostra-lhes a sua vocação e dá-lhes coragem para dizer sim. Amém."},

{t:"Um futuro de esperança",ref:"Jr 29,11-14",v:"Eu sei os planos que tenho para vós: planos de paz e não de desgraça, para vos dar um futuro e uma esperança.",
exp:"O povo de Israel estava exilado na Babilônia, longe de casa, sem saber o que ia acontecer. Pelo profeta Jeremias, Deus manda uma carta: vai cuidar deles, tem planos de paz e vai trazê-los de volta. Quando o buscarem de todo o coração, eles o encontrarão.",
med:["É natural nos preocuparmos com o futuro dos filhos: a profissão, o casamento, a fé, o mundo em que vão viver. A preocupação, porém, não acrescenta um dia à vida deles.","Deus tem planos de paz para os seus filhos. Rezar pelo futuro é entregar a Ele o que não podemos controlar e confiar que Ele vai estar lá quando nós não estivermos."],
perg:"Que preocupação com o futuro dos meus filhos mais pesa no meu coração?",
des:"Escreva uma carta para cada filho (ou uma só para todos) falando dos seus sonhos para eles e da certeza de que Deus os acompanha. Guarde para entregar num momento especial.",
ora:"Senhor, Tu tens planos de paz para os meus filhos. Eu entrego a Ti o futuro deles e confio no teu amor. Amém."},

{t:"O filho que se afastou",ref:"Lc 15,11-24",v:"Ainda longe, o pai o avistou, encheu-se de compaixão, correu-lhe ao encontro, abraçou-o e o cobriu de beijos.",
exp:"Um filho pede a herança ao pai e vai embora, gastando tudo numa vida sem rumo. Quando chega à miséria, cai em si e decide voltar. O pai, que esperava todos os dias, o vê de longe, corre, abraça e faz uma festa. Não cobra nada: só se alegra porque o filho voltou.",
med:["Se algum filho seu se afastou da fé, de casa ou de você, não perca a esperança. O pai da parábola não forçou a volta, mas esperou com a porta aberta e o coração pronto.","Se os seus filhos ainda são pequenos, reze para que, quando errarem, saibam que sempre podem voltar. A porta de casa e a de Deus estão abertas."],
perg:"Algum dos meus filhos está longe (de Deus, de casa ou de mim)? Como está a porta do meu coração para ele?",
des:"Reze hoje uma dezena do terço pelo filho que mais precisa de Deus. Se ele estiver longe, mande uma mensagem simples de carinho, sem cobranças. Se forem pequenos, diga: “Aconteça o que acontecer, você sempre pode voltar para mim”.",
ora:"Pai misericordioso, traz de volta os filhos que se afastaram. Dá-me um coração que espera com amor e uma porta sempre aberta. Amém."},

{t:"Filhos gratos",ref:"Lc 17,11-19",v:"Não foram dez os curados? E os outros nove, onde estão?",
exp:"Dez leprosos pedem a Jesus que tenha piedade deles. Jesus os manda se apresentarem aos sacerdotes e, no caminho, todos são curados. Só um, um samaritano, volta louvando a Deus e se joga aos pés de Jesus para agradecer. Jesus pergunta pelos outros nove.",
med:["Gratidão se ensina praticando. Uma criança grata é mais feliz, mais generosa e reclama menos. E percebe que tudo o que tem é presente.","Muitas vezes damos tudo aos filhos e esquecemos de ensinar a agradecer: a Deus, aos avós, à professora, a quem prepara a comida."],
perg:"Os meus filhos costumam agradecer? Eu agradeço diante deles?",
des:"No jantar de hoje, cada pessoa da família diz três coisas pelas quais é grata a Deus. Ajude os filhos a escreverem um bilhete de agradecimento para alguém (avó, professora, catequista).",
ora:"Senhor, ensina os meus filhos a voltar e agradecer, como o samaritano. Que a nossa casa seja cheia de gratidão. Amém."},

{t:"Os sacramentos na vida dos filhos",ref:"Mc 10,13-16",v:"Deixai vir a mim as crianças e não as impeçais, pois delas é o Reino de Deus.",
exp:"Algumas pessoas trazem crianças para que Jesus as toque, mas os discípulos as repreendem. Jesus fica indignado: “Deixai vir a mim as crianças!”. Depois as abraça, impõe as mãos e as abençoa.",
med:["Os sacramentos são encontros reais com Jesus: o Batismo, a Confissão, a Eucaristia, a Crisma. Levar os filhos a eles é fazer o que aquelas mães fizeram: levar as crianças até Jesus para serem tocadas por Ele.","Às vezes a correria faz a catequese virar só mais um compromisso. Que seus filhos percebam que a Missa e os sacramentos são importantes para você também."],
perg:"Em que ponto da vida sacramental cada filho meu está? Algo está atrasado ou esquecido?",
des:"Verifique se cada filho está em dia com os sacramentos e a catequese da idade dele. Neste domingo, vão juntos à Missa e, na saída, conversem sobre o que acharam.",
ora:"Jesus, eu trago os meus filhos até Ti. Toca-os pelos sacramentos e abençoa-os com as tuas mãos. Amém."},

{t:"Eu, mãe, como exemplo",ref:"Dt 6,4-9",v:"Estas palavras que hoje te ordeno estarão em teu coração. Tu as inculcarás a teus filhos.",
exp:"Moisés ensina ao povo a oração mais importante de Israel: “Ouve, Israel, o Senhor é o único Senhor. Amarás o Senhor teu Deus de todo o coração”. E pede que essas palavras sejam ensinadas aos filhos o tempo todo: sentado em casa, andando pelo caminho, ao deitar e ao levantar.",
med:["Os filhos aprendem muito mais pelo que veem do que pelo que ouvimos dizer. Eles observam como a mãe reage ao estresse, como fala do marido, como reza, como trata quem serve.","Isso não é para pesar, mas para encorajar: você não precisa ser perfeita, precisa ser verdadeira. Quando errar, peça desculpas aos filhos. Isso também ensina."],
perg:"Que exemplo eu tenho dado sem perceber? O que eu gostaria que os meus filhos aprendessem comigo?",
des:"Hoje, escolha um momento comum (no carro, no banho, ao deitar) para falar de Deus com os seus filhos de forma simples, como pede Moisés. Se errou com algum deles recentemente, peça desculpas.",
ora:"Senhor, que a minha vida seja um exemplo de fé para os meus filhos. Perdoa as minhas falhas e usa até elas para ensiná-los. Amém."},

{t:"Consagrar os filhos a Nossa Senhora",ref:"Jo 19,25-27",v:"Mulher, eis aí o teu filho. Depois disse ao discípulo: Eis aí a tua mãe.",
exp:"Aos pés da cruz estavam Maria e o discípulo amado, João. Antes de morrer, Jesus entrega Maria a João como mãe e João a Maria como filho. E desde aquela hora o discípulo a recebeu em sua casa. A Igreja entende que, ali, Jesus entregou Maria como mãe de todos nós.",
med:["Ninguém entende melhor o coração de uma mãe do que Maria. Ela viu o filho crescer, sumir, ser incompreendido e sofrer. E continuou de pé, confiando.","Consagrar os filhos a Nossa Senhora é colocá-los sob o manto de uma Mãe que nunca falha. Depois destes 21 dias, entregue a ela o cuidado de tudo o que você rezou."],
perg:"O que mudou no meu coração de mãe nestes 21 dias?",
des:"Reúna os filhos diante de uma imagem de Nossa Senhora e rezem juntos uma Ave-Maria e a oração de consagração de hoje. Se puder, deem uma flor a Maria.",
ora:"Ó Maria, minha Mãe, eu vos consagro os meus filhos. Cobri-os com o vosso manto, guardai-os do mal e levai-os sempre a Jesus. Eles são vossos. Amém."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="filhos21"){PLANOS[i].d=D;PLANOS[i].resumo="Três semanas cobrindo os seus filhos de oração: fé, proteção, saúde, amizades, emoções, futuro e vocação. Cada dia traz uma leitura explicada, uma meditação, um espaço para escrever e um desafio para viver com eles.";}}
})();

// 30 dias de oração na gestação: versão completa
(function(){
var D=[
{t:"Uma vida nova em mim",ref:"Sl 139(138),13-16",v:"Tu formaste o meu interior, tu me teceste no seio de minha mãe.",
exp:"O salmista contempla, maravilhado, a obra de Deus: foi Ele quem formou cada parte do seu ser, ainda no ventre da mãe, em segredo. Os olhos de Deus viam o embrião, e todos os dias da sua vida já estavam escritos no livro de Deus.",
med:["Neste momento, Deus está tecendo uma vida dentro de você. Cada batida do coração, cada dedinho, cada traço do rosto do seu bebê está sendo formado pelas mãos dele.","Você participa da obra mais bonita da criação. Que estes 30 dias sejam um tempo de contemplar, agradecer e entregar essa vida nas mãos de quem a está tecendo."],
perg:"O que eu sinto ao pensar que Deus está tecendo o meu bebê agora?",
des:"Coloque as mãos sobre a barriga, leia o Salmo 139,13-16 em voz alta para o bebê e agradeça a Deus pela vida dele.",
ora:"Senhor, obrigada pela vida que estás tecendo em mim. Cuida de cada detalhe do meu bebê. Ele é teu. Amém."},

{t:"Um presente de Deus",ref:"Sl 127(126),3-5",v:"Os filhos são herança do Senhor; o fruto do ventre, uma recompensa.",
exp:"Este salmo lembra que tudo o que construímos depende de Deus. E apresenta os filhos como herança e presente do Senhor, como flechas na mão de um guerreiro: uma bênção que fortalece a família.",
med:["Cada filho é um presente, mesmo quando chega em um momento inesperado ou quando a gestação traz medo e insegurança. Deus confiou a você uma vida única.","Receber o filho como presente muda o olhar: não é peso nem problema a resolver, é dom a acolher e a agradecer."],
perg:"Como eu recebi a notícia desta gestação? Consigo ver este bebê como presente de Deus?",
des:"Escreva uma lista de motivos para agradecer por esta gestação. Leia para o pai do bebê ou para alguém querido.",
ora:"Senhor, obrigada pelo presente deste filho. Que eu o receba com alegria e gratidão todos os dias. Amém."},

{t:"Maria também esperou",ref:"Lc 1,26-33",v:"Conceberás e darás à luz um filho, e lhe porás o nome de Jesus.",
exp:"O anjo Gabriel visita uma jovem de Nazaré chamada Maria e anuncia que ela vai conceber e dar à luz um filho, o Filho do Altíssimo, cujo reino não terá fim. Maria, cheia de graça, acolhe a notícia que mudaria a sua vida.",
med:["Nossa Senhora também viveu uma gestação: o corpo mudando, as dúvidas, os enjoos, a expectativa, a viagem a Belém no fim da gravidez. Ela entende o que você sente.","Maria guardou tudo no coração. Você pode conversar com ela sobre cada fase, como uma filha conversa com a mãe."],
perg:"Que sentimento da minha gestação eu gostaria de conversar com Nossa Senhora?",
des:"Reze hoje uma dezena do terço, meditando o primeiro mistério gozoso (a Anunciação), e entregue a sua gestação a Maria.",
ora:"Maria, que esperaste Jesus, acompanha a minha gestação. Ensina-me a guardar tudo no coração como tu. Amém."},

{t:"O bebê que pulou de alegria",ref:"Lc 1,39-45",v:"Quando Isabel ouviu a saudação de Maria, a criança pulou de alegria no seu ventre.",
exp:"Maria, grávida de Jesus, visita a prima Isabel, grávida de João. Quando Maria chega e cumprimenta Isabel, o bebê João pula de alegria no ventre da mãe. Isabel, cheia do Espírito Santo, reconhece a presença do Senhor.",
med:["O bebê de Isabel reconheceu Jesus antes de nascer. A Bíblia mostra que a vida no ventre já é vida plena, capaz de sentir e se alegrar.","O seu bebê também sente a sua voz, o seu carinho, a sua paz. A sua oração já toca a vida dele."],
perg:"Como eu imagino o meu bebê reagindo à minha voz e ao meu carinho?",
des:"Converse hoje com o seu bebê: conte como foi o seu dia, cante uma música, reze uma Ave-Maria em voz alta com a mão na barriga.",
ora:"Senhor, que o meu bebê se alegre com a tua presença desde já, como João se alegrou no ventre de Isabel. Amém."},

{t:"Os medos da gestação",ref:"Is 41,10-13",v:"Não temas, porque eu estou contigo; não te assustes, porque eu sou o teu Deus.",
exp:"Deus fala ao seu povo com ternura: não tenha medo, eu estou com você, vou te fortalecer, te ajudar e te sustentar. E promete: “Eu, o Senhor teu Deus, te seguro pela mão direita”.",
med:["É normal ter medos na gestação: da saúde do bebê, do parto, de não dar conta, das mudanças na vida. Medo não é falta de fé; é sinal de que você ama.","Deus não diz “não sinta medo”, mas “não tema, porque eu estou contigo”. Ele segura a sua mão em cada passo."],
perg:"Qual é o meu maior medo nesta gestação?",
des:"Escreva os seus medos numa folha. Depois, ao lado de cada um, escreva: “Eu estou contigo”. Reze entregando um por um.",
ora:"Senhor, Tu seguras a minha mão. Recebe os meus medos e dá-me a tua paz. Amém."},

{t:"O corpo que muda",ref:"2Cor 4,7.16-18",v:"Trazemos este tesouro em vasos de barro.",
exp:"São Paulo diz que carregamos um tesouro, a vida de Deus, em vasos frágeis de barro. Por isso não desanimamos: mesmo que o nosso exterior se desgaste, o interior se renova dia após dia.",
med:["O seu corpo está mudando muito: peso, pele, cansaço, formas. Às vezes é difícil se olhar no espelho. Mas este “vaso de barro” está carregando um tesouro.","Cada estria, cada quilo, cada dor nas costas faz parte da obra de gerar uma vida. O seu corpo está fazendo algo extraordinário."],
perg:"Como eu tenho olhado para o meu corpo nesta gestação?",
des:"Olhe-se no espelho hoje e, em vez de criticar, agradeça a Deus pelo que o seu corpo está fazendo. Tire uma foto da sua barriga para guardar.",
ora:"Senhor, obrigada pelo meu corpo, que carrega o tesouro da vida. Ensina-me a olhá-lo com gratidão. Amém."},

{t:"Nos dias de enjoo e cansaço",ref:"2Cor 12,7-10",v:"Basta-te a minha graça, pois é na fraqueza que a força se manifesta.",
exp:"São Paulo conta que pediu três vezes a Deus que tirasse dele um sofrimento que chamava de “espinho na carne”. Deus respondeu: “Basta-te a minha graça”. E Paulo entendeu: quando sou fraco, é então que sou forte.",
med:["Há dias em que a gestação pesa: enjoo, cansaço, dores, noites mal dormidas. Nesses dias, você não precisa ser forte. A graça de Deus basta.","Ofereça a Deus os desconfortos pelo seu bebê. Essa é uma forma antiga e bonita de oração: transformar o cansaço em amor."],
perg:"O que mais tem pesado no meu corpo nestes dias? Eu ofereço isso a Deus?",
des:"Hoje, a cada desconforto, faça uma oração curta: “Jesus, eu te ofereço isto pelo meu bebê”. E descanse sem culpa sempre que puder.",
ora:"Senhor, a tua graça me basta. Nos dias de cansaço, sê a minha força. Eu te ofereço cada desconforto pelo meu filho. Amém."},

{t:"Chamado desde o ventre",ref:"Is 49,1-5",v:"O Senhor me chamou desde o ventre materno; desde o seio de minha mãe pronunciou o meu nome.",
exp:"O profeta fala da sua vocação: antes de nascer, Deus já o tinha chamado e pronunciado o seu nome. Deus o preparou como uma flecha escondida, para uma missão. Mesmo quando achava que trabalhava em vão, sabia que a sua recompensa estava com Deus.",
med:["Deus já sabe o nome do seu bebê, já conhece o seu temperamento e tem uma missão para ele no mundo. Antes de você conhecê-lo, Deus já o chamou.","A sua missão de mãe é ajudar esse filho a descobrir o chamado de Deus. E isso começa agora, com a oração."],
perg:"O que eu peço a Deus para a vida e a missão do meu filho?",
des:"Escreva uma oração pela vocação do seu bebê e guarde para ler para ele quando crescer.",
ora:"Senhor, Tu já chamaste o meu filho desde o ventre. Prepara-o para a missão que tens para ele. Amém."},

{t:"Abençoar a barriga",ref:"Nm 6,22-27",v:"O Senhor te abençoe e te guarde! O Senhor faça brilhar sobre ti a sua face.",
exp:"Deus ensina a Moisés a bênção que os sacerdotes devem dar ao povo: que o Senhor abençoe e guarde, faça brilhar o seu rosto, tenha misericórdia e dê a paz. É uma das bênçãos mais antigas da Bíblia.",
med:["A bênção da mãe começa antes do nascimento. Abençoar o bebê é desejar todo o bem para ele, em nome de Deus.","Existe inclusive uma bênção da Igreja para a mãe grávida, que o padre pode dar. Pergunte na sua paróquia."],
perg:"Que bênçãos eu desejo para o meu bebê?",
des:"Faça o sinal da cruz sobre a barriga e reze a bênção de Números para o seu bebê. Peça ao pai do bebê que faça o mesmo. Se possível, peça a bênção de um padre.",
ora:"O Senhor te abençoe e te guarde, meu filho. O Senhor faça brilhar sobre ti a sua face e te dê a paz. Amém."},

{t:"O pai do bebê",ref:"Mt 1,18-24",v:"José fez como o anjo do Senhor havia mandado e acolheu sua esposa.",
exp:"José descobre que Maria está grávida e pensa em deixá-la em segredo. Em sonho, o anjo explica que a criança vem do Espírito Santo e pede que José não tenha medo de receber Maria. José acorda e faz exatamente o que o anjo disse: acolhe Maria e o menino.",
med:["José acolheu Maria e Jesus com amor e coragem, mesmo sem entender tudo. Ele também teve medo e também precisou confiar.","O pai do seu bebê também está vivendo essa gestação, à sua maneira. Às vezes os homens ficam mais quietos, mas também sentem medo e preocupação."],
perg:"Como o pai do bebê está vivendo esta gestação? Eu tenho incluído ele?",
des:"Convide o pai do bebê para sentir os movimentos, ir a uma consulta ou escolher algo do enxoval com você. Rezem juntos por ele e pela missão dele como pai.",
ora:"São José, protetor da Sagrada Família, cuida do pai do meu bebê. Dá-lhe coragem, fé e um coração acolhedor. Amém."},

{t:"Preparar a casa",ref:"Pr 31,10-12.25-30",v:"Ela se veste de força e dignidade e sorri diante do futuro.",
exp:"O livro dos Provérbios termina com um elogio à mulher sábia e forte: ela cuida da casa com dedicação, trabalha com as próprias mãos, abre a mão ao pobre, fala com sabedoria e teme ao Senhor. Ela sorri para o futuro porque confia.",
med:["Arrumar o quartinho, o enxoval e a rotina também é oração quando feito com amor. Cada roupinha dobrada pode ser acompanhada de uma prece.","Não precisa ser tudo perfeito nem caro. O bebê precisa de amor, colo e cuidado, muito mais do que de enfeites."],
perg:"O que ainda me preocupa na preparação da casa para o bebê?",
des:"Enquanto organiza alguma coisa do bebê hoje (roupas, quartinho, bolsa), reze uma Ave-Maria por cada peça ou cantinho.",
ora:"Senhor, abençoa a nossa casa que se prepara para receber este bebê. Que ela seja cheia de amor e paz. Amém."},

{t:"Os irmãos mais velhos",ref:"Sl 133(132)",v:"Como é bom, como é agradável os irmãos viverem unidos!",
exp:"Este salmo curto celebra a alegria da união entre irmãos. Compara essa união a um perfume precioso derramado e ao orvalho que desce sobre os montes. É ali que Deus derrama a sua bênção e a vida.",
med:["Se você já tem filhos, eles também estão vivendo esta gestação: com alegria, curiosidade e, às vezes, ciúme e medo de perder o lugar.","Incluir os irmãos na espera ajuda a preparar o coração deles. Se este é o seu primeiro filho, reze pelos primos, pela família e pelos irmãos que ainda podem vir."],
perg:"Como os irmãos mais velhos (ou a família) estão vivendo a chegada do bebê?",
des:"Faça os irmãos participarem: conversar com a barriga, escolher uma roupinha, desenhar algo para o bebê. Diga a cada um que o amor da mamãe não diminui, só aumenta.",
ora:"Senhor, une os meus filhos no amor desde já. Prepara o coração de cada um para receber o novo irmão. Amém."},

{t:"Exames e consultas",ref:"Is 26,3-4",v:"Tu guardas em perfeita paz aquele cujo espírito se apoia em ti, porque confia em ti.",
exp:"Isaías canta a confiança no Senhor, que é a rocha eterna. Quem se apoia nele com firmeza é guardado em paz. Por isso ele convida: confiem sempre no Senhor.",
med:["Cada exame pode trazer ansiedade: ultrassom, exames de sangue, a espera por resultados. É natural o coração apertar.","Leve Deus com você em cada consulta. Reze antes de entrar, durante o exame e enquanto espera o resultado. A paz vem de se apoiar nele."],
perg:"Que exame ou resultado tem me deixado ansiosa?",
des:"Antes da próxima consulta ou exame, reze Is 26,3-4. Reze também pelos médicos e profissionais que cuidam de você.",
ora:"Senhor, guarda-me em paz. Em cada exame e consulta, eu me apoio em Ti e confio no teu cuidado. Amém."},

{t:"Ansiedade e paz",ref:"Fl 4,4-9",v:"Não vos inquieteis com nada. A paz de Deus guardará os vossos corações.",
exp:"São Paulo pede que os cristãos se alegrem sempre no Senhor e apresentem a Deus todos os pedidos, em oração e agradecimento. Ele promete que a paz de Deus vai guardar o coração. E aconselha a ocupar a mente com tudo o que é verdadeiro, bom e bonito.",
med:["A ansiedade na gestação é comum: o que pode dar errado, o que vem pela frente. E a internet às vezes aumenta o medo com informações demais.","Paulo dá um caminho: entregar em oração e alimentar o pensamento com o que é bom. Escolha bem o que você lê e ouve nestes meses."],
perg:"O que tem alimentado a minha ansiedade? O que posso trocar por coisas boas?",
des:"Hoje, faça um “jejum de pesquisas” sobre a gestação na internet. Em vez disso, leia um salmo ou ouça uma música que te traga paz.",
ora:"Senhor, recebe a minha ansiedade. Guarda o meu coração e os meus pensamentos na tua paz. Amém."},

{t:"Escolher o nome",ref:"Is 43,1-4",v:"Eu te chamei pelo nome: tu és meu. És precioso aos meus olhos.",
exp:"Deus fala ao seu povo: “Não temas, porque eu te resgatei, eu te chamei pelo nome, tu és meu”. Promete estar junto nas águas e no fogo, e diz que o seu povo é precioso e amado.",
med:["O nome é o primeiro presente que damos ao filho. Deus chama cada um pelo nome, com amor pessoal. O nome do seu bebê vai ser pronunciado por Deus também.","Muitas famílias católicas escolhem o nome de um santo, que se torna padroeiro e modelo para a criança."],
perg:"O que eu desejo que o nome do meu filho signifique para ele?",
des:"Pesquise o significado do nome escolhido (ou dos nomes que estão pensando) e se há um santo com esse nome. Reze pedindo a proteção desse santo.",
ora:"Senhor, Tu chamas cada um pelo nome. Abençoa o nome do meu filho e faz dele alguém precioso aos teus olhos. Amém."},

{t:"Descansar em Deus",ref:"Sl 23(22)",v:"O Senhor é o meu pastor, nada me faltará. Em verdes pastagens me faz repousar.",
exp:"No salmo mais conhecido da Bíblia, Davi descreve Deus como um pastor que cuida das ovelhas: leva para pastagens verdes, para águas tranquilas, guia pelo caminho certo e está junto até no vale escuro.",
med:["Descansar faz parte de cuidar do bebê. Deus mesmo “faz repousar”. Não é preguiça nem fraqueza.","Na gestação, o corpo pede mais descanso. Ouça o seu corpo e deixe-se conduzir pelo Bom Pastor às águas tranquilas."],
perg:"Eu tenho me permitido descansar? Ou sinto culpa quando paro?",
des:"Hoje, tire um tempo de descanso de verdade: deite-se, coloque os pés para cima e reze o Salmo 23 devagar.",
ora:"Senhor, meu Pastor, faz-me repousar. Contigo nada me falta, nem a mim nem ao meu bebê. Amém."},

{t:"Nossa Senhora do Bom Parto",ref:"Lc 2,1-7",v:"Enquanto estavam em Belém, completaram-se os dias para o parto, e Maria deu à luz o seu filho primogênito.",
exp:"Por causa de um recenseamento, José e Maria, já no fim da gravidez, viajam de Nazaré até Belém. Lá, chegam os dias do parto. Não havia lugar para eles na hospedaria, e Maria dá à luz Jesus, envolve-o em faixas e o deita numa manjedoura.",
med:["Maria deu à luz longe de casa, num lugar simples, sem o conforto que planejava. Ela entende as incertezas do parto.","Nossa Senhora do Bom Parto é uma devoção antiga das gestantes. Elas pedem a Maria que as acompanhe no momento do nascimento, como uma mãe acompanha a filha."],
perg:"O que eu gostaria de pedir a Nossa Senhora sobre o meu parto?",
des:"Reze hoje a oração a Nossa Senhora do Bom Parto (ou uma dezena do terço meditando o nascimento de Jesus), entregando o seu parto a ela.",
ora:"Nossa Senhora do Bom Parto, acompanha-me na hora do nascimento do meu filho. Cobre-nos com o teu manto. Amém."},

{t:"Vida em abundância",ref:"Jo 10,10-11",v:"Eu vim para que tenham vida, e vida em abundância.",
exp:"Jesus se apresenta como o Bom Pastor. Diz que o ladrão vem para roubar e destruir, mas Ele veio trazer vida, e vida em abundância. O bom pastor dá a vida pelas suas ovelhas.",
med:["Santa Gianna Beretta Molla foi médica, esposa e mãe. Na sua última gravidez, descobriu uma doença grave e escolheu proteger a vida da filha. Ela é exemplo de amor generoso pela vida.","Jesus veio trazer vida em abundância. A gestação é participação nessa obra de Deus: dar vida, cuidar da vida, defender a vida."],
perg:"O que significa para mim “vida em abundância” para o meu filho?",
des:"Leia um pouco sobre Santa Gianna e reze pedindo a intercessão dela pela sua gestação e por todas as gestantes.",
ora:"Santa Gianna, intercede por mim e pelo meu bebê. Jesus, dá-nos vida em abundância. Amém."},

{t:"A misericórdia de geração em geração",ref:"Lc 1,46-50",v:"A sua misericórdia se estende de geração em geração sobre aqueles que o temem.",
exp:"Grávida de Jesus, Maria canta o Magnificat na casa de Isabel. Ela louva a Deus que olhou para a sua humildade e fez nela grandes coisas. E proclama que a misericórdia de Deus passa de geração em geração.",
med:["O seu bebê é uma nova geração da sua família. A misericórdia de Deus que alcançou os seus avós e os seus pais agora alcança o seu filho.","São Geraldo Majela, religioso redentorista, é muito invocado como padroeiro das gestantes. Peça a ele que interceda pela nova geração que está a caminho."],
perg:"Que herança de fé eu quero passar para o meu filho?",
des:"Reze o Magnificat (Lc 1,46-55) hoje e peça a intercessão de São Geraldo Majela pelo seu bebê.",
ora:"São Geraldo Majela, padroeiro das gestantes, rogai por nós. Senhor, que a tua misericórdia alcance o meu filho. Amém."},

{t:"Pensando no Batismo",ref:"Jo 3,1-6",v:"Quem não nascer da água e do Espírito não pode entrar no Reino de Deus.",
exp:"Nicodemos, um fariseu, visita Jesus à noite. Jesus diz que é preciso nascer de novo. Nicodemos não entende: como alguém pode voltar ao ventre da mãe? Jesus explica que se trata de nascer da água e do Espírito.",
med:["O seu bebê vai nascer duas vezes: do seu ventre e, no Batismo, da água e do Espírito, como filho de Deus. O Batismo será o primeiro grande encontro dele com Jesus.","Pensar no Batismo desde já ajuda a prepará-lo com amor: escolher bem os padrinhos, a paróquia, a data."],
perg:"Que tipo de padrinhos eu quero para o meu filho? Pessoas que vão ajudá-lo na fé?",
des:"Converse com o pai do bebê sobre o Batismo: a paróquia, os possíveis padrinhos e a data. Reze pelos futuros padrinhos.",
ora:"Senhor, prepara o meu filho para nascer da água e do Espírito. Que ele seja teu filho amado desde o Batismo. Amém."},

{t:"Conversar com o bebê",ref:"Sl 145(144),1-7",v:"Uma geração louva as tuas obras à outra e anuncia as tuas maravilhas.",
