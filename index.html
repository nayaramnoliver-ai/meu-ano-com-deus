{id:"advento24",titulo:"Advento em família: 24 dias até o Natal",cat:"Advento e Natal",cor:"lilas",ic:"vela",destaque:true,
resumo:"Um passo por dia de 1º a 24 de dezembro: uma história da Bíblia, uma conversa e uma atividade simples para viver o Advento com os filhos.",
d:[
["O povo que esperava","O povo que andava nas trevas viu uma grande luz.","Is 9,1","O Advento começa no escuro, esperando a luz. Cada vela acesa na coroa mostra que Jesus está chegando.","Acendam a vela da coroa (ou uma vela comum) e expliquem às crianças: “cada semana a luz aumenta, porque Jesus está mais perto”.","Vem, Senhor Jesus, ilumina a nossa casa!"],
["Uma promessa de Deus","A virgem conceberá e dará à luz um filho, e o chamará Emanuel.","Is 7,14","Deus prometeu um Salvador muitos anos antes do Natal. Deus sempre cumpre o que promete.","Pergunte às crianças: “qual foi a última promessa que você cumpriu?”. Conte que Deus cumpre todas.","Obrigada, Deus, porque Tu sempre cumpres as tuas promessas."],
["Noé e o arco-íris","Ponho o meu arco nas nuvens como sinal da aliança.","Gn 9,13","O arco-íris é sinal de que Deus nunca abandona o seu povo. Ele cuida da nossa família também.","Desenhem juntos um arco-íris e escrevam: “Deus cuida de nós”.","Senhor, obrigada pelo teu cuidado com a nossa família."],
["Abraão e as estrelas","Olha para o céu e conta as estrelas, se puderes.","Gn 15,5","Deus prometeu a Abraão uma família enorme. Nós fazemos parte dessa família de fé!","À noite, olhem as estrelas (da janela ou do quintal) e agradeçam pela família.","Deus de Abraão, obrigada por nos fazer parte da tua grande família."],
["Davi, o pequeno pastor","O homem vê a aparência, mas o Senhor olha o coração.","1Sm 16,7","Deus escolheu Davi, o menor dos irmãos. Para Deus, o que importa é o coração.","Cada pessoa da família diz uma qualidade “de coração” de outra pessoa.","Senhor, que o meu coração seja bonito aos teus olhos."],
["Preparai o caminho","Preparai o caminho do Senhor.","Mc 1,3","João Batista convidava todos a preparar o coração para Jesus. Preparar é deixar o caminho livre.","Arrumem juntos o cantinho do presépio (ainda sem o Menino Jesus).","Jesus, nós estamos preparando o caminho para Ti."],
["Endireitar o que está torto","Todo vale será aterrado e todo monte rebaixado; o que é torto será endireitado.","Lc 3,5","No Advento, a gente “endireita” atitudes: uma birra, uma mentira, uma preguiça.","Cada um escolhe uma atitude para melhorar até o Natal e escreve num papelzinho.","Senhor, ajuda-nos a endireitar o nosso coração."],
["Maria, cheia de graça","Alegra-te, cheia de graça, o Senhor está contigo.","Lc 1,28","Hoje é festa de Nossa Senhora da Conceição. Deus preparou Maria com muito amor para ser a mãe de Jesus.","Rezem juntos uma Ave-Maria diante de uma imagem de Nossa Senhora e levem uma florzinha ou um desenho para ela.","Nossa Senhora, mãe de Jesus e nossa mãe, cuida da nossa família."],
["Frutos bons","Produzi frutos que mostrem a vossa conversão.","Mt 3,8","Uma árvore boa dá frutos bons. Nossas atitudes são os frutos do nosso coração.","Comam uma fruta juntos e conversem: “que fruto bom eu dei hoje?”.","Senhor, que a nossa família dê bons frutos."],
["Partilhar","Quem tiver duas túnicas, dê uma a quem não tem.","Lc 3,11","Preparar o Natal é também lembrar de quem tem pouco.","Separem com as crianças roupas ou brinquedos em bom estado para doar.","Jesus, ensina-nos a partilhar com alegria."],
["O perdão de Deus","Se confessarmos os nossos pecados, Ele é fiel e justo para nos perdoar.","1Jo 1,9","A Confissão é um presente de Natal adiantado: Deus limpa o nosso coração.","Combine com a família um dia para a Confissão (para quem já fez a Primeira Comunhão).","Senhor, obrigada pelo teu perdão que nos deixa novos."],
["Nossa Senhora de Guadalupe","Apareceu no céu um grande sinal: uma mulher vestida de sol.","Ap 12,1","Nossa Senhora apareceu a São João Diego esperando o bebê Jesus. Ela é mãe carinhosa de todos nós.","Mostre às crianças a imagem de Nossa Senhora de Guadalupe e conte a história das rosas no manto.","Mãe de Guadalupe, guarda as nossas crianças no teu manto."],
["Domingo da alegria","Alegrai-vos sempre no Senhor! O Senhor está perto.","Fl 4,4-5","Hoje a vela é rosa: a alegria aumenta porque o Natal está pertinho!","Façam algo alegre: um bolo, uma música, uma dança de Natal.","Jesus, a nossa alegria é saber que estás chegando!"],
["O anjo visita Maria","Não tenhas medo, Maria, encontraste graça diante de Deus.","Lc 1,30","Maria ficou surpresa, mas confiou. Quando Deus pede algo, Ele também dá coragem.","Brinquem de teatrinho: alguém é o anjo Gabriel e alguém é Maria.","Senhor, como Maria, nós queremos dizer sim a Ti."],
["Maria visita Isabel","Quando Isabel ouviu a saudação de Maria, a criança pulou de alegria no seu ventre.","Lc 1,41","Até o bebê João pulou de alegria! Jesus traz alegria para onde chega.","Visitem ou liguem para alguém da família (avó, tia) para levar alegria.","Jesus, que a gente leve a tua alegria para os outros."],
["Um nome especial","Ele salvará o seu povo dos seus pecados.","Mt 1,21","Jesus quer dizer “Deus salva”. Hoje começa a Novena de Natal em muitas casas.","Conte às crianças o significado do nome delas e do nome de Jesus. Comecem a Novena de Natal (aba Orar).","Jesus, o teu nome é o mais bonito de todos."],
["Belém, a pequenina","E tu, Belém, tão pequena... de ti sairá aquele que vai governar o meu povo.","Mq 5,1","Deus escolheu uma cidade pequena. Ele gosta de agir nas coisas pequenas.","Façam juntos uma estrela de papel para colocar sobre o presépio.","Senhor, obrigada porque gostas das coisas pequenas."],
["A viagem até Belém","José subiu a Belém com Maria, sua esposa, que estava grávida.","Lc 2,4-5","Maria e José fizeram uma longa viagem. Às vezes a vida pede coragem e paciência.","Façam Maria e José “andarem” um pouquinho pela casa a cada dia até chegarem ao presépio.","São José e Nossa Senhora, caminhem conosco até o Natal."],
["Não havia lugar","Deitou-o numa manjedoura, porque não havia lugar para eles na hospedaria.","Lc 2,7","Muitas portas se fecharam para a Sagrada Família. Nós queremos abrir a porta do coração.","Cada um faz uma pequena “caminha de palha” para Jesus: um bilhete com uma boa ação feita, colocado no presépio.","Jesus, no meu coração sempre vai ter lugar para Ti."],
["Os pastores","Havia naquela região pastores que vigiavam o rebanho durante a noite.","Lc 2,8","Os primeiros a saber do Natal foram pastores simples. Jesus vem para os humildes.","Coloquem os pastores e as ovelhinhas no presépio e acendam a quarta vela.","Jesus, que a nossa família seja simples como os pastores."],
["Uma grande alegria","Eu vos anuncio uma grande alegria, que será para todo o povo.","Lc 2,10","A notícia do Natal é para todos. É a melhor notícia do mundo!","Façam cartões de Natal para entregar aos vizinhos ou parentes.","Senhor, que a gente anuncie a alegria do Natal."],
["Glória a Deus","Glória a Deus no mais alto dos céus, e paz na terra aos homens por Ele amados.","Lc 2,14","Os anjos cantaram de alegria! Cantar também é rezar.","Ensaiem juntos uma música de Natal para cantar na noite do dia 24.","Glória a Deus nas alturas! Paz na nossa casa!"],
["Deus conosco","Emanuel, que quer dizer: Deus está conosco.","Mt 1,23","Amanhã é a véspera. Deus vem para ficar com a gente, todos os dias.","Preparem juntos a mesa ou a decoração da ceia, com calma e alegria.","Deus conosco, fica para sempre na nossa casa."],
["Noite santa","O Verbo se fez carne e habitou entre nós.","Jo 1,14","Chegou! Esta noite celebramos o nascimento de Jesus. O maior presente já está aqui.","Antes da ceia, reúna a família, coloque o Menino Jesus no presépio e cantem “Noite Feliz”.","Menino Jesus, bem-vindo à nossa casa! Feliz aniversário, Jesus!"]
]},

{id:"paciencia14",titulo:"14 dias para ser uma mãe mais paciente",cat:"Filhos",cor:"amarelo",ic:"coracao",
resumo:"Duas semanas de pequenos passos para trocar o grito pela calma, com a ajuda da graça de Deus.",
d:[
["Paciência é fruto do Espírito","O fruto do Espírito é amor, alegria, paz, paciência...","Gl 5,22","Paciência não é só força de vontade: é fruto de Deus em nós. Por isso começamos pedindo.","Escolha uma palavra para repetir quando perder a calma: “Jesus, eu confio em vós”.","Espírito Santo, faz crescer em mim o fruto da paciência."],
["Deus é paciente comigo","O Senhor é compassivo e misericordioso, lento para a ira e rico em amor.","Sl 103(102),8","Pense quantas vezes Deus teve paciência com você. A paciência que recebemos, aprendemos a dar.","Anote 3 vezes em que Deus foi paciente com você.","Obrigada, Senhor, pela tua paciência comigo. Ensina-me a ser assim com os meus filhos."],
["Respirar antes de responder","O paciente é rico em prudência; o impaciente mostra a sua loucura.","Pr 14,29","Entre o que acontece e a nossa reação existe um espaço. Uma respiração muda tudo.","Hoje, antes de corrigir, respire fundo três vezes.","Senhor, coloca uma pausa entre o meu sentimento e a minha reação."],
["Cada fase tem o seu tempo","Quando eu era criança, falava como criança, pensava como criança.","1Cor 13,11","Muitas birras são próprias da idade. Entender a fase do filho acalma a mãe.","Observe hoje: o que o meu filho está tentando me dizer com esse comportamento?","Senhor, dá-me olhos para entender os meus filhos em cada fase."],
["Mãe cansada","Ele dá força ao cansado e vigor ao fraco.","Is 40,29","Muita impaciência é cansaço acumulado. Cuidar de você também é cuidar dos filhos.","Durma 30 minutos mais cedo hoje ou faça uma pausa de verdade.","Senhor, eu estou cansada. Renova as minhas forças."],
["O tom de voz","Que a vossa palavra seja sempre amável, temperada com sal.","Cl 4,6","Falar baixo e perto funciona mais do que gritar de longe.","Hoje, quando precisar chamar atenção, aproxime-se e fale baixo, olhando nos olhos.","Senhor, suaviza a minha voz e as minhas palavras."],
["Pedir perdão aos filhos","Confessai os vossos pecados uns aos outros e orai uns pelos outros.","Tg 5,16","Quando a mãe pede perdão, o filho aprende a pedir perdão também. Isso não diminui a autoridade: aumenta o amor.","Se perdeu a calma recentemente, peça perdão ao seu filho com simplicidade.","Jesus, dá-me humildade para pedir perdão aos meus filhos."],
["Corrigir com amor","O Senhor corrige a quem ama, como um pai ao filho querido.","Pr 3,12","Corrigir é necessário, mas o amor precisa aparecer junto. Firmeza e ternura andam de mãos dadas.","Depois de corrigir, dê um abraço e diga: “eu te amo sempre”.","Senhor, ensina-me a corrigir como Tu corriges: com amor."],
["Uma rotina que ajuda","Tudo tem o seu tempo.","Ecl 3,1","Muitas brigas acontecem nos mesmos horários: acordar, banho, dormir. Uma rotina simples evita desgaste.","Identifique o horário mais difícil do dia e pense numa pequena mudança para ele.","Senhor, ajuda-me a organizar os nossos dias com sabedoria."],
["Sem comparação","Eu te louvo porque me fizeste de modo tão maravilhoso.","Sl 139(138),14","Cada filho é único, e cada mãe também. Comparar rouba a paz.","Não compare seu filho (nem você) com ninguém hoje.","Senhor, obrigada porque fizeste cada um de nós de um jeito único."],
["Esperar os frutos","Vede o agricultor: espera com paciência o fruto precioso da terra.","Tg 5,7","Educar é semear. Os frutos aparecem com o tempo, não no mesmo dia.","Anote uma melhora pequena que você já percebeu em um filho.","Senhor, dá-me a paciência do agricultor com os meus filhos."],
["Escutar o coração","Ele abraçava as crianças e as abençoava.","Mc 10,16","Por trás de um comportamento difícil, às vezes existe um coração pedindo colo.","Passe 10 minutos de atenção exclusiva com cada filho.","Jesus, ensina-me a abraçar e abençoar os meus filhos como Tu fazias."],
["Mansidão","Aprendei de mim, que sou manso e humilde de coração.","Mt 11,29","Mansidão é força sob controle. É a força mais bonita de uma mãe.","Reze a jaculatória o dia todo: “Jesus, manso e humilde de coração, fazei o meu coração semelhante ao vosso”.","Jesus, manso e humilde de coração, fazei o meu coração semelhante ao vosso."],
["Recomeçar todo dia","As misericórdias do Senhor se renovam a cada manhã.","Lm 3,22-23","Você não precisa ser perfeita. Cada manhã é uma página nova, com graça nova.","Escreva uma frase de encorajamento para você mesma e deixe no espelho.","Senhor, obrigada pela tua misericórdia que se renova a cada manhã. Eu recomeço contigo."]
]},

{id:"paz7",titulo:"7 dias de paz para o coração",cat:"Para mim",cor:"azul",ic:"pomba",
resumo:"Para os dias de preocupação e ansiedade: uma semana aprendendo a entregar tudo nas mãos de Deus.",
d:[
["Lançar as preocupações","Lançai sobre Ele toda a vossa preocupação, porque Ele cuida de vós.","1Pd 5,7","Deus não quer que você carregue tudo sozinha. Ele pede: me entrega.","Escreva tudo o que te preocupa numa lista. Reze entregando item por item.","Senhor, eu lanço sobre Ti cada preocupação. Eu sei que cuidas de mim."],
["Um dia de cada vez","Não vos preocupeis com o dia de amanhã. A cada dia basta o seu cuidado.","Mt 6,34","A ansiedade vive no futuro. Deus nos dá graça para hoje, não para amanhã.","Quando a mente correr para o futuro, diga: “hoje, Senhor, só hoje”.","Senhor, ensina-me a viver um dia de cada vez contigo."],
["Respirar com Deus","Tu guardas em perfeita paz aquele cujo pensamento está firme em ti.","Is 26,3","Uma oração simples ajuda o corpo e a alma: ao puxar o ar, “Jesus”; ao soltar, “eu confio em vós”.","Faça essa oração da respiração por 2 minutos, três vezes hoje.","Jesus, eu confio em vós."],
["Você não está sozinha","Não temas, porque eu estou contigo; não te assustes, porque eu sou o teu Deus.","Is 41,10","Mesmo quando parece que ninguém entende, Deus está ao seu lado, segurando a sua mão.","Converse com uma amiga de confiança sobre o que você está sentindo.","Senhor, obrigada porque nunca estou sozinha."],
["Cuidar dos pensamentos","Tudo o que é verdadeiro, tudo o que é amável... ocupe os vossos pensamentos.","Fl 4,8","Nem todo pensamento merece morar em nós. Podemos escolher onde colocar o olhar.","Troque um pensamento negativo por uma verdade de Deus sempre que ele aparecer.","Senhor, guarda a minha mente e enche-a de pensamentos bons."],
["Gratidão que acalma","Não vos inquieteis com nada; apresentai a Deus os vossos pedidos com ação de graças.","Fl 4,6","Agradecer tira o foco do que falta e mostra o que Deus já fez.","Antes de dormir, agradeça por 3 coisas do dia.","Obrigada, Senhor, pelo que já fizeste. Eu confio no que vais fazer."],
["Descansar em Deus","Em paz me deito e logo adormeço, porque só Tu, Senhor, me fazes viver em segurança.","Sl 4,9","O sono também é entrega. Dormir é confiar que Deus continua acordado cuidando de tudo.","Antes de dormir, reze este versículo e entregue a noite a Deus.","Senhor, em paz eu me deito. Cuida de mim e da minha casa esta noite."]
]},

{id:"maria9",titulo:"9 dias com Nossa Senhora",cat:"Nossa Senhora",cor:"azul",ic:"estrela",
resumo:"Nove passos pela vida de Maria no Evangelho, para aprender com ela a ser mulher, mãe e filha de Deus.",
d:[
["Maria do sim","Eis a serva do Senhor; faça-se em mim segundo a tua palavra.","Lc 1,38","Maria não sabia de tudo, mas confiou. O sim dela abriu as portas para Jesus entrar no mundo.","Diga um “sim” a Deus hoje em algo que você vinha adiando.","Maria, ensina-me a dizer sim a Deus como tu disseste."],
["Maria que serve","Maria partiu apressadamente para a região montanhosa.","Lc 1,39","Grávida, Maria foi ajudar a prima. O amor verdadeiro se mexe.","Ajude alguém hoje sem que peçam.","Maria, ensina-me a servir com alegria e prontidão."],
["Maria que louva","A minha alma engrandece o Senhor, e o meu espírito se alegra em Deus, meu Salvador.","Lc 1,46-47","Maria transformou a alegria em louvor. Ela canta as maravilhas de Deus.","Reze o Magnificat (aba Orar) devagar.","Maria, ensina-me a louvar a Deus em todos os momentos."],
["Maria mãe em Belém","Envolveu-o em faixas e deitou-o numa manjedoura.","Lc 2,7","Maria cuidou de Jesus com o que tinha. Cuidar com simplicidade também é santo.","Ofereça a Deus os cuidados com os seus filhos hoje: banho, comida, colo.","Maria, ensina-me a cuidar com amor, mesmo nas coisas simples."],
["Maria que guarda no coração","Maria guardava todas estas coisas, meditando-as no seu coração.","Lc 2,19","Maria não entendia tudo na hora, mas guardava e meditava. O coração dela era um lugar de oração.","Tire 5 minutos de silêncio para lembrar o que Deus tem feito na sua vida.","Maria, ensina-me a guardar e meditar as coisas de Deus."],
["Maria que procura Jesus","Teu pai e eu te procurávamos, aflitos.","Lc 2,48","Até Maria passou por aflições. Quando perdemos Jesus de vista, ela nos ajuda a reencontrá-lo.","Volte a um hábito de oração que você deixou de lado.","Maria, quando eu me afastar de Jesus, ajuda-me a encontrá-lo de novo."],
["Maria que intercede","Eles não têm mais vinho.","Jo 2,3","Maria percebe o que falta e leva a Jesus. Ela faz isso pela sua família também.","Conte a Nossa Senhora uma necessidade concreta da sua casa.","Maria, apresenta a Jesus o que falta na minha família."],
["Maria ao pé da cruz","Junto à cruz de Jesus estava de pé Maria, sua mãe.","Jo 19,25","Maria ficou firme na hora mais difícil. Ela sabe o que é sofrer como mãe.","Reze por uma mãe que está sofrendo e, se puder, mande uma mensagem a ela.","Maria, Mãe das Dores, fica comigo nos momentos difíceis."],
["Maria que reza com a Igreja","Todos perseveravam na oração com Maria, a mãe de Jesus.","At 1,14","Maria rezava com os apóstolos esperando o Espírito Santo. Ela reza conosco hoje.","Consagre-se a Nossa Senhora com a oração “Ó minha Senhora e também minha Mãe” (aba Orar).","Ó minha Senhora e também minha Mãe, eu me ofereço toda a vós."]
]},

{id:"anonovo7",titulo:"7 dias para começar o ano com Deus",cat:"Ano novo",cor:"amarelo",ic:"sol",
resumo:"Uma semana para olhar para trás com gratidão e planejar 2027 com Deus no centro.",
d:[
["Entregar o ano","Coroas o ano com a tua bondade.","Sl 65(64),12","Antes de qualquer meta, entregamos o ano inteiro nas mãos de Deus.","Escreva no topo de uma folha: “2027 é teu, Senhor” e guarde na sua Bíblia ou planner.","Senhor, eu te entrego este ano inteiro. Coroa-o com a tua bondade."],
["Até aqui o Senhor nos ajudou","Até aqui o Senhor nos ajudou.","1Sm 7,12","Olhar para trás mostra quantas vezes Deus nos sustentou. Isso dá coragem para seguir.","Liste 5 momentos de 2026 em que Deus te ajudou.","Obrigada, Senhor, porque até aqui me ajudaste."],
["Planos de paz","Eu conheço os planos que tenho para vós: planos de paz e não de desgraça.","Jr 29,11","Deus tem bons planos para você. Escolha uma palavra para guiar o seu ano.","Escolha uma palavra para 2027 (paz, confiança, alegria...) e escreva num lugar visível.","Senhor, que os teus planos de paz se cumpram na minha vida."],
["Metas com Deus","O coração do homem planeja o seu caminho, mas é o Senhor quem dirige os seus passos.","Pr 16,9","Planejar é bom; deixar Deus guiar é melhor ainda.","Escreva 3 metas para o ano: uma para a fé, uma para a família e uma para você.","Senhor, dirige os meus passos e as minhas metas."],
["Uma rotina de oração","De madrugada, Jesus levantou-se e foi rezar num lugar deserto.","Mc 1,35","Se até Jesus precisava de um tempo de oração, nós também. Uma rotina simples sustenta o ano.","Defina o seu horário de oração e coloque um alarme no celular.","Jesus, ensina-me a reservar um tempo para Ti todos os dias."],
["A família em 2027","Teus filhos serão como brotos de oliveira ao redor da tua mesa.","Sl 128(127),3","Que este ano seja de mais presença, mais mesa e mais oração em família.","Escolha com a família um compromisso para o ano (ex.: Missa juntos aos domingos, terço uma vez por semana).","Senhor, abençoa a minha família neste novo ano."],
["Seguir em frente","Esquecendo o que fica para trás, avanço para o que está adiante.","Fl 3,13","O passado está nas mãos da misericórdia de Deus. O futuro está nas mãos da sua providência.","Escolha um peso de 2026 para deixar para trás e entregue a Deus em oração.","Senhor, eu sigo em frente contigo, de mãos dadas."]
]},

{id:"sagrada10",titulo:"10 dias com a Sagrada Família",cat:"Lar",cor:"amarelo",ic:"casa",
resumo:"Aprender com Jesus, Maria e José a viver a fé no dia a dia da casa, com simplicidade e amor.",
d:[
["Deus escolheu uma família","Voltaram para a Galileia, para Nazaré, sua cidade. O menino crescia e se fortalecia.","Lc 2,39-40","Deus poderia ter vindo de muitos jeitos, mas escolheu uma família. A família é sagrada para Ele.","Coloque uma imagem da Sagrada Família num lugar de destaque.","Jesus, Maria e José, abençoai a minha família."],
["Maria, a mãe","Sua mãe conservava todas estas coisas no coração.","Lc 2,51","Maria era uma mãe atenta, que guardava cada momento. Ela é modelo de mãe para nós.","Guarde um momento bonito de hoje com os filhos: escreva ou tire uma foto.","Maria, ensina-me a ser mãe como tu."],
["José, o justo","José, seu esposo, era um homem justo.","Mt 1,19","José protegeu Maria e Jesus com coragem e silêncio. Reze pelos homens da sua família.","Reze a oração a São José pelo seu esposo ou pelo pai dos seus filhos.","São José, protege a minha família como protegeste Jesus e Maria."],
["O trabalho de Nazaré","Não é este o filho do carpinteiro?","Mt 13,55","Jesus aprendeu o trabalho com José. O trabalho de casa e de fora também santifica.","Ofereça a Deus cada tarefa de hoje, dizendo: “é para Ti, Senhor”.","Senhor, santifica o nosso trabalho de cada dia."],
["Jesus crescia","O menino crescia, tornava-se robusto e cheio de sabedoria.","Lc 2,40","Jesus cresceu aos poucos, como os nossos filhos. Cada fase é um presente.","Observe e agradeça por algo novo que o seu filho aprendeu.","Jesus, abençoa o crescimento dos meus filhos."],
["Uma família que reza","Seus pais iam todos os anos a Jerusalém para a festa da Páscoa.","Lc 2,41","A Sagrada Família tinha o hábito de rezar e ir ao templo. Os hábitos de fé formam o coração.","Combinem um hábito de oração da família para a próxima semana.","Senhor, que a nossa família seja uma família que reza."],
["Nas dificuldades","José levantou-se de noite, tomou o menino e sua mãe e partiu para o Egito.","Mt 2,14","A Sagrada Família passou por medo, viagem e mudança. Eles entendem as nossas dificuldades.","Entregue à Sagrada Família a maior dificuldade da sua casa hoje.","Sagrada Família, ajudai-nos nas dificuldades."],
["Procurar Jesus","Depois de três dias, o encontraram no templo.","Lc 2,46","Maria e José procuraram Jesus até encontrar. Às vezes a família precisa reencontrar Jesus.","Visitem uma igreja juntos, nem que seja por 5 minutos.","Jesus, que a nossa família sempre te procure e te encontre."],
["O silêncio de Nazaré","Aquietai-vos e sabei que eu sou Deus.","Sl 46(45),11","A casa de Nazaré era simples e silenciosa. O silêncio ajuda a ouvir Deus.","Faça um momento de 5 minutos de silêncio em casa (pode ser na hora de dormir).","Senhor, ensina-nos a fazer silêncio para te ouvir."],
["Consagrar a família","Reine em vossos corações a paz de Cristo e sede agradecidos.","Cl 3,15","Depois desses dias, consagramos a nossa casa à Sagrada Família.","Faça a consagração do lar à Sagrada Família (aba Orar) com a família reunida.","Jesus, Maria e José, a vós consagro a minha família."]
]},

{id:"gratidao14",titulo:"14 dias de gratidão no lar",cat:"Lar",cor:"verde",ic:"coracao",
resumo:"Duas semanas para treinar o olhar e encher a casa de agradecimento, das coisas grandes às pequenininhas.",
d:[
["Não esquecer os benefícios","Bendize, ó minha alma, o Senhor, e não esqueças nenhum de seus benefícios.","Sl 103(102),2","A gratidão começa com memória: lembrar o que Deus já fez.","Comece uma lista de gratidão (pode ser nas anotações do app).","Senhor, que eu nunca esqueça o bem que me fazes."],
["Pela vida","Eu te louvo porque me fizeste de modo tão maravilhoso.","Sl 139(138),14","A sua vida é um presente de Deus. Hoje agradeça por existir.","Agradeça por 3 coisas em você mesma.","Obrigada, Senhor, pela minha vida."],
["Pela casa","O meu povo habitará em moradas de paz.","Is 32,18","Não importa o tamanho: a sua casa é abrigo e lugar de amor.","Ande pela casa agradecendo por cada cômodo.","Obrigada, Senhor, pela casa que nos deste."],
["Por tudo","Dai graças sempre e por tudo a Deus Pai.","Ef 5,20","Agradecer “por tudo” é confiar que Deus está em todas as coisas.","Agradeça em voz alta 3 vezes hoje, por coisas simples.","Obrigada, Senhor, por tudo."],
["Pelos filhos","Os filhos são herança do Senhor.","Sl 127(126),3","Os filhos são presente, mesmo nos dias difíceis.","Diga a cada filho: “eu agradeço a Deus por você”.","Obrigada, Senhor, por cada filho que me confiaste."],
["Pelo alimento","Ergueu os olhos ao céu e pronunciou a bênção.","Mt 14,19","Jesus agradecia antes de comer. A mesa é um lugar de gratidão.","Reze a oração antes das refeições com a família.","Abençoa, Senhor, o alimento e as mãos que o prepararam."],
["Pelas dificuldades","Tudo concorre para o bem daqueles que amam a Deus.","Rm 8,28","Algumas coisas difíceis nos fizeram crescer. Deus tira bem de tudo.","Escreva uma dificuldade que trouxe algo bom para você.","Senhor, obrigada até pelas dificuldades que me fizeram crescer."],
["Pelas amigas","O amigo ama em todo tempo.","Pr 17,17","Amizades verdadeiras são presentes de Deus.","Mande uma mensagem de gratidão para uma amiga.","Obrigada, Senhor, pelas amigas que colocaste no meu caminho."],
["Pelos pais e avós","Honra teu pai e tua mãe.","Ex 20,12","Recebemos a vida e muitas vezes a fé dos nossos pais e avós.","Ligue para seus pais ou avós, ou reze por eles se já partiram.","Obrigada, Senhor, pelos meus pais e avós."],
["Pela fé","É pela graça que fostes salvos, mediante a fé.","Ef 2,8","A fé é um presente que não merecemos, mas recebemos de graça.","Agradeça por quem te ensinou a rezar.","Obrigada, Senhor, pelo dom da fé."],
["Pelas pequenas coisas","Olhai os lírios do campo, como crescem.","Mt 6,28","Um café quente, um abraço, um sol na janela: Deus fala nas pequenas coisas.","Fotografe 3 pequenas alegrias de hoje.","Obrigada, Senhor, pelas pequenas alegrias do dia."],
["Pela Eucaristia","Tomou o pão, deu graças, partiu-o e deu-lhes.","Lc 22,19","Eucaristia quer dizer ação de graças. A Missa é o maior agradecimento.","Participe de uma Missa (ou faça uma comunhão espiritual) agradecendo.","Obrigada, Jesus, por ficares conosco na Eucaristia."],
["Voltar para agradecer","Um deles, vendo-se curado, voltou glorificando a Deus.","Lc 17,15","Dez foram curados, só um voltou. Deus se alegra quando voltamos para agradecer.","Volte a uma oração atendida e agradeça (veja seus pedidos na aba Orar).","Senhor, eu volto para te agradecer pelas graças recebidas."],
["Grandes coisas","O Todo-poderoso fez em mim grandes coisas.","Lc 1,49","Termine estes dias como Maria: cantando as maravilhas de Deus.","Releia a sua lista de gratidão e reze o Magnificat.","A minha alma engrandece o Senhor, porque fez em mim grandes coisas."]
]},

{id:"amada7",titulo:"7 dias: amada por Deus",cat:"Para mim",cor:"rosa",ic:"coracao",
resumo:"Uma semana só para você: lembrar quem você é aos olhos de Deus, antes de ser mãe, esposa ou dona de casa.",
d:[
["Chamada pelo nome","Eu te chamei pelo nome: tu és minha.","Is 43,1","Antes de qualquer papel que você exerce, você é filha. Deus te chama pelo nome.","Escreva seu nome e ao lado: “amada por Deus”.","Senhor, obrigada por me chamares pelo nome."],
["Preciosa","Tu és preciosa aos meus olhos, e eu te amo.","Is 43,4","Você não precisa ganhar o amor de Deus. Ele já te ama.","Repita esse versículo em voz alta três vezes hoje.","Senhor, ajuda-me a acreditar que sou preciosa para Ti."],
["Gravada na palma da mão","Ainda que uma mãe se esquecesse do filho, eu não me esquecerei de ti. Eis que te gravei na palma das minhas mãos.","Is 49,15-16","Você, que cuida de todos, também é cuidada. Deus nunca te esquece.","Olhe para a palma da sua mão e agradeça: Deus pensa em mim.","Senhor, obrigada porque nunca me esqueces."],
["Deus se alegra em você","O Senhor exulta de alegria por tua causa.","Sf 3,17","Deus não te olha com cobrança. Ele se alegra com você.","Faça algo que te alegra: um chá, uma música, um passeio curto.","Senhor, obrigada por te alegrares comigo."],
["Não precisa ser perfeita","A minha graça te basta, porque a força se aperfeiçoa na fraqueza.","2Cor 12,9","A mãe perfeita não existe. A graça de Deus age justamente nos nossos limites.","Liste uma fraqueza sua e entregue a Deus, sem culpa.","Senhor, a tua graça me basta."],
["Cuidar de si","O vosso corpo é templo do Espírito Santo.","1Cor 6,19","Cuidar de si não é egoísmo. É cuidar do templo onde Deus mora.","Beba mais água, faça uma refeição com calma ou descanse um pouco.","Senhor, ensina-me a cuidar de mim com carinho."],
["A melhor parte","Maria escolheu a melhor parte, que não lhe será tirada.","Lc 10,42","Marta corria, Maria sentou aos pés de Jesus. Hoje escolha a melhor parte.","Sente-se por 10 minutos só para estar com Jesus, sem pedir nada.","Jesus, eu escolho a melhor parte: estar contigo."]
]},

{id:"familia5",titulo:"5 dias para criar a oração em família",cat:"Filhos",cor:"verde",ic:"maos",
resumo:"Um passo por dia para criar hábitos simples de oração com as crianças, que cabem na rotina de verdade.",
d:[
["A oração da manhã","De manhã ouves a minha voz.","Sl 5,4","Começar o dia com Deus muda o dia inteiro. Pode ser só uma frase.","Ao acordar as crianças, reze com elas: “Bom dia, Jesus! Este dia é teu”.","Senhor, que cada manhã da nossa família comece contigo."],
["A oração das refeições","Tudo o que Deus criou é bom e nada é desprezível, se recebido com ação de graças.","1Tm 4,4","Agradecer o alimento é um hábito simples que ensina gratidão.","Reze antes de uma refeição com todos de mãos dadas.","Abençoa, Senhor, este alimento e quem o preparou."],
["A bênção dos filhos","Ele abraçava as crianças e as abençoava, impondo-lhes as mãos.","Mc 10,16","A bênção da mãe é poderosa. Os filhos lembram dela a vida toda.","Abençoe cada filho fazendo o sinal da cruz na testa dele ao sair ou ao dormir.","Deus te abençoe, meu filho, e te guarde sempre."],
["A oração da noite","Suba a minha oração como incenso em tua presença.","Sl 141(140),2","À noite, a família agradece e pede perdão. É um jeito lindo de fechar o dia.","Antes de dormir, cada um diz: um obrigado, um desculpa e um pedido.","Senhor, obrigada por este dia. Cuida de nós esta noite."],
["Um encontro semanal","Cantai a Deus em vossos corações... tudo o que fizerdes, fazei em nome do Senhor Jesus.","Cl 3,16-17","Além das orações curtas, um momento semanal fortalece a fé da casa: terço, leitura da Bíblia ou Missa.","Escolha um dia fixo da semana para um momento de oração em família.","Senhor, que a nossa família reze unida todas as semanas."]
]}
);

{id:"tentante30",titulo:"30 dias de fé para a tentante",cat:"Maternidade",cor:"azul",ic:"coracao",
resumo:"Para a tentante: um mês para entregar esse sonho a Deus, acalmar o coração em cada ciclo e caminhar com mulheres da Bíblia e santas que também esperaram.",
d:[
["Entregar o meu desejo a Deus","Estou derramando a minha alma diante do Senhor.","1Sm 1,15","O desejo de ser mãe é bonito e vem do coração que Deus criou. Você não precisa esconder esse desejo d’Ele: pode entregá-lo inteiro, com todas as emoções que vêm junto.","Escreva numa folha o seu desejo, com suas palavras, e guarde dentro da Bíblia.","Senhor, eu derramo diante de Ti o desejo do meu coração. Ele está nas tuas mãos."],
["Deus me conhece por dentro","Senhor, tu me sondas e me conheces.","Sl 139(138),1","Deus conhece cada pensamento, cada exame e cada noite em que você chorou em silêncio. Nada disso passa despercebido para Ele.","Faça 5 minutos de silêncio e diga a Deus como você está se sentindo hoje, sem filtro.","Pai, obrigada porque me conheces por inteiro e me amas assim."],
["Ana, a mulher que rezava","Ela, com a alma amargurada, orou ao Senhor, chorando muito.","1Sm 1,10","Ana não fingiu estar bem. Levou a sua dor ao templo e rezou com sinceridade. A oração sincera é a mais bonita.","Reze com sinceridade, mesmo que a oração saia com lágrimas.","Senhor, como Ana, eu te apresento a minha dor e a minha esperança."],
["Para Deus nada é difícil demais","Haverá alguma coisa difícil demais para o Senhor?","Gn 18,14","Sara riu porque achava impossível. Deus não se ofendeu com o riso dela: Ele cumpriu a promessa no tempo d’Ele.","Escreva uma frase de fé e coloque no espelho do banheiro.","Senhor, eu creio que nada é difícil demais para Ti. Aumenta a minha fé."],
["Deus se lembrou de Raquel","Deus lembrou-se de Raquel; Deus a ouviu.","Gn 30,22","Às vezes parece que Deus esqueceu do nosso pedido. Mas nenhuma oração se perde: Ele ouve todas.","Releia um pedido antigo seu e agradeça porque Deus ouviu, mesmo antes da resposta.","Senhor, eu sei que Tu não te esqueces de mim."],
["A tua oração foi ouvida","Não tenhas medo, Zacarias, porque a tua oração foi ouvida.","Lc 1,13","Isabel e Zacarias rezaram por muitos anos. A resposta chegou de um jeito que eles não imaginavam.","Peça a Santa Isabel que reze com você hoje.","Santa Isabel, que esperaste tanto tempo, intercede por mim."],
["Santa Ana e São Joaquim","Alegres na esperança, pacientes na tribulação, perseverantes na oração.","Rm 12,12","Segundo a tradição da Igreja, os pais de Nossa Senhora esperaram muitos anos por um filho. Eles são padroeiros dos casais que esperam.","Reze hoje com seu esposo pedindo a intercessão de Santa Ana e São Joaquim.","Santa Ana e São Joaquim, rogai por nós e pela nossa família que espera."],
["Um ciclo de cada vez","Não vos preocupeis com o dia de amanhã.","Mt 6,34","A espera de cada mês pode virar ansiedade. Deus dá graça para hoje, não para o mês que vem.","Quando a mente correr para frente, respire e diga: “hoje, Senhor, só hoje”.","Jesus, ensina-me a viver um dia de cada vez, sem contar os dias com medo."],
["O tempo de Deus","Ele fez tudo belo a seu tempo.","Ecl 3,11","O tempo de Deus não é o nosso, e isso dói. Mas Ele vê a história inteira, e nós só vemos um pedaço.","Escreva: “eu confio no teu tempo, Senhor” e leia em voz alta.","Senhor, mesmo sem entender, eu confio no teu tempo."],
["Quando o resultado não vem","O Senhor está perto dos que têm o coração ferido.","Sl 34(33),19","Há dias em que a notícia esperada não chega. Nesses dias, Deus não está distante: Ele está mais perto do que nunca.","Se hoje for um dia difícil, seja gentil com você mesma: descanse, chore se precisar e receba um abraço.","Senhor, fica perto de mim nos dias de decepção. Eu preciso do teu colo."],
["Chorar também é oração","Jesus chorou.","Jo 11,35","Até Jesus chorou. As lágrimas não são falta de fé: são o coração conversando com Deus.","Escreva uma carta a Deus contando o que você sente, sem se cobrar.","Jesus, Tu também choraste. Recebe as minhas lágrimas como oração."],
["Juntos na espera","Acima de tudo, revesti-vos do amor, que é o vínculo da perfeição.","Cl 3,14","A espera pode unir ou afastar o casal. Cuidar do casamento é tão importante quanto cuidar do sonho.","Faça algo leve com seu esposo que não tenha a ver com o tentar: um passeio, um filme, um café.","Senhor, une o nosso casal nesta espera e protege o nosso amor."],
["Cuidar do corpo com carinho","Glorificai a Deus no vosso corpo.","1Cor 6,20","O seu corpo não é um inimigo. Ele é obra de Deus e merece ser cuidado com carinho, não com cobrança.","Faça hoje uma coisa boa pelo seu corpo: uma caminhada, uma refeição com calma, uma boa noite de sono.","Senhor, ensina-me a olhar para o meu corpo com gratidão e carinho."],
["Quando outra pessoa anuncia uma gravidez","Alegrai-vos com os que se alegram e chorai com os que choram.","Rm 12,15","É normal sentir um aperto quando outra mulher anuncia uma gravidez. Você pode sentir alegria por ela e tristeza por você ao mesmo tempo, e entregar tudo a Deus.","Reze por uma amiga ou parente grávida e entregue o aperto do seu coração a Deus.","Senhor, cura a dor da comparação e dá-me um coração livre e em paz."],
["Sem culpa","Agora não há mais condenação para os que estão em Cristo Jesus.","Rm 8,1","Muitas tentantes carregam culpa: “o que eu fiz de errado?”. A espera não é castigo. Deus não está te punindo.","Identifique uma culpa que você carrega e entregue a Deus, dizendo: “eu não preciso carregar isso”.","Pai, tira de mim toda culpa e todo peso que não vêm de Ti."],
["Descansar no colo de Deus","Fiz calar e repousar a minha alma, como criança no colo da mãe.","Sl 131(130),2","Deus quer que você descanse n’Ele como uma criança no colo. Na espera, o descanso também é fé.","Antes de dormir, reze esse versículo bem devagar, três vezes.","Senhor, eu descanso no teu colo. Acalma a minha alma."],
["Maria, Mãe das mães","Eis aí a tua mãe.","Jo 19,27","Nossa Senhora é mãe de todas as mães e de todas as que desejam ser. Ela entende o seu coração.","Reze uma dezena do terço entregando o seu sonho a Nossa Senhora.","Mãe querida, cuida do meu desejo de ser mãe e leva-o até Jesus."],
["São Geraldo Majela","A oração fervorosa do justo tem muito poder.","Tg 5,16","São Geraldo Majela é conhecido como protetor das mães e das mulheres que desejam engravidar. Muitas famílias pedem a intercessão dele.","Peça hoje a intercessão de São Geraldo Majela pela sua família.","São Geraldo Majela, protetor das mães, intercede por mim junto de Deus."],
["Santa Gianna","No amor não há medo.","1Jo 4,18","Santa Gianna Beretta Molla foi médica, esposa e mãe. Ela amava muito a vida e a família. É uma amiga do céu para quem sonha com a maternidade.","Leia um pouco sobre a vida de Santa Gianna e peça que ela reze por você.","Santa Gianna, mulher de fé e amor à vida, rogai por mim."],
["Confiar sem entender","Confia no Senhor de todo o coração e não te apoies no teu próprio entendimento.","Pr 3,5","Nem tudo tem explicação agora. Confiar é segurar a mão de Deus mesmo no escuro.","Escreva três situações da sua vida em que você não entendia, mas depois viu Deus agir.","Senhor, mesmo sem entender, eu seguro a tua mão."],
["Eu sou mais do que esta espera","Somos obra de Deus, criados em Cristo Jesus para as boas obras.","Ef 2,10","O seu valor não está em engravidar. Você é filha amada, com dons e uma missão, hoje mesmo.","Liste três dons que Deus te deu e use um deles hoje para fazer o bem.","Pai, obrigada porque o meu valor está em ser tua filha."],
["Gratidão pelo que já tenho","Dai graças em todas as circunstâncias.","1Ts 5,18","A gratidão não apaga o desejo, mas acalma o coração. Ela nos lembra de tudo o que Deus já fez.","Escreva dez motivos de gratidão da sua vida hoje.","Obrigada, Senhor, por tudo o que já me deste."],
["Fé nos exames e consultas","O meu socorro vem do Senhor, que fez o céu e a terra.","Sl 121(120),2","Consultas, exames e tratamentos podem trazer medo. Leve Deus com você em cada um deles.","Antes da próxima consulta ou exame, reze este versículo e peça sabedoria para os médicos.","Senhor, sê o meu socorro. Abençoa os profissionais que cuidam de mim."],
["Esperança que não decepciona","O Deus da esperança vos encha de toda alegria e paz na fé.","Rm 15,13","A esperança cristã não é certeza de um resultado: é certeza de que Deus está conosco em qualquer resultado.","Escolha uma música de louvor e ouça com calma hoje.","Deus da esperança, enche o meu coração de alegria e paz."],
["A maternidade começa no coração","Como a mãe consola o filho, assim eu vos consolarei.","Is 66,13","O seu coração de mãe já existe. Deus mesmo se compara a uma mãe que consola.","Deixe Deus te consolar hoje: fique em silêncio e imagine-se acolhida por Ele.","Senhor, consola-me como uma mãe consola o seu filho."],
["Abrir-se à vontade de Deus","Faça-se em mim segundo a tua palavra.","Lc 1,38","O “sim” de Maria não foi resignação triste: foi confiança amorosa. Abrir-se à vontade de Deus traz paz.","Reze devagar: “faça-se em mim segundo a tua palavra”.","Senhor, eu abro o meu coração à tua vontade, com confiança."],
["Rezar pelo filho que ainda não veio","Antes de te formar no ventre materno, eu te conheci.","Jr 1,5","Deus já conhece cada vida que Ele sonha. Você pode rezar pelo seu futuro filho desde agora.","Escreva uma pequena oração para o filho que você deseja.","Senhor, Tu conheces o meu futuro filho. Eu já rezo por ele."],
["Rezar por outras tentantes","Carregai os fardos uns dos outros.","Gl 6,2","Muitas mulheres vivem a mesma espera. Rezar por elas alivia o nosso próprio coração.","Reze por três mulheres que estão tentando engravidar (pode ser em segredo).","Senhor, abençoa todas as mulheres que esperam um bebê. Consola e fortalece cada uma."],
["A paz que guarda o coração","A paz de Deus, que ultrapassa todo entendimento, guardará os vossos corações.","Fl 4,7","Há uma paz que não depende do resultado. É a paz de saber que estamos nas mãos certas.","Escolha uma palavra para levar desta caminhada (paz, confiança, esperança) e escreva onde você veja sempre.","Senhor, guarda o meu coração na tua paz."],
["Renovar a entrega","Só em Deus a minha alma repousa; dele vem a minha salvação.","Sl 62(61),2","Depois de 30 dias, renove a sua entrega. O seu sonho continua nas mãos de Deus, e você também.","Releia a folha do primeiro dia e escreva embaixo: “Senhor, eu continuo confiando”.","Senhor, eu renovo a minha entrega. Meu sonho e minha vida estão nas tuas mãos. Amém."]
]}
);

window.PLANOS.push(
{id:"gestacao30",titulo:"30 dias de oração na gestação",cat:"Maternidade",cor:"rosa",ic:"berco",
resumo:"Para a mamãe que está grávida: um mês rezando pelo bebê, entregando os medos a Deus e preparando o coração e a casa para a chegada dessa nova vida.",
d:[
["Uma vida nova em mim","Tu formaste o meu interior, tu me teceste no seio de minha mãe.","Sl 139(138),13","Neste momento, Deus está tecendo o seu bebê com cuidado e amor. Você carrega uma obra viva das mãos d’Ele.","Coloque a mão na barriga e diga ao bebê: “Deus te ama, e eu também”.","Senhor da vida, obrigada pelo bebê que estás formando em mim."],
["Um presente de Deus","Os filhos são herança do Senhor.","Sl 127(126),3","Cada filho é um presente, mesmo quando chega de surpresa ou no meio da correria. A gratidão prepara o coração de mãe.","Escreva uma carta de boas-vindas ao bebê e guarde para entregar quando ele crescer.","Obrigada, Senhor, por este presente tão grande."],
["Maria também esperou","Conceberás e darás à luz um filho, e lhe porás o nome de Jesus.","Lc 1,31","Nossa Senhora viveu uma gestação de verdade, com corpo cansado, viagem e incertezas. Ela entende cada fase sua.","Reze uma Ave-Maria pensando em Maria grávida de Jesus.","Maria, que carregaste Jesus no ventre, acompanha a minha gestação."],
["O bebê que pulou de alegria","A criança pulou de alegria no seu ventre.","Lc 1,44","O bebê de Isabel reconheceu Jesus ainda na barriga. O seu bebê também sente o amor e a paz que você vive.","Coloque uma música de louvor tranquila e ouça com a mão na barriga.","Senhor, que o meu bebê já sinta a tua alegria e a tua paz."],
["Os medos da gestação","Não temas, porque eu estou contigo.","Is 41,10","É normal ter medos: da saúde do bebê, do parto, de dar conta. Deus não quer que você os carregue sozinha.","Escreva seus três maiores medos e reze entregando cada um a Deus.","Senhor, eu te entrego os meus medos. Tu estás comigo."],
["O corpo que muda","Eu te louvo porque me fizeste de modo tão maravilhoso.","Sl 139(138),14","O seu corpo está fazendo algo extraordinário. Cada mudança é sinal de vida acontecendo.","Olhe-se no espelho e agradeça a Deus por uma coisa que o seu corpo está fazendo pelo bebê.","Senhor, obrigada pelo meu corpo que gera vida. Ensina-me a olhar para ele com carinho."],
["Nos dias de enjoo e cansaço","A minha graça te basta.","2Cor 12,9","Há dias em que a gestação pesa: enjoo, sono, dores. Não precisa ser forte o tempo todo; a graça de Deus te sustenta.","Peça ajuda a alguém hoje e aceite descansar sem culpa.","Senhor, nos dias difíceis, a tua graça me basta."],
["Deus já conhece o meu bebê","Antes de te formar no ventre materno, eu te conheci.","Jr 1,5","Deus já sabe o nome, o jeito e a missão do seu filho. Ele tem um plano lindo para essa vida.","Reze pelo futuro do bebê: a saúde, a fé e a vocação dele.","Senhor, Tu já conheces o meu filho. Eu o entrego nas tuas mãos."],
["Abençoar a barriga","O Senhor te abençoe e te guarde.","Nm 6,24","A bênção da mãe começa antes do nascimento. Você pode abençoar o bebê todos os dias.","Faça o sinal da cruz sobre a barriga e diga a bênção de Números 6,24-26.","O Senhor te abençoe e te guarde, meu filho. Amém."],
["O pai do bebê","José fez como o anjo do Senhor havia mandado e recebeu sua esposa.","Mt 1,24","José acolheu Maria e o bebê com coragem. O pai do seu bebê também está aprendendo a ser pai.","Convide o pai do bebê para rezar com a mão na barriga.","São José, acompanha o pai do meu bebê e faz dele um pai segundo o coração de Deus."],
["Preparar a casa","Com sabedoria se constrói a casa.","Pr 24,3","Arrumar o quartinho, o enxoval e a rotina também é oração quando feito com amor.","Escolha um cantinho do quarto do bebê para uma imagem de Nossa Senhora ou do Anjo da Guarda.","Senhor, abençoa a casa que está se preparando para receber esta vida."],
["Os irmãos mais velhos","Como é bom e agradável os irmãos viverem unidos!","Sl 133(132),1","Se você já tem filhos, eles também estão se preparando. Incluí-los ajuda a acolher o irmão com amor.","Peça aos filhos mais velhos que rezem pelo bebê ou façam um desenho para ele.","Senhor, une os meus filhos desde já no amor de irmãos."],
["Exames e consultas","O meu socorro vem do Senhor.","Sl 121(120),2","Cada exame pode trazer ansiedade. Leve Deus com você e entregue o resultado nas mãos d’Ele.","Antes da próxima consulta, reze este versículo e peça sabedoria para a equipe.","Senhor, sê o meu socorro em cada exame e em cada notícia."],
["Ansiedade e paz","Não vos inquieteis com nada... e a paz de Deus guardará os vossos corações.","Fl 4,6-7","A ansiedade da mãe é sentida pelo bebê; a paz também. Pequenas pausas de oração fazem bem aos dois.","Faça a oração da respiração por 2 minutos: puxe o ar dizendo “Jesus”, solte dizendo “eu confio em vós”.","Jesus, eu confio em vós. Guarda o meu coração e o do meu bebê na tua paz."],
["Escolher o nome","Eu te chamei pelo nome: tu és meu.","Is 43,1","O nome é o primeiro presente que damos ao filho. Muitas famílias escolhem o nome de um santo como protetor.","Pesquise o significado do nome escolhido (ou dos nomes que vocês gostam) e o santo que tem esse nome.","Senhor, que o nome do meu filho seja sempre lembrado diante de Ti."],
["Descansar","Em verdes pastagens me faz repousar.","Sl 23(22),2","Descansar faz parte de cuidar do bebê. Deus te convida a parar sem culpa.","Tire 20 minutos para deitar, de olhos fechados, e só descansar com Deus.","Bom Pastor, faz-me repousar em Ti."],
["Nossa Senhora do Bom Parto","Feliz aquela que acreditou.","Lc 1,45","Nossa Senhora do Bom Parto é uma devoção antiga e muito querida pelas gestantes. Ela acompanha cada mãe até o nascimento.","Reze a oração da gestante (aba Orar) pedindo a proteção de Nossa Senhora do Bom Parto.","Nossa Senhora do Bom Parto, acompanha-me até o dia do nascimento."],
["Santa Gianna","Eu vim para que tenham vida, e vida em abundância.","Jo 10,10","Santa Gianna Beretta Molla foi médica, esposa e mãe, e amou a vida com todo o coração. É uma amiga do céu para as gestantes.","Peça a intercessão de Santa Gianna pela sua gestação.","Santa Gianna, mãe que amou a vida, rogai por mim e pelo meu bebê."],
["São Geraldo Majela","A sua misericórdia se estende de geração em geração.","Lc 1,50","São Geraldo Majela é conhecido como protetor das gestantes e dos bebês que vão nascer.","Reze a oração a São Geraldo Majela (aba Orar).","São Geraldo Majela, protege a minha gestação e o meu bebê."],
["Pensando no batismo","Deixai vir a mim as criancinhas.","Mc 10,14","O batismo será o primeiro grande encontro do bebê com Jesus. Já dá para começar a preparar com carinho.","Converse com o pai do bebê sobre a escolha dos padrinhos e a paróquia do batismo.","Jesus, prepara o meu filho para te encontrar no batismo."],
["Conversar com o bebê","Uma geração louvará as tuas obras à outra.","Sl 145(144),4","O bebê já ouve a sua voz. Falar de Deus para ele desde agora é uma forma linda de começar a transmitir a fé.","Conte ao bebê, em voz alta, uma coisa boa que Deus fez na sua vida.","Senhor, que a minha voz leve o teu amor ao meu filho desde já."],
["Cuidar de mim com carinho","Quer comais, quer bebais, fazei tudo para a glória de Deus.","1Cor 10,31","Comer bem, beber água e dormir também são gestos de amor pelo bebê e de gratidão a Deus.","Prepare uma refeição gostosa e nutritiva e coma com calma, agradecendo.","Senhor, ensina-me a cuidar de mim e do meu bebê com carinho."],
["Rede de apoio","Maria ficou com Isabel uns três meses.","Lc 1,56","Maria e Isabel se apoiaram na gestação. Ter outras mulheres por perto faz bem ao coração.","Converse com uma mãe de confiança e peça conselhos ou orações.","Senhor, coloca pessoas boas ao meu lado nesta fase."],
["Confiança no parto","Quando a mulher dá à luz, sente aflição; mas, depois que nasce a criança, já não se lembra da aflição, pela alegria.","Jo 16,21","Jesus usou o parto para falar de esperança. A alegria do encontro com o bebê é maior do que qualquer medo.","Imagine o momento de ver o rosto do seu bebê e entregue o parto a Deus.","Senhor, eu entrego o meu parto em tuas mãos. Dá-me coragem e paz."],
["A equipe que vai cuidar de nós","Dá lugar ao médico, pois o Senhor também o criou.","Eclo 38,12","Médicos, enfermeiras e doulas são instrumentos de Deus. Rezar por eles é cuidar do parto.","Reze pelo nome do seu médico (ou da equipe) e pelo hospital ou maternidade.","Senhor, abençoa as mãos de quem vai cuidar de mim e do meu bebê."],
["Pelas outras gestantes","Carregai os fardos uns dos outros.","Gl 6,2","Muitas mulheres estão grávidas agora, algumas com medo ou sozinhas. Rezar por elas é um ato de amor.","Reze por uma gestante que você conhece e, se puder, mande uma mensagem de carinho.","Senhor, protege todas as gestantes e os bebês que vão nascer."],
["Uma família que reza","Eu e minha casa serviremos ao Senhor.","Js 24,15","O bebê vai chegar a uma casa onde Deus está presente. Os hábitos de fé de hoje serão o berço espiritual dele.","Escolha um hábito de oração para a família começar antes do nascimento.","Senhor, que a minha casa seja um berço de fé para este bebê."],
["Entregar o nascimento","Desde o seio de minha mãe, tu és o meu Deus.","Sl 22(21),11","Deus está com o seu bebê antes, durante e depois do nascimento. Ele já é o Deus desta criança.","Escreva uma oração curta para rezar no dia do parto e guarde na bolsa da maternidade.","Senhor, desde o ventre Tu és o Deus do meu filho. Eu confio em Ti."],
["Sem preocupação excessiva","Olhai as aves do céu: vosso Pai celeste as alimenta.","Mt 6,26","Enxoval, mala, contas, rotina... Faça a sua parte com calma e deixe o resto com o Pai.","Faça uma lista do que falta preparar e entregue a lista a Deus em oração.","Pai, eu faço a minha parte e confio que Tu cuidas do resto."],
["Consagrar o bebê","Levaram o menino a Jerusalém para apresentá-lo ao Senhor.","Lc 2,22","Maria e José apresentaram Jesus a Deus. Você também pode consagrar o seu bebê a Deus e a Nossa Senhora desde já.","Com a mão na barriga, consagre o bebê a Nossa Senhora com suas palavras ou com a oração “Ó minha Senhora e também minha Mãe”.","Senhor, eu te apresento o meu filho. Nossa Senhora, ele é teu também. Amém."]
]}
);

window.ORACOES = [
// ——— Orações de sempre
{id:"sinal",cat:"sempre",t:"Sinal da cruz",x:"Pelo sinal da Santa Cruz, livrai-nos, Deus, nosso Senhor, dos nossos inimigos.\nEm nome do Pai, e do Filho e do Espírito Santo. Amém."},
{id:"painosso",cat:"sempre",t:"Pai-Nosso",x:"Pai nosso que estais nos céus, santificado seja o vosso nome; venha a nós o vosso Reino; seja feita a vossa vontade, assim na terra como no céu.\nO pão nosso de cada dia nos dai hoje; perdoai-nos as nossas ofensas, assim como nós perdoamos a quem nos tem ofendido; e não nos deixeis cair em tentação, mas livrai-nos do mal. Amém."},
{id:"avemaria",cat:"sempre",t:"Ave-Maria",x:"Ave Maria, cheia de graça, o Senhor é convosco; bendita sois vós entre as mulheres, e bendito é o fruto do vosso ventre, Jesus.\nSanta Maria, Mãe de Deus, rogai por nós, pecadores, agora e na hora de nossa morte. Amém."},
{id:"gloria",cat:"sempre",t:"Glória",x:"Glória ao Pai, ao Filho e ao Espírito Santo.\nComo era no princípio, agora e sempre. Amém."},
{id:"creio",cat:"sempre",t:"Creio",x:"Creio em Deus Pai todo-poderoso, criador do céu e da terra; e em Jesus Cristo, seu único Filho, nosso Senhor; que foi concebido pelo poder do Espírito Santo; nasceu da Virgem Maria; padeceu sob Pôncio Pilatos, foi crucificado, morto e sepultado; desceu à mansão dos mortos; ressuscitou ao terceiro dia; subiu aos céus; está sentado à direita de Deus Pai todo-poderoso, donde há de vir a julgar os vivos e os mortos.\nCreio no Espírito Santo, na santa Igreja Católica, na comunhão dos santos, na remissão dos pecados, na ressurreição da carne, na vida eterna. Amém."},
{id:"omeujesus",cat:"sempre",t:"Ó meu Jesus",x:"Ó meu Jesus, perdoai-nos, livrai-nos do fogo do inferno, levai as almas todas para o céu e socorrei principalmente as que mais precisarem."},
{id:"espirito",cat:"sempre",t:"Vinde, Espírito Santo",x:"Vinde, Espírito Santo, enchei os corações dos vossos fiéis e acendei neles o fogo do vosso amor.\nEnviai o vosso Espírito e tudo será criado. E renovareis a face da terra.\nOremos: Ó Deus, que instruístes os corações dos vossos fiéis com a luz do Espírito Santo, concedei-nos que no mesmo Espírito saibamos o que é reto e gozemos sempre da sua consolação. Por Cristo, Senhor nosso. Amém."},
{id:"contricao",cat:"sempre",t:"Ato de contrição",x:"Meu Deus, eu me arrependo de todo o coração de vos ter ofendido, porque sois infinitamente bom e amável. Prometo, com a vossa graça, esforçar-me para ser melhor e evitar as ocasiões de pecado.\nMeu Jesus, misericórdia! Amém."},
{id:"comunhao",cat:"sempre",t:"Comunhão espiritual",x:"Meu Jesus, eu creio que estais presente no Santíssimo Sacramento. Amo-vos sobre todas as coisas e desejo receber-vos em minha alma. Já que agora não posso receber-vos sacramentalmente, vinde ao menos espiritualmente ao meu coração.\nComo se já vos tivesse recebido, eu vos abraço e me uno todo a vós. Não permitais que eu jamais me separe de vós. Amém."},
{id:"angelus",cat:"sempre",t:"Angelus (Ângelus)",nota:"Tradicionalmente rezado às 6h, ao meio-dia e às 18h.",x:"O Anjo do Senhor anunciou a Maria.\nE ela concebeu do Espírito Santo.\nAve Maria...\n\nEis aqui a serva do Senhor.\nFaça-se em mim segundo a vossa palavra.\nAve Maria...\n\nE o Verbo se fez carne.\nE habitou entre nós.\nAve Maria...\n\nRogai por nós, santa Mãe de Deus.\nPara que sejamos dignos das promessas de Cristo.\n\nOremos: Infundi, Senhor, em nossas almas a vossa graça, para que nós, que pela anunciação do Anjo conhecemos a encarnação de Jesus Cristo, vosso Filho, por sua paixão e morte sejamos conduzidos à glória da ressurreição. Pelo mesmo Cristo, Senhor nosso. Amém."},

// ——— Nossa Senhora
{id:"salve",cat:"maria",t:"Salve Rainha",x:"Salve, Rainha, Mãe de misericórdia, vida, doçura e esperança nossa, salve! A vós bradamos, os degredados filhos de Eva. A vós suspiramos, gemendo e chorando neste vale de lágrimas.\nEia, pois, advogada nossa, esses vossos olhos misericordiosos a nós volvei. E, depois deste desterro, mostrai-nos Jesus, bendito fruto do vosso ventre, ó clemente, ó piedosa, ó doce sempre Virgem Maria.\nRogai por nós, santa Mãe de Deus, para que sejamos dignos das promessas de Cristo. Amém."},
{id:"minhasenhora",cat:"maria",t:"Ó minha Senhora e também minha Mãe",nota:"Consagração a Nossa Senhora",x:"Ó minha Senhora e também minha Mãe, eu me ofereço toda a vós e, em prova da minha devoção para convosco, vos consagro neste dia os meus olhos, os meus ouvidos, a minha boca, o meu coração e inteiramente todo o meu ser.\nE porque assim sou vossa, ó incomparável Mãe, guardai-me e defendei-me como coisa e propriedade vossa. Amém."},
{id:"lembrai",cat:"maria",t:"Lembrai-vos",x:"Lembrai-vos, ó piíssima Virgem Maria, que nunca se ouviu dizer que algum daqueles que têm recorrido à vossa proteção, implorado a vossa assistência e reclamado o vosso socorro, fosse por vós desamparado.\nAnimada eu, pois, com igual confiança, a vós, ó Virgem entre todas singular, como a Mãe recorro, de vós me valho e, gemendo sob o peso dos meus pecados, me prostro a vossos pés.\nNão desprezeis as minhas súplicas, ó Mãe do Verbo de Deus humanado, mas dignai-vos de as ouvir propícia e de me alcançar o que vos rogo. Amém."},
{id:"magnificat",cat:"maria",t:"Magnificat (Cântico de Maria)",nota:"Lc 1,46-55",x:"A minha alma engrandece o Senhor, e o meu espírito se alegra em Deus, meu Salvador,\nporque olhou para a humildade de sua serva. Desde agora, todas as gerações me chamarão bem-aventurada,\nporque o Todo-poderoso fez em mim grandes coisas. Santo é o seu nome.\nA sua misericórdia se estende, de geração em geração, sobre os que o temem.\nManifestou o poder do seu braço: dispersou os soberbos de coração.\nDerrubou do trono os poderosos e elevou os humildes.\nEncheu de bens os famintos e despediu os ricos de mãos vazias.\nSocorreu Israel, seu servo, lembrando-se da sua misericórdia,\nconforme prometera a nossos pais, em favor de Abraão e de sua descendência, para sempre.\nGlória ao Pai, ao Filho e ao Espírito Santo. Como era no princípio, agora e sempre. Amém."},
{id:"concebida",cat:"maria",t:"Ó Maria concebida sem pecado",nota:"Jaculatória da Medalha Milagrosa",x:"Ó Maria concebida sem pecado, rogai por nós que recorremos a vós."},
{id:"maecansada",cat:"maria",t:"Oração de mãe para Mãe",nota:"Para os dias difíceis",x:"Nossa Senhora, tu também foste mãe. Conheces as noites mal dormidas, as preocupações e o coração apertado.\nHoje eu venho como filha. Pega a minha mão e caminha comigo. Cuida dos meus filhos quando eu não estiver por perto, acalma a minha casa e ensina-me a ter a tua paciência e a tua ternura.\nQue eu guarde no coração, como tu, as coisas de Deus. Amém."},

// ——— Pela família
{id:"sagradafamilia",cat:"familia",t:"Oração à Sagrada Família",x:"Jesus, Maria e José, vós que vivestes em Nazaré o amor simples de cada dia, olhai para a nossa família.\nFazei da nossa casa uma pequena igreja: lugar de oração, de mesa partilhada e de perdão.\nAfastai de nós as brigas, a frieza e a divisão. Curai quem está ferido e aproximai quem está distante.\nQue em nosso lar se viva a paz, a alegria e a fé que havia na vossa casa. Jesus, Maria e José, rogai por nós. Amém."},
{id:"consagracaolar",cat:"familia",t:"Consagração do lar à Sagrada Família",nota:"Para rezar com a família reunida",x:"Jesus, Maria e José, hoje nós vos consagramos a nossa casa e todos os que moram nela.\nJesus, sede o centro do nosso lar: das nossas conversas, das nossas refeições, do nosso trabalho e do nosso descanso.\nMaria, cuidai de nós como cuidastes da casa de Nazaré. Ensinai-nos a ternura, a paciência e a oração.\nSão José, protegei esta família, guardai a nossa porta e sustentai o nosso trabalho.\nQue esta casa seja lugar de paz, de perdão e de alegria. A partir de hoje, ela é vossa. Amém."},
{id:"pelosfilhos",cat:"familia",t:"Bênção da mãe pelos filhos",x:"Senhor, eu te apresento os meus filhos (diga o nome de cada um).\nTu os conheces antes de mim e os amas mais do que eu. Coloca sobre eles a tua mão.\nGuarda o corpo deles de todo perigo, o coração de toda tristeza e a alma de todo mal.\nDá-lhes boas amizades, sabedoria nos estudos e um coração que te ama.\nQue o Anjo da Guarda caminhe ao lado deles hoje e sempre. Eu os entrego nas tuas mãos e no colo de Nossa Senhora. Amém."},
{id:"peloesposo",cat:"familia",t:"Oração pelo meu esposo",x:"Senhor, eu te agradeço pelo homem que colocaste ao meu lado.\nAbençoa a sua saúde, o seu trabalho e as suas decisões. Dá-lhe força nos dias difíceis e paz no coração.\nAproxima-o cada vez mais de Ti e faz dele um pai e esposo segundo o teu coração.\nUne-nos no amor, no respeito e no perdão. Que o nosso casamento seja sinal do teu amor.\nSão José, intercede por ele. Amém."},
{id:"bencaocasa",cat:"familia",t:"Bênção da casa",nota:"Para rezar passando pelos cômodos",x:"Senhor, abençoa esta casa e todos os que nela moram.\nQue nesta porta entre só o que é bom. Que nesta sala haja conversa e alegria. Que nesta cozinha nunca falte o pão nem a gratidão. Que nestes quartos haja descanso e paz.\nAfasta daqui toda discórdia, toda doença e todo mal.\nQue esta casa seja tua morada, Senhor. Amém."},
{id:"gestante",cat:"familia",t:"Oração da gestante",x:"Senhor da vida, obrigada pelo bebê que está crescendo em mim.\nGuarda-o em cada dia da gestação, forma cada parte dele com o teu amor e prepara o meu coração para recebê-lo.\nNossa Senhora do Bom Parto, acompanha-me até o dia do nascimento e coloca o teu manto sobre nós dois. Amém."},
{id:"desejomae",cat:"familia",t:"Oração de quem deseja ser mãe",nota:"Para quem está tentando engravidar",x:"Senhor, Deus da vida, Tu conheces o desejo do meu coração de ser mãe.\nEu o entrego nas tuas mãos, com tudo o que sinto: a esperança, a ansiedade e as lágrimas de cada espera.\nAcalma o meu coração, fortalece o meu casamento e cuida do meu corpo. Dá-me paz para viver um dia de cada vez e confiança no teu tempo.\nNossa Senhora, Santa Ana e São Joaquim, Santa Isabel e São Geraldo Majela, rezai comigo.\nSeja feita a tua vontade, Senhor, e que eu nunca me esqueça de que sou tua filha amada. Amém."},
{id:"longe",cat:"familia",t:"Por quem está longe da fé",x:"Pai de misericórdia, eu te apresento (diga o nome), que está longe de Ti.\nTu nunca desistes de ninguém. Vai ao encontro dele(a) como o pai foi ao encontro do filho que voltava.\nToca o seu coração do jeito que só Tu sabes, coloca pessoas boas no seu caminho e dá-me paciência e amor para esperar o teu tempo.\nSanta Mônica, que rezou tantos anos pelo filho, intercede por nós. Amém."},

// ——— Do dia a dia
{id:"manha",cat:"dia",t:"Oração da manhã",x:"Bom dia, Senhor! Obrigada por mais este dia.\nEu te ofereço tudo o que vou fazer, pensar e sentir hoje: o trabalho, as tarefas da casa, o cuidado com a família, as alegrias e os cansaços.\nGuia os meus passos, guarda as minhas palavras e dá-me paciência e alegria.\nNossa Senhora, segura a minha mão durante todo o dia. Amém."},
{id:"noite",cat:"dia",t:"Oração da noite",x:"Senhor, obrigada por este dia, pelo que deu certo e pelo que não deu.\nPerdoa-me pelas vezes em que faltei com amor, e ajuda-me a perdoar também.\nEu entrego nas tuas mãos a minha família, as minhas preocupações e o dia de amanhã.\nGuarda o nosso sono e a nossa casa esta noite. Santo Anjo, vigia por nós. Amém."},
{id:"antesrefeicao",cat:"dia",t:"Antes das refeições",x:"Abençoai, Senhor, a nós e a estes alimentos que vamos tomar.\nDai o pão a quem tem fome e fome de justiça a quem tem pão. Amém."},
{id:"depoisrefeicao",cat:"dia",t:"Depois das refeições",x:"Nós vos damos graças, Senhor, por todos os vossos benefícios. Vós que viveis e reinais para sempre. Amém."},
{id:"entrega",cat:"dia",t:"Oração de entrega (para a ansiedade)",x:"Jesus, eu não consigo carregar tudo sozinha. Hoje eu entrego nas tuas mãos (diga o que te preocupa).\nNão vou ficar segurando o que é teu. Tu sabes o que é melhor e cuidas de cada detalhe.\nAcalma a minha respiração, os meus pensamentos e o meu coração.\nJesus, eu confio em vós. Jesus, eu confio em vós. Jesus, eu confio em vós. Amém."},
{id:"trabalho",cat:"dia",t:"Pelo trabalho e pelo sustento",x:"Senhor, que foste carpinteiro em Nazaré, abençoa o trabalho desta família.\nDá-nos saúde para trabalhar, sabedoria para cuidar do que recebemos e generosidade para partilhar.\nProvê o que nos falta e afasta de nós a preocupação excessiva. Nós confiamos na tua providência.\nSão José operário, rogai por nós. Amém."},
{id:"cansada",cat:"dia",t:"Oração da mãe cansada",x:"Senhor, hoje eu estou cansada. Tu conheces o meu corpo, a minha mente e o meu coração.\nNão te peço para ser perfeita, peço para não estar sozinha.\nDá-me descanso onde houver pausa, paciência onde houver birra e ternura onde houver pressa.\nObrigada porque o teu amor por mim não depende do quanto eu dou conta. Amém."},

// ——— Santos e anjos
{id:"anjo",cat:"santos",t:"Santo Anjo",x:"Santo Anjo do Senhor, meu zeloso guardador, se a ti me confiou a piedade divina, sempre me rege, me guarda, me governa e me ilumina. Amém."},
{id:"miguel",cat:"santos",t:"São Miguel Arcanjo",x:"São Miguel Arcanjo, defendei-nos no combate, sede o nosso refúgio contra as maldades e ciladas do demônio.\nOrdene-lhe Deus, instantemente o pedimos, e vós, príncipe da milícia celeste, pela virtude divina, precipitai no inferno a Satanás e aos outros espíritos malignos que andam pelo mundo para perder as almas. Amém."},
{id:"saojose",cat:"santos",t:"Oração a São José pela família",x:"São José, guarda da Sagrada Família, eu coloco a minha casa sob a tua proteção.\nTu que cuidaste de Jesus e de Maria com coragem e silêncio, cuida também de nós.\nProtege o meu esposo e os meus filhos, abençoa o nosso trabalho e o nosso pão, e ensina-nos a confiar em Deus mesmo quando não entendemos tudo.\nSão José, rogai por nós. Amém."},
{id:"sebastiao",cat:"santos",t:"Oração a São Sebastião",x:"Glorioso São Sebastião, que fostes fiel a Jesus até o fim, alcançai-nos de Deus a coragem de viver a fé com alegria e firmeza.\nProtegei a nossa família das doenças, da violência e de todo mal.\nSão Sebastião, rogai por nós. Amém."},
{id:"geraldo",cat:"santos",t:"Oração a São Geraldo Majela",nota:"Protetor das mães e de quem deseja ser mãe",x:"São Geraldo Majela, amigo das mães e das famílias, eu recorro a vós com confiança.\nApresentai a Deus o meu desejo de ser mãe e alcançai-me a graça de viver esta espera com fé e paz.\nProtegei também as gestantes e os bebês que estão para nascer.\nSão Geraldo Majela, rogai por nós. Amém."},

function pad(n){return (n<10?"0":"")+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function hoje(){return S.dataTeste||iso(new Date());}
function addD(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function diff(a,b){return Math.round((parse(b)-parse(a))/864e5);}

var DLET=["D","S","T","Q","Q","S","S"];
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function dataLonga(s){var d=parse(s);return DSEM[d.getDay()]+", "+d.getDate()+" de "+MESES[d.getMonth()];}
function dataCurta(s){var d=parse(s);return d.getDate()+"/"+pad(d.getMonth()+1);}
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

/* ---------- HOJE ---------- */
function linhaTempo(s,t){
  if(t.id==="advento"){var sem=Math.floor(diff("2026-11-29",s)/7)+1;var f=diff(s,"2026-12-25");return "<b>"+sem+"ª semana do Advento</b><span>"+(f===1?"Amanhã é Natal!":"Faltam "+f+" dias para o Natal")+"</span>";}
  if(t.id==="natal"){return "<b>Tempo do Natal</b><span>"+(s<="2027-01-01"?"Oitava do Natal: oito dias de festa":t.sub)+"</span>";}
  if(t.id==="quaresma"){return "<b>Quaresma</b><span>"+t.sub+"</span>";}
  if(s<"2026-11-29"){var a=diff(s,"2026-11-29");return "<b>Tempo Comum</b><span>"+(a===1?"Amanhã começa o Advento!":"Faltam "+a+" dias para o Advento")+"</span>";}
  return "<b>Tempo Comum</b><span>"+t.sub+"</span>";
}
function velas(s){
  var acesas=Math.min(4,Math.floor(diff("2026-11-29",s)/7)+1);var h="";
  for(var i=0;i<4;i++){var on=i<acesas;var cor=i===2?"#EDA7B2":"#C7B3E0";
    h+='<svg viewBox="0 0 16 46" aria-hidden="true">'+(on?'<path d="M8 2c2.4 2.6 2.6 4.8 0 7-2.6-2.2-2.4-4.4 0-7z" fill="#F2C46B"/>':'')+'<rect x="3" y="12" width="10" height="33" rx="3" fill="'+cor+'" opacity="'+(on?1:.45)+'"/><path d="M8 12V9.5" stroke="#A8774B" stroke-width="1.2"/></svg>';}
  return '<div class="velas" aria-label="'+acesas+' velas acesas na coroa do Advento">'+h+"</div>";
}
function feitoMomento(s){return S.momento[s]&&S.momento[s].feito;}
function sequencia(){var s=hoje();if(!feitoMomento(s))s=addD(s,-1);var n=0;while(feitoMomento(s)){n++;s=addD(s,-1);}return n;}
function semanaDots(){
  var s=hoje();var d=parse(s);var ini=addD(s,-d.getDay());var h="";
  for(var i=0;i<7;i++){var di=addD(ini,i);var ok=feitoMomento(di);h+='<span>'+DLET[i]+'<i class="'+(ok?"ok":"")+(di===s?" hj":"")+'">'+(ok?I("check"):"")+"</i></span>";}
  var n=sequencia();
  return '<div class="row" style="justify-content:space-between"><span class="eyebrow">Minha semana com Deus</span>'+(n>1?'<span class="mao" style="font-size:20px">'+n+" dias seguidos</span>":"")+'</div><div class="semana">'+h+"</div>";
}
function semana(){
  var s=hoje();var d=parse(s);var ini=addD(s,-d.getDay());var h="";

function vFilhos(){

  var mes=parse(s).getMonth()+1;var ordem=mes===1||mes===2?[1,12]:[12,1];
  ordem.forEach(function(m){var l=FILHOS.filter(function(f){return f.mes===m;});

  h+='<section class="stack"><h3>Orações para ensinar</h3><div class="lista c-amarelo">'+ORACOES_KIDS.map(function(o){return '<details class="item"><summary><b>'+esc(o.t)+"</b>"+I("seta")+"</summary><p>"+esc(o.x)+"</p></details>";}).join("")+"</div></section>";

function vCal(){
  var s=hoje();if(!UI.calMes){var m=s.slice(0,7);UI.calMes=m<CAL_MIN?CAL_MIN:m>CAL_MAX?CAL_MAX:m;}

  h+='<div class="mesnav"><button class="icbtn" data-a="mes" data-d="-1" '+(UI.calMes<=CAL_MIN?"disabled":"")+' aria-label="Mês anterior">'+I("voltar")+"</button><h2>"+MESES[mo]+" "+y+'</h2><button class="icbtn" data-a="mes" data-d="1" '+(UI.calMes>=CAL_MAX?"disabled":"")+' aria-label="Próximo mês">'+I("seta")+"</button></div>";
  var g='<div class="cal">'+DLET.map(function(l){return '<span class="ds">'+l+"</span>";}).join("");
  for(var b=0;b<first.getDay();b++)g+="<span></span>";
  var esp=[];
  for(var d=1;d<=dias;d++){var k=y+"-"+pad(mo+1)+"-"+pad(d),c=CAL[k],cor=c?COR[c.cor]:null,fut=CAL_FUTURO[k];
    var isEsp=c&&(c.g==="Solenidade"||c.g==="Festa");if(isEsp||fut)esp.push(k);
    var dom=new Date(y,mo,d).getDay()===0;
    g+='<button data-a="calDia" data-k="'+k+'" class="'+(isEsp?"esp ":"")+(dom?"dom ":"")+(k===s?"hj ":"")+(k===UI.calSel?"sel":"")+'" aria-label="'+d+" de "+MESES[mo]+(c?": "+esc(c.t):"")+'">'+d+'<i style="background:'+(cor?cor.bd:fut?"var(--linha)":"transparent")+'"></i></button>';}
  g+="</div>";
  h+='<article class="card" style="padding:14px">'+g+'</article>';
  var leg='<article class="card cores-leg"><div class="eyebrow">O que significam as bolinhas</div><p class="mini" style="color:var(--tinta)">Cada bolinha mostra a <b>cor litúrgica</b> do dia: a cor que o padre usa na Missa e que lembra o que a Igreja está vivendo.</p><div class="legenda">'+
    LEG.map(function(l){return '<div><i style="background:var('+l[0]+')"></i><span><b>'+l[1]+'</b>'+l[2]+'</span></div>';}).join("")+
    '</div><p class="mini" style="color:var(--tinta)">Números em <b style="color:var(--titulo)">azul e mais fortes</b> são festas e solenidades. Os domingos ficam em caramelo.</p></article>';
  var sel=UI.calSel;
  if(sel&&sel.slice(0,7)===UI.calMes){var c2=CAL[sel];
    if(c2){var cr=COR[c2.cor];h+='<article class="escuro"><div class="eyebrow">'+cap(dataLonga(sel))+"</div><h2>"+esc(c2.t)+'</h2><div class="row" style="flex-wrap:wrap;gap:8px 12px">'+(c2.g?'<span class="tag" style="--tg:'+cr.bg+'">'+esc(c2.g)+"</span>":"")+'<span class="corlit"><i style="background:'+cr.bd+'"></i>cor litúrgica: '+cr.n+"</span></div><p>"+esc(c2.b)+"</p>"+(c2.s?'<p class="santo"><b>Lembramos:</b> '+esc(c2.s)+"</p>":"")+"</article>";}
    else h+='<article class="card"><div class="eyebrow">'+cap(dataLonga(sel))+"</div>"+(CAL_FUTURO[sel]?"<h2>"+esc(CAL_FUTURO[sel])+"</h2>":"")+'<p class="mini">Os detalhes deste dia chegam com a próxima atualização do app.</p></article>';}
  if(UI.calMes==="2027-02")h+='<article class="card cheio c-lilas"><span class="mao">Em breve</span><p>Fevereiro e a Quaresma 2027 chegam na próxima atualização, com conteúdo novo para cada dia.</p></article>';
  h+=leg;
  if(esp.length)h+='<section class="stack"><h3>Datas especiais do mês</h3><div class="datas">'+esp.map(function(k){var c=CAL[k];return '<button data-a="calDia" data-k="'+k+'"><span class="d">'+(+k.slice(8))+"</span><b>"+esc(c?c.t:CAL_FUTURO[k])+"</b></button>";}).join("")+"</div></section>";
  return h;
}

  apagaPedido:function(e){S.pedidos=S.pedidos.filter(function(x){return x.id!==e.dataset.id;});save();UI.confirma=null;render();},
  oracao:function(e){go({v:"oracao",id:e.dataset.id});},
  kid:function(e){var s=hoje(),l=S.kids[s]||(S.kids[s]=[]),id=e.dataset.id,i=l.indexOf(id);if(i<0){l.push(id);if(l.length===ROTINA_KIDS.length)toast("Dia completo de estrelinhas!");}else l.splice(i,1);save();render();},
  historia:function(e){go({v:"historia",id:e.dataset.id});},
  mes:function(e){var y=+UI.calMes.slice(0,4),m=+UI.calMes.slice(5,7)-1+(+e.dataset.d);var d=new Date(y,m,1);var k=d.getFullYear()+"-"+pad(d.getMonth()+1);if(k<CAL_MIN||k>CAL_MAX)return;UI.calMes=k;UI.calSel=k===hoje().slice(0,7)?hoje():k+"-01";render();},
  calDia:function(e){UI.calSel=e.dataset.k;render();},
  baixarCopia:function(){var txt=JSON.stringify({app:"meu-lar-catolico",v:1,salvo:new Date().toISOString(),dados:S});
    try{var b=new Blob([txt],{type:"application/json"});var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download="meu-lar-catolico-copia-"+hoje()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);toast("Cópia salva nos downloads.");}catch(err){toast("Não deu para salvar aqui. Use “Copiar cópia”.");}},
  copiarCopia:function(){var txt=JSON.stringify({app:"meu-lar-catolico",v:1,salvo:new Date().toISOString(),dados:S});
    var ok=function(){toast("Cópia copiada. Cole no WhatsApp ou e-mail para guardar.");};
    var falha=function(){var ta=document.getElementById("restTxt");ta.value=txt;ta.select();toast("Selecionei a cópia no campo abaixo: copie e guarde.");};
    try{navigator.clipboard.writeText(txt).then(ok,falha);}catch(err){falha();}},
  restaurar:function(){var t=document.getElementById("restTxt").value.trim();if(!t){toast("Escolha o arquivo ou cole o texto da cópia.");return;}restaurar(t);},
  pulaData:function(e){S.dataTeste=e.dataset.k||null;save();UI.calMes=null;UI.calSel=null;toast(S.dataTeste?"Vendo o app em "+dataCurta(S.dataTeste):"De volta para hoje");setTab("hoje");}
};
function restaurar(t){try{var o=JSON.parse(t);var d=o.dados||o;if(!d||typeof d!=="object"||!("planos" in d))throw 0;var b=base();for(var k in d)b[k]=d[k];S=b;save();toast("Cópia restaurada com sucesso!");setTab("hoje");}catch(err){toast("Essa cópia não foi reconhecida. Confira o texto.");}}

var tmr={};
function onInput(e){var el=e.target,k=el.dataset.in;if(!k)return;
  if((k==="dataTeste"||k==="restArq")&&e.type!=="change")return;
  if(k==="momento"){var s=hoje();var r=S.momento[s]||(S.momento[s]={});r.nota=el.value;}
  else if(k==="planoNota"){var g=S.planos[el.dataset.id]||(S.planos[el.dataset.id]={inicio:hoje(),feitos:[],notas:{}});g.notas=g.notas||{};g.notas[el.dataset.i]=el.value;}
  else if(k==="novInt"){var n=S.novenas.filter(function(x){return x.uid===el.dataset.uid;})[0];if(n)n.intencao=el.value;}
  else if(k==="nome"){S.nome=el.value.trim();}
  else if(k==="dataTeste"){if(el.value){S.dataTeste=el.value;save();UI.calMes=null;UI.calSel=null;toast("Vendo o app em "+dataCurta(el.value));}return;}
  else if(k==="restArq"){var f=el.files&&el.files[0];if(f){var rd=new FileReader();rd.onload=function(){restaurar(String(rd.result));};rd.readAsText(f);}return;}
  clearTimeout(tmr.s);tmr.s=setTimeout(save,300);
}

function init(){
  app=document.getElementById("app");nav=document.getElementById("nav");toastEl=document.getElementById("toast");
  document.addEventListener("click",function(e){var el=e.target.closest("[data-a]");if(!el||el.disabled)return;var f=A[el.dataset.a];if(f){e.preventDefault();f(el);}});
  document.addEventListener("input",onInput);document.addEventListener("change",function(e){if(e.target.dataset.in==="restArq"||e.target.dataset.in==="dataTeste")onInput(e);});
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();instalaEvt=e;if(cur().v==="tutorial")render();});
  window.addEventListener("appinstalled",function(){S.tutOk=true;save();});
  render(true);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
