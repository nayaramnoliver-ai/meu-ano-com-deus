<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}/* Layout: coluna única de celular (máx. 480px), cartões brancos com contorno pontilhado pastel, barra de abas fixa embaixo */
:root{
  /* Paleta mariana: azul claro, azul-marinho e caramelo; as cores litúrgicas ficam à parte (--lit-*) */
  --fundo:#FFFFFF;
  --tinta:#6E5440;      /* texto corrido, caramelo escuro */
  --titulo:#2F4C7C;     /* títulos azul-marinho */
  --suave:#A88C70;      /* legendas caramelo */
  --rosa:#5F87BC;       /* destaque azul mariano (nome antigo mantido) */
  --mao:#B98450;        /* letra manuscrita caramelo */
  --linha:#E7EDF5;
  --lil:#ECEEFA; --lil2:#AEB6E0;    /* azul-lavanda */
  --pk:#EAF1FA;  --pk2:#A9C4E6;     /* azul bem claro (padrão) */
  --az:#E3EEF9;  --az2:#8FB3DD;     /* azul claro */
  --ceu:#EEF6FC; --ceu2:#B2D1EE;    /* céu */
  --car:#F6ECDF; --car2:#D9B48C;    /* caramelo claro */
  --am:#FAF2E0;  --am2:#E0BE7C;     /* dourado */
  --vd:#ECF4F8;  --vd2:#A9C9DD;
  --lit-roxo:#B9A3DA; --lit-roxo-c:#F1EAF7;
  --lit-rosa:#EDA7B2; --lit-rosa-c:#FBE6E9;
  --lit-branco:#E3C25E; --lit-branco-c:#FCF4D6;
  --lit-verde:#A6C9A0; --lit-verde-c:#E4F0E2;
  --lit-verm:#E07F8E; --lit-verm-c:#FBE3E6;
  --verde-acao:#34578E;  /* botão principal: azul-marinho */
  --f-tit:"Fraunces",Georgia,"Times New Roman",serif;
  --f-txt:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mao:"Caveat","Segoe Print","Bradley Hand",cursive;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--fundo)}
body{margin:0;color:var(--tinta);font-family:var(--f-txt);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--rosa);outline-offset:2px;border-radius:8px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

#app{max-width:480px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-top:6px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;padding-block:8px 0}
.marca{font-family:var(--f-txt);font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--suave);display:flex;align-items:center;gap:7px}
.marca svg{width:16px;height:16px;color:var(--rosa)}
.icbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--titulo)}
.icbtn:active{background:var(--pk)}
.sub{display:flex;align-items:center;gap:6px;padding-block:6px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--fundo);z-index:5;margin-inline:-6px;padding-inline:0 6px}
.sub .icbtn{flex:none}
.sub span{font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

h1,h2,h3{font-family:var(--f-tit);color:var(--titulo);margin:0;line-height:1.15;text-wrap:balance;font-weight:700}
h1{font-size:30px;letter-spacing:-.01em}
h2{font-size:21px}
h3{font-size:17px}
p{margin:0}
.mao{font-family:var(--f-mao);color:var(--mao);font-size:24px;line-height:1.1}
.mini{font-size:12px;color:var(--suave)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--suave)}
.tag{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:var(--tg,var(--pk));color:var(--titulo);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border-radius:99px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}

/* cores pastel por tema */
.c-lilas{--bg:var(--lil);--bd:var(--lil2);--tg:var(--lil)}
.c-rosa{--bg:var(--car);--bd:var(--car2);--tg:var(--car)}
.c-azul{--bg:var(--az);--bd:var(--az2);--tg:var(--az)}
.c-verde{--bg:var(--ceu);--bd:var(--ceu2);--tg:var(--ceu)}
.c-amarelo{--bg:var(--am);--bd:var(--am2);--tg:var(--am)}

/* cartões */
.card{background:#fff;border:1.6px dashed var(--bd,var(--pk2));border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card.cheio{background:var(--bg);border-style:solid;border-color:transparent}
.card p{font-size:15px}

/* olá */
.ola{display:flex;flex-direction:column;gap:2px;padding-top:4px}
.ola h1{font-size:28px}

/* faixa do tempo litúrgico */
.tempo{background:var(--bg);border-radius:22px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.tempo .txt{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.tempo .tag{background:#fff}
.tempo p{font-size:14px}
.tempo p span{display:block;margin-top:3px;font-size:14.5px;font-weight:500;color:var(--tinta)}
.tempo b{font-family:var(--f-tit);color:var(--titulo);font-size:19px;font-weight:700;display:block;line-height:1.2}
.velas{display:flex;gap:6px;align-items:flex-end;flex:none}
.velas svg{width:16px;height:46px}

.corlit{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--suave)}
.corlit i{width:10px;height:10px;border-radius:50%;display:inline-block}
.santo{font-size:14px}
.santo b{color:var(--titulo);font-weight:600}

/* botões */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--verde-acao);color:#fff;font-weight:600;font-size:15px;border-radius:99px;padding:14px 20px;text-align:center;text-decoration:none;width:100%}
.btn svg{width:18px;height:18px}
.btn:active{filter:brightness(.95)}
.btn.sec{background:#fff;color:var(--titulo);border:1.6px solid var(--az2)}
.btn.rosa{background:var(--rosa)}
.marca svg{color:var(--mao)}
.btn.peq{padding:9px 16px;font-size:13.5px;width:auto}
.lnk{color:var(--rosa);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.feito{display:inline-flex;align-items:center;gap:6px;color:var(--verde-acao);font-weight:600;font-size:13px}
.feito svg{width:18px;height:18px}

blockquote{margin:0;font-family:var(--f-tit);font-style:italic;font-weight:500;font-size:19px;line-height:1.4;color:var(--titulo)}
cite{font-style:normal;font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--mao)}

/* semana */
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.semana span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--suave)}
.semana i{width:30px;height:30px;border-radius:50%;border:1.6px dashed var(--pk2);display:grid;place-items:center;color:#fff}
.semana i.ok{background:var(--rosa);border-color:var(--rosa)}
.semana i.hj{border-style:solid}
.semana i svg{width:16px;height:16px}

/* atalhos */
.atalhos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.atalho{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;text-align:center;line-height:1.25}
.atalho span{width:56px;height:56px;border-radius:18px;background:var(--bg);display:grid;place-items:center;color:var(--titulo)}
.atalho svg{width:26px;height:26px}

/* passos numerados (momento, novena) */
.passos{display:flex;flex-direction:column;gap:14px}
.passo{display:grid;grid-template-columns:30px 1fr;gap:12px}
.passo .n{width:30px;height:30px;border-radius:50%;background:var(--az);color:var(--titulo);font-family:var(--f-tit);font-weight:700;display:grid;place-items:center;font-size:15px}
.passo .c{display:flex;flex-direction:column;gap:8px;min-width:0;padding-top:3px}
.passo h3{font-size:16px}

textarea,input[type=text],input[type=date]{width:100%;font:inherit;font-size:15px;color:var(--tinta);background:#fff;border:1.6px dashed var(--pk2);border-radius:16px;padding:12px 14px;resize:vertical;background-image:repeating-linear-gradient(transparent 0 29px,var(--linha) 29px 30px);background-position:0 10px;line-height:30px}
input[type=text],input[type=date]{background-image:none;line-height:1.4}
textarea:focus,input:focus{outline:none;border-style:solid;border-color:var(--rosa)}
label.lb{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-inline:-18px;padding-inline:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1.4px solid var(--linha);font-size:13px;font-weight:600;color:var(--suave);background:#fff;white-space:nowrap}
.chip.on{background:var(--pk);border-color:var(--pk);color:var(--titulo)}
.chip[disabled]{opacity:.55;cursor:default}

/* planos */
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{background:var(--bg);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:168px;position:relative}
.pcard .pic{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--titulo)}
.pcard .pic svg{width:24px;height:24px}
.pcard .ptit{font-family:var(--f-tit);font-weight:700;color:var(--titulo);font-size:16px;line-height:1.2}
.pcard .pdias{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta);opacity:.75}
.pcard .novo{position:absolute;top:12px;right:12px;font-family:var(--f-mao);color:var(--mao);font-size:19px;line-height:1}
.barra{height:7px;border-radius:9px;background:#fff;overflow:hidden;margin-top:auto}
.barra i{display:block;height:100%;background:var(--rosa);border-radius:9px}
.card .barra{background:var(--pk)}
.andamento{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:18px;padding:12px 14px;width:100%}
.andamento .pic{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--titulo);flex:none}
.andamento .t{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.andamento b{font-family:var(--f-tit);color:var(--titulo);font-size:15px;line-height:1.2}
.andamento small{font-size:12px}

.phero{background:var(--bg);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.phero .tag{background:#fff}
.phero .pic{width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--titulo)}
.phero .pic svg{width:28px;height:28px}

.dias{display:flex;flex-direction:column}
.dia-row{display:flex;gap:12px;align-items:center;padding:12px 2px;border-bottom:1.4px dashed var(--linha);width:100%}
.dia-row:last-child{border-bottom:0}
.dia-row .t{display:flex;flex-direction:column;min-width:0;flex:1}
.dia-row small{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.dia-row b{font-weight:600;font-size:14.5px;color:var(--tinta)}
.chk{width:28px;height:28px;border-radius:50%;border:1.6px dashed var(--bd,var(--pk2));display:grid;place-items:center;flex:none;color:#fff}
.chk.ok{background:var(--rosa);border:0}
.chk svg{width:16px;height:16px}
.dia-row .seta{color:var(--suave)}
.dia-row .seta svg{width:18px;height:18px}

.bloco{display:flex;flex-direction:column;gap:6px}
.oracao-txt{white-space:pre-line;font-size:16px;line-height:1.7}
.oracao-curta{font-family:var(--f-tit);font-style:italic;font-size:17px;color:var(--titulo);line-height:1.45}
.navdias{display:flex;justify-content:space-between;gap:10px}

/* listas de orações */
.lista{display:flex;flex-direction:column;background:#fff;border:1.6px dashed var(--bd,var(--pk2));border-radius:20px;padding:4px 16px}
.lista .item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1.4px dashed var(--linha);width:100%}
.lista .item:last-child{border-bottom:0}
.lista .item b{flex:1;font-weight:600;font-size:14.5px}
.lista .item small{display:block;font-weight:500;font-size:12px;color:var(--suave)}
.lista .item svg{color:var(--suave);width:18px;height:18px}
details.item{display:block}
details.item summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:600;font-size:14.5px}
details.item summary::-webkit-details-marker{display:none}
details.item summary b{flex:1}
details.item p{padding-top:8px;white-space:pre-line}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard{background:var(--bg);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mcard .pic{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--titulo)}
.mcard b{font-family:var(--f-tit);color:var(--titulo);font-size:17px;line-height:1.15}
.mcard small{font-size:12.5px;line-height:1.35}

/* terço */
.terco-top{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.contas{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;padding-block:6px}
.contas i{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--az2);background:#fff;transition:background .2s,transform .2s}
.contas i.g{width:26px;height:26px}
.contas i.ok{background:var(--az2)}
.contas i.at{background:var(--titulo);border-color:var(--titulo);transform:scale(1.15)}
.terco-orar{min-height:200px}
.terco-orar h2{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.terco-orar h2 small{font-family:var(--f-mao);color:var(--mao);font-size:22px;font-weight:400}
.terco-bts{display:grid;grid-template-columns:auto 1fr;gap:10px}
.terco-bts .btn.sec{width:auto;padding-inline:18px}
.misterio{background:var(--lil);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:6px}

/* novenas */
.nove{display:flex;gap:6px}
.nove i{width:24px;height:24px;border-radius:50%;border:1.6px dashed var(--bd,var(--lil2));display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:600;color:var(--suave)}
.nove i.ok{background:var(--rosa);border:0;color:#fff}

/* pedidos */
.pedido{display:flex;flex-direction:column;gap:6px}
.pedido .para{font-family:var(--f-mao);color:var(--mao);font-size:22px;line-height:1}
.pedido .acoes{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.vazio{text-align:center;padding:22px 10px;display:flex;flex-direction:column;gap:6px;align-items:center}
.vazio svg{width:34px;height:34px;color:var(--pk2)}

/* rotina kids */
.rotina{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rot{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;border:1.6px dashed var(--am2);font-size:13.5px;font-weight:600;line-height:1.25}
.rot svg{width:22px;height:22px;color:var(--titulo)}
.rot.ok{background:var(--am);border-style:solid;border-color:var(--am)}
.estrelas{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.estrelas span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--suave)}
.estrelas b{font-family:var(--f-tit);color:var(--titulo);font-size:15px}
.estrelas svg{width:18px;height:18px;color:var(--am2)}
.estrelas .cheia svg{fill:var(--am2)}
.historia{white-space:pre-line;font-size:16.5px;line-height:1.75}
.conversa{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

/* calendário */
.mesnav{display:flex;align-items:center;justify-content:space-between}
.mesnav h2{text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .ds{font-size:10.5px;font-weight:600;color:var(--suave);padding-bottom:4px}
.cal button{aspect-ratio:1;max-width:100%;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.cal button i{width:6px;height:6px;border-radius:50%}
.cal button.esp{font-weight:700;color:var(--titulo)}
.cal button.dom{color:var(--mao)}
.cal button.hj{border:1.6px solid var(--rosa)}
.cal button.sel{background:var(--pk)}
.cal button:disabled{opacity:.35}
.legenda{display:flex;flex-direction:column;gap:10px}
.legenda div{display:grid;grid-template-columns:14px 1fr;gap:10px;align-items:start;font-size:13.5px;line-height:1.4}
.legenda i{width:12px;height:12px;border-radius:50%;margin-top:3px}
.legenda b{display:block;color:var(--titulo);font-weight:600}
.cores-leg summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.cores-leg summary::-webkit-details-marker{display:none}
.cores-leg summary svg{width:18px;height:18px;color:var(--suave);transform:rotate(90deg);transition:transform .2s}
.cores-leg:not([open]) summary svg{transform:none}
.datas{display:flex;flex-direction:column;gap:2px}
.datas button{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1.4px dashed var(--linha);width:100%}
.datas button:last-child{border-bottom:0}
.datas .d{font-family:var(--f-mao);color:var(--mao);font-size:24px;line-height:1;min-width:30px}
.datas b{font-weight:600;font-size:14px}

/* aviso de confirmação */
.confirma{background:var(--pk);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px}

/* barra de abas */
#nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1.6px dashed var(--linha);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));z-index:20}
#nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--suave);padding:6px 0;text-align:center}
#nav button svg{width:24px;height:24px}
#nav button.on{color:var(--rosa)}
#nav button.on span{background:var(--pk);border-radius:99px;padding:2px 12px}
#nav button span{padding:2px 12px;display:grid;place-items:center}

#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--titulo);color:#fff;font-weight:600;font-size:14px;padding:12px 18px;border-radius:99px;opacity:0;transition:opacity .25s,transform .25s;z-index:30;max-width:calc(100% - 40px);text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

.sep{height:0;border-top:1.6px dashed var(--linha)}
.rodape{text-align:center;padding-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Pontos de quebra em azul-marinho: 1 ou 2 por tela, sempre o foco principal */
.escuro{--esc:#2B4774;background:var(--esc);color:#F3F7FC;border:0;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;outline:1.4px dashed rgba(255,255,255,.32);outline-offset:-8px}
.escuro h1,.escuro h2,.escuro h3,.escuro b{color:#fff}
.escuro .eyebrow,.escuro .mini{color:#B7CDEB}
.escuro blockquote{color:#fff}
.escuro cite,.escuro .mao{color:#E9C99E}
.escuro .tag{background:rgba(255,255,255,.16);color:#fff}
.escuro .corlit{color:#C9D9EF}
.escuro .btn{background:#fff;color:var(--esc)}
.escuro .btn.sec{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.escuro .feito{color:#CFE3FA}
.escuro .santo b{color:#E9C99E}
.escuro .pic{background:rgba(255,255,255,.14)!important;color:#fff!important}
.escuro .semana span{color:#B7CDEB}
.escuro .semana i{border-color:rgba(255,255,255,.45)}
.escuro .semana i.ok{background:#E9C99E;border-color:#E9C99E;color:var(--esc)}
.escuro .semana i.hj{border-style:solid;border-color:#fff}
.escuro .sep{border-color:rgba(255,255,255,.22)}
.escuro .lnk{color:#E9C99E}

/* Tutorial: colocar na tela do celular (letras maiores, para todas as idades) */
.tut .grande,.tut p.grande{font-size:17px;line-height:1.6}
.iconeapp{width:64px;height:64px;flex:none;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(47,76,124,.18)}
.iconeapp svg{width:100%;height:100%;display:block}
.tcel{gap:10px}
.tbt{border:2px solid var(--az2);border-radius:18px;padding:16px 12px;font-family:var(--f-tit);font-weight:700;font-size:20px;color:var(--titulo);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff}
.tbt small{font-family:var(--f-txt);font-weight:500;font-size:11.5px;color:var(--suave);line-height:1.3}
.tbt.on{background:var(--titulo);border-color:var(--titulo);color:#fff}
.tbt.on small{color:#C9D9EF}
.tpassos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.tpasso{display:grid;grid-template-columns:40px 1fr;gap:12px;border:1.6px dashed var(--pk2);border-radius:20px;padding:16px 14px}
.tnum{width:40px;height:40px;border-radius:50%;background:var(--titulo);color:#fff;font-family:var(--f-tit);font-weight:700;font-size:20px;display:grid;place-items:center}
.tc{display:flex;flex-direction:column;gap:10px;min-width:0}
.tc h3{font-size:20px;padding-top:6px}
.tc p{font-size:17px;line-height:1.6}
.tc .dica{font-size:15px;background:var(--am);border-radius:14px;padding:10px 12px}
.ilu{width:76px;height:76px;border-radius:20px;background:var(--az);display:grid;place-items:center;color:var(--titulo);border:2.5px solid var(--mao)}
.ilu svg{width:44px;height:44px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* Desafio especial em destaque na tela de início */
.dest{--dbg:var(--lit-roxo-c);--dbd:var(--lit-roxo);background:var(--dbg);border:2px solid var(--dbd);border-radius:24px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;outline:1.4px dashed var(--dbd);outline-offset:-9px}
.dest.d-ouro{--dbg:var(--am);--dbd:var(--am2)}
.dest .dtopo{display:flex;gap:14px;align-items:center;justify-content:space-between}
.dest .tag{background:#fff}
.dest h2{font-size:25px;line-height:1.15;text-wrap:balance}
.dest .grande{font-size:16px;line-height:1.5;color:var(--tinta)}
.dest .grande b,.dest p b{color:var(--titulo)}
.dest .cont{flex:none;width:82px;height:82px;border-radius:50%;background:#fff;border:2px dashed var(--dbd);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;color:var(--titulo);text-align:center}
.dest .cont b{font-family:var(--f-tit);font-size:30px;font-weight:700}
.dest .cont small{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta)}
.dest .barra{background:#fff;height:9px}
.dest .dok{display:flex;gap:8px;align-items:flex-start;font-weight:600;color:var(--titulo);font-size:15px}
.dest .dok svg{width:20px;height:20px;flex:none;margin-top:2px;color:var(--verde-acao)}

/* dia completo dos desafios */
.dcel{font-size:14px;font-weight:600;color:var(--mao)}
.daviso .eyebrow{display:flex;align-items:center;gap:6px;color:var(--titulo)}
.daviso .eyebrow svg{width:15px;height:15px}
.daviso p{font-size:15px;color:var(--tinta)}
.dpal .mini{color:var(--tinta)}
.dpal .btn{align-self:flex-start}
.dperg .grande b{font-family:var(--f-tit);font-size:19px;line-height:1.35;color:var(--titulo);font-weight:700}
.escuro .grande{font-size:16px;line-height:1.55}
.bloco p+p{margin-top:6px}
/* lembrete diário */
select{width:100%;font:inherit;font-size:17px;font-weight:600;color:var(--titulo);background:#fff;border:1.6px dashed var(--pk2);border-radius:16px;padding:12px 14px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--titulo) 50%),linear-gradient(135deg,var(--titulo) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.lembc .pic{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--titulo);flex:none}
.lembc .pic svg{width:24px;height:24px}
#lembrete{scroll-margin-top:72px}

"2026-11-22":{v:"O meu Reino não é deste mundo.",r:"Jo 18,36",p:"Jesus não reina com força nem com gritos. Ele reina servindo, com paciência e amor, exatamente como uma mãe reina no coração da casa.",q:"Em que área da minha vida eu ainda não deixei Jesus ser o Rei?",o:"Jesus, Rei do meu coração, reina na minha casa, na minha agenda e nas minhas palavras."},
"2026-11-23":{v:"Ela deu tudo o que tinha para viver.",r:"Lc 21,4",p:"A viúva deu pouco, mas deu tudo. Deus não mede o tamanho da oferta, mede o tamanho do amor.",q:"O que é “pouco” na minha vida que eu posso oferecer com muito amor hoje?",o:"Senhor, recebe o pouco que sou hoje. Nas tuas mãos, ele se torna muito."},
"2026-11-24":{v:"Não fiqueis preocupados com o que haveis de dizer.",r:"Lc 21,14",p:"Nos momentos difíceis, Deus mesmo coloca as palavras certas na nossa boca. Não precisamos ensaiar tudo sozinhas.",q:"Qual conversa me preocupa e eu ainda não entreguei a Deus?",o:"Espírito Santo, fala por mim quando eu não souber o que dizer."},
"2026-11-25":{v:"É permanecendo firmes que ireis ganhar a vida.",r:"Lc 21,19",p:"Perseverar é continuar, mesmo devagar. A fé de uma mãe é feita de pequenos recomeços todos os dias.",q:"Em que eu preciso perseverar, mesmo cansada?",o:"Senhor, me dá perseverança para continuar fazendo o bem, um dia de cada vez."},
"2026-11-26":{v:"Levantai-vos e erguei a cabeça, porque a vossa libertação está próxima.",r:"Lc 21,28",p:"Deus não quer que vivamos de cabeça baixa. Mesmo nas dificuldades, Ele está chegando para nos socorrer.",q:"O que tem me deixado de cabeça baixa ultimamente?",o:"Pai, levanta o meu olhar para Ti. Eu confio que estás perto."},
"2026-11-27":{v:"Fazei tudo o que Ele vos disser.",r:"Jo 2,5",p:"O conselho de Maria é simples: escutar Jesus e obedecer. Ela sempre nos leva para mais perto do Filho.",q:"O que Jesus tem me pedido e eu ando adiando?",o:"Maria, minha Mãe, me ensina a fazer tudo o que Jesus me disser."},
"2026-11-28":{v:"Ficai atentos e orai a todo momento.",r:"Lc 21,36",p:"Amanhã começa o Advento. É tempo de preparar a casa e, mais ainda, o coração.",q:"Como eu quero chegar ao Natal deste ano?",o:"Senhor, prepara o meu coração para te receber neste Advento."},
"2026-11-29":{v:"Vigiai, pois não sabeis quando o dono da casa vem.",r:"Mc 13,35",p:"Vigiar não é viver com medo, é viver acordada para Deus. Ele chega todos os dias nos pequenos detalhes da rotina.",q:"Onde Deus pode estar tentando me encontrar nesta semana?",o:"Vem, Senhor Jesus! Encontra o meu coração acordado e de portas abertas."},
"2026-11-30":{v:"Vinde após mim, e eu vos farei pescadores de homens.",r:"Mt 4,19",p:"André deixou as redes na hora. Às vezes, seguir Jesus começa com um pequeno “sim” no meio do trabalho.",q:"Que “rede” eu preciso largar para seguir Jesus mais de perto?",o:"Jesus, eu quero te seguir hoje, mesmo no meio das tarefas de casa."},
"2026-12-01":{v:"Naquele dia, o lobo e o cordeiro viverão juntos.",r:"Is 11,6",p:"O sonho de Deus é a paz. Uma paz que começa dentro da gente e se espalha pela casa.",q:"Onde a paz anda faltando na minha casa?",o:"Príncipe da Paz, faz morada no meu lar e acalma os nossos corações."},
"2026-12-02":{v:"Tenho compaixão dessa multidão.",r:"Mt 15,32",p:"Jesus percebe o cansaço e a fome das pessoas. Ele também percebe o seu cansaço.",q:"Do que eu estou com “fome” hoje: de descanso, de carinho, de silêncio?",o:"Senhor, Tu conheces o meu cansaço. Alimenta-me com a tua presença."},
"2026-12-03":{v:"Ide pelo mundo inteiro e anunciai o Evangelho.",r:"Mc 16,15",p:"Nem toda missão é do outro lado do mundo. A primeira terra de missão de uma mãe é a própria casa.",q:"Como eu posso anunciar Jesus em casa sem precisar de palavras?",o:"Jesus, faz da minha casa uma pequena terra de missão cheia do teu amor."},
"2026-12-04":{v:"Faça-se conforme a vossa fé.",r:"Mt 9,29",p:"Os cegos insistiram e Jesus os curou. A fé insistente não incomoda a Deus; ela O comove.",q:"Por qual pedido eu preciso continuar insistindo com fé?",o:"Senhor, aumenta a minha fé. Eu continuo esperando em Ti."},
"2026-12-05":{v:"De graça recebestes, de graça dai.",r:"Mt 10,8",p:"Tudo o que temos recebemos de Deus. Dar com generosidade é devolver um pouco do muito que Ele nos dá.",q:"O que eu recebi de graça e posso partilhar hoje?",o:"Pai, me dá um coração generoso, que partilha com alegria."},
"2026-12-06":{v:"Preparai o caminho do Senhor, endireitai as suas veredas.",r:"Mc 1,3",p:"Preparar o caminho é tirar as pedras: uma mágoa, um hábito ruim, uma pressa que não deixa espaço para Deus.",q:"Qual “pedra” eu quero tirar do caminho até o Natal?",o:"Senhor, ajuda-me a preparar o caminho para que chegues até mim."},
"2026-12-07":{v:"Homem, os teus pecados estão perdoados.",r:"Lc 5,20",p:"Antes de curar o corpo, Jesus cura o coração. O perdão de Deus é o maior presente que podemos receber no Advento.",q:"Há algo que eu preciso levar à Confissão antes do Natal?",o:"Jesus misericordioso, eu confio no teu perdão. Renova o meu coração."},
"2026-12-08":{v:"Alegra-te, cheia de graça, o Senhor está contigo.",r:"Lc 1,28",p:"Maria foi preparada por Deus desde o primeiro instante para ser a casa de Jesus. Ela nos ajuda a ser casa de Jesus também.",q:"O que eu quero pedir a Nossa Senhora para a minha família?",o:"Imaculada Conceição, Mãe querida, eu consagro a ti a minha casa e os meus filhos."},
"2026-12-09":{v:"Vinde a mim todos vós que estais cansados, e eu vos darei descanso.",r:"Mt 11,28",p:"Jesus não pede que cheguemos descansadas até Ele. Ele pede que cheguemos como estamos.",q:"O que está pesando nos meus ombros hoje?",o:"Jesus, eu venho como estou. Dá-me o teu descanso."},
"2026-12-10":{v:"Eu sou o Senhor teu Deus, que te ensina o que é bom.",r:"Is 48,17",p:"Deus é o melhor professor. Ele nos ensina com paciência, como nós ensinamos os nossos filhos.",q:"O que Deus tem me ensinado neste tempo?",o:"Senhor, ensina-me o teu caminho e eu andarei nele."},
"2026-12-11":{v:"A sabedoria foi justificada pelas suas obras.",r:"Mt 11,19",p:"A sabedoria de Deus aparece mais no que fazemos do que no que falamos.",q:"Que atitude minha mostra hoje que eu sou de Deus?",o:"Senhor, que as minhas atitudes falem de Ti."},

"2026-12-13":{v:"Alegrai-vos sempre no Senhor! O Senhor está perto.",r:"Fl 4,4-5",p:"A alegria cristã não depende de tudo estar perfeito. Ela nasce de saber que Deus está perto.",q:"Quais são três motivos de alegria que eu tenho hoje?",o:"Senhor, enche a minha casa da alegria que vem de Ti."},
"2026-12-14":{v:"No entardecer da vida, seremos julgados pelo amor.",r:"São João da Cruz",p:"Não é a casa perfeita nem a agenda cheia que importam no fim. É o amor que colocamos em cada coisa.",q:"Em que tarefa de hoje eu posso colocar mais amor?",o:"Senhor, que eu faça as pequenas coisas com grande amor."},
"2026-12-15":{v:"Os publicanos e as prostitutas vos precedem no Reino de Deus.",r:"Mt 21,31",p:"Deus valoriza quem se arrepende e muda de verdade. Nunca é tarde para recomeçar.",q:"Em que eu quero recomeçar antes do Natal?",o:"Senhor, obrigada porque sempre posso recomeçar contigo."},

"2026-12-18":{v:"José fez como o anjo do Senhor havia mandado.",r:"Mt 1,24",p:"José não entendia tudo, mas confiou e agiu. Às vezes a fé é dar o próximo passo sem ver a escada inteira.",q:"Qual passo Deus está me pedindo, mesmo sem eu entender tudo?",o:"São José, ensina-me a confiar e a obedecer com o coração em paz."},

"2026-12-22":{v:"A minha alma engrandece o Senhor.",r:"Lc 1,46",p:"Maria canta as maravilhas de Deus. Gratidão é o jeito mais bonito de rezar.",q:"Que maravilhas Deus fez na minha vida neste ano?",o:"A minha alma engrandece o Senhor, porque Ele fez em mim maravilhas."},

"2026-12-26":{v:"Senhor Jesus, recebe o meu espírito.",r:"At 7,59",p:"Estêvão morreu perdoando. O Natal nos dá forças para perdoar como Jesus.",q:"Quem eu preciso perdoar para viver em paz?",o:"Jesus, dá-me um coração que perdoa, como o de Estêvão."},

"2027-01-02":{v:"Eu sou a voz que clama no deserto.",r:"Jo 1,23",p:"João Batista sabia quem era e quem não era. Saber que não precisamos ser tudo nos dá paz.",q:"O que eu não preciso carregar sozinha neste ano?",o:"Senhor, ajuda-me a ser apenas o que Tu queres que eu seja."},

"2027-01-04":{v:"Vinde e vede.",r:"Jo 1,39",p:"Jesus não dá uma palestra aos discípulos; Ele os convida para estar com Ele. Fé é convivência.",q:"Como eu quero passar mais tempo com Jesus neste ano?",o:"Jesus, eu quero ir e ver onde moras. Quero estar contigo todos os dias."},

"2027-01-07":{v:"O povo que vivia nas trevas viu uma grande luz.",r:"Mt 4,16",p:"Jesus começa a pregar e a luz se espalha. Ele quer iluminar cada cantinho da nossa rotina.",q:"Qual parte da minha rotina precisa de luz?",o:"Jesus, Luz do mundo, ilumina a minha rotina e os meus planos."},
"2027-01-08":{v:"Dai-lhes vós mesmos de comer.",r:"Mc 6,37",p:"Os discípulos achavam que tinham pouco. Nas mãos de Jesus, cinco pães alimentaram milhares.",q:"O que eu acho que é pouco e posso entregar a Jesus?",o:"Senhor, multiplica o pouco que tenho: meu tempo, minha força, meu amor."},
"2027-01-09":{v:"Coragem! Sou eu. Não tenhais medo.",r:"Mc 6,50",p:"No meio do vento contrário, Jesus vem andando sobre as águas. Ele chega no meio da tempestade.",q:"Qual medo eu quero entregar a Jesus hoje?",o:"Jesus, quando eu tiver medo, que eu ouça a tua voz: coragem, sou eu."},
"2027-01-10":{v:"Tu és o meu Filho amado; em ti ponho o meu bem-querer.",r:"Mc 1,11",p:"No Batismo, Deus disse isso também sobre você: filha amada. Antes de qualquer coisa que você faça, você é amada.",q:"Como seria viver este dia acreditando que sou filha amada de Deus?",o:"Pai, obrigada por me chamar de filha. Ajuda-me a viver como tua filha amada."},
"2027-01-11":{v:"Completou-se o tempo, e o Reino de Deus está próximo.",r:"Mc 1,15",p:"O Tempo Comum não é tempo sem graça. É o tempo de crescer na fé nas coisas de todo dia.",q:"Onde Deus quer crescer em mim neste tempo comum?",o:"Senhor, faz o teu Reino crescer em mim, no meio da vida comum."},

"2027-01-14":{v:"Se queres, tens o poder de me purificar.",r:"Mc 1,40",p:"O leproso se aproximou com humildade e Jesus o tocou. Ele não tem nojo das nossas feridas.",q:"Que ferida eu quero mostrar a Jesus?",o:"Senhor, se queres, podes me curar. Eu confio no teu toque."},
"2027-01-15":{v:"Vendo a fé deles, Jesus disse: Filho, os teus pecados estão perdoados.",r:"Mc 2,5",p:"A fé dos amigos levou o paralítico até Jesus. A sua fé também carrega a sua família.",q:"Quem eu estou “carregando” até Jesus na oração?",o:"Jesus, eu te apresento as pessoas que amo. Cura e abençoa cada uma."},
"2027-01-16":{v:"Não vim chamar os justos, mas os pecadores.",r:"Mc 2,17",p:"Jesus é médico. Ele não espera que estejamos bem para chegar perto de nós.",q:"Onde eu preciso deixar Jesus me cuidar?",o:"Jesus, médico da minha alma, cuida de mim."},
"2027-01-17":{v:"Falai, Senhor, que o vosso servo escuta.",r:"1Sm 3,9",p:"Samuel aprendeu a escutar Deus ainda menino. Quanto silêncio há na nossa casa para escutar?",q:"Como posso criar um pouco de silêncio no meu dia?",o:"Fala, Senhor, que a tua serva escuta."},
"2027-01-18":{v:"Vinho novo, em odres novos.",r:"Mc 2,22",p:"Deus quer fazer coisas novas, mas precisamos de um coração aberto para recebê-las.",q:"Que coisa nova Deus quer fazer em mim?",o:"Senhor, renova o meu coração para receber o que é novo."},
"2027-01-19":{v:"O sábado foi feito para o homem.",r:"Mc 2,27",p:"Descansar também é obediência a Deus. Uma mãe descansada ama melhor.",q:"Como posso descansar um pouco nesta semana?",o:"Senhor, ensina-me a descansar em Ti sem culpa."},
"2027-01-20":{v:"Sê fiel até a morte, e eu te darei a coroa da vida.",r:"Ap 2,10",p:"São Sebastião foi fiel até o fim. A fidelidade de cada dia, nas pequenas coisas, também é heroica.",q:"Em que pequena coisa eu posso ser fiel hoje?",o:"São Sebastião, rogai por nós e pela fidelidade da minha família."},
"2027-01-21":{v:"Deus escolheu o que é fraco no mundo para confundir os fortes.",r:"1Cor 1,27",p:"Santa Inês era uma menina, mas tinha um coração enorme. Deus age através dos pequenos.",q:"Em que eu me sinto fraca e posso deixar Deus agir?",o:"Senhor, a tua força se mostra na minha fraqueza."},
"2027-01-22":{v:"Jesus subiu ao monte e chamou os que Ele quis.",r:"Mc 3,13",p:"Você foi chamada pelo nome. Jesus te quis, do jeito que você é.",q:"Para que Jesus está me chamando nesta fase da vida?",o:"Jesus, obrigada por me chamar. Eis-me aqui."},
"2027-01-23":{v:"Eles não têm mais vinho.",r:"Jo 2,3",p:"Maria percebe o que falta antes de todos e leva a Jesus. Ela faz isso pela sua casa também.",q:"O que está faltando na minha casa hoje?",o:"Maria, olha para a minha casa e apresenta a Jesus o que nos falta."},
"2027-01-24":{v:"Lâmpada para os meus pés é a tua palavra.",r:"Sl 119(118),105",p:"A Bíblia não é um livro para a estante. É luz para o passo de hoje.",q:"Que trecho da Bíblia eu quero ler com os meus filhos?",o:"Senhor, que a tua Palavra ilumine cada passo da minha família."},
"2027-01-25":{v:"Senhor, que queres que eu faça?",r:"At 22,10",p:"Paulo caiu, ficou cego e depois enxergou como nunca. Às vezes Deus usa as quedas para nos converter.",q:"O que Deus quer que eu faça a partir de hoje?",o:"Senhor, o que queres que eu faça? Estou pronta para ouvir."},
"2027-01-26":{v:"Lembro-me da tua fé sincera, que habitou primeiro em tua avó Loide e em tua mãe Eunice.",r:"2Tm 1,5",p:"A fé de Timóteo começou com a mãe e a avó. A sua fé também está sendo plantada nos seus filhos.",q:"Que sementes de fé eu já plantei nos meus filhos?",o:"Senhor, que a minha fé seja herança viva para os meus filhos."},
"2027-01-27":{v:"A semente cai em terra boa e produz fruto.",r:"Mc 4,8",p:"Nem toda semente brota na hora. Continue semeando: Deus cuida do crescimento.",q:"Onde eu tenho desanimado de semear?",o:"Senhor, faz do meu coração uma terra boa para a tua Palavra."},
"2027-01-28":{v:"Ninguém acende uma lâmpada para colocá-la debaixo de um cesto.",r:"Mc 4,21",p:"A sua fé não é para ficar escondida. Ela ilumina a casa toda.",q:"Como posso deixar a luz de Deus brilhar hoje em casa?",o:"Senhor, que a minha vida seja uma luz acesa no meu lar."},
"2027-01-29":{v:"A semente germina e cresce, sem que ele saiba como.",r:"Mc 4,27",p:"Deus trabalha em silêncio no coração dos nossos filhos, mesmo quando não vemos resultado.",q:"Por qual filho (ou pessoa) eu preciso continuar confiando?",o:"Senhor, eu confio no teu trabalho silencioso no coração de quem eu amo."},
"2027-01-30":{v:"Por que sois tão medrosos? Ainda não tendes fé?",r:"Mc 4,40",p:"Jesus estava no barco o tempo todo. Ele está no barco da sua família também.",q:"Qual tempestade eu estou enfrentando agora?",o:"Jesus, acalma as tempestades da minha casa. Eu sei que estás comigo."},
"2027-01-31":{v:"Felizes os mansos, porque possuirão a terra.",r:"Mt 5,5",p:"Mansidão não é fraqueza. É força com doçura, aquela que transforma o clima da casa.",q:"Em que momento do dia eu mais preciso de mansidão?",o:"Jesus, manso e humilde de coração, faz o meu coração semelhante ao teu."}
};

{id:"casamento30",titulo:"30 dias orando pelo meu casamento",cat:"Casamento",cor:"rosa",ic:"aliancas",
resumo:"Um mês inteiro colocando o seu casamento nas mãos de Deus, com uma oração e um pequeno gesto de amor por dia.",
d:[
["Entregar o casamento a Deus","O cordão de três fios não se rompe facilmente.","Ecl 4,12","Um casamento com Deus no meio tem uma força que não vem de nós. Hoje você não precisa consertar nada: só entregar.","Escreva o nome de vocês dois num papel e coloque ao lado da sua imagem de Nossa Senhora ou da Bíblia.","Senhor, eu entrego o nosso casamento a Ti. Sê o terceiro fio que nos une."],
["Gratidão pelo meu esposo","Dou graças ao meu Deus todas as vezes que me lembro de vós.","Fl 1,3","Quando agradecemos, enxergamos o que há de bom. A gratidão muda o olhar e o clima da casa.","Escreva 5 qualidades do seu esposo e diga uma delas a ele hoje.","Obrigada, Senhor, pelo homem que colocaste ao meu lado. Abençoa-o hoje."],
["Saber ouvir","Seja todo homem pronto para ouvir e lento para falar.","Tg 1,19","Muitas brigas nascem de não ouvir até o fim. Ouvir com atenção é uma forma de amor.","Numa conversa hoje, ouça sem interromper e sem pegar o celular.","Senhor, coloca um guarda na minha boca e abre os meus ouvidos para o meu esposo."],
["Perdão","Assim como o Senhor vos perdoou, fazei vós também.","Cl 3,13","O perdão não apaga o que aconteceu, mas solta o coração. Perdoar é escolher não guardar a dívida.","Entregue a Deus uma mágoa antiga, dizendo em voz baixa: “eu escolho perdoar”.","Jesus, dá-me a graça de perdoar como Tu me perdoas, e de pedir perdão quando eu errar."],
["Paciência","O amor é paciente, o amor é bondoso.","1Cor 13,4","Paciência é amor que espera. Ninguém muda de um dia para o outro, nem eu nem ele.","Escolha não reclamar de uma mania dele durante o dia todo.","Senhor, dá-me paciência e bondade dentro do meu casamento."],
["A saúde dele","Desejo que estejas bem de saúde, assim como vai bem a tua alma.","3Jo 2","Cuidar da saúde do esposo também é amar. A oração é o primeiro cuidado.","Reze com a mão no ombro dele (ou na roupa dele, se preferir em segredo).","Senhor, guarda a saúde do meu esposo: corpo, mente e coração."],
["O trabalho de cada dia","Confirma, Senhor, a obra das nossas mãos.","Sl 90(89),17","O trabalho é parte da vocação. Rezar pelo trabalho dele é sustentar a família de joelhos.","Pergunte a ele como foi o dia e escute com interesse.","Senhor, abençoa o trabalho do meu esposo e dá-lhe ânimo e sabedoria."],
["A fé do meu esposo","Que Cristo habite pela fé em vossos corações.","Ef 3,17","Cada um tem o seu tempo com Deus. A sua oração prepara o terreno com amor, sem cobrança.","Não cobre nada sobre a fé dele hoje. Apenas reze por ele em segredo.","Senhor, aproxima o meu esposo de Ti, do jeito e no tempo que só Tu conheces."],
["Proteção nas tentações","Vigiai e orai para não cairdes em tentação.","Mt 26,41","Todos somos frágeis. A oração da esposa é um escudo para o marido e para a família.","Reze a oração a São Miguel Arcanjo pelo seu casamento (aba Orar).","São Miguel Arcanjo, protege o nosso casamento de todo perigo."],
["Unidade","Já não são dois, mas uma só carne. O que Deus uniu, o homem não separe.","Mc 10,8-9","Ser um só não é pensar igual em tudo. É caminhar juntos, mesmo sendo diferentes.","Façam juntos uma coisa simples: um café, uma caminhada, uma série.","Senhor, une os nossos corações e as nossas escolhas."],
["Honrar um ao outro","Adiantai-vos em honrar uns aos outros.","Rm 12,10","Honrar é valorizar em público e em particular. Um elogio diante dos filhos vale ouro.","Elogie seu esposo na frente dos filhos ou de alguém da família.","Senhor, que eu saiba honrar e valorizar o meu esposo."],
["Alegria e leveza","Coração alegre é bom remédio.","Pr 17,22","Casamentos também precisam de risadas. A leveza protege o amor.","Relembrem juntos uma história engraçada do começo do namoro.","Senhor, devolve a alegria e o bom humor ao nosso casamento."],
["As finanças da casa","O meu Deus proverá a todas as vossas necessidades.","Fl 4,19","Dinheiro é um dos maiores motivos de briga. Com Deus, ele vira um motivo de união e confiança.","Conversem 10 minutos com calma sobre uma meta financeira da família.","Senhor, ensina-nos a cuidar juntos do que nos dás, com paz e confiança."],
["Carinho e intimidade","As muitas águas não podem apagar o amor.","Ct 8,7","O carinho é linguagem de Deus dentro do casamento. Pequenos toques mantêm o amor aquecido.","Dê um abraço demorado nele hoje, sem motivo.","Senhor, renova o carinho, a ternura e a intimidade entre nós."],
["Decidir juntos","Andarão dois juntos, se não estiverem de acordo?","Am 3,3","Decidir juntos dá trabalho, mas constrói confiança. Ninguém fica carregando sozinho.","Peça a opinião dele sobre algo que você decidiria sozinha.","Espírito Santo, guia as nossas decisões e dá-nos um só coração."],
["O pai dos meus filhos","Como um pai tem compaixão dos filhos, o Senhor tem compaixão dos que o temem.","Sl 103(102),13","Seu esposo também está aprendendo a ser pai. Ele precisa de oração mais do que de críticas.","Diga aos filhos algo bonito sobre o pai deles.","Senhor, faz do meu esposo um pai segundo o teu coração."],
["Humildade","Com humildade, considerai os outros superiores a vós mesmos.","Fl 2,3","Querer sempre ter razão cansa o casamento. A humildade abre espaço para a paz.","Ceda numa discussão pequena, mesmo achando que tem razão.","Jesus, manso e humilde, dá-me um coração humilde no meu casamento."],
["Palavras que constroem","Nenhuma palavra má saia da vossa boca, mas só a que for boa para edificar.","Ef 4,29","As palavras constroem ou derrubam uma casa. Hoje escolha palavras que levantam.","Mande uma mensagem carinhosa para ele no meio do dia.","Senhor, purifica as minhas palavras e faz delas bênção."],
["Curar o passado","Não lembreis as coisas passadas: eis que faço uma coisa nova.","Is 43,18-19","Deus é especialista em começar de novo. Ele cura feridas que nem sabemos nomear.","Escreva uma ferida do casamento e entregue a Deus na oração. Depois rasgue o papel.","Senhor, cura as feridas do nosso passado e faz novas todas as coisas."],
["Rezar a dois","Se dois de vós estiverem de acordo para pedir algo, meu Pai o concederá.","Mt 18,19","A oração do casal tem uma força especial. Pode ser só um Pai-Nosso de mãos dadas.","Convide seu esposo para rezar um Pai-Nosso juntos antes de dormir.","Senhor, ensina-nos a rezar juntos, mesmo que seja pouco."],
["Servir com amor","Servi-vos uns aos outros pelo amor.","Gl 5,13","Servir não é ser menos. Jesus lavou os pés dos discípulos.","Faça algo que ele gosta sem que ele peça.","Jesus, que eu sirva ao meu esposo com alegria, e que ele também aprenda a servir."],
["Descansar juntos","Vinde, vós sozinhos, para um lugar deserto, e descansai um pouco.","Mc 6,31","O casal também precisa de pausa. Descansar juntos é investir no amor.","Combinem um momento a sós nesta semana, nem que seja um café em casa.","Senhor, dá-nos momentos de descanso e de reencontro."],
["Amigos de verdade","Melhor é serem dois do que um: se um cair, o outro o levanta.","Ecl 4,9-10","O casamento é a amizade mais profunda. Amigos se apoiam nas quedas.","Pergunte a ele: “como eu posso te ajudar nesta semana?”.","Senhor, que sejamos sempre amigos e companheiros de caminho."],
["Fidelidade","Que a bondade e a fidelidade não te abandonem.","Pr 3,3","Fidelidade se constrói nos detalhes: no olhar, nas conversas, no coração.","Reze pela fidelidade de vocês dois e pelos casais que estão em crise.","Senhor, guarda o nosso amor fiel até o fim."],
["Paz nas discussões","Não se ponha o sol sobre a vossa ira.","Ef 4,26","Discordar é normal. O que fere é dormir com raiva. Deus quer que a gente resolva com amor.","Se houver algo pendente, procure resolver com calma antes de dormir.","Senhor, ensina-nos a discordar com respeito e a fazer as pazes depressa."],
["Sonhar juntos","Confia ao Senhor as tuas obras, e os teus planos serão bem-sucedidos.","Pr 16,3","Casais que sonham juntos caminham na mesma direção. Deus ama os nossos sonhos.","Escrevam juntos 3 sonhos para os próximos anos.","Senhor, abençoa os nossos sonhos e faz deles parte do teu plano."],
["A família dele e a minha","O teu povo será o meu povo.","Rt 1,16","Sogros, cunhados, famílias diferentes... Rezar por eles traz paz para o casal.","Reze por cada pessoa da família do seu esposo, pelo nome.","Senhor, abençoa as nossas famílias e dá-nos sabedoria e paz nas relações."],
["O sacramento do matrimônio","Tu guardaste o vinho bom até agora.","Jo 2,10","Jesus fez o primeiro milagre num casamento. Ele ainda transforma água em vinho no seu lar.","Relembre o dia do seu casamento: olhe as fotos e agradeça.","Jesus, renova a graça do nosso sacramento e transforma a nossa água em vinho."],
["Sob a proteção da Sagrada Família","José, não temas receber Maria, tua esposa.","Mt 1,20","Maria e José também enfrentaram dificuldades. Eles entendem o seu casamento.","Reze a oração à Sagrada Família (aba Orar) pelo seu casamento.","Jesus, Maria e José, protegei o nosso casamento."],
["Renovar o sim","O amor tudo desculpa, tudo crê, tudo espera, tudo suporta. O amor jamais passará.","1Cor 13,7-8","Depois de 30 dias, é hora de renovar o seu “sim”. Não um sim de conto de fadas, mas um sim de fé.","Diga ao seu esposo (ou escreva num bilhete): “eu escolho você de novo”.","Senhor, eu renovo hoje o meu sim. Obrigada por cada dia desta caminhada."]
]},

{id:"filhos21",titulo:"21 dias orando pelos meus filhos",cat:"Filhos",cor:"azul",ic:"criancas",
resumo:"Três semanas cobrindo seus filhos de oração: fé, proteção, amizades, emoções, futuro e vocação.",
d:[
["Entregar meus filhos a Deus","Por este menino eu orava, e o Senhor me concedeu o que pedi. Por isso eu o consagro ao Senhor.","1Sm 1,27-28","Ana entregou Samuel a Deus. Nossos filhos são presentes que Deus nos confiou. Eles são d’Ele antes de serem nossos.","Escreva o nome de cada filho e reze: “Senhor, ele é teu”.","Senhor, eu te entrego os meus filhos. Cuida deles melhor do que eu consigo."],
["A fé dos meus filhos","Desde a infância conheces as Sagradas Escrituras.","2Tm 3,15","A fé se aprende em casa, no colo, no exemplo. Cada oração que eles ouvem é uma semente.","Leia uma história curtinha da Bíblia para eles (veja a aba Filhos).","Senhor, faz crescer a fé no coração dos meus filhos."],
["Proteção","Ele dará ordem aos seus anjos para te guardarem em todos os teus caminhos.","Sl 91(90),11","Seus filhos não estão sozinhos: Deus colocou um anjo ao lado de cada um.","Reze o Santo Anjo com eles hoje (aba Orar).","Santo Anjo da Guarda de cada filho meu, guarda-os, protege-os e ilumina-os."],
["Saúde","O Senhor te guardará de todo mal; guardará a tua vida.","Sl 121(120),7","Toda mãe se preocupa com a saúde dos filhos. Transforme essa preocupação em oração.","Abençoe cada filho tocando a cabeça dele ao dormir.","Senhor, guarda a saúde dos meus filhos: corpo, mente e coração."],
["Um coração bondoso","Sede bondosos uns com os outros, compassivos.","Ef 4,32","Mais do que filhos “bem-sucedidos”, queremos filhos bons. A bondade se aprende vendo.","Elogie uma atitude bondosa de um filho hoje.","Senhor, dá aos meus filhos um coração bondoso e compassivo."],
["Boas amizades","Quem anda com os sábios será sábio.","Pr 13,20","As amizades moldam o coração. Reze pelos amigos dos seus filhos, que também são filhos de alguém.","Pergunte com interesse sobre os amigos deles e reze por esses amigos.","Senhor, coloca boas amizades na vida dos meus filhos."],
["Estudos e sabedoria","Se alguém tem falta de sabedoria, peça a Deus.","Tg 1,5","A sabedoria vai além das notas. É saber escolher o bem.","Reze com eles antes de estudar ou de uma atividade importante.","Espírito Santo, dá aos meus filhos sabedoria, entendimento e gosto por aprender."],
["Filhos amados de Deus","Vede que grande amor o Pai nos deu: sermos chamados filhos de Deus.","1Jo 3,1","Quando a criança sabe que é amada por Deus, ela não precisa mendigar amor no mundo.","Diga a cada filho: “Deus te ama muito, e eu também”.","Pai, que os meus filhos saibam, lá no fundo, que são amados por Ti."],
["Obediência com amor","Jesus desceu com eles para Nazaré e era-lhes submisso.","Lc 2,51","Até Jesus obedeceu a Maria e José. A obediência nasce do amor e da confiança.","Elogie seu filho quando ele obedecer de primeira.","Senhor, dá aos meus filhos um coração dócil, e a mim, firmeza com ternura."],
["Coração puro","Felizes os puros de coração, porque verão a Deus.","Mt 5,8","O mundo oferece muita coisa que suja o coração. A oração da mãe é uma proteção poderosa.","Confira com carinho o que seus filhos andam vendo e ouvindo.","Senhor, guarda os olhos, os ouvidos e o coração dos meus filhos."],
["Coragem","Sê forte e corajoso; não temas, porque o Senhor teu Deus está contigo.","Js 1,9","Filhos corajosos não são filhos sem medo, mas filhos que sabem que Deus está com eles.","Pergunte: “do que você tem medo?” e reze junto com ele.","Senhor, dá aos meus filhos coragem para fazer o bem, mesmo sozinhos."],
["Irmãos unidos","Como é bom e agradável os irmãos viverem unidos!","Sl 133(132),1","Brigas entre irmãos são normais. Mas a união se constrói com oração e com pequenas pontes.","Proponha uma atividade em que os irmãos precisem colaborar.","Senhor, une os meus filhos e faz deles amigos para a vida toda."],
["Emoções em paz","Não vos inquieteis com nada... e a paz de Deus guardará os vossos corações.","Fl 4,6-7","Crianças também sentem ansiedade, raiva e tristeza. Elas precisam aprender a levar isso a Deus.","Ensine a seu filho uma oração curtinha para quando ficar nervoso: “Jesus, eu confio em vós”.","Senhor, guarda o coração dos meus filhos na tua paz."],
["Uso do tempo e das telas","Aproveitai bem o tempo.","Ef 5,16","As telas disputam o coração dos nossos filhos. Precisamos de sabedoria, não de culpa.","Combine com a família uma hora sem telas hoje.","Senhor, dá-nos sabedoria para usar bem o tempo e a tecnologia."],
["Vocação","Antes de te formar no ventre materno, eu te conheci.","Jr 1,5","Deus tem um plano para cada filho seu. A nossa missão é ajudá-los a ouvir a voz d’Ele.","Pergunte a seu filho: “o que você acha que Deus quer de você?”.","Senhor, ajuda os meus filhos a descobrirem e abraçarem a sua vocação."],
["O futuro","Põe no Senhor a tua alegria, e Ele te dará o que pede o teu coração.","Sl 37(36),4","Rezamos hoje pelo futuro dos filhos: escolhas, estudos, a pessoa com quem vão se casar, se for o caminho deles.","Reze por quem será a futura família de cada filho.","Senhor, prepara o futuro dos meus filhos e guia cada passo deles."],
["O filho que se afastou","Ainda longe, o pai o viu, encheu-se de compaixão e correu ao seu encontro.","Lc 15,20","Se algum filho está longe da fé, lembre: Deus corre ao encontro dele. A sua oração é a porta que fica aberta.","Reze o terço (ou uma dezena) por um filho, afilhado ou sobrinho que está longe de Deus.","Pai de misericórdia, traz de volta os filhos que se afastaram e abraça-os."],
["Filhos gratos","Dai graças ao Senhor, porque Ele é bom.","Sl 136(135),1","Gratidão se ensina praticando. Uma criança grata é uma criança mais feliz.","No jantar, cada um diz uma coisa pela qual agradece.","Senhor, dá aos meus filhos um coração agradecido."],
["Os sacramentos","Deixai vir a mim as criancinhas.","Mc 10,14","Batismo, Eucaristia, Confissão, Crisma: são encontros com Jesus. Eles precisam ser preparados com carinho.","Anote a data do batismo de cada filho e veja qual sacramento vem a seguir.","Jesus, atrai os meus filhos aos teus sacramentos."],
["Eu, mãe, como exemplo","Ensina a criança no caminho que deve andar, e ainda quando for velha não se desviará dele.","Pr 22,6","Os filhos aprendem mais com o que veem do que com o que ouvem. E Deus nos ajuda nos nossos limites.","Deixe que seus filhos vejam você rezando hoje.","Senhor, que eu seja para os meus filhos um caminho até Ti."],
["Consagrar os filhos a Nossa Senhora","Eis aí a tua mãe.","Jo 19,27","Jesus nos deu Maria como Mãe. Consagrar os filhos a ela é colocá-los no coração mais seguro.","Consagre cada filho a Nossa Senhora com suas palavras (ou com a oração da aba Orar).","Nossa Senhora, eu consagro a ti os meus filhos. Cuida deles como cuidaste de Jesus."]
]},

{id:"lar21",titulo:"21 dias de restauração do lar",cat:"Lar",cor:"verde",ic:"casa",
resumo:"Para quando a casa anda pesada: 21 dias trazendo paz, perdão, oração e alegria de volta para o seu lar.",
d:[
["Deus é o construtor da casa","Se o Senhor não edificar a casa, em vão trabalham os que a constroem.","Sl 127(126),1","Restaurar o lar não começa com força de vontade, mas com entrega. Deus é o construtor.","Faça uma oração em cada cômodo da casa pedindo que Deus seja o dono dali.","Senhor, sê o construtor da minha casa. Sem Ti, nada se sustenta."],
["Convidar Jesus","Zaqueu, desce depressa, pois hoje preciso ficar em tua casa.","Lc 19,5","Jesus quis entrar na casa de Zaqueu, mesmo bagunçada. Ele também quer entrar na sua.","Coloque uma imagem de Jesus ou da Sagrada Família num lugar visível.","Jesus, entra na minha casa hoje. Tu és bem-vindo aqui."],
["Arrumar o coração primeiro","Cria em mim, ó Deus, um coração puro.","Sl 51(50),12","A casa muda quando a gente muda. Antes de cobrar dos outros, olhamos para dentro.","Faça um exame de consciência curto: onde eu tenho contribuído para o peso da casa?","Senhor, começa a restauração por mim."],
["Perdoar dentro de casa","Não te digo até sete vezes, mas até setenta vezes sete.","Mt 18,22","Em família perdoamos muitas vezes, às vezes no mesmo dia. O perdão é o óleo que faz a casa funcionar.","Peça perdão a alguém da casa por algo pequeno.","Jesus, ensina a minha família a perdoar sempre."],
["Palavras mansas","A resposta branda acalma o furor.","Pr 15,1","Um tom de voz muda uma conversa inteira. A mansidão desarma brigas.","Escolha falar baixo o dia inteiro, mesmo quando der vontade de gritar.","Senhor, dá-me palavras mansas que acalmam e não ferem."],
["Rezar juntos","Onde dois ou três estão reunidos em meu nome, eu estou no meio deles.","Mt 18,20","Não precisa ser longo. Uma oração juntos já coloca Jesus no meio da família.","Reze com a família uma oração curta antes de uma refeição.","Jesus, fica no meio de nós quando nos reunimos."],
["Paz","Deixo-vos a paz, a minha paz vos dou.","Jo 14,27","A paz de Jesus não depende de tudo estar resolvido. Ela é presença.","Escolha um momento do dia para 3 minutos de silêncio em casa.","Jesus, derrama a tua paz sobre o meu lar."],
["Ordem e simplicidade","Tudo se faça com decência e ordem.","1Cor 14,40","Uma casa organizada acalma. Não é sobre perfeição, é sobre leveza.","Escolha um cantinho bagunçado e arrume rezando.","Senhor, ajuda-me a cuidar da minha casa com simplicidade e paz."],
["A mesa da família","Partiam o pão nas casas e tomavam o alimento com alegria.","At 2,46","A mesa é um altar doméstico. Ali se partilha comida, histórias e amor.","Façam uma refeição juntos, sem telas, com uma pergunta para conversar.","Senhor, abençoa a nossa mesa e as conversas que acontecem nela."],
["O domingo","Lembra-te de santificar o dia do Senhor.","Ex 20,8","O domingo é presente de Deus para a família: Missa, descanso e convivência.","Planeje o próximo domingo: Missa em família e um momento especial depois.","Senhor, que o domingo seja o dia mais bonito da nossa semana."],
["Cura das memórias","Eis que faço novas todas as coisas.","Ap 21,5","Algumas feridas da família são antigas. Deus pode tocar até as lembranças mais doloridas.","Escreva uma lembrança que dói e entregue a Jesus em oração.","Senhor, cura as memórias da minha família e faz novas todas as coisas."],
["Abençoar a casa","O Senhor te abençoe e te guarde; faça brilhar sobre ti a sua face.","Nm 6,24-25","Abençoar é dizer bem. Você pode abençoar cada pessoa da casa.","Abençoe cada pessoa da casa com essas palavras antes de dormir.","O Senhor abençoe a minha casa e todos os que moram nela."],
["Portas abertas","Não vos esqueçais da hospitalidade.","Hb 13,2","Uma casa restaurada se abre para os outros. A hospitalidade aquece o lar.","Convide alguém para um café ou faça uma visita.","Senhor, que a minha casa seja acolhedora como a casa de Betânia."],
["Força para o cansaço","Os que esperam no Senhor renovam as suas forças.","Is 40,31","Restaurar cansa. Deus conhece o seu limite e renova as suas forças.","Descanse 20 minutos hoje, sem culpa.","Senhor, renova as minhas forças. Eu espero em Ti."],
["Promotora da paz","Felizes os que promovem a paz.","Mt 5,9","Às vezes a mãe é a ponte entre os que brigam. Que seja uma ponte de paz, não de mais briga.","Ajude dois membros da família a fazer as pazes com carinho.","Senhor, faz de mim instrumento da tua paz dentro de casa."],
["As finanças","Buscai primeiro o Reino de Deus, e todas as coisas vos serão dadas por acréscimo.","Mt 6,33","As preocupações com dinheiro pesam no lar. Colocar Deus em primeiro lugar traz ordem e paz.","Faça uma oração sobre as contas da casa e anote uma pequena economia possível.","Senhor, provê o que falta e ensina-nos a confiar em Ti."],
["Proteção espiritual","Revesti-vos da armadura de Deus.","Ef 6,11","A família é muito amada por Deus e também muito atacada. A oração é a nossa armadura.","Reze a oração a São Miguel Arcanjo pela sua casa.","São Miguel Arcanjo, defende a minha família e a minha casa."],
["Alegria","A alegria do Senhor é a vossa força.","Ne 8,10","Uma casa restaurada também ri. A alegria é sinal da presença de Deus.","Faça algo divertido em família: um jogo, uma música, uma dança.","Senhor, devolve a alegria à minha casa."],
["Pequenos gestos","Acima de tudo, revesti-vos do amor, que é o vínculo da perfeição.","Cl 3,14","O amor se mostra nos detalhes: um bilhete, um café, um elogio.","Deixe um bilhete carinhoso para alguém da casa.","Senhor, que o amor esteja nos pequenos detalhes do meu lar."],
["Maria em casa","Maria ficou com Isabel uns três meses.","Lc 1,56","Maria levou Jesus para a casa de Isabel e tudo se encheu de alegria. Convide-a para morar com vocês.","Reze o terço (ou uma dezena) pela sua família.","Nossa Senhora, mora na minha casa e enche tudo de Jesus."],
["Eu e minha casa serviremos ao Senhor","Eu e minha casa serviremos ao Senhor.","Js 24,15","Depois de 21 dias, é hora de consagrar o lar a Deus. Uma decisão para a vida.","Faça a consagração do lar à Sagrada Família (aba Orar) com todos juntos.","Senhor, eu e a minha casa serviremos a Ti. Hoje e sempre."]
]}
);
