exp:"O salmista promete louvar a Deus todos os dias e diz que cada geração conta à seguinte as maravilhas de Deus. A fé passa de pais para filhos através das histórias, dos cantos e da oração.",
med:["O bebê já ouve a sua voz no ventre e reconhece o seu tom. As suas palavras, cantos e orações já estão chegando até ele.","Contar ao bebê as maravilhas de Deus desde agora é começar a transmitir a fé. É a primeira catequese, feita com amor."],
perg:"O que eu gostaria de contar ao meu bebê sobre Deus?",
des:"Hoje, cante uma música religiosa para o bebê ou conte a ele uma história da Bíblia, com a mão na barriga.",
ora:"Senhor, que o meu filho ouça falar de Ti desde o ventre. Que a nossa família anuncie as tuas maravilhas. Amém."},

{t:"Cuidar de mim com carinho",ref:"3Jo 2-4",v:"Desejo que estejas bem de saúde, assim como vai bem a tua alma.",
exp:"O apóstolo João escreve a um amigo, Gaio, e começa desejando que ele tenha saúde no corpo, como já tem na alma. E diz que a sua maior alegria é saber que os seus filhos espirituais vivem na verdade.",
med:["Comer bem, beber água, dormir, fazer o pré-natal, caminhar: tudo isso também é amor pelo bebê. Cuidar de si é cuidar dele.","Deus deseja a sua saúde no corpo e na alma. Não se esqueça da alma: oração, sacramentos, um tempo de silêncio."],
perg:"Como estou cuidando do meu corpo e da minha alma nesta gestação?",
des:"Escolha hoje um cuidado com o corpo (uma refeição saudável, mais água, uma caminhada) e um cuidado com a alma (uma Missa, a Confissão, um momento de oração).",
ora:"Senhor, ajuda-me a cuidar bem do meu corpo e da minha alma, por mim e pelo meu bebê. Amém."},

{t:"Rede de apoio",ref:"Lc 1,39-45.56",v:"Maria ficou com Isabel uns três meses.",
exp:"Logo depois do anúncio do anjo, Maria vai às pressas para a casa de Isabel, que também está grávida. As duas se encontram, se alegram, rezam juntas. Maria fica três meses com Isabel, até perto do nascimento de João.",
med:["Maria e Isabel se apoiaram na gestação. Ninguém foi feita para viver essa fase sozinha.","Uma rede de apoio (família, amigas, comunidade) faz muita diferença na gestação e depois do parto. Não tenha vergonha de pedir e aceitar ajuda."],
perg:"Quem faz parte da minha rede de apoio? Quem eu ainda posso chamar?",
des:"Converse com alguém de confiança sobre como pode te ajudar depois que o bebê nascer. Agradeça a quem já tem te apoiado.",
ora:"Senhor, obrigada pelas pessoas que me apoiam. Coloca no meu caminho “Isabéis” que caminhem comigo. Amém."},

{t:"Confiança no parto",ref:"Jo 16,20-22",v:"A mulher, quando está para dar à luz, sente tristeza, porque chegou a sua hora; mas, depois que a criança nasce, já não se lembra da aflição.",
exp:"Na Última Ceia, Jesus prepara os discípulos para a sua morte e ressurreição. Para explicar que a tristeza deles vai se transformar em alegria, usa a imagem do parto: a dor existe, mas a alegria de uma vida nova é maior.",
med:["Jesus usou o parto como imagem de esperança. Ele conhece a dor do parto e a alegria que vem depois.","O medo do parto é natural. Entregue a Deus o momento do nascimento: o tipo de parto, a equipe, o dia e a hora. Ele estará com você."],
perg:"Como eu imagino o momento do parto? O que eu entrego hoje a Deus?",
des:"Escreva uma oração para rezar no dia do parto e guarde na bolsa da maternidade. Peça a alguém de confiança que reze por você nesse dia.",
ora:"Jesus, Tu conheces a dor e a alegria do nascimento. Fica comigo na hora do parto e transforma toda aflição em alegria. Amém."},

{t:"A equipe que vai cuidar de nós",ref:"Eclo 38,1-4.12-14",v:"Honra o médico, pois o Senhor também o criou.",
exp:"O livro do Eclesiástico ensina a honrar o médico, porque o seu conhecimento vem de Deus. Diz que o Senhor fez a terra produzir remédios e que o próprio médico também reza a Deus para acertar no diagnóstico e no tratamento.",
med:["Médicos, enfermeiras, doulas e toda a equipe são instrumentos de Deus. A fé e a medicina caminham juntas.","Rezar pela equipe que vai cuidar de você e do bebê é um ato de confiança e de caridade. Eles também precisam de sabedoria e de paz."],
perg:"Eu confio na equipe que me acompanha? Tenho rezado por eles?",
des:"Reze hoje, pelo nome (se souber), por cada profissional que acompanha a sua gestação e vai estar no parto.",
ora:"Senhor, abençoa os médicos e toda a equipe que cuida de mim e do meu bebê. Dá-lhes sabedoria, cuidado e paz. Amém."},

{t:"Pelas outras gestantes",ref:"Gl 6,2-10",v:"Carregai os fardos uns dos outros.",
exp:"São Paulo pede que os cristãos ajudem uns aos outros a carregar os pesos. E encoraja: não nos cansemos de fazer o bem, porque no tempo certo vamos colher. Enquanto temos tempo, façamos o bem a todos.",
med:["Muitas mulheres estão grávidas agora: algumas sozinhas, com medo, sem recursos ou em gestações de risco. Algumas pensam em desistir.","Rezar e ajudar outras gestantes é uma forma de agradecer pela própria gestação e de defender a vida."],
perg:"Conheço alguma gestante que precisa de apoio ou oração?",
des:"Reze hoje por todas as gestantes, especialmente as que estão sozinhas ou com medo. Se puder, doe algo para uma gestante que precise (roupinhas, fraldas).",
ora:"Senhor, cuida de todas as gestantes do mundo, especialmente das que estão sozinhas ou com medo. Protege cada vida. Amém."},

{t:"Uma família que reza",ref:"Sl 128(127)",v:"Tua esposa será como videira fecunda no interior da tua casa; teus filhos, como rebentos de oliveira ao redor da tua mesa.",
exp:"O salmo descreve a bênção de quem teme a Deus: comer do fruto do próprio trabalho, uma esposa como videira cheia de frutos, filhos ao redor da mesa como brotos de oliveira. É a imagem de uma família abençoada e unida.",
med:["O bebê vai chegar a uma casa. Que tipo de casa ele vai encontrar? Uma família que reza junta oferece ao filho raízes firmes.","Não precisa esperar o bebê nascer para começar: a oração em família pode começar agora, com o bebê ainda no ventre."],
perg:"Como eu quero que seja a vida de oração da nossa família quando o bebê chegar?",
des:"Combine com o pai do bebê (e os outros filhos, se houver) uma oração simples em família, e comecem hoje, com a mão na barriga.",
ora:"Senhor, que a nossa família seja como videira fecunda e oliveiras ao redor da mesa. Que o nosso filho cresça numa casa que reza. Amém."},

{t:"Entregar o nascimento",ref:"Sl 22(21),10-12",v:"Desde o seio de minha mãe tu és o meu Deus. Não fiques longe de mim.",
exp:"No meio de um salmo de grande sofrimento (o salmo que Jesus rezou na cruz), o salmista lembra que Deus cuidou dele desde o nascimento: foi Deus quem o tirou do ventre materno e o fez descansar no colo da mãe. E pede: não fiques longe de mim.",
med:["Deus está com o seu bebê desde o ventre e estará com ele no nascimento e por toda a vida. Ele é o Deus do seu filho desde já.","Entregar o nascimento a Deus é confiar que Ele cuida do momento exato, da forma e de cada detalhe."],
perg:"Que detalhe do nascimento eu ainda tenho dificuldade de entregar a Deus?",
des:"Faça hoje uma oração de entrega do nascimento, colocando a data provável, o lugar e cada medo nas mãos de Deus. Escreva-a aqui.",
ora:"Senhor, desde o ventre Tu és o Deus do meu filho. Não fiques longe de nós. Eu te entrego o momento do nascimento. Amém."},

{t:"Sem preocupação excessiva",ref:"Mt 6,26-30",v:"Olhai as aves do céu: não semeiam nem colhem, e o vosso Pai celeste as alimenta.",
exp:"Jesus convida a olhar a natureza: as aves não acumulam e o Pai as alimenta; os lírios não tecem e se vestem mais bonitos que o rei Salomão. Se Deus cuida assim deles, quanto mais de vocês, gente de pouca fé!",
med:["Enxoval, mala da maternidade, quartinho, finanças, licença do trabalho: a lista de preocupações parece não ter fim.","É bom se preparar, mas sem deixar que a preocupação roube a alegria da espera. O Pai que cuida dos passarinhos cuida do seu bebê."],
perg:"Que preocupação prática tem roubado a minha paz?",
des:"Faça uma lista do que ainda falta preparar e divida em pequenas tarefas. Entregue a lista a Deus em oração e escolha só uma tarefa para hoje.",
ora:"Pai, Tu cuidas das aves e dos lírios. Cuida também de nós. Tira de mim a preocupação excessiva. Amém."},

{t:"Consagrar o bebê",ref:"Lc 2,22-35",v:"Levaram o menino a Jerusalém para apresentá-lo ao Senhor.",
exp:"Quarenta dias depois do nascimento, Maria e José levam Jesus ao Templo para apresentá-lo a Deus, como mandava a Lei. Lá, o velho Simeão toma o menino nos braços e louva a Deus: agora pode partir em paz, porque viu a salvação.",
med:["Maria e José apresentaram Jesus a Deus. Você pode fazer o mesmo com o seu bebê desde agora, consagrando-o a Deus e a Nossa Senhora.","Depois destes 30 dias, entregue tudo: a gestação, o parto, a vida do seu filho, o seu coração de mãe."],
perg:"O que mudou no meu coração nestes 30 dias de oração?",
des:"Faça uma oração de consagração do bebê a Deus e a Nossa Senhora, com a mão na barriga, junto com o pai do bebê se possível. Escreva a data aqui para contar a ele no futuro.",
ora:"Senhor, eu te apresento e consagro o meu filho. Maria, cobre-o com o teu manto. Ele é vosso, desde o ventre e para sempre. Amém."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="gestacao30"){PLANOS[i].d=D;PLANOS[i].resumo="Para a mamãe que está grávida: um mês rezando pelo bebê, entregando os medos a Deus e preparando o coração para o nascimento. Cada dia traz uma leitura explicada, uma meditação, um espaço para escrever e um pequeno desafio.";}}
})();

// 21 dias de restauração do lar: versão completa
(function(){
var D=[
{t:"Deus é o construtor da casa",ref:"Sl 127(126),1-2",v:"Se o Senhor não construir a casa, em vão trabalham os que a constroem.",
exp:"Este salmo era cantado pelos peregrinos a caminho de Jerusalém. Ele lembra que todo esforço humano é inútil sem Deus: construir, vigiar, levantar cedo e dormir tarde. Deus dá o necessário até aos que dormem.",
med:["Quando a casa anda pesada, a primeira tentação é resolver tudo sozinha: mais regras, mais cobranças, mais cansaço. O salmo nos lembra de começar pelo alicerce.","Restaurar o lar começa por convidar Deus a ser o construtor. Você continua trabalhando, mas deixa de carregar a obra sozinha."],
perg:"Em que parte da minha casa eu tenho trabalhado sozinha, sem deixar Deus construir?",
des:"Ande pela sua casa, cômodo por cômodo, e reze um Pai-Nosso em cada um, pedindo que Deus seja o construtor daquele lugar e de quem vive ali.",
ora:"Senhor, constrói Tu a minha casa. Sem Ti, todo o nosso esforço é em vão. Sê o alicerce da nossa família. Amém."},

{t:"Convidar Jesus para entrar",ref:"Lc 19,1-10",v:"Zaqueu, desce depressa, pois hoje preciso ficar em tua casa.",
exp:"Zaqueu era chefe dos cobradores de impostos, rico e mal visto pelo povo. Como era baixinho, sobe numa árvore para ver Jesus passar. Jesus para, olha para cima e diz que quer ficar na casa dele. Zaqueu recebe Jesus com alegria, e a sua vida muda: ele devolve o que roubou e reparte com os pobres. Jesus diz: “Hoje a salvação entrou nesta casa”.",
med:["Jesus não esperou a casa de Zaqueu estar arrumada nem a vida dele resolvida. Ele quis entrar justamente ali. E bastou entrar para tudo começar a mudar.","A sua casa também não precisa estar perfeita para Jesus entrar. Ele quer ficar com vocês hoje, do jeito que estão."],
perg:"Que cômodo da minha casa (ou da minha vida) eu tenho vergonha de deixar Jesus entrar?",
des:"Coloque um crucifixo ou uma imagem de Jesus num lugar visível da casa, onde a família passa todos os dias. Reze diante dela: “Jesus, fica na nossa casa”.",
ora:"Jesus, entra hoje na minha casa, como entraste na casa de Zaqueu. Que a salvação chegue a todos que moram aqui. Amém."},

{t:"Arrumar o coração primeiro",ref:"Sl 51(50),3-14",v:"Criai em mim, ó Deus, um coração puro, e renovai em mim um espírito firme.",
exp:"O rei Davi escreveu este salmo depois de reconhecer um pecado grave. Ele não se justifica: pede misericórdia, pede para ser lavado e purificado. E faz um pedido lindo: um coração novo, um espírito firme e a alegria da salvação de volta.",
med:["A casa muda quando o coração de quem cuida dela muda. É fácil enxergar o que os outros precisam mudar; é mais difícil olhar para dentro.","Não se trata de se culpar por tudo, mas de começar por onde você tem poder: o seu coração. Uma mãe em paz contagia a casa inteira."],
perg:"O que no meu coração tem deixado a minha casa mais pesada?",
des:"Faça hoje um bom exame de consciência e, se possível, procure a Confissão nesta semana. Anote aqui os horários da sua paróquia.",
ora:"Criai em mim, ó Deus, um coração puro. Lava-me, renova-me e devolve-me a alegria, para que eu leve paz à minha casa. Amém."},

{t:"Perdoar dentro de casa",ref:"Mt 18,21-35",v:"Não te digo até sete vezes, mas até setenta vezes sete.",
exp:"Pedro pergunta a Jesus quantas vezes deve perdoar: sete vezes? Jesus responde: setenta vezes sete, ou seja, sempre. E conta a parábola de um empregado a quem o rei perdoou uma dívida enorme, mas que não perdoou uma dívida pequena de um colega.",
med:["Em família, ferimos e somos feridos todos os dias, quase sempre sem querer. Sem perdão, a casa vira um lugar de contas a cobrar.","Lembrar quanto Deus já nos perdoou ajuda a perdoar os outros. O perdão não é sentimento: é decisão que se renova, até setenta vezes sete."],
perg:"Quem dentro da minha casa eu ainda não perdoei de verdade?",
des:"Escolha alguém da família com quem há mágoa e dê hoje um passo de reconciliação: um abraço, um pedido de desculpas, uma palavra gentil. Ensine aos filhos a frase: “Eu te perdoo”.",
ora:"Senhor, Tu me perdoaste uma dívida enorme. Dá-me um coração que perdoa os de casa setenta vezes sete. Amém."},

{t:"Palavras mansas",ref:"Tg 3,2-10",v:"Com a língua bendizemos o Senhor e Pai, e com ela amaldiçoamos as pessoas. Isso não deve ser assim.",
exp:"São Tiago compara a língua ao freio de um cavalo, ao leme de um navio e a uma pequena faísca que incendeia uma floresta. Uma parte tão pequena do corpo pode dirigir tudo para o bem ou para o mal. E alerta: da mesma boca não podem sair bênção e maldição.",
med:["Um tom de voz muda uma conversa inteira. O livro dos Provérbios diz: “A resposta branda acalma o furor” (Pr 15,1). Muitas brigas em casa poderiam terminar em minutos com uma palavra mansa.","Repare hoje nas palavras ditas no automático: gritos, ironias, apelidos, ameaças. São faíscas pequenas que vão queimando a casa."],
perg:"Que palavras ou tom de voz meus têm acendido incêndios dentro de casa?",
des:"Hoje, quando sentir vontade de gritar, abaixe o tom de voz e chegue perto da pessoa para falar. Repita durante o dia a oração: “Senhor, guarda a minha boca”.",
ora:"Senhor, coloca um freio na minha língua. Que da minha boca saiam só palavras que abençoam a minha família. Amém."},

{t:"Rezar juntos",ref:"At 1,12-14",v:"Todos eles perseveravam unânimes na oração, com algumas mulheres e com Maria, a mãe de Jesus.",
exp:"Depois que Jesus sobe ao céu, os apóstolos voltam para Jerusalém e se reúnem na sala de cima. Ali, juntos com Maria e outras mulheres, rezam unidos, esperando a vinda do Espírito Santo prometido.",
med:["A Igreja nasceu de uma família que rezava junta com Maria. A oração em família também é o que faz nascer o Espírito Santo dentro de casa.","Não precisa ser longa nem perfeita: um Pai-Nosso antes de dormir, uma bênção antes da refeição, uma Ave-Maria no carro. O que importa é a constância."],
perg:"Em que momento do dia a minha família poderia rezar junta, mesmo que por um minuto?",
des:"Escolham um momento fixo para rezar juntos (no jantar ou antes de dormir) e comecem hoje com um Pai-Nosso e uma Ave-Maria de mãos dadas.",
ora:"Maria, reza conosco como rezaste com os apóstolos. Que a nossa família persevere unida na oração. Amém."},

{t:"A paz que Jesus dá",ref:"Jo 14,23-27",v:"Deixo-vos a paz, a minha paz vos dou; não vo-la dou como o mundo a dá.",
exp:"Na Última Ceia, Jesus promete que, se alguém o ama, o Pai e Ele virão morar nessa pessoa. Promete também o Espírito Santo, que vai ensinar e lembrar tudo. E deixa um presente: a sua paz, diferente da paz do mundo. “Não se perturbe o vosso coração.”",
med:["A paz do mundo depende de tudo estar resolvido. A paz de Jesus mora no coração mesmo quando há problemas, porque nasce da presença dele.","Uma casa em paz não é uma casa sem conflitos, mas uma casa onde Jesus mora e onde os conflitos encontram caminho."],
perg:"O que mais tem roubado a paz da minha casa?",
des:"Antes de dormir, passe pelo quarto de cada pessoa da casa e diga baixinho (ou em voz alta): “A paz de Jesus esteja com você”.",
ora:"Jesus, deixa a tua paz na nossa casa. Mora em nós e acalma os nossos corações. Amém."},

{t:"Uma coisa só é necessária",ref:"Lc 10,38-42",v:"Marta, Marta, tu te inquietas e te agitas por muitas coisas; no entanto, uma só coisa é necessária.",
exp:"Jesus visita a casa de Marta e Maria. Marta se ocupa com muitos afazeres para receber bem o hóspede; Maria senta aos pés de Jesus para ouvi-lo. Marta reclama, e Jesus responde com carinho: ela está agitada com muitas coisas, mas Maria escolheu a melhor parte.",
med:["Marta não estava errada em servir; o problema era a agitação. Muitas casas são assim: tanta coisa para dar conta que não sobra espaço para o essencial.","Ordem e simplicidade acalmam a casa. Ter menos coisas, menos compromissos, uma rotina mais simples. E, no meio de tudo, um tempo aos pés de Jesus."],
perg:"Com quantas coisas eu me agito todos os dias? O que eu poderia simplificar?",
des:"Escolha um cantinho da casa que gera estresse (uma gaveta, a mesa, a entrada) e organize hoje. Separe algo que não usa para doar. Depois, sente 5 minutos em silêncio com Jesus.",
ora:"Senhor, acalma a minha agitação. Ensina-me a escolher a melhor parte e a simplificar a vida da nossa casa. Amém."},

{t:"A mesa da família",ref:"At 2,42-47",v:"Partiam o pão nas casas e tomavam o alimento com alegria e simplicidade de coração.",
exp:"São Lucas descreve a vida dos primeiros cristãos: eles perseveravam no ensino dos apóstolos, na comunhão, na fração do pão e nas orações. Repartiam o que tinham e se reuniam nas casas para comer juntos, com alegria e simplicidade.",
med:["A mesa é um pequeno altar da família. É ali que se conversa, se ri, se conta o dia, se reza. Muitas famílias perderam a mesa para a TV e o celular.","Não precisa ser um banquete: arroz e feijão com todos juntos alimentam mais do que qualquer prato sozinho no sofá."],
perg:"Com que frequência a minha família come junta à mesa? O que atrapalha?",
des:"Façam hoje uma refeição todos juntos à mesa, sem TV e sem celulares. Rezem antes e, durante a refeição, cada um conta a melhor parte do dia.",
ora:"Senhor, abençoa a nossa mesa e faz dela um lugar de encontro, alegria e simplicidade de coração. Amém."},

{t:"Santificar o domingo",ref:"Ex 20,8-11",v:"Lembra-te do dia de sábado, para santificá-lo.",
exp:"Nos Dez Mandamentos, Deus pede ao povo que guarde um dia por semana para Ele: seis dias para trabalhar e um para descansar e lembrar que a vida é dom de Deus. Para os cristãos, esse dia é o domingo, o dia da Ressurreição de Jesus.",
med:["O domingo é presente de Deus para a família. Não é só dia de Missa: é dia de descansar, de estar juntos, de visitar quem se ama, de fazer algo diferente.","Quando o domingo vira só mais um dia de tarefas e telas, a família perde o seu respiro semanal."],
perg:"Como tem sido o domingo da minha família? Ele é diferente dos outros dias?",
des:"Planeje o próximo domingo: Missa em família e um momento especial juntos (um almoço, um passeio, um jogo). Escreva aqui o que vão fazer.",
ora:"Senhor, ensina-nos a santificar o domingo. Que ele seja dia de encontro contigo e de descanso em família. Amém."},

{t:"Cura das memórias",ref:"Ap 21,1-5",v:"Eis que faço novas todas as coisas.",
exp:"No final da Bíblia, São João tem uma visão: um novo céu, uma nova terra e a nova Jerusalém descendo do céu, bonita como uma noiva. Uma voz diz que Deus vai morar com o seu povo, enxugar toda lágrima, e que não haverá mais morte nem dor. E Deus diz: “Eis que faço novas todas as coisas”.",
med:["Algumas feridas da família são antigas: histórias de abandono, violência, vícios, brigas que atravessaram gerações. Elas se repetem sem percebermos.","Deus quer curar a história da sua família e fazer dela algo novo. Você pode ser a pessoa em quem a ferida para e a cura começa."],
perg:"Que ferida antiga da minha família eu não quero passar adiante para os meus filhos?",
des:"Escreva o nome dos seus pais, avós e antepassados e reze por eles, pedindo a Deus que cure as feridas da história da família. Se possível, peça para celebrar uma Missa por eles.",
ora:"Senhor, Tu fazes novas todas as coisas. Cura as feridas da minha família e faz começar em nós uma história nova. Amém."},

{t:"Abençoar a casa",ref:"Nm 6,22-27",v:"O Senhor te abençoe e te guarde! O Senhor faça brilhar sobre ti a sua face e te seja favorável!",
exp:"Deus ensina a Moisés uma bênção para os sacerdotes darem ao povo: que o Senhor abençoe, guarde, faça brilhar a sua face, tenha piedade e dê a paz. E promete: “Assim invocarão o meu nome e eu os abençoarei”.",
med:["Abençoar é desejar o bem em nome de Deus. Pais e mães podem e devem abençoar os filhos e a casa: é um gesto antigo e muito bonito da fé.","Uma casa abençoada não fica livre de problemas, mas fica envolvida pela proteção e pelo olhar de Deus."],
perg:"Eu costumo abençoar a minha família? Que bênção a minha casa mais precisa hoje?",
des:"Hoje, abençoe cada pessoa da casa com a bênção de Números, fazendo o sinal da cruz na testa. Se possível, peça a um padre que venha abençoar a casa, ou use água benta nos cômodos rezando.",
ora:"O Senhor nos abençoe e nos guarde. O Senhor faça brilhar sobre nós a sua face e nos dê a paz. Amém."},

{t:"Portas abertas",ref:"Gn 18,1-10",v:"Meu senhor, se encontrei graça aos teus olhos, não passes adiante sem parar em casa do teu servo.",
exp:"No calor do meio-dia, Abraão vê três homens perto da sua tenda. Corre ao encontro deles, oferece água para lavar os pés, descanso e uma refeição preparada com carinho por Sara. Os visitantes eram mensageiros de Deus e anunciam que Sara, já idosa, vai ter um filho.",
med:["Uma casa restaurada se abre para os outros. A Carta aos Hebreus lembra: “Não vos esqueçais da hospitalidade; por ela alguns, sem saber, hospedaram anjos” (Hb 13,2).","Receber bem não exige casa grande nem comida cara. Exige coração aberto: um café, uma conversa, um lugar à mesa."],
perg:"Minha casa tem sido um lugar onde as pessoas se sentem bem recebidas?",
des:"Convide alguém para um café ou uma refeição nesta semana: uma vizinha, uma pessoa sozinha, um casal amigo. Prepare com o carinho de Abraão e Sara.",
ora:"Senhor, que a nossa casa tenha portas abertas e coração acolhedor. Que, ao receber os outros, eu receba a Ti. Amém."},

{t:"Força para o cansaço",ref:"1Rs 19,3-8",v:"Levanta-te e come, pois ainda tens um longo caminho a percorrer.",
exp:"O profeta Elias foge para o deserto, perseguido e esgotado. Senta-se debaixo de uma árvore e pede para morrer: “Basta, Senhor!”. Dorme. Um anjo o toca, oferece pão e água e diz: “Levanta-te e come”. Duas vezes. Com a força daquela comida, Elias caminha quarenta dias até o monte de Deus.",
med:["Restaurar uma casa cansa. Muitas mães chegam ao “Basta, Senhor!” de Elias. Deus não brigou com ele: deixou-o dormir, deu comida e só depois pediu para continuar.","Às vezes a coisa mais espiritual a fazer é descansar, comer bem e aceitar ajuda. E alimentar-se do Pão da Eucaristia, que dá força para o caminho."],
perg:"Do que o meu corpo e a minha alma estão precisando hoje para continuar?",
des:"Hoje, cuide de você: durma mais cedo, faça uma refeição com calma, peça ajuda em uma tarefa. Se puder, vá a uma Missa durante a semana para receber o Pão do caminho.",
ora:"Senhor, Tu conheces o meu cansaço. Toca-me como tocaste Elias, alimenta-me e dá-me força para o caminho. Amém."},

{t:"Ponte entre os que brigam",ref:"Gn 13,5-12",v:"Não haja discórdia entre mim e ti, nem entre os meus pastores e os teus, pois somos irmãos.",
exp:"Abraão e seu sobrinho Ló tinham tantos rebanhos que a terra não dava para os dois, e os pastores começaram a brigar. Abraão, o mais velho, poderia ter imposto a sua vontade. Mas propõe a paz e deixa Ló escolher primeiro a terra que quisesse.",
med:["Jesus disse: “Felizes os que promovem a paz” (Mt 5,9). Muitas vezes a mãe é a ponte entre o marido e os filhos, entre os irmãos, entre as famílias. É uma missão bonita e cansativa.","Abraão nos ensina que, para haver paz, às vezes alguém precisa ceder primeiro. Ceder não é perder: é escolher a paz."],
perg:"Entre quem, na minha casa, eu preciso ser ponte de paz? Onde eu posso ceder?",
des:"Se há uma briga pendente entre pessoas da casa, ajude-as a conversar hoje, com calma, cada uma ouvindo a outra. Se o conflito for seu, ceda em algo pequeno por amor à paz.",
ora:"Senhor, faz de mim instrumento da tua paz. Onde houver discórdia, que eu leve a união. Amém."},

{t:"Deus cuida das necessidades",ref:"2Rs 4,1-7",v:"Vai, vende o azeite e paga a tua dívida; e tu e teus filhos vivereis com o resto.",
exp:"Uma viúva, cheia de dívidas, corre o risco de perder os filhos como escravos. Ela procura o profeta Eliseu, que pergunta o que ela tem em casa. Só uma botija de azeite. Eliseu manda pedir vasilhas emprestadas aos vizinhos e encher todas com aquele pouco azeite. O azeite só para quando acabam as vasilhas.",
med:["Dinheiro curto pesa muito numa casa: gera brigas, medo e vergonha. Deus não é indiferente a isso. Ele perguntou à viúva: “O que tens em casa?”. Começou pelo pouco que ela tinha.","Restaurar as finanças da casa pede fé e também atitudes: organizar, conversar, cortar o que sobra, buscar ajuda. Deus multiplica o pouco entregue a Ele."],
perg:"Qual é a situação financeira que mais preocupa a minha casa? O que eu tenho “em casa” para entregar a Deus?",
des:"Faça hoje uma lista simples de gastos da casa e veja onde dá para economizar. Reze sobre as contas, colocando-as diante de Deus. Partilhe algo, por menor que seja, com quem tem menos.",
ora:"Senhor, Tu multiplicaste o azeite da viúva. Olha para as necessidades da nossa casa e dá-nos sabedoria e provisão. Amém."},

{t:"A armadura de Deus",ref:"Ef 6,10-18",v:"Revesti-vos da armadura de Deus, para poderdes resistir às ciladas do demônio.",
exp:"São Paulo lembra que a nossa luta não é contra pessoas, mas contra o mal. Por isso, pede que os cristãos vistam a armadura de Deus: o cinto da verdade, a couraça da justiça, os calçados da paz, o escudo da fé, o capacete da salvação e a espada do Espírito, que é a Palavra de Deus. E rezar em todo tempo.",
med:["A família é muito amada por Deus, e por isso também é atacada: divisões, vícios, desânimo, mentiras. Muitas brigas em casa têm uma raiz espiritual.","Lembre que o marido, os filhos ou os sogros não são o inimigo. O inimigo é o mal que quer dividir. E contra ele, a oração é a arma da família."],
perg:"Que divisão ou ataque a minha casa tem sofrido? Eu tenho lutado contra as pessoas ou contra o mal?",
des:"Reze hoje a oração a São Miguel Arcanjo por toda a família. Leia Ef 6,10-18 e escolha uma “peça da armadura” para vestir nesta semana (por exemplo: a verdade, a paz, a fé).",
ora:"São Miguel Arcanjo, defendei a nossa família no combate. Senhor, reveste-nos com a tua armadura e protege a nossa casa de todo mal. Amém."},

{t:"A alegria do Senhor é a nossa força",ref:"Ne 8,8-12",v:"Não fiqueis tristes, porque a alegria do Senhor é a vossa força.",
exp:"Depois do exílio, o povo reconstrói Jerusalém. O sacerdote Esdras lê a Lei de Deus para todos, e o povo chora ao ouvir. Neemias diz: “Hoje é dia consagrado ao Senhor; não fiqueis tristes. Ide, comei, bebei e reparti com quem não tem nada”. E o povo celebra com grande alegria.",
med:["Uma casa restaurada também ri. A alegria é sinal de que Deus está presente e é força para enfrentar os dias difíceis.","Às vezes ficamos tão focadas nos problemas que esquecemos de celebrar. Celebrar o pequeno também é fé."],
perg:"Quando foi a última vez que a minha família celebrou algo junto? O que podemos celebrar hoje?",
des:"Façam hoje algo alegre juntos: uma sobremesa especial, uma música para dançar na sala, um jogo, um piquenique na varanda. Celebrem uma pequena vitória da família.",
ora:"Senhor, enche a nossa casa da tua alegria. Que ela seja a nossa força nos dias bons e nos difíceis. Amém."},

{t:"O valor dos pequenos gestos",ref:"Mc 12,41-44",v:"Esta viúva pobre deu mais do que todos os outros.",
exp:"Jesus observa as pessoas depositando ofertas no Templo. Muitos ricos depositam muito. Chega uma viúva pobre e coloca duas moedinhas. Jesus chama os discípulos e diz que ela deu mais do que todos, porque deu tudo o que tinha para viver.",
med:["Deus não mede o tamanho do gesto, mas o amor que há nele. A restauração de uma casa é feita de pequenos gestos: um bilhete, um café levado na cama, uma louça lavada sem reclamar.","Você talvez sinta que tem pouco para dar. Mas, como a viúva, o pouco dado com amor vale mais do que muito dado por obrigação."],
perg:"Que pequeno gesto de amor eu posso oferecer hoje a cada pessoa da minha casa?",
des:"Faça hoje um pequeno gesto de amor para cada pessoa da casa (um bilhete, um abraço, um prato preferido, um elogio). Anote como cada um reagiu.",
ora:"Senhor, que eu não despreze os pequenos gestos. Recebe as minhas duas moedinhas de amor e multiplica-as na minha casa. Amém."},

{t:"Maria na nossa casa",ref:"Lc 1,39-45.56",v:"Maria ficou com Isabel uns três meses e depois voltou para a sua casa.",
exp:"Logo depois do anúncio do anjo, Maria vai às pressas para a casa de Isabel, que está grávida e já idosa. Quando chega, João pula de alegria no ventre de Isabel. Maria fica três meses ali, ajudando a prima, até o nascimento de João.",
med:["Maria levou Jesus para a casa de Isabel e ficou ali servindo. Onde Maria entra, Jesus chega e a alegria acontece.","Convidar Maria para a sua casa é pedir que ela cuide da família com o seu jeito de mãe: atenta, discreta, prestativa e cheia de fé."],
perg:"Que cantinho da minha casa e da minha rotina eu posso dedicar a Nossa Senhora?",
des:"Monte ou arrume um pequeno oratório em casa com uma imagem de Maria, uma vela e uma flor. Rezem ali juntos uma dezena do terço.",
ora:"Maria, entra na nossa casa como entraste na casa de Isabel. Traz Jesus, traz a alegria e cuida da nossa família. Amém."},

{t:"Eu e minha casa serviremos ao Senhor",ref:"Js 24,14-18",v:"Eu e minha casa serviremos ao Senhor.",
exp:"No fim da vida, Josué reúne o povo de Israel e conta tudo o que Deus fez por eles. Depois os coloca diante de uma escolha: a quem vão servir? E ele mesmo responde primeiro: “Quanto a mim e à minha casa, serviremos ao Senhor”. O povo responde que também vai servir ao Senhor.",
med:["Depois de 21 dias, é hora de olhar para o caminho percorrido e fazer uma escolha, como Josué. Talvez nem tudo tenha mudado, mas você plantou muitas sementes.","Josué não esperou todos concordarem para escolher. Ele decidiu por si e pela casa que liderava. Você também pode decidir hoje que a sua casa pertence ao Senhor."],
perg:"O que mudou na minha casa e em mim nestes 21 dias? Que escolha eu quero fazer agora?",
des:"Escreva a frase “Eu e minha casa serviremos ao Senhor” num papel bonito e coloque na porta de entrada ou num lugar visível. Reúnam-se para uma oração de consagração da família.",
ora:"Senhor, eu e minha casa serviremos a Ti. Obrigada por estes 21 dias. Continua a restaurar e abençoar o nosso lar. Amém."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="lar21"){PLANOS[i].d=D;PLANOS[i].resumo="Para quando a casa anda pesada: 21 dias trazendo de volta a paz, o perdão, a oração e a alegria. Cada dia traz uma leitura explicada, uma meditação, um espaço para escrever e um desafio para viver em casa.";}}
})();

// 14 dias para ser uma mãe mais paciente: versão completa
(function(){
var D=[
{t:"Paciência é fruto do Espírito",ref:"Gl 5,22-25",v:"O fruto do Espírito é amor, alegria, paz, paciência, bondade, benignidade, fidelidade, mansidão, domínio de si.",
exp:"São Paulo lista os frutos que o Espírito Santo produz em quem vive unido a Deus. Ele não fala em “frutos” separados, mas em um só fruto com muitos sabores. A paciência e o domínio de si aparecem na lista: não são conquistas só do esforço, mas presentes que crescem em nós.",
med:["Muitas mães se culpam: “Eu deveria ter mais paciência”. E tentam no grito de força de vontade, até explodirem de novo. A boa notícia é que a paciência não depende só de você.","Fruto se cultiva: com oração, descanso e tempo. Nestes 14 dias, você vai pedir ao Espírito Santo, todos os dias, o fruto da paciência, e vai dar pequenos passos para ele crescer."],
perg:"Em que momentos do dia a minha paciência costuma acabar? O que acontece antes?",
des:"Escreva num papel ou no celular: “Espírito Santo, me dá o teu fruto”. Cole num lugar onde você vê várias vezes por dia (geladeira, espelho, tela do celular) e reze sempre que olhar.",
ora:"Espírito Santo, faz crescer em mim o fruto da paciência. Eu não consigo sozinha; age em mim. Amém."},

{t:"Deus é paciente comigo",ref:"Lc 13,6-9",v:"Senhor, deixa a figueira ainda este ano. Vou cavar em volta e colocar adubo.",
exp:"Jesus conta a parábola de um homem que tinha uma figueira que não dava frutos havia três anos. Ele manda cortá-la. Mas o agricultor pede mais um ano: vai cavar ao redor, adubar e esperar. Talvez ela dê fruto.",
med:["Deus é assim comigo: o agricultor paciente que não desiste, que pede mais um ano, que aduba e espera. Quantas vezes Ele já esperou por mim?","Quando lembramos da paciência que Deus tem conosco, fica mais fácil ter paciência com os nossos filhos, que ainda estão crescendo e aprendendo."],
perg:"Em que área da minha vida Deus tem sido muito paciente comigo?",
des:"Hoje, quando um filho repetir um erro, lembre-se: “Deus é paciente comigo”. Em vez de dar bronca, explique de novo com calma, como o agricultor que aduba a figueira.",
ora:"Senhor, obrigada pela paciência que tens comigo. Ensina-me a ser com os meus filhos o agricultor que espera e cuida. Amém."},

{t:"Respirar antes de responder",ref:"Pr 15,1.18; 16,32",v:"Mais vale o homem paciente do que o herói; quem domina a si mesmo vale mais do que quem conquista uma cidade.",
exp:"O livro dos Provérbios reúne conselhos práticos para a vida. Ele ensina que a resposta branda acalma a raiva, enquanto a palavra dura aumenta a briga. E diz que dominar a si mesmo é uma vitória maior do que conquistar uma cidade.",
med:["Entre o que o filho faz e o que nós respondemos existe um pequeno espaço. Nele mora a nossa liberdade. Quando reagimos no impulso, esse espaço desaparece.","Respirar fundo três vezes antes de responder parece pouco, mas cria o espaço para escolher a resposta. É um pequeno gesto de domínio de si, maior do que conquistar uma cidade."],
perg:"Como eu costumo reagir no primeiro segundo de um conflito com os meus filhos?",
des:"Treine hoje a “regra das 3 respirações”: diante de uma situação que te irrita, respire fundo três vezes antes de dizer qualquer coisa. À noite, anote quantas vezes conseguiu.",
ora:"Senhor, dá-me o domínio de mim mesma. Que entre o que sinto e o que faço haja espaço para o teu Espírito agir. Amém."},

{t:"Cada fase tem o seu tempo",ref:"Mc 4,26-29",v:"A semente germina e cresce, sem que ele saiba como.",
exp:"Jesus compara o Reino de Deus a um homem que lança a semente na terra. Ele dorme e acorda, noite e dia, e a semente vai crescendo sozinha: primeiro o talo, depois a espiga, depois o grão cheio. Quando o fruto está maduro, chega a colheita.",
med:["Os filhos crescem em fases, como a semente: primeiro o talo, depois a espiga, só depois o grão. Muitas vezes cobramos deles o grão maduro quando ainda estão na fase do talo.","Uma criança de dois anos faz birra, uma de cinco desobedece para testar limites, um adolescente se fecha. Cada fase tem o seu tempo. Conhecer a fase ajuda a ter paciência."],
perg:"Estou exigindo dos meus filhos algo que ainda não é próprio da idade deles?",
des:"Pesquise ou relembre o que é esperado para a idade de cada filho. Escolha uma atitude deles que te irrita e que é típica da fase, e decida olhar para ela com mais compreensão hoje.",
ora:"Senhor, Tu fazes a semente crescer no tempo certo. Dá-me paciência com cada fase dos meus filhos. Amém."},

{t:"Mãe cansada",ref:"Mt 11,28-30",v:"Vinde a mim, todos vós que estais cansados e fatigados, e eu vos darei descanso.",
exp:"Jesus faz um convite a quem está carregando pesos demais: venham a mim. Ele oferece o seu jugo, que é suave, e o seu fardo, que é leve. E se apresenta como manso e humilde de coração, alguém com quem a alma encontra descanso.",
med:["Muita impaciência é cansaço acumulado: noites mal dormidas, trabalho, casa, filhos, tudo ao mesmo tempo. Uma mãe esgotada perde a paciência mais rápido, não por falta de amor.","Jesus não pede que você dê conta de tudo. Ele convida: “Vem descansar”. Cuidar de si não é egoísmo; é condição para cuidar bem dos outros."],
perg:"Quanto do meu cansaço vira impaciência com os meus filhos? Do que eu preciso para descansar?",
des:"Hoje, peça ajuda em uma tarefa (ao marido, a um filho mais velho, a alguém da família) e use esse tempo para descansar 15 minutos de verdade, sem culpa.",
ora:"Jesus, eu estou cansada. Venho até Ti. Dá-me o teu descanso e ensina-me a pedir ajuda. Amém."},

{t:"A voz suave de Deus",ref:"1Rs 19,9-13",v:"Depois do fogo, ouviu-se o murmúrio de uma brisa suave.",
exp:"O profeta Elias está numa caverna, no monte de Deus. Passa um vento fortíssimo, mas Deus não estava no vento. Depois um terremoto, e Deus não estava no terremoto. Depois um fogo, e Deus não estava no fogo. Por fim, uma brisa suave. Elias cobre o rosto: era ali que Deus estava.",
med:["Deus escolheu falar com Elias numa brisa suave, não num grito. O jeito de Deus é manso.","Com os filhos, a voz alta pode até assustar por um momento, mas não alcança o coração. Falar baixo, perto, olhando nos olhos, funciona muito melhor do que gritar do outro lado da casa."],
perg:"Como é o meu tom de voz com os meus filhos? Eles me ouvem mais quando eu grito ou quando chego perto?",
des:"Hoje, sempre que precisar chamar ou corrigir um filho, vá até ele, abaixe-se na altura dos olhos e fale baixo. Observe a diferença na reação.",
ora:"Senhor, que a minha voz seja como a tua brisa suave. Tira de mim o grito e dá-me a mansidão que alcança o coração. Amém."},

{t:"Pedir perdão aos filhos",ref:"1Jo 1,5-10",v:"Se confessarmos os nossos pecados, Deus é fiel e justo para nos perdoar.",
exp:"São João diz que Deus é luz e que quem anda na luz está em comunhão com Ele. Se dissermos que não temos pecado, enganamos a nós mesmos. Mas se reconhecermos os nossos pecados, Deus nos perdoa e nos purifica.",
med:["Quando a mãe pede perdão, ensina aos filhos a humildade, a reparar o erro e a reconhecer que todos falhamos. Isso não tira a autoridade; aumenta o respeito.","Depois de uma explosão, muitas mães sentem culpa e ficam em silêncio. Mas a culpa sem perdão só pesa. Pedir perdão e recomeçar é muito mais saudável para todos."],
perg:"Já pedi perdão aos meus filhos alguma vez? Há algo pelo qual eu deveria pedir hoje?",
des:"Se você perdeu a paciência com algum filho recentemente, peça perdão hoje com palavras simples: “A mamãe errou quando gritou com você. Me desculpa?”. Depois, deem um abraço.",
ora:"Senhor, Tu me perdoas sempre. Dá-me humildade para pedir perdão aos meus filhos e para ensiná-los a perdoar. Amém."},

{t:"Corrigir com amor",ref:"Hb 12,5-11",v:"O Senhor corrige a quem ama.",
exp:"A Carta aos Hebreus lembra que Deus nos corrige como um pai corrige os filhos. Toda correção, no momento, parece motivo de tristeza, mas depois produz frutos de paz e de justiça em quem foi educado por ela.",
med:["Corrigir é necessário: filhos sem limites ficam inseguros. Mas a correção que educa é a que vem do amor, não da raiva.","Corrigir com amor é separar o filho do comportamento: “Eu te amo, e o que você fez não está certo”. É explicar o porquê, ter consequências justas e, depois, abraçar."],
perg:"Quando eu corrijo os meus filhos, eles sentem que estão sendo amados ou rejeitados?",
des:"Na próxima correção, use a frase: “Eu te amo, e por isso não posso deixar você fazer isso”. Depois da consequência, reaproxime-se com carinho.",
ora:"Senhor, ensina-me a corrigir como Tu me corriges: com firmeza, justiça e muito amor. Amém."},

{t:"Uma rotina que ajuda",ref:"Mc 1,32-39",v:"De madrugada, quando ainda estava escuro, Jesus se levantou e foi rezar num lugar deserto.",
exp:"Depois de um dia cheio, em que curou muitos doentes até tarde da noite, Jesus se levanta de madrugada e vai rezar sozinho. Quando os discípulos o encontram dizendo que todos o procuram, Ele já sabe para onde ir: para outras aldeias anunciar o Evangelho.",
med:["Muitas brigas com os filhos acontecem nos mesmos horários: ao acordar, na saída para a escola, na hora do banho, antes de dormir. Uma rotina organizada evita muitos conflitos.","Jesus também tinha uma rotina, e no centro dela estava a oração. Um momento com Deus antes de a casa acordar muda o tom do dia inteiro."],
perg:"Em que horário do dia acontecem mais conflitos na minha casa? O que poderia ser organizado?",
des:"Escolha o horário mais difícil do dia e planeje-o melhor: deixe as coisas prontas na noite anterior, avise as crianças com antecedência, simplifique. Tente acordar 10 minutos antes para rezar.",
ora:"Senhor, ajuda-me a organizar a rotina da minha casa e coloca-Te no centro dela. Amém."},

{t:"Cada filho é único",ref:"Sl 139(138),13-16",v:"Eu te louvo porque me fizeste de modo tão maravilhoso.",
exp:"O salmista contempla a obra de Deus em si mesmo: Deus o formou no ventre da mãe, conheceu cada parte do seu ser, viu os seus dias antes de existirem. E louva: “Tu me fizeste de modo maravilhoso”.",
med:["Cada filho foi tecido por Deus de forma única: com o seu ritmo, temperamento, dons e dificuldades. Comparar irmãos (ou com os filhos dos outros) gera impaciência na mãe e feridas nos filhos.","Quando olhamos para cada filho como obra maravilhosa de Deus, a paciência cresce. Ele não precisa ser como o irmão; precisa ser quem Deus fez."],
perg:"Eu costumo comparar os meus filhos entre si ou com outras crianças?",
des:"Hoje, diga a cada filho algo que torna ele único e especial aos seus olhos. Evite qualquer comparação durante o dia.",
ora:"Senhor, obrigada por cada filho, obra maravilhosa das tuas mãos. Ensina-me a amar cada um do jeito que Tu o fizeste. Amém."},

{t:"Esperar os frutos",ref:"Tg 5,7-11",v:"Vede o agricultor: ele espera com paciência o fruto precioso da terra.",
exp:"São Tiago pede aos cristãos que sejam pacientes até a vinda do Senhor, como o agricultor que espera as chuvas. Pede também que não se queixem uns dos outros. E lembra Jó, que perseverou, e o Senhor, que é cheio de misericórdia.",
med:["Educar é plantar hoje para colher daqui a muitos anos. Muitas vezes não vemos os frutos e achamos que nada do que fazemos adianta.","O agricultor não arranca a planta para ver se a raiz está crescendo. Ele confia. Continue plantando: cada oração, cada conversa, cada limite dado com amor está crescendo, mesmo sem você ver."],
perg:"Que fruto eu estou ansiosa para ver nos meus filhos? Consigo confiar no tempo de Deus?",
des:"Escreva uma lista de “sementes” que você está plantando nos seus filhos (fé, respeito, generosidade...). Reze entregando essas sementes a Deus.",
ora:"Senhor, ensina-me a esperar como o agricultor. Que eu continue plantando com amor e deixe contigo o tempo da colheita. Amém."},

{t:"O que está por trás do comportamento",ref:"Mt 18,1-5.10",v:"Cuidado para não desprezar nenhum destes pequeninos.",
exp:"Os discípulos perguntam quem é o maior no Reino. Jesus chama uma criança, coloca no meio deles e diz que, se não se tornarem como crianças, não entrarão no Reino. E alerta: não desprezem nenhum desses pequenos, porque os seus anjos veem sempre a face do Pai.",
med:["Por trás de um comportamento difícil quase sempre há uma necessidade: fome, sono, ciúme, medo, vontade de atenção. A birra é a linguagem de quem ainda não sabe dizer o que sente.","Jesus colocou a criança no centro. Escutar o coração do filho antes de reagir ao comportamento é tratar com seriedade quem Deus tanto valoriza."],
perg:"Qual comportamento difícil de um filho meu pode estar escondendo uma necessidade?",
des:"Hoje, diante de um comportamento difícil, pergunte antes de corrigir: “O que está acontecendo com você?”. Ouça. Depois, conversem sobre o que fazer.",
ora:"Jesus, que colocaste a criança no centro, ensina-me a escutar o coração dos meus filhos por trás de cada atitude. Amém."},

{t:"Um espírito manso e tranquilo",ref:"1Pd 3,3-4",v:"Que o vosso enfeite seja o interior do coração, com a beleza incorruptível de um espírito manso e tranquilo, que é precioso diante de Deus.",
exp:"São Pedro escreve às mulheres cristãs e diz que a verdadeira beleza não está nos penteados, joias ou roupas, mas no coração. Um espírito manso e tranquilo é uma beleza que não passa e que tem grande valor aos olhos de Deus.",
med:["Mansidão não é fraqueza nem passividade. É força sob controle: a capacidade de ser firme sem ser dura. Jesus disse: “Aprendei de mim, que sou manso e humilde de coração” (Mt 11,29).","Um espírito tranquilo não é uma mãe que nunca sente raiva, mas uma mãe que aprendeu a voltar à paz mais rápido. E isso é precioso diante de Deus."],
perg:"O que tira a tranquilidade do meu espírito? O que me ajuda a voltar à paz?",
des:"Escolha uma “âncora de paz” para usar quando se sentir alterada: uma oração curta, um copo de água, sair do ambiente por um minuto. Use-a hoje sempre que precisar.",
ora:"Jesus, manso e humilde de coração, faz o meu coração semelhante ao teu. Dá-me um espírito manso e tranquilo. Amém."},

{t:"Recomeçar todo dia",ref:"Lm 3,19-26",v:"As misericórdias do Senhor não se esgotaram; elas se renovam a cada manhã.",
exp:"O livro das Lamentações nasce da dor de Jerusalém destruída. No meio do lamento, o autor se lembra de algo que devolve a esperança: o amor de Deus não acaba, a sua misericórdia se renova todas as manhãs. É bom esperar em silêncio a salvação do Senhor.",
med:["Você não precisa ser uma mãe perfeita. Vai errar de novo, perder a paciência de novo. Mas cada manhã é uma chance nova, porque a misericórdia de Deus também é nova.","Depois destes 14 dias, olhe com carinho para o caminho. Mesmo que tenha tropeçado, você cresceu. A paciência é uma estrada, não uma linha de chegada."],
perg:"O que mudou em mim nestes 14 dias? Que passo eu quero continuar dando?",
des:"Escreva uma carta para você mesma, com carinho, como uma amiga escreveria: reconhecendo o seu esforço, perdoando os seus erros e lembrando que amanhã é um novo dia. Leia quando estiver desanimada.",
ora:"Senhor, obrigada porque a tua misericórdia se renova a cada manhã. Dá-me a graça de recomeçar todos os dias com paciência e amor. Amém."}
];
for(var i=0;i<PLANOS.length;i++){if(PLANOS[i].id==="paciencia14"){PLANOS[i].d=D;PLANOS[i].resumo="Duas semanas de pequenos passos para trocar o grito pela calma, com a ajuda da graça de Deus. Cada dia traz uma leitura explicada, uma meditação, um espaço para escrever e um desafio prático com os filhos.";}}
})();

// 30 dias de fé para a tentante: versão completa
(function(){
var D=[
{t:"Derramar a alma diante de Deus",ref:"1Sm 1,9-18",v:"Estou derramando a minha alma diante do Senhor.",
exp:"Ana não conseguia ter filhos. No santuário de Silo, ela reza em silêncio, só mexendo os lábios, com muitas lágrimas. O sacerdote Eli acha que ela está bêbada. Ana explica: “Estou derramando a minha alma diante do Senhor”. Eli a abençoa e ela volta para casa com o rosto em paz.",
med:["O desejo de ser mãe é bom e vem de Deus. Você não precisa escondê-lo, nem fingir que está tudo bem. Ana não fingiu: derramou a alma inteira.","O mais bonito é o final: antes de qualquer resposta, Ana já sai com o rosto em paz. A paz veio de entregar, não de receber. Nestes 30 dias, você vai aprender a entregar esse sonho a Deus, dia após dia."],
perg:"Se eu derramasse a minha alma diante de Deus hoje, o que eu diria a Ele?",
des:"Escreva uma carta sincera para Deus contando tudo o que você sente sobre o desejo de ser mãe: o sonho, o medo, a dor, a esperança. Guarde dentro da sua Bíblia.",
ora:"Senhor, eu derramo diante de Ti o meu coração. Tu conheces o meu desejo. Dá-me a tua paz enquanto espero. Amém."},

{t:"Deus me conhece por dentro",ref:"Sl 139(138),1-12",v:"Senhor, tu me sondas e me conheces.",
exp:"O salmista reconhece que Deus o conhece completamente: quando se senta e quando se levanta, os seus pensamentos, as suas palavras antes de serem ditas. Não há lugar onde possa ir sem que Deus esteja: nem no céu, nem no abismo, nem na escuridão, que para Deus é clara como o dia.",
med:["Deus conhece cada pensamento seu, cada lágrima escondida no banheiro, cada teste negativo que ninguém viu. Nada do que você vive passa despercebido por Ele.","Às vezes a espera faz a gente se sentir sozinha e incompreendida. O salmo lembra: não existe escuridão onde Deus não esteja com você."],
perg:"Que parte da minha espera eu sinto que ninguém entende? Eu já contei isso a Deus?",
des:"Leia o Salmo 139 inteiro devagar e sublinhe (ou anote) o versículo que mais tocou o seu coração. Repita-o durante o dia.",
ora:"Senhor, Tu me conheces por dentro. Obrigada porque não estou sozinha nem na escuridão. Amém."},

{t:"Quando a espera dói",ref:"1Sm 1,1-8",v:"Ana, por que choras? Por que não comes? Por que está triste o teu coração?",
exp:"Ana era muito amada pelo marido, Elcana, mas sofria por não ter filhos. Todo ano, quando iam ao santuário, a outra esposa de Elcana a provocava. Ana chorava e não comia. Elcana tenta consolá-la: “Não sou eu para ti melhor do que dez filhos?”.",
med:["A dor da tentante muitas vezes é aumentada por comentários: “E aí, quando vem o bebê?”, “Relaxa que vem”. Como Ana, você pode se sentir ferida até em lugares que deveriam ser de alegria.","Elcana amava Ana, mas não conseguia entender totalmente a dor dela. Nem sempre as pessoas vão entender. Deus entende. E você tem o direito de se proteger de comentários que ferem."],
perg:"Que comentários ou situações têm aumentado a minha dor? Como posso me proteger com amor?",
des:"Pense numa frase simples e gentil para responder a perguntas invasivas (por exemplo: “Estamos entregando nas mãos de Deus”). Reze pelas pessoas que, sem querer, te ferem.",
ora:"Senhor, Tu vês as minhas lágrimas como viste as de Ana. Protege o meu coração das palavras que ferem e dá-me paz. Amém."},

{t:"Para Deus nada é difícil demais",ref:"Gn 18,9-15",v:"Haverá alguma coisa difícil demais para o Senhor?",
exp:"Três visitantes chegam à tenda de Abraão e anunciam que Sara, já idosa, vai ter um filho no ano seguinte. Sara, escondida atrás da porta, ri por dentro: achava impossível. Deus pergunta: “Por que Sara riu? Haverá alguma coisa difícil demais para o Senhor?”. Um ano depois, nasce Isaac, que significa “riso”.",
med:["Sara riu porque achou impossível. Talvez você também já tenha rido assim, de cansaço ou de descrença. Deus não brigou com Sara; apenas lembrou quem Ele é.","A pergunta de Deus não é uma promessa de que tudo vai acontecer do jeito que queremos, mas um convite a não colocar limites no que Ele pode fazer."],
perg:"Onde eu tenho colocado limites no que Deus pode fazer na minha vida?",
des:"Escreva a frase “Haverá alguma coisa difícil demais para o Senhor?” e coloque onde você veja todos os dias, principalmente nos dias de desânimo.",
ora:"Senhor, para Ti nada é impossível. Tira de mim a descrença e ensina-me a confiar no teu poder e no teu amor. Amém."},

{t:"Deus se lembrou de Raquel",ref:"Gn 30,22-24",v:"Deus lembrou-se de Raquel; Deus a ouviu e a tornou fecunda.",
exp:"Raquel, a esposa muito amada de Jacó, não tinha filhos, enquanto a irmã Lia tinha vários. Ela sofreu anos com isso. Um dia, a Bíblia diz simplesmente: “Deus lembrou-se de Raquel”. Ela dá à luz José, que se tornaria um grande homem de Deus.",
med:["Às vezes parece que Deus esqueceu de nós, enquanto todos ao redor recebem o que pedimos. Raquel também sentiu isso.","Mas na Bíblia, quando Deus “se lembra”, não é porque tinha esquecido: é porque chegou o tempo de agir. Você não está esquecida. Deus guarda o seu nome."],
perg:"Em que momentos eu me sinto esquecida por Deus?",
des:"Escreva o seu nome num papel e, embaixo, a frase: “Deus não se esquece de mim”. Reze hoje com essas palavras, entregando a Ele as suas comparações.",
ora:"Senhor, lembra-te de mim. Mesmo quando eu me sinto esquecida, sei que o meu nome está guardado no teu coração. Amém."},

{t:"A tua oração foi ouvida",ref:"Lc 1,8-17",v:"Não tenhas medo, Zacarias, porque a tua oração foi ouvida. Isabel, tua esposa, te dará um filho.",
exp:"Zacarias era sacerdote e, com Isabel, rezava havia muitos anos por um filho. Já eram idosos. Enquanto ele oferece incenso no Templo, o anjo Gabriel aparece e diz que a oração deles foi ouvida. Isabel vai ter um filho, João, que preparará o caminho do Senhor.",
med:["Isabel e Zacarias rezaram por muitos anos, talvez já sem esperança. Mas nenhuma daquelas orações se perdeu. Deus guardou cada uma.","Nenhuma oração sua cai no vazio. Deus ouve. A resposta pode vir de um jeito ou num tempo diferentes do que imaginamos, mas Ele ouve."],
perg:"Que oração eu tenho feito há muito tempo e às vezes acho que Deus não ouve?",
des:"Acenda uma vela (ou faça um gesto simbólico) e reze, junto com o seu esposo se possível, entregando de novo o pedido do filho a Deus.",
ora:"Senhor, sei que Tu ouves a minha oração. Guarda cada pedido meu e responde no teu tempo e do teu jeito. Amém."},

{t:"Santa Ana e São Joaquim",ref:"Rm 12,9-12",v:"Sede alegres na esperança, pacientes na tribulação, perseverantes na oração.",
exp:"A Bíblia não conta a história dos pais de Nossa Senhora, mas a tradição da Igreja guardou os nomes: Joaquim e Ana. Segundo um antigo relato cristão, eles também esperaram muitos anos por um filho, rezando com fé, até que Deus lhes deu Maria. São Paulo, na leitura de hoje, descreve exatamente essa atitude: alegria na esperança, paciência e oração.",
med:["Joaquim e Ana são padroeiros dos avós e muito invocados pelos casais que esperam filhos. Eles entendem a espera, porque a viveram.","Alegres na esperança, pacientes na tribulação, perseverantes na oração: não é uma lista de exigências, é um caminho. Peça aos dois que caminhem com vocês."],
perg:"Como está a minha esperança: alegre ou cansada? O que me ajudaria a perseverar?",
des:"Reze hoje, com o seu esposo se possível, pedindo a intercessão de São Joaquim e Santa Ana pelo desejo de vocês. Se puder, procure uma imagem deles.",
ora:"São Joaquim e Santa Ana, vós que esperastes com fé, intercedei por nós. Dai-nos alegria na esperança e perseverança na oração. Amém."},

{t:"Um ciclo de cada vez",ref:"Mt 6,31-34",v:"Não vos preocupeis com o dia de amanhã, pois o dia de amanhã terá as suas preocupações. A cada dia basta o seu cuidado.",
exp:"Jesus fala da ansiedade com as necessidades da vida. Ele lembra que o Pai sabe do que precisamos e pede que busquemos primeiro o Reino de Deus. E conclui: não se preocupem com o amanhã; cada dia já traz o seu peso.",
med:["A espera de cada mês pode virar ansiedade: contar dias, procurar sinais, imaginar, se decepcionar. A vida inteira fica pendurada no próximo resultado.","Jesus convida a viver um dia de cada vez. Hoje, só hoje. Não é desistir do sonho; é não deixar que ele roube a vida que está acontecendo agora."],
perg:"Quanto da minha vida eu tenho deixado em pausa esperando o próximo resultado?",
des:"Faça hoje algo que te dá alegria e que não tem nada a ver com a espera: um passeio, uma receita, um encontro com amigas. Viva este dia inteiro.",
ora:"Senhor, ensina-me a viver um dia de cada vez. Tira de mim a ansiedade e devolve-me a alegria do hoje. Amém."},

{t:"O tempo de Deus",ref:"Ecl 3,1-11",v:"Ele fez tudo belo a seu tempo, e colocou no coração do homem o desejo da eternidade.",
exp:"O sábio Coélet reflete que tudo na vida tem o seu tempo: nascer e morrer, plantar e colher, chorar e rir. E conclui que Deus faz tudo belo no tempo certo, mesmo que o ser humano não consiga entender toda a obra de Deus, do começo ao fim.",
med:["O tempo de Deus não é o nosso, e isso dói. Queremos entender por quê, quando, até quando. Mas o texto lembra que nós vemos só um pedaço da história.","Confiar no tempo de Deus não é cruzar os braços, mas descansar na certeza de que Ele faz tudo belo, mesmo quando ainda não conseguimos ver."],
perg:"O que mais me angustia no “tempo de Deus”?",
des:"Faça uma linha do tempo simples da sua vida e marque momentos em que Deus agiu no tempo certo, mesmo que você não tenha entendido na hora.",
ora:"Senhor, Tu fazes tudo belo a seu tempo. Ensina-me a confiar no teu relógio, mesmo quando ele parece lento. Amém."},

{t:"Quando o resultado não vem",ref:"Sl 34(33),2-9.18-19",v:"O Senhor está perto dos que têm o coração ferido.",
exp:"Davi escreve este salmo depois de escapar de um grande perigo. Ele convida todos a bendizer o Senhor e conta que buscou a Deus e foi ouvido. E afirma: o Senhor está perto dos corações feridos e salva os de espírito abatido.",
med:["Há dias em que a notícia chega e o coração despenca. Nesses dias, não precisa ser forte, nem ter palavras bonitas. Só precisa saber que Deus está perto.","Ele não está perto só dos que estão bem. Está especialmente perto de quem tem o coração partido. Deixe-se consolar."],
perg:"Como eu costumo reagir quando o resultado não vem? Eu me deixo consolar por Deus e pelo meu esposo?",
des:"Combine com o seu esposo um “ritual de consolo” para os dias difíceis: um abraço longo, uma oração juntos, um passeio. Escreva aqui como vai ser.",
ora:"Senhor, Tu estás perto dos corações feridos. Nos dias de tristeza, abraça-me e dá-me força para continuar. Amém."},

{t:"Chorar também é oração",ref:"Jo 11,32-36",v:"Jesus chorou.",
exp:"Lázaro, amigo de Jesus, morreu. Quando Jesus chega, Maria, irmã de Lázaro, cai aos seus pés chorando. Jesus fica profundamente comovido e pergunta onde o colocaram. E então Jesus chora. As pessoas comentam: “Vede como ele o amava!”.",
med:["É o versículo mais curto da Bíblia e um dos mais consoladores. Jesus, mesmo sabendo que ia ressuscitar Lázaro, chorou com quem chorava.","As lágrimas não são falta de fé: são o coração falando com Deus sem palavras. Jesus chora com você."],
perg:"Eu me permito chorar? Ou acho que chorar é sinal de pouca fé?",
des:"Hoje, se as lágrimas vierem, deixe-as vir diante de Deus, sem culpa. Depois, escreva aqui o que estava no seu coração.",
ora:"Jesus, que choraste com Maria e Marta, chora também comigo. Recebe as minhas lágrimas como oração. Amém."},

{t:"Juntos na espera",ref:"Tb 8,4-8",v:"Concede-nos misericórdia, a mim e a ela, e que juntos cheguemos à velhice.",
exp:"Na noite do casamento, Tobias e Sara se levantam e rezam juntos. Tobias bendiz a Deus, lembra a criação de Adão e Eva e pede a Deus misericórdia para os dois e que envelheçam juntos. E os dois dizem: “Amém, amém”.",
med:["A espera pode unir ou afastar o casal. Às vezes um sofre mais, o outro tenta resolver, e a intimidade vira só tentativa. É preciso cuidar do “nós” além do sonho.","Tobias e Sara começaram o casamento rezando juntos. O amor de vocês é a primeira família, e ele merece ser cuidado, com ou sem filhos."],
perg:"Como a espera tem afetado o meu casamento? O que preciso cuidar no “nós”?",
des:"Rezem juntos hoje a oração de Tobias e Sara (Tb 8,5-8). Planejem um momento a dois que não tenha nada a ver com a espera.",
ora:"Senhor, tem misericórdia de nós dois. Une-nos cada vez mais nesta espera e faz-nos envelhecer juntos no teu amor. Amém."},

{t:"Cuidar do corpo com carinho",ref:"1Cor 6,19-20",v:"O vosso corpo é templo do Espírito Santo, que está em vós. Glorificai, pois, a Deus no vosso corpo.",
exp:"São Paulo lembra aos cristãos de Corinto que o corpo não é algo sem importância: é templo do Espírito Santo. Fomos comprados por um alto preço, o sangue de Cristo. Por isso, o corpo também é lugar de glorificar a Deus.",
med:["O seu corpo não é um inimigo, nem um defeito. Ele é templo de Deus, mesmo quando não responde como você gostaria.","Cuidar do corpo com carinho (alimentação, sono, exercício, acompanhamento médico) é um ato de amor e de fé. Não por cobrança, mas por respeito ao templo que Deus te deu."],
perg:"Como eu tenho olhado para o meu corpo nesta espera: com carinho ou com raiva?",
des:"Faça hoje algo de cuidado com o seu corpo: uma caminhada, uma refeição nutritiva, dormir mais cedo, marcar uma consulta pendente. Agradeça a Deus pelo seu corpo.",
ora:"Senhor, obrigada pelo meu corpo, templo do teu Espírito. Ensina-me a cuidar dele com carinho e a não o ver como inimigo. Amém."},

{t:"Quando outra pessoa anuncia uma gravidez",ref:"Rm 12,9-16",v:"Alegrai-vos com os que se alegram e chorai com os que choram.",
exp:"São Paulo descreve como deve ser o amor entre os cristãos: sincero, fraterno, generoso. Entre os conselhos, pede: alegrar-se com quem se alegra e chorar com quem chora, vivendo em harmonia.",
med:["Um dos momentos mais difíceis para a tentante é ouvir o anúncio da gravidez de outra pessoa: uma amiga, uma irmã, uma colega. A alegria do outro pode doer muito, e isso não te faz uma pessoa má.","Você pode se alegrar pelo outro e, ao mesmo tempo, sentir a sua dor. As duas coisas cabem no coração. Leve as duas a Deus."],
perg:"Como eu me sinto quando alguém próximo anuncia uma gravidez? Eu levo isso a Deus?",
des:"Se houver alguém próximo grávida, reze hoje por essa pessoa e pelo bebê. Depois, reze por você, entregando a dor que esse anúncio provoca. Escreva os dois sentimentos aqui.",
ora:"Senhor, dá-me um coração que se alegra com a alegria dos outros, e acolhe a minha dor quando ela vier. Amém."},

{t:"Sem culpa",ref:"Rm 8,1-2.31-39",v:"Agora não há mais nenhuma condenação para os que estão em Cristo Jesus.",
exp:"São Paulo afirma que, em Cristo, não há mais condenação. E faz uma série de perguntas: se Deus está a nosso favor, quem estará contra nós? Quem nos separará do amor de Cristo? E responde: nada, nem a morte, nem a vida, nem o presente, nem o futuro.",
med:["Muitas tentantes carregam culpas: “Será que é castigo?”, “Será que fiz algo errado?”, “Será que esperei demais?”. Essas perguntas pesam e não vêm de Deus.","Deus não castiga com a infertilidade. Ele está a seu favor. E nada, absolutamente nada, pode te separar do amor dele."],
perg:"Que culpa eu carrego em relação à espera? Estou pronta para entregá-la a Deus?",
des:"Escreva a culpa que você carrega num papel. Leia em voz alta Rm 8,1 e depois rasgue o papel. Se precisar, leve isso também à Confissão.",
ora:"Senhor, não há condenação para quem está em Ti. Tira de mim toda culpa e faz-me descansar no teu amor. Amém."},

{t:"Descansar no colo de Deus",ref:"Sl 131(130)",v:"Fiz calar e repousar a minha alma, como criança desmamada no colo da mãe.",
exp:"É um salmo pequenino, de apenas três versos. O salmista diz que não busca coisas grandes demais para ele e que acalmou a alma como uma criança que repousa no colo da mãe. E convida o povo a esperar no Senhor.",
med:["Deus quer ser para você o que uma mãe é para o seu bebê: colo, segurança, descanso. Que imagem bonita para quem deseja tanto ser mãe.","Hoje, não precisa resolver nada nem entender nada. Só descansar no colo de Deus, como criança."],
perg:"O que eu preciso parar de tentar resolver para descansar em Deus?",
des:"Separe 10 minutos de silêncio hoje. Deite-se ou sente-se confortavelmente e repita devagar: “Repouso no teu colo, Senhor”. Só isso.",
ora:"Senhor, acalmo a minha alma no teu colo. Não busco entender tudo; só quero descansar em Ti. Amém."},

{t:"Maria, Mãe das mães",ref:"Jo 19,25-27",v:"Eis aí a tua mãe.",
exp:"Aos pés da cruz, Jesus entrega Maria ao discípulo amado como mãe, e o discípulo a Maria como filho. A partir daquela hora, o discípulo a leva para a sua casa. A Igreja vê nesse gesto Jesus entregando Maria como Mãe de todos nós.",
med:["Nossa Senhora é mãe de todas as mães e de todas as que desejam ser mães. Ela entende o seu coração de um jeito que ninguém entende.","Você não está sozinha. Tem uma Mãe no céu que reza por você e com você, e que sabe o valor de cada vida."],
perg:"Que pedido eu quero colocar hoje nas mãos de Nossa Senhora?",
des:"Reze hoje um terço (ou uma dezena) pedindo a intercessão de Nossa Senhora pelo seu desejo de ser mãe.",
ora:"Maria, Mãe das mães, acolhe o meu desejo e apresenta-o a Jesus. Ensina-me a confiar como tu confiaste. Amém."},

{t:"São Geraldo Majela",ref:"Tg 5,13-18",v:"A oração fervorosa do justo tem muito poder.",
exp:"São Tiago ensina a rezar em todas as situações. Ele lembra o profeta Elias, um homem como nós, que rezou com fervor para que não chovesse, e não choveu; depois rezou de novo, e o céu deu chuva e a terra deu fruto.",
med:["São Geraldo Majela, religioso redentorista italiano do século 18, é conhecido como padroeiro das mães e das gestantes. Muitas mulheres pedem a sua intercessão na espera de um filho.","A oração dos santos tem poder porque eles estão unidos a Deus. Não estamos sozinhas: temos amigos no céu rezando por nós."],
perg:"Eu costumo pedir a intercessão dos santos? Que santo me acompanha nesta espera?",
des:"Procure a oração de São Geraldo Majela e reze-a hoje. Se quiser, comece uma novena a ele.",
ora:"São Geraldo Majela, padroeiro das mães, intercede por mim junto de Deus. Que se cumpra em mim a vontade do Pai. Amém."},

{t:"Santa Gianna, mãe corajosa",ref:"1Jo 4,16-19",v:"No amor não há medo; ao contrário, o perfeito amor lança fora o medo.",
exp:"São João diz que Deus é amor e quem permanece no amor permanece em Deus. E afirma que no amor não existe medo, porque o amor perfeito expulsa o medo. Nós amamos porque Deus nos amou primeiro.",
med:["Santa Gianna Beretta Molla foi médica, esposa e mãe, na Itália do século 20. Ela amava muito a vida, a família e os filhos, e é exemplo de que a santidade se vive no dia a dia.","O medo costuma acompanhar a espera: medo de não conseguir, medo dos exames, medo do futuro. Santa Gianna ensina a viver o amor que expulsa o medo."],
perg:"Que medo tem acompanhado a minha espera?",
des:"Leia um pouco sobre a vida de Santa Gianna. Escreva aqui um medo seu e, ao lado, a frase: “No amor não há medo”.",
ora:"Santa Gianna, intercede por mim. Senhor, que o teu amor expulse todo medo do meu coração. Amém."},

{t:"Confiar sem entender",ref:"Pr 3,5-8",v:"Confia no Senhor de todo o coração e não te apoies na tua própria inteligência.",
exp:"O livro dos Provérbios aconselha a confiar em Deus com o coração inteiro, e não apenas no que conseguimos entender. Em todos os caminhos, reconhecer a Deus, e Ele endireitará as veredas.",
med:["Queremos entender: por que comigo? Por que agora? Até quando? Nem sempre teremos as respostas.","Confiar sem entender é a fé mais difícil e mais bonita. Não é desligar a razão, mas reconhecer que Deus vê mais longe do que nós."],
perg:"Que “por quê” eu ainda não consegui entregar a Deus?",
des:"Escreva todas as suas perguntas sem resposta numa folha. No final, escreva: “Senhor, eu confio em Ti, mesmo sem entender”.",
ora:"Senhor, eu não entendo tudo, mas confio em Ti de todo o coração. Endireita os meus caminhos. Amém."},

{t:"Eu sou mais do que esta espera",ref:"Ef 2,4-10",v:"Somos obra de Deus, criados em Cristo Jesus para as boas obras que Deus preparou de antemão.",
exp:"São Paulo lembra que Deus, rico em misericórdia, nos deu vida em Cristo, por pura graça, não por mérito nosso. E diz que somos obra de Deus, como uma obra-prima, criados para as boas obras que Ele mesmo preparou para nós.",
med:["O seu valor não está em ser mãe ou não. Você é obra-prima de Deus agora, do jeito que é. A espera faz parte da sua história, mas não é toda a sua história.","Deus preparou boas obras para você: no trabalho, no casamento, na família, na Igreja, na vida de outras pessoas. Hoje, olhe para elas também."],
perg:"Que dons e boas obras Deus colocou na minha vida além desta espera?",
des:"Liste cinco coisas boas que você é ou faz (qualidades, talentos, serviços). Faça hoje uma boa obra por alguém, como expressão de quem você é.",
ora:"Senhor, obrigada porque sou tua obra. Ajuda-me a ver o meu valor em Ti e a viver as boas obras que preparaste para mim. Amém."},

{t:"Gratidão pelo que já tenho",ref:"1Ts 5,16-18",v:"Dai graças em todas as circunstâncias, pois esta é a vontade de Deus a vosso respeito.",
exp:"No final da sua carta, São Paulo dá três conselhos curtos à comunidade: estejam sempre alegres, rezem sem cessar e deem graças em tudo. É a vontade de Deus em Cristo Jesus.",
med:["A gratidão não apaga o desejo, mas abre os olhos para o que Deus já deu: um esposo, uma casa, a saúde, amigas, a fé. Quando o desejo ocupa todo o olhar, deixamos de ver os presentes ao redor.","Paulo não diz “dai graças por todas as circunstâncias”, mas “em todas”. Mesmo no meio da espera, há motivos para agradecer."],
perg:"Que presentes de Deus eu tenho deixado de ver por causa da espera?",
des:"Escreva hoje uma lista de 10 coisas pelas quais você é grata. Leia em voz alta, como oração.",
ora:"Senhor, obrigada por tudo o que já me deste. Abre os meus olhos para os teus presentes, mesmo enquanto espero. Amém."},

{t:"Fé nos exames e consultas",ref:"Sl 121(120)",v:"O meu socorro vem do Senhor, que fez o céu e a terra.",
exp:"Este salmo era rezado pelos peregrinos que subiam a Jerusalém. Olhando para os montes, perguntam: de onde virá o socorro? E respondem: do Senhor, que não dorme nem cochila, que guarda a nossa entrada e a nossa saída.",
med:["Consultas, exames, tratamentos e esperas por resultados podem ser cansativos e cheios de ansiedade. A fé e a medicina não competem: Deus também age pelas mãos dos médicos.","Quando for a uma consulta ou exame, lembre: o seu socorro vem do Senhor. Ele guarda a sua entrada e a sua saída."],
perg:"Como eu me sinto diante de consultas e exames? Eu os entrego a Deus?",
des:"Reze pelos médicos e profissionais que acompanham vocês. Antes da próxima consulta ou exame, reze o Salmo 121.",
ora:"Senhor, o meu socorro vem de Ti. Guia os médicos, acalma o meu coração e guarda a minha entrada e a minha saída. Amém."},

{t:"Esperança que não decepciona",ref:"Rm 5,1-5",v:"A esperança não decepciona, porque o amor de Deus foi derramado em nossos corações pelo Espírito Santo.",
exp:"São Paulo explica que, por Jesus, temos paz com Deus. E diz algo surpreendente: as tribulações produzem perseverança, a perseverança produz uma fé provada, e a fé provada produz esperança. E essa esperança não decepciona, porque está apoiada no amor de Deus.",
med:["A esperança cristã não é apenas desejar que algo aconteça. É a certeza de que Deus nos ama e cuida de nós, aconteça o que acontecer.","Por isso ela não decepciona: está apoiada no amor de Deus, e não nos resultados. Peça hoje essa esperança mais profunda."],
perg:"Onde está apoiada a minha esperança: no resultado ou no amor de Deus?",
des:"Escreva uma oração pedindo a Deus uma esperança que não dependa dos resultados. Reze-a hoje à noite com o seu esposo.",
ora:"Deus da esperança, enche-me de alegria e paz na fé. Que a minha esperança esteja apoiada no teu amor. Amém."},

{t:"Deus não me esquece",ref:"Is 49,14-16",v:"Pode uma mãe se esquecer do seu bebê? Ainda que ela se esquecesse, eu não me esqueceria de ti.",
exp:"O povo de Israel, no exílio, dizia: “O Senhor me abandonou, o Senhor se esqueceu de mim”. E Deus responde com uma imagem de mãe: pode uma mulher esquecer o filho que amamenta? Mesmo que ela esquecesse, Deus não esquece. “Eis que te gravei na palma das minhas mãos.”",
med:["O seu coração de mãe já existe. Você já ama alguém que ainda não chegou. Deus, que te deu esse coração, também tem um coração de mãe por você.","O seu nome está gravado na palma da mão de Deus. Ele não esquece você, nem o seu desejo."],
perg:"Como eu me sinto ao saber que o meu nome está gravado nas mãos de Deus?",
des:"Escreva o seu nome na palma da sua mão (com caneta) e deixe ali durante o dia, lembrando que Deus fez o mesmo com você.",
ora:"Senhor, Tu não te esqueces de mim. Gravaste o meu nome nas tuas mãos. Consola o meu coração de mãe. Amém."},

{t:"O sim de Maria",ref:"Lc 1,26-38",v:"Eis aqui a serva do Senhor; faça-se em mim segundo a tua palavra.",
exp:"O anjo Gabriel anuncia a Maria que ela será a Mãe do Filho de Deus. Maria faz uma pergunta sincera: “Como vai acontecer isso?”. O anjo explica e lembra que Isabel, chamada estéril, está grávida, porque para Deus nada é impossível. E Maria diz o seu sim.",
med:["O sim de Maria não foi resignação, mas confiança ativa. Ela perguntou, entendeu o que pôde e se entregou por inteiro.","Abrir-se à vontade de Deus é dizer: “Eu quero muito, Senhor, mas quero ainda mais o que Tu queres para mim”. É uma oração difícil e libertadora."],
perg:"Eu consigo rezar “faça-se a tua vontade” sobre o meu desejo de ser mãe?",
des:"Reze hoje o Angelus (ou três Ave-Marias), pedindo a Maria um coração aberto à vontade de Deus.",
ora:"Maria, ensina-me o teu sim. Eu quero muito este filho, Senhor, mas quero ainda mais a tua vontade. Faça-se em mim. Amém."},

{t:"O filho que Deus já conhece",ref:"Jr 1,4-5",v:"Antes de te formar no ventre materno, eu te conheci.",
exp:"Deus chama o jovem Jeremias para ser profeta e diz que já o conhecia antes de ele ser formado no ventre da mãe. Antes de nascer, Jeremias já tinha um lugar no coração e no plano de Deus.",
med:["Deus já conhece os filhos que virão para a sua família, seja pela gestação, seja pela adoção, seja como filhos espirituais. Você pode rezar por eles desde já.","Rezar pelo filho que ainda não veio é uma forma de amar desde agora. A maternidade começa no coração."],
perg:"O que eu já gostaria de dizer ao filho que ainda não veio?",
des:"Escreva uma carta para o filho que você espera. Conte do seu amor, das suas orações e do quanto ele é esperado. Guarde com carinho.",
ora:"Senhor, Tu já conheces os filhos que virão para a nossa família. Abençoa-os desde já e prepara o nosso coração para recebê-los. Amém."},

{t:"Rezar por outras tentantes",ref:"Gl 6,1-2.9-10",v:"Carregai os fardos uns dos outros, e assim cumprireis a lei de Cristo.",
exp:"São Paulo pede que os cristãos ajudem uns aos outros a carregar os pesos da vida. E encoraja: não nos cansemos de fazer o bem, porque no tempo certo colheremos, se não desanimarmos.",
med:["Muitas mulheres vivem a mesma espera, muitas vezes em silêncio. Rezar por elas tira o foco da nossa dor e nos une numa grande corrente de oração.","Quem passou pela espera entende como ninguém a dor de outra tentante. Talvez Deus queira usar a sua história para consolar alguém."],
perg:"Conheço outras mulheres que vivem a mesma espera? Como posso apoiá-las?",
des:"Reze hoje, pelo nome, por outras tentantes que você conhece (ou por todas as que esperam, se não conhecer). Se for o caso, mande uma mensagem de carinho para uma delas.",
ora:"Senhor, eu te apresento todas as mulheres que esperam um filho. Consola-as, fortalece-as e realiza os seus desejos segundo a tua vontade. Amém."},

{t:"A paz que guarda o coração",ref:"Fl 4,4-7",v:"A paz de Deus, que ultrapassa todo entendimento, guardará os vossos corações e os vossos pensamentos em Cristo Jesus.",
exp:"São Paulo pede que os cristãos se alegrem sempre no Senhor e não se inquietem com nada. Em vez disso, que apresentem tudo a Deus em oração, com ação de graças. E promete: a paz de Deus vai guardar o coração e os pensamentos, como um soldado guarda uma cidade.",
med:["A paz de Deus não depende de entender tudo nem de ter tudo resolvido. Ela ultrapassa o entendimento: vem mesmo quando a razão não encontra motivos.","Peça hoje essa paz que guarda. Não precisa sentir; basta pedir e deixar Deus agir."],

ora:"Senhor, guarda o meu coração e os meus pensamentos com a tua paz, que ultrapassa todo entendimento. Amém."},

{t:"Renovar a entrega",ref:"Sl 62(61),2-9",v:"Só em Deus a minha alma repousa; dele vem a minha salvação.",
